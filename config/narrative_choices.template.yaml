# Narrative choices — your Shepard, your canon.
#
# Copy this file to config/narrative_choices.yaml (the pipeline does that for
# you on /me-build-timeline) and fill in `answer` for whatever you remember.
# For questions with an `options` list, `answer` MUST be one of those strings.
# For questions with `options: []`, `answer` is free text.
# `detail` is always free text — "why / how it went" — the narrator may use it.
# Leave anything you don't care about blank; unanswered = default canon.

shepard:
  - id: background
    prompt: Shepard's pre-service history.
    options: [Spacer, Colonist, Earthborn]
    answer: ""
    detail: ""
  - id: profile
    prompt: Shepard's psychological profile / reputation.
    options: [War Hero, Sole Survivor, Ruthless]
    answer: ""
    detail: ""
  - id: class
    prompt: Shepard's combat class.
    options: [Soldier, Engineer, Adept, Infiltrator, Sentinel, Vanguard]
    answer: ""
    detail: ""
  - id: gender
    prompt: Shepard's gender / pronouns.
    options: []
    answer: ""
    detail: ""
  - id: romance
    prompt: Shepard's romance(s) across the trilogy.
    options: []
    answer: ""
    detail: ""

