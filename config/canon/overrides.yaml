# Overrides — canon that beats the corpus.
#
# User-owned. Agents read this and never write to it.
#
# An override is how a divergence from the wiki is made *deliberate*. Without one,
# a shorthand answer in `choices.yaml` only settles WHICH branch happened; the corpus
# still owns the staging. An entry here settles both.
#
#   kind: au         — a deliberate divergence from published canon.
#   kind: correction — the corpus is wrong or lossy and this fixes it.
#
# Fields:
#   id         — kebab-case, unique. Referenced from resolved.yaml.
#   scope      — entities, scene ids or event ids this governs. Empty = applies everywhere.
#   statement  — what is true, in prose. This is what reaches the narrator.
#   overrides  — what it beats, named so a reader can check the conflict.
#   added      — ISO date.

overrides:
  - id: shepard-born-on-the-normandy
    kind: au
    scope: [Shepard]
    statement: >
      Shepard was born in Normandie in France, parentless, ran with a gang
      as a child and had a drug problem before Anderson pulled him into N7.
    overrides: "Earthborn background as the wiki describes it"
    added: 2026-09-07
  - id: jack-n7-tattoo
    kind: au
    scope: [Jack]
    statement: >
      Jack has an N7 tattoo on her ass. After the Grissom Academy escape, Prangley
      asked her about her tattoos in general, and she mentioned that one specifically
      just to watch him choke on the question.
    overrides: "no specific tattoo design or location established in the corpus"
    added: 2026-09-11
  - id: crew-never-knew-the-choice
    kind: correction
    scope: [london-conduit-assault]
    statement: >
      Nobody in the crew knows there was a choice at the end, let alone which one
      Shepard made. From the moment Shepard parted from Anderson until the Crucible's
      wave of energy, nobody saw anything: no one knows where he went, who or what
      he met, or what happened to him.
    overrides: "event summary narrates the Catalyst and the Destroy/Control/Synthesis/Refuse choice from the player's view"
    added: 2026-09-15
  - id: final-push-squad-evacuated
    kind: correction
    scope: [london-conduit-assault]
    statement: >
      Tali and Garrus were Shepard's squad on the final run to the conduit. Before
      he went through, Shepard called the Normandy down to evacuate them; he and
      Anderson crossed without them.
    overrides: "corpus does not name the final squad or their evacuation"
    added: 2026-09-15
  - id: shepard-death-unconfirmed
    kind: au
    scope: [Shepard, london-conduit-assault]
    statement: >
      In the first weeks after the war, Shepard's death is not confirmed to the crew.
      Anderson never saw him on the station. The Normandy crash-landed, there's been no
      word, and the crew takes that silence to mean he's dead: there's no body and no
      report. After a few months, Shepard is held to be dead by everyone, the crew
      included: the rubble has been cleared, what the Crucible did is better understood,
      and there was nowhere on the station he could have escaped to. There is still no
      body, so no burial. Shepard's lover puts his name on the Normandy's memorial wall,
      or chooses not to, and the crew holds a night of remembrance for him: to celebrate
      the man he was, to mourn him, or both.
    overrides: "shepard_fate = Dead (synthesis) stated as settled fact"
    added: 2026-09-15
    amended: 2026-09-18
  - id: aria-hanar-father
    kind: au
    scope: [Aria T'Loak]
    statement: >
      Aria's father was a hanar.
    overrides: "Aria's parentage is not established in the corpus"
    added: 2026-09-18
  - id: shepard-name-from-the-reds
    kind: au
    scope: [Shepard, Tenth Street Reds]
    statement: >
      Shepard never had a first name. "Shepard" started as a mocking nickname
      the Tenth Street Reds gave him for his knack with people. He only took a
      surname because Alliance enlistment required one, and he kept that one as
      a screw-you to the Reds.
    overrides: "Earthborn Shepard as the wiki describes it (first name player-chosen, surname by birth)"
    added: 2026-09-18
  - id: shepard-drinks-and-dances
    kind: au
    scope: [Shepard, Jack]
    statement: >
      Shepard got clean of drugs but never stopped loving alcohol and parties.
      Jack thinks the good-guy act is just that, an act: in her telling he has
      turned up at every bar in the galaxy and calls each one his favorite, and
      he drinks and dances every time. He even did it on Omega, where somebody
      could have poisoned him. She calls him a drunk and a dumbass, and she's fond of him.
    overrides: "corpus portrays Shepard's drinking and dancing only in scattered scenes"
    added: 2026-09-18
  - id: jack-teaches-shepard-to-dance
    kind: au
    scope: [Jack, Shepard]
    statement: >
      Jack is teaching Shepard to loosen up when he dances, and she has dragged
      him into a mosh pit.
    overrides: "no such relationship beat in the corpus"
    added: 2026-09-18
  - id: kasumi-jack-poetry-jam
    kind: au
    scope: [Kasumi, Jack, Grunt]
    statement: >
      Kasumi and Jack hold poetry jams in secret. Grunt sometimes turns up to
      read excerpts from Hemingway.
    overrides: "no such activity in the corpus"
    added: 2026-09-18
  - id: joker-weeb-krogan-waifu
    kind: au
    scope: [Joker]
    statement: >
      Joker is a weeb. As a joke, the crew gave him a body pillow printed with
      a krogan woman.
    overrides: "no such detail in the corpus"
    added: 2026-09-18
  - id: joker-edi-polyamorous
    kind: au
    scope: [Joker, EDI]
    statement: >
      Joker and EDI are technically polyamorous, but neither of them looks for
      other partners.
    overrides: "corpus presents their relationship as simply a couple"
    added: 2026-09-18
  - id: mordin-acts-for-kitt
    kind: au
    scope: [Mordin, Francis Kitt]
    statement: >
      Mordin performs in Francis Kitt's stage productions.
    overrides: "no such connection in the corpus"
    added: 2026-09-18
  - id: kaidan-vegetarian
    kind: au
    scope: [Kaidan]
    statement: >
      Kaidan is vegetarian.
    overrides: "no diet established in the corpus"
    added: 2026-09-18
