# Overrides — canon that beats the corpus.
#
# User-owned. Agents read this and never write to it.
#
# An override is how a divergence from the wiki is made *deliberate*. Without one,
# a shorthand answer in `choices.yaml` only settles WHICH branch happened; the corpus
# still owns the staging. An entry here settles both.
#
#   kind: au         — a deliberate divergence from published canon.
#   kind: correction — the corpus is wrong or lossy and this fixes it.
#
# Fields:
#   id         — kebab-case, unique. Referenced from resolved.yaml.
#   scope      — entities, scene ids or event ids this governs. Empty = applies everywhere.
#   statement  — what is true, in prose. This is what reaches the narrator.
#   overrides  — what it beats, named so a reader can check the conflict.
#   added      — ISO date.

overrides:
  - id: shepard-born-on-the-normandy
    kind: au
    scope: [Shepard]
    statement: >
      Shepard was born in Normandie in France, parentless, ran with a gang
      as a child and had a drug problem before Anderson pulled him into N7.
    overrides: "Earthborn background as the wiki describes it"
    added: 2026-09-07
  - id: jack-n7-tattoo
    kind: au
    scope: [Jack]
    statement: >
      Jack has an N7 tattoo on her ass. After the Grissom Academy escape, Prangley
      asked her about her tattoos in general, and she mentioned that one specifically
      just to watch him choke on the question.
    overrides: "no specific tattoo design or location established in the corpus"
    added: 2026-09-11
  - id: crew-never-knew-the-choice
    kind: correction
    scope: [london-conduit-assault]
    statement: >
      Nobody in the crew knows there was a choice at the end, let alone which one
      Shepard made. From the moment Shepard parted from Anderson until the Crucible's
      wave of energy, nobody saw anything: no one knows where he went, who or what
      he met, or what happened to him.
    overrides: "event summary narrates the Catalyst and the Destroy/Control/Synthesis/Refuse choice from the player's view"
    added: 2026-09-15
  - id: final-push-squad-evacuated
    kind: correction
    scope: [london-conduit-assault]
    statement: >
      Tali and Garrus were Shepard's squad on the final run to the conduit. Before
      he went through, Shepard called the Normandy down to evacuate them; he and
      Anderson crossed without them.
    overrides: "corpus does not name the final squad or their evacuation"
    added: 2026-09-15
  - id: shepard-death-unconfirmed
    kind: au
    scope: [Shepard, london-conduit-assault]
    statement: >
      Shepard's death is not confirmed to the crew. Anderson never saw him on the
      station. The Normandy crash-landed weeks ago, there's been no word, and the
      crew takes that silence to mean he's dead: there's no body and no report.
    overrides: "shepard_fate = Dead (synthesis) stated as settled fact"
    added: 2026-09-15
