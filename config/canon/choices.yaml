  - id: final_choice
    prompt: The final choice at the Crucible.
    options: [Destroy, Control, Synthesis, Refuse]
    answer: "Synthesis"
    detail: "Destroy means genocide for synthetics. Control means having absolute powers for basically eternity, and power corrupts all, I'm not above it. Refuse is stupid. Synthesis is the lesser evil of those choices."
