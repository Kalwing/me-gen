  - id: citadel_dlc
    prompt: The Citadel DLC outcome (the party, the clone, who showed up).
    options: []
    answer: "Calm, then energic mood. Everyone showed up. The clone died, by letting go when I tried to save him. Brooks didn't shoot me. Did all the missions. Garrus had its date. Joker told his story to impress people, and I lied with him. I let Garrus win the sniper contest. I helped Traynor win at space chess. Won against james at pull-ups. When doing a Jack romance, she tattoos my back ('to tell the galaxy I belong to her' and so she can find me under the rubbles)"
    detail: ""
  - id: thessia
    prompt: Thessia - the mission for the Prothean VI and Kai Leng.
    options: []
    answer: "Brought Javik. Would have easily killed Kai Leng if not for plot armor."
