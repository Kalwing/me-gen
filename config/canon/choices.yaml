# Narrative choices — your Shepard, your canon.
#
# Fill in `answer` for whatever you remember of your playthrough.
# For questions with an `options` list, either set `answer` to one of those
# strings, or narrow `options` to the single value you picked — both count as
# answered. For `options: []`, `answer` is free text.
# `detail` is always free text — "why / how it went" — the narrator may use it.
# Leave anything you don't care about blank; unanswered = default canon.

shepard:
  - id: background
    prompt: Shepard's pre-service history.
    options: [Earthborn]
    answer: ""
    detail: "Like to think that I was born in Normandy, without parents. Joined the gang at a young age, had drugs issues, but Anderson got me out and put me in the N7 program."
  - id: profile
    prompt: Shepard's psychological profile / reputation.
    options: [Sole Survivor]
    answer: ""
    detail: ""
  - id: class
    prompt: Shepard's combat class.
    options: [Vanguard]
    answer: ""
    detail: "Uses Biotic charges and shotguns extensively to kill everyone in sight"
  - id: gender
    prompt: Shepard's gender / pronouns.
    options: []
    answer: "Male"
    detail: ""
  - id: romance
    prompt: Shepard's romance(s) across the trilogy.
    options: []
    answer: "Jack, Tali, Kaidan, Thane"
    detail: "Depends on the run. But I stay faithful all trilogy long."
  - id: first_name
    prompt: Shepard's first name.
    options: []
    answer: "Thomas"
    detail: ""
  - id: alignment
    prompt: Shepard's overall morality lean across the trilogy.
    options: [Paragon, Renegade, mixed]
    answer: "mixed"
    detail: "Paragon, except against oppressors"

