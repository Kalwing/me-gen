me2:
  - id: collector_base
    prompt: The Collector Base after the Suicide Mission.
    options: [destroyed]
    answer: ""
    detail: "Would have kept it if it wasn't given to Cerberus. The technology in there would have given us an edge if the council had it. But not to a pro-human terrorist group that already did experiments with reaper tech on peoples (see ME1)"
  - id: zaeed_loyalty
