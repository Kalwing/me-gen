scene_id: tuchanka-shaman-after-rite
title: Shepard and the Shaman After Grunt's Rite
kind: banter
game: Mass Effect 2
when: "2185, Tuchanka, Urdnot Camp, after Grunt completes the Rite of Passage"
where: "the Urdnot Camp on Tuchanka"
participants: [Shepard, Shaman]
heard_by: [Clan Urdnot]
beats:
  - text: >
      After Grunt completed the Rite of Passage and proved himself to Clan Urdnot,
      Shepard returned to the camp and could speak with the Shaman. The Shaman reflected
      on his own role and the rites it required. He admitted he went through many rites
      to become shaman, including giving up his own name. He claimed the rites he
      underwent were so physically and mentally torturous that they made him wish he were
      dead, and that other rites must be performed every dawn and dusk. If Grunt was
      present in the party, he commented that the Shaman's job was terrible, and the
      Shaman agreed.
    source_chunks: [shaman_002]
  - text: >
      Shepard could also return to speak with the Shaman again and share stories from
      Shepard's past battles against worthy enemies, including how the Commander stopped
      Saren and also fought a Reaper invading the Citadel. The Shaman was apparently
      aware of and respected the combat prowess of the Spectres.
    source_chunks: [shaman_002]
source_chunks: [shaman_002]
