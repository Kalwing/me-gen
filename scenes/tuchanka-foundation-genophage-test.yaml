scene_id: tuchanka-foundation-genophage-test
title: Testing the Genophage Strain
kind: mission-aside
game: Mass Effect
when: during the genophage modification research campaign, before 2185
where: Tuchanka, deployment zone
participants: [Mordin Solus, Maelon Heplorn, Captain Chaleen, STG operatives, hostile krogan, female krogan]
heard_by: [STG]
requires: []
beats:
  - text: >
      Mordin and Maelon, with Captain Chaleen's STG team, are deployed to Tuchanka to test
      the modified genophage strain. Maelon is tasked with carrying the heavy dispersal unit
      to the deployment zone. Mordin belittles Maelon's dexterity and charm, but Maelon
      proves surprisingly stronger and more capable than expected.
    source_chunks: [maelon-heplorn_002]
  - text: >
      When the team discovers the deployment zone contains hostile krogan, Maelon suggests
      setting up the device where they are hiding. Mordin insists on proper placement.
      They are discovered moments later and fired upon, barely escaping.
    source_chunks: [maelon-heplorn_002]
  - text: >
      Captain Chaleen orders the team to fall back to the shuttle, but Mordin announces a
      change of plans. He orders an explosive diversion and instructs Maelon to help haul
      the device to its intended location.
    source_chunks: [maelon-heplorn_002]
  - text: >
      A hammer-wielding krogan attacks Maelon, but the salarian dispatches the brute easily,
      surprising himself at his own capability. Maelon continues to press for following
      Chaleen's orders, but Mordin insists that risks are necessary in science, while failure
      is not.
    source_chunks: [maelon-heplorn_002]
  - text: >
      At the deployment site, Maelon activates the device and ensures its safety as a female
      krogan arrives to confront them. Mordin's explosive diversion detonates over the three,
      burying them in rubble and killing the female krogan.
    source_chunks: [maelon-heplorn_002]
  - text: >
      Captain Chaleen helps Maelon to his feet, and they uncover Mordin from the rubble.
      Maelon bandages Mordin's wounds. When Maelon asks about the female krogan, Mordin
      notes she is dead from the blast. Maelon reflects that she seemed more reasonable than
      expected and asks Mordin if their work is right.
    source_chunks: [maelon-heplorn_002]
  - text: >
      Mordin reassures Maelon about the dire galactic consequences of the krogan freed from
      the genophage. He acknowledges Maelon's point that he does not know if krogan would be
      reasonable in that scenario, but maintains that the risk of freeing them is too high.
      Maelon counters that he thinks risk is necessary in science.
    source_chunks: [maelon-heplorn_002]
related_scenes: [tuchanka-mordin-and-maelon]
related_events: []
