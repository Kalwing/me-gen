scene_id: minuteman-station-illusive-man-assemble-the-team
title: The Illusive Man Sets Shepard to Assembling a Team
kind: mission-aside
game: Mass Effect 2
when: 2185, right after the field investigation on Freedom's Progress
where: a Cerberus station, in the holo-comm room, then the hangar
participants: [Shepard, the Illusive Man, Miranda Lawson, Jacob Taylor, Jeff "Joker" Moreau]
heard_by: [Normandy crew]
beats:
  - text: >
      Back from Freedom's Progress with Miranda and Jacob, Shepard meets the Illusive Man by
      holo-comm. The team's evidence that the Collectors are behind the mass abductions of human
      colonies confirms his existing suspicions, and Shepard - whatever the misgivings about
      working with Cerberus - agrees the effort against this threat is genuine.
    source_chunks: [stop-the-collectors_004]
  - text: >
      The Illusive Man says most of Shepard's old crew have scattered and would not work with
      Cerberus, and hands over dossiers for a new team - Archangel, the Convict, the Professor,
      the Warlord, plus the Veteran and the Master Thief where their DLC applies. Whether to
      involve the Citadel Council is left to Shepard's judgment. Miranda and Jacob will continue
      under Shepard's command.
    source_chunks: [stop-the-collectors_004]
  - text: >
      Ending the meeting, the Illusive Man produces a first crew member Shepard already knows
      well - Joker - who leads Shepard to the second surprise: the rebuilt Normandy SR-2.
    source_chunks: [stop-the-collectors_004]
related_scenes: [freedom-s-progress-veetor-and-tali, collector-ship-normandy-debrief]
source_chunks: [stop-the-collectors_004]
