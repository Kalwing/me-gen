scene_id: bekenstein-hock-kills-okuda
title: Hock Takes Keiji's Graybox
kind: mission-aside
game: "Mass Effect: Foundation"
when: before 2185, during a botched heist
where: Donovan Hock's estate on Bekenstein
participants: [Donovan Hock, Keiji Okuda]
private_to: [Donovan Hock, Keiji Okuda]
heard_by: [Kasumi Goto]
beats:
  - text: >
      Two thieves break into Hock's property on Bekenstein and hit heavier resistance
      than expected, forcing them to split up.
    source_chunks: [donovan-hock_002]
  - text: >
      Hock, on his estate, personally kills one of the thieves, Keiji Okuda.
    source_chunks: [donovan-hock_002, donovan-hock_003]
  - text: >
      Hock stabs a device into Okuda's head to forcibly extract his graybox, wanting the
      secrets inside — one that would implicate the Systems Alliance. He remarks that he
      has never stolen a person's memories before and tells the dying man to consider it
      an honour.
    source_chunks: [donovan-hock_002, donovan-hock_003]
related_scenes: [bekenstein-kasumi-and-the-graybox]
related_events: [keiji-okuda-death-bekenstein]
source_chunks: [donovan-hock_002, donovan-hock_003]
