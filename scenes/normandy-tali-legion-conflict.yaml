scene_id: normandy-tali-legion-conflict
title: Tali Catches Legion Scanning Her Omni-Tool
kind: argument
game: Mass Effect 2
when: 2185, after both Tali's and Legion's loyalty missions
where: aboard the Normandy SR-2

participants: [Shepard, Tali'Zorah vas Normandy, Legion]
private_to: []
heard_by: [Normandy crew]

requires:
  - legion_loyalty: any
  - tali_trial: any

beats:
  - text: >
      Tali catches Legion scanning her omni-tool for information on the Flotilla to send back
      to the geth.
    source_chunks: [tali-zorah-nar-rayya_006]
  - text: >
      Legion's position is that it is warning the geth about a real threat — the quarians'
      tests, and their plans to attack.
    source_chunks: [tali-zorah-nar-rayya_006]
  - text: >
      Handled impartially, with enough Paragon or Renegade points, Tali thanks Legion for
      agreeing not to transmit, and offers it unclassified Flotilla data instead; both stay
      loyal.
    source_chunks: [tali-zorah-nar-rayya_006, legion-a-house-divided_011]
    conditional: {tali_legion_conflict: resolved_impartially}
    choice: resolved without picking a side
  - text: >
      Without enough points, Shepard has to side with one of them, telling Legion to stop its
      transmission or letting it continue; whichever one is not sided with loses trust in the
      Commander and its loyalty — Legion's loyalty can still be salvaged afterward by lying
      to it (with a high Renegade score) that the "lie" about stopping the transmission was
      what kept Tali happy, which Legion accepts as "a logical decision."
    source_chunks: [legion-a-house-divided_011]
    conditional: {tali_legion_conflict: sided_with_one}
    choice: sided with one — the other loses loyalty

related_scenes: [flotilla-tali-treason-trial]
related_events: []
source_chunks: [tali-zorah-nar-rayya_006, legion-a-house-divided_011]
