scene_id: citadel-korlack-anderson-complaint
title: Korlack and Orinia Seek Anderson at the Human Embassy
kind: banter
game: Mass Effect
when: "2186, Citadel, during trade negotiations (Mass Effect: Retribution)"
where: human embassy, Citadel

participants: [Din Korlack, David Anderson, Orinia]
private_to: [Din Korlack, David Anderson, Orinia]

requires: []

beats:
  - text: >
      During high-level trade negotiations involving the Systems Alliance, the
      Turian Hierarchy, the Vol Protectorate, and the Courts of Dekuuna, Ambassador
      Din Korlack is found to be rude and irritating to other participants,
      including David Anderson. The negotiations proceed amid friction between
      the volus ambassador and the other diplomats.
    source_chunks: [din-korlack_003]
  - text: >
      During a break in negotiations, Din Korlack and turian Ambassador Orinia
      seek out David Anderson at the human embassy. Korlack claims he needs to
      file a formal complaint against one of Anderson's aides for a remark that
      offended him.
    source_chunks: [din-korlack_003]
  - text: >
      David Anderson is away on lunch at the time. Turian Ambassador Orinia
      manages to talk Korlack down from pursuing the complaint further, preventing
      a diplomatic incident.
    source_chunks: [din-korlack_003]

