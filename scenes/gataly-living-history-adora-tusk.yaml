scene_id: gataly-living-history-adora-tusk
title: Heated Debate over Krogan Reparations at Living History Lectures
kind: argument
game: Mass Effect
when: 2185, mid-October
where: the Royal Center for Education and the Arts on Gataly, during lectures on the Krogan Rebellions
participants: [Matriarch Adora Ellja, Warlord Ravanor Tusk, Koni Sollia, students, historians]
heard_by: [galactic media, broader academic community]
beats:
  - text: >
      A two-week lecture series on the Krogan Rebellions opened at the Royal Center for
      Education and the Arts on Gataly, part of the "Living History" initiative to chronicle
      both sides of the war. Several krogan warlords from Tuchanka attended, with focus on
      the enslavement of occupied worlds by krogan forces and possible reparations.
    source_chunks: [cerberus-daily-news-october-2010_017]
  - text: >
      Former asari commando Matriarch Adora Ellja recounted her experiences during the
      Rebellions for audiences attending the lecture series, giving haunting descriptions
      of raiding slave camps on krogan-occupied worlds.
    source_chunks: [cerberus-daily-news-october-2010_018]
  - text: >
      During the question session following Ellja's lecture, Warlord Ravanor Tusk asked
      if the asari would pay reparations for krogan slaves used as forced labor during the
      last days of the war. When Matriarch Ellja denied any krogan had been enslaved, Tusk's
      response was sharp: "You're either a fool, a liar, or senile."
    source_chunks: [cerberus-daily-news-october-2010_018]
  - text: >
      The rest of the evening turned into a heated argument between Warlord Tusk, Matriarch
      Ellja, and students and historians attending the lecture.
    source_chunks: [cerberus-daily-news-october-2010_018]
  - text: >
      The lecture was extended as the question of Krogan Rebellion slave reparations
      continued to be fiercely debated by academics, legal experts, and the last three
      asari veterans of the war. Asari historian Koni Sollia conceded that a small number
      of asari commando groups had indeed used krogan prisoners as forced labor during the
      Rebellions—fewer than a hundred enslaved, with the responsible commandos stripped of
      rank and severely punished. Sollia noted that while krogan had enslaved tens of
      thousands of asari, krogan had made no reparations offers.
    source_chunks: [cerberus-daily-news-october-2010_019]
related_events: []
