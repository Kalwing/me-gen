scene_id: illium-nos-astra-thax-vorak
title: A Krogan Businessman Comes Calling on Illium
kind: banter
game: Mass Effect 2
when: 2185, on Illium after recruiting Samara
where: Nos Astra, the central district
participants: [Shepard, Thax Vorak]
private_to: [Shepard, Thax Vorak]
heard_by: []
beats:
  - text: >
      After recruiting Samara and returning to Nos Astra, an urbane krogan immediately approaches
      Shepard. He introduces himself as Mr. Thax and asks pointedly whether Shepard is responsible
      for sending a shipping note to him. The note detailed a skimming operation—an asari transport
      operator named Eria had been diverting his cargo, and Shepard found and uploaded the evidence
      to him from a crime scene terminal. Shepard gets 2 Paragon points for directly admitting to
      sending the message or 2 Renegade points for being evasive about it. Either way, Shepard
      automatically gains an additional 5 Renegade points—a reminder that bringing down a thief,
      even one stealing from a krogan businessman, carries moral complexity.
    source_chunks: [illium-the-justicar-stolen-goods-found_003]
