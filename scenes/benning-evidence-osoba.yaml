scene_id: benning-evidence-osoba
title: Finding Out What Happened to Bilal Osoba
kind: mission-aside
game: Mass Effect 3
when: 2186, Citadel and Benning, during the Reaper War
where: Citadel Embassies; Benning; Purgatory nightclub

participants: [Shepard, Dominic Osoba]
private_to: []
heard_by: [Normandy crew]

beats:
  - text: >
      On the Citadel Embassies, Ambassador Dominic Osoba can be overheard trying to find out
      what happened to his son, lost during a mission on Benning; the son's squadmates came
      back without him and will not say why. Shepard offers to help.
    source_chunks: [benning-evidence_002, benning-evidence_001]
  - text: >
      On Benning, during a Hackett-sanctioned operation, Shepard finds a dog tag on the ground
      near a support column by building 22 — easy to miss, with no prompt marking it as
      significant.
    source_chunks: [benning-evidence_001]
  - text: >
      In the Purgatory nightclub, before Shepard has delivered the tag, a group of drunk
      Alliance soldiers can be overheard toasting a fallen squadmate's heroics without naming
      him; Dominic Osoba later notes that overhearing them is not, on its own, evidence of
      what happened to his son.
    source_chunks: [benning-evidence_004]
  - text: >
      Shepard brings the dog tag to Dominic Osoba, confirming that his son, Bilal Osoba, died
      on Benning and giving the ambassador closure. Afterward, the same soldiers at Purgatory
      raise their glasses to Bilal Osoba by name.
    source_chunks: [benning-evidence_004, benning-evidence_001]

related_events: [benning-evidence]
source_chunks: [benning-evidence_002, benning-evidence_004, benning-evidence_001]
