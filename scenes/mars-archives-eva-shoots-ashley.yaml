scene_id: mars-archives-eva-shoots-ashley
title: Dr. Eva Guns Down the Virmire Survivor on Mars
kind: mission-aside
game: Mass Effect 3
when: 2186, the Prothean Archives mission on Mars, during the Reaper invasion of Earth
where: the Prothean dig site on Mars

participants: [Shepard, Ashley Williams, Liara T'Soni]
private_to: []
heard_by: [Normandy crew]

requires:
  - virmire_survivor: Ashley

beats:
  - text: >
      After evacuating Shepard from Earth, Ashley — now a Lieutenant Commander — joins
      Shepard and Liara on a mission to Mars to recover Prothean data Liara believes could
      help defeat the Reapers. Ashley still mistrusts Shepard's Cerberus ties, and
      discovering Cerberus troops holding the dig site, and that Cerberus has processed
      its own people, deepens her worry about what was done to Shepard.
    source_chunks: [ashley-williams_010]
  - text: >
      Near the end of the mission, chasing down the Cerberus mole Dr. Eva, Ashley is
      critically wounded when the Illusive Man orders Eva to "finish her." Shepard
      disables Eva and flees Mars with Ashley, taking her to Huerta Memorial Hospital on
      the Citadel.
    source_chunks: [ashley-williams_010]

