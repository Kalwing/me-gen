scene_id: eden-prime-dog-squad-foundation
title: Dog Squad's Last Days on Eden Prime
kind: mission-aside
game: Mass Effect
when: 2183, two days before Saren's geth attack, through the night it happened
where: a bar on Eden Prime; the beacon dig site perimeter; the cliff below Bravo Squad's post

participants: [Bates, Sergeant Donkey, Ashley Williams, Kai Leng]

beats:
  - text: >
      Two days before the geth attack, Dog Squad is on downtime at a bar. Bates and the
      other grunts watch Sergeant Donkey's back-and-forth with Chief Ashley Williams and
      joke about who will end up pairing off with whom.
    source_chunks: [bates_001, donkey_001]
  - text: >
      Dog Squad is assigned to patrol between the dig site and the colony, guarding the
      newly unearthed Prothean Beacon. Bates complains about going on foot while the other
      three squads get transport; Donkey puts him on point duty for the complaint.
    source_chunks: [bates_001]
  - text: >
      On the night of the attack, Bates grows uneasy when Bravo Squad fails to make contact.
      Donkey partners him with Ashley to investigate; they find Bravo Squad's remains below
      the cliff and no survivors. Bates is distraught over a friend's corpse but pulls
      himself together after Ashley consoles him, and approves when Donkey names her squad
      leader.
    source_chunks: [bates_001]
  - text: >
      At dawn Dog Squad engages the geth prematurely at the mission site. Bates lays down
      diversionary fire, but the squad is killed one by one. He sees Sovereign in the
      distance, and when only he and Ashley are left, he refuses to answer her calls for
      support and crawls away from the battlefield, terrified.
    source_chunks: [bates_001]
  - text: >
      Kai Leng captures Bates in the attack's aftermath and forces him to divulge what he
      knows. The next day, once Bates has told him everything, Leng kills him and stages the
      body to look as though Bates died with the rest of his squad.
    source_chunks: [bates_001]

related_events: [attack-on-eden-prime, ashley-williams-eden-prime]
source_chunks: [bates_001, bates_001, donkey_001]
