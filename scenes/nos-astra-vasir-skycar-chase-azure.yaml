scene_id: nos-astra-vasir-skycar-chase-azure
title: Running Down Tela Vasir to the Hotel Azure
kind: mission-aside
game: Mass Effect 2
when: "2185, Illium, during Lair of the Shadow Broker, right after Vasir's betrayal at the Dracon Trade Center"
where: "the Nos Astra skyways and the roof of the Hotel Azure, Illium"
participants: [Shepard, Liara, Tela Vasir]
heard_by: [Illium authorities, Normandy crew]
requires:
  - lair-of-the-shadow-broker: any
beats:
  - text: >
      Exposed as the Broker's agent, Vasir had shattered the office glass with biotics and
      jumped from the Baria Frontiers window. Shepard fought through Shadow Broker troops out
      of the building and found Liara and Vasir trading fire in the parking lot. Vasir called
      her skycar and fled; Liara commandeered a taxi and she and Shepard chased Vasir through
      the skyways of Nos Astra.
    source_chunks: [storyline-ii_042, lair-of-the-shadow-broker-mission_007, lair-of-the-shadow-broker-mission_008]
  - text: >
      Vasir's skycar crashed onto the roof of the Hotel Azure. Bleeding and limping, she
      kept ahead while waves of Shadow Broker reinforcements landed to engage Shepard and
      Liara across the rooftop.
    source_chunks: [storyline-ii_042, tela-vasir-enemy_001]
  - text: >
      Shepard and Liara followed Vasir's blood trail through the hotel to the far side of
      the roof and cornered her at gunpoint. Vasir grabbed a bystander as a hostage; the
      hostage broke free, and Vasir fought Shepard's squad with everything she had left.
    source_chunks: [storyline-ii_042, tela-vasir-enemy_001]
  - text: >
      Her wounds and the fight finished her. Shepard killed Vasir; Liara recovered Sekat's
      data disk. Dying, Vasir insisted she was nothing like Saren, that trading with the
      Shadow Broker had saved lives and kept the Citadel safe, and threw Shepard's work with
      Cerberus back at the Commander before she died.
    source_chunks: [storyline-ii_042, tela-vasir-enemy_001]
  - text: >
      Shepard told Liara that Vasir was dead, and Liara forwarded the recovered data to the
      Normandy. Shepard could reassure her they would reach Feron in time; Liara recalled
      Therum, where Shepard had saved her from a krogan Battlemaster while she cowered, and
      admitted she was still leaning on Shepard. They set course for the Broker's base.
    source_chunks: [storyline-ii_042, lair-of-the-shadow-broker-mission_012]
related_scenes: [dracon-trade-center-vasir-revealed, hagalaz-shadow-broker-ship-feron-yahg]
related_events: [shadow-broker-baria-explosion]
