scene_id: citadel-upper-wards-terra-firma-protest
title: Saracino Seeks Shepard's Endorsement at the Terra Firma Protest
kind: banter
game: Mass Effect
when: "2183, Citadel, after Sovereign's attack, during shore leave"
where: Upper Wards of the Citadel, near the stairs by Flux
participants: [Shepard, Charles Saracino, Ashley Williams, Kaidan Alenko, Liara T'Soni, Garrus Vakarian, Urdnot Wrex]
private_to: [Shepard, Charles Saracino, Ashley Williams, Kaidan Alenko, Liara T'Soni, Garrus Vakarian, Urdnot Wrex]
heard_by: [Citadel patrons]
beats:
  - text: >
      After Captain Anderson summons Shepard to meet him at Flux, a Terra Firma party protest
      is found gathered on the Citadel Upper Wards near Flux, a group of people chanting slogans
      against alien influence on humanity. Charles Saracino, the current leader of Terra Firma,
      stands at the front of the group and calls Shepard over for a conversation.
    source_chunks: [citadel-our-own-worst-enemy_001, citadel-our-own-worst-enemy_002, citadel-our-own-worst-enemy_003]
  - text: >
      Whichever squadmates Shepard brought have their own reactions to Saracino. If Ashley
      Williams is present she voices her own objections to him, which Shepard can encourage or
      curtail; Kaidan Alenko, Liara T'Soni, Garrus Vakarian, and Urdnot Wrex each have their
      own complaints to make as well.
    source_chunks: [citadel-our-own-worst-enemy_003]
  - text: >
      Saracino, a vehement critic of the Alliance's policy toward alien races, believes
      humanity should resist alien influences by any means necessary—even militarily in the
      worst case. He is running for a political office in the Alliance Parliament and
      considers the support of the first human Spectre invaluable.
    source_chunks: [citadel-our-own-worst-enemy_003, charles-saracino_001]
  - text: >
      Saracino asks Shepard to endorse him for a seat in the Alliance parliament. Shepard can
      agree or refuse the endorsement, possibly believing it would be unwise or that humans
      need to cooperate with alien races instead. Even if Shepard refuses, Saracino asks whether
      Shepard would at least make a public statement of support for his candidacy.
    source_chunks: [citadel-our-own-worst-enemy_003]
  - text: >
      If Shepard endorses Saracino's candidacy, the Commander earns Renegade points and
      Saracino is grateful for Shepard's respect of the democratic process. He returns to the
      protest satisfied. Cut news reports, restored in Legendary Edition, later show the
      Terra Firma Party gaining support in Parliament.
    source_chunks: [citadel-our-own-worst-enemy_003, citadel-our-own-worst-enemy_004]
    conditional: {endorse_saracino: true}
    choice: endorsed Saracino
  - text: >
      If Shepard refuses to endorse Saracino, the Commander earns Paragon points. Saracino is
      still grateful for Shepard's respect of the democratic process despite the rejection and
      returns to the protest. Cut news reports, restored in Legendary Edition, later show
      Saracino pleading guilty to tax evasion.
    source_chunks: [citadel-our-own-worst-enemy_003, citadel-our-own-worst-enemy_004]
    conditional: {endorse_saracino: false}
    choice: refused to endorse Saracino
related_events: [terra-firma-political-influence]
source_chunks: [citadel-our-own-worst-enemy_001, citadel-our-own-worst-enemy_002, citadel-our-own-worst-enemy_003, citadel-our-own-worst-enemy_004, charles-saracino_001]
