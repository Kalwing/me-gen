scene_id: me1-ilos-find-the-conduit
title: The Race to Ilos and Vigil's Warning
kind: mission-aside
game: Mass Effect
when: 2183, after breaking the Citadel lockdown, en route to and on Ilos for the final assault on Saren
where: the SSV Normandy bridge and cargo bay, then the Ilos surface and Archives
participants: [Shepard, Joker, Pressly, Liara T'Soni, Kaidan Alenko, Ashley Williams, Vigil]
private_to: []
heard_by: []
requires:
  - virmire_survivor: alive
beats:
  - text: >
      The Normandy passes through the Mu Relay and arrives at Ilos with geth ships in orbit.
      Navigator Pressly detects the nearest viable landing zone two kilometers from Saren's
      position—too far to intercept him in time. Shepard orders a Mako drop, but Pressly points
      out that the only suitable site is just twenty meters wide, far too small for a standard
      drop. When Pressly protests it is impossible, Joker silences objections, asserts he can
      execute the drop, and performs a daring maneuver: a screaming dive from the upper atmosphere,
      pulling the Normandy out at the last second as the Mako roars from the cargo bay, lands hard,
      and rolls to a stop just outside the bunker doors as Saren seals them shut behind him.
    source_chunks: [ilos-find-the-conduit_005, ilos-find-the-conduit_006]
  - text: >
      Shepard's squad fights through the Prothean ruins, encountering geth including Troopers,
      Shock Troopers, Rocket Troopers, Armatures, Destroyers, and a Geth Prime. They secure the
      security station and activate a console. A badly distorted Prothean holographic recording
      plays—a warning the squad cannot fully understand. Shepard, however, thanks to the Cipher,
      discerns fragmented words about the Reapers. The squad realizes the recording came too late
      to save the Protheans.
    source_chunks: [ilos-find-the-conduit_006, ilos-find-the-conduit_008]
  - text: >
      Shepard boards the Mako and drives through the Archives. While traversing the long
      underground corridor lined with what appear to be Prothean stasis pods, squadmates comment
      that they expected Saren to lay a trap in such a perfect ambush location; another speculates
      that the pods once housed sleeping Protheans. Partway through, the Mako encounters Saren's
      rear guard—a few Geth Rocket Troopers—whom they quickly dispatch. As they continue, twin
      forcefields trap the Mako. The squad exits and enters an elevator, which descends deeper into
      the facility.
    source_chunks: [ilos-find-the-conduit_009]
  - text: >
      The elevator opens onto a platform where Shepard meets a damaged Prothean VI hologram
      identifying itself as Vigil, created by chief researcher Ksad Ishan. Vigil explains that the
      Citadel is not a mass relay but a trap: when activated, it opens a gateway for the Reapers
      to pour in from Dark Space and exterminate all organic civilization before vanishing. The
      Reapers systematically hunted down the Protheans using their own census and map data;
      indoctrinated "refugees" betrayed their own people from within. Ilos survived only because
      all records of it were destroyed in the initial Reaper attack.
    source_chunks: [ilos-find-the-conduit_010]
  - text: >
      Vigil explains that the Ilos facility's top twelve researchers survived in cryostasis. As
      power failed and Vigil deactivated most pods over the years, they eventually devised a plan:
      they found a way to alter the Citadel's signal to the keepers to prevent remote activation
      of the relay. Using the Conduit—a prototype mass relay linked directly to the Citadel—they
      traveled to the station and stopped Sovereign from signaling the keepers. They were trapped
      there afterward, their fate unknown.
    source_chunks: [ilos-find-the-conduit_010]
  - text: >
      Vigil gives Shepard a data file granting temporary full access to the Citadel's systems,
      usable only from the Master Control Terminal. Vigil warns that Saren has not yet reached
      the Conduit—Shepard still has time to stop him. If Liara is in the squad, she asks Vigil if
      she may stay to learn more from the Prothean VI, recognizing this may be the only chance to
      study the Protheans. Vigil grants her request. Vigil gives Shepard one final beacon of hope
      as the squad departs: the race is not yet lost. When the mission is marked complete, Race
      Against Time: Sovereign updates to Race Against Time: Conduit.
    source_chunks: [ilos-find-the-conduit_010]
