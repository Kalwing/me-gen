scene_id: normandy-tali-romance-suit-trust
title: Tali, the Suit, and the Mask Before Omega 4
kind: downtime
game: Mass Effect 2
when: 2185, aboard the Normandy SR-2 — after Tali's treason trial, and the night before the Omega 4 relay
where: the Normandy's engineering deck, then Shepard's cabin
participants: [Shepard, Tali'Zorah vas Normandy]
private_to: [Shepard, Tali'Zorah vas Normandy]
heard_by: [Normandy crew]

requires:
  - romance: Tali

beats:
  - text: >
      When Tali first comes aboard, Yeoman Kelly Chambers tells Shepard she reads "more than
      just good friends" in Tali's body language. Kasumi Goto later says the same — Shepard
      is "all she talks about" — and warns Shepard to be good to her.
    source_chunks: [tali-zorah-nar-rayya_007]
  - text: >
      After the treason trial Shepard finds Tali on the engineering deck running a small
      fever from a sloppy suit repair. She explains that linking suit environments is the
      quarians' deepest and most sacred gesture of trust, dangerous enough to make both
      parties ill, and lets slip that Shepard is the only person she has ever trusted that
      far. She stammers, blames the blush on the fever, then admits she has had feelings for
      Shepard since the fight against Saren but never believed a non-quarian could see who
      she was under the mask. Shepard tells her the feeling is mutual.
    source_chunks: [tali-zorah-nar-rayya_007, manual-tali-zorah-vas-normandy-character-analysis-part-5-the-romance-arc-and-conclusion_003]
  - text: >
      Feeling she is finally Shepard's equal now that years have passed and she has proven
      herself to her family, Tali is the one who raises the relationship — apologizing for
      being "unprofessional... stupid and selfish" and worrying that wanting Shepard could
      make her sick and put the mission at risk.
    source_chunks: [manual-tali-zorah-vas-normandy-character-analysis-part-5-the-romance-arc-and-conclusion_003]
  - text: >
      The night before the Omega 4 relay she comes to Shepard's cabin and takes off her mask
      despite the health risk. Afterward she is running a fever with a bad cough — "and it
      was totally worth it." Per Kasumi, she cannot stop talking about Shepard; taking the
      mask off took a great deal of trust.
    source_chunks: [manual-tali-zorah-vas-normandy-character-analysis-part-5-the-romance-arc-and-conclusion_003, tali-zorah-nar-rayya_015]

