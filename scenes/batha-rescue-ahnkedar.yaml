scene_id: batha-rescue-ahnkedar
title: Pulling Batha Out of the Ahn'Kedar Labs
kind: mission-aside
game: Mass Effect
when: during the events of Mass Effect Galaxy
where: the Ahn'Kedar Orbital Platform research facility

participants: [Jacob Taylor, Nax, Batha]
private_to: [Jacob Taylor, Nax, Batha]

beats:
  - text: >
      Inside the Ahn'Kedar facility Jacob Taylor encountered Nax, a krogan mercenary, already
      engaged with batarian forces. Nax trained his weapon on Jacob and demanded he justify his
      presence, counting down from five. Jacob explained he was there to rescue the kidnapped
      scientists. When Nax learned the names of the hostages, he realized Jacob's mission aligned
      with his own: he had come to rescue Batha, an asari scientist and an old friend. They
      agreed to split up to cover more ground.
    source_chunks: [nax_001]
  - text: >
      Batha, an asari bioscience scientist, was kidnapped by batarians along with other
      scientists, including Doctor Hendricks, and taken to a research facility on the
      Ahn'Kedar Orbital Platform. Told the batarians were dying of a "blood plague," she
      agreed to help develop a vaccine, not realizing it was actually a bioweapon the
      batarians meant to unleash on the Citadel.
    source_chunks: [batha_001]
  - text: >
      Jacob located Doctor Hendricks, who revealed that the prototype vaccine formula was held
      by Batha in a separate facility Jacob could not reach alone. Before Jacob could despair,
      a nearby door exploded inward; Nax appeared, Batha slung over his shoulder, fighting
      through a pursuing group of batarians.
    source_chunks: [nax_001]
  - text: >
      Jacob provided covering fire as Nax carried Batha to safety. Batha thanked Jacob directly,
      to Nax's visible dismay—his friend's attention had turned to the human who had helped.
    source_chunks: [batha_001]
  - text: >
      Batha told them she was close to a vaccine but not finished; sick bay supplies from
      Jacob's ship and a large quantity of unrefined element zero — which Miranda had a lead
      on at a stockpile on Bekke — would let her complete it. She finished the formula in
      time to cure Illo Nazario, inoculate the rest of the crew, and later treat exposed
      victims on the Citadel.
    source_chunks: [batha_001]

source_chunks: [nax_001, batha_001]
