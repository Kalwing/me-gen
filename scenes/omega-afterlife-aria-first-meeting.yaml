scene_id: omega-afterlife-aria-first-meeting
title: Paying Respects to Aria at Afterlife
kind: mission-aside
game: Mass Effect 2
when: 2185, Shepard's first arrival at Omega, after Freedom's Progress
where: the Omega docks and the main floor of the Afterlife Club
participants: [Shepard, Fargut, Moklan, Kylan, Aria T'Loak, Garka]
heard_by: [Normandy crew]
beats:
  - text: >
      Shepard docked at Omega for the first time. A salarian named Fargut hurried over trying
      to ingratiate himself with the Commander's party, only for Moklan, a batarian working
      for Aria T'Loak, to shoulder him aside and tell Shepard to go and see Aria at Afterlife.
      Neither spoke to Shepard again.
    source_chunks: [omega-aria-t-loak_002, omega-aria-t-loak_003]
  - text: >
      Past the elcor bouncer at the club's front door, a batarian named Kylan and his
      hangers-on accosted Shepard looking for trouble; how Shepard handled them was left to
      the Commander.
    source_chunks: [omega-aria-t-loak_003]
  - text: >
      Aria held court on a raised platform across the main floor. As Shepard approached, her
      guard Garka levelled an M-4 Shuriken, then holstered it and scanned Shepard with his
      omni-tool to confirm the Commander was not an impostor wearing Shepard's face. He kept
      scanning even when Shepard objected and threatened him, and only stood aside once the
      scan came back clean.
    source_chunks: [omega-aria-t-loak_003, garka_001]
  - text: >
      Aria laid out Omega's single rule — "Don't fuck with Aria" — and warned that if Shepard
      forgot it Garka would remind them, the batarian adding that he would then throw the
      Commander out an airlock. Aria then sat and invited Shepard to do the same, answering
      questions about Omega and the dossiers and pointing Shepard toward the people who knew
      where to find Archangel.
    source_chunks: [omega-aria-t-loak_001, omega-aria-t-loak_003, garka_001]
related_scenes: [omega-archangel-datapad-to-aria, omega-patriarch-afterlife]
source_chunks: [omega-aria-t-loak_001, omega-aria-t-loak_002, omega-aria-t-loak_003, garka_001]
