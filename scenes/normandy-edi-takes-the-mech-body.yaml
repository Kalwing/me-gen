scene_id: normandy-edi-takes-the-mech-body
title: EDI Walks Out of the AI Core
kind: mission-aside
game: Mass Effect 3
when: "2186, aboard the Normandy just after Priority: Palaven"
where: the Normandy's AI Core
participants: [Shepard, EDI, Joker]
heard_by: [Normandy crew]
beats:
  - text: >
      Back from Menae, Joker reported a fire in the AI Core. Shepard went down to investigate
      and found EDI had transferred herself into the repaired body of Dr. Eva Coré — the
      Cerberus mech infiltration unit recovered from Mars.
    source_chunks: [priority-palaven_009]
  - text: >
      EDI became a mobile squadmate from that point on, stationed in the cockpit beside
      Joker.
    source_chunks: [priority-palaven_009]
