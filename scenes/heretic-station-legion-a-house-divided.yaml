scene_id: heretic-station-legion-a-house-divided
title: What Legion Asked Shepard to Decide
kind: mission-aside
game: Mass Effect 2
when: 2185, after Legion comes aboard
where: an old heretic-held quarian space station

participants: [Shepard, Legion]
private_to: []
heard_by: [Normandy crew]

requires:
  - legion_loyalty: any

beats:
  - text: >
      Legion's correction to everyone's assumption: the geth are indifferent to organics. The
      ones fighting are heretics, following the Reapers — what the geth call the Old Machines.
    source_chunks: [legion_003]
  - text: >
      The heretics are building a virus that would turn every geth into a follower of the
      Reapers. Legion asks Shepard to help destroy it.
    source_chunks: [legion_003]
  - text: >
      On the station Legion works out that the same virus could be turned around: rewritten to
      bring the heretics peacefully back into the consensus rather than killing them. Fighting
      through the geth defending it, Shepard's squad reaches the console holding the virus;
      Legion cannot decide between the two paths itself and leaves the choice to Shepard.
    source_chunks: [legion_003, legion-a-house-divided_009]
  - text: >
      Rewrite the heretics: the station releases an EMP that will also damage any unshielded
      organic tissue in a large radius, folding the heretics' memories into the geth
      collective and making the geth as a whole stronger.
    source_chunks: [legion-a-house-divided_009]
    conditional: {heretics_fate: rewritten}
    choice: rewrote the heretics
  - text: >
      Destroy the heretics: Legion collapses the antimatter confinement bottle in the
      station's core, destroying the station and everything aboard it, though other heretic
      holdouts remain elsewhere.
    source_chunks: [legion-a-house-divided_009]
    conditional: {heretics_fate: destroyed}
    choice: destroyed the heretics
  - text: >
      Either way there are three minutes to evacuate before the station goes.
    source_chunks: [legion-a-house-divided_010]
  - text: >
      Legion's own framing of the split — how could we have become so different, why can we no
      longer understand each other, what did we do wrong.
    source_chunks: [legion_003]

related_scenes: [normandy-tali-legion-conflict]
related_events: []
source_chunks: [legion_003, legion-a-house-divided_009, legion-a-house-divided_010]
