beats:
  - text: >
      With Dr. Michel invited aboard the Normandy SR-2 in place of Dr. Chakwas, and Mordin
      Solus or Padok Wiks temporarily aboard, Shepard can overhear Michel and Engineer Adams
      talking in the crew quarters. Michel clarifies that she once worked with a man named
      Armistan Banes — she had believed he was with the Alliance, but he turned out to be a
      Cerberus agent.
