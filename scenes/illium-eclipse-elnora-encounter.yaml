scene_id: illium-eclipse-elnora-encounter
title: Confronting Elnora in the Eclipse Base
kind: mission-aside
game: Mass Effect 2
when: 2185, Illium, during the recruitment of Samara from the Eclipse base
where: Eclipse base in Nos Astra, Illium
participants: [Shepard, Elnora]
private_to: [Shepard, Elnora]
heard_by: [Normandy crew]
requires:
  - samara_loyalty: any
beats:
  - text: >
      While ascending the stairs through the Eclipse base toward the Sisterhood, Shepard hears someone
      cowering in fear behind a locked door. Opening it, Shepard finds Elnora, a young asari Eclipse
      initiate, hiding behind a table. She claims to be only a new recruit who joined by mistake and
      has done nothing wrong, pleading with Shepard to let her go.
    source_chunks: [elnora_001, dossier-the-justicar_008]
  - text: >
      Elnora then pulls a gun on Shepard. Shepard interprets the action as hostile and the team guns her
      down in self-defense, killing her outright. Shepard gains Renegade points for the direct Renegade
      interrupt kill.
    source_chunks: [interrupt_005, dossier-the-justicar_008]
    conditional: {elnora_outcome: killed}
    choice: shoot Elnora immediately
  - text: >
      Elnora pulls her gun but then stands down, realizing the futility of her position. Shepard orders
      her to leave, though not before questioning her about an Ardat-Yakshi and the ship her fellow
      mercenaries used to smuggle that individual off Illium. Shepard gains Paragon points for showing
      mercy.
    source_chunks: [elnora_001, dossier-the-justicar_008]
    conditional: {elnora_outcome: spared}
    choice: wait for her to stand down and let her go
  - text: >
      Shepard bypasses Elnora's room entirely and continues deeper into the base. Later, after finding
      evidence of her crimes, Shepard can return to her location, but she has already fled. No Paragon or
      Renegade points are awarded for this outcome.
    source_chunks: [dossier-the-justicar_008]
    conditional: {elnora_outcome: fled}
    choice: skip past and return later
  - text: >
      An audio log discovered later in the base reveals Elnora's actual state of mind: she was excited
      about becoming a full Eclipse member and had recently murdered a volus business partner, Dakni Kur,
      as part of her initiation into the gang. She took sadistic satisfaction in the kill and smugly
      anticipated her friends' envy. This evidence can be brought to Detective Anaya later: if Elnora
      escaped, Anaya promises to track her down; if killed, Anaya expresses relief.
    source_chunks: [elnora_001]
related_events: [samara-recruitment-illium]
source_chunks: [elnora_001, dossier-the-justicar_008, interrupt_005]
