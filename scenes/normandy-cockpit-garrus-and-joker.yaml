scene_id: normandy-cockpit-garrus-and-joker
title: Garrus and Joker in the Cockpit
kind: banter
game: Mass Effect 3
when: 2186, after Tuchanka
where: the cockpit and the main battery, Normandy SR-2

participants: [Shepard, Garrus Vakarian, Jeff "Joker" Moreau]
private_to: []
heard_by: [Normandy crew]

requires: []

beats:
  - text: >
      Garrus is up in the cockpit trading jokes with Joker. When Shepard joins them they end
      up on Mordin at some length — Garrus's verdict being that he always thought the salarian
      was crazy but useful, and part of the team regardless.
    source_chunks: [garrus-vakarian_011]
  - text: >
      Walking away from Joker, Garrus asks Shepard how it feels to have krogan praising the
      Commander's name for the genophage cure, and says the turian fleets will be at Earth
      when the time comes.
    source_chunks: [garrus-vakarian_011]
  - text: >
      He admits reservations: he doubts he could have gone along with the alliance if it had
      not been Palaven that needed krogan help, and he imagines the carnage if some hothead
      takes over from Wrex. His joke is about hiring Wrex a food taster.
    source_chunks: [garrus-vakarian_011]
  - text: >
      Garrus and Tali talk over the intercom when she is aboard — toughest missions and
      creepiest enemies. He picks Horizon until Tali objects that she was not there yet, then
      switches to the derelict Reaper; she works out that it is the close quarters he hated,
      being a sniper, and he concedes. Her creepiest is the rachni, which confuses him until
      she clarifies she means the little spider-like swarmers.
    source_chunks: [garrus-vakarian_012]
  - text: >
      He reminds her that the original Normandy was co-developed by turians, and teases that
      he had to serve aboard to stop her making dextros look bad.
    source_chunks: [garrus-vakarian_012]

