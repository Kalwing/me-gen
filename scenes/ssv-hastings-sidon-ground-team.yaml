scene_id: ssv-hastings-sidon-ground-team
title: Anderson's Ground Team on Sidon
kind: mission-aside
game: Mass Effect
when: 2165, immediately after the raid on the Sidon research base (Mass Effect - Revelation)
where: the wrecked, explosive-rigged underground levels of the Alliance research base on Sidon, in the Skyllian Verge
participants: [David Anderson, Jill Dah, Ahmed O'Reilly, Dan Shay, Indigo Lee]
private_to: [David Anderson, Jill Dah, Ahmed O'Reilly, Dan Shay, Indigo Lee]
heard_by: []
requires: []
beats:
  - text: >
      The SSV Hastings, a Systems Alliance frigate patrolling the Skyllian Verge with
      Lieutenant David Anderson aboard as executive officer, happens to be the closest vessel
      when the Sidon research post sends a distress signal. Captain Belliard's ship responds.
    source_chunks: [ssv-hastings_001]
  - text: >
      Anderson takes charge of a five-person ground team — himself, Gunnery Chief Jill Dah,
      tech specialist Corporal Ahmed O'Reilly, Private First Class Dan Shay and Private Second
      Class Indigo Lee. Dah, a tall, aggressive marine nicknamed "Amazon" who served under
      Anderson in the First Contact War, takes point through the ruined base.
    source_chunks: [ssv-hastings_001, jill-dah_001]
  - text: >
      Working through an underground room the attackers have rigged with explosives, the team
      moves to get clear. A batarian mercenary shoots Dah in the right leg. Anderson picks her
      up and carries her back to the elevator; the two of them get out only just before the
      charges detonate.
    source_chunks: [jill-dah_001]
  - text: >
      All five survive the destruction of the station. The Hastings then sets course for the
      Citadel. Despite the damage to her leg, Dah makes a full recovery and is well enough to
      take in the view of the Citadel from the frigate's bridge.
    source_chunks: [ssv-hastings_001, jill-dah_001]
related_scenes: []
related_events: [sidon-research-station-attack]
