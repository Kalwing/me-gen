scene_id: kahje-shrine-quoyle-escorts-liara
title: Quoyle Takes Liara to the Kahje Shrine
kind: mission-aside
game: "Mass Effect: Homeworlds"
when: 2186, during the Reaper War, on Liara's hunt through Prothean archives for a way to stop the Reapers
where: a drell domed city on Kahje, then a submerged Prothean site the hanar keep as a shrine
participants: [Liara T'Soni, Quoyle, Illusive Man]
heard_by: []

requires: []

beats:
  - text: >
      A hanar official refuses Liara T'Soni access to the submerged Prothean shrine. His
      assistant, a drell named Quoyle, argues that since generosity is an Enkindler virtue,
      Liara's large pledge to the upcoming Cresting Bloom celebrations should earn her a
      brief visit. The official relents once the sum is settled.
    source_chunks: [quoyle_001, storyline-iii_020, liara-t-soni_015]
  - text: >
      Quoyle pilots Liara out to the shrine himself, warning that he will shoot her if she
      tries anything. Mid-transit the shrine's automated defenses launch torpedoes at the
      craft; no one answers Quoyle's hails. A hit breaches the hull, and while Quoyle
      guides the craft to the dock Liara uses her biotics to hold the water out in a bubble
      of air.
    source_chunks: [quoyle_001, storyline-iii_020, liara-t-soni_015]
  - text: >
      Inside, they find the shrine's drell staff dead and are attacked by a Cerberus
      Phantom. The Phantom slashes Quoyle across the chest and drops him; Liara fends it
      off with her biotics and kills it by driving a shard of debris through its head.
    source_chunks: [quoyle_001, storyline-iii_020, liara-t-soni_015]
  - text: >
      Wounded but alive, Quoyle tells Liara to go on to the archive room without him. She
      finds a set of Prothean encryption keys and is interrupted by a hologram of the
      Illusive Man, who denies sending the Phantom and offers an alliance against the
      Reapers; Liara demands he share his information first, and when he stalls she cuts the
      link, telling him to send an army next time.
    source_chunks: [quoyle_001, storyline-iii_020, liara-t-soni_015]
  - text: >
      Liara helps the bandaged Quoyle toward the shrine's shuttle bay and contacts Admiral
      Hackett, reporting a possible lead and asking for access to a top-secret facility on
      Mars.
    source_chunks: [storyline-iii_020, liara-t-soni_015, kahje_003]

related_events: [discovery-of-the-prothean-ruins-on-mars]
source_chunks: [quoyle_001, storyline-iii_020, liara-t-soni_015, kahje_003]
