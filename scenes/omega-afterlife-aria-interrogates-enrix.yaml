scene_id: omega-afterlife-aria-interrogates-enrix
title: Aria Interrogates a Shadow Broker Spy
kind: banter
game: Mass Effect 2
when: "2185, Omega, Afterlife Nightclub private room, 04:14 AM"
where: "a private room in the Afterlife Nightclub on Omega"
participants: [Aria T'Loak, Kalus Enrix]
private_to: [Aria T'Loak, Kalus Enrix]
heard_by: [Shadow Broker]
beats:
  - text: >
      Aria T'Loak had Kalus Enrix, a turian, shackled in a private room at the Afterlife
      nightclub. She had discovered he had been at the club for a week undetected—a spy.
      She addressed him directly: "Don't bother. Those shackles don't have a release
      catch." She explained she could usually spot them earlier, then revealed the
      revelation that cut to the spy's heart: "I know you're listening through that
      speaker hidden in Enrix's collar. I bet Enrix doesn't even know who he's really
      spying for, does he, Shadow Broker?"
    source_chunks: [shadow-broker-dossiers-aria-t-loak_002]
  - text: >
      Aria T'Loak then addressed the Shadow Broker directly through the hidden speaker.
      She made clear her resentment at his intrusion: "You don't play favorites, Broker.
      I admire that. But what I don't like is how you think anything twitches a muscle
      on Omega without my knowing it!" She gave an open threat to his further attempts to
      operate on her world: "Feel free to waste as many lives as you want, sending your
      agents down to my world."
    source_chunks: [shadow-broker-dossiers-aria-t-loak_002]
  - text: >
      Enrix attempted to plead or explain, saying he was "working for a guy" but it was
      not what Shepard thought. Aria cut him off with violence. The recording ended with
      the door opening and closing, and a note in the Shadow Broker's file indicated
      Enrix's death had not compromised the Broker's other agent placed at the Afterlife.
    source_chunks: [shadow-broker-dossiers-aria-t-loak_002]
source_chunks: [shadow-broker-dossiers-aria-t-loak_002]
