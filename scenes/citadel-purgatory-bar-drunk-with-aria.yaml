scene_id: citadel-purgatory-bar-drunk-with-aria
title: Getting Drunk at Purgatory
kind: downtime
game: Mass Effect 3
when: 2186, shore leave on the Citadel during the Reaper War
where: the Purgatory Bar on the Citadel — Aria T'Loak's club and base of operations after losing Omega
participants: [Shepard, Aria T'Loak]
private_to: [Shepard, Aria T'Loak]
heard_by: [Normandy crew]

requires: []

beats:
  - text: >
      Aria T'Loak runs Purgatory as her headquarters after Cerberus takes Omega, and
      loathes it — she calls the club "hell" and rates it far below Afterlife. Shepard
      drinks there among citizens of every race trying to forget the war.
    source_chunks: [purgatory-bar_001]
  - text: >
      If Shepard drinks enough to black out, the Commander sleeps it off and wakes the next
      morning next to Aria in the VIP Lounge. Getting drunk there a second time ends worse:
      Shepard comes to in the elevator outside, and cannot use the bar again without
      leaving the area and coming back.
    source_chunks: [purgatory-bar_001]

