scene_id: redemption-liara-feron-hunt-shepards-body
title: Liara Hires Feron to Find Shepard
kind: mission-aside
game: "Mass Effect: Redemption"
when: 2183, roughly two months after the Normandy SR-1 was destroyed, during Liara's search for Shepard
where: an ambush site, a Cerberus meeting with the Illusive Man, and the Afterlife Club on Omega
participants: [Liara T'Soni, Feron, Miranda Lawson, The Illusive Man]
heard_by: [Cerberus]
requires: []
beats:
  - text: >
      Liara T'Soni hired the drell information trafficker Feron to help find Commander
      Shepard. He told her Shepard was neither dead nor alive; she insisted on searching
      anyway.
    source_chunks: [feron_002]
  - text: >
      Blue Suns sent by the Shadow Broker ambushed the pair to delay Liara. An unknown
      sniper gunned the mercenaries down, opening a gap for the two to escape.
    source_chunks: [feron_002]
  - text: >
      They ran into Cerberus agents, Miranda Lawson among them, and were brought before the
      Illusive Man, who revealed that the Shadow Broker was working with the Collectors.
      Afterward Feron admitted to Liara he had been ordered to lead her away from Shepard,
      but chose to help her instead.
    source_chunks: [feron_002]
  - text: >
      At the Afterlife Club on Omega, Feron learned where the Blue Suns would bring
      Shepard's body and spotted the Broker's enforcer Tazzik. Rather than let Liara rush
      him, Feron tried a nearby turret on Tazzik's ship, missed, and Tazzik fled Omega with
      the body.
    source_chunks: [feron_002]
  - text: >
      Liara accused Feron of still working for the Shadow Broker. He admitted he had never
      stopped — and said that connection was how they would track Tazzik.
    source_chunks: [feron_002]
related_scenes: [alingon-liara-feron-shadow-broker-base]
related_events: [mass-effect-redemption]
