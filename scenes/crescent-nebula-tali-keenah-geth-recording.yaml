scene_id: crescent-nebula-tali-keenah-geth-recording
title: Tali and Keenah Pull the Geth Memory Core
kind: mission-aside
game: "Mass Effect: Homeworlds"
when: 2183, during Tali'Zorah's Pilgrimage, before the events of Mass Effect
where: an unidentified ice world in the Crescent Nebula, then the quarian ship Honorata
participants: [Tali'Zorah nar Rayya, Keenah'Breizh]
private_to: [Tali'Zorah nar Rayya, Keenah'Breizh]
heard_by: []
requires: []
beats:
  - text: >
      Tali is aboard the Honorata bound for Illium, listening to a farewell message from her
      father, when Keenah'Breizh interrupts to report a geth presence detected on an
      uncharted ice world in the Crescent Nebula. The two land to investigate.
    source_chunks: [mass-effect-homeworlds-2_004, keenah-breizh_001]
  - text: >
      Tali disables a geth unit and extracts its memory core. Activating it, she and Keenah
      hear a recorded conversation between Saren Arterius and Matriarch Benezia discussing
      the attack on Eden Prime and the coming return of the Reapers.
    source_chunks: [mass-effect-homeworlds-2_004, tali-zorah-nar-rayya_002]
  - text: >
      Tali convinces Keenah that the recording is too important to sit on and that they must
      hand it to the authorities on Illium.
    source_chunks: [keenah-breizh_001, tali-zorah-nar-rayya_002]
  - text: >
      Saren's mercenary, Commander Jacobus — on the planet under orders to dig for Prothean
      artifacts — learns of the intrusion and attacks, knowing Saren will kill him and his
      team if the quarians get away. Tali and Keenah flee back to the Honorata and set course
      for Illium.
    source_chunks: [jacobus_001, mass-effect-homeworlds-2_004]
