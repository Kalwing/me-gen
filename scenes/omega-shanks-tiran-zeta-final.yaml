scene_id: omega-shanks-tiran-zeta-final
title: Tiran Unmasked; Final Confrontation with Agent Zeta
kind: argument
game: Mass Effect
when: during Andromeda Initiative recruitment mission, Omega
where: Omega
participants: [Luna Shanks, Tiran Kandros, Nyreen Kandros, Shio'Leth vas Novarra, Agent Zeta]
private_to: []
heard_by: []
requires:
  - game: Mass Effect
beats:
  - text: >
      Luna Shanks and Sanjin Vinnick arrive on Omega pursuing Agent Zeta and searching for
      Shio'Leth vas Novarra. Tiran's cousin Nyreen Kandros inadvertently reveals Vinnick's
      true identity in Shanks' presence. Already suspicious of Vinnick's encrypted military
      contacts and furtive behavior, Shanks draws her Shuriken and engages the turian cousins.
      Tiran and Nyreen subdue her before she will listen to explanations.
    source_chunks: [luna-shanks_002]
  - text: >
      Once Shanks has calmed, Tiran tells her his story and she shares her own: how Jien
      Garson recruited her from her father's construction company, where she worked as a
      biotic laborer because her father had no male heir. Garson saw her potential and hired
      her on the spot despite the failed construction bid. Shanks worries Garson's judgement
      has finally faltered in trusting Tiran. Tiran counters that Garson may know something
      they do not.
    source_chunks: [luna-shanks_002, jien-garson_003]
  - text: >
      Shanks, Tiran, Nyreen, and her forces prepare for a final confrontation against Agent
      Zeta and the escaped Shio. Despite pinning Zeta and Shio in a corner, their weapons
      cannot penetrate the salarian's biotic barrier. Shanks produces a Throw and orders
      another biotic to Pull, creating a biotic explosion that knocks both Zeta and Shio
      prone. As Shanks helps Shio to his feet, Zeta impales her from behind with a metal bar.
    source_chunks: [luna-shanks_002]
  - text: >
      Shanks retaliates by emptying her Eviscerator shotgun into Zeta's face. The enraged
      salarian unleashes a massive biotic surge that sends everyone flying. Zeta escapes.
      Shio is rescued but Shanks lies incapacitated on a stretcher, a metal bar wound through
      her body. The bar missed vital organs; Shanks will survive, though she experiences
      permanent loss of sensation in parts of her body.
    source_chunks: [luna-shanks_002]
  - text: >
      Recovering at a medical facility on Earth, Shanks receives a visit from Tiran. Though
      she urged him not to pursue Zeta to the Kholas Array after the battle on Omega, he
      followed the trail anyway. He now visits her as she recuperates.
    source_chunks: [luna-shanks_002, jien-garson_004]
