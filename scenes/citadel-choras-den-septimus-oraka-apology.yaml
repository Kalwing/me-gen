scene_id: citadel-choras-den-septimus-oraka-apology
title: Shepard Confronts Septimus at Chora's Den
kind: banter
game: Mass Effect
when: "2183, Citadel shore leave, after Sha'ira appeals to Shepard"
where: Chora's Den, the Citadel Lower Wards
participants: [Shepard, Septimus Oraka]
heard_by: [Sha'ira, Xeltan]
requires: []
beats:
  - text: >
      At Sha'ira's request, Shepard sought out Septimus Oraka at Chora's Den. The retired
      turian general had visited the Consort for years and they had grown close, but after
      he wanted her to be "more than she could be," they had fallen out. Angry, he had
      begun spreading lies about her and spent his time drinking at the bar.
    source_chunks: [septimus-oraka_002]
  - text: >
      When Shepard found him, Septimus claimed Sha'ira had been the only woman who helped
      him forget the horrors of his past and that she had effectively deserted him. Shepard
      spoke to him as one soldier to another, reminding him of his honor and telling him to
      straighten up and behave like a general. Septimus realized how he had been behaving
      and vowed to go to Sha'ira after a cold shower or two.
    source_chunks: [septimus-oraka_002]
  - text: >
      Before leaving, Septimus asked Shepard a favor: in his anger at Sha'ira, he had
      discovered a compromising secret about the elcor diplomat Xeltan and falsely accused
      the Consort of revealing it. He gave Shepard the details of how he had actually
      learned it, which would exonerate Sha'ira, and asked the Commander to give this
      evidence to Xeltan. He suggested the Commander would make a good general one day.
    source_chunks: [septimus-oraka_002]
  - text: >
      Sha'ira later reported that Septimus had sent her a lovely note as an apology, and
      they had become friends again.
    source_chunks: [septimus-oraka_002]
