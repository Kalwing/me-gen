title: Bailey's New Desk Job
kind: banter
game: Mass Effect 3
when: "2186, Citadel, on Shepard's return to petition the Council's aid in retaking Earth"
where: Commander Bailey's office, the Citadel Embassies

participants: [Shepard, Armando-Owen Bailey]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Now a newly promoted Commander in charge of C-Sec operations for the Citadel Embassies,
      Bailey personally greets Shepard on the Commander's return to the Citadel. Shepard
      first finds him trying to calm down a news reporter demanding to see the Council.
    source_chunks: [armando-owen-bailey_005]
  - text: >
      In conversation, Bailey admits he is unhappy in the new post — more an administrative
      assistant to the Council than a C-Sec officer. Like many humans on the Citadel, he has
      family left on Earth: his ex-wife's whereabouts are unknown, and he has not heard from
      his son and daughter since the comm buoys went down.
    source_chunks: [armando-owen-bailey_005]

