scene_id: hollows-thurak-wreav-argument
title: Blood and Honor in the Hollows
kind: argument
game: Mass Effect 3
when: "2186, the Hollows on Tuchanka, after Wreav called the krogan clans to unite against the Reapers"
where: the Hollows, Tuchanka
participants: [Jorgal Thurak, Urdnot Wreav, Mordin Solus or Padok Wiks, Eve]
heard_by: [other krogan clans present in the Hollows]
requires:
  - wrex_virmire: dead
beats:
  - text: >
      When the salarian scientist Mordin Solus or Padok Wiks arrived at the gathering in the Hollows,
      Jorgal Thurak immediately objected to the scientist's presence, unwilling to let what the salarians had done to the krogan be forgotten.
    source_chunks: [jorgal-thurak_001]
  - text: >
      This sparked an argument with Urdnot Wreav. Thurak claimed that Clan Jorgal had existed as long as there had been krogan
      and owned pet varren older than Clan Urdnot's "whelps." Wreav countered that Clan Jorgal was old and weak.
    source_chunks: [jorgal-thurak_001]
  - text: >
      Thurak responded that Jorgal at least had the experience to know that a salarian could not be trusted.
      When Wreav bellowed that the reckoning for the genophage would come when he said so,
      Thurak drew a shotgun on the Urdnot leader.
    source_chunks: [jorgal-thurak_001]
  - text: >
      Eve interrupted before Thurak could fire, stopping the confrontation.
    source_chunks: [jorgal-thurak_001]
source_chunks: [jorgal-thurak_001]
