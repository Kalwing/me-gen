scene_id: tuchanka-grunt-rite-of-passage
title: Grunt's Rite of Passage
kind: ceremony
game: Mass Effect 2
when: 2185, after Horizon, once Grunt is woken from his tank
where: Tuchanka — Clan Urdnot's camp, then the Rite grounds

participants: [Shepard, Grunt, Urdnot Wrex, Gatatog Uvenk, the Urdnot Shaman, Gatatog Warriors]
private_to: []
heard_by: [Normandy crew]

requires:
  - grunt_loyalty: any

beats:
  - text: >
      Grunt believes he is seriously ill and asks to be taken to Tuchanka for a diagnosis.
      Shepard takes it to the leader of Clan Urdnot.
    source_chunks: [grunt-rite-of-passage_001, grunt-rite-of-passage_004]
  - text: >
      The Urdnot leader explains Grunt is not sick, only of the age to take the Rite of
      Passage, and sends the party to the clan Shaman. Gatatog Uvenk, a traditionalist from
      the Urdnot border camp, protests loudly that Grunt is tank-bred and has no right to the
      Rite, going over the leader's head to appeal directly to the Shaman, who is plainly
      irritated by him. Shepard makes Uvenk back down — either humbling him with words or
      answering his insults with a headbutt — by agreeing before the Shaman to serve as
      Grunt's krantt. Uvenk withdraws his objection but warns he will settle the matter
      elsewhere.
    source_chunks: [grunt-rite-of-passage_004, gatatog-uvenk_003]
  - text: >
      The Rite runs in three waves, each summoned by striking the keystone. Varren first, in
      numbers.
    source_chunks: [grunt-rite-of-passage_005, grunt-rite-of-passage_006]
  - text: >
      Second wave: klixen, fire-breathers, dropped in by harvester.
    source_chunks: [grunt-rite-of-passage_007]
  - text: >
      Third is not a wave. It is a thresher maw, and it is meant to be survived rather than
      killed — the timer runs five minutes.
    source_chunks: [grunt-rite-of-passage_008]
  - text: >
      The Rite over, a shuttle lands carrying Uvenk and several Gatatog Warriors. Uvenk offers
      to take Grunt into Clan Gatatog — but only as a trophy and an in-name-only member, to
      raise Uvenk's own standing. Grunt, his identity, krantt and lineage disrespected,
      violently rejects the offer, and whatever Shepard says the encounter ends in a
      firefight. Shepard kills Uvenk and all the Gatatog Warriors. On the Normandy afterward
      Grunt thanks Shepard and says plainly he is glad Uvenk is dead.
    source_chunks: [grunt-rite-of-passage_009, gatatog-uvenk_003, gatatog-warrior_001]
  - text: >
      A cut Normandy conversation would have followed if Shepard had ordered Grunt not to
      speak for himself against Uvenk's offer rather than letting him answer. Grunt, now
      settled that his place as a krogan is real, tells Shepard he liked the Rite but still
      has a problem: making that decision for him "was going too far," and if Shepard
      cannot trust him with Uvenk's clumsy offer, will there be a gun at his back against
      the Collectors? Unless Shepard takes a hard line, Grunt gets annoyed at every excuse
      offered — "get consistent, Shepard... maybe I start thinking someone else should
      lead" — though his loyalty is never actually at risk.
    source_chunks: [mass-effect-2-cut-content-prologue-and-normandy-voicelines_011, grunt-rite-of-passage_016]
    conditional: {grunt_uvenk_choice: Shepard chose for Grunt}
    choice: overruled Grunt on Uvenk's offer instead of letting him answer
  - text: >
      Grunt joins Clan Urdnot. The Shaman writes to Shepard afterwards.
    source_chunks: [grunt-rite-of-passage_010, grunt-rite-of-passage_013]
  - text: >
      Wrex himself killed a thresher maw during his own Rite — the feat that made his name in
      Clan Urdnot.
    source_chunks: [urdnot-wrex_002]
  - text: >
      If Shepard never runs the Rite, Grunt earns no clan and no krantt. In Mass Effect 3,
      if Shepard then spares the rachni Queen on Utukku during Attican Traverse: Krogan Team,
      Grunt dies covering her escape.
    source_chunks: [grunt-rite-of-passage_011]

variants:
  - condition: {wrex_virmire: dead}
    choice: Wrex dead — Wreav leads Clan Urdnot
    text: >
      If Wrex was killed on Virmire or never recruited, the krogan who receives Shepard,
      explains that Grunt is not sick, and refers the party to the Shaman is his brother
      Wreav, not Wrex.
    source_chunks: [grunt-rite-of-passage_004]
  - condition: {grunt_loyalty: killed the thresher maw}
    choice: killed the thresher maw
    text: >
      Killing the maw outright rather than surviving the timer is the rarer outcome, and the
      one that gets talked about. When Uvenk arrives he first acknowledges Grunt's strength
      before making his trophy offer; if the maw was only survived, he instead tells Grunt he
      is impure and unworthy of any clan. Either way the offer ends in the fight that kills
      him.
    source_chunks: [grunt-rite-of-passage_008, gatatog-uvenk_003]

