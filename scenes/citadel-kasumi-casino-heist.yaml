beats:
  - text: >
      Kasumi, if she stayed on the Citadel after the incident with Jondum Bau and Zymandis,
      is found staging a heist in the casino Shepard had already infiltrated once. Shepard
      inspects a "suspicious device" she has installed near the varren racing games, which
      turns into a short, impromptu reunion.
    source_chunks: [silver-coast-casino_003]
  - text: >
      Shepard can let her carry on with the heist or talk her out of it.
    source_chunks: [silver-coast-casino_003]

