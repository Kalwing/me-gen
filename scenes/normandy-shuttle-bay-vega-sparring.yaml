scene_id: normandy-shuttle-bay-vega-sparring
title: Sparring with Vega in the Shuttle Bay
kind: hangout
game: Mass Effect 3
when: 2186, during the war, the first time Shepard comes down to the shuttle bay
where: the Normandy SR-2 shuttle bay, by the weapons bench and the overhead bars

participants: [Shepard, James Vega, Steve Cortez]
private_to: [Shepard, James Vega, Steve Cortez]
heard_by: [Normandy crew]

beats:
  - text: >
      Vega keeps to the shuttle bay, by a weapons bench, trading banter with his friend Steve
      Cortez between missions. The first time Shepard comes down, James is doing pull-ups on
      the overhead bars. His greeting scales to how long Shepard took to visit: soon after
      Garrus comes aboard he just takes Shepard's word about the turian because he can't tell
      them apart; if EDI has a body he asks whether Shepard is "shitting" him; if Shepard left
      it a long time he wonders aloud what the Commander is doing below decks with the
      "grunts," or asks whether they took a wrong turn at the elevator.
    source_chunks: [james-vega_010, james-vega_017]
  - text: >
      However the first meeting goes, they end up in a sparring match. If Shepard put the
      visit off for a long time, James promises to go easy, "just in case."
    source_chunks: [james-vega_010]
  - text: >
      Mid-spar, James gives the short version of his life before the Normandy. His old CO,
      Captain Toni — a hard-assed son of a bitch but a good leader — was killed with most of
      James's squad while they were protecting a civilian colony, Fehl Prime, from a Collector
      attack.
    source_chunks: [james-vega_010]
  - text: >
      With Toni dead, command fell to James. He had to choose between saving the colony or
      saving the intel his squad had recovered — intel that could be used to destroy the
      Collectors. He saved the intel and let the colony fall, then learned too late that
      Shepard had wiped out the Collectors without it. The colony died for nothing, and that
      is the guilt he carries into the war.
    source_chunks: [james-vega_010]

