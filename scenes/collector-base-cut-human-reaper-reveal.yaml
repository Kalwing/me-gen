scene_id: collector-base-cut-human-reaper-reveal
title: What EDI Explained About the Human-Reaper (Cut)
kind: mission-aside
game: Mass Effect 2
when: 2185, cut content — the Human-Reaper reveal in the Collector Base's final chamber, an alternate version that never shipped
where: the platform overlooking the Human-Reaper larva in the Collector Base
participants: [Shepard, EDI]
private_to: []
heard_by: [Normandy crew]
beats:
  - text: >
      An alternate version of the Human-Reaper reveal carried extra lore. Seeing the
      half-built shape, a squadmate said "it looks like they're building a Reaper" (the
      speaker squad-dependent), and Shepard asked EDI to confirm.
    source_chunks: [mass-effect-2-cut-content-reaper-iff-and-suicide-mission-voicelines_011]
  - text: >
      EDI explained why the captive humans had been rendered to their base components:
      "destructive analysis," dissected to the atomic level, "the knowledge and essence of
      billions of individuals compiled into a single synthetic identity." She told Shepard
      the colonists were a test sample, that the goal was to upload all humans into the
      Reaper-mind, that the Collectors would harvest every human settlement, and that "the
      obvious final goal would be Earth."
    source_chunks: [mass-effect-2-cut-content-reaper-iff-and-suicide-mission-voicelines_012]
  - text: >
      Asked why humans, EDI said the Collectors had likely tested and discarded other
      species and that human genetics were uniquely diverse; a squadmate might add that it
      could be because of Shepard personally, having stopped Sovereign, to which EDI
      answered the Collectors may see humans — and Shepard — as a unique threat worth both
      destroying and understanding.
    source_chunks: [mass-effect-2-cut-content-reaper-iff-and-suicide-mission-voicelines_013]
  - text: >
      A squadmate then pointed out the feeder tubes as the creature's weak point and EDI
      offered to uplink the chamber's turrets to the squad's weapons; Shepard put it off —
      "give us a minute, EDI. We've got to take care of some old friends first" — before
      the fight with Harbinger's Collectors.
    source_chunks: [mass-effect-2-cut-content-reaper-iff-and-suicide-mission-voicelines_014]
