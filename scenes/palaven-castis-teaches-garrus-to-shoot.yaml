scene_id: palaven-castis-teaches-garrus-to-shoot
title: Castis Teaches Garrus to Shoot
kind: downtime
game: Mass Effect
when: "Garrus's childhood, Palaven"
where: a shooting range on Palaven

participants: [Garrus Vakarian, Castis Vakarian]
private_to: [Garrus Vakarian, Castis Vakarian]
heard_by: []

requires: []

beats:
  - text: >
      Castis personally teaches a young Garrus to shoot. Garrus can't hit the targets and
      is getting tired of hefting the sniper rifle, ready to give up. Castis tells him that
      giving up when things get hard means he won't make it anywhere in life, and orders
      him to try again — imparting a father's responsibility to teach his son how to be an
      adult.
    source_chunks: [castis-vakarian_002]
  - text: >
      Years later, after Garrus joins C-Sec, he and Castis become colleagues and clash over
      a case: Castis lets a suspect go because of Garrus's rule-breaking methods. Castis
      insists on adhering to the rules — in a place with millions of people and their own
      ideas about how society works, some days only C-Sec holds it together — and tells
      Garrus to do things right or not at all. Father and son grow distant after this.
    source_chunks: [castis-vakarian_002]
  - text: >
      After the Battle of the Citadel, Garrus tracks down and physically assaults the
      suspect Castis had released. When Castis hears what happened, he threatens to lock
      his own son up personally if Garrus keeps working this way.
    source_chunks: [castis-vakarian_002]

