scene_id: citadel-michel-treats-tali-eden-prime-data
title: Michel Treats Tali After the Chase for the Geth Data
kind: mission-aside
game: Mass Effect
when: 2183, Citadel, shortly before the hunt for Saren begins
where: Dr. Michel's Med Clinic, the Upper Wards, the Citadel

participants: [Chloe Michel, Tali'Zorah nar Rayya]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      A badly wounded Tali'Zorah nar Rayya stumbles into Dr. Michel's clinic and collapses
      into her arms. Michel helps her into a corner and treats her wounds while Tali tells
      her story.
    source_chunks: [chloe-michel_002]
  - text: >
      Tali explains she obtained data linking Saren Arterius to the geth and was pursued by
      Saren's agents all the way to the Citadel to stop her from exposing it. She defeated
      her most tenacious pursuer but was shot along the way, which is how she ended up
      limping to the clinic. Michel assures her she is safe for the moment.
    source_chunks: [chloe-michel_002]
  - text: >
      A volus who overheard the story identifies himself as an information broker with a
      line to the Shadow Broker, offering to get Tali's data to the right people. Michel
      encourages Tali to trust him.
    source_chunks: [chloe-michel_002]

