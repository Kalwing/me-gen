scene_id: citadel-sha-ira-casino-consort
title: Sha'ira at the Silver Coast Casino
kind: banter
game: Mass Effect 3
when: "2186, Citadel Silversun Strip, during shore leave after the Cerberus clone conspiracy"
where: "the casino floor of the Silver Coast Casino"
participants: [Shepard, Sha'ira]
private_to: [Shepard, Sha'ira]
heard_by: [Normandy crew]
requires:
  - citadel_dlc: any
beats:
  - text: >
      While Shepard was infiltrating the Silver Coast Casino, the Commander encountered
      Sha'ira, the renowned Consort, among the casino guests on the floor. They had a
      conversation in which Sha'ira revealed she had, for a time, left the Citadel after
      years of bad press and rumors of intelligence leaks. She had retired to a small
      colony in the Silean Nebula, but returned to the Citadel after the Reaper invasion
      began, saying that "one does not flee the heart of the galaxy in desperate times,
      and certainly not because of some scoundrel with a video camera."
    source_chunks: [sha-ira_006]
  - text: >
      Sha'ira was flattered if Shepard kept coming back to her for counsel and company.
      At Shepard's curiosity, she gave a brief overview of how someone becomes a consort,
      explaining her role as advisor, confidante and companion to the powerful and
      influential. However, because she had a potential client to attend to, she kept her
      explanation brief and excused herself afterward.
    source_chunks: [sha-ira_006]
related_scenes: [citadel-sha-ira-gift-of-words]
source_chunks: [sha-ira_006]
