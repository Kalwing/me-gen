scene_id: flotilla-tali-treason-trial
title: Tali's Trial Aboard the Rayya
kind: ceremony
game: Mass Effect 2
when: 2185, some time after Tali rejoined Shepard
where: the liveship Rayya at the Migrant Fleet — the garden plaza, then the hearing chamber

participants: [Shepard, Tali'Zorah vas Normandy, Shala'Raan vas Tonbay, Han'Gerrel vas Neema, Kar'Danna vas Rayya, Kal'Reegar, Veetor'Nara]
private_to: []
heard_by: [Normandy crew]

requires:
  - tali_trial: any

beats:
  - text: >
      The Normandy is a registered Cerberus vessel and the Fleet treats it as such; only
      Tali's passphrase gets them docked with the Rayya. Captain Kar'Danna meets them with a
      marine detail — weapons raised, if Legion came along.
    source_chunks: [tali-treason_004]
  - text: >
      If Legion is present, Kar'Danna refuses it entry outright — neither geth nor Cerberus
      is welcome in the Flotilla. Shepard can Charm or Intimidate him into allowing Legion
      aboard the Rayya; otherwise Legion returns to the Normandy and Shepard picks another
      squadmate. Throughout, Danna addresses Shepard as "Captain", reasoning that a
      commanding officer's decisions on their own ship carry weight even outside the Alliance.
    source_chunks: [tali-treason_004, kar-danna-vas-rayya_002]
    conditional: {legion_present: true}
    choice: Legion allowed aboard the Rayya or left on the Normandy
  - text: >
      The charge is smuggling active geth into the Fleet. Tali had been sending deactivated
      geth samples home on the orders of her father, Admiral Rael'Zorah, and insists she took
      every precaution.
    source_chunks: [tali-treason_004, tali-zorah-nar-rayya_006]
  - text: >
      In the garden plaza Admiral Shala'Raan greets her as "Tali'Zorah vas Normandy". Tali
      hugs her — Auntie Raan, a friend of her father — then hears what the name means: she has
      been stripped of her quarian ship's name before the trial has even opened. Raan reminds
      her she is entitled to be represented by her current ship's captain, which is Shepard.
    source_chunks: [tali-treason_004]
  - text: >
      Among the Admiralty Board members is Han'Gerrel vas Neema, commander of the Heavy Fleet
      and a friend of Tali's father from their days on the gunship Yaska. Han'Gerrel sympathizes
      with Tali, believing her innocent. He becomes the sole person Shepard and Tali can confide
      in about the true nature of Rael'Zorah's experiments on the Alarei; despite his pro-war
      stance, the revelation shocks him, and he vows to keep the truth quiet to protect Rael's
      legacy and what he intended for the Fleet.
    source_chunks: [han-gerrel-vas-neema_002]
  - text: >
      The Admiralty Board reveals mid-hearing that the lab ship Alarei has been overrun by
      geth and that Tali's father, working aboard, is presumed dead. Tali refuses to accept it.
      Shepard and Tali propose to retake the Alarei; the hearing recesses pending what they
      find.
    source_chunks: [tali-treason_004, tali-treason_005]
  - text: >
      They come back to find the admirals about to declare Tali dead and judge her in
      absentia. Walking in stops that.
    source_chunks: [tali-treason_008]
  - text: >
      The Board also carries a political argument of its own about war with the geth, which
      Shepard can uncover by talking to the admirals before leaving for the Alarei.
    source_chunks: [tali-treason_008]
  - text: >
      If Kal'Reegar lived through Haestrom, he is in the crowd — one of the few quarians who
      openly respects Tali — and can be called as a character witness. Asked what the
      quarians should do about a homeworld, he says a war with the geth to retake it would be
      futile and bad for the Fleet, though he would never shirk his duty. Raan and Gerrel
      seek out his read on the trial and take his advice to let Tali retake the Alarei to win
      the crowd. If Shepard rallies the room, Reegar steps up beside Veetor'Nara, says Tali
      has done more for the Fleet than any admiral, and that if she is exiled he should be
      too. Afterward he tells Tali he only spoke because Shepard did, and notes she never
      mentioned her evidence.
    source_chunks: [kal-reegar_003, tali-treason_008]
    conditional: {kal_reegar: survived_haestrom}
    choice: Kal'Reegar survived Haestrom and testifies for Tali
  - text: >
      Whatever the verdict, the title sticks: she is Tali'Zorah vas Normandy from here on.
    source_chunks: [tali-zorah-nar-rayya_006]
  - text: >
      If Shepard submits her father's evidence to exonerate her against her wishes, Tali is
      cleared but her loyalty is lost — furious not that she was proven innocent but that
      Shepard denied her the self-sacrifice she had chosen, going into a mission she does not
      expect to survive: "I spent my whole life watching my father make decisions I didn't
      agree with... I didn't need another father back there. I needed a friend." She still
      backs Shepard but asks him not to speak to her unless he needs something, and can no
      longer be romanced.
    source_chunks: [manual-tali-zorah-vas-normandy-character-analysis-part-3-the-treason-trial-and-her-fatal-flaw_006]
    conditional: {tali_trial: cleared with her father's evidence}
    choice: presented the evidence over Tali's objection

variants:
  - condition: {tali_trial: cleared without her father's evidence}
    choice: Tali cleared without evidence
    text: >
      Shepard argues from Tali's own history that she would never betray her people — and,
      having heard the admirals out beforehand, that the trial is being worked for political
      ammunition. The Board exonerates her. Her father's evidence is never spent, and his name
      stands.
    source_chunks: [tali-treason_008, tali-treason_013]
  - condition: {tali_trial: cleared with her father's evidence}
    choice: Tali cleared with evidence
    text: >
      Shepard presents the evidence of Rael'Zorah's crimes. Tali is declared innocent and her
      father is posthumously exiled, his name struck from the rolls of every ship he served
      on, and the Fleet balkanises over what to do with the research.
    source_chunks: [tali-treason_008, tali-treason_013]
  - condition: {tali_trial: exiled}
    choice: Tali exiled
    text: >
      Shepard says no evidence was found. Tali is convicted, exiled, and given six hours to
      leave — and takes it in good spirits, having no ties left to confuse the question of
      loyalty.
    source_chunks: [tali-treason_008, tali-treason_013]

