scene_id: citadel-bailey-pallin-confrontation
title: Bailey Kills Executor Pallin
kind: argument
game: Mass Effect 3
when: "early 2186, Citadel, before the Reaper attack on Earth (Mass Effect: Inquisition)"
where: an office building on the Citadel, then Councilor Udina's office

participants: [Armando-Owen Bailey, Executor Pallin, Donnel Udina]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Hoping to take a vacation to Earth to see his child, Bailey is summoned by Councilor
      Udina, who claims C-Sec has been compromised and is working against the Council. Udina
      orders Bailey to investigate Executor Pallin, seen recently in Bailey's own precinct.
    source_chunks: [armando-owen-bailey_004]
  - text: >
      Bailey tracks Pallin to an office building and finds two dead C-Sec officers inside, one
      clutching a datapad displaying Pallin's face.
    source_chunks: [armando-owen-bailey_004]
  - text: >
      Bailey confronts Pallin, who demands the datapad and calls the accusations lies. When
      Bailey tells him to explain himself to the officers coming to arrest him, Pallin snaps
      and attacks. Bailey kills him, taking a wound to the shoulder.
    source_chunks: [armando-owen-bailey_004]
  - text: >
      Bailey reports his misgivings to Udina afterward — Pallin seemed genuinely surprised by
      the charges and had been acting strangely. Udina dismisses it as the behavior of a
      guilty man, promotes Bailey to Commander, and tells him his vacation will have to wait.
      Bailey is left saddened that he will miss visiting his child.
    source_chunks: [armando-owen-bailey_004]

