scene_id: fehl-prime-prothean-device-liara-contact
title: Treeya Contacts Liara From the Prothean Relay
kind: mission-aside
game: Mass Effect
when: "2185, Fehl Prime (Mass Effect: Paragon Lost), just before the Collector attack"
where: the colony outskirts of Fehl Prime — a jamming source and an ancient Prothean communication system

participants: [James Vega, Treeya, Messner, Essex, Liara T'Soni]
private_to: []
heard_by: [Delta Squad]

requires:
  - paragon_lost: any

beats:
  - text: >
      With Fehl Prime rebuilt and fitted with an anti-ship cannon and kinetic barriers,
      Captain Toni sends Delta Squad to trace a jamming signal on the colony outskirts.
      The asari anthropologist Treeya and the colonist Messner come along; Messner lends
      them his Mako.
    source_chunks: [mass-effect-paragon-lost_004, storyline-ii_027]
  - text: >
      At the source they find an unknown alien device. Essex destroys it with his
      biotics, to Treeya's annoyance. Treeya takes a fragment and leads the group to a
      functioning Prothean communication system, which she uses to call her mentor Liara
      T'Soni. Liara guesses the device may be Reaper technology before the link is jammed.
    source_chunks: [mass-effect-paragon-lost_004, storyline-ii_027]
  - text: >
      Treeya tells the squad she has doubts — Liara once worked with Commander Shepard and
      is fixated on Reaper myths. As they head back, the new jamming source flies overhead:
      a Collector ship, bearing down on the colony. Its Seeker Swarms paralyze the
      colonists, Captain Toni, Christine and April among them; only Delta Squad, Treeya and
      Messner, still out at the relay, stay free.
    source_chunks: [mass-effect-paragon-lost_004, storyline-ii_027]

