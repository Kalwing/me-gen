scene_id: terminus-warehouse-jacob-frees-miranda-and-lakshmi
title: Shooting Torthak to Free the Slaves
kind: mission-aside
game: Mass Effect
when: "2183, later the same day, after Miranda was captured and Jacob was wounded"
where: "Lakshmi's family hovel and a slavers' warehouse in a Terminus Systems slum"
participants: [Jacob Taylor, Miranda Lawson, Lakshmi, Taleed, Torthak]
heard_by: [Cerberus]
beats:
  - text: >
      Debris from Miranda's downed Cerberus ship killed a batarian food vendor who had just
      robbed Lakshmi of her credits; another batarian shoved her and told her to fetch her
      uncle Taleed. Meanwhile the warlord Torthak had Miranda dumped before him, knifed his
      own associate in the back to take the district, and set the newly arrived Taleed to
      guard her.
    source_chunks: [storyline-ii_012, torthak_001]
  - text: >
      An injured Jacob wandered the streets asking after Miranda. Lakshmi warned off a
      salarian-led gang with her uncle's reputation, told Jacob she knew where Miranda was
      held, and feared her captors would kill him.
    source_chunks: [jacob-taylor_005, storyline-ii_012]
  - text: >
      Lakshmi's mother took the bleeding Jacob into the family hovel to recover, on
      condition he rescue her sister and children — sold into slavery by Lakshmi's uncle
      Taleed in exchange for gang membership. Lakshmi showed Jacob her uncle's weapons
      stash; he armed up and traded his ruined armour for civilian clothes.
    source_chunks: [jacob-taylor_005, storyline-ii_012]
  - text: >
      Lakshmi guided Jacob to the warehouse and showed him a high window to look through;
      they saw Taleed being ordered to kill Miranda. Jacob told Lakshmi to head back and
      went in alone.
    source_chunks: [jacob-taylor_005, storyline-ii_012]
  - text: >
      Jacob threw a flashbang, went in through the smoke and put at least three batarians
      down with headshots. Taleed swung at him and missed; Jacob kneecapped him. Miranda
      grabbed a knife to kill Taleed, but Jacob stopped her, forced Taleed to say where the
      slaves were held, then pistol-whipped him unconscious.
    source_chunks: [jacob-taylor_005, storyline-ii_012]
  - text: >
      Jacob found the enslaved humans and sent them for the exit, where Torthak blocked the
      way holding Lakshmi hostage. Miranda taunted him, and while his attention was on her
      Jacob shot Torthak through the chest, leaving him to die on the floor.
    source_chunks: [jacob-taylor_005, storyline-ii_012, torthak_001]
  - text: >
      With Lakshmi's aunt Kali and her cousins freed — her uncle Taleed the only relative
      unaccounted for — Lakshmi hugged Jacob, gave Miranda a yellow rose, and ran off waving
      goodbye. Afterward Miranda confirmed Shepard's body was already off-world, sold to
      another bidder.
    source_chunks: [jacob-taylor_005, storyline-ii_012]
related_scenes: [terminus-street-lakshmi-meets-jacob-miranda]
source_chunks: [jacob-taylor_005, storyline-ii_012, torthak_001, lakshmi_001]
