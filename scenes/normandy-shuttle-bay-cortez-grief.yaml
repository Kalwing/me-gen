scene_id: normandy-shuttle-bay-cortez-grief
title: Cortez Grieving in the Shuttle Bay
kind: downtime
game: Mass Effect 3
when: 2186, between missions during the Reaper War
where: the Normandy SR-2's shuttle bay, by the Kodiak
participants: [Shepard, Steve Cortez]
private_to: [Shepard, Steve Cortez]
heard_by: [Normandy crew]
beats:
  - text: >
      During a mission downtime Shepard finds Lieutenant Steve Cortez alone in the shuttle bay,
      mourning his husband Robert, who was taken when the Collectors abducted the whole colony of
      Ferris Fields in 2185. Robert had phoned Steve from the doomed colony, told him to escape
      before the Collectors reached his station, and asked Steve not to come after him but to
      let him go. Steve kept the recording of that last call and works constantly to avoid
      thinking about it. Shepard can comfort him, telling him he is always there for him.
    source_chunks: [steve-cortez_006, steve-cortez_002]
  - text: >
      Shepard later persuades Cortez to take shore leave, framing it as a personal favour.
      Cortez accepts, saying he finds it hard to say "no" to Shepard.
    source_chunks: [steve-cortez_006, steve-cortez_003]
related_scenes: [citadel-cortez-docking-bay-and-memorial-wall]
source_chunks: [steve-cortez_006, steve-cortez_002, steve-cortez_003]
