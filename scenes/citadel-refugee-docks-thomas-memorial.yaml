scene_id: citadel-refugee-docks-thomas-memorial
title: A Memorial for Sarah Williams's Husband
kind: ceremony
game: Mass Effect 3
when: 2186, after the failed Cerberus coup on the Citadel
where: the Memorial Wall at the Citadel Refugee Docks holding area
participants: [Shepard, Ashley Williams, Sarah Williams]
private_to: []
heard_by: [Normandy crew]
requires:
  - virmire_survivor: Ashley
beats:
  - text: >
      Ashley Williams's youngest sister Sarah, who reached the Citadel among the war's
      refugees with their mother and two other sisters, had married a Second Lieutenant
      named Thomas stationed on Demeter. Recalled to service when the Reapers invaded
      during the couple's honeymoon, Thomas was later killed in action.
    source_chunks: [sarah-williams_003]
  - text: >
      If Ashley survived Virmire, she passes on news of the Williams family — Sarah
      included — when Shepard asks.
    source_chunks: [sarah-williams_003]
  - text: >
      After the failed Citadel coup, Sarah arranges a memorial service for Thomas at the
      Refugee Docks' Memorial Wall and asks Ashley to say some words about the Williams
      family that Thomas would have appreciated. Ashley and Shepard can attend and offer
      condolences.
    source_chunks: [sarah-williams_003]
