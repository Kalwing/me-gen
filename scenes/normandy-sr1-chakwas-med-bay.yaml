scene_id: normandy-sr1-chakwas-med-bay
title: Chakwas in the SR-1 Infirmary
kind: downtime
game: Mass Effect
when: 2183, aboard the SSV Normandy, from the Eden Prime shakedown to the flight to Ilos
where: the medical bay on the crew deck of the SSV Normandy SR-1
participants: [Shepard, Karin Chakwas]
private_to: [Shepard, Karin Chakwas]
heard_by: [Normandy crew]
requires: []
beats:
  - text: >
      Shepard first meets Chakwas as she and Corporal Jenkins are talking outside the comm
      room; she teases Jenkins that the "action" he craves usually ends with her patching
      soldiers up in her medical room.
    source_chunks: [karin-chakwas_002]
  - text: >
      After Eden Prime, when the Prothean beacon knocks Shepard unconscious, Kaidan and
      Ashley carry the Commander back to the Normandy rather than the civilian clinics on
      the colony, because Chakwas has more experience. She keeps a calm bedside manner,
      tells Shepard everything looks normal, but is unsettled by the Commander's vision and
      decides to add it to her report.
    source_chunks: [karin-chakwas_002]
  - text: >
      In later visits to the infirmary Shepard can draw her out: she has worked with Captain
      Anderson on several missions and respects his judgement — "he knows when to let things
      slide and when to crack the whip" — but has never served with Lieutenant Alenko. Asked,
      she explains the medical problems L2 biotics suffer, which gives Shepard background for
      later. The squad restocks medi-gel from her infirmary.
    source_chunks: [karin-chakwas_002]
  - text: >
      After Shepard defies Ambassador Udina's order grounding the Normandy and takes the ship
      to pursue Saren to Ilos, Chakwas remarks that it is strange being a fugitive from the
      Alliance, and gravely asks the Commander not to let the crew down, since they have
      sacrificed everything for the mission.
    source_chunks: [karin-chakwas_002]
