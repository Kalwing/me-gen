scene_id: omega-invasion-avernus-aria-dampened
title: Petrovsky Restrains Aria Aboard the Elbrus
kind: mission-aside
game: "Mass Effect: Invasion"
when: 2186, the Adjutant outbreak on Omega, before the Reaper War
where: Omega, the Cerberus starship Elbrus, and Avernus Station beyond the Omega 4 Relay
participants: [Aria T'Loak, Oleg Petrovsky, Raymond Ashe]
private_to: [Aria T'Loak, Oleg Petrovsky, Raymond Ashe]
heard_by: []
beats:
  - text: >
      A Cerberus convoy ship docked at Omega and Adjutants poured out; Aria's mercenaries
      fought them back toward Afterlife. The Cerberus starship Elbrus, under General Petrovsky
      with Colonel Raymond Ashe, arrived fast enough to make Aria suspicious and destroyed the
      remaining Adjutant-controlled Cerberus transports. The Illusive Man called Aria to admit
      the Adjutants had escaped a Cerberus base beyond the Omega 4 Relay.
    source_chunks: [aria-t-loak_009, oleg-petrovsky_003]
  - text: >
      Aria found Petrovsky and Ashe decapitating corpses; a salarian transforming into an
      Adjutant showed why. When Ashe began giving orders to Aria's men, Aria hit him with a
      biotic push and had him locked in chains for the duration of the crisis.
    source_chunks: [aria-t-loak_009, raymond-ashe_001, oleg-petrovsky_003]
  - text: >
      The defence of Omega failed. Over Aria's protests, Petrovsky took the Elbrus through the
      Omega 4 Relay to stop the outbreak at its source, Avernus Station. Aria went in with his
      squad and helped clear it, but exhausted herself shielding his people with her biotics
      and collapsed.
    source_chunks: [aria-t-loak_009, oleg-petrovsky_003]
  - text: >
      Aria woke aboard the Elbrus with biotic dampeners fitted to her hands. On the Illusive
      Man's order, Petrovsky had restrained her and intended to leave her at a research station
      so Cerberus could seize a leaderless Omega. He played her the Illusive Man's message:
      Ashe had already broken out, killed everyone in Omega Control, and let Cerberus
      reinforcements take the station. Petrovsky, uneasy, had begun to suspect the whole
      outbreak was a ruse that had cost his men.
    source_chunks: [aria-t-loak_009, oleg-petrovsky_003]
  - text: >
      Left alone when Petrovsky stepped out to confer with the Illusive Man, Aria broke the
      dampeners, single-handedly seized the Elbrus, and held Petrovsky hostage — threatening
      to flush his crew out the airlock — to force him to fly her back to Omega.
    source_chunks: [aria-t-loak_009, oleg-petrovsky_003]
related_scenes: [omega-invasion-afterlife-exile-ultimatum]
