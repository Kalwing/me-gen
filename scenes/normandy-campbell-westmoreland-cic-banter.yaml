scene_id: normandy-campbell-westmoreland-cic-banter
title: The Privates on the War-Room Door
kind: banter
game: Mass Effect 3
when: 2186, across the Reaper war, after each of Shepard's major missions
where: the doors between the CIC and the conference and war rooms aboard the Normandy SR-2
participants: [Sarah Campbell, Bethany Westmoreland]
private_to: []
heard_by: [Shepard, Normandy crew]
beats:
  - text: >
      Privates Sarah Campbell and Bethany Westmoreland stand guard on the doors between the
      CIC and the war room and pass the shifts trading opinions on the fallout of each of
      Shepard's major missions.
    source_chunks: [sarah-campbell_001, bethany-westmoreland_001]
  - text: >
      After the tepid post-Mars Council meeting Campbell cannot believe they will do
      nothing, while Westmoreland supposes Earth would have guarded its own borders if
      Thessia had been hit first. After Primarch Victus's rescue from Menae, Campbell rates
      him a good leader and praises turian tenacity; Westmoreland dryly notes he is only
      committed because Palaven is on fire. After Eve's rescue from Sur'Kesh both judge the
      salarians were outmatched by Cerberus's Reaper implants.
    source_chunks: [sarah-campbell_001, bethany-westmoreland_001]
  - text: >
      Campbell watches vids of Kalros killing a Reaper Destroyer on Tuchanka and wishes she
      had been there. After the failed coup both curse Cerberus and Councilor Udina for
      conspiring with the terrorists. On the geth-quarian war they agree losing the Migrant
      Fleet's supply lines would lose the whole war.
    source_chunks: [sarah-campbell_001, bethany-westmoreland_001]
  - text: >
      Campbell tells Westmoreland about a friend classified Category 6 and discharged after
      Eden Prime, who told her he was joining Cerberus instead; she reported it to keep the
      association off her record. Neither has any love for the organisation — Campbell needs
      a better reason than "it has scales" to kill an alien — and Campbell has heard from
      her old sergeant that Cerberus began as an Alliance black-ops arm, which leaves
      Westmoreland with a low opinion of black ops generally.
    source_chunks: [sarah-campbell_001, bethany-westmoreland_001]
  - text: >
      Both briefly lose heart after Thessia; the success on Horizon restores it, and they
      call the Cerberus troops there inhuman for volunteering for Reaper tech. Once Cerberus
      is destroyed Campbell asks Westmoreland if she is ready for Earth, and Westmoreland
      does not want to tell her future grandchildren she spent the war guarding a door.
    source_chunks: [sarah-campbell_001, bethany-westmoreland_001]
  - text: >
      Campbell keeps a favourite mug for her shifts. With the crew gone during the
      Normandy's hijacking by Shepard's clone, Shepard can recover the mug on the way to
      retake the ship.
    source_chunks: [sarah-campbell_001]
