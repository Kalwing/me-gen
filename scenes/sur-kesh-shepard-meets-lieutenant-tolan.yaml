scene_id: sur-kesh-shepard-meets-lieutenant-tolan
title: Shepard Meets Lieutenant Tolan
kind: banter
game: Mass Effect 3
when: "2186, Priority: Sur'Kesh, after Kirrahe's death on Virmire in 2183"
where: the salarian STG facility on Sur'Kesh
participants: [Shepard, Tolan]
requires:
  - kirrahe_fate: dead
beats:
  - text: >
      If Captain Kirrahe did not survive the Virmire mission, Shepard encounters
      Lieutenant Tolan instead when arriving at the STG facility. Tolan initially appears
      pleased to meet Shepard, but then refuses to shake the Commander's hand and expresses
      misgivings about curing the genophage. He voices suspicion toward Shepard's determination
      to fight the Reapers, an isolationist and imperialist outlook resembling the salarian
      government's cautious stance on the Reaper threat. He laments that the revelation of
      the cured krogan will force the salarians into the war against their strategic interests.
      Tolan admits he had wanted to execute the female krogan to keep the genophage cure
      secret, but was overruled by the scientists on his team. Despite his reservations,
      Tolan and his STG squad later join the war effort.
