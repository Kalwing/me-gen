scene_id: nepmos-listening-post-durand
title: Holding the Line with Lieutenant Durand on Nepmos
kind: mission-aside
game: Mass Effect
when: 2183, after Noveria opened the Styx Theta cluster, days into a rachni siege
where: Listening Post Alpha on Nepmos in the Erebus system — barricade platforms outside the post, then the rachni-infested mine nearby
participants: [Shepard, Marie Durand, Alliance marines]
private_to: []
heard_by: [Normandy crew]
beats:
  - text: >
      First Lieutenant Marie Durand, acting commander of the 3rd Brigade, 14th Regiment
      on Nepmos, sent a mayday when her listening post came under sustained attack. Shepard
      landed and drove up to find three marines on barricade platforms holding off a swarm
      of rachni; entering the system had triggered Durand's distress call.
    source_chunks: [marie-durand_001, unc-listening-post-alpha_004]
  - text: >
      The rachni — all Rachni Soldiers boiling out of holes in front of the post — came in
      three waves with two one-minute lulls. Shepard could power the base's twin rocket
      turrets by hooking the Mako to the camp generator (which disabled the vehicle), or
      fight on foot from the marines' platforms. During the lulls Durand told Shepard the
      assault had run for days and that the marines left were all that remained of a
      platoon of ninety. She was blunt that it made no difference to her that the "animals"
      were a sentient species; they were still deadly.
    source_chunks: [unc-listening-post-alpha_004, marie-durand_001]
  - text: >
      After the third wave a marine reported that a UAV had found a hollow space about
      500 metres down — the main rachni nest. Durand was reluctant to send Shepard alone
      but had no one to spare. If Shepard had not already been there, she also asked the
      Commander to check the other listening post in the Acheron system, which had gone
      silent; Shepard could brief her on Depot Sigma-23 if it had been investigated, and,
      under the right conditions, tell her the Citadel and Fifth Fleets were hunting the
      Normandy.
    source_chunks: [unc-listening-post-alpha_004, marie-durand_001]
  - text: >
      Shepard cleared the nearby infested mine alone with the squad — twenty-odd rachni in
      the main chamber, then Rachni Soldiers and stasis-throwing Brood Warriors in the two
      branch tunnels — and killing both Brood Warriors ended the infestation on the planet.
      There was nothing new to say to Durand afterward.
    source_chunks: [unc-listening-post-alpha_005]
related_scenes: []
