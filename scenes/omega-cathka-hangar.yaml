scene_id: omega-cathka-hangar
title: Cathka and the Gunship Repairs
kind: mission-aside
game: Mass Effect 2
when: 2185, Omega, Archangel recruitment mission
where: The gunship hangar near the third barricade on Omega
participants: [Shepard, Cathka]
private_to: [Shepard, Cathka]
requires:
  - garrus_recruitment: any
beats:
  - text: >
      During the mission to recruit the vigilante Archangel, Shepard encountered
      Sergeant Cathka, a batarian Blue Suns mechanic, at the gunship hangar near the
      third barricade. Cathka recognized Shepard's team because Salkie had radioed
      earlier that this particular group stood out from the other freelancers. Taking a
      cigarette break from his repair work on the gunship, Cathka willingly answered
      Shepard's questions about the Blue Suns' plan to kill Archangel. He explained
      that the freelancers were expendable distractions meant to occupy Archangel while
      the infiltration team either moved in to kill him at close quarters or rigged his
      base with explosives. He noted that the bridge was the only way in unless the
      infiltrators cleared the blocked tunnels or the gunship, to be flown by Blue Suns
      leader Tarak, was returned to service. Cathka assured Shepard the infiltration
      team would do its part if the freelancers did theirs, though he had no time for
      "great ideas" from freelancers, considering the Blue Suns' plan solid.
    source_chunks: [cathka_001]
  - text: >
      When the call came to send in the next wave of freelancers, Cathka relayed it and
      directed the group with him, remarking that Archangel was in for a surprise and
      that he should get back to work. Shepard had the option to incapacitate Cathka
      with a sparking tool lying nearby, preventing him from completing the gunship
      repairs.
    source_chunks: [cathka_001]
related_events: [garrus-recruitment-archangel]
source_chunks: [cathka_001]
