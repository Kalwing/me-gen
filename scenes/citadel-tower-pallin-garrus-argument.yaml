scene_id: citadel-tower-pallin-garrus-argument
title: Pallin Pulls Garrus Off the Saren Case
kind: argument
game: Mass Effect
when: 2183, Shepard's first visit to the Citadel, around the Council's hearing on Saren
where: the Citadel Tower, and afterward Executor Pallin's office on the Presidium
participants: [Shepard, Garrus Vakarian, Venari Pallin]
private_to: []
heard_by: []
requires: []
beats:
  - text: >
      Shepard comes upon Executor Venari Pallin, the turian head of C-Sec, arguing with
      C-Sec investigator Garrus Vakarian in the Citadel Tower. Pallin had assigned Garrus to
      investigate Saren Arterius after the attack on Eden Prime; with nothing conclusive
      found and Garrus demanding more time, Pallin has ordered him off the case.
    source_chunks: [venari-pallin_001, venari-pallin_002]
  - text: >
      Pallin, a thirty-year C-Sec veteran, makes no secret of his views to Shepard — the
      first human Spectre — disliking Spectres and humans alike. He mistrusts anyone who
      acts above the law and says he has never had to break the law to do his job. When
      Shepard argues the galaxy sometimes needs people like the Spectres, Pallin concedes
      the point but insists they be held to a higher standard, or the Council will end up
      with more agents like Saren.
    source_chunks: [venari-pallin_002]
