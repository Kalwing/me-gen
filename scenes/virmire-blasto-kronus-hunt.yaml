scene_id: virmire-blasto-kronus-hunt
title: Hunting Kronus on Virmire
kind: mission-aside
game: Mass Effect
when: During Spectre operations, after Kronus's escape from a prison ship
where: Citadel (briefing room), then a secret facility on Virmire
participants: [Blasto, Cerulean Star, turian Spectre handler, Kronus]
private_to: [Blasto, Cerulean Star]
heard_by: [Citadel Council, Spectre hierarchy]
beats:
  - text: >
      Blasto returns to the Citadel after defeating batarian mercenaries. His turian handler briefs him on the mad krogan scientist Kronus, who has escaped—three Spectres sent after him have turned up dead, including one dispatched to the prison ship where Blasto had personally held him. The handler orders Blasto to Virmire in the Hoc system, Kronus's likely hideout. Concerned about losing another Spectre, the handler introduces Blasto to Cerulean Star, a famed asari actress who is secretly also a Spectre.
    source_chunks: [mass-effect-blasto-eternity-is-forever_002]
    choice: paired with Cerulean Star
  - text: >
      En route to Virmire, Blasto explains that the planet's uninhabitable reputation after a nuclear blast makes it the perfect hideout. Scans confirm a newly built structure on an island. Inside, Blasto and Cerulean Star encounter krogan patrols and dispatch them. Cerulean Star discovers from a console that Kronus is building a machine to freeze time. While she stays to disable it, Blasto confronts Kronus, who freezes him in place with a gauntlet and taunts that he'll be trapped for eternity.
    source_chunks: [mass-effect-blasto-eternity-is-forever_002]
  - text: >
      Two krogans bring Cerulean Star in as a captive, but she reveals Kronus underestimated her, breaks free, and forces him at gunpoint to unfreeze Blasto. Kronus activates the facility's self-destruct and flees; an explosion knocks him over a railing to his death. Blasto and Cerulean Star escape as the facility explodes and swim to shore. Blasto acknowledges she was more capable than he expected. Cerulean Star notes that asari believe in embracing eternity; Blasto replies embracing is what he excels at.
    source_chunks: [mass-effect-blasto-eternity-is-forever_002]
    choice: Cerulean Star freed Blasto, Kronus killed
