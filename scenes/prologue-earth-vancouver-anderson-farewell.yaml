scene_id: prologue-earth-vancouver-anderson-farewell
title: Anderson Stays Behind as the Normandy Leaves Earth
kind: mission-aside
game: Mass Effect 3
when: "2186, Vancouver, Earth, the first hours of the Reaper invasion (Prologue: Earth)"
where: a Systems Alliance HQ tower in Vancouver, then the ruined streets and spaceport, then the Normandy SR-2 shuttle bay
participants: [Shepard, David Anderson, James Vega]
heard_by: [Normandy crew]
requires:
  - game: Mass Effect 3
beats:
  - text: >
      Six months after Bahak, Shepard was under arrest and relieved of command in Vancouver.
      Anderson escorted the Commander, with Lieutenant James Vega, into a Systems Alliance
      defense committee meeting, where Shepard confirmed the committee's fear that the Reapers
      had returned and were coming for Earth. Contact was lost with Luna Base mid-meeting; a
      Reaper capital ship then descended over the city and blasted the tower, killing the
      committee and staff. Only Shepard and Anderson walked out.
    source_chunks: [storyline-iii_021]
  - text: >
      Anderson handed Shepard an M-3 Predator pistol and the two crossed the rooftops of
      burning Vancouver while Oculi tore Alliance fighters apart overhead. They raised the
      Virmire survivor — Ashley Williams or Kaidan Alenko — by radio and told them to get to
      the Normandy. Along the way Shepard saw a child alone, who refused help and fled into a
      building; Shepard fought husks hand to hand and, further on, the war's first Cannibals
      beside two Alliance soldiers, then reached a comm unit by a crashed gunship and hailed
      the Normandy, which bombed the area clear.
    source_chunks: [prologue-earth_002, storyline-iii_021]
  - text: >
      As Shepard moved to board, Anderson refused to leave — a million more survivors like
      the men behind them needed a leader — and stayed on Earth to raise a resistance. He
      threw Shepard the dog tags that reinstated the Commander in the Alliance and charged
      Shepard with bringing back help from the Council. Shepard protested; Anderson did not
      change his mind.
    source_chunks: [prologue-earth_002, storyline-iii_021, david-anderson_011]
  - text: >
      From the lifting Normandy Shepard watched the same child climb into an evac Kodiak. A
      Reaper Destroyer rose over the buildings and shot the shuttle down, killing everyone
      aboard, the boy included. Shepard stepped back from the open bay doors as the ship
      cleared Vancouver past the burning wreckage of the human fleets.
    source_chunks: [prologue-earth_002, commander-shepard_008]
  - text: >
      Aboard ship, James Vega was incredulous that Shepard meant to follow Anderson's order
      and leave Earth to beg the Council for aid; the argument allowed a Paragon or Renegade
      interrupt. Admiral Hackett then contacted Shepard by comm and assigned the next mission,
      Priority: Mars.
    source_chunks: [prologue-earth_002]
