scene_id: bekenstein-kasumi-and-the-graybox
title: The Heist at Donovan Hock's
kind: mission-aside
game: Mass Effect 2
when: 2185
where: Donovan Hock's lakeside estate on Bekenstein

participants: [Shepard, Kasumi Goto, Donovan Hock, Chief Roe]
private_to: []
heard_by: [Normandy crew]

requires:
  - kasumi_loyalty: any

beats:
  - text: >
      Kasumi wants her old partner's graybox back. Donovan Hock — weapons dealer, smuggler —
      took it, and she means to get it.
    source_chunks: [kasumi-goto_004]
  - text: >
      Hock killed her partner Keiji Okuda, and is trying to break into the graybox: a neural
      implant holding Keiji's personal memories along with every secret he ever saw. One of
      them implicates the Alliance badly enough to start a war.
    source_chunks: [kasumi-goto_004]
  - text: >
      Only Shepard and Kasumi go. On the ride over Kasumi briefs the plan: they attend Hock's
      party under a forged identity — Solomon or Alison Gunn — in formal wear, with their
      weapons and armour hidden inside a golden statue of Saren offered as tribute.
    source_chunks: [kasumi-stealing-memory_004]
  - text: >
      At the door a guard scans the statue and turns up nothing; Hock comes out, welcomes
      "Gunn", but bars Kasumi because he does not like the way she looks. Kasumi cloaks and
      walks in beside Shepard anyway.
    source_chunks: [kasumi-stealing-memory_005, donovan-hock_003]
  - text: >
      Kasumi examines the vault door and names three things needed to open it: a recording of
      Hock's voice, a sample of his DNA, and the power cut to the kinetic barrier. Shepard
      draws Hock into a self-satisfied speech about the "cleaners" who keep the galaxy
      spinning — the guests give him a standing ovation — which supplies the voiceprint.
    source_chunks: [kasumi-stealing-memory_006, donovan-hock_003]
  - text: >
      For the DNA, Shepard either talks the guard Samuels into granting access to Hock's
      private quarters, with Kasumi impersonating security chief Roe over the comm, or breaks
      in from the balcony past three Eclipse guards; inside, Shepard scans Hock's effects for
      a usable sample. Shepard then pulls a statue by the fireplace to kill the barrier's
      power.
    source_chunks: [kasumi-stealing-memory_006, eclipse-security-guard_001, chief-roe_001]
  - text: >
      In the vault — stocked with stolen art including Michelangelo's David and the head of
      the Statue of Liberty — Shepard and Kasumi arm up and take the graybox. A holographic
      Hock threatens them while Kasumi starts cracking it, then Chief Roe leads an Eclipse
      assault into the vault; Roe is killed in the fighting.
    source_chunks: [kasumi-stealing-memory_008, chief-roe_001]
  - text: >
      They fight out through a garage full of YMIR mechs, past a parked M-080 mass
      accelerator, and onto a landing platform, where Hock attacks in a shielded A-61 Mantis
      gunship backed by mercs and LOKI mechs. Kasumi gets in close and disables the
      gunship's shield; she and Shepard shoot it down, killing Hock in the explosion.
    source_chunks: [kasumi-stealing-memory_009, kasumi-stealing-memory_011, kasumi-stealing-memory_012, donovan-hock_003]
  - text: >
      On the ride back, Kasumi examines the graybox and is shown her own memories of Keiji,
      along with a warning that the information inside — evidence of an Alliance black ops
      raid on a batarian lab studying Reaper technology, one that turned into a massacre the
      Alliance then covered up — could be dangerous if made public. Shepard can persuade her
      to keep it or destroy it; either way, Kasumi is loyal.
    source_chunks: [kasumi-stealing-memory_013]
  - text: >
      Kasumi keeps the graybox, preserving what's left of Keiji with her.
    source_chunks: [kasumi-stealing-memory_017, kasumi-goto_005]
    conditional: {graybox_fate: kept}
    choice: graybox kept
  - text: >
      Kasumi destroys the graybox, and with it the last of Keiji's memories.
    source_chunks: [kasumi-stealing-memory_017]
    conditional: {graybox_fate: destroyed}
    choice: graybox destroyed

