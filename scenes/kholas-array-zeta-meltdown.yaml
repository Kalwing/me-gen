scene_id: kholas-array-zeta-meltdown
title: Agent Zeta's Meltdown on the Kholas Array
kind: mission-aside
game: Mass Effect
when: during Andromeda Initiative recruitment mission, after Omega
where: the outer hull of the Kholas Array, a geth relay structure at the edge of the Milky Way
participants: [Tiran Kandros, Shio'Leth vas Novarra, Agent Zeta]
requires:
  - game: Mass Effect
beats:
  - text: >
      Having confessed to Tiran that he fled the Andromeda Initiative because he knew his
      golden-worlds calculations were flawed and could not bear sending 100,000 colonists
      to their deaths, Shio returns to the geth-held Kholas Array with Tiran to correct the
      data. They dock meters from where Agent Zeta already stands — Zeta having tortured the
      array's location out of Shio on Omega and come believing it holds technology to
      contain his failing biotics.
    source_chunks: [storyline-iv_015, shio-leth-vas-novarra_003]
  - text: >
      Zeta wages a one-salarian war against swarms of geth platforms on the hull. Shio runs
      for the access port to recalculate the data; Tiran decides to improve their odds by
      fighting alongside Zeta against the geth. When Zeta notices Shio slip past and asks
      why the quarian went instead of him, Tiran plays the sympathy card — he promised to
      protect Shio — and appeals for Zeta's help. (One account instead names Sanjin Vinnick,
      not Tiran, at Shio's side and doing the persuading.)
    source_chunks: [storyline-iv_015, olan-kooth_003]
  - text: >
      Shio reactivates the array and redownloads the true coordinates, nearly ambushed by
      two geth platforms before Tiran and Zeta cut them down. Zeta begs Shio to show him
      how the array's technology can save his life; Shio tells him there is nothing there
      for him, as the geth built nothing with organics in mind.
    source_chunks: [storyline-iv_015, shio-leth-vas-novarra_003]
  - text: >
      Resigned and already a crucible of roiling biotic energy, Zeta refuses to answer to
      his birth name and orders Tiran and Shio to run. They escape on their Kodiak as Zeta
      undergoes a full biotic meltdown; any damage to the structure is unclear.
    source_chunks: [storyline-iv_015, olan-kooth_003, kholas-array_001]
related_scenes: [omega-shanks-tiran-zeta-final, novarra-mining-ship-agent-zeta]
source_chunks: [storyline-iv_015, olan-kooth_003, shio-leth-vas-novarra_003, kholas-array_001]
