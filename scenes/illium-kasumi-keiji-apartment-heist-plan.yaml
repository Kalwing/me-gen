scene_id: illium-kasumi-keiji-apartment-heist-plan
title: Little Bird and the Bekenstein Job
kind: downtime
game: "Mass Effect: Foundation"
when: before 2185, two days before Keiji Okuda's death, shortly after his espionage acquittal
where: Kasumi and Keiji's apartment on Illium
participants: [Kasumi Goto, Keiji Okuda]
private_to: [Kasumi Goto, Keiji Okuda]
heard_by: []
requires: []
beats:
  - text: >
      Freshly acquitted of graybox-assisted espionage on a technicality, Keiji comes home to
      the Illium apartment, finds it dark, and switches on the lights to a room Kasumi has
      decorated for a romantic evening. He holds out his hands to feel for her; she decloaks
      in front of him and they kiss.
    source_chunks: [keiji-okuda_002, storyline_022]
  - text: >
      They talk about the trial. Kasumi admits she was there, cloaked, worried for him the
      whole time, and repeats that she wants to stay at his side. She is tired of him working
      for the "boring" Alliance and wants a fresh start.
    source_chunks: [kasumi-goto_002, keiji-okuda_002]
  - text: >
      Keiji opens his omni-tool and shares the plan for their next job: a heist on Bekenstein
      against the arms dealer Donovan Hock, which he says will take every skill they have.
      Kasumi, who has never been to Bekenstein, is easily won over, and they spend the night
      together before setting out.
    source_chunks: [kasumi-goto_002, keiji-okuda_002, storyline_022]
