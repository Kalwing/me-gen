scene_id: sidon-saren-interrogates-jella-hospital
title: Saren Interrogating Jella in the Hospital
kind: argument
game: Mass Effect
when: "after the attack on Dah'tan Manufacturing on Camala, early in Mass Effect: Revelation"
where: a hospital room on Camala
participants: [Saren Arterius, Jella]
private_to: [Saren Arterius, Jella]
heard_by: []
requires: []
beats:
  - text: >
      Saren Arterius, tracking Edan Had'dah, visited the ruins of the Dah'tan Manufacturing
      facility and then went to see Jella while she was undergoing treatment. Though she was
      in a medically-induced coma, Saren sent the medical staff away and woke her to question
      her. Despite her life-threatening injuries from the explosion and fire, Jella gave him
      Edan Had'dah's name, identifying the traitor Saren had been hunting.
    source_chunks: [jella_001]
  - text: >
      After obtaining the information he needed, Saren deliberately withheld an injection
      that could have returned Jella to her coma and eased her suffering. He waited until she
      died, then administered the fluid afterward in order to cover his tracks and conceal
      that he had ever been there.
    source_chunks: [jella_001]
