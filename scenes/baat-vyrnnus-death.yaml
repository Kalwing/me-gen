scene_id: baat-vyrnnus-death
title: Rahna's Broken Arm and the Death of Vyrnnus
kind: argument
game: Mass Effect
when: 2168, Gagarin Station ("Jump Zero"), during the BAaT biotic training programme
where: a dorm, mess hall and training room at Biotic Acclimation and Temperance Training

participants: [Kaidan Alenko, Commander Vyrnnus, Rahna, Shelby]
private_to: [Kaidan Alenko, Commander Vyrnnus, Rahna, Shelby]

beats:
  - text: >
      BAaT students are barred from outside contact. The cadet Shelby rigs a transmitter
      to send messages home to Earth; Kaidan brings his close friend Rahna along to use
      it. Kaidan messages his parents; Rahna declines, reasoning her family would only
      report it. Over water rations the next day they are still talking it over.
    source_chunks: [mass-effect-foundation-4_004, kaidan-alenko_003]
  - text: >
      The turian instructor Commander Vyrnnus — a mercenary hired to accelerate the
      trainees — musters the cadets to the training room, where Shelby is tied to a post
      as an example. He sets them to biotically assembling building blocks for hours,
      forcing a restart on any mistake; students collapse from exhaustion.
    source_chunks: [mass-effect-foundation-4_004, kaidan-alenko_003]
  - text: >
      When Rahna falters, Kaidan catches her falling piece. Vyrnnus notices, and taunts
      the thirsty Rahna by floating a glass of water within her reach. She grabs it with
      her hand instead of biotics; Vyrnnus breaks her arm as punishment.
    source_chunks: [mass-effect-foundation-4_004, rahna_002, kaidan-alenko_003]
  - text: >
      Kaidan flies into a biotic rage that knocks Vyrnnus down. In the duel that follows
      Vyrnnus draws a knife and slashes Kaidan's right side; Kaidan answers with a heavy
      biotic blast and a jump-kick to the head that kills him. The other cadets look on in
      horror.
    source_chunks: [mass-effect-foundation-4_004, vyrnnus_003, kaidan-alenko_003]
  - text: >
      Rahna, more frightened of Kaidan now than she ever was of Vyrnnus, refuses to let
      him near her. On the day he is expelled from BAaT, guards let him have a minute to
      say goodbye; the two do not reconcile — Rahna says killing the problem did not make
      things right, apologizes only for being scared of him, and walks away with a wave.
      The Alliance shuts BAaT down and seals its records to bury its own culpability. A
      month later on Earth, Kaidan's father tells him that even right choices carry
      consequences.
    source_chunks: [mass-effect-foundation-4_004, rahna_003, kaidan-alenko_003, vyrnnus_001]

related_events: [baat-vyrnnus-death]
