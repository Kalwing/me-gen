beats:
  - text: >
      Luna Shanks and Sanjin Vinnick arrive on the Citadel to search for quarian scientist
      Shio'Leth vas Novarra. Using her biotics and physical strength, Shanks interrogates
      denizens of the seedy lower ward. She headlocks a duct rat who eventually directs them
      to the lower ward flophouses.
    source_chunks: [luna-shanks_001]
  - text: >
      At the flophouses, Shanks and Vinnick find only a wrecked hovel and ruins. Surveying
      the damage, Shanks determines that someone else is actively searching for Shio. They
      discover an encrypted datapad among the debris. Vinnick examines it and tells Shanks
      that the Migrant Fleet may be able to assist them in decrypting it.
    source_chunks: [luna-shanks_001]
