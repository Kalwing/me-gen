scene_id: citadel-eddie-lang-c-sec-fan
title: Shepard's C-Sec Fan
kind: banter
game: Mass Effect
when: 2183, Shepard's first visit to the Citadel
where: a skycar parking lot in the Wards, near the C-Sec Academy elevator
participants: [Shepard, Eddie Lang]
heard_by: [Normandy crew]
beats:
  - text: >
      Officer Eddie Lang, standing guard by the skycar lot, greeted Shepard eagerly because he
      had heard of the Commander's record; Shepard's squadmates teased that Shepard had a fan.
    source_chunks: [eddie-lang_001]
  - text: >
      Answering Shepard's questions, Lang said he had joined C-Sec partly out of family
      tradition, his grandfather having been a police officer on Earth, that he had lived on the
      station about a year without seeing a tenth of it, that he liked the Wards, and that
      Shepard should visit Flux.
    source_chunks: [eddie-lang_001]
  - text: >
      Lang told Shepard that many C-Sec officers dislike Spectres despite the heroic vid
      portrayals. Asked about the suspended C-Sec officer Harkin, he grew uneasy, said he had no
      right to criticise, and offered only: "They suspended him, so some of it must be true."
    source_chunks: [eddie-lang_001]
source_chunks: [eddie-lang_001]
