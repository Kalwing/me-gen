scene_id: tuchanka-mordin-and-maelon
title: Mordin, Maelon, and the Weyrloc Hospital
kind: mission-aside
game: Mass Effect 2
when: 2185, during Mordin's time aboard the Normandy
where: Tuchanka — Clan Urdnot's camp, then a hospital turned Weyrloc fortress

participants: [Shepard, Mordin Solus, Maelon]
private_to: []
heard_by: [Normandy crew]

requires:
  - mordin_loyalty: any

beats:
  - text: >
      Mordin hears his old assistant Maelon has been taken on Tuchanka, and is afraid of what
      the krogan will do if they learn Maelon helped modify the genophage.
    source_chunks: [mordin-solus_005]
  - text: >
      Clan Urdnot's Chief Scout places him: taken by Clan Weyrloc, held in a hospital they
      have turned into a fortress.
    source_chunks: [mordin-solus_005]
  - text: >
      Weyrloc wanted Maelon's work to build a genophage cure and then conquer the galaxy, and
      was getting there by brutal experimentation on kidnapped subjects.
    source_chunks: [mordin-solus_005]
  - text: >
      One of the test subjects was a female krogan who volunteered, hoping to become fertile.
      Mordin finds her body in a lab. It is the clearest thing he has been shown about what his
      own work did.
    source_chunks: [mordin-solus_005]
  - text: >
      Maelon turns out to be alive, unharmed, and helping Weyrloc on purpose, out of guilt.
      Mordin can kill him for it or be stopped, and his research data can be saved or
      destroyed.
    source_chunks: [mordin-solus_005]
  - text: >
      Mordin's own accounting of himself: he has killed many people by many methods —
      gunfire, knives, drugs, tech attacks, once with farming equipment — but not with
      medicine.
    source_chunks: [mordin-solus_005]

related_scenes: [tuchanka-grunt-rite-of-passage]
related_events: []
source_chunks: [mordin-solus_005]
