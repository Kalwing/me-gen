scene_id: tuchanka-mordin-and-maelon
title: Mordin, Maelon, and the Weyrloc Hospital
kind: mission-aside
game: Mass Effect 2
when: 2185, during Mordin's time aboard the Normandy
where: Tuchanka — Clan Urdnot's camp, then a hospital turned Weyrloc fortress

participants: [Shepard, Mordin Solus, Maelon, Chief Weyrloc Guld, Weyrloc Clanspeaker, Urdnot Darg]
private_to: []
heard_by: [Normandy crew]

requires:
  - mordin_loyalty: any

beats:
  - text: >
      Mordin hears his old assistant Maelon has been taken on Tuchanka, and is afraid of what
      the krogan will do if they learn Maelon helped modify the genophage.
    source_chunks: [mordin-solus_005]
  - text: >
      Clan Urdnot's Chief Scout places him: taken by Clan Weyrloc, held in a hospital they
      have turned into a fortress. The Chief Scout also asks Shepard to look for one of his
      missing scouts, Urdnot Darg.
    source_chunks: [mordin-solus_005, urdnot-darg_001]
  - text: >
      Weyrloc wanted Maelon's work to build a genophage cure and then conquer the galaxy, and
      was getting there by brutal experimentation on kidnapped subjects.
    source_chunks: [mordin-solus_005]
  - text: >
      One of the test subjects was a female krogan who volunteered, hoping to become fertile.
      Mordin finds her body in a lab. It is the clearest thing he has been shown about what his
      own work did.
    source_chunks: [mordin-solus_005]
  - text: >
      Inside the hospital the Weyrloc Clanspeaker blocks the way, saying Guld — the chief of
      chiefs — has granted the crew one chance to flee for the Weyrloc blood already spilled.
      Shepard refuses, and the Clanspeaker launches into a long speech about Weyrloc's plans
      once the genophage is cured: plunging the Citadel into a star, keeping salarians as
      slaves and eating their eggs as a delicacy. A Renegade interrupt lets Shepard shoot the
      leaking gas pipe below him; he mocks the missed first shot, then the second shot ignites
      the gas and incinerates him, taking him out of the fight that follows. Otherwise he
      fights on with Weyrloc Clanguards and Blood Pack troopers.
    source_chunks: [weyrloc-clanspeaker_001, mordin-old-blood_008, chief-weyrloc-guld_001]
    conditional: {clanspeaker_fate: burned}
    choice: Renegade interrupt burns the Weyrloc Clanspeaker
  - text: >
      Shepard fights through the remaining Weyrloc soldiers and kills Chief Weyrloc Guld
      himself.
    source_chunks: [chief-weyrloc-guld_001]
  - text: >
      Shepard finds Urdnot Darg in the Weyrloc camp: the Blood Pack had captured him and
      tricked him into becoming one of Maelon's poisoned test subjects. Shepard can persuade
      him to abandon the krogan cause and return to Urdnot as a warrior, or leave him.
      Persuaded, he later emails Shepard from the female camp, thanks the Commander for
      pulling him out, and says he will stay with Urdnot rather than join the Blood Pack.
    source_chunks: [urdnot-darg_001, mordin-old-blood_014]
    conditional: {urdnot_darg: returned}
    choice: Darg persuaded to return to Urdnot
  - text: >
      Back at Clan Urdnot's camp, the Chief Scout tells Shepard that Guld's followers saw
      him as a leader with a destiny because he had two living children, one a girl — having
      even one surviving child was rare under the genophage. The Chief Scout dismisses the
      idea it meant anything, calling it luck.
    source_chunks: [chief-weyrloc-guld_001]
  - text: >
      Maelon turns out to be alive, unharmed, and helping Weyrloc on purpose, out of guilt:
      his hands are already bloody, and he thinks undoing the genophage is worth a little
      more. Mordin confronts him over his methods and motives, then charges him and pulls a
      gun. A Paragon interrupt stops Mordin from shooting; otherwise Mordin kills him.
      Shepard then talks Mordin into destroying Maelon's research data or keeping it — to
      help the krogan, or "just in case."
    source_chunks: [mordin-solus_005, mordin-old-blood_011]
  - text: >
      Mordin's own accounting of himself: he has killed many people by many methods —
      gunfire, knives, drugs, tech attacks, once with farming equipment — but not with
      medicine.
    source_chunks: [mordin-solus_005]

