beats:
  - text: >
      Rear Admiral Jon Grissom was en route to Arcturus Station to meet the new graduates of
      the N7 program. As he arrived, news broke of the attack on the human colony of Shanxi
      by the turian military—the opening action of the First Contact War. Grissom encountered
      one of the N7 graduates, David Anderson, and the two discussed the developing military
      situation and its implications for humanity's place in the galaxy.
