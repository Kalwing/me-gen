scene_id: normandy-engineering-gabby-and-kenneth
title: Down in Engineering with Gabby and Kenneth
kind: banter
game: Mass Effect 2
when: 2185, across the run-up to the Omega 4 Relay
where: the engineering deck of the Normandy SR-2

participants: [Shepard, Gabriella Daniels, Kenneth Donnelly]
private_to: []
heard_by: [Normandy crew]

requires: []

beats:
  - text: >
      They graduated the same class at a tech academy and served together on the SSV Perugia
      at the Battle of the Citadel. When the Alliance buried the Reapers afterwards, Kenneth
      defended Shepard loudly enough to border on insubordination — not court-martialled only
      because he was too good an engineer — and that is what got the Illusive Man's attention.
    source_chunks: [gabriella-daniels_002, kenneth-donnelly_002]
  - text: >
      Gabby made her own inclusion a condition of his Cerberus contract, on the grounds that
      he would fall apart without her. She also just loves starship engines and was not going
      to pass up the SR-2.
    source_chunks: [gabriella-daniels_002]
  - text: >
      Neither of them seems to know much about what Cerberus actually does. Kenneth's stated
      reason for signing on is to kick the Collectors right in the daddy-bags.
    source_chunks: [kenneth-donnelly_002]
  - text: >
      Their standing maintenance headache is the FBA arrays. Kenneth starts on the full
      technical description; Gabby cuts him off and tells Shepard they need FBA couplings. Buy
      them and Kenneth invites the Commander to a game of Skyllian-five poker, which Shepard
      can join, decline, or forbid outright.
    source_chunks: [kenneth-donnelly_002]
  - text: >
      Kenneth comments on the women aboard — Tali's suit fitting in all the right places,
      Jack being simultaneously attractive and vicious, Miranda's uniform — and Gabby scolds
      him every time. After Jack comes aboard she teases him about the new crew member who
      wears nothing but tattoos from the waist up, waits until he means to go introduce
      himself, and then mentions the murders.
    source_chunks: [kenneth-donnelly_002, gabriella-daniels_002]
  - text: >
      Both of them are taken when the Collectors board the Normandy, and both die if the
      rescue comes too late.
    source_chunks: [gabriella-daniels_002, kenneth-donnelly_002]

