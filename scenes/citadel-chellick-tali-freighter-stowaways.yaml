scene_id: citadel-chellick-tali-freighter-stowaways
title: Chellick Processes Tali and a Stowaway Off a Turian Freighter
kind: mission-aside
game: Mass Effect
when: before the events of Mass Effect, during Tali's pilgrimage
where: a C-Sec holding area, the Citadel docks

participants: [Chellick, Tali'Zorah nar Rayya]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Chellick handles a case of two quarians, including Tali'Zorah nar Rayya, who stowed
      away aboard a turian freighter. He talks the ship's captain out of pressing charges,
      but shows the stowaways no more sympathy, holding prejudiced views of their race.
    source_chunks: [chellick_002]
  - text: >
      Tali tries to tell Chellick about something valuable in her possession; he ignores her
      entirely. He uncuffs the pair and tells them there are other freighters that need
      honest workers, then orders them off the Citadel by the next day.
    source_chunks: [chellick_002]

