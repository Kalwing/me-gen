scene_id: normandy-jack-miranda-confrontation
title: Jack and Miranda, Below Decks
kind: argument
game: Mass Effect 2
when: 2185, on return from Pragia, if Miranda's loyalty mission is already done
where: aboard the Normandy SR-2

participants: [Shepard, Jack, Miranda Lawson]
private_to: []
heard_by: [Normandy crew]

requires:
  - jack_loyalty: any
  - miranda_loyalty: any

beats:
  - text: >
      Back aboard after Pragia, Shepard has to settle a fight between Jack and Miranda over
      Cerberus's part in what was done to Jack.
    source_chunks: [jack_005, jack-subject-zero_010]
  - text: >
      Jack flings a chair across Miranda's office before Shepard breaks it up; Jack is furious
      that Miranda won't admit what Cerberus did to her was wrong. Ending it without
      alienating either of them takes a high Paragon or Renegade score — fewer Renegade
      points are needed than Paragon.
    source_chunks: [jack-subject-zero_010]
  - text: >
      With enough points, both crewmembers keep their loyalty and any relationship already
      underway with either continues.
    source_chunks: [jack-subject-zero_010]
    conditional: {jack_miranda_confrontation: both_kept}
    choice: kept both Jack and Miranda
  - text: >
      Without enough points, Shepard alienates one of them, losing that crewmember's loyalty
      (recoverable later in conversation with a high enough score) and ending any romance
      with them for good; siding with Miranda costs Jack's trust this way, and siding with
      Jack costs Miranda's.
    source_chunks: [jack-subject-zero_010, jack_005]
    conditional: {jack_miranda_confrontation: sided_with_one}
    choice: sided with one — the other alienated

related_scenes: [pragia-jack-teltin-facility, citadel-party-apartment]
related_events: []
source_chunks: [jack_005, jack-subject-zero_010]
