beats:
  - text: >
      While Shepard is at the Citadel Council discussing the Mars findings, Ensign
      Copeland is lounging at Normandy Dock Bay D24. Battlespace reporter Diana Allers
      approaches and repeatedly stonewalls her with questions about Shepard's whereabouts,
      since the Normandy was last seen on Earth. Shepard notices the commotion.
    source_chunks: [copeland_001]
  - text: >
      If Shepard permits Diana Allers to stay aboard the Normandy, Copeland disappears
      from the lounge.
    source_chunks: [copeland_001]
