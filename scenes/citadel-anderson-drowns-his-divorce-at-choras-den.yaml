title: Anderson Drinks Off His Divorce at Chora's Den
kind: downtime
game: Mass Effect
when: years before Mass Effect, when Anderson was still a lieutenant
where: Chora's Den, the Wards, the Citadel

participants: [David Anderson, Maawda]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Newly divorced and depressed, then-Lieutenant Anderson goes to Chora's Den to take the
      edge off. Maawda, the volus bartender, serves him an asari drink called elasa along
      with some words of comfort.
    source_chunks: [chora-s-den_002]
  - text: >
      With a meeting with the human ambassador scheduled for the next morning, Anderson
      keeps his stay short. On the way out he becomes certain two turian customers glaring
      at him are trading insults; he resists the urge to start a fight and simply leaves.
    source_chunks: [chora-s-den_002]

