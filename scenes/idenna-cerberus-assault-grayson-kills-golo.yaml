scene_id: idenna-cerberus-assault-grayson-kills-golo
title: The Cerberus Assault on the Idenna
kind: mission-aside
game: Mass Effect
when: "2183, during Mass Effect: Ascension, after Lemm brought the fugitives to the Migrant Fleet"
where: the quarian ship Idenna in the Migrant Fleet — the isolation shuttle, Seeto'Hodda nar Idenna's quarters, and a corridor
participants: [Golo, Paul Grayson, Kahlee Sanders, Gillian Grayson, Hendel Mitra, Ysin'Mal vas Idenna]
heard_by: [crew of the Idenna, Migrant Fleet]
requires: []
beats:
  - text: >
      Lemm'Shal nar Tesleya had brought Kahlee Sanders, Hendel Mitra and Gillian Grayson
      aboard the Idenna after rescuing them from Pel's warehouse on Omega. The three were
      kept isolated on a shuttle while the quarians debated what to do with them. Gillian,
      autistic and averse to being touched, took to the confinement and to the quarian
      environment suit she was asked to wear; Hendel used the time to drill her biotics
      one-on-one, sharpening her control.
    source_chunks: [gillian-grayson_002]
  - text: >
      Just as the quarians reached a decision, the Idenna came under attack. Paul Grayson
      had followed his daughter to the Migrant Fleet with a squad of Cerberus commandos,
      travelling from Omega in the stolen Cyniad alongside Golo, and boarded the Idenna
      using Hilo'Jaa's code phrases. Armed by Cerberus, Golo killed many of the Idenna's
      crew in the surprise assault.
    source_chunks: [golo_002, gillian-grayson_002]
  - text: >
      Captain Ysin'Mal vas Idenna rallied his people and fought on the front lines himself,
      but the defenders were being overwhelmed. They were saved only by Gillian Grayson
      intervening and by Paul Grayson switching sides — warning them he had planted
      explosives to cripple the ship. Mal and Hendel Mitra worked together to disable the
      charges and save the Idenna.
    source_chunks: [ysin-mal-vas-idenna_002, gillian-grayson_002]
  - text: >
      Gillian, told to hide in Seeto'Hodda nar Idenna's quarters, was unsettled by the
      rearranged room and started back toward the shuttle. She met Cerberus operatives on
      the way and, her abilities honed by Hendel, killed them with ease, dropping a six-ton
      forklift on soldiers who tried to stop her. Her father stunned her, meaning to carry
      her back to Cerberus.
    source_chunks: [gillian-grayson_002]
  - text: >
      Golo caught Kahlee Sanders trying to reach Gillian and beat her into submission while
      Paul stood by and watched. Grayson, having chosen his daughter over Cerberus, told
      Golo to stop. As Golo turned to leave, Grayson — who had always despised him for
      selling his own people — shot the quarian traitor in the head.
    source_chunks: [golo_002, gillian-grayson_002]
  - text: >
      Kahlee convinced Grayson that Cerberus had been poisoning Gillian and worsening her
      condition rather than making her humanity's saviour. He agreed to leave her on the
      Flotilla, out of Cerberus's reach, with Hendel, who had bonded with her. The Idenna's
      captain chose both Hendel and Gillian to accompany him on the search for a new quarian
      homeworld.
    source_chunks: [gillian-grayson_002, ysin-mal-vas-idenna_002]
related_scenes: [shelba-golo-ambush-cyniad-scout-team, idenna-captain-mal-confides-in-kahlee]
