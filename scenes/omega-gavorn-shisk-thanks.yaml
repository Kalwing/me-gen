beats:
  - text: >
      Cut dialogue gave Captain Preitor Gavorn, head of Omega's vorcha "task force," an
      extra greeting if Shepard had laid out the vorcha Shisk. He hailed Shepard on the
      dock — "You're the human who laid out Shisk! The only thing those vorcha bastards
      understand is a good smack in the mouth" — confirmed who he was when Shepard named
      him, and declared Shepard "my new best friend" before the conversation folded back
      into its normal course.
