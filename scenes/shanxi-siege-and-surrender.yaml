scene_id: shanxi-siege-and-surrender
title: General Williams Surrenders Shanxi
kind: mission-aside
game: Mass Effect 2
when: 2157, the First Contact War, after the turians broke through to Shanxi
where: the human colony Shanxi, under turian orbital siege
participants: [General Williams, Kastanie Drescher]
heard_by: [Systems Alliance, Turian Hierarchy]
requires: []
beats:
  - text: >
      The turians broke through to Shanxi, humanity's nearest colony to the mass relay,
      and settled into a protracted orbital siege, able to kill any human soldier from
      above. Unable to get food or supplies without risking civilian lives, the defenders
      began to starve.
    source_chunks: [first-contact-war_003]
  - text: >
      General Williams, grandfather of Ashley Williams, was forced to surrender the Shanxi
      garrison. The turians, themselves short on supplies, believed they had defeated the
      bulk of humanity's forces.
    source_chunks: [first-contact-war_003]
  - text: >
      A month later Admiral Kastanie Drescher led the Second Fleet back against Shanxi,
      catching the turians by surprise and driving them off the planet. Both sides braced
      for full-scale interplanetary war until the Citadel Council intervened to broker
      peace.
    source_chunks: [first-contact-war_003, first-contact-war_004]
related_scenes: [shanxi-tadius-ahern-strongpoint]
related_events: [first-contact-war]
source_chunks: [first-contact-war_003, first-contact-war_004]
