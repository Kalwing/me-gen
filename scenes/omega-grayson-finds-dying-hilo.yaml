scene_id: omega-grayson-finds-dying-hilo
title: Grayson Takes the Fleet Codes from a Dying Hilo'Jaa
kind: mission-aside
game: Mass Effect
when: "2183, during Mass Effect: Ascension, during the breakout from Pel's warehouse on Omega"
where: Pel's warehouse, Omega
participants: [Paul Grayson, Hilo'Jaa vas Idenna]
private_to: [Paul Grayson, Hilo'Jaa vas Idenna]
heard_by: [Cerberus]
requires: []
beats:
  - text: >
      Hilo'Jaa vas Idenna, the Cyniad's captured pilot, had been left for dead in Pel's
      warehouse after Golo cracked his faceplate on Shelba and the diseases he then
      contracted made him useless to Pel's interrogation. Pel abandoned him once the
      Collectors made a better offer for Gillian Grayson.
    source_chunks: [hilo-jaa-vas-idenna_001]
  - text: >
      Amid the confusion of Lemm'Shal nar Tesleya's rescue raid, the Cerberus agent Paul
      Grayson broke free and killed Pel in revenge, then found Hilo delirious in the
      warehouse, repeating the Cyniad's pass phrase over and over.
    source_chunks: [hilo-jaa-vas-idenna_001, paul-grayson_003]
  - text: >
      Hilo gave Grayson the Idenna's frequency — 43223 — and the pass phrase, "My body
      travels to distant stars, but my soul never leaves the fleet," then died of his
      sickness and injuries. Grayson used those codes to board the Idenna with Cerberus
      commandos.
    source_chunks: [hilo-jaa-vas-idenna_001, paul-grayson_003]
