scene_id: normandy-war-room-rachni-debrief
title: The Krogan Clan Leader's Debrief on the Rachni Decision
kind: mission-aside
game: Mass Effect 3
when: 2186, after the mission to Utukku and the rachni Queen or Breeder
where: the War Room, Normandy SR-2

participants: [Shepard, Urdnot Wrex, Urdnot Wreav]
private_to: []
heard_by: [Normandy crew]

requires: []

beats:
  - text: >
      Following the confrontation beneath Utukku with the original rachni Queen or the
      Reaper-made Breeder, whichever krogan clan leader — Urdnot Wrex or Urdnot Wreav —
      is aboard the Normandy debriefs Shepard in the War Room, expressing disapproval if
      Shepard chose to let the Queen or Breeder live. If the clan leader is not aboard, he
      sends an email instead: Wreav is openly resentful of any deal, calling any rachni
      spared an abomination bought with dead krogan, while Wrex accepts the call more
      evenly, distrustful but resigned. Both note Aralakh Company took casualties in the
      holding action and will still lend Shepard a hand.
