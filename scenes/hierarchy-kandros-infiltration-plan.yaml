scene_id: hierarchy-kandros-infiltration-plan
title: The Kandros Case for Infiltrating the Initiative
kind: argument
game: "Mass Effect: Discovery"
when: before the Andromeda Initiative's departure, after Tiran's unit is wiped out by geth
where: a closed Turian Hierarchy meeting, then a private word between mother and son

participants: [Ravis Kandros, Tiran Kandros, Commander Narkkin]
private_to: [Ravis Kandros, Tiran Kandros, Commander Narkkin]
heard_by: []

beats:
  - text: >
      Ravis Kandros uses her authority to convene a meeting of high-ranking Hierarchy officials
      so her son Tiran — sole survivor of a geth ambush that killed his unit — can present what
      he found: an inactive geth head carrying evidence that someone tied to the Andromeda
      Initiative is working with outlawed geth technology.
    source_chunks: [ravis-kandros_001, tiran-kandros_003]
  - text: >
      Commander Narkkin calls it a mother pulling favours for her son and pushes for direct
      intervention. Others in the room note the Initiative looks like the stand-up of a
      sizeable private military. Ravis and Tiran talk the group into letting Tiran go undercover
      first to gather harder evidence: he can slip out unnoticed if there is nothing, and hand
      the Hierarchy a decisive case if there is.
    source_chunks: [ravis-kandros_001, tiran-kandros_003]
  - text: >
      Afterward Ravis asks Tiran whether he is committed. He says he wants to prove himself
      worthy of the Kandros name without leaning on her reputation; she tells him she once
      wanted out from under her own mother's shadow, that he has already earned his place, and
      to come back from the mission alive.
    source_chunks: [ravis-kandros_001]

related_scenes: [hierarchy-kandros-tiran-trial]
related_events: []
source_chunks: [ravis-kandros_001, tiran-kandros_003]
