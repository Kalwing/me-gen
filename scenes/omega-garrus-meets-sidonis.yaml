scene_id: omega-garrus-meets-sidonis
title: Garrus Meets Sidonis at Afterlife
kind: mission-aside
game: Mass Effect 2
when: >
  before 2185, after Garrus quit C-Sec and came to Omega chasing the smuggler Kishpaugh's
  supply line
where: one of the lower levels of Afterlife on Omega

participants: [Garrus Vakarian, Sidonis]
private_to: [Garrus Vakarian, Sidonis]
heard_by: []

beats:
  - text: >
      Newly arrived on Omega and looking for somewhere he could make a difference, Garrus
      found the turian Sidonis in a lower level of Afterlife being beaten by an angry
      krogan tied to the Blood Pack. Garrus stepped in, and the two of them fought off the
      remaining mercs.
    source_chunks: [lantar-sidonis_002, mass-effect-homeworlds-3_004]
  - text: >
      Afterward the two agreed to form a squad to take on Omega's criminals. Garrus took
      the name "Archangel" and recruited by going after thugs personally; the band grew to
      twelve — Garrus, Sidonis, a salarian explosives expert, a batarian tech expert, and
      assorted former mercs, security consultants and ex-C-Sec agents — and drove Omega's
      crime rate down even after the gangs united against them.
    source_chunks: [lantar-sidonis_002, mass-effect-homeworlds-3_004]
  - text: >
      The Blue Suns later captured Sidonis and forced him to lure Garrus out of the
      hideout with a false lead on a Blood Pack gun-running operation in the Kenzo
      District. Garrus found nothing there and returned to find the gangs had bombed the
      hideout and gunned down the rest of the squad; Sidonis had vanished.
    source_chunks: [lantar-sidonis_001, mass-effect-homeworlds-3_004]

related_scenes: [omega-archangel-garrus-last-stand, citadel-garrus-sidonis-orbital-lounge]
related_events: [garrus-recruitment-archangel]
