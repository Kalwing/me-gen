scene_id: citadel-haron-security-scanners-me2
title: Sergeant Haron at the Citadel Scanners (Cut)
kind: mission-aside
game: Mass Effect 2
when: 2185, cut content — Shepard's first return to the Citadel after being revived, expanded dialogue that never shipped
where: the Citadel security checkpoint, at the new weapon scanners just inside the transport hub
participants: [Shepard, Sergeant Haron]
private_to: []
heard_by: [Normandy crew]
beats:
  - text: >
      Longer versions of the Sergeant Haron conversations were cut; a fragment survives and
      is only reachable by getting to the Presidium before meeting Haron, normally
      impossible. Whichever squadmate was along remarked on the tightened security as the
      party hit the scanners — Garrus "looks like they've tightened up security," Tali "not
      exactly the welcome I remember," Mordin noting upgraded weapons detectors, Grunt
      "what is this crap?" — the reactions being squad-dependent.
    source_chunks: [mass-effect-2-cut-content-omega-and-citadel-voicelines_009]
  - text: >
      Haron stopped the line. If Shepard's Spectre status was reinstated he was apologetic
      and asked Shepard to step through a side door; otherwise he flagged that only C-Sec
      were now allowed weapons on the Citadel. Either way he explained that the C-Sec
      Executor's office had cleared Shepard to keep weapons — surprising, since Executor
      Pallin had disliked Shepard. Haron said Pallin had been killed by geth in the Battle
      of the Citadel and that C-Sec's commander was now Decian Chellick, who reckoned
      Shepard "tends to find trouble" and needed to be armed.
    source_chunks: [mass-effect-2-cut-content-omega-and-citadel-voicelines_009]
  - text: >
      Haron passed on that Captain Bailey, the station commander, had heard Shepard might
      be coming through and wanted to meet before Shepard got lost in the crowds and get
      the Commander re-familiarised with how much had changed. He directed Shepard just
      beyond the scanners, on the right.
    source_chunks: [mass-effect-2-cut-content-omega-and-citadel-voicelines_010]
