scene_id: feros-zhu-s-hope-arrival-geth-attack
title: Arriving at Zhu's Hope Under Geth Fire
kind: mission-aside
game: Mass Effect
when: 2183, after Shepard is made a Spectre, arriving on Feros to learn what Saren wanted there
where: the docking platform and the Zhu's Hope colony, built into the crashed freighter Borealis, on Feros
participants: [Shepard, David Al Talaqani, Fai Dan, Arcelia Silva Martinez]
heard_by: [Normandy crew]
requires: []
beats:
  - text: >
      No one answered the Normandy's hails on approach. On the platform, David Al Talaqani
      welcomed Shepard's team and said colony leader Fai Dan wanted to speak with the
      Commander; mid-sentence geth rose behind him and shot him in the back.
    source_chunks: [feros-geth-attack_005]
  - text: >
      Shepard fought up the stairs through Geth Troopers, Shock Troopers, Snipers and
      Hoppers into what was left of the colony.
    source_chunks: [feros-geth-attack_005]
  - text: >
      At Fai Dan's position in the Borealis he was accompanied by Arcelia Silva Martinez,
      who scoffed that Shepard had arrived late and brought only three people; Fai Dan
      rebuffed her and thanked the Commander. The talk was cut short as more geth attacked
      and Arcelia sent the squad to the colony's defense tower.
    source_chunks: [feros-geth-attack_006]
  - text: >
      After the tower assault Fai Dan explained the colony's dire straits, could give no
      motive for the geth, and asked Shepard to destroy a geth transmitter in the tunnels
      that was coordinating the attacks, pointing the Commander toward colonists who needed
      help. Unknown to Shepard, every colonist was already under Thorian spore control; the
      Thorian, seeing Shepard as a weapon against the geth, had the salarian merchant Ledra
      sell the Commander whatever weapons he had and made the colonists press Shepard to
      focus on the geth.
    source_chunks: [fai-dan_002, thorian_004]
related_scenes: [feros-exogeni-bunker-jeong-confrontation, feros-thorian-lair-shiala]
related_events: [feros-thorian-mission]
source_chunks: [feros-geth-attack_005, feros-geth-attack_006, fai-dan_002]
