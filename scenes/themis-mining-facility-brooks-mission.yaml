scene_id: themis-mining-facility-brooks-mission
title: Brooks Hunts Roth on Themis
kind: mission-aside
game: Mass Effect
when: 2161 CE, on an asteroid-mining facility orbiting Themis
where: an asteroid-mining facility orbiting the gas giant Themis
participants: [Brooks, the boy/girl, the foreman, Roth's decoy, facility administrator]
private_to: []
heard_by: [Shadow Broker]
beats:
  - text: >
      Brooks arrives at an asteroid-mining facility orbiting Themis, dispatched by the
      Shadow Broker to find and kill Roth, a financier of Cerberus. While searching the
      mines for Roth, she encounters a young boy being beaten by the mine's foreman. She
      intervenes and spares the boy.
    source_chunks: [brooks-mass-effect-foundation_002]
  - text: >
      Brooks interrogates the foreman for Roth's location, then kills him. She then recruits
      the boy to help with her mission, using him to infiltrate the facility's clinic by
      posing as his worried mother and claiming he fell ill.
    source_chunks: [brooks-mass-effect-foundation_002]
  - text: >
      From the clinic computer, Brooks obtains Roth's address. She disguises herself as a
      doctor and deceives the building guard into allowing her to enter Roth's quarters under
      the pretense of delivering medication.
    source_chunks: [brooks-mass-effect-foundation_002]
  - text: >
      Inside the quarters, Brooks finds a lone man and forces him at knifepoint to wire
      a considerable sum to the banker Barla Von. The man reveals he is only a decoy for
      the real Roth and turns the tables on her, breaking free and drawing a bladed
      claw-like weapon.
    source_chunks: [brooks-mass-effect-foundation_002]
  - text: >
      The two operatives fight. Brooks gains the upper hand and disarms the decoy, but he
      draws a gun and shoots her. The boy arrives at a critical moment and distracts the
      man long enough for Brooks to disable him. Brooks kills the decoy and forces him to
      divulge that the real Roth has left the facility for Earth.
    source_chunks: [brooks-mass-effect-foundation_002]
  - text: >
      Brooks leaves with the boy and approaches a facility administrator, posing as a
      security officer. She confirms that Roth has departed but learns no destination.
      With her target gone, she prepares to board her ship and leave the facility.
    source_chunks: [brooks-mass-effect-foundation_002]
  - text: >
      The boy begs Brooks to take him with her off the station, but she firmly refuses. She
      explains that she works alone because she does not trust people, and if the boy were
      captured, he could be forced to betray her. She tells him he is clever enough to find
      his own way off the facility.
    source_chunks: [brooks-mass-effect-foundation_002]
  - text: >
      As Brooks turns to board her ship, the boy shoots her in the back, mortally wounding
      her. The boy then reveals he was actually a girl. Though she had learned not to trust
      people, she had hoped she could trust Brooks. The girl boards Brooks' ship and leaves
      her behind to die.
    source_chunks: [brooks-mass-effect-foundation_002]
related_events: []
