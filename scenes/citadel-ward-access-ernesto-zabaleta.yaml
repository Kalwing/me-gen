scene_id: citadel-ward-access-ernesto-zabaleta
title: Ernesto Zabaleta on the Citadel Ward Access
kind: banter
game: Mass Effect
when: 2183, after Shepard reaches Spectre rank
where: the Citadel Ward Access corridor
participants: [Shepard, Ernesto Zabaleta, Hannah Shepard]
private_to: [Shepard, Ernesto Zabaleta]
heard_by: [Normandy crew]
requires:
  - shepard_background: spacer
beats:
  - text: >
      Lieutenant Ernesto Zabaleta, down on his luck, stops Shepard on the Citadel Ward Access
      corridor. He recognizes Shepard because he served aboard the SSV Einstein with Shepard's
      mother, Hannah Shepard. He asks Shepard for 20 credits, saying he is stranded and cannot
      afford a passage home.
    source_chunks: [ernesto-zabaleta_001, citadel-old-unhappy-far-off-things_003]
  - text: >
      Shepard can give Zabaleta the credits, refuse, or lie about having money. After this
      decision Shepard returns to the Normandy and calls Hannah Shepard aboard the SSV
      Kilimanjaro from the ship's FTL comm. Hannah explains that Zabaleta was among the
      ground troops at Mindoir and suffered severe post-traumatic stress disorder from what
      he witnessed. He turned to alcohol to cope, eventually leaving the service after
      repeatedly showing up intoxicated. Hannah suggests Shepard refer him to the Veterans'
      Affairs Office for help.
    source_chunks: [hannah-shepard_002, citadel-old-unhappy-far-off-things_003]
  - text: >
      Returning to the Ward Access, Shepard finds Zabaleta again. He asks for credits once
      more, this time to buy whiskey to stop the nightmares. Shepard can give him money,
      set him up with a grocery store account to prevent him from drinking, refuse again,
      or, with sufficient Charm or Intimidate, convince him to go to the Veterans' Affairs
      Office. Whatever choice Shepard makes, Zabaleta leaves the location for good.
    source_chunks: [citadel-old-unhappy-far-off-things_003]
related_events: [mindoir-raid]
source_chunks: [ernesto-zabaleta_001, citadel-old-unhappy-far-off-things_003, hannah-shepard_002]
