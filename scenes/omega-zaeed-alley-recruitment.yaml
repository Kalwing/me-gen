scene_id: omega-zaeed-alley-recruitment
title: Picking Up Zaeed Outside Afterlife
kind: mission-aside
game: Mass Effect 2
when: 2185, after Freedom's Progress
where: an alley off the Afterlife plaza on Omega
participants: [Shepard, Zaeed Massani]
heard_by: [Normandy crew]
beats:
  - text: >
      On Omega, in an alley near Afterlife, Shepard finds Zaeed Massani — retained by
      Cerberus at high cost — brutalizing a batarian prisoner. Approaching him triggers
      the conversation.
    source_chunks: [dossier-the-veteran_003]
  - text: >
      Zaeed names an unfinished job the Illusive Man left off the dossier: Vido Santiago
      and the Blue Suns have seized an Eldfell-Ashland Energy facility on Zorya, and EAE
      hired Zaeed to retake it. He wants Shepard's help with it.
    source_chunks: [dossier-the-veteran_003]
  - text: >
      The prisoner tries to run; Zaeed shoots him in the leg, excuses himself to turn in
      the bounty, and is immediately available aboard the Normandy in the starboard cargo
      hold.
    source_chunks: [dossier-the-veteran_003]
related_scenes: [zorya-zaeed-and-vido]
related_events: [zaeed-recruitment-omega]
source_chunks: [dossier-the-veteran_003]
