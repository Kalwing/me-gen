scene_id: hierarchy-kandros-tiran-trial
title: Tiran Kandros's Trial and Farewell
kind: ceremony
game: "Mass Effect: Discovery"
when: end of Tiran's infiltration, before the Andromeda Initiative's departure
where: a Turian Hierarchy tribunal, then a parting before Tiran ships out

participants: [Ravis Kandros, Tiran Kandros]
private_to: []
heard_by: []

beats:
  - text: >
      After Agent Zeta's escape from Omega, Ravis tells Tiran he has been declared AWOL and
      charged with gross dereliction of duty, and warns that if he keeps going the Hierarchy
      will have to arrest him. He sees the mission through anyway and then turns himself in.
    source_chunks: [ravis-kandros_001]
  - text: >
      Ravis and the two officials who were with her at the original meeting sit as judges at
      Tiran's trial. Because he has already pleaded guilty, extenuating circumstances
      notwithstanding, he is discharged without honour, effective immediately.
    source_chunks: [ravis-kandros_001]
  - text: >
      Ravis at first disapproves of his decision to join the Andromeda Initiative for real,
      pointing out he could stay on as a civilian contractor. Tiran says the Initiative is his
      chance to write not a chapter but a whole book of Kandros history. She comes around,
      embraces him before he leaves for the last time, and says her only regret is that she
      will never get to read it.
    source_chunks: [ravis-kandros_001]

