scene_id: omega-nyreen-death-gozu-plaza
title: Nyreen Kandros's Last Stand Outside Afterlife
kind: mission-aside
game: Mass Effect 3
when: 2186, during the liberation of Omega from Cerberus
where: the main plaza outside Afterlife, Gozu District, Omega
participants: [Shepard, Aria T'Loak, Nyreen Kandros]
heard_by: [Omega resistance]
requires:
  - omega: yes
  - game: Mass Effect 3
beats:
  - text: >
      As Aria and Shepard push through Cerberus forces overwhelming a group of Talon
      defenders, Nyreen appears and dispatches the Cerberus troops, then reveals she is the
      actual leader of the Talons. Aria — who ended their relationship years earlier on bad
      terms — admits she is surprised. Nyreen is reluctant to work with Aria but Shepard
      talks her into cooperating.
    source_chunks: [aria-t-loak_012, nyreen-kandros_004]
  - text: >
      Through the campaign Nyreen tries to rein in Aria's recklessness and argues with her
      over whether Omega's civilians matter; Shepard keeps reminding both that Cerberus
      only falls if they fight together. Her composure breaks only against Adjutants — she
      had to kill infected friends and allies when Cerberus invaded — and Aria needles her
      for the fear.
    source_chunks: [aria-t-loak_012, nyreen-kandros_004]
  - text: >
      For the final assault on the Cerberus command center in Afterlife, Nyreen leads her
      Talons on a separate push through Gozu District to protect the civilians while Aria
      and Shepard counter Cerberus saboteurs. Sensing something wrong, she scouts ahead of
      her own troops to the main plaza outside Afterlife and finds a group of Adjutants
      charging a crowd of civilians.
    source_chunks: [nyreen-kandros_004, aria-t-loak_012]
  - text: >
      Nyreen draws the Adjutants in with her biotics and detonates a belt of grenades, her
      biotic field containing the blast; she is incinerated along with the creatures. Aria
      and Shepard arrive too late to stop her. Enraged, Aria charges the Cerberus troops at
      Afterlife and runs straight into General Petrovsky's stasis trap; Shepard destroys
      the trap's generators to free her.
    source_chunks: [nyreen-kandros_004, aria-t-loak_012, afterlife-club_005]
