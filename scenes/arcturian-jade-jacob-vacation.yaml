scene_id: arcturian-jade-jacob-vacation
title: Jacob's Vacation Aboard the Arcturian Jade
kind: mission-aside
game: Mass Effect
when: "after Jacob Taylor's retirement from the Alliance marines (Mass Effect Galaxy)"
where: the luxury liner Arcturian Jade, en route to the Citadel

participants: [Jacob Taylor, Reginald Tudge, Miranda Lawson]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      After retiring as an Alliance marine, Jacob Taylor takes a vacation aboard the liner
      Arcturian Jade. While it is travelling toward the Citadel, batarian terrorists attack
      the ship; Jacob, who kept his assault rifle from his marine days, fights them off to
      defend the passengers and crew.
    source_chunks: [arcturian-jade_001]
  - text: >
      Jacob intercepts the batarians as they move toward the bridge and confronts their
      leader, who explains he ordered the attack to teach humanity a lesson in obedience,
      resenting the human "sense of entitlement" and the Council's refusal to address batarian
      demands — knowing the ship's proximity to the Citadel made it a suicide mission. Jacob
      defeats the batarians and saves the ship; Captain Reginald Tudge offers him his choice
      of cabins for the rest of the voyage.
    source_chunks: [arcturian-jade_001]
  - text: >
      Jacob later resumes his vacation aboard the Arcturian Jade after foiling Jath'Amon's
      attack on the Citadel, this time unexpectedly joined by Miranda Lawson, who brings a
      bottle of champagne.
    source_chunks: [arcturian-jade_001]

