scene_id: eden-prime-beacon-mission
title: Find the Beacon
kind: mission-aside
game: Mass Effect
when: 2183, the Normandy's shakedown run, the day of Saren's geth attack
where: the SSV Normandy en route from the Arcturus Prime relay, then the fields, dig site and spaceport of Eden Prime
participants: [Shepard, Kaidan Alenko, Richard L. Jenkins, Nihlus Kryik, Ashley Williams, Saren Arterius, Powell, Anderson, Joker]
heard_by: [Normandy crew, Citadel Council]
beats:
  - text: >
      The Normandy jumped the Arcturus Prime relay toward Eden Prime. On the bridge Joker
      ran a post-jump system check while the turian Spectre Nihlus watched over his shoulder
      and then left; Joker told Kaidan Alenko he disliked having a Spectre aboard and did not
      believe the Council had sent one just to test the stealth drive.
    source_chunks: [prologue-find-the-beacon_003, storyline_030]
  - text: >
      In the comm room Nihlus and Captain Anderson briefed Shepard: a science team on Eden
      Prime had unearthed a Prothean beacon that had to be secured and taken to the Citadel,
      and Nihlus was aboard to assess Shepard as the first human Spectre candidate, having
      personally put the name forward. A garbled transmission from the colony's marines showed
      heavy fighting and an enormous alien ship overhead. Anderson ordered the ground team
      down; Nihlus went ahead alone to scout.
    source_chunks: [storyline_030, nihlus-kryik_003]
  - text: >
      The Normandy set down and Shepard, Kaidan and Corporal Jenkins deployed. Within minutes
      geth recon drones ambushed them in the open and cut Jenkins down; Shepard and Kaidan
      pressed on toward the dig site.
    source_chunks: [storyline_031, richard-l-jenkins_001]
  - text: >
      Near the dig site Shepard and Kaidan found Gunnery Chief Ashley Williams of the 212 being
      run down by geth troopers, the rest of her unit already dead, and helped her fight them
      off. She joined Shepard's squad and led them to the dig, but the beacon had been moved to
      the spaceport; on the way the squad was set on by husks, colonists reanimated on
      dragon's-teeth spikes, and killed them.
    source_chunks: [storyline_031]
  - text: >
      At the tram platform Nihlus met Saren Arterius, his old mentor and fellow Spectre. Saren
      said he had the situation under control; when Nihlus turned his back, Saren shot him
      through the head and left, ordering the geth to plant explosive charges and level the
      colony. Only the hidden dockworker Powell saw the killing. Shepard was not present.
    source_chunks: [storyline_031, saren-arterius_006, nihlus-kryik_003]
  - text: >
      Shepard's squad reached Nihlus's body and met Powell, who described Saren gunning Nihlus
      down. Fighting through geth troopers, shock troopers and a Geth Destroyer, Shepard took a
      tram to Spaceport Platform Two, where Saren had already used the beacon and gone; Shepard
      disarmed the four demolition charges before a five-minute timer ran out.
    source_chunks: [prologue-find-the-beacon_003, storyline_031]
  - text: >
      Kaidan and Ashley examined the still-active beacon. It seized one of them and dragged them
      toward it; Shepard threw the squadmate clear and was lifted in their place, taking a rush
      of fragmentary Prothean visions before the beacon overloaded and exploded, knocking
      Shepard unconscious. Only Shepard received the visions.
    source_chunks: [prologue-find-the-beacon_003]
related_events: [attack-on-eden-prime, ashley-williams-eden-prime]
source_chunks: [prologue-find-the-beacon_003, storyline_030, storyline_031, richard-l-jenkins_001, nihlus-kryik_003, saren-arterius_006]
