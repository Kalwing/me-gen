scene_id: omega-garrus-calls-castis
title: Garrus Calls Home from Omega
kind: argument
game: Mass Effect 2
when: "2185, Omega, during Garrus's last stand as the sole survivor of his vigilante group"
where: Castis Vakarian's home on Palaven, reached by comm from Omega

participants: [Garrus Vakarian, Castis Vakarian]
private_to: [Garrus Vakarian, Castis Vakarian]
heard_by: []

requires: []

beats:
  - text: >
      Retired and back on Palaven, Castis Vakarian receives a call from Garrus, who claims
      he's on "target practice." It quickly becomes clear he's lying: Garrus is under heavy
      fire, making his last stand on Omega as the sole survivor of the vigilante group he
      led, calling his father in what may be his final moments.
    source_chunks: [castis-vakarian_002]
  - text: >
      Garrus tries to reconcile with Castis — the two had been distant since Castis let a
      suspect go on a case Garrus was building, and grew further apart after Garrus
      assaulted that suspect following the Battle of the Citadel. Castis listens rather than
      lecturing, and responds with combat advice: as long as Garrus has at least one bullet
      left, he can still get the job done no matter how bad it looks. He tells him to come
      home afterward and sort things out.
    source_chunks: [castis-vakarian_002]

