scene_id: normandy-chakwas-and-adams-crew-quarters
title: Chakwas and Adams in the Crew Quarters
kind: downtime
game: Mass Effect 3
when: 2186, during the war, while the med-bay is given over to Eve
where: the crew quarters and med-bay of the Normandy SR-2

participants: [Shepard, Karin Chakwas, Gregory Adams]
private_to: []
heard_by: [Normandy crew]

requires: []

beats:
  - text: >
      The Alliance had no idea what to do with Chakwas when it impounded the Normandy — she
      was never formally Cerberus and had a proper leave of absence — though she notes she
      could still have been tried as an accessory had Shepard been convicted. She had been
      working at an Alliance R&D lab at Shalta Ward, coordinating with Hackett.
    source_chunks: [karin-chakwas_006]
  - text: >
      She comes to Huerta Memorial as soon as she hears about the injured squad member, and
      Shepard finds her in the lounge talking with Dr. Michel. Invited back aboard, she takes
      her old place in the med-bay and says it feels like home.
    source_chunks: [karin-chakwas_006]
  - text: >
      With the salarian doctor working on Eve in the med-bay, she spends her time in the crew
      quarters with Engineer Adams, telling him it was not his fault that he could not help the
      team in 2185.
    source_chunks: [karin-chakwas_006]
  - text: >
      Unlike Kelly Chambers, she claims to have put the abduction behind her — and eventually
      admits to Adams that she lied about that to keep a brave face on.
    source_chunks: [karin-chakwas_006]
  - text: >
      She is not at the party. An emergency medical consult somewhere on the Citadel takes her
      instead, and Traynor passes on her apologies. She sent fancy liquor, which is gone by the
      time Traynor mentions it, and Shepard never got any.
    source_chunks: [karin-chakwas_007]
  - text: >
      On the eve of the final battle she tells Shepard how far they have come since
      then-Captain Anderson's Normandy, and that it has been her honour.
    source_chunks: [karin-chakwas_007]

