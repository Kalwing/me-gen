scene_id: normandy-bar-tali-rael-toast
title: Tali Talks About Her Father Over Drinks
kind: downtime
game: Mass Effect 3
when: 2186, after the mission on Horizon, Rannoch already reclaimed
where: the Normandy SR-2 bar

participants: [Shepard, Tali'Zorah vas Normandy]
private_to: [Shepard, Tali'Zorah vas Normandy]
heard_by: [Normandy crew]

requires:
  - rannoch: any

beats:
  - text: >
      With Rannoch behind her and Horizon just done, Tali drinks at the Normandy's bar and
      finally talks about Rael'Zorah — how distant and hard on her he was, and the house he
      meant to build for the family on the homeworld. She draws the parallel to Miranda Lawson
      and her own father.
    source_chunks: [rael-zorah_004]
  - text: >
      Drunk, Tali raises a toast to Miranda: she never liked her, but respected that Miranda
      did whatever it took to stand up to her father and never changed herself to please him.
      She turns it on herself — "When do we get to stop reacting to our parents and start
      living for ourselves?" This is the exchange the running "emergency induction port" joke
      about how a masked quarian drinks comes from.
    source_chunks: [manual-tali-zorah-vas-normandy-character-analysis-part-5-the-romance-arc-and-conclusion_004, rael-zorah_004]
    conditional: {miranda_alive: true}
    choice: Miranda Lawson survived
  - text: >
      If she and Shepard are together, Tali muses that Rael would have hated her human partner.
      Shepard offers a toast to his memory.
    source_chunks: [rael-zorah_004]
    conditional: {romance: Tali}
    choice: romanced Tali

