scene_id: me1-ashley-ilos-night
title: Grounded by the Council, and the Night Before Ilos
kind: hangout
game: Mass Effect
when: 2183, after the Council grounds the Normandy, then en route to Ilos before the final assault on Saren
where: the SSV Normandy — the CIC, then Shepard's quarters

participants: [Shepard, Ashley Williams, Jeff "Joker" Moreau]
private_to: [Shepard, Ashley Williams]
heard_by: [Normandy crew]

requires:
  - romance: Ashley

beats:
  - text: >
      A rapport built between Shepard and Ashley since Eden Prime grows into something
      romantic. Ashley needles Shepard about the awkwardness of his attraction to a
      soldier under his command, insisting she isn't one for words, though her love of
      poetry helps her say what she feels.
    source_chunks: [ashley-williams_007]
  - text: >
      When the Council grounds the Normandy, Ashley persuades Shepard not to give in to
      them; the two nearly share a kiss before Joker interrupts.
    source_chunks: [ashley-williams_007]
  - text: >
      En route to Ilos for the final assault on Saren, Ashley comes to Shepard's quarters.
      She tells him that after a long career of being sidelined by the Alliance, he makes
      her feel "good enough," and the two spend the night together. She keeps teasing him
      afterward, claiming she has something important to tell him — but he'll have to
      survive Ilos and come back to her first to hear it.
    source_chunks: [ashley-williams_007]

