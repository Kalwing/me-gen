scene_id: benezia-death-noveria
title: The Death of Matriarch Benezia at Peak 15
kind: mission-aside
game: Mass Effect
when: 2183, Noveria, during the hunt for Saren
where: the secure lab at Peak 15, beside the Rachni Queen's containment tank

participants: [Shepard, Matriarch Benezia, Liara T'Soni]
private_to: []
heard_by: [Normandy crew]

beats:
  - text: >
      Shepard fights through geth, escaped rachni, and Benezia's asari commandos to reach
      the secure lab, where Benezia is waiting beside the Rachni Queen's tank. Sent by Saren,
      she is trying to extract the location of the Mu Relay from the queen's genetic memory.
    source_chunks: [storyline_034, noveria-matriarch-benezia_001]
  - text: >
      Benezia places the squad in stasis and sets her commandos on them; if Liara came along,
      an exchange passes between mother and daughter first, but it does not stop the attack.
    source_chunks: [noveria-matriarch-benezia_001]
  - text: >
      Weakened through three waves of commandos and geth snipers, Benezia briefly breaks free
      of Saren's indoctrination on her own mental strength. She tells Shepard the truth: Saren
      is Sovereign's tool, not the real threat, and Sovereign is a Reaper. She describes
      indoctrination from the inside — "beating upon the glass as your hands torture and
      murder" — and hands over the Mu Relay coordinates she pulled from the Rachni Queen.
    source_chunks: [storyline_034, benezia_003]
  - text: >
      If Liara is present, Benezia tells her daughter she has always made her proud. Then
      indoctrination overwhelms her again; she attacks with three final commandos and Shepard's
      squad is forced to kill her. Dying, she says she does not see the light promised in
      asari religion.
    source_chunks: [storyline_034, benezia_003]
  - text: >
      Shepard then decides the fate of the Rachni Queen, whose mind Benezia's extraction left
      partially stripped, before taking the tram back to the Normandy.
    source_chunks: [storyline_034]

related_events: [benezia-death-noveria, rachni-queen-noveria-choice, noveria-espionage]
source_chunks: [storyline_034, benezia_003, noveria-matriarch-benezia_001]
