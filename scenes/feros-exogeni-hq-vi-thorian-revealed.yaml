scene_id: feros-exogeni-hq-vi-thorian-revealed
title: The ExoGeni VI Names the Thorian
kind: mission-aside
game: Mass Effect
when: 2183, the Feros mission, after crossing the skyway from the weigh station
where: ExoGeni Corporation headquarters, a repurposed Prothean tower on Feros
participants: [Shepard, Lizbeth Baynham, ExoGeni VI]
heard_by: [Normandy crew]
requires: []
beats:
  - text: >
      Dropping down past an energy barrier into the headquarters locked Shepard's squad
      choices for the rest of the Feros arc and cut the team off from the Normandy. In the
      cavern a jumpy Lizbeth Baynham fired at the squad, then apologized, introduced
      herself, said the geth were probably after the Thorian, handed Shepard her ID badge
      for access, and went to hide.
    source_chunks: [feros-geth-attack_013]
  - text: >
      After the squad fought off roughly seven varren, Shepard climbed the stairs to find a
      Krogan Commander threatening the ExoGeni VI for information. The VI announced that
      other users were queuing for the console — Shepard's squad on the stairs — and after
      the three of them killed the krogan the VI addressed Shepard as Lizbeth, reading her
      badge's high-level clearance.
    source_chunks: [feros-geth-attack_013, exogeni-vi_001]
  - text: >
      The VI told Shepard the krogan had wanted data on Species 37, the Thorian: a
      plant-like creature that had taken mental control of the Zhu's Hope colonists, and
      that ExoGeni had deliberately let the colonists be infected in order to study the
      results. It added that Lizbeth's probation came from her opposition to the
      experiment, but could give nothing on the geth in the building, whose dropship had
      jammed its sensors and Shepard's comms to the Normandy.
    source_chunks: [feros-geth-attack_014, exogeni-vi_001]
