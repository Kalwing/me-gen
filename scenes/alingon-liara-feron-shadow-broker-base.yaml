scene_id: alingon-liara-feron-shadow-broker-base
title: Infiltrating the Shadow Broker's Base on Alingon
kind: mission-aside
game: "Mass Effect: Redemption"
when: 2183, during Liara's search for Shepard's body, after Tazzik fled Omega
where: the Shadow Broker's main base on Alingon
participants: [Liara T'Soni, Feron, Tazzik]
heard_by: [Cerberus]
requires: []
beats:
  - text: >
      Feron's cramped ship reached Alingon, where the Broker's automated sentries opened
      fire; Feron threaded the ship through an asteroid field to shake them.
    source_chunks: [liara-t-soni_007]
  - text: >
      Inside, Feron passed Liara off as an asari escort on unscheduled Broker business to
      get past the outside guards, then led her toward the Broker's command center to find
      what the Broker was getting from the Collectors.
    source_chunks: [liara-t-soni_007]
  - text: >
      Liara addressed the Broker directly, rejecting the idea of Shepard's body as
      merchandise and arguing there was a link between the Reapers and the Collectors with
      Shepard at its center. She moved to attack and found she had been speaking to a
      holoprojector; the Broker said Tazzik had already completed the sale. Enraged, Liara
      biotically demolished the command center while Feron finished downloading the
      Broker's dealings onto a data stick.
    source_chunks: [liara-t-soni_007, feron_002]
  - text: >
      Feron told Liara the body was still at the north portal. En route he came clean:
      Cerberus had recruited him, he and the Illusive Man had planned for Feron to snatch
      the body, and he had used Liara to do it. Alarms brought Broker security; Liara cut
      through them, including the two turian guards who had leered at her earlier, and took
      the data stick for safekeeping.
    source_chunks: [liara-t-soni_007, liara-t-soni_008]
  - text: >
      At the portal Feron broke cover to tell Tazzik and a Collector that the Broker wanted
      full payment for the body. Tazzik nearly believed him until the Collector blurted
      that Feron was a traitor. The distraction let Liara kill the guards and the Collector
      drone, but the body had already been reloaded onto Tazzik's ship.
    source_chunks: [feron_002, liara-t-soni_008]
  - text: >
      Feron held Tazzik off so Liara could run; she was forced to leave him behind,
      captured. She delivered Shepard's body to Cerberus at Minuteman Station, put the
      Shadow Broker on her list of enemies, and vowed to free Feron.
    source_chunks: [feron_002, liara-t-soni_008]
related_scenes: [redemption-liara-feron-hunt-shepards-body]
related_events: [mass-effect-redemption]
