scene_id: solana-beach-josh-james-red-sand
title: Leverage at the Beach House
kind: banter
game: Mass Effect
when: "2176, the day James Vega enlisted with the Systems Alliance Marines"
where: "Josh's beach house in Solana Beach, California"
participants: [Joshua Sanders, James Vega]
heard_by: [James's uncle Emilio Vega]
beats:
  - text: >
      On the day James enlisted with the Systems Alliance Marines, Josh sent his son to San Diego to pick up a package.
      After James evaded police pursuit and returned home, Josh revealed that the package contained a supply of red sand
      and promptly took some of it himself.
    source_chunks: [joshua-sanders_001, james-vega_002]
  - text: >
      When James announced he would not help Josh anymore and was leaving, Josh revealed that he had known about
      the enlistment all along. Josh threatened to tell the military about James's actions in San Diego that night,
      saying they would reject him if they learned what he had done.
    source_chunks: [joshua-sanders_001, james-vega_002]
  - text: >
      James's uncle Emilio Vega later pointed out that Josh would never admit to the military that he had made a drug deal
      and could implicate himself. With that knowledge, James successfully joined the Alliance and became a Marine.
    source_chunks: [joshua-sanders_001]
source_chunks: [joshua-sanders_001, james-vega_002]
