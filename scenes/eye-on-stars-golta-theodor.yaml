scene_id: eye-on-stars-golta-theodor
title: Erlan Golta Clashes with Bryan Theodor on "Eye on the Stars"
kind: banter
game: Mass Effect
when: 2185, 09/17
where: the set of "Eye on the Stars," a late-night talk show
participants: [Erlan Golta, Bryan Theodor]
heard_by: [galactic audiences, millions of viewers]
beats:
  - text: >
      Political commentator Erlan Golta appeared on the late-night talk show "Eye on the
      Stars" to discuss his new book "Juggling the Monkeys: An Insider's View of the Tower."
    source_chunks: [cerberus-daily-news-september-2010_018]
  - text: >
      Host Bryan Theodor accused Golta of being deliberately inflammatory in his portrayal
      of Council politics. Golta shot back by claiming the Citadel Councilors themselves
      had drawn up orders to charge Commander Shepard with obstruction of justice after
      the Battle of the Citadel.
    source_chunks: [cerberus-daily-news-september-2010_018]
  - text: >
      Messages flooded in from viewers both condemning and applauding Golta's controversial
      claims. Theodor ended by remarking that Golta's appearances on the show were always
      welcome—calling him "catastrophically wrong in front of millions of viewers."
    source_chunks: [cerberus-daily-news-september-2010_018]
