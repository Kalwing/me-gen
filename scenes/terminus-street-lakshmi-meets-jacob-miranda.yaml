scene_id: terminus-street-lakshmi-meets-jacob-miranda
title: A Street Urchin's Warning
kind: mission-aside
game: Mass Effect
when: "2183, after the Normandy SR-1's destruction, while Miranda and Jacob search a Terminus world for Shepard's body"
where: "a street market in a Terminus Systems slum"
participants: [Jacob Taylor, Miranda Lawson, Lakshmi]
heard_by: [Cerberus]
beats:
  - text: >
      Lakshmi, a near-ten-year-old street beggar with a Y-shaped scar over one eye, asked
      Jacob Taylor and Miranda Lawson for credits. Miranda gave her nothing; Jacob promised
      payment in exchange for directions. Lakshmi warned them the place they were headed was
      dangerous — her cousin's family had been abducted there and sold into slavery.
    source_chunks: [lakshmi_001]
  - text: >
      A gang of batarian thugs broke up the conversation. In the chaos Lakshmi pulled Jacob
      and Miranda into cover and handed each of them red and green decorated fabrics to mask
      their faces in public. Jacob thanked her, and the two adults went on their way.
    source_chunks: [lakshmi_001]
related_scenes: [terminus-warehouse-jacob-frees-miranda-and-lakshmi]
source_chunks: [lakshmi_001]
