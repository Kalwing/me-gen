scene_id: cerberus-facility-kai-leng-rasa-fail-to-catch-jack
title: Jack Throws Kai Leng Across a Cerberus Training Facility
kind: mission-aside
game: Mass Effect 2
when: before the Reaper war, during Mass Effect Foundation
where: a wrecked Cerberus biotic training facility, near its main reactor
participants: [Kai Leng, Rasa, Jack]
private_to: []
heard_by: []
requires:
  - game: Mass Effect 2
beats:
  - text: >
      Someone has blown up a Cerberus training facility, and the Illusive Man sends Kai
      Leng and the agent Rasa — a pairing Leng resents — to bring the culprit in. Leng says
      he will handle it and Rasa is only there to write up the aftermath. On arrival they
      spot Blue Suns ships in the hangar and realize the mercs are a containment crew in
      case the agents fail. The target is Jack.
    source_chunks: [kai-leng_008, maya-brooks_007]
  - text: >
      They find Jack by the reactor, just after she has cut down a group of Blue Suns. Leng
      draws his sword and threatens her; her biotics knock him flat. He comes at her from
      above and behind instead; she senses him and hurls him further away. By the time he
      digs his stuck sword loose, the Blue Suns' krogan leader has clubbed Jack unconscious
      from behind and carried her off to be ransomed to the Illusive Man.
    source_chunks: [kai-leng_008, storyline-ii_017]
  - text: >
      Leng calls the whole thing "a colossal waste of time." Rasa disagrees — at least the
      Illusive Man now knows what Subject Zero can do. On the shuttle out Leng blames Rasa
      for Jack's escape and warns her never to be assigned with him again.
    source_chunks: [kai-leng_008, kai-leng_009]
related_scenes: [purgatory-jack-breakout]
related_events: []
