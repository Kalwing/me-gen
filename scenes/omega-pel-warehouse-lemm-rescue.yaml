scene_id: omega-pel-warehouse-lemm-rescue
title: Lemm Hits Pel's Warehouse
kind: mission-aside
game: Mass Effect
when: "2183, during Mass Effect: Ascension, after Golo sent Lemm to Pel's warehouse"
where: Pel's warehouse on Omega, then a stolen shuttle to the Migrant Fleet

participants: [Lemm'Shal nar Tesleya, Kahlee Sanders, Paul Grayson, Gillian Grayson, Hendel Mitra]
private_to: []
heard_by: [Cerberus, crew of the Idenna]

beats:
  - text: >
      Tracking the missing crew of the Idenna scout ship Cyniad, Lemm'Shal nar Tesleya had
      talked and paid his way past the batarians at Fortune's Den to the quarian exile
      Golo, who admitted brokering the deal but claimed not to know what the human Pel had
      done with the quarians. Golo talked Lemm out of storming the warehouse at once and
      into staking it out — then tipped Pel off.
    source_chunks: [lemm-shal-nar-tesleya_001, golo_002]
  - text: >
      Not trusting Golo, Lemm attacked the warehouse early, before Pel's people were
      ready. He expected four quarian captives; the prisoners were Kahlee Sanders, Paul
      Grayson, his daughter Gillian Grayson and the biotic Hendel Mitra. Lemm recognised
      Kahlee from the quarian investigation into Saren Arterius and got everyone out except
      Paul Grayson.
    source_chunks: [lemm-shal-nar-tesleya_001]
  - text: >
      Lemm was shot and badly wounded in the leg during the escape. Hendel patched him up;
      afterward Lemm had to wear a sealed boot against infection. He was also forced to
      leave behind his prized modified Armax Arsenal shotgun, a gift from the Tesleya's
      captain — its quarian modifications later gave Paul Grayson a lead on who had taken
      the others.
    source_chunks: [lemm-shal-nar-tesleya_001]
  - text: >
      Hoping to introduce Kahlee to the Idenna's captain and earn a place on the crew,
      Lemm let the three humans hide from Cerberus on the Migrant Fleet and flew them there
      in a stolen shuttle, using his code phrase — "the quest for knowledge sent me away
      from my people; now the discovery of wisdom has brought me back" — for safe passage
      aboard the Idenna. With the humans quarantined on their shuttle, Captain Ysin'Mal vas
      Idenna admitted Lemm to his crew and renamed him Lemm'Shal vas Idenna.
    source_chunks: [lemm-shal-nar-tesleya_001]

related_scenes: [omega-golo-dealings-and-the-trap-for-lemm, idenna-cerberus-assault-grayson-kills-golo]
