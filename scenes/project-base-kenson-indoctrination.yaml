scene_id: project-base-kenson-indoctrination
title: Object Rho and Kenson's True Allegiance
kind: mission-aside
game: Mass Effect 2
when: 2186, Arrival DLC, Project Base asteroid
where: Project Base on a Bahak system asteroid
participants: [Shepard, Amanda Kenson, Project staff]
private_to: []
heard_by: [Admiral Hackett, Normandy crew]
requires:
  - arrival: any
beats:
  - text: >
      On the asteroid, Kenson showed Shepard the countdown clock: the Reapers would
      arrive in just over two days. She escorted Shepard through the facility,
      explaining the Project was ready to proceed with destroying the Alpha Relay.
    source_chunks: [amanda-kenson_004]
  - text: >
      At Object Rho, Shepard examined the exposed Reaper artifact. Kenson assured
      the Commander that a minute of exposure would provide all the proof needed.
      Visions of Reaper invasion flooded Shepard's mind.
    source_chunks: [amanda-kenson_004]
  - text: >
      While Shepard reeled from the experience, Kenson drew an M-4 Shuriken and
      pointed it at the Commander. Project guards rushed in. Kenson revealed that
      she and the entire Project staff had been indoctrinated through prolonged
      exposure to Object Rho; they now served the Reapers and would do anything to
      prevent Shepard from stopping the relay destruction.
    source_chunks: [amanda-kenson_004]
  - text: >
      Shepard moved quickly, disarming Kenson and breaking her wrist. Kenson limped
      away, holding her arm and ordering her guards to kill the Commander.
    source_chunks: [amanda-kenson_004]
  - text: >
      Shepard fought through waves of Project guards. Kenson's voice came over the
      intercom, but Shepard pressed forward until sedative gas incapacitated them.
      As Shepard lost consciousness, Kenson's eyes glowed with Collector influence.
    source_chunks: [amanda-kenson_004]
  - text: >
      Hours later, after increased sedative doses failed to keep Shepard under,
      the Commander woke and fought through the facility. Kenson tried to rally
      her guards, but Shepard reached the Project Control Room and reactivated
      the asteroid's engines.
    source_chunks: [amanda-kenson_004]
  - text: >
      Kenson cut Shepard's communications and raced to the reactor core to
      destabilize it and destroy the asteroid herself. Shepard intercepted her and
      activated the cooling rods, preventing a meltdown.
    source_chunks: [amanda-kenson_004]
  - text: >
      Shepard pursued Kenson to the master control panel. In a frenzy of rage and
      anguish, Kenson wailed that she could no longer "hear the whispers" and
      blamed Shepard for their situation. She pulled a detonator, lamenting that
      they only had to stay asleep. Shepard ordered her to step away, but Kenson
      pressed the detonator. The explosion obliterated her body and knocked Shepard
      backward.
    source_chunks: [amanda-kenson_004]
related_events: [arrival-bahak-relay-destruction]
source_chunks: [amanda-kenson_004]
