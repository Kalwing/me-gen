scene_id: omega-invasion-afterlife-exile-ultimatum
title: Petrovsky's Ultimatum and Aria's Exile
kind: argument
game: "Mass Effect: Invasion"
when: 2186, the Cerberus takeover of Omega, before the Reaper War
where: the Afterlife Club, Omega
participants: [Aria T'Loak, Oleg Petrovsky, Raymond Ashe]
private_to: [Aria T'Loak, Oleg Petrovsky, Raymond Ashe]
heard_by: []
beats:
  - text: >
      Back on Omega, Aria united the gangs and ran guerrilla attacks from the slums. Petrovsky
      evacuated most Cerberus forces and stayed with a small squad in mercenary armour as
      bait; Aria recognised the trap and sprang her own, sending mercenaries posing as
      plague-infected close enough to ambush the Cerberus operatives.
    source_chunks: [aria-t-loak_009, oleg-petrovsky_003]
  - text: >
      In the confusion Aria slipped into Afterlife to contact the Illusive Man. Ashe,
      believing Petrovsky had failed, remotely released an Adjutant he had smuggled into the
      building; it killed Aria's bodyguard Anto. Aria knocked it outside, where it infected
      Ashe before she destroyed it, and Petrovsky shot the transforming Ashe to protect his
      men.
    source_chunks: [aria-t-loak_009, oleg-petrovsky_003, raymond-ashe_001]
  - text: >
      Able at last to talk, Petrovsky told Aria he had already won: a Cerberus fleet was
      poised to destroy Omega level by level. He gave her two options — keep fighting and be
      destroyed with the station, or accept exile and surrender Omega to Cerberus.
    source_chunks: [oleg-petrovsky_003, aria-t-loak_009]
  - text: >
      Unwilling to see Omega destroyed, Aria conceded and left, warning Petrovsky she would
      return one day. In his report to the Illusive Man, Petrovsky claimed Aria had most
      likely been killed and turned into an Adjutant, and that Ashe was missing, presumed
      dead.
    source_chunks: [oleg-petrovsky_003, aria-t-loak_009]
