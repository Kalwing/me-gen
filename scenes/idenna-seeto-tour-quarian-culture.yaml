scene_id: idenna-seeto-tour-quarian-culture
title: Seeto Tours the Idenna, Sharing Quarian Life
kind: hangout
game: Mass Effect
when: "2183, during Mass Effect: Ascension, when Kahlee Sanders is released from quarantine aboard the Migrant Fleet"
where: "the quarian ship Idenna in the Migrant Fleet — Seeto's quarters and the trading deck"
participants: [Seeto'Hodda nar Idenna, Kahlee Sanders, Hendel Mitra, Gillian Grayson]
heard_by: [crew of the Idenna]
requires: []
beats:
  - text: >
      During Kahlee Sanders' quarantine aboard the Migrant Fleet, Seeto'Hodda nar Idenna
      befriended her. The young quarian security officer was exuberant and curious, and
      Kahlee appreciated his enthusiasm. Seeto greatly admired his captain, Ysin'Mal vas
      Idenna, and shared the captain's belief that the Fleet needed to change its policies
      to survive.
    source_chunks: [seeto-hodda-nar-idenna_001]
  - text: >
      When Kahlee was finally released from quarantine, Seeto gave her, Hendel Mitra, and
      Gillian Grayson a brief tour of the Idenna. The tour included his own sleeping
      quarters and the ship's trading deck, offering them insight into quarian culture and
      life aboard the Migrant Fleet.
    source_chunks: [seeto-hodda-nar-idenna_001]
