scene_id: citadel-incinerator-keenah-death
title: Keenah Dies and Tali Traps Jacobus in the Incinerator
kind: mission-aside
game: "Mass Effect: Homeworlds"
when: 2183, during Tali'Zorah's Pilgrimage, before the events of Mass Effect
where: a maintenance area and incinerator deep inside the Citadel
participants: [Tali'Zorah nar Rayya, Keenah'Breizh, Jacobus]
private_to: [Tali'Zorah nar Rayya, Keenah'Breizh, Jacobus]
heard_by: []
requires: []
beats:
  - text: >
      After C-Sec officer Chellick releases Tali and Keenah with orders to leave the station,
      and an Avina terminal tells them a Council audience is a seven-month wait, Jacobus
      catches up with them and opens fire, chasing the two quarians into a Citadel
      maintenance area.
    source_chunks: [mass-effect-homeworlds-2_004, storyline_025]
  - text: >
      Tali is shot in the side during the chase; Keenah is mortally wounded. They reach an
      incinerator, and Tali spots catwalks they could climb to escape, but Keenah collapses
      and dies before they can use them.
    source_chunks: [mass-effect-homeworlds-2_004, keenah-breizh_001]
  - text: >
      Tali leaves Keenah's body and sets a trap of her own. When Jacobus follows her into the
      incinerator, she seals the doors behind him and activates it, burning him alive. The
      blast destroys Jacobus, Keenah's body, and a computer Tali had rigged to play her
      father's farewell message.
    source_chunks: [storyline_025, keenah-breizh_001, jacobus_001]
