scene_id: feros-shiala-cipher-transfer
title: Shiala Gives Shepard the Prothean Cipher
kind: mission-aside
game: Mass Effect
when: "2183, Feros, after the Thorian is destroyed"
where: the Thorian's lair, Feros

participants: [Shepard, Shiala]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Shiala, an asari formerly working for Saren who had been offered to the Thorian as a
      "sacrifice," explains that the Thorian gained the Prothean cipher — the cultural
      knowledge and instincts needed to make sense of a beacon's visions — by watching and
      studying the Protheans on Feros over millennia, consuming some of them as they died
      and assimilating what they knew. When Shiala melded with the Thorian, she shared its
      consciousness and gained the cipher herself.
    source_chunks: [cipher_001]
  - text: >
      Shiala transfers the cipher directly into Shepard's mind. The experience leaves the
      Commander badly shaken, but it is necessary to make sense of the Eden Prime beacon's
      vision and find the Conduit.
    source_chunks: [cipher_001]

