scene_id: normandy-ashley-romance-and-farewell
title: Rekindling with Ashley, from Sarah's Grief to the Push on Earth
kind: hangout
game: Mass Effect 3
when: 2186, across the Reaper War, from Ashley's return to the Normandy through the final assault on Earth
where: the SSV Normandy SR-2 (Ashley's quarters, the Captain's Quarters), the Citadel, and the London FOB

participants: [Shepard, Ashley Williams]
private_to: [Shepard, Ashley Williams]
heard_by: [Normandy crew]

requires:
  - virmire_survivor: Ashley
  - romance: Ashley

beats:
  - text: >
      Once Ashley is aboard the Normandy, taking up the Starboard Observation Deck
      quarters formerly occupied by Samara, she says little unless Shepard is pursuing a
      relationship with her. She sends an email asking for help: her younger sister Sarah,
      newly widowed, doesn't want to face her grief alone, and Ashley wants to comfort
      her. Shepard's being comforting and respectful with Ashley over this cements the
      relationship further.
    source_chunks: [ashley-williams_014]
  - text: >
      Ashley later emails Shepard to meet her on the Citadel. There she tells him her
      father would have liked him, apologizes for everything that has happened between
      them, and asks if they are "going somewhere." If Shepard reciprocates, they kiss.
    source_chunks: [ashley-williams_014]
  - text: >
      Just before the assault on Cerberus Headquarters, Ashley visits the Captain's
      Quarters and, unless turned away outright, tries to comfort Shepard over everyone
      they've lost — telling him how lost she felt herself, and how it broke her heart
      when he died. The two finally admit they love each other, kiss, and spend the night
      together.
    source_chunks: [ashley-williams_014]
  - text: >
      In a final conversation on Earth, Shepard and Ashley reflect on how many times
      they've saved each other. Shepard recites lines from Tennyson's "The Charge of the
      Light Brigade." Ashley tells him she doesn't want him to go and that she loves him;
      he says he loves her too and tells her to get it done and go home. She answers, in a
      breaking voice, "aye aye, Captain."
    source_chunks: [ashley-williams_014]
  - text: >
      If Ashley is Shepard's love interest, the last thing Shepard sees is an image of her
      looking at him and smiling warmly. If Shepard dies firing the Crucible, Ashley later
      places his name on the Normandy's memorial wall; if the Reapers are destroyed and
      enough of the galaxy's forces were mustered, she smiles instead and does not place
      the plaque, as the Normandy flies off.
    source_chunks: [ashley-williams_014]

