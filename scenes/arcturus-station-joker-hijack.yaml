scene_id: arcturus-station-joker-hijack
title: Joker Hijacks the Normandy's Test Flight
kind: mission-aside
game: Mass Effect
when: "2183, Arcturus Station (Mass Effect: He Who Laughs Best)"
where: Arcturus Station

participants: [Jeff "Joker" Moreau, David Anderson, Dillard, Invectus]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Arcturus Station hosts the first test flight of the newly completed SSV Normandy, an
      Alliance stealth frigate designed with the Turian Hierarchy. Alliance captains David
      Anderson and Dillard attend along with Hierarchy General Invectus.
    source_chunks: [arcturus-station_007]
  - text: >
      Jeff "Joker" Moreau traps the Normandy's original pilot on the station, locks himself in
      the cockpit, and hijacks the ship to prove he can fly it better. A patrol of fighters is
      scrambled to disable the Normandy, but Joker evades them and returns the ship to dock
      unscathed.
    source_chunks: [arcturus-station_007]
  - text: >
      Impressed, General Invectus pressures the Alliance into assigning Joker as the
      Normandy's pilot.
    source_chunks: [arcturus-station_007]

