scene_id: normandy-tali-stealth-experiment
title: Tali's Improvement to the Stealth Systems
kind: banter
game: Mass Effect 3
when: 2186, after Tali rejoins the crew
where: engineering, Normandy SR-2

participants: [Shepard, Tali'Zorah vas Normandy, Gregory Adams, Kenneth Donnelly, Gabriella Daniels]
private_to: []
heard_by: [Normandy crew]

requires:
  - rannoch: resolved

beats:
  - text: >
      Tali proposes using the Normandy's weapon sinks to extend stealth mode, borrowing the
      idea from quarian practice during drive core discharge.
    source_chunks: [tali-zorah-nar-rayya_010]
  - text: >
      Adams, Donnelly and Daniels all try to talk her out of it — the SR-2 is state of the art
      and may not take kindly to being tampered with — and then let her do it anyway, because
      they trust her.
    source_chunks: [tali-zorah-nar-rayya_010]
  - text: >
      The experiment causes a major power surge and damages systems. Tali sighs and starts on
      the repairs.
    source_chunks: [tali-zorah-nar-rayya_010]
  - text: >
      Chakwas, meanwhile, makes sure the med-bay is stocked with dextro-compatible supplies
      once Tali is back aboard.
    source_chunks: [karin-chakwas_007]

