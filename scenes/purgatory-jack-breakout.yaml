scene_id: purgatory-jack-breakout
title: Breaking Jack Out of Purgatory
kind: mission-aside
game: Mass Effect 2
when: 2185, after Freedom's Progress
where: the turian prison ship Purgatory
participants: [Shepard, Jack, Warden Kuril, Miranda Lawson, Jacob Taylor]
heard_by: [Normandy crew]
beats:
  - text: >
      The Normandy docks at Purgatory, where Cerberus has paid for the release of the
      prisoner Jack. The turian station commander, Warden Kuril, welcomes Shepard,
      declines to take the squad's weapons, gives a short tour of Cellblock Two and its
      ejectable cells, then leaves to confirm the credit transfer.
    source_chunks: [dossier-the-convict_004]
  - text: >
      At Outprocessing, Kuril betrays Shepard over the intercom — the Commander is too
      valuable to leave without a price tag — and activates the prison's defences.
    source_chunks: [dossier-the-convict_004]
  - text: >
      Fighting through Blue Suns mercs, FENRIS and YMIR mechs, and rioting prisoners,
      Shepard reaches a security console and releases Jack from cryostasis. Jack breaks
      her restraints, destroys the four YMIR Mechs guarding her cell with a single
      biotic blast, and smashes a hole through the wall.
    source_chunks: [dossier-the-convict_005]
  - text: >
      Kuril makes a final stand with an M-76 Revenant behind a shield fed by three
      generators. Shepard destroys the generators and kills him.
    source_chunks: [dossier-the-convict_008, dossier-the-convict_009]
  - text: >
      Jack reaches the airlock and kills the guards. Seeing the Cerberus logo on the
      Normandy sends her into a rage; a batarian guard moves to ambush her and Shepard
      shoots him in the head.
    source_chunks: [dossier-the-convict_010]
  - text: >
      Jack agrees to join in exchange for access to Cerberus files aboard the ship;
      Miranda and Jacob object. Back on the Normandy she demands the files, takes an
      immediate dislike to Miranda — "the cheerleader" — and settles into the sub-deck
      below main engineering.
    source_chunks: [dossier-the-convict_010]
  - text: >
      Because freeing Jack required releasing every prisoner, Shepard receives a
      threatening email from an escaped psychopath named Billy.
    source_chunks: [dossier-the-convict_011]
related_scenes: [normandy-jack-miranda-confrontation]
related_events: [jack-recruitment-purgatory]
source_chunks: [dossier-the-convict_004, dossier-the-convict_005, dossier-the-convict_008, dossier-the-convict_009, dossier-the-convict_010, dossier-the-convict_011]
