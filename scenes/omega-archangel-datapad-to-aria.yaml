scene_id: omega-archangel-datapad-to-aria
title: Handing Aria the Archangel Datapad
kind: mission-aside
game: Mass Effect 2
when: 2185, Omega, after the Archangel recruitment mission
where: Aria's booth on the upper level of the Afterlife Club
participants: [Shepard, Aria T'Loak, Garka]
heard_by: [Normandy crew]
beats:
  - text: >
      While recruiting Archangel, Shepard read a datapad near the Eclipse leader Jaroth: a
      message from Jaroth to Tarak confirming that Garm and the Blood Pack had joined the
      operation, and that none of the three mercenary organisations could move against Aria
      without the other two.
    source_chunks: [omega-archangel-datapad-recovered_001, omega-archangel-datapad-recovered_002]
  - text: >
      After the mission Shepard brought the datapad to Aria at Afterlife. She glanced at it
      once, flung it into Garka's face, and demanded to know how the information had slipped
      their intelligence net; Garka stammered that he would look into it.
    source_chunks: [omega-archangel-datapad-recovered_003, garka_001]
  - text: >
      Aria thanked Shepard for handing it over. If "Omega: The Patriarch" was already done,
      she forwarded coordinates to an Eclipse depot she had no use for. Taking the reward, or
      saying "Just like that?", gave Renegade points; refusing gave Paragon points, and she
      sent the coordinates regardless.
    source_chunks: [omega-archangel-datapad-recovered_003]
related_scenes: [omega-afterlife-aria-first-meeting, omega-patriarch-afterlife, omega-archangel-garrus-last-stand]
source_chunks: [omega-archangel-datapad-recovered_001, omega-archangel-datapad-recovered_002, omega-archangel-datapad-recovered_003, garka_001]
