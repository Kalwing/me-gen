scene_id: citadel-cortez-docking-bay-and-memorial-wall
title: Cortez Says Goodbye to Robert
kind: downtime
game: Mass Effect 3
when: 2186, Citadel shore leave during the Reaper War, after Shepard talks him into taking time off
where: the Normandy's docking bay on the Citadel, then the refugee-camp Memorial Wall
participants: [Shepard, Steve Cortez]
private_to: [Shepard, Steve Cortez]
heard_by: [Normandy crew]
beats:
  - text: >
      On a Citadel stop Shepard finds Cortez off the ship at last, loitering at the Normandy's
      docking bay because the sight of so many ships in flight comforts him and gets him thinking.
      He again doubts why he survived Ferris Fields when Robert did not, musing it might have been
      better to go down fighting beside the people he loved. Shepard steers him off it, pointing
      out that if he had died there the two of them would never have met.
    source_chunks: [steve-cortez_006, steve-cortez_003]
  - text: >
      Cortez then goes to the Memorial Wall the refugees put up for victims of Collector and
      Reaper attacks and says goodbye to Robert. Shepard offers words of support, telling him
      his past is his own and nobody can take it from him. Cortez thanks him for the encouragement.
    source_chunks: [steve-cortez_006, steve-cortez_003]
  - text: >
      The downtime helps Cortez begin to move on. He reconnects with old pilot friends and
      forwards their information to Admiral Hackett, giving the Alliance some badly needed pilots.
    source_chunks: [steve-cortez_003]
related_scenes: [normandy-shuttle-bay-cortez-grief, citadel-purgatory-cortez-dance]
source_chunks: [steve-cortez_006, steve-cortez_003]
