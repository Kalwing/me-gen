requires: []
beats:
  - text: >
      Rear Admiral Jon Grissom died of natural causes in late 2185 or early 2186. His state
      funeral drew hundreds of dignitaries from across the Alliance, including Admiral David
      Anderson. Kahlee Sanders, Grissom's biological daughter, attended the ceremony as a
      member of the Jon Grissom Academy faculty, maintaining the classified secret that she
      was Grissom's daughter.
    source_chunks: [jon-grissom_004]
  - text: >
      A memorial plaque bearing Grissom's name and likeness was erected in the mess hall of
      the Jon Grissom Academy, which had been named after him.
    source_chunks: [jon-grissom_004]
