title: Jon Grissom's State Funeral
kind: ceremony
game: Mass Effect
when: "late 2185 or early 2186, six months before the Paul Grayson incident; referenced in Mass Effect: Retribution"
where: "location unspecified; hundreds of dignitaries attended"
participants: [Jon Grissom, David Anderson, Kahlee Sanders]
private_to: []
