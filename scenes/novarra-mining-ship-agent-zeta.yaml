scene_id: novarra-mining-ship-agent-zeta
title: Viegle's Death Aboard the Novarra
kind: mission-aside
game: Mass Effect
when: during Andromeda Initiative recruitment mission, Citadel/Novarra
where: quarian strip-mining ship Novarra; earlier Citadel lower wards
participants: [Luna Shanks, Sanjin Vinnick, Captain Jakin, Viegle, Agent Zeta]
private_to: []
heard_by: []
requires:
  - game: Mass Effect
beats:
  - text: >
      Luna Shanks and Sanjin Vinnick search the Citadel's lower ward flophouses for leads
      on quarian scientist Shio'Leth vas Novarra. They find a wrecked hovel and discover
      someone else is already hunting the quarian. Among the ruins lies an encrypted datapad.
      Vinnick uses encrypted military contacts to obtain the coordinates of the mining ship
      Novarra; Shanks grows wary of his furtive communications but accepts his explanation
      that his contacts' lives could be jeopardized.
    source_chunks: [luna-shanks_001]
  - text: >
      On the Novarra, Shanks and Vinnick introduce themselves to Captain Jakin. The quarian
      Viegle, who knew Shio, quickly asks if Shio is alive, then nervously claims they were
      only friends when questioned by Shanks. Viegle reveals Shio was exiled from the fleet.
      Shanks asks Jakin to open the encrypted datapad; when he declines and reaches for it,
      she pulls it away. Vinnick grows impatient and confronts Jakin, but Shanks tries to
      de-escalate and find a compromise.
    source_chunks: [luna-shanks_001]
  - text: >
      A biotic salarian, Agent Zeta, arrives at the mining camp asking for Viegle. Shanks
      grabs Viegle and heads for the back door; Zeta destroys the office behind them. Shanks
      shields Viegle with her body from the blast, hands him to Vinnick, and orders them to
      escape while she engages Zeta. During the fight, Shanks learns Zeta is hunting Viegle
      but the salarian claims he is being followed, not doing the hunting. Zeta blasts Shanks
      off a cliff; Vinnick returns and helps her climb back up.
    source_chunks: [luna-shanks_001, luna-shanks_002]
  - text: >
      At the cliff top, Shanks finds Jakin and his crew slaughtered by Zeta. She sees Viegle's
      body being crushed by Zeta's biotics. Vinnick tells her it is too late to fight; Shanks
      rushes to Viegle's side and comforts him as he dies. Viegle reveals Shio is his husband
      and divulges that Shio fled to Omega before Zeta tortured the information out of him.
      Shanks holds the encrypted datapad as Viegle expires.
    source_chunks: [luna-shanks_002]
