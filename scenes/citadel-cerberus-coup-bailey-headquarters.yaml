scene_id: citadel-cerberus-coup-bailey-headquarters
title: Retaking C-Sec Headquarters During the Cerberus Coup
kind: mission-aside
game: Mass Effect 3
when: "2186, Citadel, during Cerberus's assault on the Citadel (Priority: The Citadel II)"
where: C-Sec Headquarters, the Citadel

participants: [Shepard, Armando-Owen Bailey]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      When Cerberus launches its assault on the Citadel, Bailey is wounded trying to retake
      C-Sec Headquarters. Shepard arrives and dispatches the attackers holding him down.
    source_chunks: [armando-owen-bailey_005]
  - text: >
      Bailey gains access to headquarters and sets up a backup network so his fellow officers
      can plan a counterattack. He discovers a message from the salarian councilor, who was
      supposed to meet the executor, warning that someone on the Citadel has betrayed them to
      Cerberus.
    source_chunks: [armando-owen-bailey_005]
  - text: >
      Having learned Udina is the traitor, Bailey helps Shepard beat Kai Leng to the Council,
      personally making his way to Shepard's position and forcing Leng to flee; Bailey guesses
      Leng fled because he figured Udina's plan would fail.
    source_chunks: [armando-owen-bailey_005]
  - text: >
      After the coup, Shepard asks Bailey if he ever suspected Udina. Bailey admits Udina
      always rubbed him the wrong way and feels Udina made him look a fool by proving him
      right; Shepard cheers him up by pointing out Udina is dead and Bailey is alive. Bailey
      thanks Shepard, saying that without the Commander's arrival both Udina and Cerberus
      would have been dancing on his grave.
    source_chunks: [armando-owen-bailey_005]

