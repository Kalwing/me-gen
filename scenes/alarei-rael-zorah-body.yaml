scene_id: alarei-rael-zorah-body
title: Retaking the Alarei, and Finding Rael'Zorah
kind: mission-aside
game: Mass Effect 2
when: 2185, during Tali's trial at the Migrant Fleet, the hearing recessed
where: a shuttle from the Rayya, then the geth-overrun quarian lab ship Alarei

participants: [Shepard, Tali'Zorah vas Normandy]
private_to: [Shepard, Tali'Zorah vas Normandy]
heard_by: [Normandy crew]

requires:
  - tali_trial: any

beats:
  - text: >
      Mid-trial the Admiralty Board reveals that the lab ship Alarei has been overrun by the
      reactivated geth and that Rael'Zorah, working aboard, is presumed dead. Tali refuses to
      accept it. She and Shepard take a shuttle from the Rayya to the Alarei, the hearing
      recessed until they return.
    source_chunks: [tali-treason_005, tali-treason_008, rael-zorah_003]
  - text: >
      They fight room to room through Geth Troopers and cloaked Geth Hunters — the geth Rael
      had secretly been rebuilding from the deactivated components Tali shipped home on his
      orders. Quarian logs recovered along the way record the team's mounting alarm as the
      platforms came back online.
    source_chunks: [tali-treason_005, tali-treason_006, tali-treason_007, rael-zorah_003]
  - text: >
      At a wall console Tali confronts what the research was for: her father's dangerous work
      was tied to his promise to build her a house on the reclaimed homeworld. Shepard can
      argue for pressing the reclamation of Rannoch or for letting that dream go.
    source_chunks: [tali-treason_006]
  - text: >
      Past the last of the geth the squad reaches a dead quarian's body, which triggers Tali
      finding her father. Rael'Zorah is dead, killed along with his entire research team by the
      geth he brought back.
    source_chunks: [tali-treason_007, rael-zorah_003]
  - text: >
      Tali recovers her father's final data — how to shut the geth down, and an instruction to
      show it to Han'Gerrel and Daro'Xen. Whether Shepard spends it as evidence at the trial
      decides how the verdict falls and whether Rael's name survives; Tali says that if his
      deeds come out he will be struck from every ship's rolls and remembered as the worst war
      criminal in quarian history. Told the truth privately, Han'Gerrel vows to bury it to
      protect Rael's legacy.
    source_chunks: [tali-treason_008, tali-treason_013, han-gerrel-vas-neema_002]
  - text: >
      After the mission Daro'Xen messages Shepard: she has been through the Alarei, salvaged
      what Rael left of his experiments, and intends to finish his work — the quarians
      reclaiming not just the homeworld but the largest synthetic army in the galaxy.
    source_chunks: [tali-treason_010]

