scene_id: verrikan-zaeed-and-tristana-raid
title: Zaeed and Tristana Raid the Turian Frigate Verrikan
kind: mission-aside
game: Mass Effect
when: "around 2183, in Mass Effect: Foundation"
where: the outer hull, airlock, and bridge of the turian frigate Verrikan; later crashing toward Impera
participants: [Zaeed Massani, Tristana, Jace Reyn, Zaeed's inside man, salarian tech specialist]
private_to: [Zaeed Massani, Tristana, Jace Reyn]
heard_by: [Turian navy, Vido Santiago]
beats:
  - text: >
      Former Justicar Tristana was approached by Zaeed Massani during one of her assassination
      stints; he offered her a lucrative contract: bring down the turian frigate Verrikan.
      Tristana initially doubted it was a winnable job, but Zaeed's promised payout convinced her.
      At his mission briefing, Tristana vocally expressed skepticism that four soldiers could take
      a frigate, but Zaeed assured her they would rely on stealth, not strength, and had thought
      of everything.
    source_chunks: [tristana_001]
  - text: >
      During the mission, Tristana and the other mercenaries reached the frigate's outer hull,
      secured by tether cables. Zaeed's inside man was caught trying to let them in and was shot
      by turians. The intruders were blown off the outer airlock but the cables held them.
      Their salarian tech specialist was lost in the blast. The team found another way into the ship.
    source_chunks: [tristana_001]
  - text: >
      Tristana and the other merc Jace Reyn were ordered to draw turian fire while Zaeed made
      for the bridge. She unleashed biotic attacks against swarming turians, calling the grinding
      firefight pointless. She then slipped through a door, locked it behind her, and abandoned
      Reyn to hold position alone.
    source_chunks: [tristana_001]
  - text: >
      Tristana reached the bridge in time to see Zaeed facing over a dozen turians. She blew
      the head off Zaeed's turian hostage, splattering half his face in brains; Zaeed complained
      about it but she quipped his hostage didn't look so smart anymore. The two defeated the
      dozen-plus armed turians together.
    source_chunks: [tristana_001]
  - text: >
      Tristana demanded the payout be split fifty-fifty with Zaeed instead of following the
      original agreement. When Zaeed set the ship to crash on Impera, she turned on him:
      Vido Santiago had hired her to kill Zaeed after the Verrikan job, and she wasn't one to
      waste an opportunity.
    source_chunks: [tristana_001]
  - text: >
      As the frigate fell into Impera's gravity well, Tristana lost her biotic grip on Zaeed
      and the ex-lovers fought hand to hand while the ship broke apart around them. She took
      a knife below her right breast while choking him. A hull breach sucked them both out
      into the void. Zaeed grabbed a handhold above her and told her he'd show her a good time
      but that his heart belonged to someone else. He kicked her in the face, breaking her grip
      and sending her plummeting to the surface far below.
    source_chunks: [tristana_001]
