scene_id: citadel-petrovsky-family-argument
title: The Petrovskys, Arguing Over Jake
kind: argument
game: Mass Effect
when: 2183-2186, three separate encounters across the trilogy
where: outside Barla Von's office, the Presidium; then Zakera Ward market, level 26; then the Presidium Commons

participants: [Shepard, Rebekah Petrovsky, Michael Petrovsky]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Returning to the Citadel after Therum, Noveria or Feros, Shepard finds Rebekah and
      Michael Petrovsky arguing by the Rapid Transit stop outside Barla Von's office.
      Rebekah's husband Jacob, Michael's brother, died recently of a rare heart condition; she
      is carrying his child and it may have inherited it. Michael wants in-utero gene therapy
      to fix it; Rebekah, wary of extranet reports calling the therapy dangerous, prefers
      safer but less effective alternatives.
    source_chunks: [citadel-family-matter_002, citadel-family-matter_003]
  - text: >
      Shepard argues for the therapy, against it, or stays neutral, deciding the outcome for
      the family.
    source_chunks: [citadel-family-matter_003]
  - text: >
      Persuaded into the gene therapy, Rebekah's prejudice against it fades and she and
      Michael reconcile, going on to discuss further modifications for Jake.
    source_chunks: [citadel-family-matter_001]
    conditional: {petrovsky_argument: therapy}
    choice: argued for the therapy
  - text: >
      Persuaded to respect Rebekah's wishes instead, Michael and Rebekah likewise reconcile,
      settling on the safer, less effective treatments.
    source_chunks: [citadel-family-matter_001]
    conditional: {petrovsky_argument: no_therapy}
    choice: argued against the therapy
  - text: >
      Staying neutral leaves them unable to resolve it themselves — the rift between them
      never closes on its own.
    source_chunks: [citadel-family-matter_001]
    conditional: {petrovsky_argument: neutral}
    choice: stayed neutral
  - text: >
      By 2185, with the child born and named Jake after his father's nickname, Rebekah and
      Michael are found still arguing on the 26th floor of the Zakera Ward market — this time
      over Jacob's legacy and how to raise him — with no way for Shepard to intervene. Their
      positions have shifted to match whichever way the earlier argument was settled.
    source_chunks: [citadel-family-matter_004]
  - text: >
      By 2186, after Priority: Palaven, the two are on the Presidium Commons arguing again,
      now over whether to keep Jake in daycare during the Reaper War. Shepard can only
      support them in doing what's best for their family; if the original argument was
      settled in Mass Effect, Shepard recalls meeting them before.
    source_chunks: [citadel-family-matter_005]

