scene_id: omega-golo-dealings-and-the-trap-for-lemm
title: Golo's Dealings on Omega
kind: mission-aside
game: Mass Effect
when: "2183, during Mass Effect: Ascension, after the ambush on Shelba"
where: Omega — Golo's place and near Pel's warehouse
participants: [Golo, Pel, Lemm'Shal nar Tesleya]
private_to: [Golo, Pel, Lemm'Shal nar Tesleya]
heard_by: [Cerberus]
requires: []
beats:
  - text: >
      Back on Omega after Shelba, Golo's work went wrong: Hilo'Jaa, the captured Cyniad
      pilot, contracted a virulent disease, making it harder for Pel to interrogate him for
      the Migrant Fleet codes. To make amends, Golo brought Pel an offer from the Collectors,
      who were interested in buying healthy human biotics — naming Gillian Grayson.
    source_chunks: [golo_002]
  - text: >
      Believing himself safe once the offer was passed on, Golo ran into Lemm'Shal nar
      Tesleya, a young quarian on his Pilgrimage who had heard of the Cyniad ambush and
      suspected Golo's hand in it. Held at gunpoint, Golo claimed he had only been a
      middleman and, playing the friend, sent Lemm to find Hilo in Pel's warehouse.
    source_chunks: [golo_002]
  - text: >
      Golo tipped Pel and his men off first, hoping they would kill the young quarian.
      Lemm, not trusting Golo, struck before Pel's people were ready, and escaped to the
      Migrant Fleet with Kahlee Sanders, Hendel Mitra and Gillian Grayson after pulling
      them out of Pel's warehouse.
    source_chunks: [golo_002]
