scene_id: wilderness-samara-nihlus-pursuit
title: Samara and Nihlus's Two-Week Pursuit
kind: banter
game: Mass Effect 2
when: before 2185, during Nihlus's tenure as a Spectre
where: wilderness terrain over two weeks of pursuit
participants: [Samara, Nihlus, innocent civilian]
private_to: [Samara, Nihlus]
heard_by: []
requires: []
beats:
  - text: >
      Samara, an asari justicar bound by her Code to strike down murderers, witnessed Nihlus
      Kryik kill an unarmed civilian. Compelled by her oath, she pursued him to make him
      answer for the crime.
    source_chunks: [nihlus-kryik_004]
  - text: >
      For two weeks Samara and Nihlus played a deadly game of cat and mouse in the wilderness,
      each pressing advantages and exploiting weaknesses. Neither could afford to rest; the
      pursuit was relentless.
    source_chunks: [nihlus-kryik_004]
  - text: >
      Nihlus eventually turned the tables by using Samara's own Code against her: he maneuvered
      her into a position where she had to choose between saving the life of an innocent or
      capturing him. Bound by her oath to defend the innocent above all, Samara chose to let
      the civilian live and Nihlus escape.
    source_chunks: [nihlus-kryik_004]
  - text: >
      Though she failed to capture her quarry, Samara came away impressed by Nihlus's
      adaptability and his understanding of justicar law. The encounter left her with a
      measure of respect for the turian Spectre, despite his crime.
    source_chunks: [nihlus-kryik_004]
