scene_id: earth-initiative-hq-vinnick-recruitment
title: Vinnick Joins the Initiative
kind: banter
game: Mass Effect
when: pre-departure, Andromeda Initiative preparations, Earth
where: Andromeda Initiative headquarters, Earth
participants: [Luna Shanks, Jien Garson, Sanjin Vinnick]
private_to: []
heard_by: [Initiative staff]
requires:
  - game: Mass Effect
beats:
  - text: >
      A violent anti-Initiative rally staged outside the headquarters turns into an assault
      on protesters and applicants. Luna Shanks, head of Garson's security, uses her biotics
      to disperse the mob. A beaten turian attempts to slip through the chaos; Shanks helps
      him up, assuming he is far from Palaven.
    source_chunks: [jien-garson_002, luna-shanks_001]
  - text: >
      The turian, Sanjin Vinnick, claims he came to Earth on purpose to join the Initiative
      despite his background being disqualifying. When he insists his skill set makes him
      valuable, Shanks dismisses him and tells him to get on the wait list. Jien Garson
      overhears their exchange and directs Shanks to escort Vinnick upstairs to her office.
    source_chunks: [jien-garson_002, luna-shanks_001]
  - text: >
      In Garson's office, Vinnick introduces himself. Garson has already reviewed his
      military record during the elevator ride and reveals she needs him to find Shio'Leth
      vas Novarra, a quarian scientist whose calculations are critical to the Initiative's
      course to Andromeda. Shio has gone missing, and Garson discovered a flaw in the
      calculations. Time is critical—the Initiative launches soon. Garson sends Shanks and
      Vinnick to the Citadel to locate him.
    source_chunks: [jien-garson_002]
related_scenes: [citadel-shanks-vinnick-lower-ward-search]
related_events: []
