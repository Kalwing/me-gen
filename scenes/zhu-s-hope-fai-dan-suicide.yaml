scene_id: zhu-s-hope-fai-dan-suicide
title: Fai Dan's Final Stand at Zhu's Hope
kind: mission-aside
game: Mass Effect
when: "2183, during Feros: The Thorian mission"
where: Zhu's Hope colony settlement on Feros
participants: [Shepard, Fai Dan]
private_to: []
heard_by: [Zhu's Hope colonists, Shepard's squad]
beats:
  - text: >
      After Shepard returns from the ExoGeni headquarters and has disarmed the
      Thorian-controlled colonists at Zhu's Hope using nerve gas grenades, Shepard's
      squad encounters Fai Dan, the colony leader, as he approaches with a pistol in
      hand. Fai Dan is struggling against the Thorian's psychic control, the spores
      still affecting him more severely than he has let on.
    source_chunks: [fai-dan_002]
  - text: >
      Fai Dan laments the infection of his colonists and expresses his sense of
      responsibility for their fate, as their leader. He points the pistol at Shepard,
      claiming that the Thorian demands the Commander be stopped. The situation is
      dangerous, and Shepard begins to draw a weapon in self-defense.
    source_chunks: [fai-dan_002]
  - text: >
      Before Shepard can fire, Fai Dan overcomes the Thorian's control through sheer
      force of will. Refusing to be the Thorian's tool any longer, he declares "I won't!"
      and shoots himself in the head, choosing death over continued enslavement to the
      alien creature. His defiant act ends both his own suffering and the Thorian's hold
      over him.
    source_chunks: [fai-dan_002, fai-dan_003]
related_events: [feros-the-thorian]
source_chunks: [fai-dan_002, fai-dan_003]
