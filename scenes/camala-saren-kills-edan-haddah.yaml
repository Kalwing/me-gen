scene_id: camala-saren-kills-edan-haddah
title: Saren Settles the Sidon Trail on Camala
kind: mission-aside
game: Mass Effect
when: 2165, after the Dah'tan Manufacturing raid
where: an eezo refinery on the batarian world Camala
participants: [Saren Arterius, Edan Had'dah, Shu Qian]
private_to: [Saren Arterius, Edan Had'dah, Shu Qian]
heard_by: []
beats:
  - text: >
      A Dah'tan Manufacturing worker survived Skarr's attack on the Camala facility long enough
      to give the Spectre Saren Arterius the name Edan Had'dah. Saren traced Had'dah and Dr. Shu
      Qian to an eezo refinery on Camala where the batarian aristocrat and the scientist were
      holed up with the Prothean artifact, and attacked it.
    source_chunks: [edan-had-dah_002, shu-qian_001]
  - text: >
      Confronted by Saren, Had'dah tried to save himself by giving up Qian, claiming the
      doctor's obsession with the research had made him a liability. Saren killed Qian.
    source_chunks: [edan-had-dah_002, shu-qian_001]
  - text: >
      Had'dah then bargained hard for his own life, arguing that Saren would need his money,
      resources and contacts to unlock the artifact and that killing him would set the work back
      years. Saren answered that he was a patient man who did not mind waiting, and shot Had'dah
      dead.
    source_chunks: [edan-had-dah_002]
source_chunks: [edan-had-dah_002, shu-qian_001]
