scene_id: omega-anderson-kahlee-capture-kai-leng
title: Anderson and Kahlee Haul Kai Leng to Grissom Academy
kind: mission-aside
game: Mass Effect 3
when: circa 2185, after Grayson's Reaper transformation, during Mass Effect Retribution
where: Omega's spaceport and a Cerberus shuttle; then the Jon Grissom Academy
participants: [David Anderson, Kahlee Sanders, Kai Leng, Nick Donahue, Paul Grayson]
private_to: []
heard_by: []
requires:
  - game: Mass Effect 3
beats:
  - text: >
      On Omega, after the Reaper-controlled Grayson fights his way clear of Aria's ambush,
      Kai Leng — who has been shadowing Grayson for Cerberus — offers David Anderson and
      Kahlee Sanders a ride off the station in exchange for help bringing Grayson down.
      They know he is Cerberus and attack him; he beats them, then offers again, this time
      claiming Grayson's condition can be reversed, knowing Kahlee is the key to finding
      him. They accept.
    source_chunks: [kai-leng_010, kahlee-sanders_004, storyline-iii_004]
  - text: >
      At Leng's shuttle they run into turian security guards. Anderson distracts Leng,
      tasers him, talks the guards into letting him take the limp body, and lashes Leng to
      the copilot seat with rope from the shuttle's med kit. On the way Kahlee works out
      that the Reapers are driving Grayson to the Jon Grissom Academy.
    source_chunks: [kai-leng_010, david-anderson_008]
  - text: >
      At the Academy, Anderson and Kahlee leave Leng bound aboard and split up — she to
      rouse the staff and evacuate students, he to hunt Grayson. Leng saws himself free,
      bleeding, gets inside, and talks a gifted biotic student, Nick Donahue, into helping
      him by claiming he is on their side.
    source_chunks: [kai-leng_010, storyline-iii_005, nick-donahue_003]
  - text: >
      Leng tries to ambush Grayson using Nick's biotics; it fails and Nick is shot in the
      stomach. Anderson wounds Grayson with a shotgun; the avatar is finished off with a
      pistol. Anderson then has to choose between holding Leng and saving Nick, because
      Leng refuses to put pressure on the boy's wound. Anderson shoots Leng through each
      leg, then goes to help Kahlee keep Nick alive. Crippled, Leng still reaches the
      shuttle and escapes.
    source_chunks: [storyline-iii_005, david-anderson_008, kahlee-sanders_004]
  - text: >
      Everyone at Grissom Academy recovers. Anderson decides to study Grayson's remains
      for anything usable against the Reapers and asks Kahlee to join his team; she agrees,
      and kisses him.
    source_chunks: [storyline-iii_005, kahlee-sanders_004]
