scene_id: aite-atlas-station-david-archer
title: The Truth Behind Project Overlord
kind: mission-aside
game: Mass Effect 2
when: 2185, the Overlord DLC, after Shepard overrides the lockdowns at Prometheus and Vulcan Stations
where: Atlas Station, Aite

participants: [Shepard, Gavin Archer]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Having overridden the lockdowns at Prometheus Station and Vulcan Station, Shepard
      reaches Atlas Station, the main laboratory of Cerberus's Project Overlord. Dr. Gavin
      Archer tells Shepard that the rogue VI at the heart of the project is trying to
      upload itself off the station.
    source_chunks: [atlas-station_001]
  - text: >
      Shepard and the squad stop the upload, but the VI infects Shepard's omni-tool and
      cybernetic implants, forcing the Commander into a virtual-reality environment.
      Shepard fights through it, reaches the VI as it makes a second attempt to upload
      itself to the Normandy, and destroys it.
    source_chunks: [atlas-station_001]
  - text: >
      Shepard then discovers what Project Overlord actually was: Gavin's autistic brother
      David Archer had been forcibly fused with the VI, which overwhelmed him — David had
      simply wanted the ordeal to stop. Shepard makes a moral choice about the future of
      the project and of David before leaving Aite.
    source_chunks: [atlas-station_001]

