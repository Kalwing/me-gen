scene_id: idenna-captain-mal-confides-in-kahlee
title: Captain Mal's Warning to Kahlee Sanders
kind: downtime
game: Mass Effect 2
when: "2183, during Mass Effect: Ascension, after Lemm brought the fugitives to the Idenna"
where: the quarian cruiser Idenna in the Migrant Fleet
participants: [Ysin'Mal vas Idenna, Kahlee Sanders, Hendel Mitra, Gillian Grayson]
private_to: []
heard_by: [crew of the Idenna]

requires: []

beats:
  - text: >
      Captain Ysin'Mal vas Idenna — "Captain Mal," a maverick who wants Fleet ships sent out
      to search for new homeworlds — gives Kahlee Sanders, Hendel Mitra and Gillian Grayson
      a warm welcome aboard the Idenna, then quietly takes Kahlee aside to warn her that the
      Migrant Fleet is not as safe as it looks.
    source_chunks: [ysin-mal-vas-idenna_002]
  - text: >
      At a meeting with Admiralty Board and Conclave representatives, Mal seizes on the
      mention of the Reapers, arguing the quarians could find and reactivate one to seize
      control of the geth and retake their homeworlds.
    source_chunks: [ysin-mal-vas-idenna_002]
  - text: >
      Later Mal comes to Kahlee and Hendel in private with the fuller truth: the Flotilla is
      slowly dying, its ships wearing out faster than they can be replaced. There is no time
      to say more or ask Kahlee's help — the Cerberus attack on the Idenna comes soon after.
    source_chunks: [ysin-mal-vas-idenna_002]

