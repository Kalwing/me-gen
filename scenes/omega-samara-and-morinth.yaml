scene_id: omega-samara-and-morinth
title: Baiting Morinth in Afterlife
kind: mission-aside
game: Mass Effect 2
when: 2185, after Samara traces her daughter off Illium
where: Omega — a victim's apartment, the VIP area of Afterlife, then Morinth's apartment

participants: [Shepard, Samara, Morinth]
private_to: []
heard_by: [Normandy crew]

requires:
  - samara_loyalty: any

beats:
  - text: >
      Samara's request is stated without softening: help find her long-lost daughter, and kill
      her.
    source_chunks: [samara_003]
  - text: >
      With the name of the ship Morinth used to leave Illium, Samara tracks her to Omega and
      finds she has just killed again. They go through the victim's apartment.
    source_chunks: [samara_003]
  - text: >
      Samara's plan puts Shepard in as bait. The victim's effects yield the password to
      Afterlife's VIP area, and Shepard goes in alone to be noticed.
    source_chunks: [samara_003]
  - text: >
      Morinth comes over, moves Shepard to a private table on the strength of shared
      interests, and when she is convinced, takes the Commander back to her apartment.
    source_chunks: [samara_003]
  - text: >
      Shepard keeps her talking about the things in her rooms. When she finally moves to
      seduce, Samara comes through the door and the two of them fight. If Shepard held out
      against Morinth's suggestions the fight deadlocks, and Shepard chooses which of them
      walks out.
    source_chunks: [samara_003]
  - text: >
      One of them dies either way, and the survivor stays with Shepard.
    source_chunks: [samara-the-ardat-yakshi_007]
  - text: >
      If Shepard sided with Morinth and killed Samara, Morinth leaves Omega with the squad,
      passing herself off as her mother. Aboard the Normandy Kelly Chambers and Kasumi Goto
      both notice "Samara" behaving unlike herself; Kasumi names her outright after the
      suicide mission and warns Shepard away from her. In her claimed quarters in the Port
      Observation Lounge Morinth disables EDI's surveillance and speaks in her own voice,
      airing her contempt for Samara's dutiful, loveless upbringing and its lessons of
      self-denial.
    source_chunks: [morinth_003, morinth_004]
    conditional: {samara_loyalty: sided_with_morinth}
    choice: Shepard helped Morinth kill Samara — Morinth joins impersonating her mother
  - text: >
      Morinth tells Shepard her lovers felt pleasure past any ordinary meld and presses to
      mate with the Commander, claiming Shepard is too strong-willed to die from it. If both
      survive the suicide mission and Shepard takes her up on it, the joining kills Shepard,
      her assurances proven false.
    source_chunks: [morinth_005]
    conditional: {romance: Morinth}
    choice: Shepard mates with Morinth after the Collector Base — Shepard dies
  - text: >
      In 2186, if Morinth lived, she slips off the Normandy without a word during the Reaper
      war and later emails Shepard "A belated goodbye," glad the Commander survived the
      attack on Earth and still grateful Shepard took a chance on her.
    source_chunks: [morinth_006]
    conditional: {samara_loyalty: sided_with_morinth}
    choice: Morinth survives into Mass Effect 3

related_scenes: [citadel-party-apartment, lesuss-monastery-samara-falere]
related_events: []
source_chunks: [samara_003, samara-the-ardat-yakshi_007, morinth_003, morinth_004, morinth_005, morinth_006]
