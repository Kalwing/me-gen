scene_id: omega-dlc-meet-nyreen-talon-alliance
title: Meeting Nyreen and Rallying the Talons
kind: mission-aside
game: Mass Effect 3
when: 2186, Omega, during Aria's campaign to retake the station from Cerberus
where: Aria's captured cruiser, the Cerberus-held streets and tunnels of Omega, Aria's Bunker, and a Talon outpost
participants: [Shepard, Aria T'Loak, Nyreen Kandros, Bray, Harrot]
heard_by: [Omega population]
requires:
  - omega: yes
beats:
  - text: >
      Aria made Shepard leave the Normandy and its crew behind and rendezvous with her
      mercenary fleet in the Widow system; she was the only squadmate. Her captured Cerberus
      cruiser slipped the blockade on stolen authorisation codes and crippled the Cerberus
      flagship as her fleet came through the relay, but General Petrovsky's upgraded defence
      cannons tore into her ships and the boarding party crash-landed in escape pods.
    source_chunks: [aria-t-loak_011, omega_010, omega-aria-t-loak-mass-effect-3_003]
  - text: >
      Shepard and Aria fought through a Cerberus-held hangar and atria to the defence-control
      room and shut down the guns, letting Aria's fleet into Omega. Petrovsky, watching Aria's
      movements on the station's cameras, tracked her toward her bunker and sent troops to
      block it.
    source_chunks: [oleg-petrovsky_004, omega_010]
  - text: >
      In Aria's secret tunnels beneath the force-field-blocked streets, Shepard met Nyreen
      Kandros, a female turian biotic and former partner of Aria's from years back. She joined
      the squad; with Bray marking the Cerberus engineer jamming the controls, they cleared
      Aria's cannons and fell back to Aria's Bunker.
    source_chunks: [nyreen-kandros_002, nyreen-kandros_004, aria-t-loak_012]
  - text: >
      At the bunker Aria left Shepard to prepare while she planned the strike on the Cerberus
      reactor. The elcor merchant Harrot asked Shepard to recover Aria's old couch, which
      Petrovsky had thrown out of Afterlife; Aria's hacker and a batarian mechanic asked for
      other errands. Bray reported that Nyreen had slipped out of the bunker; Aria pushed on
      anyway.
    source_chunks: [omega-aria-t-loak-mass-effect-3_011, aria-t-loak_012]
  - text: >
      In Talon territory Shepard freed captured Talons and reached an outpost of civilians
      under Cerberus attack. A hoodless Nyreen cut down the Cerberus interrogators and revealed
      that she — not the rumoured "Derius" — was the real leader of the Talons. Aria admitted
      she was genuinely surprised, and Shepard talked the two wary ex-partners into working
      together.
    source_chunks: [aria-t-loak_012, nyreen-kandros_004]
  - text: >
      Aria had Ahz wire the whole station's comm systems to her and broadcast her return,
      calling on Omega's people to rise against Cerberus. Out of Nyreen's earshot she told
      Shepard the truth: the attack on the civilians was bait, meant to force Nyreen — who
      would always move to protect them — into the alliance. After the outpost was defended,
      Nyreen agreed, exactly as Aria had predicted.
    source_chunks: [aria-t-loak_012]
  - text: >
      Aria and Nyreen argued over Omega's people — Aria set on reclaiming her throne at any
      cost, Nyreen on shielding civilians. Shepard reminded them that beating Cerberus meant
      fighting together.
    source_chunks: [aria-t-loak_012, nyreen-kandros_004]
