scene_id: jasox-wrex-warehouse-aftermath
title: Jasox and Wrex After the Warehouse
kind: banter
game: Mass Effect
when: "Mass Effect: Foundation (2183, Citadel), during Fist contract"
where: "outside a warehouse near Fist's apartment, then approaching a nearby bar"

participants: [Jasox, Urdnot Wrex]
private_to: [Jasox, Urdnot Wrex]
heard_by: []

requires: []

beats:
  - text: >
      Wrex slaughters a group of mercenaries sent to distract him from his target Fist. Jasox,
      the sole survivor, manages a sniper hit on Wrex's armor before being shot in the back at
      point-blank range by the krogan's shotgun.
    source_chunks: [jasox_001]
  - text: >
      As Wrex moves to finish him, Jasox removes his helmet and confesses his role as a
      distraction. He appeals to their shared history: on a past job, Jasox pulled Wrex from
      a burning ship. Wrex counters that Jasox was late to that job, forcing Wrex to kill the
      entire crew alone; Jasox replies he need not have shown up at all.
    source_chunks: [jasox_001]
  - text: >
      Walking out of the warehouse carnage, Jasox notes the shotgun blast will leave a mark on
      his back and spots a bar nearby. He proposes grabbing a drink and offers to pay. Wrex
      grows suspicious and deduces the human is still trying to distract him from Fist. Jasox
      admits he had to try.
    source_chunks: [jasox_001]
  - text: >
      Wrex, who had intended to return Jasox's sniper rifle, decides against it and tells him
      so. As they part ways, Jasox calls out good luck; Wrex disregards the blessing.
    source_chunks: [jasox_001]

