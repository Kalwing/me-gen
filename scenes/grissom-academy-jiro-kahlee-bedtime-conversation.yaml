beats:
  - text: >
      After Gillian Grayson unleashed a biotic storm in the Academy cafeteria, Jiro Toshiwa—
      who had been absent during the incident—questioned Kahlee Sanders about what happened
      while they were in bed together. She told him about Gillian's violent outburst in the
      cafeteria and Hendel Mitra subduing her with his own biotics.
    source_chunks: [jiro-toshiwa_001]
  - text: >
      Jiro convinced Kahlee not to allow Gillian to be removed from the Ascension Project,
      arguing against isolating the girl. However, he made a critical mistake: he mentioned
      Kahlee's father, a detail he should not have known. The fact that Kahlee was Jon
      Grissom's daughter was known only in classified Alliance documents filed by David
      Anderson. When Kahlee realized this the next morning, she understood Jiro was a traitor.
    source_chunks: [jiro-toshiwa_001]
