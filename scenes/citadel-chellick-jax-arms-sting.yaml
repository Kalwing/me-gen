scene_id: citadel-chellick-jax-arms-sting
title: Chellick's Sting on the Arms Dealer Jax
kind: mission-aside
game: Mass Effect
when: "2183, Citadel, during the hunt for Saren"
where: outside Chora's Den, Chellick's C-Sec office, the Markets

participants: [Shepard, Chellick, Jax]
private_to: []
heard_by: []

requires: []

beats:
  - text: >
      Chellick is using an informant named Jenna, working undercover, to combat illegal
      arms trading on the Citadel. When Shepard talks to Jenna about the risks of being a
      C-Sec informant, Chellick — disguised as a drunk — bumps into Shepard leaving Chora's
      Den and whispers for Shepard to come to C-Sec before staggering off.
    source_chunks: [chellick_003]
  - text: >
      In his office, Chellick is annoyed Shepard nearly blew Jenna's cover, but explains he
      is using her only for lack of better help. He offers to release her from the job if
      Shepard will instead meet his krogan contact Jax, who is smuggling illegal weapon
      modifications onto the Citadel, and receive the mods while posing as a buyer in the
      Markets.
    source_chunks: [chellick_003]
  - text: >
      Shepard can play the buyer straight, keeping Chellick's contacts intact, or break
      cover and try to arrest Jax. If Shepard shoots Jax, Chellick loses all his leads and
      angrily refuses to speak to Shepard again. If Shepard maintains the cover, Chellick is
      pleased, lets Jenna quit as an informant, and passes some of the weapon modifications
      to Shepard.
    source_chunks: [chellick_003]
    conditional: {jax_sting: cover_maintained}
    choice: kept cover, played it straight

