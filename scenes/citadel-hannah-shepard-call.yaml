beats:
  - text: >
      After Shepard foils the identity theft attempt that had infiltrated the Citadel, a
      message arrives from Hannah Shepard asking the Commander to call her.
    source_chunks: [hannah-shepard_005]
  - text: >
      Shepard calls Hannah from the apartment. The two speak briefly about Shepard's
      childhood. Hannah tells her child how proud she is of what Shepard has accomplished,
      leading the fight against the Reapers.
    source_chunks: [hannah-shepard_005]

