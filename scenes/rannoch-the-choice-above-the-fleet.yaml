scene_id: rannoch-the-choice-above-the-fleet
title: Rannoch, and What Tali Watched
kind: mission-aside
game: Mass Effect 3
when: "2186, Priority: Rannoch, from the solo kill of the Reaper Destroyer to the standoff after"
where: Rannoch, on the cliffs, with both fleets overhead
participants: [Shepard, Tali'Zorah vas Normandy, Legion, Shala'Raan vas Tonbay, Han'Gerrel vas Neema]
private_to: []
heard_by: [Normandy crew]

requires:
  - rannoch: any
  - geth_quarian: any

beats:
  - text: >
      After the Normandy's bombing run cracked the Reaper base open, a Reaper Destroyer
      climbed out of the crater. Legion secured a geth ship and flew the squad clear while
      Shepard manned its turret and called in an orbital strike that briefly downed the
      Reaper. EDI synced the quarian fleet to the Normandy's targeting systems, and Shepard
      stayed on the plateau alone, dodging the Destroyer's beam through three targeting
      solutions and a final slow-motion shot while the fleet fired. Mortally hit, the Reaper
      addressed Shepard by name, said Harbinger judged the Commander a worthy opponent, spoke
      of Reapers as "order" against organic "chaos" and the harvest as necessary
      "intervention," and — if no interrupt was taken — left the threat, "Finish your war. We
      will be waiting."
    source_chunks: [priority-rannoch_007, priority-rannoch_008]
  - text: >
      With the Reaper down, the geth are weakened and Admiral Han'Gerrel throws the whole
      quarian fleet at them.
    source_chunks: [tali-zorah-nar-rayya_009, priority-rannoch_009]
  - text: >
      The geth unit rescued from the dreadnought — Legion, or a VI built in its likeness —
      moves to upload the Reaper code and restore the geth to full strength, which would catch
      the quarian fleet unready and destroy it.
    source_chunks: [tali-zorah-nar-rayya_009, priority-rannoch_009]
  - text: >
      Stopped from uploading, it turns hostile, and Tali kills it with her boot knife to save
      Shepard.
    source_chunks: [tali-zorah-nar-rayya_009]
    conditional: {geth_quarian: geth_saved}
    choice: stopped the upload — geth destroyed
  - text: >
      Allowed to upload, Tali watches the entire Migrant Fleet come down burning through
      Rannoch's atmosphere, takes off her mask, says she is sorry, and steps off the cliff
      before Shepard can reach her.
    source_chunks: [tali-zorah-nar-rayya_009]
    conditional: {geth_quarian: quarians_sacrificed}
    choice: let the upload finish — quarians destroyed
  - text: >
      With Legion alive and the quarians talked into standing down, there is peace — and
      Legion spends itself giving every geth autonomy, having first confirmed that the answer
      to its own question about souls was yes.
    source_chunks: [tali-zorah-nar-rayya_009]

variants:
  - condition: {legion_status: geth_vi}
    choice: the Geth VI stands in for Legion
    text: >
      If Legion was sold to Cerberus, never activated, or died at the Collector Base, the
      unit rescued from the dreadnought is the Geth VI — physically Legion's twin down to the
      holographic N7 shoulder piece and the hole in its torso, but with no memory of anything
      after Saren's attack on Eden Prime and a colder view of organics, and it insists
      throughout "We are not Legion." No peaceful outcome is possible with the VI present.
      If Shepard lets the geth die, the VI violently assaults Shepard — "[our people] were
      correct to distrust organics" — and tries to upload the Reaper code before Tali knifes
      it in the back, or, if Tali is absent, Shala'Raan kills it with a shotgun; the quarians
      then win the battle overhead. If Shepard uploads the code to save the geth, the VI
      thanks Shepard, says its "skepticism was misplaced," and dissolves itself into the
      consensus to grant every geth true intelligence, and the upgraded geth defeat the
      quarian fleet.
    source_chunks: [geth-vi_002, geth-vi_004]

related_scenes: [normandy-garrus-and-tali-reconciliation, flotilla-tali-treason-trial,
                 heretic-station-legion-a-house-divided, geth-dreadnought-freeing-legion]
