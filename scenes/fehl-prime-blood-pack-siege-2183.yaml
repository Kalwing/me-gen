scene_id: fehl-prime-blood-pack-siege-2183
title: The Blood Pack Siege of Fehl Prime
kind: mission-aside
game: Mass Effect
when: 2183, when Blood Pack mercenaries lay siege to the Fehl Prime colony
where: the Fehl Prime colony

participants: [Christine, Treeya, James Vega, Kamille, Essex, Brood, Captain Toni, Milque, Nicky, Archuk]
private_to: []
heard_by: []

requires:
  - paragon_lost: any

beats:
  - text: >
      When Blood Pack mercenaries lay siege to the colony, Christine rallies the other
      colonists and fights alongside them despite being outmatched and outgunned.
    source_chunks: [christine_001]
  - text: >
      A vorcha nearly shoots her. Treeya tells her she is not a soldier and should stop, but
      Christine refuses to give up. Her stand buys the colonists enough time for Alliance
      marines to arrive and engage the Blood Pack.
    source_chunks: [christine_001]
  - text: >
      Delta Squad's Kodiak is shot down mid strafing run. With Captain Toni down, Lieutenant
      James Vega takes command. In the counterattack Kamille and Essex flank the mercs —
      Kamille firing heavy, Essex covering with biotics — and cut through their ranks.
    source_chunks: [kamille_001]
  - text: >
      When Archuk, the Blood Pack's krogan leader, challenges Delta Squad to show
      themselves, Vega duels him head-on to hold the mercs' attention while Kamille and
      Essex flank. Milque hands Vega his power cells and covers the duel with sniper fire,
      and Nicky's combat drone overloads Archuk's shields. Archuk grazes Milque across the
      collarbone and nearly beats Vega down, but Milque recovers and kills Archuk, saving
      Vega. The Blood Pack are defeated; the krogan Brood is spared and taken prisoner.
    source_chunks: [mass-effect-paragon-lost_003, milque_001]
  - text: >
      Essex panics and biotically flings a varren that was creeping up on him onto Kamille
      instead. She shakes it off; Essex is taken down by Brood while trying to help her.
      Vega disables Brood. Kamille punches Essex in the gut, then thanks Vega and tells the
      squad they owe the win to him.
    source_chunks: [kamille_001]

