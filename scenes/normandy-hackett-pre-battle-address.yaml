scene_id: normandy-hackett-pre-battle-address
title: Hackett's Pre-Battle Address Before the Assault on Earth
kind: ceremony
game: Mass Effect 3
when: 2186, immediately before the final assault on Earth, once the combined fleets have gathered in the Sol system
where: aboard the Normandy SR-2, broadcast to every ship and strike team; then a holo-conference
participants: [Steven Hackett, Shepard, David Anderson]
heard_by: [the combined fleets, the Hammer strike teams, every soldier in the fight]
beats:
  - text: >
      With the galaxy's combined forces committed to deploying the Crucible against the Reapers
      in the Sol system, Fleet Admiral Hackett requests clearance to board Shepard's ship.
      Aboard the Normandy he signals the fleets to mobilize and delivers his pre-battle address
      to every soldier in the coming fight: "Never before have so many come together--from all
      quarters of the galaxy. But never before have we faced an enemy such as this... Stand
      fast. Stand strong. Stand together. Hackett out."
    source_chunks: [steven-hackett_007]
  - text: >
      Afterward Shepard and Hackett hold a holo-conference with Anderson, on Earth, who reports
      that the Reapers have moved the Citadel into orbit above Earth and closed the Ward arms,
      so the Crucible cannot dock.
    source_chunks: [steven-hackett_007]
  - text: >
      Hackett lays out the plan: Sword fleet engages the Reapers in orbit; Hammer strike teams
      help the Earth resistance reach the Reaper-built conduit in London to teleport to the
      Citadel and open the arms; Hackett's Shield fleet hangs back to guard the Crucible and
      bring it in during the fighting. The assembled fleets then launch the assault on Earth.
    source_chunks: [steven-hackett_007]
related_scenes: [earth-fob-final-goodbyes, earth-conduit-harbinger-last-run]
related_events: [london-conduit-assault, crucible-superweapon-project]
source_chunks: [steven-hackett_007]
