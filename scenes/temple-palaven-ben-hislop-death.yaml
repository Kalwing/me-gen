scene_id: temple-palaven-ben-hislop-death
title: Ben Hislop's Last Stand at Temple Palaven
kind: argument
game: Mass Effect
when: 2157-2158, after the First Contact War, at Temple Palaven
where: Temple Palaven, turian homeworld

participants: [Jack Harper, Ben Hislop, Eva Coré, Desolas Arterius, Saren Arterius]
private_to: [Jack Harper, Ben Hislop, Eva Coré, Desolas Arterius]

beats:
  - text: >
      Desolas recaptures Jack Harper on Illium using the Arca Monolith as bait and takes
      him and Eva Coré to Palaven, where he reveals a plan to use the Monolith to convert
      the turian race into an army of super-soldiers, operating out of Temple Palaven,
      which conceals a second Monolith.
    source_chunks: [desolas-arterius_001]
  - text: >
      Ben Hislop, mutated into a synthetic form after his earlier contact with the artifact
      on Shanxi but still retaining some sense of himself, is following Desolas and Saren's
      orders and is made to excavate a second artifact to accelerate the conversion process.
    source_chunks: [ben-hislop_001]
  - text: >
      When Eva tries to pull Ben free and then to destroy the artifact, it commands Ben to
      slam her head against a wall, killing her.
    source_chunks: [ben-hislop_001]
  - text: >
      Coming to his senses, a horrified Ben charges Desolas and rams him into the artifact
      before he can shoot Harper. Saren tears Desolas away from Ben. Prolonged contact with
      the released energy instantly kills Ben.
    source_chunks: [ben-hislop_001]
  - text: >
      Saren, convinced by Harper that Desolas has endangered the turians, orders Palaven
      Command to conduct an orbital strike on Temple Palaven to prevent a "bioweapon
      emergency." The strike destroys the Temple, both Monoliths, Ben's body, and Desolas.
    source_chunks: [desolas-arterius_001]

related_events: [desolas-arterius-palaven-coup]
source_chunks: [ben-hislop_001, desolas-arterius_001, saren-arterius_003]
