scene_id: normandy-cic-door-bethany-sarah
title: Guarding the War Room Door
kind: banter
game: Mass Effect 3
when: 2186, throughout the Reaper War
where: the door between the CIC and the conference/war rooms, SSV Normandy SR-2

participants: [Bethany Westmoreland, Sarah Campbell]
heard_by: [Normandy crew]

beats:
  - text: >
      Privates Bethany Westmoreland and Sarah Campbell guard the doors between the CIC and
      the war room, passing the time by trading opinions on the aftermath of Shepard's major
      missions, audible to anyone passing through.
    source_chunks: [bethany-westmoreland_001, bethany-westmoreland_001]
  - text: >
      After Shepard's tepid meeting with the Citadel Council following Mars, Bethany
      supposes Earth would have focused on its own borders had Thessia been attacked first.
      After Primarch Victus is retrieved from Menae, she thinks he is only cooperative
      because his homeworld is burning, notes the Normandy has to host the war summit
      because the salarians will not let krogan aboard their ships, and admits she is
      impressed by turian tenacity after seeing the feeds from Palaven.
    source_chunks: [bethany-westmoreland_001]
  - text: >
      After Eve is rescued from Cerberus on Sur'Kesh, Bethany feels the salarians should
      have defended their own homeworld better. After Tuchanka is resolved she is mainly
      relieved the turians and krogan are off the ship, and after the failed Cerberus coup
      on the Citadel she thinks Councilor Udina got what he deserved for dealing with
      terrorists. She finds it hard to only fight geth while the Reapers hold half the
      galaxy.
    source_chunks: [bethany-westmoreland_001]
  - text: >
      After the Reaper Destroyer is destroyed on Rannoch, Bethany shares Sarah's excitement
      that Reapers can be beaten. She briefly loses morale after Thessia falls, believing
      the asari should have joined the war earlier, but recovers after Horizon, where she
      questions what kind of soldier would help turn people into husks. Once Cerberus is
      destroyed, she is eager for the final battle on Earth, not wanting to tell her
      grandchildren she spent the war guarding a door.
    source_chunks: [bethany-westmoreland_001]
  - text: >
      In quieter moments Bethany remarks that Citadel residents will soon notice the war as
      refugees arrive, disagrees with Sarah about taking revenge on those who sat the war
      out, and recounts the Collector attack on the Normandy and the crew's abduction as
      told to her by Joker. She notes Cerberus was once popular as the only group fighting
      the Collectors while the Council did nothing, and holds a low opinion of black ops
      work in general.
    source_chunks: [bethany-westmoreland_001]

source_chunks: [bethany-westmoreland_001, bethany-westmoreland_001]
