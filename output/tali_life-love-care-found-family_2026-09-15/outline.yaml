  - id: seventeen-million
    title: Seventeen Million
    events: [crucible-superweapon-project]
    scenes: [quarian-envoy-admiralty-briefing]
    retrieval: ["quarian Admiralty Board", "Migrant Fleet seventeen million", "Crucible construction quarian engineers", "Tali admiral too young", "fleet ship allocation civilians"]
    promises:
      - "Her command as logistics with worse consequences: which ships go in tomorrow, which civilians stay back, and she's too young for it and says so"
      - "Quarian hands on the Crucible, told as an engineer's opinion of the thing, not a status report. Then she catches herself giving one anyway"
      - "Shepard's distrust of hierarchy against her rank. They agree an admiral should have to earn it every day, and she has one more day of earning to do"
