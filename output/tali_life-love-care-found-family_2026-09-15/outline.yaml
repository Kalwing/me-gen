  - id: the-way-it-started
    title: The Way It Started
    events: []
    scenes: [citadel-tali-rescue-and-spectre-induction]
    retrieval: ["Tali ambush alley Citadel Fist", "Keelah se'lai homeworld meaning", "Tali calling Shepard her home", "I backed you when I was a kid on my Pilgrimage", "house on Rannoch"]
    promises:
      - "The alley on the Citadel where they met, and finishing it the way it started: together"
      - "Keelah se'lai means 'by the homeworld I hope to see one day'. Calling him her home means more to her than 'I love you', and she says it"
      - "A small, wishful picture of after (a house, a window, real ground), which she admits is wishful and keeps anyway"
