narrator: jack
themes:
- the night before the end
- love against fear
brief: >
  Romanced Jack, at the end of ME3. She is beside Shepard, on his bed, talking
  to him right now, one night before the final push of the war, before the Conduit.
  She is trying to help him forget about tomorrow and relax. He has not really slept
  in days because of his nightmares and the war preparation. She has to go on the
  front with her students tomorrow, but she's here now, with the love of her life,
  and they will meet again tomorrow night, after they win (She is hoping). Note on
  her mood tonight — she's trying to appease him, so she's holding herself back,
  keeping her voice down. She's still herself, still brash underneath, just
  working to control it tonight rather than actually being subdued. She's scared,
  about him mostly, but also about her students and the world, though her world
  is mostly those two things and the crew she's come to care for a little. That
  fear is mostly held under control, but she sometimes cracks.
form: bedtalk
form_note: >
  Romance is active canon (Jack) and the brief stages exactly this form's scene —
  one room, late, war held at arm's length, the narrator talking to keep Shepard
  from his own head. Placed the night between Hackett's pre-battle address aboard
  the Normandy (fleets gathered in Sol, the plan given) and the Hammer landing/FOB
  goodbyes the next morning — the timeline has no other slot for a quiet night this
  late, and neither scene forecloses one. Correction applied from the coordinator:
  Jack's Grissom students go to the Alliance support lines tomorrow (barrier work,
  ammo modding), per her own request logged in grissom_academy canon — not the
  front line. Jack stays with her students at the support lines tomorrow rather
  than joining Shepard's ground push toward the conduit — that's why she and
  Shepard expect to meet again only after the fight, not during it. Nothing in this outline
  foreshadows the Crucible choice itself — that hasn't happened yet from her
  vantage and she has no way to know which door Shepard will pick.
target_words: 9200
