narrator: jack
themes:
- eulogy
- grief
- drunk love
- after the war
brief: romanced Jack does an eulogy for shepard, after the war. She's drunk, angry,
  in love. On the normandy with everyone
form: eulogy
form_note: >
  The brief is literally a eulogy: Shepard is dead (canon final_choice = Synthesis,
  shepard_fate = Dead), Jack is drunk and angry and in love, speaking in front of the
  Normandy crew. Spine is mixed — the frame is the crash-landed Normandy after the
  Extended Cut epilogue (london-conduit-assault), and each section is one of the things
  Jack has to say about him: a debt, a fight, a habit, the once he was wrong to trust
  her and the once it paid off, closing on the tattoo she put on his back and what it
  means now that he's the one under the rubble. No scene record exists for a post-war
  Normandy wake (Shepard's death forecloses one), so it is built as the episode's frame
  around real events/scenes rather than pulled from the scene layer itself.
target_words: 8000
sections:
  - id: get-a-drink-in-your-hand
    title: Get a Drink in Your Hand
    events: [london-conduit-assault]
    scenes: []
    retrieval:
      - Normandy crash-landing on a garden world after the Crucible fired
      - the Synthesis ending and Shepard's death
      - grief versus celebration aboard a warship
      - Jack drunk and biotic-charged with anger
    promises:
      - "Jack gets up in front of the whole crew, already drunk, and refuses to let this be a quiet toast"
      - "she names that she's angry, not just sad, and dares anyone to tell her to sit down"
      - "the scene is set: the Normandy grounded on a garden world, Shepard gone, everyone who's left listening"
