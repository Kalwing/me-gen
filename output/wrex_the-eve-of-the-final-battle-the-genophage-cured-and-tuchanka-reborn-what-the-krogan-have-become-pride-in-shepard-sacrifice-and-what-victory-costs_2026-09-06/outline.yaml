narrator: wrex
themes:
- the eve of the final battle
- the genophage cured and Tuchanka reborn
- what the krogan have become
- pride in Shepard
- sacrifice and what victory costs
brief: 'Wrex calls Shepard the night before the final fight, both failing to sleep. Wrex is dozing off
  (sometimes snoring), and encourages Shepard to do the same. He knows they will win, he knows the sacrifices
  it will take, but he celebrate what they''ve done, how they''ve evolved, and if it doesn''t happen,
  he will be proud. Register for this episode only: a fireside. He is sharing things the way an old warlord
  shares them across a fire — unhurried, out of order, told because the telling is the point, celebratory
  more often than bitter, since he has outlived his grudges and enjoys the retelling. He does not finish
  a digression so much as trail off, grunt, lose the thread, or fall asleep mid-sentence and pick it up
  somewhere else.'
target_words: 8000
