    promises:
      - "Jack takes EDI's inventory and breaks it: the thing the ship logged is the thing she cannot hear, and she says what she did with the poems (she knows they exist, she hasn't finished them)"
      - "The long-distance stretch: his long messages and her voice notes that said nothing, and the one-word 'Alive?' she sent when the Reapers hit Earth"
      - "Grissom: he watched her teach, she knows what he envied, and the 'no promises about coming back' rule they both lied about"
      - "Fury and tenderness in the same breath: she is angry he went out holding a position, and what she says back to the 'you're perfect, lay it all on me' line he never got to hear from her again"
      - "Mention that he was depressed and his head was a mess, but he always put her first. In a text, a week before the end, he wrote that his days of suffering were behind him and he was ready to live again."
      - "Why this is a eulogy in a mess with booze and music and not a service: she brings out the spoken piece Thomas wrote about death after his mother's died (config/narrators/thomas.notes.md, 'Text on death and his mother's body'), the one against the pine box, the permitted speech, the ashes scattered in an authorised zone. It is the reason he would have hated a proper funeral, and she is honouring that tonight, drunk and loud."
      - "She does not read it. She refers to it, in her own words and from memory, and only in pieces: that he wrote it in French over a drone that swelled until it was deafening, then silence, then a light melody; that it was against the pine box, the permitted speech and the ashes scattered in an authorised zone. She may ask the room (or EDI) for the drone and then say no, not that. Hold to its facts when she touches them: he didn't look at his mother's dead body, he only stroked her hair; the ashes are in an arm of the sea; the legal problems were more real than the grief; the hospital corridor and the years of silence, choosing to drop the fight and walk in; the regret he chose to believe. She gets some of it wrong, as she would."
      - "The break: the one who saw her and loved her unconditionally is gone, and she comes apart. Uncontrolled, almost wailing, shouting while she cries, furious and begging in the same breath, sentences that collapse into his name, into swearing, into sounds. It is not composed and not neat. The piece he wrote is part of it: he never looked at bodies so it wouldn't be real, there is no body for him either, and she cannot do what he did; the tattoo is what she can touch."
      - "Shepard and him, from where she stood: the two Akuze survivors, how they changed each other (Shepard handed him a reason to get up; he gave Shepard perspective, never orders, and made the Boss human enough to dance), and that she is furious at Shepard too, wherever he is, for taking Thomas to the end of the world and maybe not coming back either"
      - "Her opening turn already used the wail and 'come back', 'I'm not toasting him', Grissom from the back of the room, and the 'you're perfect, lay it all on me' / 'you're not broken, come here' exchange. Do not repeat them: the break here goes further and lands differently, Grissom is told from another angle (what she saw on his face, or what he did with the kids), and this time she does raise the glass after all"
      - "Then a pause, long enough to be felt, breathing, the room waiting. She ends on a good thing, small and true and warm, about him or the way he lived (a laugh, a plate, a dance, a hand on her back), spoken quietly and with a crack. Then the last toast, and the sound or song she asks for as the room closes. No neat summing-up line; the warmth is a thing he did, not a moral."
      - "This is a eulogy: lament the loss, tell how you bonded with him and what you loved about him, and celebrate him; sad in your own way, never a lore recital"
