subject: thomas
themes:
- a eulogy for Thomas
- in the mess
- over alcohol and music
brief: 'Eulogy for Thomas held in the Normandy mess, with alcohol and music playing.
  Nine turns in this order: Jack (long), Tali, Joker, Liara, Grunt, James, Wrex, EDI,
  then Jack again (long) to close, about Thomas. Total runtime 45 minutes to 1 hour
  spoken. Each speaker addresses the room and picks up what the previous one said.'
form: eulogy
form_note: >-
  Above all a eulogy: every speaker laments his loss, tells how they bonded with him and what they loved about him, and celebrates him.
  The brief asks for nine people on their feet in one room, each saying what there is to say
  about the dead man: a eulogy, not a two-voice dialogue. Spine is mixed: Thomas is an original
  character and not in the corpus, so no event or scene names him; sections anchor on the
  occasions his notes place him in (the Pragia aftermath, the run-up to Omega-4, Tuchanka,
  Rannoch, the Citadel shore leave, Grissom, the final push) and the speaker's own record of
  those. Jack holds the first and last turns (~2,500 words each, long as asked), the other
  seven run 450-1,000 (Grunt, EDI, James short and blunt; Liara, Joker, Tali fullest). Nine sections is inside the form's 6-14 range. Each turn opens by picking
  up the one before: Jack's grief to Tali's engine room, Tali's hospital-and-hands to Joker's
  bad days, Joker's jokes to Liara's late nights, Liara's mother story to Grunt's blunt
  question, Grunt's kitchen guarding to James's training and banter, James's Hammer glimpse to
  Wrex, Wrex's speech to EDI's data, EDI's four-leaf-clover tally back to Jack. Alcohol and
  music run through the turns as the room's furniture (Thomas's disco, pop, rock, rap, metal, folk, gabber, electro, and black-metal playlists,
  ryncol, the taped-up recipes), not as a section of their own. Canon branch: genophage cured,
  Wrex leads the krogan, geth-quarian peace (Legion dead), Grunt alive, Thane dead; crew do not
  know what Shepard chose, and his death is unconfirmed. Thomas's unfinished poems for Jack are
  private to Jack; the French lines are his to be quoted sparingly and, per memory rules, never
  verbatim-perfect by anyone but Jack.
