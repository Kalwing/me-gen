subject: thomas
themes:
- who Thomas was to each of them
- what he built aboard the Normandy
- grief and what he left behind
brief: 'Thomas''s memorial ceremony, in the first weeks after the war. Six of the
  crew speak over him in this order, and Jack speaks twice - first and last: Jack,
  Tali, Grunt, Liara, Joker, Wrex, then Jack again. Each speaker is on their feet
  in front of the others, talking about Thomas: what he was to them specifically,
  the fights and the ordinary hours they shared with him, and what his death takes
  away from them. They enrich their turns with their OWN lives and histories, with
  timeline events they were both part of, with the particular shape of their relationship
  to him, and with the small lore they bonded over - the thing the two of them used
  to argue about or geek out on. This is not six summaries of Thomas; it is six people
  whose own lives are visible through what they choose to say about him.


  The occasion, which is binding: Thomas died in the final push toward the Conduit. How he
  died, exactly: he left the forward operating base carrying a gun, frightened, and moved up
  with the Hammer column; he was shot somewhere on the way to the landing zone; and, already
  wounded, he died driving a vehicle into a banshee, slamming her into a wall to clear
  passage for Hammer. He did not die shooting. He died driving.
  NOBODY IN THE ROOM WATCHED HIM DIE. Each of them holds only a piece. Wrex holds the first
  piece and the last: he saw Thomas leave the base, frightened, carrying a gun - and days
  later, while the krogan were clearing debris, he found the body, the vehicle and the
  banshee crushed into the wall, and reconstructed the rest from what was in front of him.
  He is the only one who can give the room the true version, and even he is reading it off
  wreckage rather than remembering it. Grunt and Joker each hold a wrong piece. Tali, forward
  with Shepard and Garrus, never saw any of it.
  Shepard is MISSING, not confirmed
  dead - in these first weeks nobody has confirmed it, Anderson never saw him on the
  station, and nobody in the crew knows there was a choice at the end or what Shepard
  chose. So they are burying Thomas while still waiting on Shepard, and the speakers
  should not speak of Shepard as dead. Do not have anyone describe the ending, Synthesis,
  or the Crucible''s mechanism - they do not know it.


  Vantage differs and matters: per the canon overrides, Tali and Garrus were Shepard''s
  squad on the final conduit run and were evacuated by the Normandy before it, so
  Tali was closest to SHEPARD''s ending - and it gave her no answers, which is her
  burden, not knowledge about Thomas. On Thomas she has only a half-second glimpse of
  him across open ground that she cannot verify and has half-built out of wanting to.
  Liara holds the same kind of unverifiable glimpse. Grunt and Joker each hold a wrong
  piece and are corrected. Only Wrex, who saw him leave the base and later found the
  body in the debris, can assemble the true version.


  Relationships, from thomas.notes.md, which is binding: Jack was Thomas''s partner
  - HIS, not Shepard''s; Shepard did not romance Jack in this run and no speaker should
  imply otherwise. Jack and Thomas had a mutual rule of no promises about coming back,
  and both broke it privately. Tali was his mutual-aid and engineering partner, and
  he was in the room when she made peace with the geth. Grunt had younger-sibling
  energy with him and guarded his mess-hall kitchen like a clan holding. Joker was
  his gallows-humor best friend, the one person who knew about the hospitalizations
  and never raised them. Wrex had old-school respect for him - Thomas cooked for him,
  argued with him, and was one of the few who could tell Wrex he was wrong and be
  heard. Liara was the opposite-temperament confidante, the one he told about his
  mother.


  Texture worth reaching for: the vegan cooking nights and seitan kebabs, the recipes
  taped inside the mess cabinet, the rotating playlist and ABBA while he cooked, the
  dance parties he started on the SR-1, the poetry jams Kasumi and Jack ran in secret
  that Grunt turned up to with Hemingway, the essential tremor and the steadying rigs
  he built himself, the Citadel shore leave where Jack tattooed him and he outdrank
  everyone, his anarchism and Bookchin and care-as-resistance, Akuze and the two survivors
  who found each other in the wreckage, his family still alive on Earth, and the birthday
  speech and manuscript of poems he left behind.


  Two more turns follow Jack''s, and they are binding. SEVENTH: EDI speaks. She has not
  spoken all night and goes last among the eulogies because she is the only one who did not
  have to choose what to remember - she holds the continuous record of his life and says so,
  and says just as plainly that a complete record is the least of a person. She retells that
  life end to end: Rouen, the Alliance at nineteen, Akuze at twenty-one where his unit died
  and he walked out of the survey camp and found Shepard, the only other survivor, the two of
  them filed separately by the Alliance and finding each other in the wreckage anyway; the
  youth outreach years teaching children robotics; his mother''s death in 2180; the burnout,
  the quit doctorate, the year with no work; Shepard, newly a Spectre in 2183, remembering
  the tech from Akuze and calling him aboard; the SR-1 and its destruction; the SR-2 under
  Cerberus he hated every hour of and stayed on for the people; Rouen again; and Earth.
  Thomas followed Shepard from Akuze onward and stayed - one of the very few Shepard actually
  confided in, and a friend to him rather than a subordinate, for eight years. EDI can state
  the constancy of that as measured fact, and it lands hard in a room still waiting on
  Shepard. She also says what he brought: to the ship, to Jack, and to EDI herself, who he
  addressed as a person while that was still an argument. She may report one change in
  herself since the war that she cannot account for and declines to explain - she must NOT
  connect it to the Crucible, the ending, or any choice, because she does not know either.
  Then she forwards Thomas''s unfinished manuscript of poems to Jack, in the room, having
  recovered it from his terminal and read it, which she is not sure she was entitled to do
  and says so first.


  EIGHTH and last: Jack reads them. Out loud, where she stands, having just told the room she
  would read them alone. They are unfinished, in French, and addressed to her - crude, funny,
  tender, and all three at once. She reads badly, reacts to what is actually in them rather
  than summarizing, and does not resolve. She does not finish reading. This is the last thing
  said in the episode and it ends unfinished on purpose.


  Tone: the eulogy form''s swing - a story that gets a laugh, a line that lands angry,
  a stretch that can barely be got through - and none of it polite. Jack''s second
  turn is the last thing said over him and should not resolve into acceptance.'
form: eulogy
form_note: >
  The brief names the form outright: a memorial, six speakers on their feet, the
  eulogy's swing between a laugh, an angry line, and a stretch that can barely be
  got through. Jack is a deliberate exception to strict alternation and to normal
  voice balance - she opens and closes by the brief's fixed order, so she holds two
  of the seven turns while Tali, Grunt, Liara, Joker and Wrex each hold one. Her two
  turns are sized as ordinary single turns rather than doubled, but together they
  total roughly twice any other voice's word count, which is the "two turns' worth"
  the brief asks for. Section targets were raised after the voice checkpoint, at the
  user's instruction to let the speeches run to their natural length rather than be
  trimmed to a grid; the middle five now sit at 900-1200 (Joker's raised again after assembly, to carry the two illnesses beat in full) and the episode target at
  6950. Each middle turn answers the one directly before it;
  Jack's closing turn answers the whole room, not just Wrex. Grunt's bible is new
  and unused before this run - he is built distinct from Wrex throughout: Wrex
  remembers the Rebellions and the genophage firsthand, Grunt states krogan history
  as Okeer's tank taught it and then flattens it to "put in me, not lived," and his
  own lived material is small and recent (the Rite, the Citadel, the mess hall,
  the war) and used in full. The "gets a detail wrong and is corrected" requirement
  is carried by two beats, not one: Grunt states the assumed version (died on his
  feet with a gun) and Joker mis-hears whose voice was on the channel, and Wrex
  corrects both flatly before giving the room the true version - shot on the way to
  the landing zone, then killed driving a vehicle into a banshee to clear passage for
  Hammer. Wrex reads that off the wreckage he found days later, not off memory;
  nobody in the room watched Thomas die, and each of them holds only a piece. No section narrates the Crucible's mechanism or Shepard
  as confirmed dead; Thomas's Synthesis sympathies, where they surface, are framed
  as a political stance he held in life, never as knowledge of the ending.
