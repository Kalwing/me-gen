narrator: tali
narrators:
- tali
- liara
themes:
- home
- what the war cost
- the good things in the universe
brief: >
  Tali (romanced) and Liara talk together at sunset on Rannoch a few years after the
  war. By now Shepard is confirmed dead, and both of them know it. There was no body to
  bury, but there was a memorial ceremony: Tali set his name, engraved in metal, on the
  Normandy's memorial wall, and the whole crew shared memories and eulogies.
form: reminiscing
form_note: >
  Two old friends over drinks, except the beer is on a cliff on Rannoch and the war
  is the Migrant Fleet's and the Council races' shared one. Tali and Liara alternate
  turns strictly, 6 each; no voice holds two in a row, since this is exactly the kind
  of unhurried back-and-forth the form wants. Each turn's first promise is its reply
  to the one before — Liara picks up Tali's line about the air, Tali corrects Liara's
  secondhand version of the trial, and so on — and both keep losing the thread onto
  lore (geth cognition, Thessia, admiralty politics, asari mourning custom) before
  drifting back to the cliff. The two women never knew Shepard chose Synthesis, and
  the section list is built so neither has to name it: they talk about what changed
  after the Crucible fired, not why.
target_words: 11000
