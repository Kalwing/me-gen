    promises:
      - "opens the occasion: sunset on Rannoch, years on, Tali without a helmet, inviting Liara to sit"
      - Tali measures the quiet against her memory of the cliff where the fleet came down burning and didn't
      - names plainly, without melodrama, that Shepard is gone and has been for years — no body, but the memorial: his name she engraved and set on the wall, the crew's memories and eulogies
      - a first small joke or engineering aside that shows this grief has settled rather than raw
    target_words: 800

  - id: what-the-network-still-watches
    title: What the Network Still Watches
    narrator: liara
    events: [shadow-broker-base-hagalaz]
    scenes: [hagalaz-shadow-broker-ship-feron-yahg]
    retrieval:
      - Shadow Broker network operations and information economy
      - Liara becoming the Shadow Broker on Hagalaz
      - Feron and the running of the Broker's agents
      - grief managed through information and surveillance
    promises:
      - answers Tali directly — she has been to Rannoch before, but always on business, never long enough to sit still; she watched the resettlement mostly through her network, and this is the first evening the two of them have simply had here together
      - what keeping an intelligence network running in peacetime has cost her, hedged the way she hedges unverified intel
      - a dry, guarded admission that the habit of watching is also a way of not sitting still with the loss
      - turns the talk toward what she still doesn't tell anyone, even Tali, about what the network is for now
    target_words: 780

  - id: the-machines-that-remember
    title: The Machines That Remember
    narrator: tali
    events: [quarian-geth-morning-war, rannoch-quarian-geth-war-resolution]
    scenes: [rannoch-the-choice-above-the-fleet, geth-dreadnought-freeing-legion]
    retrieval:
      - the Morning War and the quarian exile
      - geth consensus and platform cognition
      - Legion specifically, as Tali knew it
      - the geth dreadnought and the Reaper control signal
      - quarian guilt over starting the war with the geth
    promises:
      - picks up Liara's "watching" with what she actually has, hands-on knowledge of the geth rather than intercepts
      - blunt, as always, that her people started the Morning War, and that being right about that changed nothing
      - explains what Legion's death at Rannoch meant in engineering terms — what a platform choosing to end itself is — and catches herself getting too close to it
      - a digression into geth architecture that she cuts off herself, embarrassed at how long she's been talking
    target_words: 800

  - id: thessia-after
    title: Thessia, After
    narrator: liara
    events: [priority-thessia]
    scenes: [thessia-temple-kai-leng-steals-vendetta, normandy-memorial-wall-after-thessia]
    retrieval:
      - the Reaper invasion of Thessia
      - the Temple of Athame and Prothean archives lost there
      - asari mourning customs and matriarch culture
      - Kai Leng's theft of the Vendetta beacon
    promises:
      - answers Tali's Legion story with her own homeworld's fall, matched in weight, not competed
      - what Thessia looks like now, seen through her network rather than in person, and what that distance costs her
      - names what was lost there beyond lives — archives, records, a species' certainty it couldn't be touched
      - a controlled, plainly stated moment of self-blame, in her register, not dramatized
    target_words: 800

  - id: seventeen-million-and-a-species
    title: Seventeen Million, and a Species
    narrator: tali
    events: [rannoch-quarian-geth-war-resolution]
    scenes: [normandy-bar-tali-rael-toast]
    retrieval:
      - Migrant Fleet population and three centuries of scarcity
      - Rael'Zorah as father and admiral
      - resettlement logistics — housing, ship allocation, who moves down first
      - quarian mourning practice
    promises:
      - careful not to weigh her loss against Thessia's, but sets the Fleet's numbers beside it anyway, the way an engineer sets two loads side by side
      - brings up her father unprompted, what he'd have made of Rannoch standing, and can't quite finish the thought
      - a digression into what building "home" out of a Migrant Fleet actually took, logistically, that she catches herself narrating like a status report
      - closes by handing the conversation to Liara — asks what Aethyta made of it all, since Liara mentioned her father once and dropped it
    target_words: 800

  - id: the-admiral-and-the-archivist
    title: The Admiral and the Archivist
    narrator: liara
    events: [tali-treason-trial-alarei]
    scenes: [flotilla-tali-treason-trial, citadel-apollo-aethyta-liara-father]
    retrieval:
      - Tali's trial aboard the Rayya and the Admiralty Board
      - Rael'Zorah's geth experiments as the charge behind the trial
      - Aethyta revealing herself as Liara's father
      - asari matriarch politics and pureblood status
    promises:
      - answers Tali's question about Aethyta directly, and admits she still isn't sure what to do with having a father who tends a bar
      - the secondhand version of Tali's trial that she heard from the crew, offered as what she heard, not what she knows
      - "draws the parallel out loud: two women whose fathers left them something to carry, one a name to clear, one a matriarch to reckon with"
      - a moment of open admiration for how Tali handled the Admiralty Board, since Liara never had to answer to one
    target_words: 780

  - id: what-the-trial-cost
    title: What the Trial Cost
    narrator: tali
    events: [tali-treason-trial-alarei, tali-recruitment-haestrom]
    scenes: [flotilla-tali-treason-trial]
    retrieval:
      - the actual charge and evidence at Tali's trial
      - Admiralty Board politics and quarian honor culture
      - Kal'Reegar and Haestrom
      - what Tali chose not to say about her father in her own defense
    promises:
      - corrects the crew's secondhand version Liara just gave, gently — what it actually felt like from inside the hearing chamber
      - "names the cost precisely: she cleared her name by using her own record and never had to say out loud what her father did"
      - ties it to the theme directly — what belonging to the Fleet costs, weighed against what it's worth
      - self-interrupts, the way she does, and turns the talk toward Shepard, who stood as her advocate in that room
    target_words: 800

  - id: the-man-we-both-loved
    title: The Man We Both Loved
    narrator: liara
    events: [london-conduit-assault]
    scenes: [earth-fob-final-goodbyes]
    retrieval:
      - Shepard's leadership and temperament as the crew knew it
      - the goodbyes at the Forward Operating Base before the final push
      - Anderson and the battle plan for the conduit assault
      - asari bonding and how Liara understands attachment without claiming romance
    promises:
      - picks up "Shepard, who stood as her advocate" and turns the talk fully onto him, careful to speak as the friend she was, not the partner Tali was
      - recalls the FOB before the final run — what she said to him there, in her own hedged, careful way
      - names what she loved in him without competing with Tali for the claim
      - ends on Anderson laying out the assault plan, setting up the room Tali was actually in
    target_words: 800

  - id: the-last-room
    title: The Last Room
    narrator: tali
    events: [london-conduit-assault]
    scenes: [earth-fob-final-goodbyes]
    retrieval:
      - the final squad selection at the Forward Operating Base
      - the armoured run to the conduit past the parked Reaper Destroyer
      - the Normandy's evacuation of the squad before Shepard and Anderson crossed alone
      - grief that has had years to become something she can talk about
    promises:
      - answers Liara by finishing what she couldn't have seen — the last room, being picked for the run, what Shepard actually said
      - the run itself and the moment the Normandy pulled her and Garrus out, and Shepard went on without them
      - is honest that nobody, her included, ever learned what happened past that point, and doesn't invent an answer
      - the grief is years-settled — she can say his name without stopping — but the pain never went away: she still feels conflicting emotions about that day, dimmed and mostly resolved, not tidied into acceptance (pain, guilt at being pulled out, grief, peace, marvel at what he did, anger at him for going on alone)
    target_words: 820

  - id: two-years-and-after
    title: Two Years, and After
    narrator: liara
    events: [destruction-of-the-shadow-broker-base]
    scenes: [redemption-liara-feron-hunt-shepards-body, alingon-liara-feron-shadow-broker-base, normandy-memorial-wall-after-thessia]
    retrieval:
      - SR-1 Normandy destroyed over Alchera
      - Liara Feron trade Shepard body Cerberus
      - Liara recovers Shepard's body from the Shadow Broker
      - Lazarus Project Cerberus rebuilds Shepard
      - Normandy memorial wall names
    promises:
      - answers Tali's account of the last room with what came after, from her side — years spent first not accepting it and then choosing to, though the choosing never finished the ache: the feelings are dimmer and mostly settled, still mixed, never gone
      - "the double grief, grounded in what she actually did the first time: Alchera, hiring Feron, fighting the Broker's people for the body, handing it to Cerberus, and Lazarus bringing him back — and this time nothing came back"
      - his name on the Normandy's memorial wall, the plate Tali engraved and set there, and the ceremony where the crew shared memories and eulogies — the same wall the two of them stood at with Garrus after Thessia
      - honest that some part of her network still runs a quiet search that finds nothing, and that she keeps it running anyway
      - turns the talk deliberately toward what there still is to be glad of, refusing to let the evening end on that
    target_words: 780

  - id: the-good-things-in-the-universe
    title: The Good Things in the Universe
    narrator: tali
    events: [rannoch-quarian-geth-war-resolution]
    scenes: [rannoch-admiral-koris, normandy-engineering-tali-geth-data-pilgrimage, normandy-tali-romance-suit-trust]
    retrieval:
      - quarian dextro food and suit induction ports
      - quarian immune system adapting on Rannoch
      - quarian naming vas nar ship names
      - quarian Pilgrimage tradition
      - geth helping quarians rebuild homes on Rannoch
      - Admiral Koris and the Admiralty Board
      - Tali romance with Shepard, the suit and the mask
    promises:
      - answers Liara's turn toward gladness directly, with specifics rather than sentiment
      - "a real list of good things, each one a piece of quarian life: dextro food eaten without an induction port, immune systems slowly adapting to Rannoch's air, the vas and nar in every quarian name and what they mean once people live in houses instead of ships, the geth helping build those houses — engineering-brained, not a speech about hope"
      - the Pilgrimage, and the geth data Shepard gave her as her gift — what that gift turned out to mean, seen from where she is sitting now
      - Koris as an example of ordinary people doing unglamorous, necessary work, not a hero
      - admits, in her own halting way, that she is allowed to be happy, and is
      - talks about her life with Shepard, and what they enjoyed together
    target_words: 1000

