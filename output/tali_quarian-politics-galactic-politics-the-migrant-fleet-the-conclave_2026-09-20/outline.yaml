# UNAPPROVED — remove this line to approve the outline
narrator: tali
themes:
- quarian politics
- galactic politics
- the Migrant Fleet
- the Conclave
brief: Tali delivers a passionate political speech from the floor at the center of
  the quarian Conclave chamber, addressing the assembled captains and the Admiralty
  Board; quarian politics and galactic politics both — what the Fleet's institutions
  have become, what the galaxy's institutions did to the quarians, and what she demands
  of both. Public, on her feet, heat in it.
form: manifesto
form_note: >
  The brief puts Tali on her feet addressing a body, not one person in a bad hour —
  manifesto over motivational. Sections are the planks of her platform, each carried by
  a piece of her own record rather than abstract argument. Timing: this is a Conclave
  session convened after the Battle of Rannoch (rannoch-quarian-geth-war-resolution,
  peace brokered, Legion dead, Rannoch retaken) but before the Cerberus coup and the
  final push on Earth — the exact window the brief's second axis names, when the Fleet
  has to decide what its institutions are for now that there is a homeworld and geth
  neighbours instead of an endless war to unite behind. Nothing here touches the ending
  or the Council of stars Shepard never returned to explain, per crew-never-knew-the-choice
  and shepard-death-unconfirmed — the speech sits entirely inside the war.
target_words: 5000
