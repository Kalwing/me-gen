narrator: liara
subject: shepard
themes:
- 'lore she is passionate about: Protheans'
- the Reapers
- the Prothean beacons
- Thessia
- the Cycle
brief: >-
  Liara talks about the lore she is passionate about — Prothean history and the
  cycles — to Shepard, with her scholar's eagerness.
  Per Thomas, Liara is the Shadow Broker (she took the title in ME2). Where she was not present, her second
  source is not only Shepard but her own network, agents and files, because knowing everything is her job;
  she can say what she learned, from which kind of source, and how far she trusts it.
  Per Thomas, Liara was on Feros with Shepard in this run (present for the Thorian and Shiala giving Shepard
  the Cipher; this overrides the scene record's participants).
  Per Thomas, Dr. Kenson is a scientific hero who was also indoctrinated and caused the Bahak (batarian)
  genocide; Liara holds both.
  Per Thomas, Liara was with the crew on the Presidium during the preaching hanar / C-Sec officer dispute
  (2183), so she witnessed it beside Shepard; this overrides the scene record's participant list for this run.
form: tunnel
form_note: >-
  Rewritten after feedback. The brief is one enthusiasm talked out at length, which is tunnel; but the spine is
  topical and associative, not Shepard's playthrough. The order is a chain of thoughts, each section opening from an
  object, a feeling or an aside in the one before (a dated fragment -> the ruins the Protheans themselves dug up ->
  the empire -> the neighbours nobody excavated -> a goddess who was a guise -> what other species made of them ->
  the Mars cache -> a message meant for someone else's mind -> her own dig -> the fall and the shelters -> the
  Crucible -> the cycles before -> the arithmetic of a cycle -> what to leave). Nothing runs in game order; Shepard's
  encounters (Eden Prime beacon, Therum, Feros, Ilos, Thessia, Javik, the Leviathan trail) appear as evidence or
  anecdote inside a topical section, and where Liara was not there (Eden Prime beacon, the Leviathan trail; Feros and the Presidium hanar dispute she did attend, per Thomas)
  she draws on Shepard and on her own Shadow Broker network (she is the Broker), saying which source she is using, not merely asking Shepard. Canon kept: Shepard was marked by the beacon, Javik came aboard, the
  Leviathan DLC and Thessia as recorded; Legion/Tali branches and the ending are not touched, and the talk stops
  short of the final choice. Pre-Prothean material comes only from corpus pages (Inusannon, thoi'han/Eingana, the
  Leviathan of Dis, the Leviathans, the Crucible design history) and is hedged in her voice: the corpus dates the
  Inusannon at 127,000 years and the Protheans at 68,000-48,000 BCE, which does not fit a tidy fifty-thousand-year
  cycle, and she should worry at that rather than resolve it. target_words is pinned at 9000 (a one-hour spoken lecture at roughly 150 words a minute, pauses included).
target_words: 9000
