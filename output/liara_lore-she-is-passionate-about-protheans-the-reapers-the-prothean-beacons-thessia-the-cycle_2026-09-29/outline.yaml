  - id: a-fragment-dated-to-68000
    title: A Fragment Dated to 68,000
    events: [arrival-bahak-relay-destruction]
    scenes: [fehl-prime-prothean-device-liara-contact, project-base-kenson-indoctrination]
    retrieval: ["Amanda Kenson Arrival Bahak system batarian relay destroyed", "Fehl Prime Prothean communication device dated", "Prothean ruins Feros Quana Therum plundered", "Prothean Legacy surviving ruins Attican Traverse", "Feros Prothean megatropolis ruins", "Prothean archaeologists dig methodology dating"]
    promises:
      - "Opens on a single object, a Prothean communication device on Fehl Prime dated as early as 68,000 BCE, and what a date like that does and does not tell you"
      - "What a ruin can and cannot say: looted cities, surprisingly intact stations, functioning tech that is rare, and why she trusts a stratum more than a story"
      - "Her own line to that site: Treeya's call from the Prothean relay on Fehl Prime, told as something reported to her and not verified on the ground"
      - "Dr. Amanda Kenson as a scientific hero (her dust dating of the relays) who was also indoctrinated and is the reason a batarian system was destroyed; Liara holds both at once, will not let the dust-work cancel the Bahak dead or the dead cancel the dust-work, and says so without a tidy verdict. She knows the Bahak end from Shepard, who was at Arrival, and from her own Broker files, which she can weigh against his account"
      - "Feros, Quana and Therum named as the sites people can actually stand in, with the Attican Traverse as the sites nobody has opened; Liara was on Feros with Shepard in this run, so she speaks of the megatropolis and the Thorian's lair from having been there (no more than the scene record gives her)"
    target_words: 640
