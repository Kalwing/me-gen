sections:
  - id: hardware-and-software
    narrator: tali
    title: Hardware and Software
    events: [tali-recruitment-haestrom, tali-treason-trial-alarei, priority-perseus-veil]
    scenes: [normandy-engineering-tali-geth-data-pilgrimage, flotilla-tali-treason-trial, alarei-rael-zorah-body, quarian-envoy-admiralty-briefing, normandy-tali-stealth-experiment]
    retrieval:
      - "quarian suit environmental clean room immune system"
      - "Tali engineering Adams Kenneth Gabby drive core"
      - "Tali treason trial Rayya Rael'Zorah Alarei"
      - "Shala'Raan admiral Migrant Fleet admiralty board"
      - "quarian dextro food and suit restrictions"
      - "quarian Pilgrimage customs"
      - "Normandy mess galley cooking"
    promises:
      - "Tali stands up first, as an admiral in front of people some of whom report to her, rambles and apologizes and then says the true thing flat. She starts with the SR-1 workbench pair: she did the hardware, he did the software, and both talked at once; he was the one human who asked about the Flotilla as a place people live. She owns 'handyman and software engineer first, cooking second' and says it here, once, for the whole room"
      - "The SR-2, on a Cerberus ship they both hated: the labelled dextro shelf, meals left where nobody watched her eat, and the sterile station in a corner of engineering with the extra filter stage, for suit maintenance and induction-port meals (she never unsuited there), his code taped to it under a drawing of a smiling face. He told her Adams built it so he would not be thanked; she found out from the comments in his code. Her trial on the Rayya: he was in the gallery, the only one who did not tell her that her father loved her: 'loving you and choosing you aren't the same thing', then what did she want to build first, on a planet they did not have yet. Days later he told her something in engineering he had never said aloud; she says only that he told her, and leaves its content to Liara"
      - "The locker tally of fixes: he never put a mark on his own side, even the week she broke the ship, and called rerouting a whole coolant line 'holding her tools'. She owns 'he gave the win away' as her locker count. Then she breaks the silence about his hands, on purpose, and says so: he joked about the tremor first and loudest so nobody else could, and she and Joker knew what it cost him. Tremor only here, briefly"
      - "The flaws she tells, because they cost her: his bench mount failed for three weeks before she found out, because he redid every joint twice at night rather than ask while she was busy with the geth (she would have stopped; that is how version two happened, which is what she gave him, and he took it, late). And going to Admiral Raan behind her back to ask whether she was sleeping: she called him on it, he mostly stopped. She is angry telling both and in love telling both"
      - "No playlist and no habit-of-his beat in this turn (EDI has her playlist). She drinks something dextro she brought, never ryncol. Haestrom in one clause (P6). She does not know the evening's structure: no reference to a later turn of hers. Shepard is missing, not confirmed dead, mentioned once without the Akuze origin (that comes at the end). She nearly breaks, swallows it with 'give me a second', and hands the room on unfinished; no full collapse, no recording, no poems, no 'I love you' story yet. No mission recaps: Haestrom, the Alarei and Rannoch appear only where he stood in them. This is a eulogy: lament, how they bonded, what she loved, celebration; American spelling"
    target_words: 3420
  - id: plates-outside-the-hole
    narrator: jack
    title: Mirror, Maw
    events: [jack-recruitment-purgatory, jack-subject-zero, grissom-academy-emergency-evacuation]
    scenes: [normandy-engineering-jack-confidences, pragia-jack-teltin-facility, grissom-academy-jack-and-the-biotic-students, citadel-jack-apartment-eezo]
    retrieval:
      - "Jack hidey hole engineering deck"
      - "Pragia Teltin facility Cerberus experiments"
      - "Jack hardcore music mosh pit"
      - "N7 tattoo"
      - "Grissom Academy biotic students Jack teaches"
      - "Jack tattoo Citadel shore leave"
    promises:
      - "Jack gets up because Tali stalled on 'give me a second', covers for her crudely ('sit down, I got this') and gives the room a friend's turn, not a lover's: she never takes Tali's place. The plates left outside her hole every night for weeks, folded napkin, never seen doing it; she ate the third one on the stairs. After Pragia he sat beside her saying nothing, then the joke about nobody ever asking how the bomb was doing, and she laughed. No Pragia or Purgatory recap"
      - "The mirrored wound, told through silence: he never avoided her: he showed care subtly, inside her limits, talking to her sometimes about shared interests (hardcore, old bands), and they never had to explain their pasts ('I'd say mirror, and he'd say maw'). Neither asked about the other's tattoos. The pit at their first show: split lip, grinning, never good at dancing but loose. The N7 tattoo she showed him on purpose and the crate he fell off laughing. Before Tali was aboard, with Kelly's gossip about her going round, she offered him sex partly to break the silence when he sat with her; he said no, he liked someone already, and when she said it was only sex he said it was never only that. When Tali came aboard she got it: he already loved her, silently. After that she liked him. Her to tell, crude and fond, one pass; the verdict on Tali stays in the 'too good for him' line"
      - "She tattooed his hands, DARE and CARE, on the Citadel, told as a friend: he said it was what he wished he'd do more. He showed everyone. The tremor itself is left alone (Tali has spoken). Grissom: the lopsided robot he built with the tech kids from Adams's scrap, programmed to flip her off, and the light going out of his face when he saw her watching. The classroom, hot (read-through P1): she asked him three, four times to come teach, every time a joke, 'you asshole', she is still pissed and staying pissed; it does not get fixed"
      - "Poetry nights, corrected: only Kasumi and her, Grunt now and then to listen, a handful of times, never everybody; he mostly stayed away so as not to interrupt, and when he came he smiled and liked it for real because it was honest, though her stuff was rough; he compared it to raw artists she cannot name now, like she'd been feeding on them. Her line to the room, said once and meant: she told him privately that Tali was the only person aboard too good for him and not to screw it up; he knew it already and never dared question it. Her playlist ('Rough stuff, I like it.') and the habit of his she is learning (caring for people out loud). Crude, short, American (no Britishisms, no 'sweetheart'), sad underneath; no Shepard origin, no mother story, no body, no hospital talk. This is a eulogy: lament, how they bonded, what she loved, celebration"
    target_words: 1715
  - id: the-help-desk-is-closed
    narrator: joker
    title: The Help Desk Is Closed
    events: [suicide-mission, reaper-invasion-of-earth-shepard-flees-vancouver, citadel-dlc-archives]
    scenes: [normandy-sr2-collectors-board-joker, citadel-party-apartment, citadel-party-morning-after, citadel-sushi-with-joker]
    retrieval:
      - "Joker brittle bone disease Vrolik syndrome"
      - "Joker EDI relationship"
      - "Collectors board the Normandy Joker EDI alone"
      - "Tiptree Joker family sister"
      - "Normandy cockpit pilot seat"
      - "Citadel party apartment Joker"
      - "Blasto vids hanar"
    promises:
      - "Joker picks up Jack's 'too good for him' with 'the Help Desk', his name for Thomas and Tali, and how he announced when the Help Desk was closed. Then the jokes, at length, because they joked all day on both ships: mock in-flight announcements from the jump seat, 'you're an anarchist' / 'I'm a pilot', the krogan body pillow's backstory, the hull-stress alarm that went off when Joker sneezed, James's protein swapped for seitan for a week, the Blasto commentary track, the dance scorecard with Thomas dead last, and the ghorza Thomas gave him for his birthday, which Thomas found hilarious"
      - "The abduction: when the Collectors took the crew, Thomas was out of the way mid-repair and stayed hidden; they met in the ducts after EDI was unshackled, and he was not taken. He hated that he had hidden while the others were taken, and Joker knew it. No apologizing-to-a-pipe bit. Told as their story, not a mission recap; no Collector-base aftermath recap. The deal over Tiptree and Rouen when the Reapers hit: whoever heard first said nothing until the other heard too, three days in the cockpit not saying anything, for once"
      - "The Citadel party: Joker owns 'he outdrank everyone' and says it, plus Thomas backing every lie in his restaurant story and standing upright beside a cleaning drone in the morning with a glass of water. Shepard holding up the wall at his own parties until Thomas got him off it (something the whole room saw). Shepard missing, not confirmed dead, from the cockpit's angle, no Akuze retelling"
      - "What has to come out of this turn: they joked every time about everything, crudely, partly because each knew the other's trauma and pain; they never needed to talk about it, but each had the whole story. Best friends. The hospital told seriously first, the heavy stuff (the stays, the attempts, the fear, the long nights, what it was like for two people whose bodies or minds betray them), in his own blunt words and honest, no swallowed line, then Joker undercuts it with a bad joke. Rating each other's stays was one running bit among many, not the main thing (Thomas always ranked Joker's above his own). The sandwich he made Thomas once, a terrible one, and Thomas getting up embarrassed to make him a better one, told where it comes up, no teaser or callback. Joker is not an authority figure: no regulations he enforces"
      - "His playlist ('Funny Robot-fucker') and the habit he caught: he says 'you win' to people now. Keep the Blasto commentary track. Under the bits he is sad and a joke fails to land. This is a eulogy: lament, how they bonded, what he loved, celebration; no SR-1 crash recap, no clone plot"
    target_words: 2912
  - id: a-counter-is-a-short-distance
    narrator: liara
    title: A Counter Is a Short Distance
    events: [benezia-death-noveria, destruction-of-the-shadow-broker-base, priority-thessia, aethyta-supports-war-effort]
    scenes: [citadel-apollo-aethyta-liara-father, normandy-liara-pureblood-conversation, normandy-memorial-wall-after-thessia]
    retrieval:
      - "Aethyta Liara father bartender Illium"
      - "Liara Shadow Broker information network"
      - "Prothean empire cycle Reapers"
      - "asari matriarchs age stages maiden matron"
      - "Liara coffee Citadel shore leave"
      - "asari culture mourning rites"
    promises:
      - "Liara picks up Joker's hospital story: she did not have that, what she had was different, and says which kind. Then what is hers alone: the night she told him about Benezia and Peak 15 and he told her about his mother. She tells the mother story, the only speaker who does, in her own careful summary, and no one else in the room has told it"
      - "The mirrored wound: when she learned her father poured drinks on Illium, he was the one who did not laugh. His own father never left and was never quite there, always inside his work; 'go sit at her bar, a counter is a short distance.' She did, twice. That push is what he gave her"
      - "His Prothean argument, hers to tell with Kropotkin by name (the only speaker who names him), garbled with the beavers and 'Murray Bookman': a centralised empire has nowhere to scatter, so the Reapers unplugged it. His gerontocracy tease ('promoted for being lonely'). He loved Shadow Broker Liara for the wrong reasons and never asked her for a name. Thessia was the one thing he never made lighter; he shut down a joke about it in the mess. Coffee at Apollo's and his Rouen (Monet's cathedral, the great clock). Thane: the bond, his anger at the disease, pride and despair together at the death, still cooking daily (a short paragraph). Joan of Arc, his way: rewritten into other people's stories; people's stories are theirs alone, circumstances build the world more than individuals, narrative can be twisted but consequences stay, and Thane agreed (he loved Thane); he hated anyone using history to feed hatred. Then his love-as-entropy riff, which she garbles in her own words: love can't be compressed or encoded, so nobody can be deified or vilified except those who try to shrink it. He treated science as art, mixing fields, caring about what a technology means more than how it works, and the 'born in Normandy, serving on the Normandy' joke he stopped telling"
      - "The flaws she tells: he described his own wound like a paper he had peer-reviewed, and when she asked how it felt he said he never knew, laughed and went to make tea, and never came back with the answer; and he told her he left a woman on Earth before she could leave him and called it kindness, she said it was the opposite, he agreed too quickly, which is how she knew he would do it again."
      - "No playlist, no habit beat, no 'Shepard is missing' line in this turn. If she mentions what Thomas told Tali, it is 'in engineering' (no corridor). No codex clauses (Binary Helix, Feron, caches; read-through P3). Precise, no contractions where she would not use them, but not composed: she loses her place, starts a sentence twice, stops; no polished closer on each paragraph. No Shadow Broker monologue, no Hagalaz, Vendetta or Thessia recap. This is a eulogy: lament, how they bonded, what she loved, celebration"
    target_words: 1886
  - id: same-tank
    narrator: grunt
    title: Same Tank
    events: [grunt-recruitment-korlus, grunt-rite-of-passage-tuchanka, attican-traverse-rachni]
