    narrator: kaidan
    title: The Senior Officer
    events: [priority-mars, cerberus-coup-citadel-ashley]
    scenes: [normandy-kaidan-starboard-observation, citadel-apartment-kaidan-canadian-meal, citadel-coup-kaidan-confrontation]
