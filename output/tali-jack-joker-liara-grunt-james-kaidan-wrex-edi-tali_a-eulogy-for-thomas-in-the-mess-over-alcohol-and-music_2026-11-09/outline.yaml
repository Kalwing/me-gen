    promises:
      - "Kaidan picks up James's last words and does the room formally, beer in hand. The mirrored wound: bodies that betray them, both on medication; they compared pill cases once, Kaidan's had more compartments, and Thomas said that made him the senior officer. The SR-1 late talks at the crew-deck lockers: he asked about the migraines, the implant, BAaT and Rahna without pity. The small crush, known and handled gently. No tremor talk"
      - "The flaw he tells: humor as a wall. Every time Kaidan got near Akuze there was a joke, a good one; he laughed every time, and it took him a year to see that was the point. He does not retell Akuze. Then he holds back on purpose: everybody tells 'he outdrank everyone' as a party story (that is Joker's), Kaidan won't tell his, only that he was up at six some nights too and Thomas wasn't at a party"
      - "Food and beer: vegetarian and vegan, the same plate, the only man aboard who never made the joke. The Citadel poutine dinner with Thomas's vegan pot beside his; lager against sours ('an excuse to drink from everybody else's glass'); the case of Canadian lager Thomas found him before London."
      - "The payoff: at Huerta, Thomas called a Spectre the most unaccountable power in the galaxy; Kaidan heard that voice at the coup and lowered his gun. Keep it, tell it as the best thing anyone ever said to him, no Mars, Horizon or Brain Camp recap, no Crucible-data or coup-outcome list (P7: 'I put the gun down. You were there for the rest.'), no Huerta hospital ratings (Joker's). Shepard only as the commander they both served, no 'missing' beat"
      - "His playlist ('Can I help?'); London: he was elsewhere on the line and did not see Thomas. This is a eulogy: lament, how they bonded, what he loved, celebration"
