    promises:
      - "Grunt cuts across Liara's careful words with something blunt. The mirrored wound: he asked Thomas whether he was real or just Okeer's idea, Thomas said he had asked himself the same, and Grunt said 'Okeer made me. You made you, for everyone else. Same tank.' Thomas did not joke for a whole minute. Grunt calls him brother"
      - "The flaw, told as a thing he did: Thomas forgot Grunt's decanting day, and three weeks late a crate came to Tuchanka with a plastic Earth dinosaur and a note (late, sorry, it looked like you). Grunt had not known he had a decanting day until Thomas forgot it. It is on his armor rack"
      - "He guarded the mess kitchen like a clan holding; Thomas let him, made him heavy salted dishes without saying they were for him, made him tell the Rite three times and sat on the floor laughing at the Uvenk part. Grunt's own vegan joke (the 'no body / no meat in it' one is his). What Grunt gave him (a drink, and Thomas never said no even on bad days) and the habit: Grunt chops in a straight line now, and annotated four of the recipe cards"
      - "Before London, aboard the Normandy for the last night before riding down with Hammer, he and Vega did Thomas's armor straps while his music played; Grunt pulled them tight and Thomas said good. One or two lines, then he hands it to Vega ('Vega tells it'); he does not describe the music or the jumping"
      - "No playlist in this turn. Short, blunt, no built speech, no Korlus, Rite or Utukku recap, no body or Rouen (that is Wrex's), no hands. Shepard missing, said krogan-plain. This is a eulogy: lament, how they bonded, what he loved, celebration"
