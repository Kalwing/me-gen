subject: thomas.tali
themes:
- a eulogy for Thomas
- in the mess
- over alcohol and music
brief: 'Eulogy for Thomas held in the Normandy mess a few weeks after London, with
  alcohol and his playlists playing. Tali romance branch. Ten turns in this order:
  Tali (long), Jack (a friend, ~900 words), Joker, Liara, Grunt, James, Kaidan, Wrex,
  EDI, then Tali again (long) to close. Total runtime 45 minutes to 1 hour spoken.
  Each speaker addresses the room and picks up what the previous one said. Fork of
  the 2026-10-13 Jack-branch eulogy: keep its strongest beats where the Tali notes
  allow, apply todo15.10.26 (no canon recaps, no outing him, one owner per trait,
  Tali''s collapse saved for the end, flaws told by the person they cost, mirrored
  wounds, what each gave him, playlists, habits now theirs). Shepard is missing, not
  confirmed dead; the crew know only what they witnessed of Shepard''s talks with
  Thomas.'
form: eulogy
form_note: >-
  Eulogy, as named: nine people on their feet in the Normandy mess a few weeks after London,
  ryncol and his playlists going, each saying what there is to say about Thomas, each turn
  picking up the one before. This is a fork of the approved 2026-10-13 Jack-branch eulogy onto
  the Tali-romance branch (subject thomas.tali; config/narrators/thomas.tali.notes.md is the
  only ground truth, and it wins over todo15.10.26 and the old outline wherever they differ).
  The old structure is kept: same room, same ten-turn chain, the same speakers after the
  opener, the strongest beats where the Tali notes allow them (Joker's ratings, Kaidan's coup
  payoff, Grunt guarding the kitchen, Wrex's pyjak, EDI's clover). What changes: Tali opens
  and closes as the partner, and Jack drops to a friend's ~900 words in second place; Jack's
  romance beats (poems, 'I love you', the recording, Grissom long-distance, the no-promises
  rule) move to Tali in their Tali-notes form; Joker's name for the couple is now 'the Help
  Desk'. The todo review is applied as hard rules in the promises: no canon recaps (a canon
  event appears only at the moment Thomas walks into it); nobody outs him (Tali alone breaks
  the silence about his hands, on purpose; Joker may tell the hospital side, attempts included,
  in his own words; EDI describes his issues but never the attempts; the mother story is Liara's alone); one
  owner per trait ('handyman first, cooking second', 'joked about his hands first' and the
  locker count are Tali's, 'outdrank everyone' and the ratings Joker's, Kropotkin by name
  Liara's, the body on its way to Rouen Wrex's, the Akuze/Shepard origin Tali's closing
  turn); each flaw told by the person it cost; one mirrored wound per speaker. The devices
  (what someone gave him, their playlist, a habit of his now theirs, 'Shepard is missing')
  are a pool, not a per-turn checklist: each lands in a few turns only, unannounced, as
  assigned in the promises (voice-check feedback 2026-11-11). Turns are rough talk at a
  wake, not composed speeches; at most one refusal in the whole episode (EDI leaving the attempts
  out, if it comes up); nobody knows the evening's structure. Tali's
  collapse is saved for the last turn: in her first she nearly breaks and swallows it.
  Spine is mixed: Thomas is not in the corpus, so sections anchor on the occasions his notes
  place him in and the speaker's own vantage on them. Canon: genophage cured, Wrex leads,
  geth-quarian peace with Legion dead, Mordin and Thane dead, Grunt alive, Tali and Garrus
  evacuated from the conduit run; the crew do not know there was a choice, only its
  consequences, and Shepard is missing, not confirmed dead. Shepard-Thomas material is
  limited to what the speaker could have witnessed or been told. Ten sections, inside the
  form's 6-14. target_words was pinned by the user at 17,690 and raised to 17,940 for the
  armor-straps beat (above the form's clamp, as the brief's 45-60 minutes asks). Turn sizes follow the brief rather than an even voice
  balance: Tali 3,000 + 3,600, Jack 900, and Jack's freed words spread across the other
  seven (Joker 1,900, Kaidan 1,850, Liara 1,700, EDI 1,690, James 1,300, Wrex 1,150,
  Grunt 850). Handoffs: Tali's swallowed 'give me a second' to Jack covering for her; Jack's
  'too good for him' to Joker's Help Desk; Joker's hospital story to Liara on what she alone holds; Liara's careful words to Grunt's 'same tank'; Grunt's rating of his strength
  to James's punch; James's last word to Kaidan's pill cases; Kaidan's coup voice to Wrex being
  told he was wrong; Wrex's 'you show up' to EDI's eleven tasks; EDI's files to the one file
  she does not have, which Tali carries in a sealed pouch.
