  - id: the-other-side
    title: The Other Side
    events: [jack-subject-zero]
    scenes: [pragia-jack-teltin-facility, normandy-engineering-jack-confidences]
    retrieval: ["biotic soldiers calorie ration", "biotic amp implant L2", "Pragia Teltin facility", "Normandy SR-2 Thanix Silaris armament", "cyclonic barrier technology", "Collector seeker swarms"]
    promises:
      - "Biotics as she knows them in her body: every barrier and every throw burns the fuel the military feeds its biotics extra rations for, the implant headaches, the crash afterward. So breakfast is a combat job today and it's his. She brings in Pragia as two or three lines of fuel: she went back to the place that made her, blew it up, and still got up the next morning"
      - "The concrete list for the morning: a real breakfast for the squad, the last checks with Tali on the borrowed hardware (the turian Thanix gun, the asari Silaris plating, the cyclonic barriers), then a message home to his family and his closest friend before the comms go dark"
      - "Shepard got him off the floor once. This morning it's her turn, said her way: you don't get to pick the odds, you pick whether you're out of bed"
      - "She won't promise either of them comes back, and says so. It closes on exactly 'I'll see you on the other side.'"
