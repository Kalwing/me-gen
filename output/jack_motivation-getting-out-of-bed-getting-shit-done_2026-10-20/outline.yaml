  - id: the-relay-nobody-comes-back-from
    title: The Relay Nobody Comes Back From
    events: [derelict-reaper-iff-mission, collector-ship-mission, legion-a-house-divided-heretic-station]
    scenes: [normandy-sr2-collectors-board-joker, heretic-station-legion-a-house-divided]
    retrieval: ["Omega 4 relay", "Reaper IFF derelict Reaper", "Normandy attacked Joker EDI alone", "Collectors Protheans", "Horizon Collector attack colonists", "Legion heretic geth rewrite"]
    promises:
      - "She hauls him up in the ship-time morning after his long shift on the emptied stations. The night before is touched once and dropped, and she isn't going soft about it"
      - "The stakes as she sees them: no ship has ever come back through Omega-4, and the IFF they ripped out of a dead Reaper is the only reason they get to try. The Collectors took the crew while she was off-ship with the squad. He was aboard, hidden, not taken, and she won't let him carry that as guilt"
      - "What the Collectors are, which she got from the Collector ship and from Shepard: Protheans the Reapers rebuilt into tools, 'people who think they own you' taken all the way down to the genes. Horizon's colonists frozen by the swarms and carried off, the same pods the crew are in now"
      - "Legion's heretics chose to let the Reapers do their thinking for them. She would rather die as herself, and getting out of bed is the smallest version of that choice"
    target_words: 520
  - id: things-that-get-back-up
    title: Things That Get Back Up
    events: [grunt-rite-of-passage-tuchanka]
    scenes: [tuchanka-grunt-rite-of-passage]
    retrieval: ["Tuchanka nuclear war", "genophage", "krogan Rite of Passage thresher maw", "Grunt tank-bred krogan Okeer", "Urz varren", "varren fighting pits"]
    promises:
      - "The krogan blew their own world to ash, got sterilised by the genophage, and still get up every day on Tuchanka and pick a fight with the planet. She tells it through consequences: who did it to them and who keeps living in the rubble, not dates or treaties"
      - "Grunt's Rite, told as crew talk and Grunt's bragging since she wasn't there: a tank-bred kid nobody thought was a real krogan killed a thresher maw, the first since Wrex. She knows what a maw means to Thomas and gives it one line, no more"
      - "Urz, the beat-up varren on Tuchanka who still wanted the fight, and why she respects animals that make their intentions obvious. The fighting-pit economy that uses them up, in her own blunt terms"
      - "She names the 'I'm not a fighter' doubt out loud and won't let him joke past it. The krogan didn't pick their odds either. Getting up is the fight"
    target_words: 410
  - id: people-who-kept-working
    title: People Who Kept Working
    events: [mordin-recruitment-omega, tali-treason-trial-alarei]
    scenes: [omega-mordin-clinic-recruitment, flotilla-tali-treason-trial]
    retrieval: ["Omega Aria T'Loak", "Omega plague vorcha", "Mordin Solus clinic", "Migrant Fleet", "quarian Pilgrimage", "Tali treason trial Alarei"]
    promises:
      - "Omega as the place where nobody's coming: Aria's one rule, the gangs, the people who get up anyway because nobody else will feed them. Thomas had his own broke year there before Shepard called, and she uses it as proof he has done mornings worse than this one"
      - "Mordin in the sealed plague district, running a free clinic with vorcha and mercs in the streets, his cure pushed through the district by restarting the fans. The plague was made to skip humans, which she reads as Collector work. Nobody paid him to stay"
      - "The quarians keep a whole fleet flying on patched three-hundred-year-old ships because nobody can afford for anything to break, and send their kids out on Pilgrimage to bring something back. Tali got hauled before her own Admiralty for her father's crimes and went straight back to work. Thomas works under her, so the drive core is his job this morning"
