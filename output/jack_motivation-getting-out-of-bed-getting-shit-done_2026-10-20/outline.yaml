
narrator: jack
subject: thomas
themes:
- motivation
- getting out of bed
- getting shit done
brief: >-
  Short episode (~10 min spoken). Jack gets Thomas out of bed and into the work
  in the ship-time morning before the Omega-4 jump, after his long shift covering the
  stations the Collectors emptied. Less about him and her, more general: getting up,
  doing the work, showing up when it counts. She makes the case mostly with galactic
  lore and story she knows or heard aboard (the Collectors and the relay, the krogan
  and Tuchanka, varren, Omega, Mordin's clinic, the quarian fleet, biotics, the
  ship's borrowed hardware), carried by her opinions. Her own past only where it
  truly fits as fuel for the push, briefly. The night before is touched once at most.
  Nothing from the mission's outcome is known. Closes on exactly 'I'll see you on the
  other side.'
form: motivational
form_note: >-
  A speech to get one man up and into the work: stakes, doubt, the evidence that people
  get up anyway, the call. Per the user's new direction the evidence is mostly lore, not
  his history. The Collectors as people the Reapers own all the way down, krogan who got
  up off a planet they nuked, a varren that can't stand and still wants the fight, Mordin
  running a free clinic in a plague zone, a quarian fleet kept flying on patches for 300
  years, what a biotic barrier costs. Thomas stays as the addressee and gets one beat per
  section, not a biography: the 'not a fighter' doubt, his broke year on Omega, working
  under Tali, Shepard having been the one who got him up last time. 4 sections, below the
  form's 6-12, because the user asked for 4 and pinned 1500 words. Vantage is the hours
  before the Omega-4 jump. The Collectors have taken everyone but Joker
  (normandy-sr2-collectors-board-joker). Thomas was mid-repair out of the way, stayed
  hidden, met Joker after EDI was unshackled, and was not taken (thomas.notes.md). Canon
  iff_delay is "went immediately", so "morning" means ship-time hours. suicide-mission is
  deliberately not anchored, so no outcome evidence (bubble, vent, survivors) reaches the
  writer. Jack was not on Tuchanka for the Rite or at Mordin's clinic in the scene
  records. She tells those as crew talk and Grunt's bragging, not as memory. Pragia she
  lived, and it gets two or three lines of fuel. Eezo the varren is later (ME3) and must
  not appear.
target_words: 1820
