narrator: jack
themes:
- focus
- resolve before war
brief: Jack motivate Shepard to focus, and get ready for war
form: motivational
form_note: >
  The brief is a speech, not a life story: Jack talking Shepard up in the last hour before
  the last push, using her own record as proof it can be done. Set after the Cerberus coup,
  the Citadel DLC shore leave, and the Cronos Station assault, this is the morning of the
  London conduit assault on Earth — everything is already staged (ships loaded, the plan
  set, the crew briefed), and the only thing left to do is get up and launch it. Jack is
  rousing Shepard right before he walks out to fight, not settling him in for the night.
  Romanced Jack per canon.choices (romance: Jack), consummated per jack_meeting/normandy-engineering
  scene at the end of ME2, with the Citadel DLC back tattoo. Note: choices.yaml's
  citadel_coup detail says Thane "died protecting the dalatrass," but the event record
  (thane-krios-death-defending-the-salarian-councilor) and the coup scene
  (citadel-coup-csec-office-kai-leng) both have him dying for the Salarian Councilor —
  treating this as the user's shorthand slip, not a real contradiction, and writing it as
  the Councilor. Per Thomas's request, "what-cerberus-made-me-for" and "the-kids-at-grissom"
  were rebuilt off shared Shepard/Jack history and broader lore instead of the Teltin and
  Grissom backstory events: recruitment off the Purgatory prison ship (jack-recruitment-purgatory)
  plus the Jack/Miranda confrontation Shepard settled (jack_miranda_dispute: appeased
  both), and the Suicide Mission itself (Jack held the biotic barrier, all-survived
  outcome per suicide_mission canon). Pragia/Teltin and Grissom get at most a glancing
  bridging mention, never the anchor. Jack's framing of "holding a barrier is a focus
  problem, not a strength problem" and "Cerberus bought a weapon and Shepard made a
  person" are her own editorializing on the record, not new corpus facts.

  Revision per Thomas: Shepard's own AU record is now a load-bearing second thread, not
  a token mention. Jack is pitching HIM back to himself — every section now carries at
  least one beat where she cites something true of Shepard specifically as the proof,
  not just her own Purgatory/barrier/Brimstone/Murtock record. Sourced from
  config/canon/choices.yaml's Shepard AU overrides (Normandy-born, no parents, gang and
  drug problem before Anderson pulled him into N7; Sole Survivor of Akuze, the whole
  squad dead but him; Vanguard, biotic charge into the guns; alignment "Paragon, except
  against oppressors"; first name Thomas) plus the ME2/ME3 record most relevant to a
  focus-and-resolve pitch: Cerberus rebuilding him from a corpse via the Lazarus Project
  (a direct mirror to Jack's own tank), Mordin's death at the Shroud finishing the
  genophage cure, and Thessia — the one fight where Kai Leng actually got the better of
  him and walked off with Vendetta, which Jack uses as the counter-example, not the
  insult. Kai Leng's death at Cronos Station, days earlier in the same push on Cerberus's
  headquarters, closes the speech as proof the focus she's asking for is already proven,
  not a new trick.

  Second revision per Thomas, correcting two errors: (1) the outline had previously let
  the closing section cite the Illusive Man's suicide as settled proof Jack could point
  back to. That confrontation happens on the Citadel, concurrent with or immediately
  after the London conduit assault itself — part of the endgame this speech is walking
  Shepard out the door toward, not something resolved before it. It has been cut
  entirely; Kai Leng's death at Cronos Station (a distinct, already-resolved event from
  the assault on Cerberus's headquarters, which happened before this morning) carries
  that closing beat on its own. (2) the whole episode was misdated as the evening before,
  ending in the two of them going to sleep. It is corrected throughout to the morning of
  the assault itself: the fleet is already massed, the plan already briefed, nothing left
  to prepare — Jack is waking Shepard and getting him moving, not tucking him in. No
  section still ends on rest; every "tonight"/"tomorrow" reference has been changed to
  "today," "now," or "in the next hour," and "The Last Quiet Night" is renamed "The Last
  Quiet Hour" to hold the tattoo-and-sentiment beat inside a tense pre-launch hush instead
  of an evening of repose. The Crucible's final choice and Shepard's fate at the end of it
  remain deliberately left out: that hasn't happened yet either, and reaching for it would
  still be narrator omniscience, not something Jack could actually voice this morning.

  This does not strain the form. `motivational`'s brief is explicit that "the narrator's
  own history is fuel for the exhortation, not the subject of it" — and Jack's whole
  method here is to make Shepard's history do exactly that work on Shepard himself: he's
  not telling her own story for its own sake, she's holding up his record as the evidence
  because a room full of only Jack's proof lets him nod along without it landing on him.
  Spine stays `mixed` — some sections anchor to Jack's own events/scenes, some to
  Shepard's, most to both at once, which is precisely what a speech that argues from the
  listener's own life looks like structurally. No change to form.
target_words: 8000
