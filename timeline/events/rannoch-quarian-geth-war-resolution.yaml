event_id: rannoch-quarian-geth-war-resolution
title: The Battle of Rannoch and the Quarian-Geth Resolution
game: Mass Effect 3
chronological_order: 1650
date: 2186 CE
summary: 'In 2186 the quarian Migrant Fleet launched an all-out war to retake Rannoch, catching the geth
  mid-construction of their megastructure. When the flotilla bombarded and destroyed the structure, killing
  many programs and dimming the consensus, the surviving geth accepted Reaper code and Reaper upgrades
  to survive - which turned the war in their favour and pushed the quarians to the brink. Both fleets
  appealed to Commander Shepard. Shepard first infiltrated a geth dreadnought over Rannoch and freed Legion
  (or, if Legion was lost, a Geth VI) that had been wired into the drive core as the Reapers'' signal
  booster, shutting the dreadnought down. Shepard then made planetfall and, painting the target for orbital
  fire, destroyed the Reaper on the surface that was broadcasting the control signal, freeing the geth
  fleet from Reaper command; dialogue lets Shepard frame this as vengeance for the pre-Prothean species
  harvested to build that Reaper. With the geth free but the quarians still attacking, Legion sought to
  upload the Reaper-derived code to grant every geth true individual consciousness, while Tali''Zorah
  feared it would doom her people. Shepard moderated the standoff (per `geth_quarian` and `rannoch`).
  Allowing the upload without brokering peace gives the geth full sentience and their fleet to the war
  but sees the quarian fleet destroyed, with Admiral Koris and Tali possibly lost. Refusing the upload
  wipes out the geth and leaves the quarians to reclaim Rannoch. A successful reputation check - requiring
  Legion alive, both Tali and Legion loyal, the heretics rewritten and the Tali/Legion history reconciled
  - brokers a ceasefire: the geth help the quarians resettle Rannoch, some even uploading into quarian
  suits to rebuild their immune systems, and both fleets join the war. In every branch the unit (Legion
  or the Geth VI) sacrifices itself to complete or enable the upload.'
characters:
- Commander Shepard
- Legion
- Tali'Zorah vas Normandy
- Admiral Han'Gerrel
- Admiral Zaal'Koris
- Admiral Daro'Xen vas Moreh
- Admiral Shala'Raan vas Tonbay
- EDI
- Harbinger
- Geth VI
consequences:
- The geth dreadnought is disabled and the Reaper directing the geth on Rannoch is destroyed, freeing
  the geth fleet from Reaper control
- 'Per `geth_quarian`/`rannoch`: the geth gain true consciousness and survive, or the geth are wiped out,
  or geth and quarians make peace and co-exist on Rannoch'
- Allowing the upload without peace destroys the quarian fleet; Admiral Koris and Tali may die
- Refusing the upload exterminates the geth and hands Rannoch back to the quarians
- Brokered peace requires Legion alive plus loyal, reconciled Tali and Legion, and adds both the Geth
  Fleet and Quarian Fleet as war assets
- Legion or the Geth VI sacrifices itself in every outcome
- The pre-Prothean species harvested to create the Rannoch Reaper is symbolically avenged
