event_id: geth-heretic-schism
title: 'The Geth Schism: Sovereign and the Heretics'
game: Mass Effect
chronological_order: 350
date: approx. 2180 CE
summary: Roughly three centuries after the Morning War, the Reaper Nazara - known to organics as Sovereign
  - made contact with the geth. It offered them advanced technology to help build their long-term goal,
  a 'megastructure' mainframe able to run every geth program at once, in exchange for their help seizing
  the Citadel and opening the way for the Reaper invasion. The geth consensus debated the offer and the
  large majority rejected it, judging it better to reach their goal with their own technology than to
  depend on another race, and discarding what they called the 'superstitious title' of Reapers in favour
  of calling them the Old Machines. A small minority, perhaps five percent, accepted. These geth were
  permitted to leave the main consensus peacefully; the mainstream geth respected the decision rather
  than condemning it as wrong. The departing faction, thereafter called the heretics, came to revere Nazara
  as a god and its turian agent Saren Arterius as its prophet. The heretics supplied the geth armies Saren
  used at Eden Prime, across the Attican Traverse, and at the Battle of the Citadel, giving the wider
  galaxy its first sight of the geth beyond the Veil in three hundred years and the false impression that
  all geth served the Reapers. After Shepard destroyed Sovereign and broke the heretics at the Citadel,
  the true geth became interested in the Commander and commissioned a single mobile platform, later named
  Legion, to operate outside the Veil and make contact.
characters:
- Sovereign
- Saren Arterius
- geth
- Legion
consequences:
- The geth split into the mainstream consensus (the 'true geth') and the Reaper-worshipping heretics
- The heretics leave the consensus peacefully and place themselves under Saren Arterius and Sovereign
- Heretic geth become the shock troops for the attack on Eden Prime and the Battle of the Citadel
- The galaxy wrongly concludes that the entire geth race serves the Reapers
- After Sovereign's destruction the true geth build the platform Legion to seek out Shepard
- The heretics later develop a Reaper virus to forcibly convert the mainstream geth, setting up Legion's
  loyalty mission
