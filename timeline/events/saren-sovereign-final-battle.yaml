event_id: saren-sovereign-final-battle
title: "Citadel Tower: Final Confrontation with Saren and Sovereign"
game: Mass Effect
chronological_order: 800
date: "2183 CE"
summary: |
  Following Shepard's unprecedented arrival at the Citadel via the Conduit, Commander Shepard tracked the rogue Spectre Saren Arterius to the Citadel Tower, the seat of the Citadel Council and the station's most iconic monument. The Tower rose parallel to the Wards and housed the Council Chambers, filled with ancient gardens, fountains, and Prothean stonework—a testament to thousands of years of galactic history.

  Shepard's confrontation with Saren took place in the Council's audience chamber, deep within the Tower. Saren, who had become increasingly indoctrinated by the Reaper Sovereign, was no longer entirely his own being—his body was a hybrid of organic physiology and Reaper technology, implanted with control cybernetics after the Virmire encounter shook his loyalty. During the confrontation Saren offered Shepard the chance to join the Reapers and "experience a true rebirth."

  Depending on Shepard's approach—whether by force or by persuading the remaining part of Saren to resist Sovereign—Saren either died in a battle to the death or took his own life to escape Sovereign's control. In all cases his body fell through the reinforced glass of the audience chamber. Sovereign, which had attached itself to the Citadel Tower to open the Citadel relay to dark space manually and usher in the Reaper invasion, then reanimated Saren's corpse into a husk-like avatar and forced the turian to fight one last time. When this second avatar was destroyed, Sovereign's shields and defenses failed.

  Outside, the Alliance Fifth Fleet—arriving with the Destiny Ascension's fate already decided by Shepard's earlier order—joined the Citadel Fleet against Sovereign's geth armada. With its avatar dead and its shields down, Sovereign was battered by combined fleet fire, and a killing shot from the Normandy destroyed the Reaper. Debris from the Tower rained down on Shepard's position; Captain David Anderson led a rescue team that pulled Shepard and the surviving squad from the wreckage.

  The destruction of Sovereign—the first confirmed kill of a Reaper—and the death of Saren Arterius represented a major victory. However, Shepard's visions and Vigil's warnings made clear that Sovereign had been merely a vanguard sent to trigger the return of a vast Reaper armada waiting in dark space, and the Council and Alliance largely chose to downplay the threat.

characters:
  - Commander Shepard
  - Saren Arterius
  - Sovereign
  - David Anderson
  - Alliance Fleet
  - Citadel Council
  - Shepard's squad (variable)

consequences:
  - Saren Arterius is killed, ending his threat to the galaxy
  - Sovereign is destroyed, marking the first confirmed kill of a Reaper
  - The Citadel Tower suffers catastrophic structural damage
  - The Reaper warning is confirmed—Sovereign was one of many waiting in dark space
  - Shepard survives near-death in the Tower's collapse
  - Anderson rescues Shepard, strengthening their bond
  - The Alliance and Citadel fleets prove capable of destroying a Reaper-class entity once its shields fail
  - Saren's death and Sovereign's loss break the geth heretics' operations outside the Perseus Veil
  - Turian researchers later reverse-engineer Sovereign's main gun into the Thanix Cannon
  - Cerberus recovers Sovereign fragments, later used as anti-Reaper algorithms for EDI and by Task Force Aurora

