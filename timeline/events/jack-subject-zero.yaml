event_id: jack-subject-zero
title: "Jack: Subject Zero"
game: Mass Effect 2
chronological_order: 1180
date: "2185 CE"
summary: |
  Jack's loyalty mission, available after Horizon and written by Brian Kindregan.
  Once Commander Shepard grants Jack access to Cerberus files aboard the Normandy
  SR-2, Kelly Chambers relays that Jack wants to meet in her "hidey hole" on the
  Engineering Deck. Jack asks Shepard to help her destroy the decommissioned
  Teltin facility on Pragia, in the Dakka system of the Nubian Expanse, where
  Cerberus experimented on her as a child. She intends to plant a large bomb in
  her old cell and watch it detonate from orbit.

  On arrival EDI detects thermal signatures deep inside the complex but none near
  the landing zone. Moving through the facility, Jack recognizes rooms and
  revisits memories: a skylit atrium where she first saw sunlight, a bloodstained
  arena where she was pitted against the other children and drugged for killing or
  shocked for hesitating, a cell block, and the two-way mirror outside her own
  cell where she used to beat on the glass. Security consoles reveal the staff had
  "gone rogue" from the Illusive Man's orders, that all subjects were expendable
  except Jack, that children were exposed to chemicals and freezing temperatures,
  and that the project planned to infiltrate the Alliance's Ascension Project; a
  final log shows Jack killing a distraught doctor during the riot. The team
  fights varren and Blood Pack vorcha and krogan mercenaries, including a Pyro and
  the krogan Kureck, all hired by Aresh.

  In Jack's cell, Shepard meets Aresh, a former test subject who recognized Jack
  and is trying to restart the facility so the suffering "must have been for
  something." Jack draws a pistol. Per `jack_loyalty`: Shepard can use Charm or a
  Paragon interrupt to have Jack spare Aresh, or Intimidate or a Renegade
  interrupt to have her kill him; sparing him gives Jack a revelation about what
  she could have become. On the shuttle back Jack fumbles with the detonator,
  then presses it on Shepard's nod, destroying the facility. Back aboard, if
  Miranda's loyalty mission is complete, Jack confronts Miranda over Cerberus'
  blame; without sufficient Paragon or Renegade standing Shepard must side with
  one of them, costing the other's loyalty and any romance (recoverable later).
characters:
  - Jack
  - Commander Shepard
  - Aresh
  - Kureck
  - Miranda Lawson
  - The Illusive Man
  - Kelly Chambers
  - Joker
  - EDI
consequences:
  - The abandoned Teltin facility on Pragia is destroyed by Jack's bomb
  - Jack's loyalty is secured, unlocking her Biotic Damage (Hyper-amp) upgrade and Warp Ammo
  - Cerberus Intel confirms the Illusive Man had ordered the project shut down before the riot
  - Aresh lives or dies per `jack_loyalty`; if spared, a 2186 news alert reports he died saving a shuttle of children evacuating a Reaper-occupied colony
  - If Miranda's loyalty mission is done, Shepard may have to break with Jack or Miranda, losing loyalty and any romance until repaired
  - Rewards include 750 experience, 30,000 credits and 500 element zero
