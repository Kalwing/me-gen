event_id: feros-thorian-mission
title: "Feros: The Geth Attack and the Thorian"
game: Mass Effect
chronological_order: 730
date: "2183 CE"
summary: >
  Pursuing leads on Saren Arterius, Commander Shepard travelled to Feros, an
  ExoGeni Corporation pilot colony built among vast Prothean ruins in the Theseus
  System. The colony's port settlement, Zhu's Hope, was under sustained geth attack.
  Saren had come to Feros seeking the Thorian, also called Species 37, an ancient
  sentient plant buried beneath the ruins that could dominate minds through its
  spores. ExoGeni had known of the creature for years and had secretly used the
  Zhu's Hope colonists as a control group, letting the Thorian infest them.
  Shepard's team cleared geth from the colony and the ExoGeni headquarters, where
  researcher Dr. Elizabeth Baynham and the ExoGeni VI revealed the Thorian's
  existence and ExoGeni's complicity. Shepard descended beneath Zhu's Hope and
  destroyed the Thorian, freeing the colonists from its control; anti-Thorian gas
  grenades could disable spore-thralled colonists, but heavy-handed use killed many.
  The Thorian expelled a clone of the asari commando Shiala, who had been given to
  it by Matriarch Benezia; Shiala survived if spared and gave Shepard the Cipher, a
  gestalt of Prothean cultural knowledge that let Shepard finally interpret the Eden
  Prime beacon vision. Saren left with what he needed to understand the Cipher
  himself. The fate of Zhu's Hope and of Shiala depended on Shepard's choices and
  carried through the later games.
characters:
  - Commander Shepard
  - Elizabeth Baynham
  - Shiala
  - Saren Arterius
  - The Thorian
  - Ethan Jeong
  - Juliana Baynham
consequences:
  - The Thorian was destroyed and the Zhu's Hope colonists freed from its mind control
  - Shepard obtained the Cipher, gaining a coherent understanding of the Prothean beacon vision
  - ExoGeni's use of colonists as test subjects was exposed
  - "Per player choice: many Zhu's Hope colonists could be killed by anti-Thorian gas, and Shiala could live or die"
  - ExoGeni took the Thorian's remains for later research (surfacing again in Mass Effect 2 and Leviathan)
  - Saren advanced his own decoding of the Conduit clues
