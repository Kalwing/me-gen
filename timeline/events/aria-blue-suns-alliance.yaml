event_id: aria-blue-suns-alliance
title: Aria T'Loak Unites the Blue Suns
game: Mass Effect 3
chronological_order: 1570
date: "2186 CE"
summary: |
  As the second part of Aria T'Loak's campaign to reunite the Terminus mercenary groups, Commander Shepard is tasked with bringing the Blue Suns under Aria's command. The Blue Suns, currently led by human mercenary Darner Vosque, have been using their operational freedom to raid C-Sec weapons shipments, severely hampering Citadel security preparations. Vosque makes a condition of his cooperation clear: he wants turian General Septimus Oraka, who has been aggressively investigating the Blue Suns' theft operations, either eliminated or neutralized. Aria instructs Shepard to find a diplomatic solution rather than simply killing Oraka, reflecting her preference for subtlety. Shepard negotiates with Oraka, who reveals that he is attempting to prepare the Citadel against the coming Reaper assault and needs high-grade weapons to mount an effective defense. Oraka directs Shepard to contact a black market dealer named Kannik, who will trade advanced weaponry in exchange for rare artifacts. Shepard can pursue two paths: obtain the artifacts from Kite's Nest in the Vular system and deliver them to Kannik, allowing Oraka to equip his forces adequately and agree to cease his investigation—a Paragon solution that strengthens the Citadel's defenses while bringing the Blue Suns into Aria's command. Alternatively, Shepard can simply order a hit on Oraka through Aria, killing the general and removing the obstacle—a Renegade solution that accomplishes the objective immediately but removes a capable military officer from Citadel defense and potentially costs the lives of Oraka's subordinates. Regardless of the path chosen, the Blue Suns' several hundred veteran soldiers commit to Aria's forces and the Terminus Fleet War Asset is updated accordingly.
