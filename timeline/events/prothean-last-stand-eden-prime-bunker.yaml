event_id: prothean-last-stand-eden-prime-bunker
title: "The Prothean Last Stand at the Eden Prime Bunker"
game: Mass Effect 3
chronological_order: 10
date: "approx. 48,000 BCE"
summary: >
  During the Reaper extermination of the Protheans, roughly 50,000 years before
  Commander Shepard's era, a fortified bunker complex on the world later called
  Eden Prime served as a refuge where Prothean survivors gathered to enter
  cryogenic stasis, intending to emerge after the Reapers withdrew into dark
  space and rebuild the Prothean Empire. The facility was overseen by Victory, a
  Prothean Virtual Intelligence that appeared as a holographic Prothean and could
  project itself anywhere in the base, keeping the bunker's commander, the
  soldier Javik, apprised of the battle. As Collector ground troops closed in,
  Javik ordered Victory to broadcast the stasis-readiness signal to all lifepods;
  Victory noted that refugees were still en route, and Javik dismissed their loss
  as a necessary sacrifice. Victory then reported that Reaper forces had
  destroyed roughly 300,000 lifepods - about a third of the surviving Protheans -
  and that the northside bulkhead could not be sealed. With the bunker about to
  be overrun, Victory ordered Javik into his stasis pod and triggered a neutron
  bombardment, refusing his request for more time and turning his own words back
  on him: "Their sacrifice will be honored in the coming empire."
  The blast destroyed the attacking Reaper forces but damaged the base's sensors,
  making automatic reawakening impossible; the survivors could only be revived
  manually if a later civilization discovered the facility. Over Javik's
  protests, Victory triaged the bunker's dwindling power, eventually cutting
  power to every stasis pod except Javik's and appointing him the voice of the
  Prothean people before he entered stasis. Every other Prothean in the bunker
  died. Javik slept until Shepard's team unearthed and revived him on Eden Prime
  in 2186, making him the last living Prothean.
characters:
  - Javik
  - Victory
  - Commander Shepard
consequences:
  - Roughly 300,000 Prothean lifepods are destroyed by Reaper forces at the bunker
  - Victory's neutron bombardment destroys the attacking Reaper forces but cripples the base's auto-revival sensors
  - Power is cut to every stasis pod except Javik's; all other Protheans in the bunker die
  - Javik is designated the voice of the Prothean people and sealed in stasis for 50,000 years
  - The intact stasis pod is later found by Cerberus and Shepard on Eden Prime, yielding Javik as the last living Prothean
