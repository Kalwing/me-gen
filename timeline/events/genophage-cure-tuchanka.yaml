event_id: genophage-cure-tuchanka
title: "Priority: Tuchanka - Curing the Genophage"
game: Mass Effect 3
chronological_order: 1600
date: "2186 CE"
summary: |
  To seal the turian-krogan alliance, the Urdnot leader (Wrex or Wreav) demands the
  genophage be cured. Once Mordin Solus or Padok Wiks has stabilised Eve and prepared
  the cure, Shepard leads a joint turian-krogan strike on Tuchanka to disperse it
  through the Shroud, the atmospheric tower above the krogan homeworld. Before the
  operation, Dalatrass Linron privately offers Shepard a deal: the salarians will back
  the war effort if Shepard lets Mordin secretly sabotage the cure, keeping the krogan
  weakened. Shepard can accept, refuse, or tell the krogan leader.

  The krogan convoy drives for the Shroud but is halted when Kalros, the largest known
  thresher maw, is roused in the catacombs beneath an abandoned krogan city and
  destroys a bridge. A Reaper Destroyer guards the Shroud. Eve proposes activating the
  ancient Maw Hammers to summon Kalros against the Reaper while the cure is completed.
  Shepard activates the hammers; Kalros drags the Destroyer down. The Shroud is left
  damaged and unstable, and the cure must be released manually from the top of the
  collapsing tower.

  The outcome is choice-conditional. If Shepard preserved Maelon's data in Mass Effect 2
  (per `mordin_loyalty`) and did not accept the sabotage, Eve survives the procedure
  and the krogan gain a healthy future. If Maelon's data was destroyed, Eve dies of
  complications regardless. If Mordin is alive and the cure is genuine, he insists on
  going up the tower himself and is killed when it detonates, singing as he dies; if
  the cure is sabotaged and Mordin realises, Shepard can shoot him, or he goes up to
  fix it and dies anyway. If Padok Wiks replaced Mordin, Wiks dies in the tower. A
  sabotaged cure can also be carried out with the krogan none the wiser, especially
  under Wreav (per `genophage`: cured, or secretly sabotaged). Whatever happens, the
  Reaper guarding the Shroud is destroyed and the krogan commit forces to the war;
  a genuine cure earns their full strength, while sabotage risks later exposure.
characters:
  - Commander Shepard
  - Mordin Solus
  - Padok Wiks
  - Eve
  - Urdnot Wrex
  - Urdnot Wreav
  - Dalatrass Linron
  - Kalros
  - Adrien Victus
consequences:
  - The Reaper Destroyer guarding the Shroud is dragged down and killed by the thresher maw Kalros
  - "Per `genophage`: the genophage is genuinely cured, or secretly sabotaged by Mordin at the Dalatrass's request"
  - "Per `mordin_loyalty`: Eve survives the cure if Maelon's data was preserved, otherwise she dies of complications"
  - "The salarian scientist (Mordin Solus, or Padok Wiks if Mordin is dead) is usually killed in the collapsing Shroud tower completing the cure; Mordin can instead be shot by Shepard if he insists on fixing a sabotage"
  - The Shroud tower is destroyed
  - The krogan join the war against the Reapers; a true cure yields full krogan support, sabotage risks a later rebellion
  - "Per `krogan_leader`: under Wrex the krogan become steadfast allies; under Wreav they are more belligerent"
  - If cured and Wrex lives, Eve later carries Wrex's children and helps rebuild krogan society
