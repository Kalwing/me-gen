  - General Adrien Victus is elevated to Primarch during combat
  - Menae's bases come under fierce Reaper ground assault
  - Anti-aerospace defenses slow but cannot stop the Reaper attack
  - Victus is convinced to leave the front lines to represent turians diplomatically
  - Turians commit military forces to Earth's defense
  - Turian-krogan alliance is forged with genophage cure agreement
  - Palaven continues to face Reaper assault in Victus's absence
