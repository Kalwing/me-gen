event_id: priority-palaven
title: "Priority: Palaven - Menae Defense and Primarch Succession"
game: Mass Effect 3
chronological_order: 1510
date: "2186 CE"
summary: |
  In 2186, as the Reapers begin their invasion of Palaven and its territories, General
  Adrien Victus leads the turian military defense of Menae, one of two moons orbiting the
  turian homeworld. Menae has been a heavily classified military installation since the
  Krogan Rebellions, when the Turian Hierarchy feared the krogan could weaponize the moons
  by smashing them into Palaven's surface. The moon hosts multiple naval bases and
  infantry installations for survival training, connected by subterranean tunnels with
  powerful mass effect field generators that maintain heat and atmosphere in sealed
  surface patches.

  The Reapers attempt to bombard the moon's bases from orbit, but the turian fleet and
  anti-aerospace defenses mount fierce resistance, slowing the invasion. Unable to achieve
  quick victory through orbital bombardment, the Reapers deploy ground units to assault
  the bases one by one. Each captured base denies the turian fleet critical repair and
  refueling points, slowly grinding down turian military capacity. General Victus commands
  the desperate defense even as Primarch Fedorian is killed when his shuttle is shot down
  while defending Menae, leaving the turian succession protocols to elevate Victus to the
  rank of new Primarch while he remains engaged in combat.

  Commander Shepard arrives at Menae to recruit Victus and convince him to leave the
  front lines to represent the turian military at a critical interspecies war summit. Though
  Victus is initially reluctant to abandon his homeworld and his soldiers, Shepard persuades
  him that diplomatic coordination with the Systems Alliance, the Salarian Third Fleet, and
  the Krogan clans is essential for galactic survival. As the newly promoted Primarch,
  Victus commits turian forces to the defense of Earth and the broader war effort, though
  he first demands that krogan military support be secured to defend Palaven in the turians'
  absence.
characters:
