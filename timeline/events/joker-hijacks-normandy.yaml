event_id: joker-hijacks-normandy
title: "Joker Hijacks the SSV Normandy"
game: Mass Effect
chronological_order: 370
date: "2183 CE"
summary: |
  Flight Lieutenant Jeff "Joker" Moreau, an Alliance Navy helmsman who had
  graduated top of his class despite Vrolik syndrome (brittle bone disease), was
  passed over as pilot of the new prototype frigate SSV Normandy in 2183 because of
  his condition. As recounted in the comic Mass Effect: He Who Laughs Best, Joker
  was flying a shuttle to Arcturus Station carrying the turian General Invectus, a
  co-sponsor of the joint Alliance-turian Normandy project, who needled him about
  the rejection and goaded him over his disability.

  Stung, Joker covertly boarded the Normandy and hijacked the ship, taking it out
  on an unauthorised flight. He ran the full test course flawlessly, evading a
  patrol of Alliance fighters scrambled to intercept him and demonstrating
  complete mastery of the stealth frigate's handling. He was brought back to face
  court-martial for stealing an Alliance warship.

  Invectus, impressed by the display of skill, personally insisted that Joker be
  made the Normandy's pilot, and Captain David Anderson agreed. Instead of a
  court-martial, Joker was installed as the ship's official helmsman - the posting
  he held when the Normandy departed on its shakedown cruise to Eden Prime and for
  the rest of his career alongside Commander Shepard.
characters:
  - Jeff "Joker" Moreau
  - Invectus
  - David Anderson
consequences:
  - Joker steals and single-handedly flies the SSV Normandy through its test course
  - Joker evades an Alliance fighter patrol sent to intercept him
  - General Invectus intervenes on Joker's behalf, sparing him a court-martial
  - Joker is made the official pilot of the SSV Normandy
  - Joker is aboard as helmsman for the Eden Prime shakedown run and Shepard's mission
