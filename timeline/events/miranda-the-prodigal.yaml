event_id: miranda-the-prodigal
title: "Miranda: The Prodigal - Saving Oriana on Illium"
game: Mass Effect 2
chronological_order: 1200
date: "2185 CE"
summary: |
  Miranda Lawson was a genetic construct built from the doubled X-chromosome DNA
  of her father, the businessman Henry Lawson, who was obsessed with founding a
  "genetic dynasty." Dissatisfied with Miranda, Henry used her DNA to engineer a
  second, "more ideal" heiress, Oriana. Miranda rebelled, took the infant Oriana
  and fled after a violent shootout with Henry's guards, placing Oriana with an
  adoptive family and turning to Cerberus for protection. In 2185 Henry, unwilling
  to move against Miranda while she was under the Illusive Man's protection, hired
  Miranda's childhood acquaintance Niket to track Oriana down. Niket located
  Oriana's family on Illium and hired the Eclipse mercenary company, led by
  Captain Enyala, to seize her.

  Miranda's loyalty mission became available after the Horizon mission. Bringing
  Miranda to Illium, Shepard learned from her contact at the Eternity bar that
  Oriana's family was being moved off-world through a cargo terminal. The squad
  fought through large numbers of shielded Eclipse mercenaries, engineers,
  vanguards, gunships and LOKI mechs across the docks. At the terminal Miranda
  discovered that Niket, not a stranger, had betrayed her; he insisted he had
  only meant to reunite a father with his daughter and had not known Henry
  intended to take Oriana by force. Niket was then killed - shot by Enyala to
  silence him, or by Miranda herself, depending on Shepard's dialogue. The squad
  defeated Enyala and her personal guard, and Oriana's family was allowed to
  leave safely, none of them aware of the firefight or of Miranda's existence.

  Completing the mission earned Miranda's loyalty. Shepard could persuade Miranda
  to finally meet Oriana face to face, after which Oriana sent a grateful message.
  If the mission was not completed, Kai Leng mortally wounded Miranda during
  Priority: Horizon in Mass Effect 3.
characters:
  - Miranda Lawson
  - Oriana Lawson
  - Henry Lawson
  - Niket
  - Captain Enyala
  - Commander Shepard
consequences:
  - Henry Lawson's attempt to abduct Oriana through Niket and Eclipse is foiled
  - Niket is killed, either by Enyala or by Miranda
  - Captain Enyala and her Eclipse detachment are defeated on Illium
  - Oriana and her adoptive family relocate safely, unaware of the danger
  - Miranda becomes loyal to Shepard and may reconcile enough to meet Oriana
  - If the mission is skipped, Miranda is left vulnerable and Kai Leng mortally wounds her during Priority: Horizon in Mass Effect 3
