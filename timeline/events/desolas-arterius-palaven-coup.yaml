event_id: desolas-arterius-palaven-coup
title: Desolas Arterius, the Arca Monolith and the Strike on Temple Palaven
game: Mass Effect
chronological_order: 170
date: "2157-2158 CE"
summary: |
  Desolas Arterius was a turian general in the First Contact War and the older brother
  of Saren Arterius. In 2157 he was given a secret assignment to recover an artifact
  from a turian research vessel that had crash-landed on the human colony Shanxi.
  Leading a squad into an abandoned human settlement, he was ambushed by the human
  mercenaries Jack Harper, Ben Hislop and Eva Core; his squad was killed and Desolas
  was captured. The mercenaries used his datapad to find a turian camp, and Harper sent
  a fake message from Desolas to lure the turians into a trap. In the cave hiding the
  artifact, Hislop touched it and was struck by an energy bolt while Harper was
  blinded; Eva was overpowered and Desolas retook command, taking Harper and Eva
  prisoner and sending Hislop's body for study.

  When the Citadel Council ended the war, Desolas returned Eva and Harper to General
  Williams on Arcturus Station, but expressed keen interest in Harper because of his
  exposure to the artifact, the Arca Monolith. Williams stopped him from detaining
  Harper. Desolas later recaptured Harper on Illium, using the Monolith as bait, and
  took him and Eva to the turian homeworld Palaven. There he revealed a plan to use the
  Arca Monolith to convert the turian race into an army of super-soldiers to dominate
  the galaxy, operating from Temple Palaven, which concealed a second Monolith. Harper
  insisted Desolas had misunderstood the Monolith's true purpose and convinced Saren
  that his brother was endangering the turians. When Desolas's converted turians turned
  on him, he became trapped in Temple Palaven, and Saren ordered Palaven Command to
  conduct an orbital strike to prevent a "bioweapon emergency," destroying the Temple,
  the Monoliths and Desolas. Harper's contact with the Arca Monolith and this ordeal
  set him on the path to founding Cerberus as the Illusive Man. The events are drawn
  from the comic Mass Effect: Evolution.
characters:
  - Desolas Arterius
  - Saren Arterius
  - Jack Harper
  - Ben Hislop
  - Eva Core
  - General Williams
consequences:
  - Desolas Arterius killed in the orbital strike on Temple Palaven, ordered by his brother Saren
  - The Arca Monoliths on Palaven are destroyed
  - Desolas's plan to turn the turian race into super-soldiers is foiled
  - Jack Harper, changed by his exposure to the Arca Monolith, moves toward founding Cerberus and becoming the Illusive Man
  - Saren gains a reputation for ruthlessness by acting against his own brother
  - Eva Core remains with Harper
