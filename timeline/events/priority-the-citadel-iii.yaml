event_id: priority-the-citadel-iii
title: "Priority: The Citadel III - The Thessia Lead and Wrex's Reckoning"
game: Mass Effect 3
chronological_order: 1710
date: "2186 CE"
summary: |
  A short mission acquired automatically after Rannoch was liberated from Reaper
  control. The asari Councilor contacted Commander Shepard by vid-comm, saying she
  had information vital to the war that could only be shared in person. Returning to
  the Citadel, Shepard went to the late Donnel Udina's office in the embassies,
  where the Councilor admitted the Asari Republics were losing badly and revealed
  that a Prothean artifact had been hidden for millennia in the Temple of Athame on
  the asari homeworld, Thessia - a lead that might expose the location of the
  Catalyst. The conversation ended the mission and unlocked Priority: Thessia.
  The mission is also the point where a sabotaged genophage cure can catch up with
  Shepard. Per `genophage` and `krogan_leader`: if Shepard let the cure be
  sabotaged and Urdnot Wrex led the krogan, Wrex was waiting at Normandy Dock: Bay
  D24 with an audio recording of Shepard's private deal with Dalatrass Linron.
  Enraged by the betrayal and beyond reason, Wrex attacked Shepard. Two Renegade
  interrupts let Shepard shoot him first; otherwise Commander Bailey and C-Sec
  gunned him down. Killing Wrex cost the Clan Urdnot and krogan mercenary war
  assets, and the killing was afterward covered up, as shown by a later ANN news
  mail. If Urdnot Wreav led the krogan, he never learned of the deception and
  remained oblivious through the end of the war; and if the cure was genuine, the
  confrontation never occurred. The page also documents a DLC rapid-transport
  sequence-break that let players sabotage the cure, still gain salarian support,
  and keep Wrex alive until the final battle for Earth.
characters:
  - Commander Shepard
  - Councilor Tevos
  - Urdnot Wrex
  - Urdnot Wreav
  - Dalatrass Linron
  - Armando-Owen Bailey
consequences:
  - The asari Councilor reveals the hidden Prothean artifact in the Temple of Athame on Thessia
  - Priority: Thessia becomes available
  - "Per `genophage`/`krogan_leader`: if the cure was sabotaged and Wrex leads Clan Urdnot, Wrex confronts Shepard at the docks and is killed (shot by Shepard via Renegade interrupt, or gunned down by C-Sec)"
  - Killing Wrex forfeits the Clan Urdnot and krogan mercenary war assets and is covered up afterward
  - Under Wreav, or with a genuine cure, the confrontation does not happen
