event_id: mass-effect-conviction-james-vega-guards-shepard
title: "Mass Effect: Conviction - James Vega Assigned to Guard the Detained Shepard"
game: Mass Effect 3
chronological_order: 1450
date: "2186 CE"
summary: |
  Days after the destruction of the Bahak system's Alpha Relay, the galaxy is in
  turmoil over Commander Shepard's alleged role in the deaths of over 300,000
  batarians. The Citadel Council publicly denounces Shepard, Alliance Councilor
  Donnel Udina works to deflect blame away from the Systems Alliance, and the
  Batarian Hegemony demands that Shepard be handed over for retribution. Shepard,
  having surrendered to Alliance authority, is confined and awaiting trial on Earth
  while the Normandy SR-2 is impounded and stripped of its Cerberus upgrades.

  On Omega, Alliance marine Lieutenant James Vega is drinking and playing cards in a
  bar, watching a newscast about the uproar over Shepard. Frustrated, he tears the
  screen from the wall and offers the krogan bartender payment for the damage. The
  batarians he had been playing cards with brand him a "Shepard Lover" and attack
  him; Vega fights the whole group off, smashing one man with the torn-out screen
  and crashing through a window with another.

  Admiral David Anderson arrives on Omega with a squad of soldiers and tells Vega he
  is being brought in for additional training. In an aircar on final approach to the
  docked Normandy SR-2, Anderson presses Vega to move past "the incident on Fehl
  Prime" and become the soldier the Alliance expects him to be. Vega, still carrying
  guilt over that mission, demands to be thrown in the brig instead. Anderson reveals
  that Vega will in fact be guarding the brig, and that it holds one very specific
  prisoner: Commander Shepard. The assignment places Vega aboard the Normandy and in
  Shepard's orbit just before the Reapers strike Earth, explaining his presence as a
  squadmate at the start of Mass Effect 3. A single omniscient narration panel in the
  comic assumes Shepard personally destroyed the Bahak relay; players who did not
  complete the Arrival mission may instead be told Alliance marines were responsible.
characters:
  - James Vega
  - Commander Shepard
  - David Anderson
  - Donnel Udina
consequences:
  - James Vega is pulled from active duty and reassigned by Anderson
  - Vega is posted aboard the impounded Normandy SR-2 as guard over the detained Shepard
  - Establishes Vega's link to Shepard and the Normandy immediately before the Reaper invasion of Earth
  - Reinforces that Shepard is confined on Earth awaiting trial for the Bahak incident
  - Shows galactic political fallout from Bahak: Council condemnation, Udina's damage control, batarian demands for retribution
