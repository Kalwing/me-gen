event_id: adjutant-outbreak-omega
title: Adjutant Outbreak on Omega
game: Mass Effect 3
chronological_order: 1380
date: 2186 CE
summary: |
  In 2186, Cerberus maintained a secret colony of experimental creatures called Adjutants at a research facility called Avernus Station beyond the Omega-4 Relay. These husk-like beings were engineered from Reaper technology recovered beyond the relay. The Adjutants broke free from containment and commandeered Cerberus transport ships to escape Avernus Station. A Cerberus convoy ship transporting some of these creatures docked at Omega space station and released dozens of Adjutants that attacked everything in sight, advancing toward the Afterlife Club where Aria T'Loak ruled the station. The Illusive Man revealed to Aria that the outbreak occurred and sent General Oleg Petrovsky and Colonel Raymond Ashe aboard the starship Elbrus to assist in containing the threat. Aria and Petrovsky's forces successfully pushed back the first wave of Adjutants and their controlled ships, but as additional Adjutant-controlled vessels arrived, the situation escalated. Petrovsky took the Elbrus through the Omega-4 Relay to stop the creatures at their source: Avernus Station. However, this operation was later revealed to be part of the Illusive Man's elaborate plan to conquer Omega itself. While Petrovsky and Aria secured Avernus Station, Colonel Ashe initiated a coup on Omega with Cerberus reinforcements, taking control of the station in the power vacuum left by Aria's absence. Aria escaped and rallied Omega's gangs against Cerberus occupation. Petrovsky returned to suppress the rebellion but eventually recognized the futility of defeating Aria on her own turf. He instead threatened to destroy Omega itself using a massive Cerberus fleet unless Aria surrendered and exiled herself. Faced with the impossible choice between losing the station she loved and continuing a hopeless fight, Aria conceded and left, vowing to return one day. Cerberus, under Petrovsky's command, secured control of Omega and the Omega-4 Relay, a major strategic victory in their efforts to control galactic resources and technology.
