event_id: baat-vyrnnus-death
title: "BAaT Biotic Program and the Death of Commander Vyrnnus"
game: Mass Effect
chronological_order: 250
date: "2168 CE"
summary: |
  Biotic Acclimation and Temperance Training (BAaT), pronounced "baht" and nicknamed
  "Brain Camp," was a human biotic training programme established in 2160 and run by
  the Systems Alliance with heavy investment from Conatix Industries. Children who had
  been exposed in utero to element zero during the starship accidents of the 2150s
  were gathered at Gagarin Station ("Jump Zero"), far beyond Pluto, and fitted with
  crude first-generation L2 biotic implants. The L2 implants were dangerous and
  poorly understood: many recipients suffered lasting neurological harm, and Kaidan
  Alenko was left with chronic, sometimes debilitating migraines.
  Training was overseen by Commander Vyrnnus, a turian biotic and mercenary veteran
  of the First Contact War hired as lead instructor, who drove the young trainees with
  brutal, contemptuous discipline.
  In 2168 the teenaged Kaidan Alenko formed a close bond with a fellow student named
  Rahna. During an exceptionally harsh session, Rahna reached for water and Vyrnnus
  broke her arm as punishment. Enraged, Kaidan lashed out with a biotic attack;
  Vyrnnus drew a combat knife, and in the struggle Kaidan killed him, snapping the
  turian's neck.
  In the aftermath the Alliance shut BAaT down and sealed its records to conceal its
  responsibility for the programme's abuses. The students were dispersed, many carrying
  permanent damage from their implants. Rahna, frightened by what Kaidan had done,
  cut off contact with him. Kaidan returned to the Alliance in 2173 on his own terms,
  refusing further biotic instruction. Conatix Industries was discredited by the
  scandal; organised human biotic training later resumed under the Ascension Project
  and the Jon Grissom Academy (founded 2176) using safer L3 implants.
characters:
  - Kaidan Alenko
  - Commander Vyrnnus
  - Rahna
  - Hendel Mitra
consequences:
  - Commander Vyrnnus is killed by Kaidan Alenko
  - BAaT is shut down and its records sealed to hide Alliance culpability
  - BAaT students are dispersed, many left with lifelong damage from L2 implants
  - Rahna becomes estranged from and afraid of Kaidan
  - Conatix Industries is discredited; human biotic training later resumes via the Ascension Project and Jon Grissom Academy with L3 implants
  - Kaidan carries chronic migraines and survivor's guilt into his later Alliance and Normandy service
