event_id: tali-treason-trial-alarei
title: "Tali's Treason Trial and the Alarei Retaking"
game: Mass Effect 2
chronological_order: 1030
date: "2185 CE"
summary: |
  In 2185, Commander Shepard travels to the quarian Migrant Fleet to investigate charges
  of treason leveled against Tali'Zorah vas Neema. Tali is accused of sending operational
  geth components to her father, Admiral Rael'Zorah, which were allegedly used to breach
  a quarian laboratory ship. However, the truth is more complicated: Tali sent only
  non-operational geth parts at her father's request, believing he was experimenting with
  weapons. Her father did not inform her of his true intentions—to discover a viable way
  to hack geth and potentially retake Rannoch. Despite Tali's innocence, her father's
  secret research project spiraled out of control.

  The quarian Admiralty Board treats the trial as a "trial of arms": Tali and Shepard
  must successfully retake the laboratory ship Alarei or face execution. Even if they
  fail, the Admirals promise Tali will be pardoned posthumously. The situation becomes
  more politically charged because the quarian government is deeply divided over whether
  to pursue open war with the geth for Rannoch or to search for new colony worlds. Tali's
  trial becomes a proxy for this larger debate, though the personal cost to Tali is largely
  ignored by the leadership.

  During the assault on the Alarei, Shepard and Tali discover the horrifying truth: Rael'Zorah
  has been killed, apparently by the geth he was experimenting on. Upon retaking the ship,
  Tali faces a critical choice: she can ask Shepard to reveal the evidence of her father's
  research to clear his name, or she can request Shepard withhold the truth to protect his
  legacy. If the evidence is revealed, Tali is pardoned but becomes angry at Shepard,
  learning that the Flotilla is now torn between those demanding immediate war with the geth
  and those seeking peace. If the evidence is hidden, Tali becomes deeply grateful, though
  the Fleet remains unaware of Rael'Zorah's true work until it is eventually discovered
  through geth data recovered by Xen during the Reaper War.
characters:
  - Tali'Zorah vas Neema
  - Admiral Rael'Zorah
  - Commander Shepard
  - The Quarian Admiralty Board
  - Geth forces
  - Xen (Geth)
  - Captain Kar'Danna
  - Admiral Shala'Raan vas Tonbay
  - Admiral Han'Gerrel
  - Admiral Zaal'Koris
  - Admiral Daro'Xen vas Moreh
  - Legion
  - Kal'Reegar
  - Veetor'Nara
consequences:
  - The laboratory ship Alarei is retaken by Shepard and Tali
  - Admiral Rael'Zorah is confirmed dead
  - Tali is acquitted of treason if the mission is completed
  - If evidence is revealed: Tali is pardoned but angry at Shepard; Flotilla becomes aware of the conflict between war and colonization factions
  - If evidence is hidden: Tali remains loyal and grateful; the Flotilla remains unaware of Rael'Zorah's true research
  - The geth research data on the Alarei becomes crucial to understanding geth-quarian dynamics
  - Tali's father's legacy and honor are either exposed or protected, depending on Shepard's choice
  - The quarian fleet's internal political divisions are highlighted
