event_id: n7-msv-strontium-mule
title: "N7: Recovery of the MSV Strontium Mule"
game: Mass Effect 2
chronological_order: 1140
date: "2185 CE"
summary: |
  Following the N7: Archeological Dig Site assignment, Cerberus Command sends Commander
  Shepard the last known coordinates of the freighter MSV Strontium Mule, adrift in the
  Arinlarkan system. The ship had been hijacked by Blue Suns mercenaries and is
  carrying valuable cargo, including sensitive intel; Cerberus asks Shepard to recover
  the cargo and pass the intel back to them, keeping any other valuables and dealing
  with the Blue Suns as Shepard sees fit.

  The Blue Suns force aboard was led by the batarian Captain Vorhess and the human
  Sergeant Boortis, who had taken the ship together. Boortis, greedy and treacherous,
  secretly planned to betray Vorhess: he compiled a list of crew members loyal to the
  captain whom his cohorts intended to kill so they could seize the cargo for
  themselves. When Shepard's squad boarded, Boortis used the attack to dispose of
  Vorhess, planning to ambush the weakened survivor on the bridge. Shepard fought
  through the ship's narrow corridors against Blue Suns Troopers, Legionnaires,
  Heavies, FENRIS mechs, combat drones and command bodyguards. In the engine room the
  squad killed the heavily armored Senior Engineer, the only Blue Suns mercenary
  Shepard ever encountered able to use tech attacks. On the bridge the ambush by
  Boortis and his conspirators failed, and Boortis, Vorhess and all their men were
  killed. Shepard recovered the cargo and the intel and forwarded the data to Cerberus.
characters:
  - Commander Shepard
  - Captain Vorhess
  - Sergeant Boortis
consequences:
  - The Blue Suns crew that hijacked the MSV Strontium Mule, including Captain Vorhess and Sergeant Boortis, is wiped out
  - Boortis's planned mutiny against Vorhess collapses when his bridge ambush fails
  - Shepard recovers the ship's cargo and sensitive intel and passes the data to Cerberus
  - Shepard keeps the salvaged valuables and upgrades found aboard
