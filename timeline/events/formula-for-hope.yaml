event_id: formula-for-hope
title: A Formula for Hope - Batarian Bioweapon Thwarted
game: Mass Effect
chronological_order: 560
date: "2183 CE"
summary: |
  In the lead-up to the Citadel Council peace talks with the batarians, Cerberus operative Miranda Lawson recruits Jacob Taylor, a former Alliance soldier and Systems Alliance biotic, to investigate a batarian terrorist threat on behalf of their mutual friend Major Derek Izunami. Miranda reveals that batarian extremists plan to assassinate Ambassador Jath'Amon during the talks at the Citadel. She provides three investigation leads: Illo Nazario, a turian arms dealer on Tortuga; a reported batarian army gathering on the planet Bekke; and rumors of kidnapped scientists being held on the Ahn'Kedar Orbital Platform. Jacob investigates all three locations while Miranda provides support and intelligence from orbit. On Ahn'Kedar, Jacob discovers that several scientists, including the asari Batha and Dr. Hendricks, have been kidnapped by the batarians and forced to work on a supposed cure for a "blood plague" devastating batarian populations. Jacob joins forces with Nax, a krogan searching for his captured friend Batha, and together they fight through batarian forces to rescue the scientists. The scientists reveal the shocking truth: the "plague" is actually a bioweapon the batarians have engineered and intend to deploy against the Citadel Council. On Bekke, Jacob discovers a massive cache of element zero that the scientists need to complete their vaccine formula. After interrogating the infected Illo Nazario, Jacob learns the terrible truth: the true leader of the batarian extremists is Ambassador Jath'Amon himself, who plans to assassinate the entire Council during the peace talks by infecting them with the bioweapon. Jacob and Miranda rush to the Citadel where Jacob subdues Jath'Amon at the Council chamber, preventing the assassination. Batha completes the vaccine formula in time, and Jacob is inoculated against the bioweapon. The vaccine is then administered to other exposed victims on the Citadel, saving countless lives. The terrorist plot is foiled, the Citadel Council is saved, and peace talks can proceed.
