event_id: bel-anoleis-corruption
title: Bel Anoleis Corruption Investigation
game: Mass Effect
chronological_order: 720
date: "2183 CE"
summary: |
  On Noveria, Commander Shepard encounters Administrator Bel Anoleis, the salarian official in charge of Port Hanshan. Anoleis represents the executive board and oversees local corporations' operations. When Shepard seeks a garage pass to leave Port Hanshan and pursue Matriarch Benezia on Peak 15, Anoleis stonewalls the request, prioritizing investor interests over assisting a Spectre's investigation. He cites bad weather and Peak 15's private status as excuses to refuse Shepard's passage. Gianna Parasini, Anoleis' secretary, directs Shepard to Lorik Qui'in, a turian at the hotel bar, revealing that Anoleis is corrupt. Qui'in explains that Anoleis has seized direct control of laboratory rents and accepted bribes from corporations. To conceal his activities, Anoleis falsely accused Qui'in of corruption and paid security forces to ransack Qui'in's office at Synthetic Insights, where incriminating data is stored. Shepard can recover the evidence and pursue multiple paths: giving it to Qui'in results in Anoleis being pressured to resign; reporting it to Anoleis himself allows him to bribe Shepard; exposing Parasini as an undercover Internal Affairs agent leads to a shootout between Anoleis and Parasini where both die; or convincing Qui'in to testify results in Anoleis' arrest. If Anoleis remains in power after Benezia's death, he attempts to bribe Shepard for information about Peak 15, showing interest in potential profits from the incident. His ultimate fate depends on which path Shepard chooses.
characters:
  - Bel Anoleis
  - Commander Shepard
  - Gianna Parasini
  - Lorik Qui'in
  - Maeko Matsuo
  - Liara T'Soni
  - Saren Arterius
consequences:
  - Anoleis' corruption can be exposed through evidence from Synthetic Insights
  - Multiple outcomes depending on player choice:
    - Anoleis resigns if evidence goes to Qui'in
    - Anoleis bribes Shepard if evidence is reported to him
    - Anoleis and Parasini kill each other if Parasini's cover is blown
    - Anoleis is arrested if Qui'in testifies
  - Qui'in can become Port Hanshan Administrator or enter protective custody
  - Parasini's status as an undercover Internal Affairs agent is revealed
  - If Anoleis survives, he seeks information about Peak 15 for potential profit
