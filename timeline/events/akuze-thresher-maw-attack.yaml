event_id: akuze-thresher-maw-attack
title: Akuze Thresher Maw Massacre
game: Mass Effect 3
chronological_order: 340
date: "2177 CE"
summary: |
  In 2177, an Alliance Marine unit is sent to investigate the settlement at Akuze, a human colony on the outskirts of Systems Alliance space, after all contact is lost with the pioneer team. The unit arrives to find the settlement intact but completely abandoned—no survivors are found. When the unit establishes camp for the night, they are attacked by subterranean thresher maws, creatures the Alliance has never encountered before. The unit is nearly completely slaughtered in the attack, with fifty marines killed and only one known survivor reaching the landing zone alive. If Commander Shepard is that sole survivor, Shepard is permanently marked by the trauma. Years later, Corporal Toombs is discovered to have also survived the attack. Toombs reveals a shocking truth: the massacre was not an accident. According to Toombs' testimony, the renegade black ops group Cerberus deliberately set the thresher maws on the marines as part of an experiment to study the creatures and observe how the unit responded to an unknown threat. Toombs was captured by Cerberus after the attack and subjected to horrific ordeals including being injected with thresher maw acid as part of their research. The revelation that Cerberus orchestrated the massacre haunts Shepard throughout the trilogy, becoming a symbol of Cerberus's willingness to sacrifice human lives for their research agenda.
characters:
  - Commander Shepard
  - Corporal Toombs
  - Eddie Lang
  - Alliance Marines
  - Admiral Steven Hackett
consequences:
  - Fifty Alliance marines are killed in the attack
  - Corporal Toombs survives but is captured by Cerberus for experimentation
  - Only one to two marines reach safety
  - A monument is erected at Akuze memorializing the fallen marines
  - Cerberus's involvement in the massacre is confirmed in recorded evidence
  - The attack establishes Cerberus's willingness to sacrifice human lives for research
  - Admiral Hackett plans a memorial ceremony to clear thresher maws from the site
