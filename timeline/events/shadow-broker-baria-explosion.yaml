event_id: shadow-broker-baria-explosion
title: "Baria Frontiers Office Bombing - Shadow Broker Assassination Attempt"
game: Mass Effect 2
chronological_order: 1230
date: "2185 CE"
summary: |
  On Illium, Liara T'Soni has been secretly investigating the Shadow Broker and working to rescue her former drell partner Feron. When Commander Shepard delivers Cerberus intelligence containing clues to the Shadow Broker's location, Liara becomes convinced they can finally track him down. However, unknown to Shepard and Liara, the asari Spectre Tela Vasir—a trusted Council representative publicly known for investigating the 2185 theft of Citadel economic data and breaking a slave ring on Nasurn—is actually a Shadow Broker operative tasked with eliminating Liara.

  Vasir attempts to assassinate Liara in her apartment using sniper fire, but Liara's kinetic barriers protect her. Afterward, Shepard and Vasir investigate the crime scene together, Vasir using her Spectre authority to wave off local police. Liara leaves behind a backup disk containing coordinates to meet her contact, a salarian named Sekat, at the Baria Frontiers office in the Dracon Trade Center. When Shepard and Vasir arrive at the location, three floors of the building are obliterated by a massive explosion—a deliberate attempt by the Shadow Broker to prevent Liara from obtaining critical information from Sekat.

  Despite the destruction, Liara survives and infiltrates the damaged building from within. Shepard fights through the devastated interior against Shadow Broker operatives while Vasir claims she will cover the building from her skycar. In the Baria Frontiers office itself, Shepard finds Sekat dead, killed by a Shadow Broker agent. Liara emerges and reveals the truth: Vasir is the Shadow Broker's agent, responsible for the assassination attempt and the building bombing, and murdered Sekat to seize his intel. Exposed, Vasir shatters a window, hurls the glass at the squad, and falls out with Shepard before commandeering a skycar. A high-speed aerial chase ensues across Illium's skyways, ending when Vasir collides with another car and crashes on the roof of the Hotel Azure. Though grievously wounded, Vasir takes a hostage but is ultimately defeated in a long, punishing fight and dies, insisting to the end that she was nothing like Saren and that Shepard's partnership with Cerberus was no better than hers with the Broker.

  The explosion destroys the Baria Frontiers office and kills numerous innocents, but Liara recovers Sekat's data disk, advancing her investigation toward the Shadow Broker's lair.
