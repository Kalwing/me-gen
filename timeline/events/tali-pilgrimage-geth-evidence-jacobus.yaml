event_id: tali-pilgrimage-geth-evidence-jacobus
title: "Tali's Pilgrimage and the Hunt by Jacobus"
game: Mass Effect
chronological_order: 410
date: "2183 CE"
summary: |
  As told in Mass Effect: Homeworlds, the young quarian Tali'Zorah nar Rayya set
  out on her Pilgrimage in 2183 aboard the vessel Honorata, crewed by her friend
  Keenah'Breizh. Investigating the growing geth presence, the pair landed on an ice
  planet in the Crescent Nebula where geth were excavating Prothean artifacts on
  behalf of Saren Arterius. There Tali recovered a data core containing a recording
  of a geth transmitting to Saren - proof that the rogue Spectre was commanding the
  geth - along with references to Sovereign and the Conduit.

  Commander Jacobus, a turian mercenary in Saren's service, had been tasked with
  securing the site. Knowing Saren would kill him and his team for failure, Jacobus
  pursued the quarians relentlessly. He tracked them to Illium, where his men
  ambushed and killed the crew of the Honorata, then chased Tali and Keenah to the
  Citadel, wounding both. He cornered them in a maintenance incinerator where
  Keenah had already died of his wounds. Tali sprang a trap, sealed Jacobus inside
  the incinerator and activated it, killing him.

  Injured and alone, Tali limped into a clinic on the Citadel calling for help,
  carrying the evidence against Saren. She subsequently sought a buyer for the data
  through the underworld fixer Fist, which drew the attention of both Saren's
  agents and the Shadow Broker and set up her rescue by Commander Shepard during
  the hunt to expose Saren.
characters:
  - Tali'Zorah nar Rayya
  - Keenah'Breizh
  - Jacobus
  - Saren Arterius
  - Commander Shepard
consequences:
  - Tali obtains a recording proving Saren commands the geth, plus mentions of Sovereign and the Conduit
  - The crew of the Honorata is killed by Jacobus's mercenaries on Illium
  - Keenah'Breizh dies of his wounds on the Citadel
  - Tali kills Jacobus by trapping him in an incinerator
  - Tali reaches the Citadel wounded and seeks a buyer for the data through Fist
  - The evidence enables Shepard to expose Saren before the Citadel Council
