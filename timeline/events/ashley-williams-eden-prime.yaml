event_id: ashley-williams-eden-prime
title: Ashley Williams on Eden Prime
game: Mass Effect
chronological_order: 400
date: 2183 CE
summary: "Gunnery Chief Ashley Madeline Williams was stationed on Eden Prime as part\
  \ of the 2nd Frontier Division's 212 Company, commanding a unit guarding a newly\
  \ discovered Prothean Beacon excavation site. Born on April 14, 2158 on the colony\
  \ world Sirona into a long line of Alliance military officers, Williams had enlisted\
  \ after high school and repeatedly earned strong performance reviews despite being\
  \ repeatedly denied advancement and shipboard postings. Her career stall was caused\
  \ by prejudice against the \"Williams curse\"\u2014her grandfather, General Williams,\
  \ had surrendered the Shanxi garrison to turians during the First Contact War, becoming\
  \ the first human to surrender to an alien force.\n\nWhen Commander Shepard's team\
  \ arrived on Eden Prime, they encountered massive geth forces led by the rogue Spectre\
  \ Saren Arterius, who was seeking the Prothean Beacon. Ashley's unit, the 212 Company,\
  \ was virtually wiped out in the surprise attack. As the sole survivor of her unit,\
  \ Ashley demonstrated exceptional combat effectiveness and tactical acumen, engaging\
  \ geth forces while protecting the beacon site. After the initial assault was repelled,\
  \ Captain David Anderson personally transferred Ashley from her doomed posting to\
  \ join Commander Shepard's squad aboard the newly commissioned SSV Normandy.\n\n\
  This posting represented a major turning point in Ashley's military career. Despite\
  \ her previous lack of opportunity for advancement, her performance on Eden Prime\
  \ earned her a place on humanity's most advanced warship. On the Normandy, Ashley\
  \ served as Gunnery Chief under Shepard's command, beginning a close working relationship\
  \ with the Commander that would span the entire war against the Reapers. Her time\
  \ on Eden Prime established the foundation of her character: tough, blunt, and deeply\
  \ loyal to her unit and to Shepard, though also wary of aliens and Citadel politics.\n"
characters:
- Gunnery Chief Ashley Williams
- Commander Shepard
- Captain David Anderson
- Saren Arterius
- Geth forces
- Alliance 2nd Frontier Division 212 Company
consequences:
- Ashley Williams becomes sole survivor of 2nd Frontier Division 212 Company
- Ashley transferred to SSV Normandy under Commander Shepard's command
- Ashley recruited as Shepard's squad member and gunnery chief
- Eden Prime colony secured but with heavy Alliance casualties
- Prothean Beacon recovered by Shepard's team
- Beginning of Ashley's close relationship with Commander Shepard
