event_id: battle-of-virmire
title: Battle of Virmire
game: Mass Effect
chronological_order: 630
date: "2183 CE"
summary: >
  Captain Kirrahe's 3rd Infiltration Regiment of the salarian Special Tasks Group
  tracked the rogue Spectre Saren Arterius to the tropical world of Virmire and
  discovered a heavily defended base where Saren was breeding a krogan army. Saren
  had developed a working genophage cure (possibly aided by Binary Helix or the
  Reaper Sovereign) and was using it, along with cloning, to grow shock troops
  loyal to him. Kirrahe's request to the Council for a fleet was garbled by
  communications interference, so only the SSV Normandy and Commander Shepard's
  team responded. Kirrahe, whose STG unit had taken losses and could not assault
  the base alone, devised a plan to improvise a nuclear bomb from the Normandy's
  drive core and detonate it against the facility. He led a diversionary frontal
  assault with three teams of officers - codenamed Aegohr, Mannovai and Jaeto -
  while Shepard's squad infiltrated the base, disabled its anti-air tower, and
  planted the bomb. Before the attack Kirrahe delivered his "Hold the Line" speech
  to steady his men. If Shepard detached squadmates to reinforce him (Shadow Team)
  and cleared the supporting objectives, Kirrahe survived Virmire and later
  reappeared as a Major on Sur'Kesh in 2186 (per `kirrahe_virmire`); without that
  support he was killed by geth air support partway through the operation.
  Inside the base Shepard found the indoctrinated asari researcher Rana Thanoptis,
  interrogated a captured recording of Saren, and confronted Saren himself, who
  argued that submitting to the Reapers was the only way for organics to survive;
  Shepard could resist his attempt at indoctrination. If Urdnot Wrex was in the
  squad, destroying the base - and with it the only known genophage cure - drove
  him to a furious standoff on the beach that Shepard had to defuse through
  Charm/Intimidate or by having recovered the Williams family's history; if it
  could not be defused, or if Ashley shot him, Wrex died (per `wrex_virmire`).
  The bomb detonated, obliterating Saren's cloning facility, his krogan army and
  the lost cure. A separate consequence of the mission - the death of Ashley
  Williams or Kaidan Alenko, one of whom stayed behind to hold the detonation
  point - is recorded in its own event.
characters:
  - Commander Shepard
  - Kirrahe
  - Saren Arterius
  - Urdnot Wrex
  - Ashley Williams
  - Kaidan Alenko
  - Rana Thanoptis
consequences:
  - Saren's krogan cloning and breeding facility on Virmire was destroyed by an improvised nuclear bomb
  - Saren's genophage cure was lost, its exact nature never recovered
  - Saren personally confronted Shepard and attempted indoctrination, deepening the hunt for him
  - Per `kirrahe_virmire`, Kirrahe and elements of his STG unit survive if reinforced, and Kirrahe returns in Mass Effect 3; otherwise he is killed
  - Per `wrex_virmire`, Wrex survives if the beach standoff is defused, otherwise he is shot and killed
  - Rana Thanoptis was found indoctrinated and released or killed, later resurfacing on Sur'Kesh
  - The Council deployed its fleet to relays across the galaxy in the aftermath, and the squadmate death on Virmire (see the Virmire survivor choice) shaped the rest of the trilogy
