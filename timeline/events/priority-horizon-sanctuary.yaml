event_id: priority-horizon-sanctuary
title: "Priority: Horizon - Sanctuary Exposed"
game: Mass Effect 3
chronological_order: 1730
date: "2186 CE"
summary: |
  Sanctuary was a walled refugee haven advertised on the human colony world of
  Horizon during the Reaper War, promising safety to civilians fleeing the
  invasion. In truth it was a Cerberus facility run by Henry Lawson, father of
  Miranda and Oriana Lawson, who had renewed his backing of Cerberus after
  Miranda's defection (or her death on the Collector Base). Lawson used the
  incoming refugees as test subjects, converting them into husks and studying
  Reaper indoctrination in an effort to reproduce and control the Reapers' husk-
  control signal. He succeeded in copying the husk-control signal but concluded
  that applying it to the Reapers themselves would be far harder. He also tracked
  down Oriana and brought her to Sanctuary.

  Shepard came to Horizon following the trail of Cerberus assassin Kai Leng and
  intelligence from earlier missions. The Reapers had already detected Lawson's
  work - he had underestimated the strength of their signal - and assaulted
  Sanctuary as Shepard arrived, overrunning the complex with husks, Cerberus
  troops and Reaper forces. Moving through the facility Shepard uncovered
  recordings and logs, learned that Miranda (if alive) had come to find Oriana,
  and that the Illusive Man had sent Kai Leng to extract Lawson's indoctrination
  research. Kai Leng seized the data and abandoned Lawson to the Reapers.

  Cornered in his laboratories, Henry Lawson grabbed Oriana as a human shield and
  tried to bargain, boasting he would be "seen as the savior of the human race."
  The resolution was choice-conditional. If Miranda was alive, she biotically
  hurled Henry through the shattered observation window to his death regardless
  of Shepard's wishes; if her relationship with Shepard was poor she could be
  shot in the stomach by Henry as he fell and die shortly after. If Miranda was
  dead or absent, Shepard could shoot Henry, shoot Oriana, or let Henry go in
  exchange for Oriana; failing a successful resolution, Oriana pulled them both
  through the cracked glass to their mutual deaths. Either way Kai Leng escaped
  with the Sanctuary research, and the atrocity confirmed the depth of Cerberus's
  collaboration with Reaper technology.
characters:
  - Commander Shepard
  - Henry Lawson
  - Miranda Lawson
  - Oriana Lawson
  - Kai Leng
  - The Illusive Man
consequences:
  - Cerberus's Sanctuary husk-conversion and indoctrination facility on Horizon is exposed and destroyed by a Reaper assault
  - Kai Leng escapes with Henry Lawson's copied husk-control-signal research for the Illusive Man
  - Henry Lawson dies - thrown through the window by Miranda if she is alive, otherwise killed or dragged out by Oriana depending on Shepard's choices
  - Miranda may be mortally wounded by Henry if she is alive and estranged from Shepard
  - Oriana is rescued and reunited with Miranda if Miranda survives
  - Shepard gains the Sanctuary refugees as a war asset and further intelligence on Cerberus and the Illusive Man
