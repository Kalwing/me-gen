consequences:
  - >
    Most of the galactic assault force on Earth is killed or maimed; the conduit's
    light beam carries thousands of casualties toward the Citadel.
  - >
    Harbinger's personal defense of the conduit results in massive casualties among
    the allied ground forces.
  - >
    Commander Shepard reaches the Citadel and gains access to the Crucible control
    mechanisms and the Catalyst.
  - >
    Admiral David Anderson reaches the Citadel (severely wounded) and assists Shepard
    in reaching the Crucible.
  - >
    Per the final choice (Destroy/Control/Synthesis/Refusal):
      - Destroy: All Reapers are destroyed along with the entire geth species and EDI;
        synthetic life is eradicated; the cycle of extinction theoretically ends.
      - Control: Shepard's consciousness is uploaded into and merges with the Reaper
        collective, giving Shepard godlike power but ultimately disembodying them; the
        Reapers are brought under Shepard's control.
      - Synthesis: Shepard's genetic code is merged with all organic and synthetic life
        in the galaxy, creating a new form of hybrid existence; the Reapers are
        transformed into custodians of this new synthesis.
      - Refusal: The Catalyst and Reapers are allowed to proceed with the cycle; the
        Crucible fails and the Reapers continue the harvest; galactic extinction
        continues indefinitely.
  - Shepard's ultimate fate is determined by the choice made and the Crucible's firing.
  - >
    If Destroy or Control are chosen and sufficient War Assets are gathered, Shepard
    survives (though potentially as a Reaper in Control ending or as a hybrid in
    Synthesis); otherwise Shepard dies in the Crucible's activation.
  - >
    Depending on the ending, Anderson either survives (on the Citadel) or dies from
    wounds sustained during the assault.
  - >
    The galaxy's future is fundamentally altered: either the Reapers are destroyed
    (ending the cycle), controlled by Shepard, synthetically merged with organics, or
    allowed to continue their harvest.
  - >
    If Destroy is chosen, the geth and EDI are killed along with the Reapers; if
    Control or Synthesis is chosen, they survive and are transformed.
  - >
    Per the Extended Cut: epilogue scenes show Admiral Hackett ordering the fleets
    to evacuate Earth's orbit, the Normandy caught in the energy wave in transit and
    crash-landing on a garden world, the Charon Relay's core breaking up while the
    relay itself survives and the mass relay network is later repaired, and a Liara
    time-capsule message. A fourth outcome, Refusal (declining to activate the
    Crucible or shooting the Catalyst), dooms the current cycle to the Reaper harvest
    but leaves records that let a later cycle break the pattern, shown in an alternate
    Stargazer scene. Shepard's name is added to the Normandy memorial wall beside
    Anderson's unless a high-strength Destroy leaves Shepard's survival ambiguous.
