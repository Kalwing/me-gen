event_id: london-conduit-assault
title: 'Priority: Earth - London Conduit Assault and Path to the Citadel'
game: Mass Effect 3
chronological_order: 1900
date: '2186 CE'
summary: >
  In the climactic endgame of Mass Effect 3, as Reaper forces ravaged Earth and
  the Crucible—an ancient superweapon built by the Protheans—required activation
  at the Citadel, Commander Shepard and Admiral David Anderson led a massive
  galactic assault on London, England. The Reapers had constructed a towering
  conduit—a massive structure built from organic and metallic components—in the
  war-torn city. This conduit, built according to mass relay principles but
  modified by Reaper technology, served as a direct transport mechanism connecting
  the ground of Earth to the Citadel, which had been mysteriously repositioned above
  the planet.

  The conduit functioned unlike standard mass relays: it emitted a constant,
  brilliant beam of blue light into the sky, continuously transporting matter
  (primarily the dead and dismembered remains of slaughtered populations) directly
  from Earth's surface to the Citadel. The structure had no visible element zero
  core and, critically, allowed living organic matter to survive transit—arriving
  at ballistic but survivable speeds—rather than disintegrating as with conventional
  relays. The Reapers appeared to have multiple destination termini on the Citadel,
  as different individuals arrived at separate points on the station.

  The assault ran in two ground stages. First Shepard's shuttle landed to
  knock out a Reaper anti-aircraft "Hades Cannon" with M-920 Cain rounds so
  the Hammer ground force could land; the team then regrouped at a Forward
  Operating Base where Shepard held final words with surviving allies before
  Anderson gave the battle plan. The second stage pushed through occupied
  London to a missile battery, where Thanix missiles coordinated with EDI on
  the Normandy destroyed a Reaper Destroyer blocking the road to the conduit.
  Anderson then arrived by APC for the final charge.
  The galactic assault on the conduit was devastating. Allied forces from across
  the galaxy—humans, turians, asari, salarians, quarians, krogan, and others—
  launched a coordinated ground assault to penetrate the structure and secure access
  to the Citadel. However, Harbinger, the Reaper flagship and commander of the
  local Reaper forces, personally defended the conduit with overwhelming firepower,
  killing or maiming most of the allied assault force. The majority of the
  attacking soldiers were annihilated, their bodies adding to the biomass flowing
  through the conduit itself.

  Despite the horrific casualties, Commander Shepard and Admiral Anderson managed
  to fight their way through the structure and reached its heart. Anderson, wounded
  but resolute, helped push Shepard toward the conduit's exit point. Shepard
  survived the ascent through the conduit and materialized on the Citadel, while
  Anderson arrived at a slightly different point on the station. Upon reaching the
  Citadel, Shepard gained access to the Crucible's control mechanisms and the
  Catalyst—the artificial intelligence that had guided the Reaper cycle for countless
  eons. At this critical juncture, Shepard was confronted with a series of final
  choices that would determine the fate of the galaxy: to Destroy all synthetic life
  (eliminating the Reapers and the geth but also killing EDI), to Control the Reapers
  (uploading Shepard's consciousness to command them), to achieve Synthesis (merging
  organic and synthetic life), or to Refuse the Catalyst's offer (allowing the cycle
  to continue unchanged). The consequences of this choice—affecting the survival of
  the geth, EDI, the Reapers themselves, and organic civilization—would echo across
  the galaxy for generations.
