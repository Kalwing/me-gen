event_id: tuchanka-turian-platoon
title: "Tuchanka: Turian Platoon"
game: Mass Effect 3
chronological_order: 1550
date: "2186 CE"
summary: |
  Immediately after Priority: Sur'Kesh, Primarch Adrien Victus quietly tells Commander
  Shepard, out of earshot of the nearby Urdnot leader, that a turian ship on a
  classified mission has crashed on Tuchanka and asks for help rescuing its stranded
  platoon. The matter is an extremely delicate political one and Victus will not
  explain further. The mission stays available until Priority: Thessia, after which it
  is considered failed.

  Shepard's squad lands at the Downed Vessel site in the Krogan DMZ and makes contact
  with Lieutenant Tarquin Victus, the Primarch's son and commander of the 9th Platoon,
  who is under Reaper attack and marks his position with a flare. The squad fights
  through rubble-choked terrain against Husks, Cannibals, Marauders, a Brute and
  repeated Harvester strafing runs, working past several crashed turian escape pods and
  driving off Harvesters before they can destroy the pods. The final battle in an open
  area pits the squad against waves of Cannibals and Marauders, a Brute, and a
  Harvester as the boss; a Reaper Blackstar heavy weapon can be found nearby to help
  bring it down. If Garrus is brought along, he suspects from turian custom that
  Tarquin was promoted by his father without merit, a dangerous and frowned-upon act.

  Afterward Shepard speaks with a demoralised Tarquin and his surviving troops,
  choosing an empathetic or demanding tone for morality points, and receives the
  timed follow-up mission Tuchanka: Bomb. In the War Room Shepard debriefs with Admiral
  Hackett and speaks again with Primarch Victus. Depending on mission order, Garrus and
  Liara can be found reminiscing in the Port Observation Lounge with Garrus voicing
  concern over the Victus situation, or Tali can be found in Engineering discussing with
  EDI whether Tarquin's morale suffers from living in the shadow of a famous parent.
characters:
  - Commander Shepard
  - Adrien Victus
  - Tarquin Victus
  - Admiral Hackett
  - Garrus Vakarian
  - Liara T'Soni
  - Tali'Zorah
  - EDI
consequences:
  - The survivors of the turian 9th Platoon are rescued from Tuchanka
  - Shepard learns the crashed turian ship was on a secret mission tied to the Kelphic Valley
  - The timed mission Tuchanka: Bomb is unlocked
  - The classified nature of the operation is kept hidden from the Urdnot leader for the time being
  - If not completed before Priority: Thessia, the platoon and the mission are lost
