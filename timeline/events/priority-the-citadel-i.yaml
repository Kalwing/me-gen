event_id: priority-the-citadel-i
title: "Priority: The Citadel I - Appealing to the Council"
game: Mass Effect 3
chronological_order: 1490
date: "2186 CE"
summary: |
  Immediately after recovering the Prothean Crucible plans on Mars, Commander
  Shepard brought the Normandy SR-2 to the Citadel to brief the Council on the
  Reaper invasion and to request that Citadel forces be committed to the relief of
  Earth. The critically wounded Virmire survivor - Ashley Williams or Kaidan Alenko,
  gravely injured by the Cerberus infiltrator Eva Core on Mars - was rushed to
  Huerta Memorial Hospital. The newly promoted Commander Armando-Owen Bailey met
  Shepard at the docks and directed the Commander to Councilor Donnel Udina's
  office in the embassies.
  In the Council Chambers, Liara T'Soni was already presenting her analysis of the
  Crucible. The turian, asari and salarian councilors were skeptical of an untested
  Prothean superweapon and, with their own homeworlds now under Reaper attack,
  refused to divert military aid to Earth. Afterward the Turian Councilor reported
  that the Hierarchy had lost contact with Primarch Fedorian, who had been about to
  convene a war summit, and asked Shepard to extract him from Palaven's moon Menae.
  Shepard's Spectre status, suspended since defecting toward Cerberus in 2185, was
  formally reinstated by Admiral Hackett under Emergency War Powers regulations,
  granting the Commander diplomatic authority to negotiate treaties with the other
  Council races.
  On the station Shepard could choose a Normandy physician - retaining Dr. Karin
  Chakwas if she survived the Collector Base or else recruiting Dr. Chloe Michel -
  recruit war correspondent Diana Allers to broadcast from the ship, and spar with
  reporter Khalisah al-Jilani. Returning to the Normandy, Shepard experienced the
  first of the recurring nightmares, chasing the burning boy from Earth through a
  dead forest. New comm specialist Samantha Traynor introduced the Alliance-refit
  Normandy and its war room, where Hackett waited to debrief the Commander before
  the galaxy map opened for Palaven.
characters:
  - Commander Shepard
  - Donnel Udina
  - Liara T'Soni
  - Armando-Owen Bailey
  - Councilor Tevos
  - Councilor Sparatus
  - Admiral Hackett
  - Samantha Traynor
  - Diana Allers
  - Karin Chakwas
  - Ashley Williams
  - Kaidan Alenko
consequences:
  - The Citadel Council refuses to send forces to Earth, doubting the Crucible
  - Shepard is tasked with rescuing Primarch Fedorian to enable the turian war summit
  - Shepard's Spectre status is reinstated with authority to broker inter-species treaties
  - The wounded Virmire survivor is hospitalised at Huerta Memorial
  - Samantha Traynor joins as comm specialist; Diana Allers can embed aboard the Normandy
  - Shepard's Reaper-nightmare dream sequences begin
  - Priority: Palaven becomes available
