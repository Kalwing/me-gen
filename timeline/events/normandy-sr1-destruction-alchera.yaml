event_id: normandy-sr1-destruction-alchera
title: "Destruction of the SSV Normandy SR-1 Over Alchera"
game: Mass Effect
chronological_order: 820
date: "2183 CE"
summary: |
  Following the Battle of the Citadel and the defeat of Sovereign, the Council dispatched Commander Shepard and the SSV Normandy SR-1 to hunt down remaining geth forces. The patrol took the frigate into the Amada System of the Omega Nebula near the planet Alchera. Joker piloted the stealth frigate with the ship's advanced cloaking systems engaged, making the Normandy virtually undetectable.

  An unidentified starship suddenly appeared on the Normandy's trajectory and moved to intercept the frigate despite its active stealth systems. Joker immediately recognized the hostile threat and initiated evasive maneuvers. However, the pursuing vessel was far more powerful than the sleek Alliance frigate. The attacking ship unleashed a devastating barrage of beam weaponry with technological sophistication far beyond Citadel standards.

  The Normandy's kinetic barrier shielding and weapons systems were knocked offline by the first volley. Within seconds, the ship was crippled as successive beam strikes breached the upper decks and destroyed one of the starboard engine nacelles. The attack killed over twenty crew members, including Navigator Charles Pressly, who had evolved from distrust of the Normandy's alien crew to a deep commitment to serve alongside them. Shepard gave the order to abandon ship, and the surviving crew evacuated via emergency escape pods.

  Shepard remained behind to rescue Joker, who refused to leave and was still desperately attempting to pilot the disintegrating vessel. The Commander moved forward through burning, hull-breached corridors, convinced Joker to abandon ship, and got him into the last escape pod. Before Shepard could climb in, the attacking vessel made a final devastating pass; the blast threw Shepard clear, forcing the Commander to eject the pod with only Joker aboard. A last strike completely destroyed the Normandy, which broke apart above the frozen surface of Alchera. Shepard was knocked into space, hardsuit punctured and leaking air, lost consciousness, and drifted toward the planet.

  Shepard's body was never retrieved initially, and the Commander was presumed killed in action. Two years later, during the Reaper War, the Alliance would locate the Normandy's crash site on Alchera and ask Shepard—by then resurrected through the Lazarus Project—to return and recover the remains of the twenty missing crew members and place a memorial to honor those lost.

  The destruction of the Normandy SR-1 marked one of humanity's darkest hours in the early Reaper conflict and demonstrated the existence of a threat far more advanced than the geth—the Collectors, an ancient species enslaved by the Reapers to harvest organic life for use in their cycle of extinction.
