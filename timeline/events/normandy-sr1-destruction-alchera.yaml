consequences:
  - The SSV Normandy SR-1, the Systems Alliance's most advanced starship, is completely destroyed
  - Over 20 Alliance crew members are killed, including Navigator Pressly
  - Commander Shepard is presumed dead after being blown into space by the final explosion
  - The Alliance loses its most advanced stealth reconnaissance frigate and becomes aware of a threat beyond the geth
  - The identity of the attacking force is initially unknown; later revealed to be Collectors serving the Reapers
  - Joker survives the destruction and is one of few witnesses to the attack
  - The destruction prompts Cerberus to retrieve Shepard's body and begin the Lazarus Project to revive the Commander
  - A memorial for the fallen Normandy crew is later established on Alchera in 2185
