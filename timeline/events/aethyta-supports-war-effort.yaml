event_id: aethyta-supports-war-effort
title: Aethyta Supports the War Effort
game: Mass Effect 3
chronological_order: 1870
date: "2186 CE"
summary: |
  When Commander Shepard reunites with Liara T'Soni on the Citadel during the Reaper War, Shepard encounters Matriarch Aethyta at Apollo's Cafe in the Presidium Commons. Aethyta reveals that she is Liara's "father" (asari pure-blooded daughter from a pureblood relationship) and explains that she has been watching Liara on behalf of other asari matriarchs, who are suspicious of Liara's role as a powerful information broker, her ties to Matriarch Benezia, and her association with Shepard due to his former affiliation with Cerberus. Aethyta warns Shepard that the matriarchs might order a hit on Liara if she were to step out of line, but concedes that Shepard's loyalty to protecting Liara is commendable. If Shepard arranges for the two to reunite, Aethyta and Liara have an emotional conversation where they discuss the matriarchs' spying, Liara's krogan grandfather, Aethyta's century-long relationship with Matriarch Benezia, and other family matters. After their reconciliation, Aethyta commits to sending a group of asari mercenaries to volunteer their services to aid the Reapers' invasion effort. Additionally, if Shepard recovers the Library of Asha or Biotic Amplifier Schematics, Aethyta provides further support to the asari military.
characters:
  - Aethyta
  - Commander Shepard
  - Liara T'Soni
  - Matriarch Benezia
consequences:
  - Asari mercenaries volunteer to aid the war effort (per player choices: conditional on Shepard's interaction with Aethyta and Liara)
  - Aethyta reconciles with Liara after a century of separation
  - Stronger asari military support is obtained if Shepard recovers additional war assets
  - Reveals that Aethyta and Benezia were in a long-term relationship
