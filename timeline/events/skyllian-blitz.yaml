event_id: skyllian-blitz
title: The Skyllian Blitz
game: Mass Effect
chronological_order: 320
date: "2176 CE"
summary: |
  The Skyllian Blitz was a major surprise assault on the human colony of Elysium, the
  oldest and most prominent Systems Alliance settlement in the Skyllian Verge, in 2176.
  A large coalition of Terminus pirates, slavers and mercenary bands, secretly funded
  and organized by the batarians and led by the pirate warlord Elanos Haliat, struck
  the colony from several mass relays at once, aiming to cripple humanity's expansion
  into the Verge and seize the world's population for the slave trade. The attackers
  overwhelmed Elysium's light orbital defenses and landed ground forces against the
  capital, Illyria, and outlying communities.

  The Alliance rallied a defense and repelled the assault, with the frigate SSV
  Agincourt among the warships that responded; Navigator Pressly earned his officer's
  commission for his conduct during the fighting. The Blitz shocked the Alliance into
  massively increasing military patrols throughout the Skyllian Verge and the wider
  Terminus Systems, and hardened public opinion toward the batarians once their role
  in backing the raiders became suspected.

  If Commander Shepard has the War Hero background, the Commander was on shore leave on
  Elysium when the attack began and personally organized a scratch militia that held
  the colony's perimeter against the pirate ground assault, single-handedly closing the
  main gate and holding it until Alliance reinforcements arrived. This action made
  Shepard famous across human space and was a key reason for the later nomination to
  the Spectres. A memorial plaza was built on the site; by 2185 it had become a popular
  wedding venue, with proceeds directed by Admiral Hackett to Alliance veterans' funds.
  Elanos Haliat, ruined and stripped of influence by the Blitz's failure, resurfaced in
  2183 with a scheme to attack another colony, only to be stopped and killed by Shepard.
characters:
  - Elanos Haliat
  - Commander Shepard
  - Pressly
  - Admiral Hackett
consequences:
  - The pirate and mercenary coalition's assault on Elysium is defeated by the Alliance
  - The Alliance greatly expands military patrols across the Skyllian Verge and Terminus Systems
  - Suspicion of batarian sponsorship of the raiders worsens human-batarian relations
  - Navigator Pressly earns his officer's commission
  - "Per Shepard's pre-service background: a War Hero Shepard becomes famous for rallying Elysium's defense, aiding the later Spectre nomination"
  - A memorial plaza is raised on Elysium, later a wedding venue funding veterans' charities
  - Elanos Haliat is left destitute, leading to his 2183 revenge plot and death
