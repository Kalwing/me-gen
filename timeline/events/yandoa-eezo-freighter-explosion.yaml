event_id: yandoa-eezo-freighter-explosion
title: Yandoa Element Zero Freighter Explosion
game: Mass Effect 3
chronological_order: 290
date: "2170 CE"
summary: >
  In 2170 an Eldfell-Ashland Energy element zero freighter exploded in the
  atmosphere above the Systems Alliance colony of Yandoa, the culmination of a run
  of eezo-related industrial accidents over the preceding four months. The blast
  seeded a dust-form element zero cloud that settled over the colony and its
  population. Exposure caused a wave of birth defects among Yandoa's population and,
  in surviving children carried at the time, an unusually high incidence of biotic
  potential. The disaster gave Yandoa a lasting grievance against the neighbouring
  batarian world of Ekuna, which suffered a comparable eezo release, and stoked
  interspecies tension over who was responsible. It was revealed years later that
  the Cerberus operative Paul Grayson had deliberately caused the Yandoa crash on
  Cerberus orders, as part of the organisation's covert programme to study and
  cultivate human biotics. The incident is part of the background of the biotic
  Grayson's adoptive daughter Gillian and of Cerberus's broader human-biotic
  research.
characters:
  - Paul Grayson
  - Commander Shepard
consequences:
  - An element zero dust cloud contaminated the colony of Yandoa
  - A generation of Yandoa children suffered birth defects, with elevated numbers born biotic
  - Lasting hostility developed between Yandoa and the batarian colony Ekuna
  - Cerberus, through Paul Grayson, had engineered the disaster to further its human-biotic research
