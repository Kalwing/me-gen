event_id: liselle-death-retribution
title: Kai Leng Murders Liselle on Omega
game: Mass Effect 2
chronological_order: 990
date: "2185 CE"
summary: |
  Liselle was a daughter of Aria T'Loak and, secretly, the lover of the ex-Cerberus
  operative Paul Grayson, who had gone to ground on Omega working for Aria under the
  alias "Paul Johnson." Years earlier, unable to trace Grayson's past, Aria had
  ordered Liselle to kill him; instead Liselle argued that he was useful and loyal
  and spared him, later becoming his lover. As told in Mass Effect: Retribution, she
  was part of a crew Aria sent to seize a shipment of red sand from the Talons, a
  turian mercenary gang, and raised no objection when Grayson stashed the sand in
  his apartment.

  When Cerberus confirmed Grayson's location, the Illusive Man dispatched the
  assassin Kai Leng to capture him. Liselle went to Grayson's apartment after a call
  from him, and the two were ambushed there by Grayson's former employers. Liselle
  was hit by a tranquilizer dart and knocked unconscious; Kai Leng then killed her,
  slitting her throat with a kitchen knife and leaving her to bleed out on Grayson's
  bed. Cerberus captured Grayson and took him to a research facility, where he was
  implanted with Reaper technology as a test subject.

  Aria later found Liselle's body. The small dart wound went unnoticed beside the
  fatal neck injury, leading Aria to conclude that Grayson had murdered her
  daughter. Her grief and fury drove her to hunt him, setting the vendetta that runs
  through the rest of Retribution and colors Aria's later dealings with Cerberus and
  with Shepard.
characters:
  - Liselle
  - Kai Leng
  - Paul Grayson
  - Aria T'Loak
  - The Illusive Man
consequences:
  - Liselle, a daughter of Aria T'Loak, is killed by Kai Leng during the Cerberus ambush on Omega
  - Cerberus captures Paul Grayson and subjects him to Reaper-technology implantation experiments
  - Aria wrongly believes Grayson killed Liselle and swears revenge on him
  - Aria's vendetta drives the events of Mass Effect: Retribution and hardens her stance toward Cerberus
