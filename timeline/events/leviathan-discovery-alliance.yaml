event_id: leviathan-discovery-alliance
title: Discovery of the Leviathans - Task Force Aurora and Paleotechnology
game: Mass Effect 3
chronological_order: 1820
date: "2186 CE"
summary: |
  During the Reaper invasion of 2186, the Systems Alliance Task Force Aurora, led by Dr. Garret Bryson, pursues an ancient legend: the existence of Leviathan, a mythical being theorized to have killed one of the Reaper capital ships known as the Leviathan of Dis. If such a being exists and can be weaponized or allied with, it could become a crucial asset in the war against the Reapers. The Task Force is divided into project teams: Project Basilisk, led by Dr. Alex Garneau and investigating the asteroid Mahavid, and Project Scarab, led by Dr. Ann Bryson (Garret's daughter) and investigating the planet Namakli in the Pylos Nebula.

  Commander Shepard is briefed on the Task Force's research and directed by Admiral Hackett to assist their investigation. However, during Shepard's meeting with Dr. Garret Bryson at his laboratory on the Citadel, the scientist is mysteriously assassinated by his own assistant, Derek Hadley. This death galvanizes Shepard into action, knowing that Bryson must have been close to a critical discovery. Shepard investigates Bryson's encrypted files using a decryption key hidden in a children's crayon drawing—a portrait of Reaper activity data that Garret had kept close to his heart for years.

  Shepard's investigation leads to the asteroid mining facility on Mahavid, operated by the T-GES Mineral Works front and under Reaper attack. Shepard, Steve Cortez, and squad fight through Reaper ground forces, repair a broken elevator with a repair drone, and gather datapads and credits. Tracking Dr. Garneau through an undelivered message, Shepard meets a man claiming to be Garneau who is in fact a Leviathan thrall; he flees and, at the mine, detonates the Leviathan artifact, killing himself and surrounding Husks. Shepard's squadmate then finds the real Dr. Garneau's body—the impostor had been another thrall. The freed facility staff have no memory of Garneau, the Reapers, or the past ten years; an asari miner believes the year is still 2176, revealing Leviathan had held them as thralls for roughly a decade. The attacking Reapers abruptly withdraw.

  Shepard continues to Namakli, where Dr. Ann Bryson's team is pinned down by Reaper forces. Shepard extracts Ann but finds that most of her team—Boyles, Hopkins, and Kirkwood—have been killed in the assault. On Namakli, Shepard discovers Leviathan artifacts: ancient alien technology capable of projecting visions and inducing quantum entanglement states to stimulate neural activity, similar to rachni communication.

  Ann theorizes that Leviathan was using the artifacts to induce a quantum entanglement state and may have been preparing the rachni to fight the Reapers. However, when Marauders activate one of the artifacts, it possesses Ann, forcing Shepard's squad to destroy the device to free her. After the battle, Shepard informs Ann of her father's death, deeply affecting the scientist. Back on the Citadel, Ann collaborates with EDI to understand the artifacts' function: they act primarily as receivers but become transmitters while possessing a victim, and their signals could be traced to pinpoint Leviathan's location.

  Despite Shepard's objections, Ann volunteers to expose herself to the artifact again, with James Vega standing by to intervene. If allowed to continue, Ann emerges relatively unharmed and warns that Leviathan is angry and intends to kill Shepard. The quantum entanglement analysis identifies Leviathan's location: 2181 Despoina, a celestial body in deep space. Shepard travels to Despoina and confronts Reaper forces defending the location. After a fierce battle, Shepard makes contact with Leviathan itself—revealed not as a single being but as one of several surviving members of an ancient organic race that predates the Protheans and, remarkably, gave rise to the Reapers.

  Leviathan explains that the Reapers were created as synthetic servants to preserve organic life in a endless cycle, but the cycle became twisted into harvesting civilizations. Leviathan and its kind have survived for millions of years, going into hibernation during Reaper cycles. Impressed by Shepard's determination and the human effort to understand ancient history, Leviathan agrees to aid the modern galactic races in fighting the Reapers. The ancient organic demonstrates its power by disabling an attacking Reaper capital ship, proving that the Leviathans represent a force capable of challenging the Reapers themselves. This discovery offers humanity and its allies a potential strategic advantage: the possibility of ancient allies with millions of years of experience fighting the Reapers.
