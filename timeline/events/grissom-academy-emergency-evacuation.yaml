event_id: grissom-academy-emergency-evacuation
title: "Grissom Academy: Emergency Evacuation"
game: Mass Effect 3
chronological_order: 1580
date: "2186 CE"
summary: |
  Acquired after Priority: Palaven, once Samantha Traynor and EDI determined that a
  turian rescue signal answering Grissom Academy's evacuation request was in fact a
  Cerberus fake and the station remained in danger. Cerberus forces were assaulting
  the Jon Grissom Academy in the Petra Nebula to abduct its students, most of whom
  were developing Alliance technology or training as military biotics. The mission
  had to be run before Priority: The Citadel II or it was permanently failed.

  With too many Cerberus ships to engage, Joker created a diversion so Shepard's
  shuttle could slip into a cargo hold opened by Kahlee Sanders, an old associate of
  Anderson from his Spectre-candidate days. Shepard freed Sanders from the security
  office and fought through the corridors, rescuing scattered students including
  Reiley Bellarmine and his dying sister Seanne. In Orion Hall a group of biotic
  students held off Cerberus Assault Troopers and an Atlas mech. If a Mass Effect 2
  save was imported and Jack had survived the Suicide Mission, Jack led the students
  (greeting Shepard with a punch, and a kiss if romanced); otherwise Ensign Jason
  Prangley took command. The squad then pushed through heavy waves of Centurions,
  Guardians, Combat Engineers and Atlas mechs across the Atrium and a docking area,
  aided by commandeered Atlas mechs and by tech students such as Octavia, with David
  Archer vouching for Shepard if Overlord had been completed on the Paragon route.

  During the final escape the wounded student Rodriguez fell behind; whoever led the
  biotics shattered the glass to save her. If Jack led, everyone survived; if
  Prangley led, he was shot and killed. Afterward Shepard assigned the students
  either as support folded into the Alliance 103rd Marine Division (+50 war assets,
  Paragon) or as a frontline Biotic Company (+75 war assets, Renegade), a choice
  that also set Jack's epilogue. If the mission expired, Jack was captured, converted
  into a Cerberus Phantom, and had to be killed at Cerberus Headquarters, and Gavin
  Archer could commit suicide during Arrae: Ex-Cerberus Scientists.
characters:
  - Commander Shepard
  - Jack
  - Kahlee Sanders
  - Jason Prangley
  - Rodriguez
  - Reiley Bellarmine
  - Seanne Bellarmine
  - David Archer
  - Gavin Archer
  - Samantha Traynor
  - EDI
  - Joker
consequences:
  - Grissom Academy's surviving students and staff are evacuated aboard the Normandy
  - Cerberus fails to capture the student body for conversion into troops
  - Shepard assigns the students as Alliance support (+50 war assets) or a Biotic Company (+75 war assets)
  - Jack survives and rejoins the war effort as a biotics instructor; if the mission is failed she is turned into a Phantom and killed at Cerberus HQ
  - Prangley dies during the escape unless Jack leads the biotic students
  - Kahlee Sanders is recovered and continues coordinating displaced Academy personnel
  - Rewards include 25,000 credits, weapon mods, the Mnemonic Visor and the Serrice Council Chestplate
