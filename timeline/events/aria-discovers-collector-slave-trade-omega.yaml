event_id: aria-discovers-collector-slave-trade-omega
title: "Aria T'Loak Discovers the Collector Slave Trade on Omega"
game: Mass Effect 2
chronological_order: 840
date: "2183 CE"
summary: |
  As told in the eight-page mini-comic Mass Effect: Incursion, roughly one week
  before the Collectors destroyed the SSV Normandy SR-1 over Alchera, Aria
  T'Loak investigated a disturbance on Omega personally, bringing two batarian
  bodyguards. One guard dismissed it as ordinary Blue Suns or slaver activity,
  but Aria sensed something worse and insisted on going herself.

  The three interrupted a meeting between Blue Suns mercenaries and a group of
  Collectors escorted by a Praetorian. Seeing that the Blue Suns were selling a
  group of captive humans to the Collectors, Aria ordered that no one leave
  alive and joined the fight. All the Collectors and all the captive humans were
  killed; Aria lost one bodyguard. Some Blue Suns survived and were interrogated
  and then executed on her orders.

  Afterward at Afterlife, Aria's agents delivered a datapad compiling everything
  they could find about the Blue Suns' arrangement with the Collectors. The data
  consisted of current human population totals for Horizon, Omega, Freedom's
  Progress, the Citadel, Eden Prime, Terra Nova, and Earth. Aria concluded that
  the Collectors wanted far more than a handful of slaves and that humanity had
  made a dangerous enemy. The comic was created to explain why, in Mass Effect:
  Redemption, Aria reacts so sharply when Liara T'Soni mentions the Collectors
  during her search for Shepard's body, and it foreshadows the Collector
  abductions of entire human colonies that open Mass Effect 2.
characters:
  - Aria T'Loak
  - Blue Suns mercenaries
  - Collectors
consequences:
  - Aria T'Loak kills a Collector delegation and its Praetorian escort on Omega
  - The captive humans being sold to the Collectors are all killed in the crossfire
  - Aria loses one batarian bodyguard; surviving Blue Suns are interrogated and executed
  - Aria obtains intelligence that the Collectors are studying entire human colony populations
  - Aria concludes humanity has made a dangerous enemy, explaining her later hostility to any mention of the Collectors
  - Foreshadows the Collector abductions of human colonies in Mass Effect 2
