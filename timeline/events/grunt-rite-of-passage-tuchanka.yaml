event_id: grunt-rite-of-passage-tuchanka
title: "Grunt: Rite of Passage on Tuchanka"
game: Mass Effect 2
chronological_order: 1170
date: "2185 CE"
summary: |
  Some time after being awakened aboard the Normandy, the tank-bred krogan Grunt
  began suffering violent instability and asked Commander Shepard to take him to
  Tuchanka so he could earn a place among a true krogan clan. Shepard brought him
  to the Urdnot camp, where the clan leader agreed that Grunt could attempt the
  Rite of Passage to join Clan Urdnot.

  Before the Rite, Gatatog Uvenk, a traditionalist battlemaster and leader of
  Clan Gatatog, publicly challenged Grunt's legitimacy, denouncing him as a
  factory-made fake unworthy of clan membership and appealing directly to the
  Urdnot Shaman, who was annoyed by the interruption. Shepard forced Uvenk to back
  down by affirming that Shepard's team would stand as Grunt's krantt, either
  through words or a headbutt; Uvenk withdrew his objection but swore to settle
  the matter later. Uvenk's attitude depended on who led Clan Urdnot: he openly
  opposed Urdnot Wrex's reforms as weakness, but was deferential if Urdnot Wreav
  held power.

  Grunt undertook the Rite in a ruined arena, striking the Keystone to summon
  escalating waves of varren and klixen and finally a thresher maw, which he could
  kill outright or merely survive until the timer expired. Immediately afterward
  Uvenk arrived by shuttle with several Gatatog Warriors. If Grunt had killed the
  maw, Uvenk grudgingly acknowledged his strength and offered him in-name-only
  membership in Clan Gatatog as a trophy to boost Uvenk's own standing; if the maw
  had only been survived, Uvenk dismissed Grunt as impure. Grunt violently
  rejected the offer, and the ensuing firefight ended with Uvenk and all his
  warriors dead. Grunt was formally inducted into Clan Urdnot, gained loyalty to
  Shepard, and expressed satisfaction at Uvenk's death.
characters:
  - Grunt
  - Commander Shepard
  - Gatatog Uvenk
  - Urdnot Wrex
  - Urdnot Wreav
  - Urdnot Shaman
  - Gatatog Warriors
consequences:
  - Grunt completes the Rite of Passage and is inducted into Clan Urdnot
  - Gatatog Uvenk and his warriors are killed after Grunt refuses Clan Gatatog's offer of token membership
  - Grunt's violent instability is resolved and he becomes loyal to Shepard, unlocking Fortification
  - If Grunt killed the thresher maw on foot, his feat becomes legend among the krogan
  - Uvenk's opposition or support of the Urdnot leadership underscores the split between krogan traditionalists and Wrex's reformers
