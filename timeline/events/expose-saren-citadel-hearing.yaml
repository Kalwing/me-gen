event_id: expose-saren-citadel-hearing
title: 'Citadel: Expose Saren - Council Hearing and First Human Spectre'
game: Mass Effect
chronological_order: 420
date: "2183 CE"
summary: |
  Following the attack on the colony of Eden Prime and the discovery of a Prothean Beacon, Commander Shepard and Captain David Anderson brought evidence before the Citadel Council accusing the legendary Spectre Saren Arterius of involvement with the geth. Ambassador Donnel Udina demanded action, but the Council initially dismissed the charges, relying solely on Anderson's testimony and Shepard's vision of the beacon's contents—evidence which Saren openly mocked during a holographic hearing.

  The Council's inaction forced Shepard to pursue additional evidence. With support from C-Sec officer Garrus Vakarian and guidance from Admiral Anderson and Ambassador Udina, Shepard investigated connections between Saren and a crime figure named Fist, who was harboring a quarian named Tali'Zorah nar Rayya. Tali carried an audio recording obtained from a geth memory core that provided conclusive proof of Saren's involvement in the Eden Prime attack. Crucially, the recording also captured references to the Reapers—an ancient, apparently mythical force that the geth revered and that had allegedly wiped out the Prothean civilization 50,000 years prior. This critical intelligence was initially dismissed by the Council as paranoia.

  Upon hearing Tali's irrefutable audio evidence, the Citadel Council stripped Saren of his Spectre status, effectively exiling him from the Council's protection. However, rather than authorizing a military fleet to apprehend him, the Council instead granted Shepard the unprecedented honor of becoming the first human Spectre—a rank that had never before been given to a human and that granted Shepard near-unlimited authority to investigate and pursue Saren across Council space. Anderson stepped down as commanding officer of the SSV Normandy, transferring command to Shepard. With this new authority and Tali, Garrus, and Wrex (if recruited) joining the Commander's crew, Shepard was tasked with hunting down the rogue Spectre.

  The decision to appoint a human Spectre marked a turning point in human-Council relations and represented both a victory for human interests and a recognition of Shepard's capabilities. However, the Council's continued dismissal of the Reaper threat—treating it as Saren's delusion rather than a genuine existential danger—would have profound implications for the galaxy's preparedness in the years to come.
