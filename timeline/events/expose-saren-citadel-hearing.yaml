consequences:
  - Saren Arterius stripped of Spectre status and exiled from Council protection
  - Commander Shepard becomes the first human Spectre in history
  - Captain Anderson relieved of command of the SSV Normandy; Shepard takes command
  - Tali'Zorah nar Rayya joins Shepard's crew
  - Garrus Vakarian either joins Shepard's crew or waits for recruitment
  - Urdnot Wrex either joins Shepard's crew or waits for recruitment
  - Shepard granted Spectre Training and higher Charm/Intimidate effectiveness
  - Council continues to dismiss the Reaper threat as Saren's delusion
  - Shepard authorized to hunt Saren across Council space
  - Fist can be killed or spared (Wrex kills him regardless)
  - If Fist is spared, he later appears on Omega
  - If Garrus or Wrex are not recruited now, their late recruitment affects later story outcomes
  - Commander Anderson relieved of duties and transitions to advisory role
