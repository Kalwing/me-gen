event_id: mass-effect-galaxy-jath-amon-citadel-plot
title: "Mass Effect Galaxy: Jacob Taylor Foils Jath'Amon's Citadel Bioweapon Plot"
game: Mass Effect
chronological_order: 380
date: "2183 CE"
summary: >
  Sometime before the geth attack on the Citadel in 2183, galactic tension rose
  around a peace initiative: the outwardly meek batarian ambassador Jath'Amon had
  arranged a meeting with the Citadel Council to negotiate terms between the
  Batarian Hegemony and the Systems Alliance. Cerberus learned that Jath'Amon was
  supposedly the assassination target of a batarian extremist group that treated
  "peace" as a synonym for "surrender." The Cerberus operative Miranda Lawson was
  tasked with uncovering the truth, and with the help of Alliance officer Major
  Derek Izunami she recruited Jacob Taylor, a biotic former Alliance marine, to
  investigate.

  Jacob was on leave aboard the passenger liner Arcturian Jade when batarian
  terrorists attacked the ship; he took up his old assault rifle and fought them
  off, beginning the investigation. Following leads to Tortuga, Jacob used a
  salarian contact of Miranda's named Ish to locate the turian arms dealer Illo
  Nazario, who had recently traded with a batarian cell in the Fringe. Jacob
  fought through Nazario's bodyguards and a batarian raiding party to reach the
  ailing dealer, who had been infected with an engineered bioweapon by the cell
  as punishment for ending their partnership. In exchange for medical care aboard
  Jacob's ship, Nazario revealed the truth: Jath'Amon was himself the leader of
  the batarian extremists, and the "peace conference" was a cover for infecting
  and assassinating the entire Citadel Council with the deadly engineered virus,
  against which the ambassador had already vaccinated himself.

  In the final mission, Protect the Council, Jacob and Miranda set course for the
  Citadel; Miranda dosed Jacob with Batha's vaccine to shield him from the
  bioweapon. Jacob fought through nine combat zones held by batarian Terrorists,
  Terrorist Elites and turrets - discovering the extremists had also infiltrated
  Citadel Security - and burst into the Council Chambers mid-speech with the
  evidence. When the asari councilor hesitated to act, the furious Jath'Amon
  dropped his peaceful facade, released the virus into the Citadel Tower from a
  concealed pump built into his hover chair, and fled by air. Jacob warned the
  chamber to evacuate, fought through further waves of terrorists and turrets, and
  cornered and defeated the ambassador and his bodyguards. Defeated, Jath'Amon
  claimed he and Jacob were alike in going to any length to protect their people,
  and was led away by C-Sec swearing revenge on Jacob and the Citadel races. The
  events established Jacob Taylor and Miranda Lawson as a working Cerberus team
  years before they served together aboard the Normandy SR-2.
characters:
  - Jacob Taylor
  - Miranda Lawson
  - Jath'Amon
  - Illo Nazario
  - Derek Izunami
  - Ish
  - Citadel Council
consequences:
  - >
    Jath'Amon's plot to assassinate the Citadel Council with an engineered virus
    is exposed and thwarted, though the virus is released into the Citadel Tower
    before he is stopped.
  - >
    Jath'Amon is taken into C-Sec custody, publicly discrediting the batarian
    "peace" initiative and further worsening batarian-Alliance relations.
  - >
    The batarian extremists are revealed to have infiltrated Citadel Security.
  - >
    Illo Nazario, infected with the bioweapon, is either cured or given medical
    care aboard ship in exchange for his information.
  - >
    Jacob Taylor is drawn into working with Cerberus and forms an operational
    partnership with Miranda Lawson years before Mass Effect 2.
  - >
    Cerberus gains intelligence on batarian extremist networks and Fringe arms
    trafficking.
