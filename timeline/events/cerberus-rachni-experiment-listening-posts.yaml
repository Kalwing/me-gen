event_id: cerberus-rachni-experiment-listening-posts
title: "Cerberus Rachni Experiment: Listening Posts Alpha and Theta and Depot Sigma-23"
game: Mass Effect
chronological_order: 770
date: "2183 CE"
summary: |
  After the events on Noveria open the Styx Theta gateway cluster, Commander Shepard
  responds to a chain of distress calls from Alliance listening posts overrun by
  rachni. At Listening Post Theta on Altahe the base is already lost: Shepard clears
  nests of Rachni Soldiers and the underground facility, finding an Emergency FTL
  comm playing Lieutenant Durand's distress call and clusters of triangular rachni
  eggs. At Listening Post Alpha on Nepmos in the Erebus system, Shepard joins the
  last survivors of a ninety-strong Alliance platoon, now reduced to a handful of
  marines, defending barricades against waves of Rachni Soldiers, and can wire the
  base generator to the Mako to power rocket turrets. Durand reports the assault has
  raged for days. Clearing the nearby infested mine and killing its Brood Warriors
  ends the infestation on the planet.

  Data recovered at Theta shows a supply ship arrived from Depot Sigma-23 in the
  Gorgon system of the Argos Rho cluster just before both posts were attacked,
  marking it as the source. Boarding the unidentified space facility, Shepard fights
  through Rachni Workers and Soldiers to a terminal holding logs by Major Elena
  Flores: the station was a Cerberus munitions and barracks depot where a special
  shipment of rachni, drawn from the Noveria stock, was being raised in proximity to
  a "master control unit" so Cerberus could field them against Terminus pirates. The
  rachni broke loose, seized the depot's freighters and scattered them to random
  destinations, seeding the listening-post infestations. Flores, disgusted that
  Cerberus treated the creatures "like animals" rather than prisoners of war, urged
  "the General" to destroy the station. Shepard arms demolition charges, fights past
  a final rachni wave and escapes before the countdown expires.
characters:
  - Commander Shepard
  - Durand
  - Elena Flores
  - Cerberus
consequences:
  - Rachni infestations at Listening Posts Alpha and Theta cleared; Alpha's ninety-strong platoon all but wiped out
  - Depot Sigma-23 identified as the origin of the infestation and destroyed by Shepard's demolition charges
  - Exposes a Cerberus program to breed and weaponise rachni descended from the Noveria specimen near a "master control unit"
  - Confirms Cerberus responsibility for the listening-post attacks after its captive rachni escaped and hijacked supply freighters
  - Adds to the mounting evidence of illegal Cerberus bio-experiments across the Attican Traverse
