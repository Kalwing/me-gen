event_id: normandy-crash-site-memorial
title: "Normandy Crash Site: Memorial and Dog Tag Recovery on Alchera"
game: Mass Effect 2
chronological_order: 1020
date: "2185 CE"
summary: |
  In 2185, after acquiring the Normandy SR-2 and recruiting the initial team members, Commander Shepard receives an email from Admiral Steven Hackett informing the Commander that Alliance scans in the Amada System of the Omega Nebula have located the wreckage of the SSV Normandy SR-1 on the frozen planet Alchera. Hackett explains that the Alliance wants Shepard, as the Normandy's last commanding officer, to be the first to walk on the crash site. The Alliance has two goals: to place a memorial monument honoring those lost in the destruction, and to recover any evidence of the twenty crew members still unaccounted for after the Collector attack.

  Shepard travels to Alchera and conducts a solo exploration of the crash site with no hostile forces present. The frozen ruins of the Normandy are scattered across the desolate landscape. As Shepard walks through the wreckage, the Commander experiences powerful flashbacks to key moments aboard the Normandy SR-1: the ship docked at Citadel Dock 422, Joker at the helm, the cryo-sleep pods where crew entered stasis, the Mako armored vehicle in the cargo bay, the Combat Information Center with its galaxy map terminal, and memories of the squad member left behind on Virmire.

  Shepard discovers notable remnants: the Mako still relatively intact, the destroyed galaxy map console amid CIC ruins, port armor plating with "Normandy" still visible, the crew sleeper pod compartment, cockpit remains, and an upright escape pod. Most importantly, twenty dog tags are scattered across the crash site, mostly inside yellow crates—one for each of the missing crew members (Bakari, Barrett, Chase, Crosby, Draven twins, Dubyansky, Emerson, Felawa, Gladstone, Grenado, Grieco, Laflamme, Lowe, Negulesco, Pakti, Rahman, Tanaka, Tucks, Waaberi).

  A personal datapad belonging to Navigator Pressly contains three journal entries revealing his evolution from distrust of the Normandy's alien crew to a declaration that he would die for any crew member regardless of birthworld. Shepard's lost N7 helmet is also recoverable from the wreckage. Four containers of element zero totaling 500 units are scattered around the site. After collecting dog tags and recovering items, Shepard must place the memorial monument on the crash site to complete the assignment.

  Upon return to the Normandy SR-2, if at least one dog tag was recovered, Admiral Hackett sends a follow-up email thanking Shepard on behalf of the affected families. In Mass Effect 3, all crew lost on the SR-1 appear on the Normandy SR-2's memorial wall regardless of how many dog tags were collected during this assignment.
characters:
  - Commander Shepard
  - Admiral Steven Hackett
  - Jeff "Joker" Moreau (memory)
  - Charles Pressly (memory/datapad)
  - The fallen crew of the SSV Normandy SR-1
consequences:
  - Shepard honors the fallen crew of the Normandy SR-1 by placing a memorial on Alchera
  - If dog tags are recovered, the Alliance notifies the families of all missing crew members, providing closure
  - Shepard's N7 helmet is recovered and placed on the desk in the captain's quarters of the Normandy SR-2
  - Navigator Pressly's personal journal reveals his transformation from xenophobic soldier to believer in interspecies cooperation
  - A memorial wall is later established on the Normandy SR-2's crew deck listing all SR-1 crew casualties
  - The assignment provides emotional and narrative closure to the destruction of the original Normandy
  - Shepard gains 3,750 credits in Alliance funding and 500 element zero
  - Up to 240 experience points can be earned by recovering dog tags
