event_id: kasumi-stolen-memory
title: "Kasumi: Stolen Memory Heist"
game: Mass Effect 2
chronological_order: 1290
date: "2185 CE"
summary: |
  Kasumi Goto, a renowned master thief recruited by Cerberus to assist with the suicide mission, requests Commander Shepard's aid in a dangerous heist. Her target is Donovan Hock, a wealthy weapons dealer and smuggler who resides in a fortified mansion on the luxury world of Bekenstein. Hock killed Kasumi's former partner Keiji Okuda and stole his "graybox"—a complex neural implant that stores and encodes personal memories as well as classified information Okuda had encountered. The encrypted graybox contains a secret that, if exposed, would implicate the Systems Alliance and potentially trigger galactic war. Hock has kept the graybox in his vault, obsessing over its decryption.

  Kasumi infiltrates Hock's lavish party by forging credentials for Commander Shepard (using a false identity and presenting a golden statue of Saren Arterius as tribute). Shepard and Kasumi navigate the high-society criminal gathering and breach the security protecting Hock's vault, which houses priceless artifacts including Michelangelo's David and the head of the Statue of Liberty. When they recover the graybox, Hock—suspecting Kasumi's involvement—appears as a holographic projection and confronts them. His Eclipse mercenary forces and battle mechs fail to stop the Commander and Kasumi. Hock personally intervenes, piloting an A-61 Mantis Gunship equipped with its own shield generator. Kasumi disables the gunship's shield, allowing Shepard and her to destroy it. Hock is killed in the resulting explosion.

  Per Kasumi's loyalty choice (`kasumi_loyalty`), Shepard can allow Kasumi to keep the graybox (preserving Keiji's memories) or convince her to hand it over to Alliance intelligence (ensuring the secret is secured). This choice affects Kasumi's commitment during the suicide mission.
characters:
  - Kasumi Goto
  - Commander Shepard
  - Donovan Hock
  - Keiji Okuda
  - Chief Roe
  - Eclipse mercenaries
consequences:
  - Donovan Hock is killed
  - Keiji Okuda's graybox is recovered from Hock's vault
  - The encrypted graybox's fate depends on player choice (per `kasumi_loyalty`)
  - Kasumi gains loyalty toward Commander Shepard (if player honors her wishes)
  - The classified Alliance secret contained in the graybox is secured
  - Kasumi becomes fully committed to the suicide mission
  - Bekenstein vault security is breached
  - Eclipse mercenary forces at Hock's estate are eliminated
