event_id: reloi-first-contact-and-withdrawal
title: "First Contact With the Reloi and Their Withdrawal From the Galactic Community"
game: Mass Effect 2
chronological_order: 920
date: "2184-2186 CE"
summary: |
  The Reloi are an avian, feathered, spacefaring species from the planet Tervest,
  known to the elcor long before the wider galaxy. As reported through Cerberus
  Daily News, the asari discovered the Reloi in 2184, and in 2185 the Citadel
  Council formally welcomed them to the galactic community: Council-sponsored
  shuttles arrived at Tervest bearing visitors and gifts of goodwill, and a Reloi
  delegation was sent to the Citadel to study galactic law, culture, history, alien
  biology and mass effect technology.

  The contact ceremonies triggered an outbreak of an alien flu among the Reloi,
  after which they wore environmental suits in the presence of other species. In
  2186, as the Reaper War began, the Reloi delegation withdrew entirely from the
  Citadel and the species isolated itself on Tervest, unwilling and unable to fight
  the Reapers. A representative named Arrika stated, "We have no wish to battle those
  who have yet to wrong us, nor have we the capability." The Reloi planned to
  destroy their own orbital satellites and observation equipment so the Reapers
  would mistake them for a pre-spaceflight civilization and pass them over; whether
  the ruse worked is unknown, as the rest of the galaxy was consumed by the war.
characters:
  - Arrika
  - Citadel Council
consequences:
  - The Reloi are discovered by the asari in 2184 and welcomed to the galactic community in 2185
  - A Reloi delegation studies galactic institutions on the Citadel
  - An alien flu outbreak forces the Reloi into environmental suits around other species
  - In 2186 the Reloi withdraw completely and isolate on Tervest rather than face the Reapers
  - The Reloi attempt to hide by dismantling their orbital infrastructure; the outcome is unknown
