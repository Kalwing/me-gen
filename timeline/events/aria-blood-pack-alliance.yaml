event_id: aria-blood-pack-alliance
title: Aria T'Loak Unites the Blood Pack
game: Mass Effect 3
chronological_order: 1540
date: "2186 CE"
summary: |
  During the Reaper invasion of 2186, Aria T'Loak, having lost control of her station Omega to Cerberus, retreats to the Citadel and begins consolidating her remaining power. Recognizing that her mercenary forces scattered across the galaxy are crucial to any hope of retaking Earth, Aria devises a strategy to reunite three major mercenary organizations—the Blood Pack, Eclipse, and Blue Suns—under her unified command. In exchange for their commitment to the war effort against the Reapers, she offers Commander Shepard a mission to recruit the Blood Pack. The Blood Pack, led by vorcha commander Kreete, is experiencing internal instability. Aria's batarian contact Narl sets a trap that plays on the organization's internal politics. The plan exploits the fact that Gryll, Kreete's ambitious lieutenant, has made a secret deal with Aria. Shepard meets with Narl in the Presidium Commons and participates in a mock negotiation, pretending to be a prisoner being traded to Kreete in exchange for Blood Pack support. At the critical moment of the exchange, Narl reveals that Gryll is Aria's true contact and that Kreete is being betrayed. Gryll orders Kreete's execution, and Shepard and Narl shoot Kreete and another vorcha. Shepard warns Gryll not to double-cross Aria, and Gryll, ambitious but not suicidal, agrees to submit the Blood Pack to Aria's authority. The mission is a success: approximately 2,000 vorcha mercenaries are committed to the Terminus Fleet war asset and to the campaign to liberate Omega and recapture Earth, significantly strengthening both Aria's personal forces and the Alliance's war effort.
characters:
