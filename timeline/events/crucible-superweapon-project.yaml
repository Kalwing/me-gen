event_id: crucible-superweapon-project
title: The Crucible - Mars Archives Discovery and Galaxy-Wide Construction
game: Mass Effect 3
chronological_order: 1800
date: "2186 CE"
summary: |
  The Crucible was an ancient, enormously complex superweapon designed to stop the
  Reapers. Its blueprint was refined by countless species across millions of years and
  many extinction cycles, passed secretly from one cycle to the next; no species ever
  managed to deploy it. The Protheans were the most recent builders, but infighting
  between a faction that wanted to destroy the Reapers and an indoctrinated faction that
  wanted to control them stopped them, and the schematics were hidden in a Prothean
  archive on Mars for 50,000 years.

  In 2186, after Liara T'Soni recovered encryption keys from a Prothean shrine on Kahje,
  she traveled to the Mars Archives (the mission Priority: Mars) and recognized the
  significance of the schematics. The Illusive Man also wanted them and sent the Cerberus
  infiltration unit Dr. Eva Core to steal the data and wipe the archives. After a chase
  and firefight, James Vega rammed Eva's shuttle with a truck and Shepard disabled her
  with the plans intact, though Shepard's Virmire survivor squadmate (Ashley Williams or
  Kaidan Alenko, per `virmire_survivor` / `virmire_survivor_rejoins`) was gravely injured
  and evacuated to Huerta Memorial Hospital on the Citadel. Eva's synthetic body was
  salvaged and later used to give EDI a mobile platform.

  The schematics were handed to the Systems Alliance, and after the fall of Earth Admiral
  Hackett authorized a massive galaxy-wide construction effort, with shipyards across
  many species building sections of the device. Scientists determined the Crucible
  exploited mass relay technology but could not fully explain how it worked, and that it
  required a final component, the Catalyst. The Prothean VI Vendetta on Thessia revealed
  the Catalyst was the Citadel itself, which could massively amplify the Crucible's
  output. The Illusive Man fled to the Citadel and alerted the Reapers, who seized the
  station and moved it into orbit around Earth. Hackett committed the combined fleets to
  Sol, and the completed Crucible was brought in behind a token defense force to dock
  with the Citadel, setting up the war's final choice (per `final_choice`).
characters:
  - Liara T'Soni
  - Commander Shepard
  - Eva Core
  - The Illusive Man
  - James Vega
  - Steven Hackett
  - Ashley Williams
  - Kaidan Alenko
  - EDI
consequences:
  - Crucible schematics recovered from the Mars Prothean Archives and handed to the Systems Alliance
  - Cerberus infiltration unit Eva Core neutralized; her synthetic frame later becomes EDI's mobile platform
  - The Virmire survivor (Ashley or Kaidan) is hospitalized on the Citadel with severe injuries (per `virmire_survivor`)
  - Admiral Hackett authorizes a galaxy-wide Crucible construction program after Earth falls
  - The Catalyst is identified as the Citadel via the Prothean VI on Thessia
  - The Illusive Man alerts the Reapers, who move the Citadel to Earth
  - The Crucible becomes the linchpin of the final battle and determines the ending (per `final_choice`)
