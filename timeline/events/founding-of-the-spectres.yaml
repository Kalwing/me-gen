event_id: founding-of-the-spectres
title: Founding of the Special Tactics and Reconnaissance Branch
game: Mass Effect
chronological_order: 40
date: "693 CE"
summary: |
  The Special Tactics and Reconnaissance branch (ST&R), whose agents became known as
  Spectres, was founded by the Citadel Council in 693 CE, shortly before the outbreak of
  the Krogan Rebellions. At the time the Council was increasingly uneasy about the
  unchecked expansion of the krogan into Citadel space. The krogan had been uplifted by
  the salarians during the Rachni Wars and rewarded with a new homeworld for their
  service; freed from the harsh environment of Tuchanka, their population exploded and
  they colonised world after world, alarming the other Citadel races.

  The first Spectres were hand-picked from the finest salarian Special Tasks Group
  operatives and asari huntresses. They were intended to serve partly in an
  observational capacity, gathering intelligence, but also to act as the Council's first
  line of defense against the growing krogan threat. In 693 CE the salarian operative
  Beelo Gurji was appointed the first Spectre by the Council. When the krogan finally
  turned against the Citadel, the Spectres were ready: they used guerrilla tactics,
  computer viruses, and devastating sabotage to slow the krogan advance in the opening
  phase of the Rebellions, buying time until the Council made first contact with the
  turians and persuaded them to join the war.

  Spectres were granted extraordinary authority, including power of life and death over
  the galaxy's inhabitants, and complete discretion in their methods. They answer only
  to the Council, have no command structure, and are considered above the law, though
  their status can be revoked for gross misconduct. For years the very existence of the
  Spectres was a Council secret, revealed publicly only after the Krogan Rebellions
  ended. The order endured for the next fifteen centuries as the Council's instrument
  for preserving galactic stability, and in 2183 Commander Shepard became the first
  human inducted into its ranks.
characters:
  - Beelo Gurji
consequences:
  - The Citadel Council gains a covert elite corps answering directly to it, above the law
  - Beelo Gurji is appointed the first Spectre
  - Spectre guerrilla tactics and sabotage slow the krogan in the early Krogan Rebellions
  - The order's existence is kept secret until after the Rebellions
  - The Spectres remain the Council's chief instrument of stability into the trilogy era
