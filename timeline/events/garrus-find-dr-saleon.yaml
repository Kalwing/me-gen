event_id: garrus-find-dr-saleon
title: "Garrus: Find Dr. Saleon"
game: Mass Effect
chronological_order: 610
date: "2183 CE"
summary: |
  While serving aboard the Normandy during the hunt for Saren, Garrus Vakarian
  recounted to Commander Shepard the case that had soured him on C-Sec procedure:
  Dr. Saleon, a salarian geneticist who had been growing cloned organs inside
  living, unwilling hosts. When C-Sec moved to arrest him, Saleon fled the Citadel
  in a stolen vessel using his hostages as human shields, and C-Sec commanders
  refused to authorize fire on the ship. Garrus believed Saleon then used those
  hostages as test subjects, and he never forgave himself for letting the doctor
  escape.

  Shepard received coordinates for Saleon's ship, the MSV Fedele, adrift in the
  Herschel system of the Kepler Verge. Garrus asked to come along, though bringing
  him was optional. Boarding the derelict, Shepard's team fought through Saleon's
  test subjects, malformed creatures resembling Thorian Creepers that spat toxins
  and swarmed at close range. In the cockpit they found Saleon, now calling
  himself Dr. Heart, who thanked Shepard for "rescuing" him and denied his real
  identity even as Garrus confirmed it. Shepard could order Garrus to stand down,
  intending to hand Saleon to the military for questioning, or authorize Garrus to
  execute him. Either way Saleon drew a weapon and was cut down with a single shot
  before he could retaliate. If Garrus was not brought along, another squadmate
  exposed Saleon and he died the same way while trying to flee.

  With Saleon dead, his cloning and organ-harvesting operation ended. Completing
  the assignment gave Garrus closure on the case that had haunted his C-Sec
  career; if he had been left behind, he later regretted missing the chance to
  confront the doctor himself. Cut content indicates Mass Effect 2 originally
  planned to reintroduce Garrus on Omega hunting Saleon's surviving accomplices.
characters:
  - Garrus Vakarian
  - Dr. Saleon
  - Commander Shepard
consequences:
  - Dr. Saleon (alias Dr. Heart) is killed aboard the MSV Fedele whether Shepard chooses to detain or execute him
  - Saleon's illegal cloning and organ-harvesting operation is permanently ended
  - Garrus gains closure on the case that drove him to distrust C-Sec regulations; if left behind he instead regrets missing the confrontation
