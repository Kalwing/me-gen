event_id: the-murder-of-keo
title: The Murder of Keo and the Terra Firma Leadership Crisis
game: Mass Effect
chronological_order: 300
date: "2173 CE"
summary: >
  In 2173 the human-nationalist Terra Firma party was engulfed in a kickback scandal
  involving the starship-parts corporation Nashan Stellar Dynamics. The political
  fallout forced party leader Inez Simmons to resign, triggering a leadership contest
  between Charles Saracino and Claude Menneau. The charismatic Menneau - a strong
  public performer who was far less likeable in private - pulled ahead by three points
  in the polls. Menneau travelled aboard his own private vessel with two bodyguards,
  Pel and Keo, and a pilot, Paul Grayson. Keo was a woman in her forties with an
  unusually pale, possibly cosmetically altered appearance. She never trusted Grayson
  and stayed close to her fellow guard Pel. Her instincts were sound but aimed at the
  wrong threat: both Pel and Grayson were Cerberus agents planted in Menneau's
  entourage on the Illusive Man's orders, because Cerberus wanted Saracino to head
  Terra Firma. While the vessel was en route to Shanxi for a campaign rally, Grayson
  retrieved a kitchen knife he had hidden in the ship's refrigerator and used it to
  kill Keo. On Pel's mocking instruction he then took Keo's sidearm as a trophy, a
  pistol he would keep for years afterward. Pel subsequently killed Menneau in his
  cabin; the ship and the bodies of Menneau and Keo were disposed of and never found,
  though rumours about the disappearance circulated for years. With his rival gone,
  Charles Saracino ran unopposed and was elected leader of Terra Firma. The killing
  was Grayson's first for Cerberus and continued to surface in his nightmares long
  into his later career as a Cerberus operative and father to the biotic prodigy
  Gillian Grayson. The episode is recounted in the novel Mass Effect: Ascension.
characters:
  - Keo
  - Paul Grayson
  - Pel
  - Claude Menneau
  - Charles Saracino
  - Inez Simmons
  - The Illusive Man
consequences:
  - Keo was murdered by Paul Grayson aboard Menneau's campaign vessel
  - Grayson claimed Keo's pistol as a trophy and kept it for years
  - The killing was Grayson's first as a Cerberus operative and haunted him thereafter
  - Claude Menneau was killed by Pel and his ship disposed of; his disappearance was never solved publicly
  - Inez Simmons resigned as Terra Firma leader over the Nashan Stellar Dynamics kickback scandal
  - With Menneau eliminated, Charles Saracino ran unopposed and became Terra Firma party leader
  - Cerberus secured favourable leadership of a human political party
