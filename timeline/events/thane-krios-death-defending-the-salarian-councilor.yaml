event_id: thane-krios-death-defending-the-salarian-councilor
title: Thane Krios Intercepts Kai Leng and Dies Defending the Salarian Councilor
game: Mass Effect 3
chronological_order: 1670
date: "2186 CE"
summary: |
  During Cerberus's 2186 coup attempt on the Citadel (Priority: The Citadel II),
  Councilor Udina moved the Citadel Council toward a waiting escape shuttle while the
  Cerberus assassin Kai Leng hunted them. The salarian councilor - Valern, or Esheel
  if Valern had died on Sur'Kesh - hid under tactical cloak in the executor's
  cafe/office area after the executor was killed. When Commander Shepard's squad
  located him, he began to reveal that Udina was orchestrating the coup, and Kai Leng
  arrived to silence him.

  What happened next depended on who was still alive to intervene (per `citadel_coup`
  and `salarian_councilor`). If Thane Krios had survived the 2185 Suicide Mission and
  Shepard had visited him at Huerta Memorial Hospital before this mission, Thane
  dropped in and fought Kai Leng hand to hand, buying time and saving the councilor
  but taking Leng's blade through the torso. If Thane was absent but Major Kirrahe had
  survived Virmire in 2183 (per `kirrahe_virmire`), a cloaked Kirrahe took the shot
  meant for the councilor, then limped a short distance before collapsing and dying on
  the spot; as he was never Normandy crew, his name does not appear on the memorial
  wall. If neither was present - or no Mass Effect 2 save was imported - Kai Leng
  killed the salarian councilor outright. In every case Leng then fled, disabled
  Shepard's pursuit skycar with his sword, and ultimately escaped the failed coup.

  A mortally wounded Thane was taken to Huerta Memorial. Shepard could be present for
  his final moments, where his estranged son Kolyat joined them regardless of the
  outcome of Thane: Sins of the Father. In the last stage of Kepral's Syndrome, Thane
  died in surgery as Kolyat and Shepard recited the drell prayer to Kalahira; Thane
  revealed the prayer had been his wish for Shepard, not himself. His name was added
  to the Normandy's memorial wall. If Thane had survived Mass Effect 2 but was never
  visited at the hospital, he did not appear at the coup at all, yet his name still
  turned up on the memorial wall afterward. Shepard later avenged him by killing Kai
  Leng at Cerberus Headquarters.
characters:
  - Thane Krios
  - Kai Leng
  - Commander Shepard
  - Kolyat Krios
  - Kirrahe
  - Valern
  - Donnel Udina
consequences:
  - "Per `citadel_coup`/`salarian_councilor`: if Thane was alive and visited at Huerta, he intercepts Kai Leng, saves the salarian councilor, and is fatally stabbed"
  - "If Thane is absent but Kirrahe survived Virmire, Kirrahe takes the fatal shot for the councilor and dies on the spot"
  - "If neither is present, Kai Leng assassinates the salarian councilor"
  - Kai Leng escapes the Citadel after the coup collapses
  - Thane dies at Huerta Memorial Hospital with Shepard and Kolyat reciting the prayer to Kalahira
  - Thane's name is added to the Normandy SR-2 memorial wall
  - Saving the salarian councilor secures salarian war assets (Salarian Third Fleet or STG Task Force)
  - Shepard later kills Kai Leng at Cronos Station, avenging Thane
