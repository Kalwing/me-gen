event_id: priority-cerberus-headquarters
title: "Priority: Cerberus Headquarters - Assault on Cronos Station"
game: Mass Effect 3
chronological_order: 1750
date: "2186 CE"
summary: |
  Immediately after the events at Sanctuary on Horizon, evidence recovered from Kai
  Leng's trail - or a tracer planted by Miranda Lawson if she survived - lets the
  Alliance locate the Illusive Man's headquarters: Cronos Station, a Cerberus space
  station orbiting the variable star Anadius in the Horsehead Nebula. Admiral Hackett
  masses a fleet while Commander Shepard leads a boarding assault with EDI as a
  required squadmate. The team fights through hangar bays and burning corridors
  against Assault Troopers, Centurions, Guardians, Phantoms, Nemeses and Atlas mechs;
  if Legion was sold to Cerberus it appears as a hostile Legion assassin, and a
  captured Jack can be freed along the way.
  Cerberus data terminals and the salvaged remains of the Human-Reaper larva from the
  Collector Base reveal that the Illusive Man had been hoarding and studying Reaper
  and Collector technology, was himself indoctrinated, and had experimented on his own
  personnel; other records expose the origin of EDI, assembled from the rogue Alliance
  VI and technology salvaged from Sovereign. In the station's inner chamber Kai Leng
  ambushes Shepard for a final duel. Shepard defeats him, and when the wounded
  assassin attempts a stealth kill from behind, Shepard counters and kills him with an
  omni-blade, able to dedicate the kill to Thane Krios, Miranda Lawson or Major
  Kirrahe depending on who died at his hands. Shepard recovers the Prothean VI
  Vendetta and the complete Catalyst plans, but the Illusive Man has already fled to
  the Citadel. Admiral Anderson confirms that the Citadel has been moved into orbit of
  Earth, and Priority: Earth becomes the only remaining mission, beginning the endgame.
characters:
  - Commander Shepard
  - EDI
  - The Illusive Man
  - Kai Leng
  - Admiral Hackett
  - Admiral Anderson
  - Miranda Lawson
consequences:
  - Cronos Station is captured and Cerberus is broken as a fighting force
  - Kai Leng is killed by Shepard
  - The Prothean VI Vendetta and full Catalyst/Crucible data are recovered
  - Records confirm the Illusive Man is indoctrinated and hid Reaper and Collector technology
  - The Illusive Man escapes to the Citadel
  - The Citadel is revealed to have been relocated to Earth; Priority: Earth unlocks and the endgame begins
  - If Legion was sold to Cerberus it appears as an enemy; a captured Jack can be freed
