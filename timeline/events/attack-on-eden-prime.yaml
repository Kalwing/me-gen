event_id: attack-on-eden-prime
title: Attack on Eden Prime
game: Mass Effect
chronological_order: 390
date: "2183 CE"
summary: >
  In 2183 the geth invaded the Systems Alliance colony of Eden Prime, one of
  humanity's oldest and most prosperous settlements beyond the Charon Relay, in the
  Utopia System of the Exodus Cluster. The assault was led by the rogue turian
  Spectre Saren Arterius aboard the Reaper Sovereign, whose ground forces sought a
  Prothean beacon recently unearthed at an excavation site. Commander Shepard, first
  officer of the prototype frigate SSV Normandy SR-1, was sent planetside with a
  ground team on what had been billed as a routine shakedown cruise and evaluation
  by the turian Spectre Nihlus Kryik. In the Normandy comm room before the drop,
  Nihlus and Captain Anderson revealed the mission's true purpose - securing the
  beacon and assessing Shepard for the Spectres. Nihlus scouted ahead alone and was
  shot in the back and killed by Saren Arterius himself near the spaceport. Corporal
  Richard Jenkins was killed by geth recon drones early in the advance. Shepard's
  team fought through geth troopers, husks impaled on dragon's teeth spikes, and
  demolition charges, linking up with the sole survivor of the guard unit, Gunnery
  Chief Ashley Williams of the 212, and meeting the dockworker Powell near Nihlus's
  body. They found the beacon had been moved from the dig site to the spaceport, took
  a tram to the platform, and destroyed Saren's timed nuclear charges. When Kaidan
  Alenko and Ashley approached, the beacon activated and pulled one squadmate toward
  it; Shepard threw them clear and was seized instead, receiving a violent,
  fragmentary vision of synthetic machines slaughtering organic civilizations before
  the beacon burnt out and exploded. Shepard woke in the Normandy med bay under Dr.
  Chakwas's care, briefed Anderson, and set course for the Citadel. The vision and
  the eyewitness evidence of Saren's involvement set Shepard on the path to expose
  him.
characters:
  - Commander Shepard
  - Saren Arterius
  - Nihlus Kryik
  - Ashley Williams
  - David Anderson
  - Kaidan Alenko
  - Richard L. Jenkins
  - Joker
  - Dr. Chakwas
  - Powell
  - Sovereign
  - Geth
consequences:
  - The geth sacked Eden Prime and the colony suffered heavy civilian and military casualties
  - Spectre Nihlus Kryik was killed by Saren Arterius
  - Corporal Richard Jenkins was killed in the opening minutes of the ground assault
  - The Prothean beacon was triggered and destroyed, imprinting Shepard with a warning vision of the Reaper invasion
  - Ashley Williams, sole survivor of her unit, joined the Normandy crew
  - Shepard gained firsthand evidence of Saren's treason, leading to the Citadel hearing
  - Saren's search for the Conduit and Sovereign's plan were set in motion against Shepard
