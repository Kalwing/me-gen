event_id: genophage-deployed-krogan-rebellions
title: The Genophage Deployed Against the Krogan
game: Mass Effect
chronological_order: 60
date: 710 CE
summary: 'During the Krogan Rebellions, with the krogan refusing to surrender after defeats and able to
  replace their losses through explosive breeding, the Turian Hierarchy turned to the salarians, who had
  secretly engineered a biological weapon called the genophage. Rather than sterilising krogan females,
  the genophage attacked the probability of viable pregnancy: most fetuses never developed nervous systems
  and died before birth, and many surviving pregnancies ended in stillbirth, cutting successful births
  to roughly one in a thousand. Every cell in a krogan body was infected so that gene therapy could not
  counter it. The salarians had designed the agent purely as a deterrent, believing its consequences so
  terrible that no one would ever release it. The turians, who favoured massive retaliation, deployed
  it almost immediately upon receiving it, dispersing it through the Shroud tower over Tuchanka in 710
  CE. A Citadel Archives recording of the moment shows a lone salarian officer protesting that his government
  had not authorised release and calling the act genocide, only to be restrained while the turian commander
  predicts the salarians will one day be grateful. Krogan numbers began to collapse; combined with a renewed
  turian military push, the krogan soon recognised their cause as hopeless and the Rebellions ended. Over
  the following centuries fertile krogan females became prizes of war (the warlord Shiagur used her fertility
  to draw the strongest males into her army), a fatalistic culture of impending extinction set in, a black
  market in krogan testicles arose from the false belief that transplants could reverse the effect, and
  some krogan invested in biotech firms such as Binary Helix hoping for a cure. Generations later, salarian
  STG scientists including Mordin Solus concluded the krogan were evolving resistance and covertly engineered
  a modified genophage strain, redeployed on Tuchanka, to hold krogan population growth at pre-industrial
  levels.'
characters:
- Salarian Union
- Turian Hierarchy
- Citadel Council
- krogan
- Shiagur
- Mordin Solus
consequences:
- Krogan births fall to roughly one in a thousand viable; the species enters a slow demographic collapse
- The Krogan Rebellions end in krogan defeat
- Lasting krogan bitterness toward the salarians and turians, and a fatalistic 'dying race' culture
- Fertile krogan females become strategic assets and prizes of war
- A black market in krogan testicles and krogan investment in biotech firms like Binary Helix arise from
  hopes of a cure
- Salarians (Mordin Solus and STG) later engineer and redeploy a modified genophage strain when the krogan
  begin evolving resistance
- The genophage becomes the central grievance behind the krogan-turian-salarian bargaining of Mass Effect
  3
