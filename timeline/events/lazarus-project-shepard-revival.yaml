event_id: lazarus-project-shepard-revival
title: The Lazarus Project - Shepard Revived and Escapes Lazarus Station
game: Mass Effect 2
chronological_order: 1000
date: "2185 CE"
summary: |
  After Commander Shepard was killed in 2183 when a Collector cruiser destroyed the
  SSV Normandy SR-1 over Alchera, Cerberus recovered the body with Liara T'Soni's
  help and delivered it to the Illusive Man, who launched the Lazarus Project: a
  secret effort whose sole purpose was to bring Shepard back. Believing only Shepard
  could stop the coming Reaper harvest while the Council did nothing, the Illusive
  Man poured over four billion credits and two years of work into the project,
  operated by the Lazarus Cell under Miranda Lawson with her assistant Wilson at the
  Lazarus Research Station and Minuteman Station.

  The reconstruction used cybernetic implants to rebuild Shepard's skeleton, regrown
  skin, fluids to restart the organs and blood flow, and facial reconstruction;
  Shepard emerged having partly lost prior skills and talents. Miranda pressed to
  implant a control chip in Shepard's brain, but the Illusive Man refused, insisting
  Shepard be revived exactly as before, with no genetic or neural tampering - a claim
  later confirmed by Lazarus records recovered during the assault on Cronos Station.
  Cerberus also grew a secret clone of Shepard as a source of spare organs; it was
  never used during the revival.

  In 2185, with Shepard's neurological activity nearly restored, the Lazarus Station
  suffered a catastrophic security breakdown: its LOKI and YMIR security mechs, their
  IFF reprogrammed (Wilson was blamed, though he proved to be a traitor working for
  the Shadow Broker), turned on the personnel and killed most of the crew. Woken
  early and still incompletely reconstructed, Shepard armed up, fought through the
  hacked mechs, met and shot the wounded Wilson on Jacob Taylor's warning that
  Wilson was the saboteur, and escaped by shuttle with Miranda and Jacob during the
  mission Prologue: Awakening. A later Illusive Man report stated the compromised
  station was destroyed by remote detonation and a Cerberus team sent to erase any
  incriminating evidence.
characters:
  - Shepard
  - Miranda Lawson
  - Jacob Taylor
  - Wilson
  - The Illusive Man
  - Liara T'Soni
consequences:
  - Commander Shepard is brought back from the dead after two years, physically rebuilt with cybernetic implants
  - Shepard is revived without a control chip or genetic/neural tampering, at the Illusive Man's insistence
  - The Lazarus Research Station is overrun by reprogrammed security mechs and most of its staff are killed
  - Wilson is exposed as a traitor and shot dead during the escape
  - Shepard escapes with Miranda Lawson and Jacob Taylor and is brought into Cerberus's service against the Collectors
  - The Lazarus Station is destroyed by remote detonation to bury evidence of the project
  - A hidden Shepard clone remains in Cerberus storage, later used by Maya Brooks in the Citadel DLC
