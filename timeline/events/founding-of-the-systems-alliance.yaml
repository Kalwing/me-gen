event_id: founding-of-the-systems-alliance
title: Founding of the Systems Alliance
game: Mass Effect
chronological_order: 140
date: "2149 CE"
summary: |
  Following the 2148 discovery of the Prothean ruins on Mars, which proved humanity
  was not alone in the universe and gave it a usable understanding of element zero,
  human society underwent rapid upheaval. The revelation fractured many of Earth's
  religions - spawning movements such as the Interventionary Evolutionists, who
  proclaimed all human history had been guided by alien forces, while established
  faiths variously absorbed, ignored or denied the evidence - but it had the
  opposite effect on politics. Nations that had been divided by their differences
  reoriented around an "us versus them" outlook, laying the foundation for a united
  human front as expansion into the stars was being held back by that same lack of
  unity.

  In early 2149, political leaders from across the Sol system set aside their
  rivalries. Together with representatives from Mars and Luna, Earth's eighteen
  largest nations - among them the United North American States, the Chinese
  People's Federation, the Russian Federation, the United Kingdom, the French
  Republic, the Federative Republic of Brazil, the Indian Union, Japan and the
  Federal Republic of Nigeria - drafted and ratified the Systems Alliance Charter,
  establishing a supranational representative body to expand and defend human
  territory in space. The Republic of Ireland joined a year later. Shortly after
  ratification, the founding nations pooled their scientific, industrial and
  military resources to create the Systems Alliance Military. Smaller nations
  excluded from the founding group later coalesced into the Union of Incorporated
  Nations. That same year, 2149, the Alliance identified that Charon, long thought
  to be a moon of Pluto, was in fact a dormant mass relay, and Rear Admiral John
  Grissom led the first crewed transit through it to Arcturus, confirming a
  galaxy-spanning relay network. Arcturus Station later became the Alliance capital.
characters:
  - John Grissom
consequences:
  - Earth's eighteen largest nations ratify the Systems Alliance Charter, creating a single body to represent Earth and its future colonies
  - Member nations pool their armed forces into the Systems Alliance Military
  - The Union of Incorporated Nations forms from smaller nations left out of the founding group
  - The Alliance becomes the political and military engine of human interstellar expansion
  - Sets the stage for the discovery and activation of the Charon Relay and the founding of Arcturus Station as the Alliance capital
