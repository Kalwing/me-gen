event_id: shepard-reconciles-septimus-oraka-and-the-consort
title: Shepard Reconciles Septimus Oraka and the Consort
game: Mass Effect
chronological_order: 500
date: "2183 CE"
summary: |
  During Commander Shepard's time on the Citadel in 2183, the asari Consort Sha'ira
  asks for help with a personal problem (assignment Citadel: Asari Consort). The
  retired turian general Septimus Oraka, a veteran of several campaigns against the
  krogan, had visited the Consort for years and grown close to her, but after he
  demanded she be "more than she could be" for him they had a bitter falling-out.
  Humiliated, Septimus began spreading lies about Sha'ira and spent his days drinking
  in Chora's Den. Sha'ira asks Shepard to speak to him soldier to soldier and remind
  him of his honor.

  Shepard finds Septimus drunk and self-pitying, insisting Sha'ira was the only woman
  who helped him forget the horrors of his past and that she abandoned him. Shepard can
  convince him to sober up and act like a general again. Ashamed of his behavior,
  Septimus vows to send Sha'ira an apology, and asks Shepard one favor: in his anger he
  had uncovered a compromising secret about the elcor diplomat Xeltan and had told
  Xeltan that the Consort leaked it, when in fact Septimus discovered it himself. He
  gives Shepard a datapad detailing how he actually learned the secret so that Sha'ira
  can be exonerated (assignment Citadel: Xeltan's Complaint). Shepard delivers the
  proof to Xeltan at the elcor-volus embassy; Xeltan is shocked that his secret was so
  easily found and worries anyone could uncover it, and Shepard can either reassure him
  or leave him to sweat before he goes to make peace with the Consort.

  Returning to the Consort's Chambers, Shepard reports success. Sha'ira later confirms
  Septimus sent a gracious apology note and that the two have become friends again. She
  rewards Shepard with credits and "a gift of words" tailored to Shepard's background;
  expressing dissatisfaction prompts her to initiate a brief sexual encounter that
  grants no morality points. Septimus and the Consort both survive into the Reaper War,
  where Septimus resurfaces on the Citadel in 2186 fighting Blue Suns arms theft.
characters:
  - Commander Shepard
  - Sha'ira
  - Septimus Oraka
  - Xeltan
consequences:
  - Septimus Oraka stops spreading lies about the Consort and resolves to behave like a general again
  - Xeltan learns the Consort was not responsible for leaking his secret, clearing Sha'ira's name
  - Septimus and Sha'ira reconcile and become friends
  - Shepard receives credits and the Consort's personalized "gift of words"
  - Septimus survives to reappear on the Citadel during the 2186 Reaper War
