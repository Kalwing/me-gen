event_id: volus-ambassador-din-korlack
title: "Citadel: Volus Ambassador - Exposing Cerberus Mole"
game: Mass Effect 3
chronological_order: 1410
date: "2186 CE"
summary: |
  Following the failed Cerberus coup on the Citadel, Primarch Adrien Victus of the turian Hierarchy began to suspect that information about turian military movements was being leaked to Cerberus. Victus contacted Commander Shepard via Spectre authority to investigate volus ambassador Din Korlack as a potential Cerberus operative.

  Victus's suspicions stemmed from a recent devastating Cerberus ambush on a turian cruiser carrying high-ranking Hierarchy officials. The cruiser's trajectory and position had been top-secret information known only to a select few, including Ambassador Korlack due to the tight economic ties between turian and volus interests. Additionally, rumors circulated of a bounty placed on Korlack's head, suggesting Cerberus might have discovered he was compromised or that they intended to silence him.

  Shepard used Spectre authority to access the Spectre Terminal in the Citadel Embassies and obtained Korlack's location. Upon breaking into Korlack's office suite, evidence was found proving his collusion with Cerberus: audio recordings documenting his communication with Cerberus agents and his later severance of ties with the organization. If Zaeed Massani had survived the Suicide Mission and remained loyal, his voice appeared among the recordings, linking him to the Cerberus network.

  Tracking Korlack to the Presidium Commons, Shepard found him being held captive by Cerberus agents. Korlack, though a traitor, cleverly spoke the words "Selkish Arms" within his captors' hearing—a coded reference to his location that allowed Shepard to identify his exact position within a residential complex at the far end of a hall.

  Inside the correct apartment, Shepard confronted Korlack's captors. The outcome varied:
  - If Zaeed Massani was loyal to Shepard, he arrived and personally eliminated the captors
  - If Zaeed was disloyal, he died after killing the mercenaries, forcing Shepard to finish the job
  - If Zaeed had not survived the Suicide Mission, Shepard faced human and krogan Cerberus operatives alone

  Shepard then faced a critical moral choice: save the colonist settlement that Cerberus had targeted for destruction (based on Korlack's intelligence), or secure the Volus Bombing Fleet as a military asset for the war effort. A loyal Zaeed enabled a Paragon/Renegade option to save both the colony and secure the bombers. Making either choice alone resulted in news reports about the other outcome—either unrevealed Cerberus targets or the bombers' status.

  Korlack's exposure as a Cerberus mole damaged turian-volus relations and forced the volus to redouble their commitment to the war effort or face accusations of complicity.

characters:
  - Commander Shepard
  - Primarch Adrien Victus
  - Din Korlack (volus ambassador)
  - Zaeed Massani (conditional)
  - Cerberus operatives/mercenaries
  - Colonist settlement (conditional)

consequences:
  - Din Korlack exposed as Cerberus mole and collaborator
  - Per choice conditional: Save colony (colonist settlement spared; news reports Volus Bombing Fleet status unknown); Secure bombers (Volus Bombing Fleet joins war effort; colony's fate remains unrevealed); Both with loyal Zaeed (both colony and bombers secured)
  - Turian-volus relations strained by Korlack's betrayal
  - Primarch Victus gains confidence in Shepard's Spectre abilities
  - If Zaeed survives and assists, he can be recruited as War Asset from refugee camp
  - Demonstrates Cerberus' deep infiltration of Citadel institutions
  - Intelligence gained affects turian war strategy going forward
  - Volus commitment to war effort either reinforced or questioned

