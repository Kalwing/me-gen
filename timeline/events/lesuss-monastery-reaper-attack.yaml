event_id: lesuss-monastery-reaper-attack
title: Lesuss Ardat-Yakshi Monastery Reaper Attack
game: Mass Effect 3
chronological_order: 1500
date: "2186 CE"
summary: |
  During the Reaper invasion of 2186, an Ardat-Yakshi monastery on the asari world Lesuss comes under direct attack by Reaper forces. The Reapers specifically target the monastery because Ardat-Yakshi—asari with a rare genetic condition that grants biotic power but causes death to mating partners—are ideal candidates for conversion into Banshees, the asari-derived Reaper troops. Asari High Command dispatches multiple commandos to investigate after losing contact with the monastery, but the commandos fail to report back, indicating Reaper forces have thoroughly compromised the position. Commander Shepard is tasked with investigating the distress signal. If Samara survived the suicide mission in Mass Effect 2, she arrives at the monastery independently, driven by both maternal concern for her daughters and her duties as a justicar, which explicitly require executing any Ardat-Yakshi that cannot be safely sequestered. The situation becomes a profound moral crisis for Samara when she discovers that her last living daughter Falere is still on Lesuss and at risk of Reaper conversion. Shepard fights through Reaper forces, including Cannibals and incipient Banshees, to reach the Great Hall where Rila and Falere have been taken. Rila has already begun the indoctrination process and attacks her sister before regaining control of her mind. Together, Shepard and the surviving asari manage to arm a bomb intended to destroy the monastery before the Reapers can fully convert the Ardat-Yakshi. Rila, partially indoctrinated, finds the detonator and insists that Falere flee with Shepard while she remains to trigger the explosion. Despite Falere's resistance, Shepard drags her to the elevator as Rila detonates the bomb, destroying the monastery and herself, sacrificing her life to prevent conversion. Samara's response depends on her survival: if present, she attempts suicide rather than execute her last living daughter, though Shepard can stop her with a Paragon interrupt. If stopped, Samara agrees to Falere's plan for continued isolation at the ruined monastery and rejoins the war effort. If Samara did not survive the suicide mission, Shepard's choice determines Falere's fate: either allowing her to remain at the monastery under promise of suicide if Reapers return, or executing her as a security risk.
