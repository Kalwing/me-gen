  - "If Samara survived: she either commits suicide or is stopped by Shepard and agrees to Falere's isolation plan and rejoins the war effort"
  - "If Samara survived and stopped from suicide: Falere remains in isolation at the ruined monastery; Samara commits to the war effort"
  - "If Samara did not survive: Falere either remains isolated or is executed by Shepard"
  - Ardat-Yakshi are prevented from being converted into Banshees
  - Samara's relationship with her remaining child is resolved through sacrifice or mercy
