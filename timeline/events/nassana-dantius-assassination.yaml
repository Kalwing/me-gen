event_id: nassana-dantius-assassination
title: "Nassana Dantius Assassination by Thane Krios - Tower One, Illium"
game: Mass Effect 2
chronological_order: 1070
date: "2185 CE"
summary: |
  Nassana Dantius, a powerful and ruthless asari businesswoman who had accumulated
  considerable influence on Illium by 2185, became the target of assassination by the drell
  assassin Thane Krios. Nassana had built her power on a foundation of intimidation and
  corruption, routinely murdering anyone who threatened her reputation or business interests.
  Her aggressive consolidation of power made her enemies, particularly among those she had
  wronged—including Seryna, a former employee whom Nassana had fired for speaking out against
  her practices.

  In her paranoia, Nassana retreated to the penthouse of Tower One in the Dantius Towers
  complex, which was still under construction, allowing her to control access and fortify
  her position. She hired Eclipse mercenaries as her personal security force and ordered
  the elimination of salarian workers on the construction site using LOKI Mechs, further
  bloodying her hands before her ultimate downfall.

  When Commander Shepard's squad arrived at the towers, ostensibly to rescue Nassana from
  what she believed was an assassin threat, Nassana was convinced the initial contact was
  Seryna's hired killer. As Shepard's team fought through Eclipse mercenaries guarding her
  position, Nassana escalated her paranoia, repeatedly offering bribes in the hopes of
  buying them off. However, while Nassana was distracted by a false alarm—a reported noise
  that drew her attention—Thane infiltrated the tower through the ventilation system,
  bypassing the main defenses entirely. Finding his way to Nassana's penthouse, Thane
  systematically eliminated her personal guards and then confronted her directly, shooting
  her at point-blank range. Before he left, Thane respectfully arranged Nassana's hands
  across her chest, a gesture of professional courtesy despite the cold nature of his work.

  Nassana's death was publicly announced with no suspects identified. Remarkably, the
  circumstances were viewed favorably by the business community—her corporation's stock
  price rose following the announcement, a testament to how thoroughly despised her
  ruthless management practices had been among both investors and the public.
characters:
  - Nassana Dantius
  - Thane Krios
  - Seryna
  - Commander Shepard
  - Eclipse Mercenaries
consequences:
  - Nassana Dantius assassinated by Thane Krios
  - Thane's target is successfully eliminated
  - Dantius Corporation leadership vacuum created; stock price rises
  - Shepard's squad encounters Thane Krios during the assassination
  - Thane Krios becomes available for recruitment as a squadmate
  - Seryna's request for justice against Nassana is fulfilled
  - Illium's political landscape shifts with Nassana's death
