event_id: turian-unification-wars
title: Turian Unification Wars
game: Mass Effect
chronological_order: 30
date: "approx. 300 BCE"
summary: |
  Long before first contact with the Citadel Council, the turians of Palaven in the
  Trebia system had grown into a single unified culture built on hierarchical
  meritocracy, civic duty and military service. By 500 BCE they had mastered
  spaceflight, pushed beyond their home system, discovered several mass relays and
  founded colonies across the galaxy. Expansion outran the Hierarchy's reach: the
  most distant colonies, run by local chieftains called Primarchs, drifted from
  central authority, grew isolated and xenophobic, and their colonists adopted
  distinctive emblems and facial markings to tell one settlement from another.

  Around 300 BCE these tensions erupted into open war between the far-flung colonies,
  fought over disputed territory and driven by nationalistic pride. The conflict,
  later named the Unification War, coincided roughly with the period in which the
  asari and salarians were forming the Citadel Council next door. The Hierarchy
  officially stayed neutral at first, holding to a strict policy of diplomacy, and
  intervened only once the mounting loss of turian life became unbearable and fewer
  than a dozen breakaway factions remained. The weakened Primarch chieftains, having
  lost popular support, were compelled to end the fighting, renew their allegiance to
  the Hierarchy and accept reunification. Animosity between colonists took decades to
  fade. Many turian outposts and colonies were destroyed in the fighting, and each
  lost colony's insignia disappeared with it.

  The war left permanent marks on turian society. Reunited, Palaven and its colonies
  prospered with the military at the centre of civic life, and the turian navy
  expanded to dozens of fleets despite the species having no external enemies. Colony
  facial markings survived into the modern era as a point of identity; going
  "bare-faced" became slang for someone untrustworthy or beguiling, and by extension
  a politician. About a thousand years later, around 704 CE, the Hierarchy made
  first contact with the Citadel Council.
characters: []
consequences:
  - Breakaway turian colonies are forced back under the authority of the Hierarchy
  - Numerous turian colonies and their insignias are destroyed and lost
  - The Hierarchy abandons strict neutrality, establishing a precedent for military intervention to preserve unity
  - Colony facial markings become a permanent feature of turian identity and culture
  - The turian military is entrenched at the centre of civic life and the navy grows to dozens of fleets
  - A unified, militarised turian state emerges that will later be recruited by the Council against the krogan
