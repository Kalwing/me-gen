event_id: emily-wong-death-los-angeles
title: Emily Wong's Last Broadcast Over Los Angeles
game: Mass Effect 3
chronological_order: 1480
date: "2186 CE"
summary: |
  Emily Wong was an investigative journalist who had worked the Citadel beat since 2183,
  repeatedly enlisting Commander Shepard's help to reach restricted areas while chasing
  stories on organized crime and official corruption, and who by 2185 had become a
  newscaster for the Future Content Corporation. When the Reapers invaded Earth in 2186,
  she was reporting from the planet for FCC News and the Alliance News Network, covering
  the sudden outage of the Sol system's comm buoys. With normal communications severed,
  she kept limited off-world contact alive by relaying short text dispatches through a
  Quantum Entanglement Communicator, providing some of the only eyewitness journalism of
  the opening hours of the invasion.

  From the Los Angeles area she witnessed a Reaper descend over the city and moved to
  El Monte Airport, where National Guard troops mounted a futile counterattack against
  the Reaper forces. Realizing that her live broadcast signal was itself attracting
  Reaper units toward the survivors around her, she attempted to escape in a sky van.
  She was shot and badly wounded in the attempt. Rather than let the pursuing Reaper
  continue, she turned the van around and flew it at ramming speed directly into the
  approaching Reaper. Her transmission cut out and she was presumed killed. Her running
  text updates during the crisis were among the last independent news to reach the wider
  galaxy from Earth before the planet went dark.
characters:
  - Emily Wong
  - Commander Shepard
consequences:
  - Emily Wong is killed ramming a Reaper with her sky van over Los Angeles
  - Some of the only firsthand journalism of the invasion's first hours reaches off-world audiences via her QEC text dispatches
  - Her death illustrates how Reapers home in on active broadcast signals
  - Earth's news coverage effectively goes silent as the Reapers overrun the planet
