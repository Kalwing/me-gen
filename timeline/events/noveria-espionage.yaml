event_id: noveria-espionage
title: "Noveria: Espionage - Wiretapping Binary Helix"
game: Mass Effect
chronological_order: 710
date: "2183 CE"
summary: |
  While on Port Hanshan investigating geth interest in Noveria's research colony, Commander Shepard is approached by Mallene Calis, an asari representing the Armali Council, in the Port Hanshan Mezzanine. Calis expresses concern about Binary Helix's biotic engineering research and proposes that Shepard help spy on the company by wiretapping one of their salespeople.

  Calis identifies Rafael Vargas, a Binary Helix salesman in the mezzanine bar area, as her target. She provides Shepard with a wiretapping device and explains her plan: Shepard should approach Vargas as a potential customer, engage him in conversation to distract him while the device injects monitoring viruses into his personal wireless network. Calis provides tactical advice, noting that Vargas is shrewd and will notice deliberate time-wasting, but that he has a tell—he rubs the back of his neck when uncomfortable—and suggests pressing him at those moments.

  Shepard can refuse the job entirely for Paragon points, accept and then abandon the mission, accept and warn Vargas about the plan (allowing Binary Helix to feed false information to the Armali Council), or fully execute the wiretap. The wiretapping requires passing only the first two persuasion checks with Vargas, after which Shepard can leave and return to Calis to collect payment. Calis rewards Shepard with 500 credits (increased to 750 if Shepard successfully charmed or intimidated her). Renegade players can lie to Calis, claiming the job was completed when it was not, and still collect the reward.

  This assignment is primarily a morality test, allowing players to demonstrate their alignment through interaction with corporate espionage and the manipulation of corporate intelligence operatives.
characters:
  - Commander Shepard
  - Mallene Calis
  - Rafael Vargas
  - Binary Helix (corporation)
  - Armali Council
consequences:
  - The Armali Council obtains intelligence on Binary Helix's biotic engineering activities, or false intelligence if Shepard warns Vargas
  - Binary Helix's personal security is compromised by monitoring viruses if the wiretap succeeds
  - Shepard earns credits and can gain morality points depending on their approach
  - The player's choice here reflects on Shepard's willingness to engage in corporate espionage and manipulation
  - If Shepard warned Vargas, Binary Helix gains an opportunity to feed disinformation to the Armali Council
