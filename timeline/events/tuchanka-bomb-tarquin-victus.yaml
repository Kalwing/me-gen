event_id: tuchanka-bomb-tarquin-victus
title: "Priority: Tuchanka - Disarming the Genophage-Project Bomb and the Death of Tarquin Victus"
game: Mass Effect 3
chronological_order: 1560
date: "2186 CE"
summary: |
  Shortly after Adrien Victus became turian Primarch during the Reaper War, he asked
  Commander Shepard to recover his son, Lieutenant Tarquin Victus, and Tarquin's
  missing 9th Platoon on Tuchanka, describing it only as a delicate political matter.
  If Garrus accompanied Shepard, he suspected Adrien had promoted Tarquin beyond his
  merit, a serious breach of turian custom.
  Shepard found Tarquin consumed by guilt. Trying to imitate his father's subtle
  tactics rather than turian brute force, he had led the platoon through narrow ruins
  to minimise casualties; when Reaper ground forces caught them with no room to
  manoeuvre, the platoon was wiped out, his caution costing more lives than it saved.
  Their objective was revealed: a massive bomb the turians had secretly planted in
  Tuchanka's Kelphic Valley after the Krogan Rebellions, a last-resort weapon to be
  used if the krogan ever rose again. Cerberus forces were moving to detonate it,
  which would ignite open war between krogan and turians and shatter the alliance
  Shepard was building for the genophage cure. Shepard persuaded Tarquin to face his
  duty and disarm the device with Shepard's support.
  During the disarming a fault blocked the normal deactivation sequence. Tarquin
  climbed the bomb to pull the detonator by hand; every lock released except one that
  could only be removed in a way that would kill whoever did it. Saying "victory, at
  any cost," Tarquin removed the final piece and fell to his death, and the bomb was
  neutralised. Per `tuchanka_bomb`, Shepard deactivated the bomb and told Urdnot Wrex
  the truth about it afterward; concealing it from Wrex was the alternative. Garrus, if
  present, observed that other turians would simply have expected such a sacrifice, but
  that Tarquin "never hesitated." Back aboard the Normandy, Primarch Victus voiced
  grief and regret for not being honest sooner, but pride that his son had died a hero
  with his men's respect, and gratitude that Shepard had given Tarquin a shot at
  redemption. Telling Wrex the truth preserved krogan trust in the alliance;
  concealment risked its later collapse.
characters:
  - Tarquin Victus
  - Adrien Victus
  - Commander Shepard
  - Garrus Vakarian
  - Urdnot Wrex
consequences:
  - The turian genophage-project bomb in the Kelphic Valley is disarmed, preventing a Cerberus-triggered krogan-turian war
  - Lieutenant Tarquin Victus dies removing the final detonator lock
  - Tarquin's entire 9th Platoon is confirmed dead
  - Per `tuchanka_bomb`, Shepard tells Wrex about the bomb, keeping krogan trust in the war alliance; hiding it is the alternative branch
  - Primarch Adrien Victus grieves but takes pride in his son dying a hero, strengthening his bond with Shepard
  - The krogan-turian-salarian alliance behind the genophage cure is preserved
  - "On success: +75 turian War Asset; on failure the bomb detonates, killing a large part of the krogan population (-300 krogan War Asset) and Eve if she survived Priority: Tuchanka"
  - Hackett debriefs Shepard and orders peace kept between Primarch Victus and the krogan leader; follow-up emails range from Wreav's threats to Wrex's mourning to Victus' gratitude
