  - Captain Wasea (Eclipse leader)
  - Niftu Cal (drugged volus)
consequences:
  - Samara's fugitive target is identified (aboard AML Demeter)
  - Eclipse Lieutenant killed by Samara
  - Eclipse base infiltrated and personnel eliminated
  - Captain Wasea and her team are killed
  - Elnora's role in Dakni Kur's murder is exposed
  - Samara swears an oath of service to Shepard
  - Samara joins the Normandy crew
  - Samara takes up residence in the Starboard Observation Deck for meditation
  - Samara becomes available for the suicide mission
  - The murder case of Dakni Kur can be resolved
