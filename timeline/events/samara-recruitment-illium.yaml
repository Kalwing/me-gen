event_id: samara-recruitment-illium
title: "Dossier: The Justicar - Samara Recruitment"
game: Mass Effect 2
chronological_order: 1080
date: "2185 CE"
summary: |
  Samara, an asari justicar—a rare member of an elite monastic order trained in advanced biotic combat and unwavering adherence to a strict code of justice—is operating on Illium, a wealthy asari colony outside normal asari space. She is hunting a fugitive, a criminal whose identity and location she refuses to disclose until her personal mission is complete.

  On Illium, Detective Anaya is investigating the murder of volus businessman Pitne For's partner, Dakni Kur. Samara is also pursuing this case, having witnessed the Eclipse mercenary organization's involvement. When Shepard encounters Samara at the crime scene, the justicar interrogates an Eclipse Lieutenant and executes her to maintain secrecy about the fugitive she is hunting. The justicar code requires her to see her mission through, and she refuses Shepard's recruitment unless the Commander first obtains the name of the ship carrying her quarry.

  Shepard investigates the murder with Anaya's assistance, discovering that Pitne For had been smuggling the illegal biotic-enhancing drug Minagen X3 and red sand to the Eclipse, and that the Eclipse had ordered Pitne For's death. Pitne For provides Shepard with an access card to infiltrate the Eclipse base. Inside, Shepard encounters Minagen canisters, a delusional drug-addled volus named Niftu Cal who believes himself a "biotic god," and the young Eclipse initiate Elnora, who confesses to the actual murder. After fighting through the Eclipse facility and contending with an A-61 Mantis Gunship, Shepard confronts Eclipse Captain Wasea, who wields heavy weaponry and hurls Minagen containers as hazards. Upon Wasea's defeat, her datapad reveals that the fugitive has fled aboard the AML Demeter.

  Shepard returns to Samara with the ship's name. The justicar swears an oath of service to the Commander for the duration of Shepard's mission, overriding her personal code and kneeling with her biotics flaring in a rare display of emotional intensity. Samara boards the Normandy and takes up meditation in the Starboard Observation Deck. The players can reward Anaya with Elnora's audio confession (establishing her innocence) or Pitne For with his shipping manifest for credits and morality points. Samara's recruitment secures a powerful biotic asset and her unwavering loyalty to Shepard's cause.
characters:
  - Samara
