event_id: leviathan-of-dis-discovery
title: Discovery and Disappearance of the Leviathan of Dis
game: Mass Effect
chronological_order: 200
date: "2163 CE"
summary: |
  In 2163 a batarian survey team exploring the Dis system found a gigantic corpse
  lying in a crater on the planet Jartar. Initially dated at nearly a billion years
  old, it was believed to be the remains of a genetically engineered starship - an
  organic vessel unlike anything in known space. There was almost no time to study
  it: shortly after the discovery a batarian dreadnought arrived in the Dis system,
  and soon afterward the corpse vanished from the crater. The Batarian Hegemony
  thereafter strenuously denied the Leviathan of Dis had ever existed, growing more
  vocal in its denials when confronted with documentation compiled by salarian
  researchers before the body disappeared.

  In truth the Hegemony had secretly transported the corpse to the batarian homeworld
  Khar'shan. As revealed in Mass Effect 3 by the batarian terrorist Balak (if he
  survived the 2183 attack on Terra Nova), the "Leviathan of Dis" was in fact the
  body of a dead Reaper. After the Terra Nova attack failed, the Hegemony
  accelerated its research on the Reaper corpse. Prolonged exposure indoctrinated
  numerous batarian scientists and government and military officials. When the
  Reapers invaded in 2186, those indoctrinated officials sabotaged the Hegemony's
  defenses, allowing the Reapers to overrun batarian space almost immediately and
  shatter its scattered navy.

  Decades later, Admiral Hackett's Task Force Aurora, led by Dr. Garret Bryson,
  studied records of the Leviathan of Dis while hunting the entity that had killed
  it - the being Bryson identified as the true Leviathan, an ancient race predating
  the Protheans that had the power to destroy Reapers.
characters:
  - Balak
  - Garret Bryson
  - Shepard
consequences:
  - A dead Reaper is recovered on Jartar and covertly moved to Khar'shan by the Batarian Hegemony
  - The Hegemony publicly denies the Leviathan of Dis ever existed
  - Batarian research on the corpse, accelerated after 2183, indoctrinates many batarian scientists and officials
  - Indoctrinated officials sabotage batarian defenses in 2186, letting the Reapers conquer batarian territory almost unopposed
  - Records of the corpse and its killer seed Task Force Aurora's later hunt for the Leviathans
