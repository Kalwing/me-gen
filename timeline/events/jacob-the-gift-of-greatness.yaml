event_id: jacob-the-gift-of-greatness
title: "Jacob: The Gift of Greatness"
game: Mass Effect 2
chronological_order: 1190
date: "2185 CE"
summary: |
  After the Horizon mission, Kelly Chambers told Commander Shepard that Jacob
  Taylor wanted to talk. Ten years earlier Jacob's father, Ronald Taylor, had
  disappeared aboard the privately held frigate MSV Hugo Gernsback, on which he
  served as first officer. A week before this conversation the ship's beacon on
  the planet 2175 Aeia had begun transmitting a distress call, and someone had
  routed the message to Jacob's personal log through Cerberus filters. Jacob asked
  Shepard to investigate for closure, and the Normandy's shuttle set the squad
  down near the wreck.

  Logs and a beacon VI revealed the fate of the crew. Captain Fairchild died in
  or just before the crash, making Ronald Taylor acting captain. The local flora
  impaired higher cognitive function when eaten. The beacon had been built about a
  year after the crash but was activated only a few weeks earlier, after nearly a
  decade of silence. The surviving officers had hoarded the ship's food supplies
  and forced the rest of the crew to eat the toxic native plants, destroying their
  minds. Five officers survived the crash but were killed within a week of one
  another once the beacon was finished; within a year every male crew member was
  dead or exiled, and the surviving women were parcelled out to officers as
  property. Shepard's squad fought feral "hunters" (former crew), LOKI and YMIR
  mechs, and brainwashed human guards while advancing to Ronald Taylor's compound,
  where he had lived for ten years as a self-styled king with a harem.

  Ronald did not recognize his son and claimed the crew had mutinied. Jacob
  confronted him; Ronald admitted he had never been ready for command and that
  telling the truth had never appealed to him. Shepard chose Ronald's fate:
  arrest by the Alliance, abandonment to the vengeful survivors, or telling Jacob
  that Jacob would shoot him, which prompted Jacob to leave his father a
  half-charged pistol. The Alliance later rescued the survivors; a recovering
  woman named Leslie emailed Shepard to thank her and Jacob. Back aboard, Jacob
  accused the Illusive Man of forwarding the signal, but Miranda Lawson revealed
  that she had sent it herself to fulfil an old promise. Completing the mission
  earned Jacob's loyalty and unlocked his Barrier power.
characters:
  - Jacob Taylor
  - Ronald Taylor
  - Commander Shepard
  - Miranda Lawson
  - Kelly Chambers
  - Leslie
  - Captain Fairchild
  - Joker
consequences:
  - Shepard discovers the fate of the MSV Hugo Gernsback and its crew on 2175 Aeia
  - Ronald Taylor's decade of tyranny over the surviving crew is exposed
  - Per Shepard's choice, Ronald Taylor is arrested by the Alliance, abandoned to the survivors, or left to take his own life
  - The Alliance rescues the surviving crew from Aeia
  - Miranda Lawson is revealed to have forwarded the distress signal to Jacob
  - Jacob Taylor becomes loyal and gains the Barrier power for the Suicide Mission
