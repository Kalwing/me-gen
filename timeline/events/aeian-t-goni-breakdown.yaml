event_id: aeian-t-goni-breakdown
title: Aeian T'Goni's Breakdown at Huerta Memorial Hospital
game: Mass Effect 3
chronological_order: 1400
date: 2186 CE
summary: |
  Aeian T'Goni was an asari huntress and commando who was part of an evacuation team sent to the human colony of Tiptree during the early Reaper invasion of 2186. She was attempting to help colonists escape when the Reapers attacked. Her friend Neaira, another asari commando, was transformed into a Banshee during the evacuation. While Aeian was showering at a human farm to freshen up during the operation, Neaira and scores of husks attacked the farm. Aeian escaped unarmed into the hills with a human girl named Hilary, approximately 15 years old (who was later revealed to be the sister of Normandy pilot Jeff "Joker" Moreau). After two days without food and minimal supplies, Aeian and Hilary returned to the farm to retrieve a radio to call for help. They found surviving farmers still alive but unaware they had been indoctrinated by the Reapers. When Hilary freed them trying to save them, the indoctrinated farmers attacked. Aeian used her biotics to fight through them and escape, but Hilary broke her leg in the process and could not remain quiet. Knowing that Hilary's whimpering would give away their position to Neaira and the husks, and that indoctrinated humans would become either husks or sleeper agents, Aeian was forced to kill Hilary to ensure their survival. She managed to escape with valuable data that earned her a military commendation. By 2186, Aeian was being treated for severe Post-Traumatic Stress Disorder at Huerta Memorial Hospital on the Citadel. She refused to shower, constantly asked if her eyes still looked normal (from the trauma of witnessing Neaira's transformation), and requested both a firearm and a transfer to a facility without humans. She suffered from intense survivor guilt, believing she was responsible for the deaths because she had lowered her guard to shower while on duty, allowing Neaira to catch her unprepared. She blamed herself for killing Hilary and the indoctrinated humans, despite knowing it was necessary for survival. When Commander Shepard encountered her, she told her story piecemeal to an asari psychotherapist. If Shepard used Spectre authority to override security restrictions and granted Aeian permission to carry a firearm, Aeian used it to commit suicide, a tragic end that devastated the hospital staff. Her death later disturbed other hospital workers, with one nurse avoiding Aeian's room because the nurse resembled Hilary and triggered Aeian's screaming episodes.
