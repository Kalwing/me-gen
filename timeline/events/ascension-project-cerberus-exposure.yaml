event_id: ascension-project-cerberus-exposure
title: Cerberus Exposure at the Ascension Project
game: Mass Effect
chronological_order: 810
date: "2183 CE"
summary: |
  Gillian Grayson, a strongly biotic autistic student at the Jon Grissom Academy, was
  the adoptive daughter of Paul Grayson, a Cerberus operative and red sand addict.
  Cerberus had placed Gillian with Grayson as a baby so he could infiltrate the
  Alliance's Ascension Project, the Academy's biotics research program. Both the
  Illusive Man and Grayson regarded Gillian as a potential "savior of humanity,"
  though this framing may have been a pretext to keep Grayson compliant. Gillian had
  likely been exposed to element zero during the Cerberus-orchestrated industrial
  "accident" on Yandoa. These events are dramatized in Drew Karpyshyn's novel
  Mass Effect: Ascension, the second Mass Effect tie-in novel, published in 2008 and
  set after humanity's post-Mars rise into galactic society.

  At the Project, Dr. Jiro Toshiwa, a hidden Cerberus agent, secretly drugged Gillian
  under the guise of boosting her biotics, which may also have worsened her condition.
  The medication let Gillian hurl fellow student Nick across a room, cause chaos in
  the cafeteria, and unleash a high-level singularity before security chief Hendel
  Mitra stunned her; a follow-up cerebrospinal dose then triggered a seizure that
  hospitalized her. Posing as a worried parent, Grayson withdrew Gillian from the
  Academy and, with Alliance researcher Kahlee Sanders and Hendel Mitra, fled to
  Omega, intending to deliver Gillian to the Illusive Man. There Grayson's former
  Cerberus partner Pel, who had turned on the organization, instead planned to sell
  Gillian to the Collectors in exchange for technology. Lemm'Shal nar Tesleya, a
  quarian on his Pilgrimage, freed the group and brought Gillian, Kahlee, and Hendel
  to the Migrant Fleet, where they were quarantined aboard a shuttle on the liveship
  Idenna and Hendel began giving Gillian one-on-one biotic training.
characters:
  - Gillian Grayson
  - Paul Grayson
  - Kahlee Sanders
  - Hendel Mitra
  - Jiro Toshiwa
  - Nick
  - Pel
  - Lemm'Shal nar Tesleya
  - the Illusive Man
consequences:
  - Cerberus's infiltration of the Ascension Project via Paul Grayson is compromised
  - Gillian Grayson is removed from the Jon Grissom Academy
  - Pel's betrayal of Cerberus and dealings with the Collectors are exposed
  - Gillian, Kahlee Sanders, and Hendel Mitra take refuge with the Migrant Fleet aboard the Idenna
  - The Illusive Man is left seeking to recover Gillian, setting up the assault on the Idenna
