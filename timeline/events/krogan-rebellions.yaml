event_id: krogan-rebellions
title: The Krogan Rebellions
game: Mass Effect
chronological_order: 50
date: 700 CE
summary: |
  The Krogan Rebellions were a decades-long war between the krogan and the Citadel
  Council that began in 700 CE. In gratitude for krogan service in the Rachni Wars,
  the Council had ceded the krogan the former rachni worlds and several pristine
  habitable planets. Lacking natural predators and breeding explosively, the krogan
  population boomed and their settlements spread "like a plague," annexing territory
  from other Citadel species. When the krogan tried to colonise the asari world Lusia
  and refused Council demands to withdraw, their representative Overlord Kredak stormed
  out of the Council chambers, daring the Council to take the worlds back by force, and
  open war broke out.

  The Council had prepared in advance, drafting elite STG operators and asari
  huntresses into the newly formed Office of Special Tactics and Reconnaissance. These
  first Spectres opened the war with crippling covert strikes: extranet viruses,
  sabotaged antimatter refineries, and command stations rammed by pre-positioned
  suicide freighters. But the krogan absorbed their losses and replaced them almost
  limitlessly, and Council victory looked impossible. The Council turned to the
  recently contacted turians, who committed their military, built hidden command
  centres such as Pinnacle Station, and pressed the krogan hard. The krogan retaliated
  by hurling asteroids at three turian colonies, rendering them uninhabitable; this
  only hardened turian resolve, since turian doctrine demanded an enemy be permanently
  neutralised. The turians obtained the salarian-engineered genophage and deployed it
  around 710 CE, collapsing krogan births. The fertile female warlord Shiagur drew the
  strongest males to her band but was killed by turian peacekeepers at the Battle of
  Canrum, the last major krogan offensive; her vengeful followers later hunted down the
  turians responsible. Besieged and dying, the krogan surrendered, though rogue
  warlords fought on or turned pirate. The turians were rewarded with a seat on the
  Citadel Council. The krogan remained deeply bitter; as Urdnot Wrex later put it,
  "to thank us for wiping out the rachni they neutered us all."
characters:
  - krogan
  - Citadel Council
  - Turian Hierarchy
  - Salarian Union
  - Overlord Kredak
  - Shiagur
  - Urdnot Wrex
consequences:
  - The krogan are militarily defeated and forced to surrender to the Citadel Council
  - The genophage is deployed against the krogan, collapsing their birth rate
  - Warlord Shiagur is killed at the Battle of Canrum
  - The turians are granted a seat on the Citadel Council for their role in ending the war
  - Rogue krogan warlords continue fighting or become pirates and mercenaries across the Terminus
  - Lasting krogan resentment toward the turians and salarians becomes a central galactic grievance
  - Three turian colonies are rendered permanently uninhabitable by krogan asteroid strikes
