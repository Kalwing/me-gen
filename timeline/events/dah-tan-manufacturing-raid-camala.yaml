event_id: dah-tan-manufacturing-raid-camala
title: "Raid on Dah'tan Manufacturing and the Murder of Jella"
game: Mass Effect
chronological_order: 220
date: "2165 CE"
summary: |
  Dah'tan Manufacturing, a batarian firm on Camala, secretly supplied equipment for
  Dr. Shu Qian's AI research facility at Sidon through the batarian aristocrat and
  entrepreneur Edan Had'dah. Jella, an underpaid clerk in Dah'tan's personnel and
  accounting department, was a disgruntled employee who routinely helped outsiders
  steal from the company by altering purchase orders and leaving inventory
  unsecured, taking payment while preferring not to know who was behind it. When an
  anonymous request - from Had'dah - asked her to disable the security system at one
  of the plant's entrances, she complied despite her suspicions.

  Because Dah'tan as a supplier could connect Had'dah's name to the Sidon project,
  Had'dah moved to sever the link. The disabled entrance let the krogan
  battlemaster Skarr and a team of Blue Suns mercenaries enter undetected. Skarr
  was specifically ordered to make certain Jella, the only inside contact tying
  Had'dah to the company, was killed. Feeling ill, Jella left her post moments
  before the attack and hid in a bathroom ventilation shaft while the mercenaries
  slaughtered the staff; Skarr killed her co-worker She'n'ya, mistaking her for
  Jella, and believed the job done. From the air shaft Jella overheard two
  mercenaries name Had'dah. The building was then demolished with explosives, but
  Jella escaped, horrifically burned and incapacitated, and was found by batarian
  rescue teams and hospitalised.

  Saren Arterius, hunting Edan Had'dah as part of his pursuit of the Sidon
  conspiracy, visited the ruined factory and then went to the hospital to see
  Jella. Though she was in a medically induced coma, Saren dismissed the staff and
  woke her to interrogate her. Despite her fatal injuries she gave him the name
  Edan Had'dah. Saren then deliberately withheld the injection that would have
  returned her to a coma and saved her life, waited for her to die, and only then
  administered the fluid to cover his tracks.
characters:
  - Jella
  - Skarr
  - Edan Had'dah
  - Saren Arterius
  - She'n'ya
consequences:
  - Dah'tan Manufacturing's Camala plant is raided and destroyed, killing most of its staff
  - The paper trail linking Edan Had'dah to the Sidon research facility is erased
  - Jella survives the raid but is left burned and incapacitated
  - Saren extracts Edan Had'dah's name from Jella, advancing his investigation
  - Saren lets Jella die and stages her death to hide his involvement
