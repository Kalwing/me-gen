event_id: mindoir-raid
title: Mindoir Raid by Batarian Slavers
game: Mass Effect
chronological_order: 270
date: "2170 CE"
summary: |
  In 2170, the human farming colony of Mindoir in the Attican Traverse is attacked by
  batarian slavers, resulting in a catastrophic loss of life and permanent trauma to
  survivors. The raiders, possibly retaliating against humanity's aggressive colonization
  of the Skyllian Verge, slaughter most of the colonists and fit the survivors with
  horrific cranial control implants designed to turn them into slaves. The attack comes
  without warning, catching the colonists off guard.

  The Systems Alliance dispatches Marines to drive back the batarians, but they find the
  enemy defenses too strong and are unable to reach the colonists in time. The Marines
  are pinned down by batarian forces, forced to watch from a distance as the colonists
  are subjected to brutality and enslavement. The helplessness of the Alliance response
  marks a defining moment of tragedy for the human colonies.

  Among the survivors is a traumatized girl named Talitha, who suffers from Stockholm
  Syndrome after the experience and considers her batarian "masters" as protectors rather
  than oppressors. For a Colonist background Shepard, the raid kills their entire family
  when an artillery strike hits their position, though the future Commander survives buried
  under rubble and is rescued by an Alliance patrol two years later, eventually enlisting
  in the military. For other Shepard backgrounds, the raid is experienced differently: a
  Spacer Shepard's mother, Captain Hannah Shepard, serves aboard the carrier SSV Einstein
  and witnesses the atrocities while responding to the attack, leaving lasting psychological
  scars. By 2183, Mindoir is rebuilt but bears the permanent mark of this tragedy.
characters:
  - Talitha
  - Ernesto Zabaleta
  - Hannah Shepard (for Spacer background)
  - Commander Shepard (for Colonist background)
  - Alliance Marines
consequences:
  - Most colonists of Mindoir are slaughtered
  - Survivors are implanted with cranial control devices and enslaved
  - Talitha is enslaved and develops Stockholm Syndrome
  - Colonist background Shepard's family is killed; Shepard survives under rubble
  - Spacer background's Hannah Shepard witnesses the massacre from the Einstein
  - Alliance Marine response is too slow and unable to prevent the atrocity
  - Mindoir becomes a symbol of batarian aggression against human colonies
  - The colony is eventually rebuilt but remains economically damaged
  - The raid may have been batarian retaliation for human colonial expansion
  - Survivor trauma shapes Shepard's motivation and background
