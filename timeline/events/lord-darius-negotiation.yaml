event_id: lord-darius-negotiation
title: Lord Darius Negotiation on Nonuel
game: Mass Effect
chronological_order: 650
date: "2183 CE"
summary: |
  During the hunt for Saren, a mostly Renegade Commander Shepard is dispatched by
  Admiral Hackett to the Plutus system of the Hades Gamma cluster to deal with the
  self-styled "Lord" Darius, a human warlord whose base on Nonuel sits atop a
  secondary source of element zero. Darius has been using that position to extort
  the Systems Alliance, and has launched "punitive" raids on Alliance eezo miners
  working an asteroid he claims lies in his territory.
  Darius is hostile from the moment Shepard arrives. He demands to be addressed as
  "Lord," an Alliance apology for the "illegal" mining, equipment and fees to let
  him manufacture red sand, a share of any eezo extracted from his claim, and for
  Shepard to say "please." He offers an OSD formalizing the arrangement if Shepard
  accepts every condition. Shepard may object to only one demand before Darius
  breaks off talks and orders his retainers to attack, or Shepard can simply open
  fire at any point.
  If Shepard challenges him, Darius reveals that his syndicate was once an Alliance
  asset: after batarian forces were pushed out of the Skyllian Verge, the Alliance
  armed his organization, the strongest in the region, to seize control and
  stabilize it. He believes the Alliance is now reneging on that bargain because of
  his eezo racket and drug trade. Reporting back afterward, Shepard understands that
  Hackett anticipated and wanted Darius dead, remarking that Shepard is not the only
  one who does whatever is necessary to get a job done.
  The encounter typically ends in a firefight in which Darius and his retainers are
  killed, though Shepard can choose to accede to his terms and leave him alive and
  in power.
characters:
  - Lord Darius
  - Commander Shepard
  - Admiral Hackett
consequences:
  - Shepard is drawn into an Alliance black operation to eliminate a former proxy warlord
  - If Darius is killed, later pirate efforts to halt Alliance eezo mining in the region fail
  - If Darius is spared, his demands inflate the price of element zero
  - Confirms the Alliance armed Darius's syndicate to fill the power vacuum after batarians were driven from the Skyllian Verge
  - Restored Galactic News reports in the Legendary Edition cover either outcome
