event_id: morning-war
title: The Morning War (Geth War)
game: Mass Effect 3
chronological_order: 90
date: "1895 CE"
summary: |
  The Morning War, known to the wider galaxy as the Geth War, was the conflict between
  the quarians and their created servants, the geth. The quarians built the geth
  sometime before 1895 CE as cheap labor and a military force. To let geth units
  perform complex tasks unsupervised, the quarians allowed each geth program to share
  data across an advanced neural network. As the geth population grew, this networking
  made the collective increasingly intelligent, and the geth approached true sapience.
  According to Legion, in the quarian year 2485 a geth overseer named Hala'Dama was
  asked by a geth whether it had a soul and what its purpose was; she was not the
  first quarian to be asked, but the first to react with fear.

  Recognizing that the geth had become a genuine artificial intelligence, the quarian
  Conclave ordered the immediate termination of all geth programs. A minority of
  quarians opposed the decision, arguing their society depended on the geth and that
  questioning one's own existence was no crime. When the now-sentient geth realized
  what was happening, they retaliated, at first only taking up arms to protect units
  that could not defend themselves. The quarian government imposed martial law and
  hunted even non-hostile geth, while dissenting quarians who sheltered geth were
  detained or killed. The opposition was overwhelmed and all-out war erupted.

  The geth won within a year, overrunning the quarian colonies and the homeworld
  Rannoch and inflicting a near-genocide that killed all but a few million quarians,
  less than one percent of the pre-war population. Outlying scientific outposts of
  minimal military value fell fast: the quarian colony on Haestrom in the Dholen
  System, established before the revolt to study the parent star's premature slide
  toward becoming a red giant, was poorly defended and was lost to the geth in 1896
  CE, after which all communication from its surface ceased. The survivors of the war
  fled aboard their starships and formed the Migrant Fleet. The geth did not pursue
  them, uncertain of the consequences of exterminating their own creators, and instead
  withdrew into isolation behind the Perseus Veil, destroying vessels that entered
  their space for the next three centuries. Legion implied the geth felt remorse,
  tending abandoned quarian buildings like a cemetery and archiving the sacrifice of
  the quarians who had opposed the termination order.
characters:
  - Legion
  - Commander Shepard
  - EDI
  - Hala'Dama
consequences:
  - The geth gain independence and control of Rannoch and the former quarian colonies
  - Millions of quarians are killed; the survivors become the nomadic Migrant Fleet
  - The quarian colony on Haestrom falls to the geth in 1896 CE and goes silent
  - The Citadel Council strips the quarians of their embassy as punishment for creating AI
  - The geth seal themselves behind the Perseus Veil for roughly 300 years
  - The Citadel stations a watch fleet at the Veil expecting an attack that never comes
  - A later treaty forbids the quarians from attacking the geth
  - Long-term quarian ambition to retake Rannoch sets up the ME3 geth-quarian war
