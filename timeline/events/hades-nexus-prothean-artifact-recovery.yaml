event_id: hades-nexus-prothean-artifact-recovery
title: "Hades Nexus Prothean Artifact Recovery for the Crucible"
game: Mass Effect 3
chronological_order: 1690
date: "2186 CE"
summary: |
  During the Reaper War, with the Crucible under construction, Commander Shepard
  recovered two Prothean artifacts from the contested Hades Nexus cluster and turned
  them over to Alliance researchers on the Citadel. Both fetch missions became
  available after Priority: The Citadel II, but the Hades Nexus itself could only be
  entered after Priority: Rannoch and the resolution of the geth-quarian war, by
  which point it was hostile territory.

  In the first case, a researcher sitting in the Presidium Commons Courtyard, near
  the Meridian Place billboard and General Septimus Oraka's bench, needed the
  Obelisk of Karza for the Crucible project; his dig team had run out of time and
  the artifact now lay in off-limits territory. Shepard scanned the moon Kopis in
  the Hoplos system to recover it. The obelisk contained Prothean language
  translations and was likened to a Rosetta Stone for deciphering Prothean writing.

  In the second case, a refugee begging a turian guard for food in Bay E28 of the
  Docks Holding Area traded the location of Prothean ruins on Gei Hinnom in the
  Sheol system. Shepard scanned Gei Hinnom to recover a Prothean sphere and
  authorized the refugee to sell it to the Alliance; he used the money to buy food
  for his family and for others stranded on the Citadel. Either artifact could also
  turn up during a routine Search and Rescue scan, logging initially as a Citadel
  assignment. Delivering each artifact granted reputation, 15,000 credits, and an
  upgrade to the Alliance Engineering Corps war asset feeding the Crucible effort.
characters:
  - Commander Shepard
  - Septimus Oraka
consequences:
  - The Obelisk of Karza (a Prothean language key) is delivered to Crucible researchers on the Citadel
  - A Prothean sphere is recovered from Gei Hinnom and sold to the Alliance
  - The Alliance Engineering Corps war asset is upgraded twice, strengthening the Crucible project
  - A stranded Citadel refugee uses the proceeds to feed his family and other trapped civilians
