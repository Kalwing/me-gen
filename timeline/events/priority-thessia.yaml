event_id: priority-thessia
title: "Priority: Thessia - The Fall of Thessia"
game: Mass Effect 3
chronological_order: 1720
date: "2186 CE"
summary: |
  Acquired automatically after Priority: The Citadel III, this mission takes Commander
  Shepard to the asari homeworld Thessia. With the Reapers devastating asari space,
  Asari High Command finally discloses a long-hidden Prothean artifact housed in a
  temple to the goddess Athame that may reveal the location of the Catalyst. Shepard,
  Liara T'Soni, and a third squadmate (Javik's commentary is notable if he is brought)
  land in an active war zone where asari commandos under an officer named Kurin are
  barely holding a defensive line. The team fights through heavy Reaper forces -
  Banshees, Brutes, Ravagers, Marauders, Harvesters and Husks - and passes close by a
  capital-scale Reaper walking through the ruins. Kurin eventually pulls her surviving
  soldiers out against orders.
  Reaching the temple, Shepard finds the science team dead. Liara triggers a concealed
  Prothean beacon containing a VI called Vendetta, a construct left from the previous
  cycle. Vendetta reveals that the asari secretly built their technological, cultural
  and military lead on studying this forbidden Prothean cache in violation of Council
  law, and confirms that the Catalyst needed to complete the Crucible is the Citadel
  itself. Before the VI can finish, Kai Leng arrives, having tracked the team, and
  fights Shepard. Though beaten back, Leng uses a Reaper's arrival as a distraction to
  knock Shepard down, seize Vendetta and the Catalyst data for the Illusive Man, and
  escape aboard his gunship, which levels the Temple of Athame as it departs. Back on
  the Normandy, a defeated Shepard reports the loss to the asari Councilor, and the
  squad gathers in the War Room to work out where Cerberus has taken the data. Thessia
  falls to the Reapers.
characters:
  - Commander Shepard
  - Liara T'Soni
  - Kai Leng
  - The Illusive Man
  - Kurin
  - Councilor Tevos
  - Javik
consequences:
  - Thessia falls to the Reapers with catastrophic asari casualties
  - The asari admit their advantage was built on a hidden, illegal Prothean archive
  - The Prothean VI Vendetta confirms the Catalyst is the Citadel
  - Kai Leng steals Vendetta and the Catalyst data for Cerberus and destroys the Temple of Athame
  - Shepard's investigation turns toward Cerberus, leading to Sanctuary on Horizon and then Cerberus Headquarters
  - Liara is devastated by the loss of her homeworld
