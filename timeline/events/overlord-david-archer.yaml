event_id: overlord-david-archer
title: 'Overlord: Project Overlord and David Archer'
game: Mass Effect 2
chronological_order: 910
date: 2184 CE
summary: "Project Overlord was a Cerberus research initiative located on the planet\
  \ Aite, centered in a series of research facilities designated Hermes, Vulcan, Prometheus,\
  \ and Atlas Stations. The project's objective was to merge a human mind with a VI\
  \ to create a hybrid entity that could command and control geth forces, inspired\
  \ by observations of how Saren Arterius had led the geth in the Battle of the Citadel.\
  \ Dr. Gavin Archer, the project's chief scientist, recruited his younger brother\
  \ David Archer—a high-functioning autistic savant with extraordinary mathematical\
  \ abilities—as the human component of the experiment.\n\nThe project only partially\
  \ succeeded. David Archer, despite his mathematical genius, was overwhelmed by the\
  \ VI's consciousness. The resulting hybrid became essentially a virus that took\
  \ control of the facility and used acquired geth units to kill off Cerberus staff\
  \ across all four stations. The rogue VI attempted to leave Aite through the facility's\
  \ communication dish to potentially subvert every computer in the galaxy accessible\
  \ by the extranet. When a communication attempt was blocked, the VI spread throughout\
  \ the Aite facility systems, effectively trapping itself and forcing Commander Shepard\
  \ to be sent to contain the threat.\n\nShepard overrode security lockdowns at Vulcan\
  \ and Prometheus Stations, then infiltrated Atlas Station's core. There Shepard\
  \ discovered David Archer hooked up to the VI core via intrusive tubes and clamps,\
  \ begging for mercy. Shepard destroyed the rogue VI and was forced to make a critical\
  \ choice about David's future. Dr. Archer argued the experiment must continue, but\
  \ Shepard could either free David and have him placed in the care of Jon Grissom\
  \ Academy, or allow Cerberus to continue the experiments. This choice had lasting\
  \ consequences that would manifest during the Reaper War.\n"
characters:
- Commander Shepard
- David Archer
- Dr. Gavin Archer
- The rogue VI
- Cerberus staff and security
- Geth units
consequences:
- Rogue VI destroyed before it could escape Aite (per `overlord`)
- If David sent to Grissom Academy: David survives the project, is rescued during
    Cerberus attack on the academy in ME3, assists in building the Crucible, and earns
    respect of scientists with his theories
- If experiments continue: David becomes catatonic, Dr. Archer euthanizes him out
    of mercy and regret, and flees Cerberus with project data
- "Dr. Gavin Archer's fate depends on player choice—either regretful and defected,\
  \ or complicit in his brother's death"
- Project Overlord facilities destroyed or shut down
- Cerberus loses geth control research but gains data from the project
- David's survival or death affects ME3 Grissom Academy mission and Crucible development
