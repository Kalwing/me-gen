event_id: suicide-mission
title: The Suicide Mission
game: Mass Effect 2
chronological_order: 1310
date: "2185 CE"
summary: >
  After acquiring a Reaper IFF and repelling a Collector boarding action that carried
  off the Normandy's non-combat crew, Commander Shepard took the Normandy SR-2 through
  the Omega 4 Relay to the Collector Base, a station on the accretion disk of a black
  hole in the galactic core. The ship survived the Collectors' Oculi and security
  systems, destroyed an intercepting Collector Cruiser, and crash-landed on the base.
  The assault ran in three segments. In "Infiltration," Shepard sent a tech specialist
  (ideally a loyal Legion, Tali, or Kasumi) through a thermal vent while a second
  fire-team leader (ideally Garrus, Miranda, or Jacob) ran a diversion; a non-ideal or
  non-loyal choice for either role got the vent specialist killed. In "The Long Walk,"
  the squad reached the pods holding the abducted crew and colonists: whoever occupied
  the first opened pod was liquefied (Lilith of Horizon if Shepard rushed the mission,
  Yeoman Kelly Chambers if Shepard had delayed). The whole crew, half, or only Dr.
  Chakwas survived depending on how many missions Shepard ran after the abduction
  (`iff_delay`); assigning a squadmate to escort the survivors back to the ship saved
  the crew but pulled that squadmate from the finale, while sending no escort doomed the
  crew. The squad then advanced under a biotic barrier held by a biotic specialist
  (ideally a loyal Samara, Jack, or Morinth); a weak choice meant the rear-guard
  squadmate was carried off by Seeker Swarms in a fixed death order. A non-ideal second
  fire-team leader was shot dead on reaching the door. In "Final Battle," Shepard picked
  a squad and left the rest to hold the line; if that holding force's collective defense
  value was too low, members died in a fixed order starting with the non-loyal (Mordin
  first if present). Shepard destroyed the four feeding tubes of a Human-Reaper larva
  built from thousands of liquefied humans, dropping it into the chasm. The Illusive Man
  then asked Shepard to preserve the base with a radiation pulse instead of destroying
  it (`collector_base`): destroying it is the Paragon option, preserving it Renegade.
  The reactivated Human-Reaper was destroyed a second time, and the Normandy outran the
  base's end. If Shepard alone survived, Joker failed to pull the Commander aboard and
  Shepard fell to their death. Afterward Joker handed Shepard Reaper schematics as a
  fleet of Reapers was shown advancing on the Milky Way.
