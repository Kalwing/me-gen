consequences:
  - The Collector threat to human colonies ended; the Collectors were effectively wiped out as a force.
  - A Human-Reaper larva under construction from abducted humans was destroyed.
  - >
    Per `iff_delay` / `kelly_chambers`: the abducted Normandy crew were rescued whole,
    partially (only some, including Chakwas), or reduced to Dr. Chakwas alone, based on
    how long Shepard delayed after installing the Reaper IFF; the first pod victim
    (Lilith or Kelly Chambers) was always liquefied.
  - >
    Per `suicide_mission` / `loyalty_missions`: any combination of squadmates could die
    — the vent tech, the biotic specialist, either fire-team leader, the crew escort,
    the members left to hold the line, and finally Shepard — determined by loyalty
    status and role assignments; with all squad loyal and ideal assignments, everyone
    survives.
  - If only Shepard survived the mission, Shepard died falling back to the Normandy and the Illusive Man was met by Joker instead.
  - >
    Per `collector_base`: the base was destroyed (radiation-and-explosion, Paragon) or
    preserved intact via a radiation pulse handed to Cerberus (Renegade). Destroying it
    left the Illusive Man furious; preserving it left him pleased.
  - >
    In Mass Effect 3 the choice yields a War Asset from the salvaged Human-Reaper: a
    Reaper Brain (Military Strength 110, favors Control) if preserved, or a Reaper Heart
    (Military Strength 100, favors Destroy) if destroyed; Cerberus built the remains into
    Cronos Station regardless.
  - Surviving squadmates return or become War Assets in Mass Effect 3; the death of Legion or Tali makes a peaceful end to the geth-quarian war impossible.
  - Shepard obtained a datapad of Reaper schematics, and the imminent Reaper invasion of the Milky Way was revealed.
