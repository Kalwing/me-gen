event_id: legion-a-house-divided-heretic-station
title: 'Legion: A House Divided - The Heretic Station'
game: Mass Effect 2
chronological_order: 1300
date: 2185 CE
summary: 'After the geth platform Legion is reactivated aboard the Normandy SR-2, it warns Commander Shepard
  that the geth heretics have adapted a Reaper virus. If uploaded to the wider geth consensus, the virus
  would rewrite the mainstream geth''s logic and compel every geth to join the heretics'' war against
  organic life. Legion asks Shepard to help stop it. Using the Normandy''s stealth systems, the squad
  reaches the heretics'' station - once the quarian station Haratar, in the Sea of Storms - undetected.
  Fighting through geth troopers, hunters, primes and rocket troopers in a low-gravity, airless interior,
  Shepard reaches the station core, where Legion has prepared two options and defers the decision to Shepard
  (per `legion_loyalty`). Shepard can upload a counter-virus that rewrites the heretics, reprogramming
  them to abandon the Reapers and rejoin the true geth, or trigger the station''s destruction, killing
  the heretics outright. A three-minute countdown follows and the squad escapes by shuttle. Completing
  the mission secures Legion''s loyalty. The outcome shifts Mass Effect 3 war assets: rewriting the heretics
  strengthens the geth fleet and weakens the quarians, while destroying them does the reverse; if Shepard
  later brokers peace at Rannoch the net total is the same either way.'
characters:
- Legion
- Commander Shepard
consequences:
- Legion becomes a loyal squad member
- The heretic geth's Reaper virus is neutralised before it can be uploaded to the consensus
- 'Per `legion_loyalty`: the heretics are either rewritten and folded back into the true geth, or destroyed
  with their station'
- Rewriting boosts the Geth Fleet war asset and reduces Quarian war assets in Mass Effect 3; destruction
  reverses this
- If peace is brokered between geth and quarians at Rannoch, the combined war-asset value is identical
  for both choices
