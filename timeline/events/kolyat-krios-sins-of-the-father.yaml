event_id: kolyat-krios-sins-of-the-father
title: "Thane: Sins of the Father"
game: Mass Effect 2
chronological_order: 1100
date: "2185 CE"
summary: >
  Aboard the Normandy SR-2, the drell assassin Thane Krios learned that his
  estranged son, Kolyat, had surfaced on the Citadel and taken a contract to kill.
  Thane, dying of the wasting disease Kepral's Syndrome and estranged from Kolyat
  since the murder of his wife Irikah, asked Commander Shepard to help him reach the
  boy before he became a killer. On the Citadel, C-Sec Captain Bailey helped trace
  the contract. Shepard and Thane pressed Kolyat's contact Mouse, who named the
  human crime boss Elias Kelham as the man who had hired Kolyat. Kelham, a
  small-time racketeer at Shin Akiba who had risen after Sovereign's 2183 attack
  killed off the Citadel's senior crime bosses and who paid Bailey for protection,
  was brought in for interrogation in the Zakera Ward C-Sec office. Depending on
  Shepard's approach - immediate Spectre intimidation, physical force, guile, or a
  bribe - Kelham revealed that Kolyat's target was Joram Talid, a turian politician
  running for office on an anti-human platform. Shepard shadowed Talid across the
  Wards while Thane moved to intercept. Kolyat's attempt failed; he wounded a
  bodyguard and fled to an apartment, where Shepard subdued him and Thane confronted
  his son. Kolyat was taken into C-Sec custody and father and son began, haltingly,
  to reconcile - securing Thane's loyalty and setting up their reunion in 2186.
characters:
  - Thane Krios
  - Kolyat Krios
  - Commander Shepard
  - Elias Kelham
  - Bailey
  - Mouse
  - Joram Talid
consequences:
  - Kolyat's assassination of Joram Talid was prevented
  - Kolyat was taken into C-Sec custody rather than becoming a killer
  - Thane and Kolyat began to reconcile; Thane became loyal to Shepard
  - Elias Kelham was exposed as the man behind the contract and left in C-Sec hands
  - The reconciliation set up Kolyat's presence at Thane's deathbed in 2186
