consequences:
- If Virmire survivor has high trust (4+): They stand with Shepard, order Udina to
    step back, Udina shoves Councilor and raises a gun, and either Shepard or the
    survivor shoots Udina (per `citadel_coup`)
- If Virmire survivor has mid trust (0-3): Shepard must convince them with a Paragon
    interrupt; if successful, they stand with Shepard; if not, they order Shepard
    to stand down
- If Virmire survivor has low trust (<0): They refuse to trust Shepard, order the
    Councilor to escape, and Shepard is forced to shoot them or allow a squadmate
    to do so
- Donnel Udina is shot and killed (either by Shepard or the Virmire survivor)
- Citadel Council physically rescued from Cerberus forces
- Kai Leng abandons the coup when he realizes mission failure
- C-Sec reinforcements arrive to retake the Citadel
- Control of the Citadel returned to the Council and C-Sec
- Cerberus coup completely fails
- If the Virmire survivor survives: They can either rejoin Shepard's squad or remain
    with Admiral Hackett's team; optionally resume romance with Shepard
- If the Virmire survivor is killed: Their name appears on the Normandy memorial wall
- Cerberus clone of Shepard neutralized and killed at the Citadel Docks
- Normandy SR-2 recovered from Cerberus control
- Samantha Traynor reinstated to active duty
- Shepard's cabin furnishings restored (previously dumped by clone)
- Maya Brooks arrested or killed
- Citadel Docks secured by Alliance forces
- Preparation begins for Joker's celebration party aboard the Normandy
