event_id: cerberus-coup-citadel-ashley
title: 'Priority: The Citadel II - Cerberus Coup and the Virmire Survivor'
game: Mass Effect 3
chronological_order: 1660
date: 2186 CE
summary: "Following the destruction of Arcturus Station and the Alliance Parliament,\
  \ Councilor Donnel Udina became the most powerful remaining political figure in\
  \ the Systems Alliance government. Desperate to retake Earth and frustrated by the\
  \ Council's refusal to grant him emergency powers and direct Citadel forces to the\
  \ Alliance's aid, Udina negotiated a deal with Cerberus. The plan was to stage a\
  \ bloodless coup: arrest the Council and force them to grant Udina emergency authority\
  \ to command the Citadel Fleet to Earth.\n\nWhen the Salarian Councilor discovered\
  \ Udina's betrayal, the coup rapidly deteriorated into a massacre. Cerberus operatives,\
  \ led by assassin Kai Leng, stormed the Citadel, issuing martial law and murdering\
  \ both C-Sec officers and civilians. Kai Leng pursued the Council members as they\
  \ attempted to escape. However, Commander Shepard intercepted Leng at the elevator\
  \ leading to the Council's escape shuttle, which Cerberus had already destroyed,\
  \ trapping the Councilors inside.\n\nWhen Shepard entered the elevator shaft, they\
  \ confronted Udina, the three Councilors, and the Virmire survivor (either Gunnery\
  \ Chief Ashley Williams or Staff Lieutenant Kaidan Alenko), who was serving as the\
  \ Council's bodyguard. Udina attempted to frame Shepard as Cerberus's accomplice,\
  \ using fabricated video evidence and editing of the Salarian Councilor's death.\
  \ In response, Udina tried to override the elevator doors to let in Cerberus operatives.\
  \ The Asari Councilor physically interfered, and Udina violently shoved her aside\
  \ while brandishing a pistol—creating the critical moment of decision.\n\nThe Virmire\
  \ survivor's trust in Shepard—built or eroded over their interactions across all\
  \ three games—determined the outcome. Per `citadel_coup`, multiple factors influenced\
  \ whether the survivor sided with Shepard or Udina: whether Shepard had romanced\
  \ them in ME1, whether Shepard had cheated on them in ME2, whether Shepard had saved\
  \ the Council, whether close companions survived to present, whether Shepard was\
  \ kind during Priority: Mars, hospital visits, and admission of past wrongs. A trust\
  \ threshold of 4+ resulted in automatic loyalty; below 0 meant they would turn against\
  \ Shepard; between 0-3 required a Paragon interrupt to convince them to stand down.\n\nIn\
  \ the aftermath, while Shepard was granted mandatory shore leave by Joker, a Cerberus\
  \ clone of the Commander—created in the weeks before the coup—executed a separate\
  \ operation to seize control of the Normandy SR-2. The clone, operating through\
  \ intermediaries and mercenary group CAT6, attempted to obtain Shepard's Spectre\
  \ codes and command authority. During a confrontation at a sushi restaurant on the\
  \ Silversun Strip, the clone's operative Brooks and a team of CAT6 mercenaries engaged\
  \ Shepard and allies, but the original Commander escaped. The clone then used the\
  \ stolen Spectre codes to breach the Citadel Archives, setting a trap that resulted\
  \ in Shepard's squad being locked in an iridium vault. Escaping the vault, Shepard\
  \ pursued the clone to the Citadel Docks.\n\nAt the docking bay, Shepard boarded\
  \ the Normandy as it was launching, fighting through waves of CAT6 mercenaries (Heavies,\
  \ Snipers, Specialists) and Disruption Drones. Communications Specialist Samantha\
  \ Traynor, who had been relieved of duty by the clone under false pretenses, assisted\
  \ Shepard in breaching the sealed airlock using her mass-effect toothbrush. Inside\
  \ the ship, Shepard's squad fought through the CIC toward the Cargo Bay, where the\
  \ clone—now wearing full N7 armor—made its stand. As the Normandy attempted to launch\
  \ from the Citadel, the showdown escalated into a two-stage fight between the original\
  \ and clone Shepard, with Brooks providing sniper support. Shepard's loyal squadmates\
  \ and pilot Cortez, working with Joker, managed to prevent the ship's FTL jump,\
  \ leaving the shuttle bay doors open. During the final melee, both Shepards tumbled\
  \ toward the open bay doors. Shepard's crew—\"the emotional baggage\" the clone\
  \ had dismissed—pulled the original Commander to safety, while the clone, refusing\
  \ aid and realizing it lacked what made Shepard truly human, fell to its death.\
  \ Brooks was either arrested or killed depending on Shepard's final choice. With\
  \ the threat neutralized, control of the Normandy was restored to Shepard, and Joker\
  \ began planning a celebration with Traynor, EDI, Cortez, and other crew members.\n"
