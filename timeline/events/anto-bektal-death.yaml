event_id: anto-bektal-death
title: Death of Anto Bek'tall
game: Mass Effect 3
chronological_order: 1880
date: "2186 CE"
summary: |
  Anto Bek'tall, a batarian bodyguard and loyal second-in-command to Aria T'Loak on Omega, is killed during the final assault on the Afterlife Club when Aria attempts to confront General Oleg Petrovsky. Throughout the conflict over Omega, Anto serves as Aria's trusted assistant, managing Omega Control and coordinating defenses against the Cerberus occupation. When Aria boards the Cerberus warship Elbrus to directly confront Petrovsky, Anto remains behind in Omega Control. Upon learning that the Elbrus has crossed the Omega 4 Relay and abandoned Omega, Anto assumes Aria is dead or transformed into an Adjutant. He begins planning to assume leadership of Omega, but his scheme is interrupted by Colonel Raymond Ashe, who slaughters the operators in Omega Control. In Aria's absence, Anto attempts unsuccessfully to unite Omega's various factions against the Cerberus occupation, but cannot prevent infighting. When Aria returns and rallies Omega's forces, Anto resumes his role as her loyal assistant. During the final push toward the Afterlife Club to confront the Illusive Man, Aria orders Anto to contact the mysterious figure. When Anto does not respond, Aria discovers him in the club being attacked by an Adjutant that Colonel Ashe had smuggled into the building in stasis. The Adjutant kills Anto before Aria can intervene, robbing him of his final moment with his longtime commander.
characters:
  - Anto Bek'tall
  - Aria T'Loak
  - Commander Shepard
  - General Oleg Petrovsky
  - Colonel Raymond Ashe
  - Adjutant
consequences:
  - Anto Bek'tall is killed by an Adjutant in the Afterlife Club
  - Aria T'Loak loses her most trusted henchman and second-in-command
  - The death demonstrates Cerberus's ruthlessness in setting traps
  - The Adjutant's presence in Afterlife is revealed as part of Ashe's contingency plan
  - Aria becomes enraged following Anto's death, driving her forward in the final confrontation
