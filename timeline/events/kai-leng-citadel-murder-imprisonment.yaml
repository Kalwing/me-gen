  - The Illusive Man
consequences:
  - Kai Leng receives the N7 designation in 2176
  - Kai Leng murders a krogan on the Citadel and is convicted of first-degree murder
  - Kai Leng is dishonorably discharged from the Alliance and sentenced to 20 years in prison
  - Cerberus breaks Kai Leng out of prison
  - The Illusive Man makes Leng his most trusted assassin for over a decade
  - Leng is fitted with Cerberus Phantom-class cybernetic implants
