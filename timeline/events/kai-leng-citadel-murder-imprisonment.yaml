event_id: kai-leng-citadel-murder-imprisonment
title: "Kai Leng's Citadel Murder, Discharge, and Recruitment by Cerberus"
game: Mass Effect 3
chronological_order: 330
date: "2176 CE"
summary: |
  Kai Leng, Earth-born of Chinese and Russian/Slavic heritage, enlisted in the
  Systems Alliance military on November 14, 2172 at the age of sixteen, using faked
  credentials. Over the next several years he built a decorated but troubling combat
  record: Terminus Systems and Exodus Cluster patrols in 2172-2173 (during which he
  was reprimanded for stripping medals from dead enemy officers), the Raid of Entiyon
  in 2174 for which he was recommended for the Systems Alliance Medal of Valor, and
  tactical reconnaissance in the Kite's Nest in 2175, after which he was accepted into
  the Interplanetary Combatives Academy. In 2176 he received the coveted N7
  designation from the Academy.
  That same year, while on leave, Leng killed a krogan in a bar fight on the Citadel
  using a standard-issue service blade. He was convicted of first-degree murder,
  dishonorably discharged from the Alliance, and sentenced to twenty years in an
  Alliance prison. His xenophobic temperament and combat prowess had already drawn
  the attention of the Illusive Man, and Cerberus arranged his liberation from
  prison. The Illusive Man then employed Leng for over a decade as his most trusted
  wet-work operative and assassin, valuing him as ruthless, discreet, and methodical.
  Leng was fitted with Cerberus cybernetics, including Phantom-class implants, and
  came to fight with a tactical cloak, a palm-mounted kinetic barrier projector, a
  gauntlet projectile weapon, and a sword resembling a ninjatō. This recruitment set
  up his later career: assignments alongside the agent Rasa in Mass Effect: Foundation,
  the capture of Paul Grayson and the killing of Liselle in Mass Effect: Retribution,
  and his role as Cerberus's chief assassin against Commander Shepard during the
  Reaper War.
characters:
