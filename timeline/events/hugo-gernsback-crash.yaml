event_id: hugo-gernsback-crash
title: Hugo Gernsback Crash on 2175 Aeia
game: Mass Effect 2
chronological_order: 310
date: 2173 CE
summary: |
  The MSV Hugo Gernsback, a privately held frigate, was sent on a survey mission to the recently discovered planet 2175 Aeia in the Alpha Draconis System. The planet had been detected by humans as an Earth-type world in 2165 and appeared to be a garden world with lush vegetation, fresh water, and breathable atmosphere suitable for colonization. Commanded by Captain Harris Fairchild with First Officer Ronald Taylor, the Gernsback was not rated for suborbital descent but was ordered to make planetfall anyway. While approaching the planet in 2173, the ship was struck by an unspecified impactor that damaged its sublight drive, leaving it unable to control its descent. The ship crash-landed on Aeia's surface, killing the captain and several crew members. Ronald Taylor was promoted to acting captain and survived on the surface with the remaining crew. The ship's distress beacon was activated a year after the crash and transmitted for 358 days before Taylor deactivated it. The beacon was later reactivated after eight years, allowing Commander Shepard to discover the crash site in 2185 during Jacob Taylor's loyalty mission. The survivors had suffered neural decay from consuming the native vegetation and transformed into hostile feral creatures. Taylor, the father of Jacob Taylor (later a Cerberus operant), kept his crew under control through brainwashing until Shepard's intervention.
