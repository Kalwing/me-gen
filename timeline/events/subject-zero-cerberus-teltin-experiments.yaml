event_id: subject-zero-cerberus-teltin-experiments
title: "Subject Zero: Cerberus' Teltin Experiments on Pragia"
game: Mass Effect 2
chronological_order: 240
date: "approx. 2165-2178 CE"
summary: |
  Jack, birth name Jennifer and later self-styled "Jack," was born in 2161 with
  unusual biotic potential caused by accidental in-utero element zero exposure. In
  2165 Cerberus operatives abducted her as an infant, reportedly from Eden Prime,
  and told her mother the child had died. She was taken to the Teltin facility on
  Pragia, in the Dakka system of the Nubian Expanse, where a Cerberus research
  program sought to maximize human biotic potential regardless of cost.

  Designated Subject Zero, Jack became the sole focus of the research. Other
  abducted biotic children were treated as expendable: lethal or risky
  enhancements were tested on them first, and only beneficial results were applied
  to her. Scientists tortured her physically and psychologically to study how pain
  and stress affected biotic ability, kept her behind a soundproofed one-way
  mirror where she could see and hear the other children but not the reverse, and
  forced her into gladiatorial fights against them. She was shocked for hesitating
  and injected with narcotics for killing without hesitation, conditioning her to
  associate killing with euphoria. The other children came to hate her as the
  source of their suffering. The abuse made her one of the most powerful human
  biotics alive while still very young.

  Eventually the subjects rioted during a transfer, damaging the facility and
  freeing Jack, who flew into a blind fury and killed nearly everyone present,
  including a distraught doctor, before stealing a shuttle and escaping into the
  Dakka system. The Illusive Man later claimed the site had "gone rogue" and
  ordered it shut down; clean-up crews found the guards and most subjects dead,
  gave the surviving children amnesic treatments, and delivered them to the
  Alliance as "slaver attack" survivors. A passing ship that picked up Jack used
  her and sold her into slavery, beginning a decade of piracy, gang membership,
  and imprisonment that ended aboard the Blue Suns prison ship Purgatory. The
  Teltin facility's records and Jack's own memories are uncovered in 2185 during
  her loyalty mission, Jack: Subject Zero.
characters:
  - Jack
  - The Illusive Man
  - Aresh
consequences:
  - Jack is transformed into one of the most powerful human biotics alive
  - Cerberus kills numerous abducted biotic children at Teltin
  - The facility riot leaves most staff and subjects dead; Jack escapes off-world
  - The Illusive Man shuts Teltin down and disowns it as "gone rogue"
  - Surviving children are given amnesiacs and passed to the Alliance as slaver-attack survivors
  - Jack is sold into slavery, beginning years of violent crime and imprisonment
  - Jack's lifelong hatred of Cerberus and her survivor's psychology are established
