event_id: priority-sur-kesh
title: "Priority: Sur'Kesh - Rescuing the Female Krogan"
game: Mass Effect 3
chronological_order: 1530
date: "2186 CE"
summary: |
  Primarch Adrien Victus convenes a war summit of the Council races aboard the
  Normandy, a neutral venue, to coordinate against the Reapers. The krogan, led by the
  Urdnot leader (Urdnot Wrex if he survived Virmire, otherwise Urdnot Wreav), refuse a
  turian alliance unless the genophage is cured. The Urdnot leader exposes a salarian
  conspiracy: the Special Tasks Group, after being shut down, had recovered several
  female krogan who survived Maelon's illegal cure experiments on Tuchanka and had been
  holding them in secret at a base on the salarian homeworld Sur'Kesh. Shepard and
  Victus pressure Dalatrass Linron into permitting an extraction.

  Shepard's squad, with Wrex or Wreav present, lands at the STG facility as Cerberus
  attacks, having been tipped off to the transfer. Fighting down through the base
  against Cerberus Assault Troopers, Centurions, Combat Engineers, an Atlas mech and
  turrets, the squad protects a containment pod being lifted level by level. Inside is
  the sole survivor of the group, the krogan shaman known as Eve (birth name Urdnot
  Bakara); the others died of complications from the experiments. When her pod is
  opened she seizes the Urdnot leader's shotgun and kills two Cerberus troopers,
  telling Wrex "I can handle myself" or Wreav "I'm not your property, Wreav."

  Eve is taken aboard the Normandy and recovers in the medical bay while Mordin Solus
  or Padok Wiks works to synthesise a genophage cure using her rare viable physiology,
  aided by Maelon's recovered data if Shepard preserved it. Hackett reports that
  construction of the Crucible has begun. The Urdnot leader insists the entire species
  must receive the cure before the krogan will commit to the war, setting up the
  operation on Tuchanka.
characters:
  - Commander Shepard
  - Eve
  - Urdnot Wrex
  - Urdnot Wreav
  - Mordin Solus
  - Padok Wiks
  - Adrien Victus
  - Dalatrass Linron
  - The Illusive Man
  - Tolan
consequences:
  - Eve, the last surviving female krogan from Maelon's experiments, is extracted and brought to the Normandy
  - The salarian conspiracy to hide the female krogan is exposed, straining salarian relations
  - Cerberus reveals it has an informant with access to top-level Council war planning
  - Work begins on a genophage cure aboard the Normandy
  - "Per `krogan_leader`: the krogan are represented by Wrex or by Wreav for the rest of the war"
  - The krogan condition the turian alliance on a full genophage cure, leading to Priority: Tuchanka
