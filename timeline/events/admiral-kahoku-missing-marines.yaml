event_id: admiral-kahoku-missing-marines
title: Admiral Kahoku and the Missing Marines
game: Mass Effect
chronological_order: 440
date: "2183 CE"
summary: |
  Rear Admiral Kahoku was a Systems Alliance officer who had fought with distinction
  against the batarians during the Skyllian Blitz and commanded the fierce loyalty
  of his men. In 2183 he could be found in the Citadel Tower, frustrated at being
  unable to secure an audience with the Council, trying to discover the fate of a
  squad of his marines who had vanished during a reconnaissance mission in the
  Artemis Tau cluster while searching for the ship of the fugitive scientist
  Armistan Banes.

  Commander Shepard, newly made a Spectre, could learn of Kahoku through Captain
  Anderson, while investigating Dr. Chloe Michel's blackmail on the Citadel, or by
  stumbling on the marines' distress beacon. Following it to Edolus, Shepard found
  the entire squad dead: they had been deliberately lured into a thresher maw nest
  by a false emergency signal. Told what had become of his men, Kahoku vowed to
  uncover who was responsible and departed.

  Kahoku purchased information from the Shadow Broker that pointed to the
  pro-human black-ops group Cerberus, and agreed to relay his findings to a Broker
  agent. He managed to pass Shepard the coordinates of hidden Cerberus research
  facilities before Cerberus operatives seized him. If Shepard raided the Cerberus
  labs on Binthu, the squad found Kahoku's corpse caged alongside Cerberus test
  subjects, needle marks on his arm indicating he had been used as a lethal
  experiment. Shepard could avenge him by assaulting the main Cerberus base on
  Nepheron. A Shadow Broker agent then requested the intelligence Kahoku had
  gathered, which Shepard could surrender or keep. A Citadel news report falsely
  attributed Kahoku's death to natural causes, noting he left a wife and three
  children. Two years later, a follow-up report could name Cerberus as the prime
  suspect, and the dying Spectre Tela Vasir cited Kahoku's murder as an example of
  Cerberus atrocities. The Missing Marines assignment is the first link in the
  Cerberus chain and is referred to internally as "Cerberus: The Test."
characters:
  - Kahoku
  - Commander Shepard
  - Captain Anderson
  - Chloe Michel
  - Armistan Banes
  - Cerberus
  - Tela Vasir
consequences:
  - Kahoku's marine squad is wiped out by a thresher maw on Edolus
  - Kahoku traces the ambush to Cerberus via the Shadow Broker
  - Kahoku passes Cerberus facility coordinates to Shepard before being captured
  - Kahoku is killed as a Cerberus test subject on Binthu
  - Shepard can destroy the Cerberus base on Nepheron in retaliation
  - Kahoku's death is publicly covered up as natural causes
  - Evidence of Cerberus experiments on Alliance personnel is exposed
  - Opens the wider UNC Cerberus assignment chain
