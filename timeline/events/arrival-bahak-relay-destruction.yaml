event_id: arrival-bahak-relay-destruction
title: Arrival DLC - Bahak Relay Destruction and Reaper Warning
game: Mass Effect 2
chronological_order: 980
date: 2185 CE
summary: "In 2185, Dr. Amanda Kenson, a human scientist from the University of Arcturus,\
  \ leads a secret research initiative called \"the Project\" into batarian space\
  \ to investigate rumors of Reaper technology. Her team discovers an ancient mass\
  \ relay in the Bahak system that predates the Protheans\u2014the \"Alpha Relay\"\
  \u2014and an embedded Reaper artifact called \"Object Rho\" hidden in an asteroid\
  \ near the relay. Exposure to Object Rho's visions convinces Kenson and her team\
  \ that the Reaper invasion is imminent, arriving within days. The team devises an\
  \ audacious plan: destroy the Alpha Relay by ramming a large asteroid into it, delaying\
  \ the Reapers' entry into the galaxy by forcing them to find an alternate mass relay\
  \ route.\n\nWhen Kenson is captured by batarian authorities and charged with terrorism,\
  \ Admiral Steven Hackett asks Commander Shepard to rescue her. Shepard infiltrates\
  \ the batarian prison on the planet Aratoht, frees Kenson, and fights through security\
  \ forces to escape with her aboard a commandeered shuttle. During the escape, Kenson\
  \ reveals the full scope of the discovery: Object Rho's visions, the imminent Reaper\
  \ arrival in approximately two days, and the Project's plan to destroy the Alpha\
  \ Relay. However, upon reaching Project Base on the asteroid, Shepard discovers\
  \ that prolonged exposure to Object Rho has indoctrinated Kenson and her entire\
  \ research team. The indoctrinated scientists, now serving the Reapers, attempt\
  \ to prevent the relay's destruction.\n\nShepard battles through the facility, fighting\
  \ indoctrinated researchers and security forces while the countdown to Reaper arrival\
  \ ticks down. Kenson attempts to sabotage the Project's propulsion systems by overheating\
  \ the fusion reactor, but Shepard manages to override the systems and activate the\
  \ Project, sending the asteroid on a collision course with the Alpha Relay. Kenson,\
  \ lamenting that she can no longer \"hear the whispers\" of the Reaper artifact,\
  \ triggers a detonator that obliterates her body as Shepard escapes the base. Seconds\
  \ before the asteroid impacts the relay, the Collector General\u2014possessing the\
  \ Harbinger Reaper\u2014appears via hologram to confront Shepard about the futility\
  \ of resistance.\n\nThe asteroid impact tears the Alpha Relay apart, causing a catastrophic\
  \ explosion of supernova proportions that annihilates the entire Bahak system, killing\
  \ over 300,000 inhabitants of Aratoht and devastating batarian space. The destruction\
  \ delays the Reaper invasion but at an enormous cost. The incident becomes a flashpoint\
  \ of controversy: while the destruction slows the Reapers' advance, it also claims\
  \ the lives of hundreds of thousands of batarian civilians and creates a massive\
  \ power vacuum in batarian space. The destruction of the Alpha Relay becomes the\
  \ most destructive military action in galactic history and fundamentally alters\
  \ the balance of power in the galaxy.\n"
characters:
- Commander Shepard
- Dr. Amanda Kenson
- Admiral Steven Hackett
- Batarian forces
- The Harbinger (via Collector General)
- Project staff members
consequences:
- Dr. Amanda Kenson indoctrinated and killed by Reaper artifact
- Alpha Relay destroyed by asteroid impact
- Entire Bahak system annihilated in supernova-like explosion
- Over 300,000 batarian inhabitants killed
- Reaper invasion delayed, forced to seek alternate route
- Batarian Hegemony crippled by loss of strategic system
- Massive galactic power vacuum created
- Shepard gains critical knowledge of Reaper invasion timeline
- Consequences of the destruction create diplomatic tensions
- Sets stage for increased Reaper urgency in ME3
