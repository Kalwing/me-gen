event_id: manswell-expedition
title: Manswell Expedition
game: Mass Effect
chronological_order: 1370
date: "2186 CE"
summary: |
  The Manswell Expedition was a private, pre-relay human colonization venture
  funded by the billionaire Victor Manswell, who was frustrated with the slow pace
  of government space exploration. Around 300 colonists were placed in cryogenic
  freeze and launched from Earth in 2075 (some Alliance records date the venture to
  2070), roughly 75 years before humanity discovered the Charon Relay and made
  contact with the wider galaxy. Contact with the expedition was lost shortly after
  launch and it was presumed a total failure.

  More than a century later, in 2186, an asari expedition observing a primitive
  alien species in the Alpha Centauri system stumbled upon the lost colony, which
  had successfully settled a planet there. The colonists ambushed the asari and
  took one of their scientists prisoner. Hoping to avoid escalating the situation,
  the asari asked the Systems Alliance to help keep the peace. This was initially
  difficult because the Alliance had no record of the colony; further reconnaissance
  and archive checks identified the settlers as the long-lost Manswell Expedition.
  Assuming the colonists knew nothing of the galactic community, the Alliance
  applied first contact protocols, sending not a military force but a team of
  military experts, medics, sociologists, anthropologists, linguists, psychologists,
  and geneticists. The colonists interpreted this as an alien plot and fought back,
  wounding several people on both sides before the violence was contained. Once
  convinced the newcomers were fellow humans from Earth, they admitted an Alliance
  representative to their camp and released the asari scientist unharmed.

  The Alliance then offered to reintegrate the colonists into human society and the
  galactic community. Opinion split roughly evenly: some felt that 120 years of
  change would be impossible to adjust to and chose to remain on the colony, while
  others were eager to rejoin, one colonist astonished to learn they had living
  descendants. The rediscovery was reported through the Cerberus Daily News feature
  "Undocumented Human Colony Found in Alpha Centauri System."
characters:
  - Victor Manswell
  - Systems Alliance
consequences:
  - A human colony lost since 2075 is rediscovered intact in the Alpha Centauri system in 2186
  - An asari scientist is taken hostage and later released unharmed after Alliance mediation
  - Casualties on both sides before the colonists accept that the newcomers are humans
  - The Alliance offers reintegration; the colony splits roughly evenly between staying and rejoining galactic society
  - Some colonists learn they have living descendants in the wider human population
