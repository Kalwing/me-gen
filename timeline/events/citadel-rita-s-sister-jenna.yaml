event_id: citadel-rita-s-sister-jenna
title: "Citadel: Rita's Sister - Undercover C-Sec Operation"
game: Mass Effect
chronological_order: 470
date: "2183 CE"
summary: |
  On the Citadel, Shepard encountered Rita, a waitress concerned about her sister Jenna, who was working undercover for C-Sec investigating illegal weapons modifications. Rita approached Shepard at Flux, worried that Jenna was in over her head and might be in danger.

  At Chora's Den, Shepard met Jenna, who was reluctant to abandon her undercover operation despite her sister's concerns. When Shepard approached, a turian detective named Chellick pretended to be drunk and warned Shepard to meet him at C-Sec offices, concerned that Shepard had nearly blown Jenna's cover.

  At C-Sec Academy, Detective Chellick explained that Jenna was gathering evidence on illegal weapons mods and that her case was critical. Shepard could use Charm or Intimidate to force her immediate release, but Chellick offered an alternative: help close her case by meeting a krogan arms dealer named Jax in the Lower Markets. Shepard's approach to Jax affected both Jenna's immediate release and the broader weapons smuggling situation—the player could arrest him, kill him, or buy the weapons mods peacefully.

  Per choice conditional:
  - Arrest or kill Jax: Grants Renegade/Paragon points; closes case immediately
  - Buy peacefully: Grants Paragon points; Chellick logs transaction as evidence; rewards upgrade and credits

  Regardless of the outcome, Jenna was removed from her dangerous undercover position at Chora's Den and returned to Flux, where Rita could see her again. The successful completion of this assignment had far-reaching consequences. In Mass Effect 3, if both "Citadel: Rita's Sister" and both Conrad Verner assignments were completed in the first game, Jenna Shepard would reappear as a C-Sec operative. When a Cerberus agent attempted to assassinate Shepard during the Citadel events of ME3, Jenna intercepted the attack. She used an omni-tool hacking technique learned from Detective Chellick to disable the assassin's weapon just as Conrad Verner heroically dove in front of Shepard to take the bullet. Jenna then neutralized the attacker. This act of heroism led to a romantic connection between Jenna and Conrad, giving both characters unexpected redemption arcs.

characters:
  - Commander Shepard
  - Jenna Shepard (C-Sec operative)
  - Rita (waitress)
  - Detective Chellick
  - Jax (krogan arms dealer)
  - C-Sec officers

consequences:
  - Per choice conditional related to Jax outcome
  - If Jax arrested or killed: Jenna removed from undercover, weapons smuggling ring disrupted
  - If bought peacefully: Jenna's case documented with evidence, weapons smuggling investigated
  - Jenna is saved from dangerous undercover work and transitions to safer duties
  - Rita is reunited with her sister
  - Jenna gains experience in undercover operations that will serve her in ME3
  - Detective Chellick's trust in Shepard is established, enabling future cooperation
  - Future consequence in ME3 if both assignments completed: Jenna saves Conrad's life and they develop a romantic bond
  - Demonstrates player agency in shaping character relationships across multiple games

