event_id: priority-perseus-veil
title: "Priority: Perseus Veil - The Quarian War Offer"
game: Mass Effect 3
chronological_order: 1630
date: "2186 CE"
summary: |
  A short, conversation-only mission acquired after the failed Cerberus coup on the
  Citadel. Admiral Hackett told Commander Shepard that the quarian Migrant Fleet
  was willing to contribute technical specialists and support ships to the Crucible
  war effort, and directed the Normandy to the Far Rim. Shepard travelled to the
  Dholen system and docked with a Quarian Envoy Ship.
  In the Normandy's war room the Admiralty Board of the Migrant Fleet explained
  that, emboldened after the Reapers gave the geth upgrades, they had abandoned
  their long isolation and launched an open war to retake the quarian homeworld
  Rannoch, driving the geth back toward the planet - but the offensive had stalled
  and their fleet was now exposed. The admirals asked the Normandy to help disable
  a geth dreadnought that was broadcasting the Reaper control signal and turning the
  battle against them.
  If Tali'Zorah had survived the Collector Base she returned to the squad. If she
  had not been exiled at her father Rael'Zorah's treason trial she now sat on the
  Admiralty Board in his place; if she had been exiled, the other admirals still
  brought her in secretly for her knowledge of the geth, which Shepard could
  needle as their "dirty little secret." Shepard could speak privately with Tali in
  the captain's cabin to continue or lock in a romance, which on a first
  playthrough unlocked the Energy Drain bonus power. Afterward Admiral Shala'Raan
  vas Tonbay took up residence in the war room, Tali joined as a temporary
  squadmate, and Priority: Geth Dreadnought became available.
characters:
  - Commander Shepard
  - Tali'Zorah vas Normandy
  - Admiral Shala'Raan vas Tonbay
  - Admiral Han'Gerrel vas Neema
  - Admiral Daro'Xen vas Moreh
  - Admiral Zaal'Koris vas Qwib-Qwib
  - Admiral Hackett
consequences:
  - The quarian Migrant Fleet formally offers to join the war effort
  - Shepard learns the quarians have launched an all-out war on the geth to retake Rannoch
  - Tali'Zorah rejoins the Normandy as a temporary squadmate (if she survived Mass Effect 2)
  - Admiral Shala'Raan joins the war room as the quarian liaison
  - Priority: Geth Dreadnought becomes available
