event_id: sidon-research-station-attack
title: Attack on the Sidon Research Station
game: Mass Effect
chronological_order: 210
date: "2165 CE"
summary: |
  In 2165, as told in the novel Mass Effect: Revelation, the Systems Alliance research
  station at Sidon was attacked and destroyed. The chain of events began in 2162, when
  a scout team funded by the batarian aristocrat and entrepreneur Edan Had'dah, working
  dangerously close to geth space, discovered a mysterious alien artifact near the
  Perseus Veil - in fact the Reaper Sovereign (Nazara), lying dormant in an obscure
  system. Visiting the site, Had'dah was subtly indoctrinated and became driven to
  unlock its secrets; he set aside his hatred of humans to recruit the leading expert,
  Dr. Shu Qian, an AI specialist who had defected from the Alliance and was already
  being worked on by Sovereign's indoctrination. Qian studied the artifact from his lab
  on Sidon while keeping in close contact with Had'dah and buying components through the
  batarian firm Dah'tan Manufacturing to avoid attention.

  Lieutenant David Anderson, executive officer of the SSV Hastings and the first
  graduate of the N7 program, led the ground team that responded to the Sidon attack
  and discovered the station had secretly harbored a traitor conducting illegal
  artificial-intelligence research. After Kahlee Sanders threatened to expose Qian,
  Had'dah had hired the Blue Suns to raid Sidon and cover up the defection, then hired
  the krogan Battlemaster Skarr to hunt Sanders and later to raze the Dah'tan facility
  on Camala, the last link back to him. The Blue Suns split their contract fee among
  all members regardless of participation, so mercenaries such as the batarian Groto
  Ib-ba were paid for the Sidon job without taking part; Saren later tortured Groto in
  the Sanctuary brothel until he revealed that a female human had survived Sidon and
  that Skarr had been sent to kill her, then broke Groto's neck.

  Ambassador Anita Goyle tasked Anderson with investigating discreetly. Anderson tracked
  down Kahlee Sanders, a surviving Sidon technician and the daughter of Rear Admiral
  Jon Grissom, and staked out Grissom's home on Elysium. Skarr - a biotic powerful
  enough to throw a four-ton armored vehicle - burst in, wounded Grissom with his boot
  knife and nearly killed Anderson before the turian Spectre Saren Arterius, who had
  tracked the krogan, drove him off. Kahlee lied to Saren that Sidon had been biotics
  research, and one of Grissom's underworld contacts smuggled her off-world under a
  false identity with Anderson as protection. On Camala they found Dah'tan Manufacturing
  already destroyed by Skarr; Kahlee gave Anderson an OSD naming Qian as the traitor.
  Acting on a tip planted by Saren, Skarr then intercepted the APC carrying Kahlee,
  brought down the frigate SSV Iwo Jima with a mass accelerator cannon, and captured
  her, holding her at Had'dah's element zero refinery hideout to force her to aid Qian's
  research. Anderson and Saren stormed the refinery; Saren broke from the plan and began
  demolishing it, killing many workers and their families, while executing Qian and then
  shooting Had'dah dead after the batarian tried to bargain his resources for his life.
  Wounded by Sanders, Skarr was finished by Anderson with a point-blank shot to the
  head. Saren blamed Anderson for the refinery deaths - an accusation that cost Anderson
  his candidacy to become the first human Spectre. Anderson and Kahlee Sanders began a
  lasting association, and Dr. Qian's notes on the Perseus Veil artifact survived to
  later feed Saren's obsession with the Conduit and the Reapers.
characters:
  - David Anderson
  - Kahlee Sanders
  - Saren Arterius
  - Shu Qian
  - Edan Had'dah
  - Skarr
  - Anita Goyle
  - Jon Grissom
  - Groto Ib-ba
consequences:
  - The Sidon research station is destroyed and its secret AI research exposed
  - David Anderson's bid to become the first human Spectre is sabotaged by Saren's accusation
  - Kahlee Sanders is rescued and begins a long association and romance with Anderson
  - Saren Arterius becomes a lasting enemy of Anderson
  - Saren kills both Dr. Shu Qian and Edan Had'dah at the Camala eezo refinery
  - Skarr shoots down the SSV Iwo Jima and captures Kahlee Sanders, then is killed by Anderson at the refinery
  - Saren tortures and kills the Blue Suns mercenary Groto Ib-ba for intelligence on the Sidon survivor
  - Dr. Shu Qian's research on the Perseus Veil artifact survives and later drives Saren's search for the Conduit
  - Saren takes Qian's and Had'dah's research and begins seeking the Reaper Sovereign for himself
