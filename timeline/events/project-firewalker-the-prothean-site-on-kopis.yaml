event_id: project-firewalker-the-prothean-site-on-kopis
title: "Project Firewalker: The Prothean Site on Kopis"
game: Mass Effect 2
chronological_order: 1220
date: "approx. 2185 CE"
summary: |
  Project Firewalker: Prothean Site was the last of the Firewalker assignments
  Commander Shepard ran for Cerberus while hunting the Collectors, following Project
  Firewalker: Volcano Station. Data recovered at Karumto pointed Cerberus to Dr.
  Cayce's final known location: the moon Kopis, orbiting Makhaira in the Hoplos
  system of the Hades Nexus, where he had set out to excavate a Prothean site.
  Orbital scans showed Prothean artifacts shielded behind a powerful kinetic energy
  barrier and hidden automated defences.

  Shepard's team deployed in the Hammerhead infantry fighting vehicle. Because the
  barrier over the dig site could not be breached by weapons fire, the squad followed
  the power lines and destroyed the generators feeding it while dodging Rocket
  Drones; four eezo deposits could be gathered outside the base along the way. With
  the last generator down the barrier collapsed and the team advanced into the ruins
  on foot, past the bodies of the Blue Suns mercenaries Cayce's expedition had hired
  as guards.

  Logs and datapads recovered at the site told the expedition's end. Dr. Robert
  O'Loy had been indoctrinated by the Reapers and was leaking the team's movements to
  a geth ship, and had cut a deal with the Collectors - trading the Prothean find for
  the safety of the colony where his wife Helen lived. Dr. Cayce discovered O'Loy
  transmitting the data, killed him to prevent "another Eden Prime," then found the
  Reapers "still in my head" and resolved to destroy both the relic and himself.
  Shepard hacked the console and examined the artifact, similar to the one found on
  Eletania: it glowed green and shrank to a portable size, later displayed on the
  coffee table in Shepard's cabin aboard the Normandy. A follow-up message from
  Project Firewalker reported that an energy burst during the retrieval carried coded
  data that advanced Cerberus research into energy transfer and biotics, and that the
  artifact itself was inert and harmless.
characters:
  - Commander Shepard
  - Cayce
  - Robert O'Loy
  - Helen
  - The Illusive Man
consequences:
  - Shepard recovers an intact Prothean artifact from Kopis for Cerberus, kept in the Normandy captain's cabin
  - The fate of Dr. Cayce's expedition is uncovered - O'Loy's indoctrination and Collector deal, and Cayce's murder-suicide
  - Cerberus gains coded Prothean data that advances its research into energy transfer and biotics
  - The Hades Nexus / Hoplos system is logged as a site of Reaper and Collector activity during the Collector crisis
