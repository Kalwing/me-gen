event_id: virtual-alien-ghost-ship-encounter
title: "The Virtual Alien Ghost Ship Enters the Antilin System"
game: Mass Effect 2
chronological_order: 970
date: "2185 CE"
summary: >
  The virtual aliens were a race of about one billion individuals who, roughly
  8,000 years earlier, learned their homeworld's star was about to go supernova.
  They built a starship housing a network of supercomputers that contained an
  entire virtual world and transferred their consciousnesses into it, leaving a
  purpose-built AI to pilot the vessel and maintain the simulation on a
  millennia-long journey across the galaxy. Because none of them retained
  physical bodies, their true name and biology were never recorded; to interact
  with organics they could swap consciousnesses with other sentient beings and
  control their bodies.
  In 2185 CE the ship entered the salarian-inhabited Antilin system. Its AI
  broadcast a request for help because the energy source sustaining the ship and
  the virtual world was failing. Salarians first detected the vessel as a "ghost
  ship" and, because it emitted strong AI heuristics, feared it was the vanguard
  of a geth attack. The human exobiologist Dr. Jordan Detweiler boarded it,
  established contact with the AI, and learned of the virtual world and its power
  crisis. When it became clear the Citadel Council, wary of the AI, was likely to
  rule against rendering aid, Detweiler entered the virtual world himself to warn
  its inhabitants and returned with an offer to trade advanced technology for
  assistance. The Council classified everything about the ship as top secret. A
  month later it emerged that a virtual alien representative, Ambassador Sygan,
  had been using Detweiler's body to visit the Citadel and address the Council;
  in a press conference she explained the situation and requested asylum for
  herself and others who wished to leave the simulation. A volunteer offered to
  host Sygan's mind so Detweiler could be freed, and roughly 400 individuals of
  various races subsequently came forward to swap places with virtual aliens. The
  affair was reported through the Cerberus Daily News "Alien Ghost Ship
  Encounter" feed.
characters:
  - Jordan Detweiler
  - Sygan
consequences:
  - A virtual alien starship carrying about one billion uploaded minds arrives in salarian space seeking energy aid
  - Salarians initially mistake the AI-emitting ship for a prelude to a geth attack
  - Dr. Jordan Detweiler makes first contact and negotiates a technology-for-aid offer
  - The Citadel Council classifies all matters concerning the ship as top secret
  - Ambassador Sygan requests asylum for virtual aliens wishing to leave the simulation
  - About 400 volunteers of various races agree to swap bodies with virtual aliens
