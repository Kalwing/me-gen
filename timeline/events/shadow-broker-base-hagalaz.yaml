event_id: shadow-broker-base-hagalaz
title: Assault on the Shadow Broker Base
game: Mass Effect 2
chronological_order: 1240
date: "2185 CE"
summary: |
  Following the Baria Frontiers bombing on Illium and the death of the traitor Spectre
  Tela Vasir, Sekat's recovered data pinpoints the Shadow Broker's base: a massive
  ship riding the eternal storm front of the planet Hagalaz in the Sowilo system.
  Commander Shepard and Liara T'Soni land on the vessel's hull and fight along its
  exterior through Shadow Broker agents, engineers, heavies, LOKI mechs and rocket
  drones, exposed to lightning strikes, before breaching the interior.

  Inside, they find Feron, Liara's drell partner from the search for Shepard's body,
  strapped to an interrogation chair wired so that removing him would kill him. They
  press on to the Broker's command centre and confront the Shadow Broker himself, a
  hulking yahg, a member of a pre-spaceflight species from Parnack. The Broker reveals
  he killed and replaced the original Shadow Broker decades earlier and has run the
  organisation ever since. Shepard and Liara kill him in a heavy firefight.

  With the Broker dead, Liara seizes control of his information network, assuming the
  role of the Shadow Broker herself (per `shadow_broker`: the past Broker dies and
  Liara takes over). Feron is freed from the chair and, mentally scarred from years of
  torture that he survived using his drell eidetic memory, chooses to stay and assist
  Liara. Liara begins using the network against the Reapers and the Collectors, and
  cleans up the Cerberus information leaks that had helped locate the base. Her new
  resources make her a key intelligence asset for the coming war, and if Shepard is
  romancing her the relationship is rekindled aboard the captured ship.
characters:
  - Commander Shepard
  - Liara T'Soni
  - Feron
  - The Shadow Broker
consequences:
  - The yahg Shadow Broker is killed and his identity and history exposed
  - "Per `shadow_broker`: Liara T'Soni takes over the Shadow Broker organisation and its ship"
  - Feron is rescued and becomes one of Liara's agents, running Terminus operations
  - Liara gains a galaxy-spanning intelligence network she later turns against the Reapers
  - Cerberus information leaks that led to the base are shut down
  - If Shepard did not help take the base, Liara later storms it with mercenaries and Feron does not survive
