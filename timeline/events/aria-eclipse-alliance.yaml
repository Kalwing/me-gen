event_id: aria-eclipse-alliance
title: Aria T'Loak Unites Eclipse
game: Mass Effect 3
chronological_order: 1590
date: "2186 CE"
summary: |
  As the third and final mercenary recruitment mission for Aria T'Loak's consolidation of power, Commander Shepard is tasked with bringing Eclipse, a highly trained asari mercenary corporation, under Aria's command. Eclipse was founded and led by asari commando Jona Sederis, who is currently imprisoned at the Citadel for her mercenary activities. Commander Bailey of C-Sec, despite pressure from the Citadel Council on Aria's behalf, initially refuses to release Sederis, fearing the political consequences. Shepard has two strategic options to resolve the situation. The first is to pressure Bailey into releasing Sederis from custody, allowing her to resume command of Eclipse and bringing the organization under Aria's authority. The second, more indirect approach is to locate Sayn, Sederis' talented and ambitious second-in-command, who has been managing Eclipse's operations during Jona's imprisonment. Sayn is discovered plotting to break Jona out of jail, but Shepard can convince him that he is already in command and should maintain that position rather than depose himself. Shepard can then persuade Sayn to either allow Sederis to remain imprisoned indefinitely or to arrange for her death upon release. Regardless of which path is taken, Eclipse's leadership submits to Aria's authority, bringing elite asari commandos and advanced mech units into the Terminus Fleet. Aria remarks that her control over Eclipse ran deeper than expected, suggesting her past relationships and influence extend throughout the organization. The mercenary group's sophisticated commando units and advanced equipment significantly enhance Aria's offensive capacity for the assault on Omega and the broader war effort.
characters:
  - Aria T'Loak
  - Commander Shepard
  - Jona Sederis
  - Sayn
  - Commander Bailey
  - Eclipse
consequences:
  - "If Paragon (release Sederis): Jona Sederis is released and resumes command of Eclipse under Aria's authority"
  - "If Renegade (Sayn takes over): Sayn assumes leadership of Eclipse, Sederis either imprisoned or killed"
  - Eclipse commits elite asari commandos and mechs to Aria's forces
  - The Terminus Fleet War Asset is updated by 50 points
  - Aria's offensive capabilities are significantly strengthened
  - Multiple leadership outcomes depending on Shepard's choices
  - Eclipse becomes integral to the assault on Omega
