event_id: conrad-verner-saga
title: "Conrad Verner's Arc - A Fan's Journey and Fate"
game: Mass Effect
chronological_order: 450
date: "2183 CE"
summary: |
  Conrad Verner was an ordinary Citadel resident who became obsessed with Commander Shepard after the first human Spectre's rise to prominence. Verner approached Shepard in the Upper Markets after Shepard gained unrestricted access to the Citadel, initially asking for an autograph to impress his wife. Shepard could grant or refuse this harmless request.

  As Shepard progressed through major missions on Therum, Feros, and Noveria, Verner reappeared for additional interactions. After Shepard became a Spectre, Verner sought a photo as proof of meeting humanity's first Spectre. Refusing this request led to Verner attempting to prove himself by attacking turian civilians, resulting in his death at the hands of C-Sec or local security.

  However, if Shepard granted Verner's second request, a third encounter followed where Verner asked to become a Spectre himself. Shepard could use Charm to convince him to stay home with his wife or Intimidate him into accepting his limitations—both choices allowing Verner to survive. The third option, telling him to "get lost," resulted in the same fatal outcome as refusing the photo.

  Per choice conditionals - Branch A (Charm/Intimidate): Verner survives ME1 with humility; Branch B (Refused/Get Lost): Verner dies in ME1, no further appearances

  Verner's survival was significant because if he survived ME1, he reappeared in Mass Effect 2 on Illium, still obsessed with proving himself. He appeared in knock-off N7 armor, threatening a bartender and claiming Shepard had forced him into violence. His ME2 appearance provided dialogue context for ME3 choices.

  In Mass Effect 3, if Conrad survived both previous games and Shepard had completed the side mission "Citadel: Rita's Sister" in ME1, Jenna—a C-Sec operative trained by Detective Chellick—saved Conrad's life during a Cerberus attack. An assassination attempt on Shepard was intercepted when Jenna used an omni-tool hack (the same technique Chellick had taught her) to disable the would-be assassin's gun as Conrad heroically dove in front of Shepard to take the bullet, and Jenna pulled the trigger on the assailant. This event led to a romantic connection between Conrad and Jenna, giving Conrad's arc an unexpectedly positive resolution despite his delusional ME2 state.

  The branching nature of Conrad's story—from harmless fan to either tragic casualty or reluctant hero—demonstrated the ripple effects of player choices across the trilogy and how small encounters could lead to unexpected bonds and outcomes.

