event_id: paul-grayson-reaper-transformation-grissom-academy-attack
title: Paul Grayson's Reaper Transformation and the Attack on Grissom Academy
game: Mass Effect
chronological_order: 1360
date: "2186 CE"
summary: |
  Paul Grayson was a Cerberus operative, red sand addict, and certified starship pilot serving the Illusive Man as a devoted agent of the organization's human-supremacist ideology. In the early 2180s, Grayson undertook horrific missions for Cerberus, including sabotaging starships over colony worlds to release dust-form element zero. His worst attack was over Yandoa, causing numerous birth defects and creating thirty-seven biotic children, including Gillian Grayson, an autistic biotic child the Illusive Man gave to Grayson as an infant, claiming she would be humanity's "savior." Grayson genuinely loved Gillian despite her not being biologically his daughter, and their separation when she joined the Ascension Project deepened his red sand addiction.

  When Gillian's cover operative at the Ascension Project, Dr. Jiro Toshiwa, was exposed, Grayson was ordered to extract her. Blocked by Dr. Kahlee Sanders, he traveled with Kahlee, Hendel Mitra, and Gillian to Omega, where his partner Pel betrayed him. After a rescue by quarian forces, Grayson broke free, killed Pel, and obtained Migrant Fleet access codes. Believing quarians had taken Gillian, Grayson led a Cerberus raid on the Idenna using the scout ship Cyniad as a rigged decoy. When Kahlee convinced him Cerberus only wanted to weaponize Gillian, Grayson shot his partner Golo and warned Kahlee of the trap, then escaped Cerberus custody.

  Three years later, Grayson overcame his red sand addiction and established a new life on Omega under the alias "Paul Johnson," working as an enforcer for Aria T'Loak and entering a relationship with her daughter Liselle. He maintained secret contact with Kahlee Sanders. Cerberus located him, and the Illusive Man sent Kai Leng to capture Grayson. Leng's operatives seized him on Omega, killing Liselle in the process. Grayson was transported to a Cerberus facility where he became a test subject for adapting Reaper nanotechnology to human biology. Dosed with red sand to lower his resistance, nanites were implanted into his body, slowly indoctrinating him while enhancing his strength, speed, and biotic abilities. His body underwent radical transformation, skin becoming semi-translucent with visible Reaper technology beneath. The Reapers, taking near-total control, forced information about the Ascension Project from his mind and compelled him to board a ship bound for Jon Grissom Academy over Elysium, coding an advanced virus to disable the station's communications.

  Grayson deceived the Academy's authorities into allowing him to dock, then killed guards and moved toward the Ascension Wing, disabling or killing personnel. Kahlee Sanders received his urgent pre-recorded message revealing his Cerberus capture and delivered his complete files on the organization to Admiral David Anderson. Anderson, Sanders, and Kai Leng—who had been captured aboard Grayson's ship—arrived at the Academy. A brief moment of Grayson's original personality surfaced as he tried to explain the Reapers' philosophy to Kahlee, but the Reapers' control remained strong. His body was failing from continuous activity, his powers weakening, forcing him to fight defensively. In the ensuing battle, Anderson shot him with a shotgun, and as the Reapers released their grip at last, Grayson smiled at Kahlee—a moment of his true self—before Kai Leng executed him with two bullets to the skull.

  Anderson and Sanders brought Grayson's corpse to the Citadel Council as evidence of Reaper involvement, but the Council attributed his mutations to Cerberus, dismissing the threat. The Illusive Man ordered Kai Leng to retrieve the body. Cerberus salvaged Grayson's Reaper implants and used them to help adapt the technology for enhancing its own forces. In Mass Effect 3, Shepard discovered video logs on Cronos Station detailing Grayson's fate and how his implants contributed to Cerberus's technological advancement.

