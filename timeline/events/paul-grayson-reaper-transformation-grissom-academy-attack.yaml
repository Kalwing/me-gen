consequences:
  - Paul Grayson killed Claude Menneau's bodyguard Keo in early Cerberus service
  - Grayson's element zero sabotage missions across multiple colony worlds caused mass birth defects
  - The Illusive Man placed infant Gillian Grayson with Paul as a test subject for biotic potential
  - Grayson abandoned Cerberus after learning it intended to weaponize Gillian, escaping with Kahlee Sanders's help
  - Paul fled to Omega and lived under a false identity, maintaining secret contact with Kahlee
  - Kai Leng captured Grayson on Omega and killed his girlfriend Liselle
  - Cerberus performed the first known human implantation with Reaper nanotechnology on Grayson's body
  - Grayson's Reaper-controlled assault on Grissom Academy killed or disabled most station personnel
  - Anderson and Sanders killed the Reaper-mutated Grayson but were unable to convince the Council of the Reaper threat
  - Grayson's Reaper implants were salvaged by Cerberus and used as the foundation for adapting Reaper technology into Cerberus troops
  - The Illusive Man ordered retrieval of Grayson's corpse after the Council meeting
  - Aria T'Loak's batarian enforcer Sanak, guarding the captive Anderson during the strike, was killed when Anderson broke free amid the carnage and fired three pistol rounds into his torso

