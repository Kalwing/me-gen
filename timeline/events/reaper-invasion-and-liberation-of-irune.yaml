event_id: reaper-invasion-and-liberation-of-irune
title: "Reaper Invasion and Liberation of Irune"
game: Mass Effect 3
chronological_order: 1850
date: "2186 CE"
summary: >
  During the Reaper invasion of 2186, the volus homeworld Irune came under attack
  soon after the Reapers overwhelmed the Turian Hierarchy's defensive fleets, on
  which the Vol Protectorate depended for ground protection. The volus maintained
  only token military forces of their own - favoring airpower, flotillas of
  heavy-bomber frigates and a single Elkoss Combine-funded dreadnought, the
  Kwunu - and had built their cities along profitable trade routes rather than
  defensible positions. Reaper husks were deployed across the planet, and its
  poorly sited population centers proved nearly impossible to hold. Large numbers
  of volus refugees fled Irune for the comparative safety of turian colonies.
  After the Miracle at Palaven - the point at which newly cured krogan forces
  arrived to relieve the turian homeworld and stabilize the front - a joint
  turian-krogan ground force was landed on Irune to liberate the planet from
  Reaper occupation. The campaign is referenced as part of the broader war
  effort that Ambassador Din Korlack and the volus leveraged in pressing, once
  again, their long-denied claim to a Citadel Council seat, on the grounds that
  the volus had finally contributed militarily to a galactic crisis.
characters:
  - Turian Hierarchy
  - Krogan forces
  - Vol Protectorate
  - Din Korlack
consequences:
  - Reaper husks overrun Irune's undefended, trade-route cities
  - Large numbers of volus flee to turian colonies as refugees
  - A joint turian-krogan ground force lands to liberate Irune after the Miracle at Palaven
  - The volus cite their wartime contribution in renewed demands for a Council seat
