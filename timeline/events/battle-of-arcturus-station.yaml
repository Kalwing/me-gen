consequences:
  - Arcturus Station is completely destroyed
  - Approximately 45,000 people are killed, including the entire Alliance Parliament
  - Prime Minister Amul Shastri is killed in the destruction
  - The entire Second Fleet is sacrificed to allow other fleets to escape
  - The mass relay to Earth is left undefended
  - Alliance governmental continuity is severely compromised
  - The Reapers establish a direct route to Earth
  - Intelligence salvaged from the wreckage may provide tactical insights
