event_id: battle-of-arcturus-station
title: Battle of Arcturus Station
game: Mass Effect 3
chronological_order: 1430
date: "2186 CE"
summary: |
  In 2186, as the Reaper invasion of the galaxy reaches its devastating peak, the Alliance's Second, Third, and Fifth Fleets engage Reaper forces at Arcturus Station, humanity's military and political capital. The station, a massive Stanford Torus-class habitat with a permanent population of 45,000 and home to the entire Alliance Parliament and Prime Minister Amul Shastri, becomes the site of a crucial and ultimately disastrous defensive stand. Admiral Steven Hackett commands the Alliance forces in a desperate attempt to hold the strategic position and protect the mass relay leading to Earth. The battle begins with the Alliance fleet defending against approximately a dozen Reaper capital ships directly attacking Arcturus. Despite valiant effort and advanced Alliance weaponry, the defenders quickly realize they are overwhelmed. The bulk of the Reaper fleet, which vastly outnumbers the engaged ships, bypasses the defenders and surges through the mass relay toward Sol, heading directly for Earth. Facing inevitable defeat and the destruction of the station, Admiral Hackett makes a catastrophic strategic decision: he orders the complete abandonment of Arcturus Station and deliberately sacrifices the entire Second Fleet to buy time for the Third and Fifth Fleets to escape. The Second Fleet is utterly destroyed in the process. Once the evacuation is complete, the Reapers utterly destroy Arcturus Station itself, reducing it to fused wreckage that becomes a mass grave for approximately 45,000 people, including the entire Alliance Parliament and Prime Minister Shastri. The loss represents not only a severe military defeat but a devastating blow to Alliance governmental continuity and leadership.
characters:
  - Admiral Steven Hackett
  - Prime Minister Amul Shastri
