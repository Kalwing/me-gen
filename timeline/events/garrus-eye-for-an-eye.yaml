event_id: garrus-eye-for-an-eye
title: "Garrus: Eye for an Eye"
game: Mass Effect 2
chronological_order: 1150
date: "2185 CE"
summary: |
  After the Horizon mission, Garrus Vakarian received word that Sidonis, the
  lieutenant whose coerced betrayal had lured Garrus away while Omega's mercenary
  gangs bombed the Archangel hideout and killed his ten-man vigilante squad, was
  alive and hiding on the Citadel. Sidonis had bought a new identity from a forger
  known as Fade. Talking to Garrus at the Normandy's main battery began his
  loyalty mission.

  Garrus arranged a meeting with Fade at a warehouse near the Neon Markets in
  Zakera Ward. Shepard and Garrus instead found a volus flanked by two krogan
  bodyguards, who revealed that Fade was really former C-Sec officer Harkin,
  operating out of an old prefab factory in the Factory District under Blue Suns
  protection. At the factory Harkin fled and the team fought through Blue Suns
  troopers and several LOKI and YMIR mechs, including two YMIR mechs at once in the
  final exterior battle. Cornering Harkin, Garrus pinned him with a foot to the
  throat until Harkin contacted Sidonis and set up a midday meeting outside the
  Orbital Lounge. A Paragon interrupt could stop Garrus shooting Harkin in the leg.

  At the Orbital Lounge, Garrus took a sniper perch and had Shepard walk out to
  draw Sidonis into the open. The outcome depended on Shepard: staying silent let
  Garrus take the shot and kill Sidonis, after which C-Sec investigated the death
  with no leads and Garrus remarked "what a shame." Alternatively Shepard could
  step in front of the shot and speak with Sidonis, who explained he had sold out
  the team only to save his own life and had been consumed by guilt ever since;
  with enough Paragon influence Shepard could talk Garrus into standing down. If
  spared, Sidonis later confessed to C-Sec to the murder of ten people on Omega,
  though jurisdiction disputes left C-Sec unsure how to proceed, and Harkin was
  taken into custody. Either outcome secured Garrus's loyalty and unlocked his
  Armor-Piercing Ammo.
characters:
  - Garrus Vakarian
  - Commander Shepard
  - Sidonis
  - Harkin
  - Captain Bailey
  - EDI
consequences:
  - Garrus exposes the forger Fade as ex-C-Sec officer Harkin, who is taken into C-Sec custody
  - Sidonis's fate is decided by Shepard - killed by Garrus's sniper shot if Shepard stays silent, or spared if Shepard intervenes and talks Garrus down (per a Paragon check)
  - If killed, C-Sec finds no leads; if spared, Sidonis confesses to C-Sec but jurisdiction disputes stall prosecution
  - Garrus gains closure over the massacre of his Omega squad and becomes loyal to Shepard
  - Garrus unlocks Armor-Piercing Ammo for the squad
