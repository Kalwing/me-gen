event_id: wrex-family-armor
title: "Wrex: Family Armor"
game: Mass Effect
chronological_order: 660
date: "2183 CE"
summary: |
  While travelling with Commander Shepard aboard the Normandy in 2183, the krogan
  battlemaster Urdnot Wrex reveals that his family's ceremonial armour, handed down
  for generations, was taken by the turians after the Krogan Rebellions and has ended
  up in the collection of Tonn Actus, a turian pirate and profiteer who specialises
  in krogan artefacts, especially items from the Rebellions. Wrex had intended to
  hunt Actus personally through the Argos Rho cluster and kill him, but Actus keeps
  several scattered hidden bases and Wrex's service with Shepard has delayed the
  search. Wrex's best lead places Actus on the planet Tuntau in the Phoenix system.

  Shepard can volunteer to take the Normandy to Tuntau and raid Actus' concealed
  base. The assault fights through the pirate's guards; Actus himself begins the
  engagement on a top balcony near a fuel tank, carrying an assault rifle and a
  shotgun and using Immunity, Shield Boost and Carnage. Detonating the nearby fuel
  tank can kill him quickly. Actus dies in the firefight and Wrex's family armour is
  recovered from the base. It is possible to complete the raid and retrieve the
  armour without Wrex in the squad, or even without ever formally accepting the
  assignment, in which case the old Urdnot-clan armour is simply found while
  exploring Tuntau.

  Afterward Shepard discusses the armour with Wrex aboard the Normandy. If Wrex was
  present he is satisfied to have recovered it, though he admits the armour is not
  actually very good and its value is purely sentimental. If Wrex was alive but not
  brought along, he is glad to have the armour back but disappointed he did not get
  to kill Actus himself. If Wrex is already dead, the recovered armour is noted only
  as belonging to a clan whose one known member is gone.
characters:
  - Urdnot Wrex
  - Commander Shepard
  - Tonn Actus
consequences:
  - Tonn Actus is killed and his hidden base on Tuntau is destroyed
  - Wrex's family ceremonial armour is recovered from Actus' collection
  - Wrex, if alive, receives his ancestral armour back; if brought along he can kill Actus himself
  - If Wrex is dead, the armour is recovered but has no one to claim it
