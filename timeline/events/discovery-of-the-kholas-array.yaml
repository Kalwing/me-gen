event_id: discovery-of-the-kholas-array
title: Discovery of the Kholas Array
game: Mass Effect
chronological_order: 950
date: "approx. 2185 CE"
summary: >
  The Kholas Array was a colossal geth structure built on the fringes of the
  Perseus Veil from three primary mass relays fused together with unfamiliar
  technology. By treating the sensors in the combined relay corridor as a
  faster-than-light "telescope," the array could observe intergalactic distances in
  almost real time. The Migrant Fleet dismissed reports of it as a tall tale. The
  quarian Shio'Leth vas Novarra stumbled onto the array during his Pilgrimage,
  claiming to have been shown it by a heretic geth enclave. The geth aboard ignored
  other galaxies entirely, appearing instead to search dark space for something Shio
  could not identify. Hoping to find a new homeworld for the quarian people, Shio
  aimed the array at the Andromeda galaxy, downloaded its observations, evaded the
  hostile geth, and turned the data over to the Andromeda Initiative, where it let
  Initiative scientists calculate viable colonization paths to Andromeda. A flaw
  found during a final recheck of his figures forced Shio into hiding and then back
  to Kholas, this time escorted by Initiative recruit Tiran Kandros, to correct the
  readings. Kandros had infiltrated the Initiative under the alias Sanjin Vinnick,
  shadowed on the mission by Luna Shanks, head of Jien Garson's personal security
  detail, a portly but powerful biotic with a diplomatic streak. Shanks clashed
  repeatedly with Agent Zeta, a salarian biotic who had grafted array-like
  technology into his own body to slow the physical and mental decay caused by his
  biotics and who coerced the array's location out of Shio. Zeta blasted Shanks off
  a cliff, later impaled her with a metal bar, and slaughtered the crew of the
  strip-mining ship Novarra, including the quarian Viegle, before escaping. Despite
  heavy geth resistance Shio and Kandros obtained the corrected data and escaped;
  Agent Zeta lost control of his power and suffered a fatal biotic meltdown, with
  the damage to the structure left unclear. Shanks survived, left incapacitated but
  alive, and recuperated at a medical facility on Earth. The events are told in
  Mass Effect: Discovery.
characters:
  - Shio'Leth vas Novarra
  - Tiran Kandros
  - Agent Zeta (Olan Kooth)
  - Luna Shanks
  - Jien Garson
  - Viegle
  - Sanjin Vinnick
  - Nyreen Kandros
consequences:
  - The Andromeda Initiative obtained near-real-time observational data on the Andromeda galaxy
  - Initiative scientists used the data to calculate colonization routes to Andromeda
  - A flaw in the first readings was corrected on a second run to Kholas
  - Agent Zeta died in a biotic meltdown at the array
  - Luna Shanks was left permanently injured but survived, recuperating on Earth
  - The crew of the quarian ship Novarra, including Viegle, was killed by Agent Zeta
  - The geth's search of dark space for an unknown target was witnessed but not understood
