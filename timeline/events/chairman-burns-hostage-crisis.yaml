event_id: chairman-burns-hostage-crisis
title: Chairman Burns Hostage Crisis
game: Mass Effect
chronological_order: 530
date: "2183 CE"
summary: |
  Chairman Martin Burns headed the Alliance Parliamentary Subcommittee for
  Transhuman Studies, which oversaw matters relating to human biotics. When the
  Subcommittee voted on whether to pay reparations to L2 biotics suffering severe
  implant-related health problems, Burns voted against the measure and presumably
  vetoed it. A group of L2 biotics wrote to the Subcommittee asking him to
  reconsider and were ignored. Growing desperate and angry, the L2s kidnapped Burns,
  took him aboard the Kowloon-class freighter MSV Ontario, and made a hard burn for
  the cover of the asteroid belt in the Farinata system, demanding reparations for
  the pain and suffering caused by their implants.

  The Normandy intercepted the Ontario before it reached the asteroids, and
  Commander Shepard led a boarding party inside. Burns was found held at gunpoint in
  the rear of the freighter, begging for his life and claiming he had changed his
  mind; the L2s were prepared to execute him anyway, arguing he had already had his
  chance. The outcome depended on how Shepard handled the standoff: if Shepard
  pushed or antagonized the terrorists, the L2s killed Burns before being cut down
  by the squad; alternatively, Shepard could argue that the L2s needed Burns alive
  if they wanted real change, and talk them down so that Burns survived. If he
  lived, Burns said he had not understood how desperate the L2s were and vowed the
  reparations would be paid.

  The consequences carried into 2185: if Burns was rescued, he kept his word and
  L2 biotics received reparations for their implants. In a news report he thanked
  biotics everywhere and promised more help for people "forgotten by the system,"
  and he sent Shepard a message routed through Ambassador Udina, titled "Thank you
  again," admitting he had taken the job for power, conceding he had been wrong, and
  offering his aid despite the political cost.
characters:
  - Martin Burns
  - Commander Shepard
  - Donnel Udina
consequences:
  - The L2 biotics kidnap a sitting Alliance subcommittee chairman aboard the MSV Ontario
  - The L2 hostage-takers are killed by Shepard's squad
  - Burns dies if Shepard mishandles the standoff; Burns survives if Shepard talks the L2s down
  - If Burns survives, L2 biotics receive reparations for their faulty implants by 2185
  - A surviving Burns publicly pledges further support for biotics and offers Shepard his political aid
