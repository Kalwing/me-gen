event_id: first-contact-war
title: The First Contact War (Relay 314 Incident)
game: Mass Effect
chronological_order: 150
date: "2157 CE"
summary: |
  The First Contact War, called the Relay 314 Incident by the turians, was a
  three-month, low-intensity conflict between the human Systems Alliance and the
  Turian Hierarchy in 2157. After discovering and activating the Charon Relay,
  humanity expanded rapidly and began switching on every dormant mass relay it
  could find. A turian patrol fleet caught human survey ships reactivating the
  dormant Relay 314, an act forbidden under Citadel regulations imposed after the
  Rachni Wars. Rather than hail the newcomers, the turians opened fire and wiped
  out the expedition; a single human ship escaped to warn the Alliance, and a
  retaliatory force destroyed the turian vessels, escalating a policing action
  into open war. To the turians it was a lawful crackdown on a reckless species;
  to humanity it was its first contact with alien life.

  With its forces stretched thin by exploration, the Alliance lost several scout
  and patrol fleets and resorted to sending probes tipped with nuclear fusion
  warheads into turian space to deny technology capture. The soldier Tadius Ahern
  and a small squad famously held off dozens of turians for five minutes to buy
  time for an evacuation. The turians broke through to Shanxi, humanity's nearest
  colony, and laid a protracted orbital siege that starved the garrison until
  General Williams — grandfather of Ashley Williams — surrendered, the first and
  only time a human general has capitulated. A month later Admiral Kastanie
  Drescher led the Second Fleet in a surprise counterattack that drove the
  turians off Shanxi. Both sides mobilized for full-scale interstellar war.

  The Citadel Council intervened to broker peace before the fighting could widen,
  and through the negotiations humanity learned of the Citadel and the wider
  galactic community. Total human losses were only 623, with slightly higher
  turian casualties. The armistice anniversary became Armistice Day.
consequences:
  - Roughly 623 humans killed; slightly higher turian casualties; war ends after three months
  - Humanity makes formal first contact with the Citadel Council and the wider galactic community
  - Shanxi besieged, surrendered by General Williams, then liberated by Admiral Drescher's Second Fleet
  - Turians ordered to pay heavy war reparations to humanity
  - Humanity gains a galactic reputation as aggressors, feeding Alliance xenophobia
  - Contributes to the rise of pro-human groups such as Terra Firma and Cerberus
  - Some nuclear-armed Alliance probes remain unrecovered in turian space as a state secret
  - Saren Arterius develops a lasting hatred of humanity after his brother's involvement
  - The armistice anniversary is commemorated as Armistice Day
  - Human-turian relations slowly improve, later exemplified by the joint construction of the SSV Normandy
  - A crashed turian research vessel carrying an artifact on Shanxi sets in motion Desolas Arterius's later plot
