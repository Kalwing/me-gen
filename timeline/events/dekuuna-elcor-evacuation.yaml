event_id: dekuuna-elcor-evacuation
title: "Dekuuna: Elcor Evacuation and the Code of the Ancients"
game: Mass Effect 3
chronological_order: 1840
date: "2186 CE"
summary: |
  During the Reaper invasion of 2186 the elcor homeworld Dekuuna, in the Phontes system
  of the Silean Nebula, came under heavy Reaper assault. In the side mission "Dekuuna:
  Elcor Extraction," available after Priority: Rannoch, the elcor ambassador on the
  Citadel asked Commander Shepard to arrange an emergency extraction of warriors and
  civilians trapped on the planet. Shepard scanned near Dekuuna's moon Oltan, located
  the Elcor Flotilla and recovered it as a war asset. When Shepard reported back, the
  ambassador said the elcor had evacuated but that not enough civilians had escaped.

  In the linked mission "Dekuuna: Code of the Ancients," an angry elcor standing near
  the Citadel's Purgatory bar (or, alternatively, a Search and Rescue operation) needed
  the elcor holy book, the Code of the Ancients, to inspire his people during the war.
  The book lay on Dekuuna itself, and scanning the planet retrieved it. Returning it to
  the elcor completed the mission and strengthened the Citadel Defense Force war asset.
  Together these efforts brought the elcor military and their flotilla into the war
  effort against the Reapers, though at the cost of many elcor civilian lives.
characters:
  - Commander Shepard
  - Calyn
consequences:
  - The Elcor Flotilla is recovered as a Systems Alliance war asset
  - Elcor warriors and some civilians are evacuated from Dekuuna, with heavy civilian losses
  - The Code of the Ancients is recovered and returned to the elcor, boosting the Citadel Defense Force war asset
  - The elcor commit their military to the war against the Reapers
