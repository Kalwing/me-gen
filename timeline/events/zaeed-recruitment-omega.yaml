event_id: zaeed-recruitment-omega
title: "Dossier: The Veteran - Zaeed Massani Recruitment"
game: Mass Effect 2
chronological_order: 1120
date: "2185 CE"
summary: |
  Zaeed Massani is the galaxy's most feared and ruthless mercenary and bounty hunter, a veteran of decades of combat across the Terminus Systems. His reputation for brutality and efficiency is matched only by his appetite for revenge. Cerberus has retained his services at an exceptionally high cost, stationing him on Omega awaiting pickup for Commander Shepard's suicide mission.

  When Shepard finds Zaeed in a back alley near the Afterlife Club on Omega, he is brutally interrogating a batarian prisoner, extracting information through violent means. Zaeed mentions an outstanding personal vendetta: Vido Santiago, the current leader of the Blue Suns, seized control of an Eldfell-Ashland Energy (EAE) facility on the colony world of Zorya, usurping Zaeed's power base. Zaeed wants Shepard's assistance in retaking the facility and enacting his revenge. After shooting the fleeing prisoner in the leg and turning in the bounty for credits, Zaeed agrees to join Shepard's crew, taking up residence in the Starboard Cargo Hold on the Engineering Deck.

  Zaeed's recruitment is straightforward and immediate, with no complex mission required—he simply needs confirmation that Shepard will help him settle his score with Vido Santiago. His presence aboard the Normandy establishes the opportunity for his loyalty mission, during which he will pursue his vendetta against the Blue Suns leader. Zaeed becomes a hardened veteran asset, bringing decades of combat experience and heavy weapons expertise to Shepard's team.
characters:
  - Zaeed Massani
  - Commander Shepard
  - Vido Santiago (Blue Suns leader)
  - Batarian prisoner
consequences:
  - Zaeed Massani joins Shepard's team
  - Zaeed establishes a vendetta mission against Vido Santiago
  - Zaeed takes up residence in the Starboard Cargo Hold
  - Zaeed becomes available for the suicide mission
  - Zaeed's loyalty mission opportunity is created (Price of Revenge)
