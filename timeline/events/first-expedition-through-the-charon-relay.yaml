event_id: first-expedition-through-the-charon-relay
title: First Expedition Through the Charon Relay
game: Mass Effect
chronological_order: 130
date: "2149 CE"
summary: |
  In 2148, human researchers uncovered Prothean ruins on Mars that referenced a
  massive piece of transit technology hidden at the edge of the Sol system. The
  following year, in 2149, a human science team exploring near Pluto determined
  that "Charon," long believed to be one of Pluto's moons, was in fact an enormous
  dormant mass relay encased in hundreds of kilometers of ice and left behind by
  the Protheans. Although the physics behind mass relay construction was still far
  beyond human science, the team succeeded in reactivating the derelict device.

  Exploratory probes fired through the reactivated Charon Relay immediately dropped
  out of contact, and none carried enough power to transmit a signal back through
  the link. The Systems Alliance concluded that the only way to learn where the
  relay led was to send a crewed team through it. Jon Grissom was chosen to lead
  that first expedition. The mission succeeded, and Grissom returned a celebrated
  hero, adopted by the public as one of the great pioneers of human deep-space
  exploration, though he was personally a withdrawn man who disliked the fame. His
  transit opened the Sol system to the wider galaxy and established the Charon
  Relay as the permanent gateway between Earth and the rest of settled space,
  accelerating humanity's expansion into the Local Cluster and beyond and setting
  the stage for the colonization drive that would bring humans into contact with
  the turians in 2157. The Jon Grissom Academy, commissioned in 2176 over Elysium,
  was later named in his honor.
characters:
  - Jon Grissom
  - Systems Alliance
  - The Protheans
consequences:
  - The Charon Relay is reactivated by a human science team in 2149
  - Jon Grissom leads the first crewed transit through the relay and returns a hero
  - Sol is connected to the galactic mass relay network
  - Humanity begins rapid expansion and colonization beyond the Sol system
  - Grissom becomes a reclusive celebrity and later a First Contact War commander
  - The Jon Grissom Academy is later named after him
