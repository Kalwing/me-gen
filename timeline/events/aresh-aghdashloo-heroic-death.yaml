event_id: aresh-aghdashloo-heroic-death
title: Aresh Aghdashloo's Heroic Death on Elysium
game: Mass Effect 3
chronological_order: 1520
date: "2186 CE"
summary: |
  In 2186, during the Reaper invasion of the colony Elysium, Aresh Aghdashloo, a human biotic survivor of the Cerberus Teltin Facility and the destruction of the facility on Pragia, achieves redemption and heroic sacrifice. Aresh had survived horrific experiments conducted by Cerberus to engineer advanced biotic soldiers, including lethal trials that killed most of the child test subjects. After his escape from Teltin, Aresh became psychologically trapped in the trauma, attempting to rebuild the facility as a way to rationalize the suffering. When Commander Shepard and Jack returned to Pragia to destroy the facility and confront Aresh, the Teltin base was bombed. Aresh's fate in this encounter depended on player choice: if spared through Shepard's persuasion, he survived the facility's destruction. Following his reprieve, Aresh left his criminal past behind and found honest work, eventually ending up on the colony of Elysium when the Reapers invaded. During the evacuation chaos, a shuttle carrying children who had lower priority in the evacuation lottery was nearly destroyed by Reaper forces preventing its escape. Aresh, now a biotic worker among the colony's population, stepped into combat against overwhelming Reaper forces to save the shuttle. Witnesses reported that Aresh, fighting desperately, killed several dozen Reaper creatures—an extraordinary feat of individual combat prowess against overwhelming odds—giving the shuttle just enough time to reach escape velocity. In the process of his heroic stand, Aresh was overwhelmed and killed by Reaper forces. His death transformed him from a broken man trapped in trauma into a hero who saved innocent children, representing a profound redemption arc. News of his sacrifice reached Commander Shepard through an Alliance News Network alert, confirming both his survival of the Teltin destruction and his ultimate heroic end.
