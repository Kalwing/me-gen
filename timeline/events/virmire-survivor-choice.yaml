event_id: virmire-survivor-choice
title: 'Virmire: Assault - The Survivor Choice'
game: Mass Effect
chronological_order: 640
date: 2183 CE
summary: "During the assault on Saren's base on Virmire, Commander Shepard's team\
  \ was forced to split into two groups: one to plant explosives on the facility's\
  \ AA tower, the other to cover them from a nearby position while holding the bomb\
  \ that would destroy the facility. The two choices for who stayed behind were Staff\
  \ Lieutenant Kaidan Alenko and Gunnery Chief Ashley Williams\u2014one of them would\
  \ survive the mission while the other would be killed.\n\nThe final confrontation\
  \ required Shepard to choose between saving one of the two squad members. If Ashley\
  \ Williams was left to guard the bomb, Shepard had to choose between saving Kaidan\
  \ at the AA tower or racing back to rescue Ashley from overwhelming geth forces.\
  \ If Kaidan was left to guard the bomb, Shepard could attempt to save Ashley instead.\
  \ The timer on the bomb forced an impossible decision, and whichever choice Shepard\
  \ made would result in the death of the abandoned squad member.\n\nThis choice had\
  \ massive ripple effects throughout the remainder of Mass Effect and into the entire\
  \ trilogy. The Virmire survivor would remain Shepard's loyal companion for the rest\
  \ of the first game, would return in Mass Effect 2 missions to confront Shepard\
  \ about their Cerberus ties, and would be critical to the events of Mass Effect\
  \ 3. According to statistics, approximately 60% of players saved Ashley while 40%\
  \ saved Kaidan. The unchosen squad member would be reported as killed in action\
  \ but their death would haunt the narrative of the subsequent games, with the survivor\
  \ questioning Shepard's judgment and loyalty.\n"
characters:
- Commander Shepard
- Gunnery Chief Ashley Williams
- Staff Lieutenant Kaidan Alenko
- Geth forces
- Major Kirrahe
- Salarian STG team
consequences:
- One of Ashley Williams or Kaidan Alenko dies in the explosion and geth assault (per
  `virmire_survivor`)
- If Ashley survives: Ashley continues as Shepard's squad member, returns in ME2 to
    confront Shepard about Cerberus, and rejoins in ME3 as a potential romance interest
    and war asset
- If Kaidan survives: Kaidan continues as Shepard's squad member, and Ashley is marked
    as KIA
- The Virmire survivor will later confront Shepard on the Citadel during the Cerberus
  coup in ME3
- The survivor's trust in Shepard becomes a critical factor in ME3's Citadel II mission
- The unchosen squad member remains dead throughout the trilogy
- Shepard's decision affects relationships and dialogue with other squad members
