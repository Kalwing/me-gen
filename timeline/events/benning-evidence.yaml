event_id: benning-evidence
title: "Benning: Evidence Side Mission"
game: Mass Effect 3
chronological_order: 1780
date: "2186 CE"
summary: |
  On the Citadel, Commander Shepard encounters Ambassador Dominic Osoba, a grieving father searching for answers about his son's disappearance during a military operation on the human colony world of Benning. Osoba explains that his son, Bilal Osoba, was lost during a mission while serving with Alliance forces. His squadmates returned from Benning without him, but they refuse to discuss what happened, compounding the father's anguish and desire for closure.

  Shepard offers to help Osoba find evidence of his son's fate. During subsequent operations on Benning—either during an N7 Cerberus Abductions mission or another Hackett-sanctioned operation—Shepard's team discovers Bilal Osoba's dog tags lying on the ground near Building 22 in the colony's upper streets, evidence of his death during the fighting against Cerberus forces and Reaper occupation.

  Alternatively, if Shepard does not find the dog tags during the field mission, they can be purchased from the Spectre Requisitions store in the Citadel Embassies for 1,000 credits. Upon returning to the Citadel with the recovered dog tags, Shepard delivers them to Ambassador Osoba. The act of providing tangible proof of his son's sacrifice provides the grieving father with long-sought closure, allowing him to honor his son's memory and accept his fate. The dog tags bear the SSV Normandy's insignia, matching the design used for the crew's tags years earlier.
characters:
  - Commander Shepard
  - Ambassador Dominic Osoba
  - Bilal Osoba (deceased)
  - Alliance military personnel
consequences:
  - Bilal Osoba's death on Benning confirmed
  - Dog tags recovered as evidence of his sacrifice
  - Ambassador Osoba receives closure regarding his son's fate
  - Shepard gains reputation for honoring fallen soldiers
  - Dominic Osoba memorializes his son through the recovered dog tags
  - The Alliance gains recognition for Bilal Osoba's heroic sacrifice during Benning's defense
