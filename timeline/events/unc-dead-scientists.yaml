event_id: unc-dead-scientists
title: "UNC: Dead Scientists"
game: Mass Effect
chronological_order: 690
date: "2183 CE"
summary: |
  In 2183 the Alliance notices a pattern of murdered Alliance-affiliated scientists
  and Commander Shepard investigates. The killer is Corporal Toombs, a marine who was
  at Akuze, where Cerberus deliberately drew thresher maws onto his unit as an
  experiment. Toombs survived; Cerberus, delighted, secretly took him for years of
  study, including injections of thresher maw acid. He eventually escaped, and,
  deeply traumatised, began systematically hunting down and killing the scientists
  responsible, hiring mercenary help.

  Shepard tracks Toombs to a facility on the planet Ontarom in the Newton system of
  the Kepler Verge, fighting through human mercenaries guarding the entrance. Inside,
  Toombs is holding a gun on the last surviving scientist, Dr. Wayne. Shepard faces a
  choice: talk Toombs down by promising Wayne a public trial and Toombs psychological
  treatment; let Toombs execute Wayne; kill Wayne personally under Spectre authority;
  or shoot Toombs to save Wayne and have the Fifth Fleet take Wayne for trial. If
  Shepard has the Sole Survivor background (also an Akuze survivor) and both spares
  Wayne and stops Toombs, Toombs remarks that the vids say Shepard was the only one
  to escape Akuze, says "who am I to argue?" and kills himself.

  The aftermath is reported in Galactic News. If Toombs is talked down and Wayne
  lives, both testify against Cerberus and an independent inquiry proceeds, though
  Wayne is granted immunity for cooperating. If Wayne is killed, Toombs' testimony is
  later dismissed for lack of evidence as the claims of a disturbed man. If Toombs
  survives to 2185 and learns Shepard is working with Cerberus, he sends a furious
  message titled "What the hell?", declaring he now runs his own merc team that kills
  any Cerberus unit it finds, Shepard included.
characters:
  - Toombs
  - Commander Shepard
  - Dr. Wayne
consequences:
  - "Per player choice: Toombs is talked down, allowed his revenge, or shot dead; Dr. Wayne lives or dies"
  - "If Shepard has the Sole Survivor background and spares Wayne while stopping Toombs, Toombs commits suicide"
  - If both Toombs and Wayne survive, an independent inquiry into Cerberus proceeds on their testimony, with Wayne given immunity
  - If Wayne dies, Toombs' accusations against Cerberus are dismissed for lack of evidence
  - If Toombs survives, in 2185 he forms his own mercenary team hunting Cerberus and threatens the Cerberus-allied Shepard
