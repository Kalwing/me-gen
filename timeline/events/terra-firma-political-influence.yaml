  - Political climate for human-alien relations affected across the galaxy
  - Terra Firma continues to influence human politics in subsequent games regardless of choice
  - Shepard's political stance recorded by the Alliance leadership
  - Demonstrates Shepard's influence on human policy and values
  - Sets precedent for how Shepard's choices affect broader political/social systems

