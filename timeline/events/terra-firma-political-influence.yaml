event_id: terra-firma-political-influence
title: "Citadel Political Influence - Shepard's Endorsement Choice for Terra Firma"
game: Mass Effect
chronological_order: 460
date: "2183 CE"
summary: |
  As Commander Shepard's fame grew following the appointment as the first human Spectre, political groups on the Citadel sought the Commander's endorsement and support. Charles Saracino, the charismatic leader of the Terra Firma Party—a growing political movement advocating for human independence and resistance to alien influence—sought Shepard's backing for his run for a seat in the Alliance Parliament.

  Outside Flux in the Upper Wards, Saracino and his supporters gathered near the stairs, promoting his candidacy and xenophobic rhetoric. Saracino approached Shepard directly, believing that a public endorsement from the first human Spectre would be invaluable to his political ambitions. Shepard faced a critical choice: endorse Saracino's candidacy or refuse to support the party.

  Squad members in Shepard's presence voiced their own objections to Saracino's platform. Ashley Williams, if present, expressed her own concerns about his approach. Kaidan Alenko, Liara T'Soni, Garrus Vakarian, and Urdnot Wrex all had varying reactions to Saracino's xenophobic stance. Shepard could encourage or curtail these objections, further shaping the political landscape.

  Per choice conditional:
  - Endorsed Saracino: Granted Renegade points; Saracino gained parliamentary support, strengthening Terra Firma's political position
  - Refused endorsement: Granted Paragon points; Saracino was later exposed and pleaded guilty to tax evasion (in Legendary Edition)

  In Mass Effect 2, news reports reflected Shepard's choice. If endorsed, Terra Firma gained significant parliamentary influence, creating a political faction that viewed Shepard with approval. If not endorsed, Saracino faced legal consequences, and Terra Firma's growth was stalled. Despite the legal outcome, the party continued to exist as a political force with xenophobic elements.

  The choice represented a fundamental decision about how Shepard's influence would be used in human politics and foreshadowed the deeper tensions between human unity and xenophobic isolationism that would surface in later conflicts.

