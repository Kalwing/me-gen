event_id: jon-grissom-death
title: Death of Rear Admiral Jon Grissom
game: Mass Effect 3
chronological_order: 1330
date: "approx. 2185 CE"
summary: |
  Rear Admiral Jon Grissom, the famed Systems Alliance explorer who led the first
  crewed transit through the Charon Relay in 2149 and later fought in the First
  Contact War, died of natural causes in either late 2185 or early 2186. His death
  came roughly six months before the incident in which the Reaper-controlled former
  Cerberus operative Paul Grayson boarded the Jon Grissom Academy over Elysium.

  Grissom had spent his final decades as a recluse, first on Elysium and refusing
  all contact with Alliance media after 2160. Only a small circle knew that the
  Alliance systems technician and Ascension Project faculty member Dr. Kahlee
  Sanders, born in 2139 to an unknown mother, was his daughter - a fact recorded
  only in classified Alliance documents filed by David Anderson. That secret had
  already had consequences: in 2183, the Cerberus infiltrator Dr. Jiro Toshiwa
  exposed himself as a traitor at the Ascension Project by referring to Kahlee's
  father, knowledge he could only have obtained from classified files.

  Hundreds of dignitaries attended Grissom's funeral, among them Admiral David
  Anderson, who had known Grissom since 2157 when the admiral briefed the newly
  graduated N7 officer about the attack on Shanxi. Kahlee Sanders attended the
  service only as a member of the Academy faculty, maintaining to the end the
  fiction that Grissom was not her father. A memorial plaque bearing Grissom's
  name and likeness was subsequently erected in the mess hall of the Jon Grissom
  Academy, the Alliance's premier school for gifted students and biotics, which had
  been commissioned in his honour over Elysium in 2176.
characters:
  - Jon Grissom
  - Kahlee Sanders
  - David Anderson
  - Jiro Toshiwa
  - Paul Grayson
consequences:
  - Jon Grissom dies of natural causes in late 2185 or early 2186
  - A state funeral is held, attended by hundreds of dignitaries including David Anderson
  - Kahlee Sanders attends only as Academy faculty, preserving the secret that Grissom was her father
  - A memorial plaque to Grissom is erected in the Jon Grissom Academy mess hall
  - Grissom's death precedes Paul Grayson's Reaper-driven attack on the Academy by about six months
