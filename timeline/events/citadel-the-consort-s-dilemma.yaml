event_id: citadel-the-consort-s-dilemma
title: "Citadel: The Consort's Dilemma"
game: Mass Effect
chronological_order: 550
date: "2183 CE"
summary: |
  While pursuing Saren Arterius on the Citadel in 2183, Commander Shepard was
  approached by Sha'ira, the influential asari Consort who worked from the Consort's
  Chambers on the Presidium. Sha'ira feared for her reputation: a former client and
  friend, the turian General Septimus Oraka, had been spreading lies about her after
  she rejected his romantic advances because of her position. She asked Shepard to
  speak to Septimus soldier to soldier and remind him of his honour.

  Shepard found Septimus drowning his sorrows in Chora's Den in the Wards. Through
  persuasion (or intimidation), Shepard convinced him to stop the smear campaign and
  behave like a general again; Septimus resolved to send Sha'ira an apology. He then
  admitted a further wrong: in his anger he had discovered a compromising secret about
  the elcor diplomat Xeltan and had told Xeltan that the Consort was the one who had
  leaked it. Xeltan had carried the accusation to the elcor ambassador at the
  Embassies. Septimus gave Shepard the details of how he had actually uncovered the
  secret so that Sha'ira could be exonerated (the assignment "Citadel: Xeltan's
  Complaint").

  Shepard delivered the evidence to Xeltan, who was shocked that Septimus could have
  found the secret at all and worried that anyone might; Shepard could reassure him or
  let him stew before he left to make peace with Sha'ira. Returning to the Consort's
  Chambers, Shepard completed the task. Sha'ira rewarded Shepard with credits, XP and
  a personalised "gift of words," an affirmation tailored to Shepard's background and
  psychological profile. If Shepard expressed disdain for the reward, Sha'ira instead
  initiated a sexual encounter before handing over a mysterious Prothean trinket,
  usable at a ruin on Eletania. Septimus and Sha'ira reconciled and became friends
  again. In 2185 Sha'ira sent Shepard a follow-up message, "A Gift of Words," warning
  that Shepard was heading toward "an even deeper darkness" and urging the Commander to
  keep those who fought alongside them of clear mind and glad heart.
characters:
  - Commander Shepard
  - Sha'ira
  - Septimus Oraka
  - Xeltan
  - Nelyna
consequences:
  - Septimus Oraka ends his smear campaign against Sha'ira and reconciles with her
  - Xeltan is given proof of Sha'ira's innocence and takes the matter back to her
  - Shepard receives a "gift of words" and, optionally, a Prothean trinket usable at the Eletania ruins
  - Sha'ira remains a Shepard ally, sending a warning message in 2185 and reappearing during the Citadel DLC in 2186
