event_id: rannoch-admiral-koris
title: "Rannoch: Admiral Koris"
game: Mass Effect 3
chronological_order: 1640
date: "2186 CE"
summary: |
  During the quarian war to retake Rannoch in 2186, Admiral Zaal'Koris vas Qwib-Qwib,
  commander of the Migrant Fleet's Civilian Fleet, sacrificed his ship to destroy a
  geth planetary defense cannon. His vessel crash-landed on Rannoch and he was
  separated from his crew and cut off by the geth, leaving the Civilian Fleet - the
  bulk of the flotilla, including the liveships - without a leader. During the debrief
  after Priority: Geth Dreadnought, Admiral Shala'Raan reported that many Civilian
  Fleet captains, panicking without Koris, planned to break formation and run for the
  mass relay past the geth guns. Commander Shepard offered to land and rescue him. The
  mission is available only after Priority: Geth Dreadnought and before Priority:
  Rannoch.

  En route, Admiral Daro'Xen reported the Civilian Fleet had taken losses and that
  Koris's escape pod had gone down near a jamming tower before communications were
  lost. Anti-aircraft guns drove off Steve Cortez's shuttle, so Shepard's squad
  advanced on foot through geth territory - shielded synthetics, armored support, Geth
  Primes, cloaked Geth Hunters, and Geth Trip Mines - disabling the AA guns so Cortez
  could destroy the jamming tower. Along the way the squad found a Javelin sniper rifle
  and other salvage and encountered Dorn'Hazt, a mortally wounded crewman from Koris's
  ship, who explained that the Civilian Fleet had never wanted war with the geth and
  might flee without Koris before he directed Shepard to the admiral's position.

  Contacted by shuttle, Koris - in a heavy firefight - refused rescue and demanded
  Shepard save his crew instead. With sufficient Reputation, Shepard can persuade him
  to be picked up. Whatever the choice, Shepard mans a shuttle turret and shoots down
  Geth Rocket Troopers and their missiles - actually aimed at the shuttle - until the
  rescued party is aboard. If Shepard lets Koris die, he primes a grenade and charges
  a Geth Prime; his leadership is lost, the Quarian Civilian Fleet war asset drops by
  75 Military Strength, surviving civilian captains panic and are cut down fleeing, and
  quarian-geth peace may become impossible depending on other choices. If Koris
  survives, he is added as a war asset worth 25 Military Strength, talks the captains
  into holding formation, and later lends Shepard his authority when the Commander
  orders all quarian ships to cease fire to broker peace at Rannoch. Completing the
  mission with Koris alive produces a thank-you email from Captain Nav'Teel vas
  Ghrigult, Dorn'Hazt's cousin. Afterward Admiral Raan argues with Admiral Han'Gerrel,
  and after the second Rannoch side mission Admiral Xen argues with Tali, with
  Shepard's support affecting the Quarian Heavy Fleet and Advanced AI Relays assets.
characters:
  - Commander Shepard
  - Zaal'Koris
  - Shala'Raan
  - Daro'Xen
  - Han'Gerrel
  - Steve Cortez
  - Tali'Zorah
  - Javik
  - Dorn'Hazt
  - Nav'Teel
consequences:
  - Shepard's squad disables the geth AA guns and Cortez destroys the jamming tower
  - "Player choice: Koris is rescued, or Koris is left to die fighting the geth"
  - If Koris dies, the Quarian Civilian Fleet war asset loses 75 Military Strength and panicked captains are killed fleeing the system
  - If Koris dies, quarian-geth peace at Priority: Rannoch may become impossible depending on other choices
  - If Koris survives, he is gained as a 25-strength war asset, steadies the Civilian Fleet, and later backs Shepard's ceasefire order to broker peace
  - Dorn'Hazt dies of his wounds after guiding Shepard; a grateful email arrives from his cousin Nav'Teel if Koris lives
  - The Javelin sniper rifle can be acquired
  - Triggers the Raan vs. Han'Gerrel and Xen vs. Tali admiralty arguments affecting the Quarian Heavy Fleet and Advanced AI Relays assets
