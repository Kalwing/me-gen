event_id: sirta-foundation-chohe-hostage-crisis
title: "Hostage Crisis at the Sirta Foundation Facility on Chohe"
game: Mass Effect
chronological_order: 600
date: "2183 CE"
summary: |
  In 2183, a band of biotic extremists seized the Sirta Foundation research outpost on
  Chohe, the second planet of the Cacus system in the Hades Gamma cluster, and took the
  facility's entire scientific staff hostage. The Sirta Foundation was a renowned human
  biomedical non-profit best known for eliminating several hereditary human diseases and
  for inventing medi-gel; the Chohe outpost studied the planet's hardy native
  subterranean life. Admiral Hackett of the Systems Alliance contacted Commander Shepard
  aboard the Normandy and dispatched the Commander to resolve the situation (the
  assignment "UNC: Besieged Base").

  Shepard's team landed and fought through the outpost's cramped prefab modules, where
  every hostile was biotically capable and the unarmed scientists were scattered among
  the fighting, easily caught in crossfire or killed by area powers. Shepard cleared the
  structure room by room and confronted the extremist leadership. The mission's
  consequences turned entirely on how many of the captive scientists Shepard managed to
  keep alive.

  If most of the scientists died, the loss of personnel and research crippled the Sirta
  Foundation. By 2185 heavy cumulative casualties had brought the company to the edge of
  bankruptcy and analysts expected it to dissolve; it was saved only when asari colonists
  on Lusia began selling platinum mined from a moon of Pronoia to Sirta well below market
  price, a discount widely credited with single-handedly keeping the Foundation solvent.
  If most of the scientists survived, Sirta instead remained healthy and prosperous and
  soon announced a breakthrough cure for a cross-species strain of influenza. Either way
  Sirta's technology remained in wide use: by 2186 the biometric authentication systems
  behind the Citadel's refugee-era security checkpoints were built on Sirta Foundation
  designs.
characters:
  - Commander Shepard
  - Hackett
consequences:
  - The biotic extremists occupying the Chohe outpost are killed and the siege is broken
  - "Per how many hostages Shepard saves: if most scientists die, the Sirta Foundation is left near bankruptcy by 2185 and is rescued only by discounted Lusia/Pronoia platinum sales"
  - "Per how many hostages Shepard saves: if most scientists survive, Sirta prospers and later announces a cross-species influenza cure"
  - Sirta Foundation biometric technology later underpins Citadel security checkpoints during the 2186 refugee influx
