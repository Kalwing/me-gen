event_id: haliat-agebinium-ambush
title: "Elanos Haliat's Ambush on Agebinium"
game: Mass Effect
chronological_order: 620
date: "2183 CE"
summary: >
  Disgraced after the failed Skyllian Blitz, the turian pirate Elanos Haliat sought
  to restore his reputation among the Terminus raiders by killing the first human
  Spectre, Commander Shepard. He recovered an Alliance espionage probe left over
  from the First Contact War that carried a heavy nuclear payload, activated its
  homing beacon, and hid it in a mine on the barren world Agebinium in the Voyager
  Cluster, expecting the Alliance to send someone to retrieve it. When Shepard's
  team arrived in response to the probe's distress signal, Haliat waited until they
  were deep inside the mine, then detonated a seismic charge to seal them in and
  armed the probe's nuclear warhead on a ten-second countdown, taunting Shepard over
  a hologram (and, if Shepard was a decorated War Hero, blaming the Commander for
  his disgrace). Shepard's team disarmed the warhead and escaped. Haliat had stolen
  Shepard's Mako and taken it back to his camp; when Shepard tracked him down, he
  and his followers attacked. Every pirate, including Haliat himself, was killed in
  the firefight.
characters:
  - Elanos Haliat
  - Commander Shepard
consequences:
  - The First Contact War-era nuclear espionage probe was disarmed before detonation
  - Elanos Haliat and his pirate band were killed on Agebinium
  - The Skyllian Blitz's principal organiser was permanently eliminated
