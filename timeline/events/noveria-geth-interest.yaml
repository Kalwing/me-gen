event_id: noveria-geth-interest
title: "Noveria: Geth Interest - Shepard Investigates Corporate Research Colony"
game: Mass Effect
chronological_order: 700
date: "2183 CE"
summary: |
  After achieving Spectre status in 2183, Commander Shepard is briefed by Citadel Council Ambassador Udina that the Council has received reports of geth interest in Noveria, a privately chartered corporate research colony outside Citadel space. Shepard is given command of the SSV Normandy and orders to investigate. Captain David Anderson warns that Noveria is troublesome and that only Spectre authority will be respected there.

  Upon arrival at the planet, Noveria's traffic control initially refuses the Normandy landing clearance, citing that the vessel is not on the scheduled arrival list and that the ship is being tracked by defensive systems. Joker invokes Citadel authority and informs traffic control that a Council Spectre is aboard, prompting clearance pending identity confirmation.

  When Shepard's team disembarks at Port Hanshan, Captain Maeko Matsuo and Sergeant Kaira Stirling attempt to confiscate the squad's weapons, citing strict port policy against firearms. Shepard can either comply or refuse, testing the team's resolve. Gianna Parasini, the administrative assistant to Port Administrator Anoleis, interrupts and confirms Shepard's Spectre identity via security systems, granting the privilege to carry weapons and overriding the port's firearms restriction.

  Shepard learns from Parasini that Matriarch Benezia has recently arrived and headed to Peak 15, a remote research facility in the Skadi Mountains. Parasini explains that Port Administrator Anoleis must approve any departure from Port Hanshan. The mission expands beyond mere investigation: Shepard must navigate corporate politics, gather information about why the geth are interested in Noveria's research, and pursue Benezia into the depths of the facility while uncovering Binary Helix's secret rachni breeding project.
characters:
  - Commander Shepard
  - David Anderson
  - Donnel Udina
  - Citadel Council
  - Matriarch Benezia
  - Gianna Parasini
  - Administrator Anoleis
  - Captain Maeko Matsuo
  - Sergeant Kaira Stirling
  - Jeff "Joker" Moreau
consequences:
  - Shepard gains first-hand knowledge that the geth are actively interested in Noveria's research facilities
  - Port Hanshan's security procedures and corporate governance become evident, showing the complexity of operating outside Citadel space
  - Shepard is granted Spectre privilege to carry weapons and operate on Noveria despite corporate resistance
  - The player can pursue multiple side objectives on Port Hanshan, including espionage opportunities and additional assignments
  - The mission leads directly to confronting Matriarch Benezia at Peak 15 and discovering the rachni breeding project
  - Shepard's handling of the port authority and weapons confiscation can affect crew morale and relationships
