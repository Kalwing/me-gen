event_id: ilos-conduit-citadel
title: 'Ilos: Discovery of the Conduit and Reaching the Citadel'
game: Mass Effect
chronological_order: 780
date: '2183 CE'
summary: >
  In the final stages of Mass Effect, Commander Shepard's investigation into Saren
  Arterius and the geth threat led to the discovery of Ilos, a hidden Prothean world
  in the Styx Theta system beyond the Mu Relay. Ilos contained the ruins of advanced
  Prothean civilization and, most critically, the secret that would determine the
  fate of the galaxy.

  Upon reaching Ilos, Shepard's squad encountered Vigil, a damaged but still-functional
  virtual intelligence left behind by Prothean researchers as a safeguard. Vigil
  revealed the true nature of the Reapers—an ancient, recurring threat that had wiped
  out the Protheans approximately 50,000 years prior. The Reapers were not myths or
  legends but an existential force that periodically harvested advanced civilizations
  across the galaxy in a never-ending cycle of extinction and rebirth.

  Vigil's most crucial revelation concerned the Conduit: a small-scale mass relay
  prototype built by Prothean researchers during their experiments with relay
  technology. Unlike the standard mass relay network that connected most of the
  galaxy, the Conduit was a one-way "back door" specifically constructed to bypass
  the main relay network entirely. Its receiving end on the Citadel had been mistaken
  for a piece of Prothean art called the Relay Monument and had been left untouched
  by the Citadel's automatons (the Keepers) for millennia. The Conduit was the key
  to reaching the Citadel without traveling through the exposed, monitored Charon
  Relay or any other conventional mass relay route.

  Vigil explained that the surviving Prothean researchers had used this Conduit to
  reach the Citadel after the Reapers' initial departure. Once there, they had altered
  the signal that the Keepers received from the Reaper Sovereign, preventing the relay
  network from opening to dark space and allowing the full Reaper fleet to enter the
  galaxy. This act of sabotage had saved countless civilizations from immediate
  destruction—but at a cost. Trapped on the Citadel by the one-way nature of the
  Conduit, the Prothean researchers eventually starved, leaving behind only their
  legacy and the device itself.

  Commander Shepard's team commandeered the Conduit's prototype relay, located at
  the base of an ancient Prothean structure on Ilos. The relay required a vehicle
  to traverse safely; Shepard's squad took the Mako (an armored personnel carrier)
  and drove it directly into the Conduit just as it was beginning to shut down after
  Vigil's activation. The journey through the Conduit subjected Shepard and the team
  to extreme gravitational forces, but the enclosed Mako's design allowed its
  passengers to survive the passage intact.

  Shepard emerged on the Citadel at the base of the Relay Monument, the Conduit's
  receiving terminus. The sudden arrival of a ground vehicle on the Citadel was
  unprecedented and allowed Shepard to bypass Saren's defenses and security measures.
  The Commander then engaged Saren Arterius and the massive Reaper entity Sovereign
  in a final confrontation that would determine whether the galaxy's cycles of
  extinction would continue or finally break.

  The discovery and use of the Conduit represented a pivotal moment: it transformed
  Shepard from a fugitive hunted by Saren into a direct threat to Sovereign and the
  Reaper cycle itself. Without the Conduit, reaching the Citadel would have been
  impossible; with it, Shepard could confront the galaxy's greatest threat at the
  heart of galactic civilization.
