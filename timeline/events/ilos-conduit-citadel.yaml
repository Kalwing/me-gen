consequences:
  - >
    Commander Shepard discovers the true nature of the Reapers as an ancient,
    recurring extinction threat that cycles through the galaxy.
  - >
    Vigil reveals the historical fate of the Protheans, destroyed by the Reapers
    approximately 50,000 years prior.
  - >
    Shepard learns that the Citadel's Relay Monument is actually the Conduit's
    receiving terminus, a Prothean-built back-door relay to the Citadel.
  - >
    Shepard understands that Prothean survivors used the Conduit to reach the Citadel
    and sabotage the relay-opening signal, delaying (but not preventing) Reaper entry.
  - >
    Commander Shepard successfully traverses the Conduit via the Mako, surviving the
    gravitational forces of the one-way relay passage.
  - >
    Shepard emerges directly on the Citadel, bypassing conventional defenses and
    achieving access to the station's heart.
  - >
    Shepard is now positioned to confront Saren Arterius and Sovereign on the Citadel
    itself, escalating the conflict to a climactic finale.
  - >
    The knowledge of the Conduit and Vigil's revelations become critical to humanity's
    understanding of the threat posed by the Reapers.
