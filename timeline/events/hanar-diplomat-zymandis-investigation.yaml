event_id: hanar-diplomat-zymandis-investigation
title: "Citadel: Investigating the Indoctrinated Hanar Diplomat"
game: Mass Effect 3
chronological_order: 1830
date: "2186 CE"
summary: |
  During the Reaper War in 2186, the salarian Spectre and STG agent Jondum Bau came
  across intelligence suggesting that high-level hanar officials had been
  indoctrinated, and emailed Commander Shepard for help. Bau had learned that the
  Systems Alliance had run a black-ops raid on a batarian research station, with
  covert hanar assistance, to seize Reaper technology the batarians were studying.
  The Alliance came away with nothing, while hanar operatives were suspected of
  escaping with artifacts likely to indoctrinate them. Bau obtained the soul names
  of the hanar involved, one of whom was now a diplomat on the Citadel; he had
  acquired the intel either by paying off the weapons dealer Donovan Hock or
  through an anonymous "gift" he attributed to the master thief Kasumi Goto, whom
  he had long admired.

  Meeting Shepard at the Citadel Embassies, Bau explained the economic and
  territorial stakes for the salarians and asked Shepard to use Spectre authority
  to check records he could not access formally. He also assured Shepard that many
  Spectres now took the Reaper warnings seriously. Two suspects were eliminated,
  and the third was revealed as the diplomat Zymandis (soul name "Regards the
  Works of the Enkindlers in Despair"), who had been indoctrinated during the
  Alliance raid on the batarian lab. Zymandis admitted he had uploaded a virus
  designed to cripple the automated planetary defense network of the hanar
  homeworld Kahje, believing the hanar were destined to serve the Reapers.

  At the hanar embassy, Bau tried to block the transmission but was attacked and
  choked by Zymandis's human bodyguard. If Kasumi Goto was not present, Shepard had
  to choose between saving Bau and stopping the upload: stopping the upload left
  Bau to fight off and kill the bodyguard and Zymandis, taking a gut wound but
  surviving; saving Bau let him shoot Zymandis while the upload completed. If
  Kasumi was present, she decloaked and stopped the upload herself, the console
  exploding and apparently killing her, while Bau shot Zymandis and survived.
  Whether Kahje's defenses held or failed determined whether the hanar homeworld
  and the hanar–drell fleet were saved or overrun by the Reapers. If Bau survived,
  he pledged to rally other Spectres and allies to the war effort.
characters:
  - Jondum Bau
  - Zymandis
  - Commander Shepard
  - Kasumi Goto
  - Donovan Hock
consequences:
  - Shepard uses Spectre authority to identify the indoctrinated diplomat Zymandis
  - Zymandis is exposed as having sabotaged Kahje's automated planetary defenses
  - Zymandis is killed at the hanar embassy
  - Per the upload outcome, Kahje is either overrun by the Reapers or saved with its fleet
  - Jondum Bau survives (choice- and squad-conditional) and commits Spectre support to the war
  - Kasumi Goto is seemingly killed stopping the upload if she is present
