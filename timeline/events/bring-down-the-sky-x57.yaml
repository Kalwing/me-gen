event_id: bring-down-the-sky-x57
title: 'Bring Down the Sky: Batarian Attack on Asteroid X57'
game: Mass Effect
chronological_order: 590
date: 2183 CE
summary: "Asteroid X57 was a metallic asteroid 22 kilometers long originally located\
  \ at the trailing Lagrange point of the gas giant Borr in the Asgard System. The\
  \ asteroid had been targeted for conversion into a new orbital port facility to\
  \ support Terra Nova's growth. Planners had decided to mine out the asteroid and\
  \ use the recovered resources to finish its interior for habitation, with fusion\
  \ torches decelerating it from Borr's orbit so it would fall into orbit around Terra\
  \ Nova.\n\nA group of batarian terrorists led by Ka'hairal Balak seized the asteroid\
  \ mining site, murdering many of the engineering and survey crew including surveyors\
  \ and engineers C. Hymes, R. Montoya, G. Mendel, and T. Slajs. The batarians, led\
  \ by Balak—who hated humans because they claimed territory and resources he\
  \ believed should have belonged to batarians during humanity's early expansion into\
  \ the Skyllian Verge—planned to crash the asteroid into Terra Nova's colonies.\
  \ Balak viewed his actions as reprisal for the Skyllian Blitz on Elysium. The fusion\
  \ torches were reignited, causing the asteroid to accelerate toward Terra Nova and\
  \ placing millions of inhabitants in immediate danger. A devastating collision would\
  \ have caused cataclysmic upheavals lasting thousands to millions of years—\
  X57 was roughly twice the size of the asteroid that killed Earth's dinosaurs.\n\n\
  Commander Shepard was dispatched to stop the impact. Shepard had to overcome batarian\
  \ terrorists, disable three large fusion thrusters, rescue human survivors including\
  \ Kate Bowman and mining supervisor Simon Atwell, and confront Balak. The mission\
  \ presented a significant moral choice: whether to kill Balak or allow him to escape.\
  \ Following the DLC's completion, X57 was brought under control and slated to be\
  \ maneuvered into geosynchronous orbit around Terra Nova once repairs were finished.\
  \ Despite the batarians destroying months of work, experts predicted the port could\
  \ still open before the end of 2184.\n"
characters:
- Commander Shepard
- Ka'hairal Balak
- Batarian Charn
- Kate Bowman
- Simon Atwell
- Alliance engineering and survey teams
consequences:
- Asteroid X57 prevented from crashing into Terra Nova
- Kate Bowman and Simon Atwell rescued
- Batarian engineering crew and security teams killed
- Ka'hairal Balak either killed or escaped depending on player choice (per `bring_down_the_sky`)
- Months of batarian sabotage work destroyed
- Asteroid X57 planned for geosynchronous orbit around Terra Nova
- Port facility construction delayed but expected to complete by end of 2184
- Terra Nova colony and millions of inhabitants saved from extinction-level impact
