event_id: jack-recruitment-purgatory
title: "Dossier: The Convict - Jack Recruitment"
game: Mass Effect 2
chronological_order: 1060
date: "2185 CE"
summary: |
  Jack, a human woman with a history of violence and unprecedented biotic power, has been held in cryostasis aboard the Purgatory, a notorious turian-operated prison ship. She is rumored to be the most powerful human biotic ever encountered, with a violent past that made her dangerous enough to require permanent cryo-imprisonment. Cerberus negotiates her release by paying an exorbitant fee to the turian operators.

  When Commander Shepard arrives at the prison to secure Jack's release, the turian Warden Kuril welcomes the Commander and gives a tour of the facilities while feigning cooperation. However, Kuril betrays Shepard over the facility's intercom, declaring that Shepard is too valuable to leave alive and ordering security forces to secure the Commander for a higher price. The prison erupts into chaos as security systems activate and rioting prisoners break free.

  Shepard fights through Blue Suns mercenaries, combat mechs (including FENRIS and YMIR variants), and rioting prisoners to reach the cryo-containment section. Upon release, Jack breaks her restraints and unleashes a massive biotic blast that destroys the four YMIR Mechs guarding her cell. She then smashes through a reinforced wall, triggering a series of catastrophic decompression events throughout the cellblock as Shepard pursues her toward an airlock.

  The Warden makes a final stand, armed with an M-76 Revenant and protected by a shield powered by three independent generators. Shepard must destroy each generator to bring down Kuril's shield, then neutralize the Warden. After Kuril's death, Jack reaches the airlock and eliminates the remaining guards. Upon boarding the Normandy SR-2, Jack becomes enraged at the sight of the Cerberus logo, her hatred of the organization boiling over. A batarian guard nearly assassinates her, but Shepard intervenes, shooting the attacker and proving her worth.

  Jack agrees to join Shepard in exchange for access to the Cerberus database aboard the Normandy to uncover the organization's secrets and find those responsible for her abuse. Her demands create conflict with Miranda Lawson and Jacob Taylor, both veteran Cerberus operatives. Jack takes up residence in the sub-deck below main engineering, establishing herself as a hostile presence until her loyalty is earned. As a consequence of releasing all prisoners to secure Jack, Shepard receives threatening communications from an escaped psychopath named Billy.
characters:
  - Jack
  - Commander Shepard
  - Warden Kuril
  - Miranda Lawson
