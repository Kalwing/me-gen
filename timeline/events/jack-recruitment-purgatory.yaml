  - Billy (escaped psychopath)
consequences:
  - Jack is freed from cryostasis and cryo-stasis system destroyed
  - Warden Kuril and his security forces are killed
  - All prisoners held in the facility are released
  - Jack joins Shepard's team
  - Jack develops immediate hostility toward Miranda Lawson
  - Jack demands access to Cerberus files aboard the Normandy
  - Jack takes up residence in the sub-deck engineering area
  - Jack becomes a powerful biotic asset for the suicide mission
  - Escaped prisoner Billy sends threatening messages to Shepard
  - The Purgatory is destroyed/abandoned
