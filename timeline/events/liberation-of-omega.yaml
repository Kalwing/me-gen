  - Several Reaper Adjutants are destroyed
  - Aria T'Loak reclaims her position as ruler of Omega
  - "Conditional: General Oleg Petrovsky is either executed by Aria or spared as a show of her restored power"
  - Eezo supplies and mercenary forces are committed to the war effort
  - Omega becomes a significant asset in the campaign against the Reapers
  - The Talons are transformed into Omega's security force
  - Aria vows to rebuild Omega and prevent future conquest
