event_id: liberation-of-omega
title: Aria T'Loak's Liberation of Omega
game: Mass Effect 3
chronological_order: 1610
date: "2186 CE"
summary: |
  In 2186, following the acquisition of the Blood Pack, Blue Suns, and Eclipse forces, Aria T'Loak executes her long-planned campaign to retake Omega from Cerberus occupation. General Oleg Petrovsky, one of Cerberus's most accomplished operatives, had seized control of the station and installed an authoritarian regime complete with force fields, occupation troops, and experimental Reaper-derived Adjutants. Aria, in alliance with Commander Shepard, launches a multi-phase assault on the station. The campaign begins with a daring infiltration: Aria and Shepard board a captured Cerberus cruiser to breach the Cerberus fleet surrounding Omega. Once through enemy lines, Aria's fleet launches a devastating ambush attack on the Cerberus flagship, crippling the Reaper-controlled fleet. However, Petrovsky activates Omega's upgraded defensive systems, severely damaging Aria's fleet and forcing a rapid deployment of ground forces via escape pods. The assault team fights toward Aria's Bunker, a fortified position deep in Omega's D-Deck. There they encounter the Talons, a resistance gang led by turian biotic Nyreen Kandros. Nyreen, who had been in a past romantic relationship with Aria, agrees to provide critical support. The combined forces work to rally Omega's enslaved population and disable the Cerberus force fields that imprison the station. The assault proceeds through Omega's mines toward the central reactor, where the force fields draw power. Petrovsky, anticipating the move, traps Aria and her forces in additional barriers, but Shepard fights through to disable the reactor. This critical victory removes the force fields but creates a moral dilemma: immediately shutting down the reactor will kill civilians in life support sectors, while rerouting power increases the risk to Aria and Nyreen. Whatever choice Shepard makes, the station erupts in popular revolt as the civilian population rises against Cerberus. As the resistance forces push toward the Afterlife Club—Petrovsky's command center—Nyreen and her Talons assault from another direction, sacrificing themselves to eliminate a group of Reaper-controlled Adjutants. Nyreen is killed in the explosion. Enraged by Nyreen's death, Aria charges into Afterlife ahead of Shepard. Petrovsky has converted the club into his fortified headquarters and traps Aria in a stasis field. Shepard fights through Petrovsky's elite guard and Adjutants, ultimately freeing Aria. The final confrontation allows Shepard to choose whether Petrovsky lives or dies: Aria either executes him in a display of vengeance or spares him as a statement of her restored power. With Omega finally liberated, Aria broadcasts her victory to the Citadel and declares her commitment to rebuilding the station. She swears never to lose Omega again. BioWare accompanied the DLC's release with a promotional "Fight for Omega" Twitter broadcast dramatizing the communication war on the station, with the Talons broadcasting encrypted resistance messages against Cerberus's official propaganda feed.
