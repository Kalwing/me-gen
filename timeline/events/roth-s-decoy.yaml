event_id: roth-s-decoy
title: The Killing of Roth's Decoy on Themis
game: Mass Effect
chronological_order: 190
date: "2161 CE"
summary: |
  In 2161 CE the Shadow Broker tasked one of his agents, the woman later known as
  Maya Brooks, with killing Roth, a major financier of the pro-human survivalist
  organization Cerberus, and diverting Roth's funds to the Broker-aligned volus
  banker Barla Von. Roth was funding Cerberus and, according to the Broker's
  agent, was complicit in plans to sell the workers of an asteroid-mining facility
  orbiting the gas giant Themis (the innermost planet of the Arcturus system,
  which supplied most of the materials for the then-unfinished Arcturus Station)
  to turian slavers.

  Anticipating an assassination attempt, the real Roth fled the facility,
  ostensibly bound for Earth, and left an unnamed Cerberus operative behind as a
  decoy, installed in Roth's living quarters. Brooks infiltrated the mining
  complex, sparing and recruiting a young miner she used as cover, killed the
  mine foreman for information, posed as a clinic doctor to get past a guard, and
  entered Roth's quarters. Believing the decoy was Roth, she forced him at
  knifepoint to wire a large sum to Barla Von. The decoy tricked her into
  confirming she worked for the Shadow Broker, then knocked her through a window,
  drew a bladed claw weapon, and revealed he was only a stand-in. In the ensuing
  fight Brooks slashed his back and disarmed him, but he drew a gun and shot her
  in the torso. As he moved to finish her, the child distracted him by crying for
  "mommy," and Brooks threw her knife into his chest. Bleeding out, the decoy
  refused to give up the real Roth until she revealed the child was not her son,
  then admitted Roth had left for Earth. Brooks killed him with a kick to the
  head and left his body in Roth's quarters. She never caught Roth: as she
  prepared to follow him to Earth, the child, revealed to be a girl, shot her in
  the back and stole her ship, leaving her for dead and derailing the Broker's
  plan. The episode is drawn from Mass Effect: Foundation.
characters:
  - Roth's Decoy
  - Maya Brooks
  - Roth
  - Barla Von
  - The Shadow Broker
consequences:
  - Roth's decoy is killed, but the real Roth escapes toward Earth
  - A large sum is transferred to the Broker's banker Barla Von before the decoy is exposed
  - Maya Brooks fails her contract and is shot and left for dead by the child she used as cover
  - The Shadow Broker's plan to kill Roth and seize his funds is derailed
  - Cerberus's financier network and its ties to the anti-slaver freighter bombing are exposed in Foundation lore
