consequences:
  - Jeff Moreau becomes the official pilot of the SSV Normandy
  - The Normandy is proven combat-capable and tactically sound
  - Alliance-Turian relations are strengthened by collaborative military success
  - Joker's reputation as a prodigy pilot is established
  - The Normandy goes on to become humanity's flagship in the fight against Saren and the Reapers
  - Joker avoids court-martial due to Invectus's support
