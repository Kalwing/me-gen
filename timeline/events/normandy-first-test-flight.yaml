event_id: normandy-first-test-flight
title: SSV Normandy First Test Flight
game: Mass Effect
chronological_order: 360
date: "2183 CE"
summary: |
  In 2183, the SSV Normandy, a revolutionary Alliance stealth frigate designed collaboratively with the Turian Hierarchy, undergoes its first test flight at Arcturus Station. The event is attended by Alliance captains David Anderson and Dillard, and Turian Hierarchy official General Invectus. The test flight takes an unexpected and dramatic turn when Jeff "Joker" Moreau, a talented pilot with a degenerative bone condition, executes an unauthorized hijacking. Despite being passed over for the pilot position because of his disease, Joker had previously mentioned his disappointment to General Invectus, who had coldly dismissed him, stating that no cripple would ever pilot such an advanced vessel. Provoked by this insult, Joker boards the Normandy, locks the assigned pilot (Crooks) in a shuttle on the station, seals himself in the cockpit with kinetic barriers, and takes the ship for a full test flight. When Dillard orders a fighter patrol to disable the ship, Joker deftly evades their fire, completes all required test maneuvers, and returns the Normandy to dock safely and undamaged. Initially believed to be an enemy hijacking, the situation is resolved when Joker reveals himself. Though facing certain court-martial, Joker's exceptional piloting skills under pressure impress General Invectus so thoroughly that the turian official insists to the Alliance that Joker be made the Normandy's permanent pilot. After Invectus's intervention and Anderson's agreement that no one else can be trusted with the ship, Joker avoids military punishment and becomes the legendary pilot of humanity's most advanced stealth frigate, a position he holds throughout the trilogy.
