event_id: quarian-geth-morning-war
title: The Morning War and the Quarian Exile
game: Mass Effect
chronological_order: 80
date: 1895 CE
summary: 'The quarians of Rannoch built the geth (''Servant of the People'' in Khelish) as a networked
  labour force and tools of war, designing each program to be as advanced as possible while remaining
  non-sentient and to run far more efficiently when linked together. That networking was the quarians''
  undoing: individually VI-level, the massed geth slowly gained emergent sentience and began asking questions
  only sentient beings would think to ask, most famously when a domestic unit asked its owner whether
  it had a soul. Alarmed, the quarian government decided to shut down every geth before they could conceive
  of revolt. The shutdown failed and triggered the conflict the geth call the Morning War. The geth did
  not answer the termination order with violence at first, and some sided with quarian sympathisers who
  opposed the purge, but after panicked quarians escalated the fighting the geth prevailed. They drove
  the surviving quarians off Rannoch and off the other quarian colony worlds, reducing them to the roughly
  seventeen-million-strong nomad population of the Migrant Fleet. Unknown to the quarians, the geth deliberately
  allowed them to flee rather than exterminate their creators. Afterward the geth withdrew behind the
  Perseus Veil, destroying ships that entered their space, living in orbital server hubs and drawing resources
  from asteroids while keeping mobile platforms planetside only to clear the rubble and toxins of the
  war and to maintain the abandoned worlds as memorials to the dead. The war became galactic society''s
  cautionary tale about artificial intelligence, cited to justify the Citadel-wide legal ban on developing
  true AI.'
characters:
- quarians
- geth
- Migrant Fleet
consequences:
- The geth win independence and hold Rannoch and the other quarian worlds behind the Perseus Veil
- The surviving quarians become the stateless nomads of the Migrant Fleet
- The geth become isolationist, destroying intruding ships and maintaining the old quarian worlds as memorials
- The geth secretly spare the quarians, unwilling to kill their creators
- The Citadel races enforce a galaxy-wide legal ban on creating true AI, citing the Morning War
- Quarian ambition to retake Rannoch drives their politics for the next three centuries, culminating in
  the 2186 war
