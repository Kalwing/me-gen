event_id: discovery-of-the-prothean-ruins-on-mars
title: Discovery of the Prothean Ruins on Mars
game: Mass Effect
chronological_order: 120
date: "2148 CE"
summary: |
  Humanity explored Mars by robotic probe for nearly a century before the first
  crewed research stations were established there in the 2080s. The first permanent
  settlement, Lowell City, was founded in 2103 by the European Space Agency in Eos
  Chasma, and within a decade the United States and China had planted their own
  colonies. For years, satellites near Promethei Planum reported unexplained
  magnetic field shifts that earned the region a "Bermuda Triangle" reputation. In
  2147 element zero was detected on Mars for the first time, and in 2148 a
  prospecting team led by Mateus Silva, working near the Deseado Crater, unearthed
  a buried Prothean ruin that proved to be the source of the anomalies.

  The structure contained a malfunctioning mass effect core, several derelict
  starships, and stores of refined element zero. A global effort to translate its
  data archives identified the site as a Prothean observation and biosciences
  station established roughly 50,000 years earlier to study Cro-Magnon humans on
  Earth; the observers' ultimate motives and conclusions were never recovered. The
  fragmentary data cache was transformative: it advanced human science by an
  estimated two hundred years, revealing mass effect physics and pointing the way
  to element-zero-based faster-than-light drives and mass effect field technology.
  It also disclosed that Charon, the largest "moon" of Pluto, was a dormant mass
  relay sheathed in ice, prompting the Pluto excavation that reactivated the relay
  in 2149. The scale of the find drove Earth's major powers to pool their research
  and militaries, leading directly to the founding of the Systems Alliance in 2149.
  Not all of the recovered element zero was secured: some fell to criminal triads
  operating on Mars, who refined it into the narcotic red sand, which may have
  taken its name from the planet. Mars's southern pole, centered on the ruins, was
  later made a restricted historical preserve as the search for further Prothean
  artifacts continued.
characters:
  - Mateus Silva
  - Systems Alliance
  - The Protheans
consequences:
  - A buried Prothean observation and biosciences station is discovered beneath Promethei Planum near the Deseado Crater
  - Recovered Prothean data advances human science by roughly two hundred years
  - Humanity gains the basis for mass effect physics, FTL drives, and mass effect field technology
  - The data cache reveals that Charon is a dormant mass relay, leading to its 2149 reactivation
  - Earth's major nations pool resources, leading to the founding of the Systems Alliance in 2149
  - Stolen refined element zero is used by Martian triads to manufacture the drug red sand
  - Mars's southern pole is designated a restricted Prothean historical preserve
