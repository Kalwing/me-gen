event_id: tali-recruitment-haestrom
title: "Dossier: Tali - Tali'Zorah Recruitment"
game: Mass Effect 2
chronological_order: 1050
date: "2185 CE"
summary: |
  Tali'Zorah vas Neema, a young quarian woman who was one of Commander Shepard's most loyal companions during the fight against Saren, has earned her adult name through service and has been integrated into the Migrant Fleet as a full citizen. The Admiralty Board of the quarian fleet assigns her to a classified research mission to investigate anomalous activity in the star of Haestrom, a quarian colony world long abandoned to the geth after their extinction event. The primary objective is to study the planet's rapidly dying sun to understand its unusual behavior.

  Tali's strike team, including experienced marine commander Kal'Reegar, is deployed to Haestrom to conduct on-site observations. However, the team encounters unexpectedly fierce geth resistance, including multiple troop types (Troopers, Rocket Troopers, Hunters, Destroyers, Recon Drones, Primes, and even a towering Geth Colossus) and extreme solar radiation that strips kinetic and biotic shields, forcing Shepard's squad to navigate between safe shaded areas. When Shepard arrives to investigate Tali's team, they find all of the quarian marines slain except for Kal'Reegar, the sole survivor.

  Shepard must navigate the research facility while contending with Geth forces and the lethal radiation. The mission culminates at an observatory where Tali has positioned herself with final defensive measures. To advance, Shepard must retrieve two demolition charges from nearby structures to destroy a pillar blocking the path forward. In the final confrontation, the Geth Colossus—equipped with a powerful self-repair ability—presents a formidable obstacle. Shepard has the choice to use a Paragon interrupt to convince Kal'Reegar to stand down from providing covering fire, or to permit him to continue firing at the risk of his own death. Shepard must close to melee range to permanently disable the Colossus' regeneration protocol, destroy the construct, and eliminate waves of geth reinforcements.

  After the battle, Tali is successfully recruited and evacuated to the Normandy SR-2. If Kal'Reegar survives, he uploads the mission data to the Admiralty Board; if he does not survive, Tali uploads it herself, tormented by the loss of her entire team. Tali integrates into the Normandy's main engineering section alongside Gabriella Daniels and Kenneth Donnelly. Her father, Admiral Rael'Zorah, sends a message confirming her approved transfer and warning that negligence leading to her death will bring severe consequences. The mission's non-completion would prevent Tali from being recruited and would guarantee squad deaths during the suicide mission due to inability to upgrade the Normandy's shields.
characters:
  - Tali'Zorah vas Neema
  - Commander Shepard
  - Kal'Reegar (marine commander)
  - Admiral Rael'Zorah (Tali's father)
  - Geth forces (multiple types)
  - Gabriella Daniels
  - Kenneth Donnelly
consequences:
  - Tali'Zorah is recruited into Shepard's team
  - All quarian marines except Kal'Reegar are killed
  - Kal'Reegar either survives or is killed depending on Shepard's choices
  - Tali is integrated into the Normandy's engineering crew
  - Critical data from Haestrom is delivered to the quarian Admiralty Board
  - Tali becomes available as a squadmate for the suicide mission
  - The Normandy's shields can be upgraded (preventing guaranteed squad death)
  - Admiral Rael'Zorah approves Tali's transfer but expresses grave warnings
  - Tali's loyalty toward Shepard is established
