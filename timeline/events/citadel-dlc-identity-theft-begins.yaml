event_id: citadel-dlc-identity-theft-begins
title: "Citadel DLC: Shore Leave and Identity Theft - A New Threat Emerges"
game: Mass Effect 3
chronological_order: 1440
date: "2186 CE"
summary: |
  Following the Alliance's successful defense of the Citadel against Cerberus during Priority: The Citadel II, the Normandy SR-2 was ordered into dry dock for retrofits. Admiral Hackett granted the exhausted crew shore leave, with a personal note to Shepard mentioning that Admiral Anderson maintained an apartment on the Wards. Upon arrival at the Citadel, Shepard claimed Anderson's personal apartment on the Presidium, marking an unexpected inheritance of the Admiral's private sanctuary.

  Shepard received an invitation from Joker to meet for dinner at the Ryuusei Sushi Restaurant in the Wards. Upon arrival, both Shepard and Joker were confused about who had sent the invitation—Joker believed Shepard had initiated the meeting, while Shepard thought Joker had requested it, creating a moment of genuine confusion between the two friends.

  The dinner was interrupted when armed mercenaries from the CAT6 organization burst into the restaurant and opened fire. In the chaos, an Alliance soldier named Maya Brooks warned Shepard of a critical threat: someone had hacked Shepard's personal accounts and communications, stolen the Commander's identity, and was actively trying to assassinate the Spectre. The discovery that Shepard was being hunted by an imposter set in motion a series of events that would consume the rest of shore leave.

  Shepard pursued Brooks, who was shot during the escape. Though injured, Brooks managed to reach a secure terminal and contacted C-Sec before losing consciousness. Shepard descended through the lower Wards, moving through maintenance tunnels, frozen-fish storage, and crowded markets while evading CAT6 mercenaries and drones. A crew member—either Liara T'Soni or Shepard's love interest, later joined by a second squad member—made contact and provided support through the pursuit.

  At the Cision Motors skycar lot, what appeared to be a C-Sec shuttle arrived as a rescue, but it was another ambush. However, Urdnot Wrex crashed through a window and engaged the attackers, scattering the mercenaries and extracting Shepard and the crew. If Wrex was dead or the genophage cure had been sabotaged, James Vega arrived instead with a Cobra Missile Launcher, and EDI provided tactical support as a squadmate.

  Joker extracted the team via shuttle, narrowly escaping the ambush and beginning the hunt to identify and stop whoever was impersonating Shepard. Liara traced the M-11 Suppressor pistols used by the CAT6 hitmen to the arms dealer Elijah Khan, owner of the Silver Coast Casino, who was hosting a charity gala for war refugees. Shepard infiltrated the black-tie event with Brooks in a no-combat operation—Brooks crawled through ventilation while Shepard, barred from bringing EDI as an AI, mingled with guests and distracted patrolling guards and cameras to reach Khan's panic room. They found Khan already dead in his safe room, executed by Maya Brooks to cut a loose end, foreshadowing her true allegiance. Brooks accessed his terminal and found a deletion order; a not-yet-wiped comm brought up a face distorted beyond recognition that vowed to take everything Shepard was and owned before cutting the untraceable call. Shepard ordered the drives pulled for EDI to analyze. The identity theft plot became a personal vendetta—someone close to Shepard had turned against them, or a Cerberus clone had been activated.

