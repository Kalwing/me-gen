  - Admiral David Anderson (inheritance)
  - Admiral Hackett (indirect)
  - Elijah Khan
  - CAT6 mercenaries
  - C-Sec officers

consequences:
  - Shepard is actively hunted on the Citadel by someone using the Commander's identity
  - Maya Brooks is revealed as Alliance intelligence operative and becomes key ally
  - Shore leave becomes a combat mission to survive and investigate
  - Shepard's identity has been compromised—all Citadel accounts and systems hacked
  - Anderson's apartment serves as a safe haven and base of operations
  - The crew is fractured across the Citadel during the hunt
  - Brooks' warning initiates the main "Identity Theft" storyline of the Citadel DLC
  - Wrex/Vega's rescue establishes importance of loyalty and squad dynamics
  - Arms dealer Elijah Khan is murdered by Maya Brooks before he can be questioned, hinting at her betrayal
  - The identity thief's capabilities suggest advanced technology (Cerberus or clone involvement)
  - Khan's data drives are recovered for EDI to analyze, leading to Citadel: Identity Theft II
  - Sets up the revelation that Shepard has a Cerberus-made clone antagonist

