event_id: avernus-adjutant-outbreak
title: "Avernus Station: Adjutant Outbreak and Invasion Comic Events"
game: Mass Effect 3
chronological_order: 1760
date: "2186 CE"
summary: |
  After Cerberus establishes a research base called Avernus Station beyond the Omega 4 Relay to study captured Reaper technology, a catastrophic outbreak occurs. Reaper creatures known as Adjutants—husk-like beings infected from live subjects—break free from their containment facilities and run rampant through the station, overwhelming the personnel. The infected Adjutants commandeer transport ships docked at Avernus and breach the Omega 4 Relay, launching an invasion of Omega, one of the largest independent stations in known space.

  Desperate to defend Omega, the Illusive Man dispatches General Oleg Petrovsky and Colonel Raymond Ashe aboard the Cerberus warship Elbrus to assist Aria T'Loak in containing the threat. The Elbrus, a heavily armed cruiser carrying weapons forbidden by the Citadel Conventions, arrives ahead of the main Cerberus fleet, destroys the unarmed transports the Adjutants have hijacked, and leads the defense against a second wave of armed Adjutant ships. Upon discovering that the Adjutants are immune to vacuum—contrary to initial assumptions—Petrovsky orders the Elbrus through the Omega 4 Relay to strike at the source: Avernus Station itself. The Elbrus clears Adjutants from the station exterior and serves as a base of operations while Petrovsky and Aria eliminate the remaining Adjutants and re-secure the facility.

  However, the Adjutant outbreak serves as cover for the Illusive Man's true objective: conquering Omega. With Aria incapacitated from overusing her biotics during the Avernus defense and fitted with biotic dampeners by Petrovsky, the Illusive Man activates his real plan. Colonel Ashe, imprisoned by Aria for insubordination, kills his guards and coordinates Cerberus reinforcements to seize control of Omega. In Omega Control, Ashe orchestrates a massacre, slaughtering all opposition to ensure a swift Cerberus takeover.

  Aria breaks free from the Elbrus and hijacks the ship during the return trip, then slips away when it docks before Cerberus troops can kill her, forcing Petrovsky to return to Omega. She unites the station's warring gangs against the Cerberus occupation, launching a guerrilla war against superior Cerberus forces. The conflict escalates until Petrovsky, recognizing he cannot dislodge Aria from Omega's depths, devises a final gambit: he evacuates most Cerberus forces and positions his remaining fleet to destroy Omega level by level. Faced with the choice between endless resistance and the destruction of her station, Aria concedes. She accepts exile, vowing to return, while Petrovsky secures Omega for Cerberus. Colonel Ashe, believing himself indispensable, is later infected by an Adjutant in the Afterlife Club and executed by Petrovsky when he transforms.
