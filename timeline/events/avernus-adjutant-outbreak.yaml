  - Colonel Raymond Ashe is killed by General Petrovsky after infection
  - Cerberus gains exclusive access to Omega 4 Relay and galactic core Reaper technology
  - Omega's gangs initially war for power in Aria's absence before uniting under her direction
  - Anto Korragan is killed by Cerberus during the occupation attempt
  - Cerberus establishes a major operational stronghold at Omega
  - Petrovsky predicts Aria will eventually return to reclaim the station
  - The Illusive Man achieves a major strategic victory against the Reapers
