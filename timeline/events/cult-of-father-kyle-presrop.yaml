event_id: cult-of-father-kyle-presrop
title: "UNC: Major Kyle and the Biotic Commune on Presrop"
game: Mass Effect
chronological_order: 540
date: "2183 CE"
summary: |
  Major Kyle was a decorated Alliance officer who commanded troops at the brutal Siege
  of Torfan in 2178. Unable to cope with the massive casualties among the men under his
  command, he was honourably discharged after a psychiatric evaluation found him unfit
  for duty. Years later he resurfaced as the leader of a biotic commune on Presrop, a
  frigid moon of Klendagon in the Century system of the Hawking Eta cluster. The
  commune functioned as a cult whose members called him "Father Kyle." Though Kyle was
  not a biotic himself, Admiral Hackett believed the alienated L2 and L3 biotics saw
  him as a protector, and that by "protecting" them Kyle assuaged his guilt over
  Torfan. The commune broadcast extranet transmissions inviting biotics to join, one of
  which was intercepted by C-Sec, and Kyle grew increasingly militant, preaching that
  the Alliance was to blame for all biotics' problems.

  When the Alliance sent two negotiators to convince Kyle to accept treatment for
  post-traumatic stress disorder, the cultists judged them a threat and killed them.
  Hackett then dispatched Commander Shepard to resolve the situation. Shepard could
  negotiate an audience or fight into the compound through rooms of lightly armed but
  dangerous Biotic Cultists; a Ruthless Shepard, remembered as "the Butcher of
  Torfan," was received willingly. Face to face in the underground Sanctuary, Shepard
  could open fire or talk Kyle into surrendering peacefully, in which case Kyle was
  taken into custody for psychiatric treatment and his cult disbanded.
characters:
  - Major Kyle
  - Commander Shepard
  - Admiral Hackett
consequences:
  - Two Alliance negotiators are killed by Kyle's cultists before Shepard's arrival
  - "Per Shepard's choice: Kyle is killed, or he surrenders and is taken for treatment and his commune is disbanded"
  - If Kyle surrenders, the alienated L2 biotics of the commune lose their figurehead
  - "If Martin Burns was not saved in 2183, a later Citadel news report states Kyle is again trying to form an all-biotic community, as L2 biotics never received reparations"
