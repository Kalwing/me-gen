event_id: randall-ezno-barn-escape
title: "Randall Ezno's Rebellion and Escape from the Barn"
game: Mass Effect
chronological_order: 1350
date: "2186 CE"
summary: |
  On a remote Cerberus research space station called the Barn near the desert planet LV426, the enigmatic Director oversees horrific experiments on humans, asari, krogan, and turians involving Reaper technology to enhance weapons and biotic capabilities. Cerberus operative Randall Ezno, an infiltrator and Systems Alliance agent, is deployed to capture a high-value turian target as part of field testing new biotic implants installed in his body. His handler and technician, Inali Renata, monitors the mission from the Barn.

  Upon Randall's successful return with the captured turian, the station comes under attack by turian soldiers, presumably sent by the Turian Hierarchy. Simultaneously, Randall discovers a horrifying truth: the biotic implants he received were designed to indoctrinate him, part of the Director's larger agenda. Because Randall's body adapted to the indoctrination technology faster than anticipated, rendering it ineffective, the Director sees him as a liability. To maintain control, the Director forcibly conscripts Inali—Randall's close friend and handler—as a test subject for more powerful indoctrination technology, subjecting her to horrific experimentation.

  Outraged by Inali's torture, Randall goes rogue against Cerberus. With the help of an unnamed volus ally working with the Systems Alliance, he unlocks the Barn's containment systems via the station AI (UDI) and releases the countless test subjects—asari, krogan, and others—held in the facility. The escaped subjects violently rebel against their Cerberus captors, creating chaos throughout the station. Geth forces are also attracted to the facility when Randall activates a communications relay. In the resulting chaos, Randall battles through Cerberus security forces, advanced mechs (including Ogre and Orcus Mechs), the X1 Wing's experimental krogan super-soldier, and his own facility's defenses to reach the Hangar Bay and communications tower.

  Through six major checkpoints—including the Hangar Bay, Medical Bay, Security Checkpoint, X1 Wing, Colosseum, Comm Relay, Access Corridor, and Incarceration areas—Randall fights against Grad Turrets, Cerberus Troopers, Assault Captains, Assault Troopers, Centurions, Engineers, Riot Troopers, Snipers, and Geth forces. After signaling the Alliance via communications relay, Randall commandeers a shuttle and escapes toward the rendezvous point at LV426. The Director, having heavily augmented Inali beyond recognition and taken control of her through indoctrination, deploys her as a final weapon against Randall at the rendezvous. Randall defeats her and must choose whether to spare or kill her. He then vows to hunt down and kill the Director for his actions. The Barn is severely damaged in the rebellion, its operations crippled. Randall goes on to contact the Alliance and provide them with valuable intelligence on other Cerberus operations, turning against the organization entirely.
characters:
  - Randall Ezno
  - Inali Renata
  - The Director
  - Test subjects (asari, krogan, turians, humans)
  - Cerberus security forces and personnel
  - Geth forces
  - Turian soldiers (Turian Hierarchy)
  - X1 (experimental krogan super-soldier)
  - Unnamed Volus ally (Systems Alliance)
consequences:
  - Randall Ezno discovers Cerberus's indoctrination implant betrayal
  - Inali Renata captured and subjected to horrific experimentation
  - Randall Ezno goes rogue against Cerberus
  - Multiple test subjects are liberated from the Barn's containment systems
  - Escaped subjects rebel violently against Cerberus guards
  - Cerberus security forces suffer heavy casualties
  - X1 Wing experimental facility is breached and destroyed
  - Geth forces are attracted to and attack the station
  - The Barn's operations are severely crippled
  - Inali Renata is heavily augmented and indoctrinated by the Director
  - Randall successfully escapes to LV426 rendezvous point
  - Randall establishes contact with the Systems Alliance
  - Randall vows revenge against the Director and Cerberus
  - Randall provides the Alliance with critical intelligence on other Cerberus operations
  - Cerberus loses a valuable infiltrator operative and his intelligence value
  - >
    The turian Randall captured on the Ice Giant, held for experimentation on
    the Barn, is freed by the station-wide release of test subjects and fights
    his way through the chaos, only to be cornered and killed by the Director in
    a coverless room (the 'Incarceration' bonus mission).
  - >
    Completing the turian's escape run to veteran rank adds 40 points to the
    Cerberus Escapees war asset in Mass Effect 3.
