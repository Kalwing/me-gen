event_id: feros-the-thorian
title: "Feros: The Thorian and Zhu's Hope"
game: Mass Effect
chronological_order: 580
date: "2183 CE"
summary: |
  Investigating Saren Arterius, Commander Shepard travels to Feros, an ExoGeni
  Corporation pilot colony built among Prothean ruins in the Attican Beta cluster. The
  colonists of the port settlement Zhu's Hope, led by Fai Dan, are under siege by geth
  who landed days earlier searching the ruins. Shepard clears the geth from Zhu's Hope
  and the surrounding Prothean skyway, then crosses to ExoGeni headquarters to learn
  what the geth want.

  At a skyway weigh station Shepard finds a group of ExoGeni survivors hiding under
  Ethan Jeong, the last surviving company representative. Jeong has deliberately kept
  the survivors from returning to the colony and discouraged any investigation of Zhu's
  Hope, because ExoGeni had secretly been using the colonists as an experimental
  control group: beneath the settlement lives the Thorian, an ancient sentient plant
  that had been releasing mind-controlling spores over Zhu's Hope. Juliana Baynham's
  daughter Lizbeth is trapped inside the ExoGeni tower. Shepard recovers data revealing
  ExoGeni's role, learns the Thorian gave Saren a "cipher" needed to understand the
  Prothean beacon vision, and shuts down the energy field feeding the creature.

  Returning to Zhu's Hope, Shepard finds the colonists turned into Thorian thralls and
  must fight through them, ideally using non-lethal knockout gas, to reach the Thorian's
  lair. The creature disgorges an asari clone of Shiala, one of Matriarch Benezia's
  commandos, whom it had drained; Shepard destroys the Thorian by severing the
  ceiling growths anchoring it. Freed, Shiala transfers the Prothean cipher to Shepard
  by melding minds, greatly clarifying the beacon vision. With communications restored,
  Jeong is found holding Juliana Baynham at gunpoint, intending to let ExoGeni sterilize
  the colony; Shepard can talk him down or is forced to shoot him. If the colony
  survives and Jeong lives, he takes over its administration and honors ExoGeni's deal
  with the colonists.
characters:
  - Commander Shepard
  - Ethan Jeong
