event_id: turian-development-of-the-thanix-cannon
title: Turians Reverse-Engineer Sovereign's Gun into the Thanix Cannon
game: Mass Effect 2
chronological_order: 880
date: "2184 CE"
summary: |
  In the immediate aftermath of the Battle of the Citadel in 2183, human and turian
  volunteers spent roughly three months clearing wrecked debris from the station's
  orbit. Among the turian work crews were technology-recovery specialists from the
  Office of Technological Reconnaissance, posing as ordinary volunteers. Their real
  task was to salvage the main gun of the destroyed Reaper Sovereign, along with as
  much of the weapon's element zero core as they could carry off before the keepers
  and rescue workers cleared the site.

  Analysis of the salvage overturned the popular belief that Sovereign's main gun
  had been a directed-energy weapon. It was instead a magnetohydrodynamic system: a
  massive eezo-powered electromagnetic field suspended a molten iron-uranium-tungsten
  alloy and accelerated it to a significant fraction of light speed, where it
  solidified into a projectile as it left the muzzle. The resulting slug struck with
  enough kinetic force and heat to punch through any known shield or armor.

  Only eleven months after the battle, turian engineers unveiled a scaled-down,
  miniaturized copy of the Reaper weapon, which they named the Thanix. It could fire
  reliably every few seconds and gave a single fighter or frigate firepower rivaling
  a cruiser, while being small enough to mount on most warships. The Council, working
  only from the fragments that remained, was not persuaded that Sovereign had been
  anything more than a geth construct, so the weapon's true origin stayed obscure.
  Cerberus separately recovered pieces of Sovereign to feed anti-Reaper algorithms
  into the AI of the new Normandy SR-2. By 2185 the Normandy SR-2 could be fitted
  with a Thanix cannon - an upgrade credited to Garrus Vakarian - powerful enough to
  cripple a Collector Cruiser in a single sustained burst during the Suicide Mission.
  By the Reaper invasion of 2186 the Thanix and its variants were in widespread
  Alliance service, with an up-scaled model built for dreadnoughts and a ground-based
  Thanix missile used in the final battle for Earth.
characters:
  - Garrus Vakarian
  - The Illusive Man
consequences:
  - Turian specialists secretly salvage Sovereign's main gun and element zero core during the Citadel cleanup
  - Analysis reveals Sovereign's weapon was a magnetohydrodynamic mass accelerator, not a beam weapon
  - The turians field the Thanix cannon roughly eleven months after the Battle of the Citadel
  - Frigates and fighters gain cruiser-grade firepower; the Normandy SR-2 can mount a Thanix by 2185
  - The Thanix upgrade lets the Normandy destroy the Collector Cruiser during the Suicide Mission
  - Thanix variants enter widespread Alliance use by 2186, including dreadnought-scale guns and ground-based Thanix missiles
  - The Council remains unconvinced Sovereign was more than a geth ship, keeping the Reaper threat officially unrecognized
