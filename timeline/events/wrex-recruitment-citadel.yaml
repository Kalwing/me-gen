event_id: wrex-recruitment-citadel
title: "Citadel: Urdnot Wrex Recruitment"
game: Mass Effect
chronological_order: 430
date: "2183 CE"
summary: |
  Following the Citadel Council's appointment of Commander Shepard as the first human Spectre and the confirmation of Saren Arterius's treason, Shepard sought allies to pursue the rogue Spectre. Upon inquiry at the Citadel, Shepard was directed by David Anderson to Barla Von, a Shadow Broker agent operating in the Presidium financial district. Barla Von revealed that Saren had betrayed the Shadow Broker and turned a former Shadow Broker operative named Fist to his side. In retaliation, the Shadow Broker hired the renowned krogan bounty hunter Urdnot Wrex to eliminate Fist.

  Shepard encountered Wrex at C-Sec Academy, where the krogan was being detained after threatening Fist. After a tense standoff with C-Sec officers, Wrex recognized that his goals—dealing with Fist and opposing those working with Saren—aligned with Shepard's mission. Wrex joined Shepard's squad, becoming one of the Commander's most valued and loyal companions. His recruitment marked a significant moment, as Wrex represented the krogan perspective and brought unique tactical advantages to Shepard's team. Alternatively, if Shepard had already dealt with Fist at Chora's Den, Wrex was found at the docks and offered his services out of professional pride and a desire to be "where the action is." In rare cases, Shepard could refuse Wrex's offer, leaving him at Chora's Den for later recruitment, though this choice was highly consequential for the genophage storyline in later games.

  Wrex's presence on Shepard's team and his survival throughout the trilogy had profound consequences for krogan relations with other galactic powers, particularly regarding the genophage cure negotiations in Mass Effect 3. His loyalty, combat prowess, and perspective on krogan honor and potential made him irreplaceable to Shepard's mission.

characters:
  - Commander Shepard
  - Urdnot Wrex
  - Barla Von
  - David Anderson
  - C-Sec Officers
  - Fist

consequences:
  - Urdnot Wrex joins Shepard's squad as a loyal and capable combatant
  - Wrex's subsequent survival on Virmire is crucial to krogan leadership in ME2 and ME3
  - If Wrex survives to ME2, he becomes the leader of Clan Urdnot and represents krogan interests in genophage negotiations
  - If Wrex dies on Virmire or is refused at recruitment, his brother Wreav leads Clan Urdnot with different goals and morality
  - Wrex's presence on the team affects dialogue and character interactions throughout the trilogy
  - If Wrex survives ME3, he can be saved to participate in the final battle on Earth
  - The Shadow Broker's contract against Fist is fulfilled, maintaining relations between Shepard and the Shadow Broker network

