event_id: citadel-ka-hairal-balak-batarian-codes
title: "Citadel: Ka'hairal Balak and the Batarian Codes"
game: Mass Effect 3
chronological_order: 1860
date: "2186 CE"
summary: |
  During the Reaper War in 2186, after the Cerberus coup attempt on the Citadel,
  the batarian terrorist leader Ka'hairal Balak resurfaced on the station. Balak
  had first come to prominence in 2183 leading the raid on Asteroid X57 near Terra
  Nova, where he rigged the mining asteroid's fusion torches to crash it into the
  colony before being stopped by Commander Shepard; his subsequent fate - executed
  after interrogation, left for dead, handed to the Alliance, or released - depended
  on Shepard's choices there. If Balak had been released or left alive, he continued
  as an officer of the Batarian External Forces.

  C-Sec E-Crimes officer Jordan Noles, working outside the Presidium Commons C-Sec
  outpost, asked Shepard to use Spectre authority to trace old batarian diplomatic
  access codes she suspected were being misused. The trail led through Huerta
  Memorial Hospital and Normandy Dock Bay D24 to the Docks holding area. If the
  codes had been used for sabotage, Shepard found Balak responsible - cutting life
  support at Huerta Memorial and engineering an accident that killed 117 Alliance
  soldiers - and Balak was either killed with his own pistol or allowed to walk
  free. If the codes had instead been used to secure provisions, Balak was again the
  culprit only if he had been defeated and left for dead at X57; if he had been
  arrested or killed then, Noles traced and arrested an unnamed batarian instead.

  Trapped on the Citadel, Balak recounted how batarian research on the Leviathan of
  Dis - an inactive Reaper - had indoctrinated hundreds of scientists who then
  sabotaged Khar'shan's defences, and he blamed Shepard for the destruction of the
  Bahak system and the collapse of the Batarian Hegemony. Shepard could kill him or
  appeal to his patriotism; if enlisted, Balak hacked Council transmissions to aid
  the batarian fleet against the Reapers, markedly improving the batarian war
  effort, whereas his death or arrest threw batarian external operations into chaos.
  Regardless, Noles was grateful for Shepard's help.
characters:
  - Ka'hairal Balak
  - Jordan Noles
  - Commander Shepard
  - Kate Bowman
  - Charn
consequences:
  - Jordan Noles enlists Shepard's Spectre authority to trace misused batarian diplomatic codes
  - Ka'hairal Balak is identified as the culprit (or, if he died at X57, an unnamed batarian is arrested instead)
  - Per Balak's X57 fate, he has either sabotaged Citadel infrastructure (killing 117 Alliance soldiers, cutting Huerta life support) or merely stolen provisions
  - Shepard can kill Balak with his own pistol or recruit him for the war effort
  - If recruited, Balak hacks Council transmissions to aid the batarian fleet and boosts the batarian war effort
  - If killed or arrested, batarian external operations are thrown into chaos
  - Balak links the fall of the Batarian Hegemony to indoctrination from the Leviathan of Dis and the destruction of Bahak
