event_id: liberation-of-omega-afterlife-assault
title: Liberation of Omega - Afterlife Assault
game: Mass Effect 3
chronological_order: 1890
date: "2186 CE"
summary: |
  When Aria T'Loak returns to Omega with Commander Shepard to liberate the station from Cerberus occupation in 2186, the climactic battle takes place at the Afterlife Club, which has been converted into General Oleg Petrovsky's command center. During the final assault, Nyreen Kandros, the turian leader of the Talons resistance faction, sacrifices herself to destroy a group of rogue Adjutants that threaten to overwhelm the advancing forces. Her biotic detonation incinerates her along with the creatures she targets. Enraged by Nyreen's death, Aria charges ahead into the Afterlife Club. Petrovsky springs a trap, immobilizing Aria in a stasis field powered by generators positioned at the corners of the establishment. Commander Shepard breaks Aria free from the stasis field and defeats all Cerberus forces and Adjutants within the club. Petrovsky, facing defeat, surrenders his forces and orders his troops to stand down, though Aria and Shepard determine his ultimate fate. With the battle concluded, Aria announces to Omega's citizens that she has regained control of the station and vows to rebuild it, restoring her rule after Cerberus's occupation.
characters:
  - Aria T'Loak
  - Commander Shepard
  - Nyreen Kandros
  - General Oleg Petrovsky
  - Anto Bek'tall
consequences:
  - Nyreen Kandros is killed during the Adjutant assault
  - Aria T'Loak is freed from Cerberus's stasis field trap by Shepard
  - All Cerberus forces within Afterlife are defeated
  - General Oleg Petrovsky surrenders (can be spared or executed at Shepard's discretion)
  - Aria regains control of Omega and vows to rebuild the station
  - Omega becomes a galactic asset for the Reapers' conflict
