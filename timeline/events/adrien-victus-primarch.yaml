event_id: adrien-victus-primarch
title: Adrien Victus Becomes Primarch and Tarquin's Sacrifice
game: Mass Effect 3
chronological_order: 1390
date: 2186 CE
summary: |
  During the Reaper invasion of 2186, Turian Primarch Fedorian was killed when his shuttle was shot down while defending Menae, a moon of Palaven. Under turian succession protocols, General Adrien Victus, who was leading the defense of Menae against overwhelming Reaper forces, became the new Primarch of Palaven, though he remained unaware of his promotion while engaged in combat. General Corinthus directed Commander Shepard to retrieve Victus and convince him to leave the front lines to represent the turian military at a critical war summit with the human Systems Alliance, the Salarian Third Fleet, and the Krogan clans. Victus was initially reluctant, believing he should die fighting alongside his men rather than abandon his homeworld, but Shepard convinced him that diplomatic coordination was essential for galactic survival. As the new Primarch, Victus agreed to commit turian forces to support Earth's defense, but only after securing krogan military support to defend Palaven. Later, after krogan forces were being mobilized and the genophage cure was obtained, Victus revealed a secret mission: his son, Lieutenant Tarquin Victus, commanded a turian platoon on Tuchanka that had crashed on a classified assignment. He requested Shepard's assistance in rescuing the team. When Shepard reached Tuchanka and met Tarquin, the truth was revealed: the turian platoon was attempting to stop Cerberus from detonating a bomb in the Kelphic Valley, a heavily populated krogan region. The bomb was a relic of the Krogan Rebellions, planted by turians centuries earlier to suppress future krogan uprisings, and its existence had been kept secret from the krogan. Tarquin attempted to disarm the bomb manually but discovered the detonation mechanism was faulty. He climbed the bomb's exterior to reach and remove the final lock manually. Realizing that removing the lock would cause it to detonate, he chose to remove it anyway, sacrificing himself in the explosion to prevent the weapon from destroying the Kelphic Valley. Despite his sorrow, Adrien Victus expressed pride in his son's sacrifice and honored his memory, stating that Tarquin's sacrifice would be remembered in the histories of the 9th Platoon. The incident highlighted Victus' personal cost in the war effort and became a defining moment in turian-krogan relations as the secret bomb was revealed.
