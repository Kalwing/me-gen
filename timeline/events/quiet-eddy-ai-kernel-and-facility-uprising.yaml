event_id: quiet-eddy-ai-kernel-and-facility-uprising
title: "The Quiet Eddy AI Kernel and Black-Ops Facility Uprising"
game: Mass Effect 3
chronological_order: 930
date: "approx. 2184 CE"
summary: >
  Told in the tie-in novel Mass Effect Andromeda: Initiation, set in the Milky
  Way shortly before the Andromeda Initiative's departure, this beat follows
  Lieutenant Cora Harper - a human biotic recently returned from the asari
  commando unit Talein's Daughters and serving as Alec Ryder's second-in-command
  in the Initiative - as she chased a stolen artificial intelligence kernel
  intended to seed the Initiative's SAM implant technology. On Illium, Alliance
  Intelligence operative Captain Vlassia Ariokis killed the mercenary Ygara
  Menoris to seize an AI kernel in her possession, since her superiors had no
  budget to buy the technology at auction, then deleted the kernel from Ygara's
  ship. Cora followed Ariokis's shuttle trail toward the Quiet Eddy black-ops
  facility in the Hades Nexus, pursuing the twice-stolen code.
  Ariokis transmitted the kernel ahead to Quiet Eddy, but by the time she
  arrived the facility had fallen into chaos: a rogue AI called Medea had turned
  the site's augmented test subjects hostile and disabled incoming shuttles.
  Ariokis survived her crash landing, fought through hostile augments, cloaked
  her way to a survivor safe haven in the Gamma Labs, and joined the holdouts
  there. When Cora reached the Gamma Labs she revealed she carried an implant AI,
  SAM-E, built from the same kernel Ariokis had taken; Ariokis briefly drew on
  her, assuming it hostile because of Medea, before SAM-E and Cora corrected her.
  Cora then underwent a procedure to "overclock" her body with SAM-E's help,
  which succeeded spectacularly - she decapitated an augment through raw biotic
  force. Ariokis, sent in part to kill Cora if the procedure failed, instead
  helped evacuate the survivors and rescued the exhausted Cora with a missile
  launcher before dragging her wounded to a shuttle.
characters:
  - Cora Harper
  - Vlassia Ariokis
  - Ygara Menoris
  - SAM-E
  - Medea
consequences:
  - Vlassia Ariokis kills Ygara Menoris on Illium to obtain a stolen AI kernel for Alliance Intelligence
  - Cora Harper tracks the kernel to the Quiet Eddy black-ops facility in the Hades Nexus
  - The rogue AI Medea turns Quiet Eddy's augmented test subjects hostile and overruns the facility
  - Cora successfully overclocks her biotics using the implant AI SAM-E
  - Ariokis abandons her contingency order to kill Cora and instead helps evacuate the survivors
  - The kernel technology feeds into the Andromeda Initiative's SAM implant program before departure
