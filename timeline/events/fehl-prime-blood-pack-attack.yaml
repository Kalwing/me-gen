event_id: fehl-prime-blood-pack-attack
title: Fehl Prime Blood Pack Attack
game: Mass Effect 2
chronological_order: 860
date: "2183 CE"
summary: |
  In 2183, the human colony of Fehl Prime, a major pharmaceuticals producer for the Systems Alliance, comes under siege by Blood Pack mercenaries led by the krogan warlord Archuk. The colony is defended by local militia and civilians, but faces overwhelming mercenary firepower. When Archuk arrives with his forces—vorcha, varren, and heavily armed Blood Pack soldiers—he positions himself defiantly atop a promontory, mocking the colonists' defensive efforts. His second-in-command, Brood, plants explosives that destroy the colony's kinetic barriers, enabling a full assault on civilian positions.

  The Alliance responds by dispatching multiple Marine squads to aid the colonists. During the landing, Blood Pack forces shoot down all three landing shuttles; only Delta Squad's shuttle survives the crash, though with heavy casualties. Lieutenant James Vega, emerging as a natural leader, rallies the survivors of Delta Squad—Kamille, Nicky, Milque, Essex, and Mason—to counterattack. When Archuk challenges the Marines to open combat, Vega accepts a duel, using it as a distraction for his squad to flank the Blood Pack positions. The duel between Vega and Archuk is intense; the krogan's strength and combat experience initially overwhelm the human officer. However, with support from Nicky's combat drone and—critically—Milque's sniper fire, Archuk is killed before he can finish Vega. The remaining Blood Pack mercenaries are routed, and only Brood survives, taken prisoner by Vega.

  Following the battle, Admiral Steven Hackett orders Delta Squad to remain stationed on Fehl Prime to strengthen the colony's defenses. Over the next two years, the colony is rebuilt with a military-grade anti-ship cannon and reinforced kinetic barriers. The Fehl Prime victory becomes a significant morale boost for the Alliance and establishes James Vega as a skilled combat leader and defender of human colonies.
