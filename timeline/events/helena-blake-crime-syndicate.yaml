event_id: helena-blake-crime-syndicate
title: Helena Blake and the Citadel Crime Syndicate
game: Mass Effect
chronological_order: 510
date: "2183 CE"
summary: |
  Helena Blake was a well-spoken senior human member of a Citadel-based crime
  syndicate, listed by C-Sec as a person of interest. In 2183 she approached
  Commander Shepard near the Emporium in the Citadel Presidium with a business
  proposition. She openly admitted her criminal affiliation but claimed her two
  partners had gone too far, moving into the biotic drug red sand and the slave
  trade, and offered to pay Shepard to eliminate them. Shepard could agree,
  refuse (Blake supplied the target coordinates regardless), or threaten to
  arrest her, which she brushed off by citing her excellent legal
  representation.

  If Shepard hunted down and killed the two crime bosses, the Commander could
  then travel to Blake's hideout on Amaranthine in the Fortuna system to collect
  a reward. Blake thanked Shepard and promised the syndicate would afterward
  limit itself to gambling and smuggling illegal technology. The encounter was
  choice-conditional: Shepard could accept the payment and leave; attempt a
  second arrest, at which Blake declared she would rather die than go to prison,
  ordered her guards to "neutralize the Spectre," joined the firefight herself
  and was killed; or persuade her to walk away, whereupon she agreed to disband
  her organization permanently, conceding her operation was ruined beyond
  repair.

  Blake's later fate depended on whether she survived 2183. In Mass Effect 2,
  if she had been talked into retiring, Shepard could find her working as a
  social worker in the passageways of the Afterlife Club on Omega, using her
  underworld knowledge to help the station's people. If Shepard had simply let
  her go without securing a promise, she had instead folded her criminal empire
  into Aria T'Loak's organization and risen to the rank of underboss on Omega.
characters:
  - Helena Blake
  - Commander Shepard
  - Aria T'Loak
consequences:
  - Blake's two syndicate partners, dealing in red sand and slaves, are hunted down and killed if Shepard accepts the job
  - Blake's own fate is decided by Shepard - killed resisting a second arrest attempt, or persuaded to disband her syndicate, or simply paid and released
  - If she disbands the syndicate she resurfaces on Omega as a social worker in Mass Effect 2
  - If she is merely released she merges her operation into Aria T'Loak's and becomes an Omega underboss
