event_id: citadel-homecoming
title: "Citadel: Homecoming — Recovering Nirali Bhatia's Body"
game: Mass Effect
chronological_order: 480
date: "2183 CE"
summary: |
  After Commander Shepard rescued Tali'Zorah on the Citadel, Samesh Bhatia
  approached the Commander in front of the Embassies reception desk in the
  Presidium. Samesh was the husband of Serviceman Nirali Bhatia, an Alliance
  marine of the 212 who had served and died on Eden Prime during Saren's geth
  attack. Nirali's body had not been returned to him for cremation and burial,
  and the Alliance had given him no explanation. He asked Shepard, as an Alliance
  officer, to intervene, directing the Commander to Clerk Bosker in the Embassy
  Lounge.

  Bosker revealed that Nirali's corpse registered wounds from unique geth
  weaponry and that the Alliance intended to keep and study it to develop better
  defensive technology against the geth, work that might take years to bear
  results. Shepard was left to decide the outcome, which hinged entirely on
  Samesh's reaction. The Commander could persuade Bosker (by charm or
  intimidation) to release the body promptly, or instead convince Samesh to
  allow the tests so that Nirali's death would serve a purpose; in the latter
  case Samesh was distraught, demanding to know why a loyal soldier could not be
  treated with respect. If no persuasion option was used on Samesh after siding
  with the Alliance, he left angrily and Shepard received no reward. If Ashley
  Williams was in the squad she spoke with Samesh as he departed, telling him
  either that Nirali died to keep him safe and would want her sacrifice honored,
  or that Nirali loved him and listened to recordings of his voice every night;
  he was grateful for her support. Bringing Kaidan instead, he noted that Ashley
  had served in the 212 and might wish to speak with Samesh. Both Samesh and
  Bosker left the Citadel once the matter was resolved.
characters:
  - Samesh Bhatia
  - Nirali Bhatia
  - Commander Shepard
  - Ashley Williams
  - Kaidan Alenko
  - Bosker
  - Donnel Udina
consequences:
  - Per the player's choice, Nirali Bhatia's body is either released to Samesh for cremation and burial or retained by the Alliance for study of geth weapon wounds
  - If the body is kept, Alliance recruitment on the Terminus fringe suffers as the public doubts the Alliance can match geth technology
  - If the body was returned, in 2185 Samesh sends Shepard a message via Udina thanking the Commander and reporting he has opened the restaurant Nirali always wanted on Earth, where her picture hangs and Alliance soldiers eat for free
  - Samesh Bhatia and Clerk Bosker leave the Citadel after the assignment concludes
