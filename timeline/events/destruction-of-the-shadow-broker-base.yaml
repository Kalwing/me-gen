event_id: destruction-of-the-shadow-broker-base
title: Liara Destroys the Shadow Broker Base to Foil Cerberus
game: Mass Effect 3
chronological_order: 1420
date: "2186 CE"
summary: |
  After killing the yahg Shadow Broker on Hagalaz in 2185 and taking over his
  information network, Liara T'Soni ran the organization from the Broker's aging
  storm-riding ship, with the drell Feron and the renamed Info Drone "Glyph" assisting
  her. Only a handful of people, such as Admiral Hackett, knew the leadership had
  changed; on the black market, agents merely sensed the Shadow Broker had "gone soft."

  Sometime shortly before or during the opening of the 2186 Reaper invasion, Liara
  learned that the Illusive Man had tracked her down and intended to seize the Shadow
  Broker Base for Cerberus. Knowing the old ship could not survive spaceflight and
  expecting an assault, Liara and Feron loaded as much of the base's information drives
  and communications equipment as they could aboard a shuttle and escaped as Cerberus
  ships closed in. Liara then remotely piloted the abandoned base into a Cerberus
  cruiser, destroying both vessels.

  Liara relocated her operation to the renovated Normandy SR-2, setting up the Broker
  equipment in Miranda Lawson's former quarters and resuming her eavesdropping and
  resource-brokering in support of the war effort. Her network of agents remained
  largely intact, though the war steadily thinned their numbers, and some of the
  Broker's caches were left scattered across the galaxy awaiting recovery. Assorted
  technology salvaged from the wreck of the base was later contributed to the
  construction of the Crucible. Liara made no move to reveal her identity, and
  long-time underlings such as Barla Von never learned of the change; a surviving
  Urdnot Wrex might only make sly allusions to it.
characters:
  - Liara T'Soni
  - Feron
  - The Illusive Man
  - Glyph
consequences:
  - The Shadow Broker Base on Hagalaz is deliberately crashed into a Cerberus cruiser, destroying both ships
  - Cerberus fails to capture the Shadow Broker network
  - Liara and Feron escape with the essential data drives and communications gear
  - Liara reestablishes Shadow Broker operations aboard the Normandy SR-2 for the duration of the Reaper War
  - Salvage from the wrecked base is later used to help build the Crucible
  - Some of the Broker's resources remain scattered across the galaxy for later recovery
