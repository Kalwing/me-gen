event_id: alestia-iallis-revealed
title: Alestia Iallis Revealed as Asari Commando
game: Mass Effect
chronological_order: 740
date: "2183 CE"
summary: |
  At Peak 15 on Noveria, Commander Shepard encounters Dr. Alestia Iallis, an asari molecular geneticist specializing in biotic-enhanced allele-specific hybridization. Initially presenting herself as a calm and professional scientist, Alestia appears oddly detached about the crisis at the facility and is notably rude when questioned. When Shepard agrees to help Dr. Zev Cohen develop a cure for a biotoxin sickening the scientists at the facility, Shepard's squad is locked in the quarantined laboratory until they can be scanned clean of the toxin. Once the cure is successfully prepared, Alestia reveals her true nature. She ambushes Shepard's squad alongside a squad of geth soldiers, revealing herself as an asari commando under direct orders from Matriarch Benezia to kill Commander Shepard at the first opportunity. Alestia expresses delight that Shepard's squad is trapped in the lab for what she intends to be a quiet disposal. However, her plan fails. Shepard's squad defeats Alestia and her geth contingent in the ensuing firefight. After the battle, Shepard's squad discovers the murdered laboratory guard outside the facility and confronts Dr. Cohen about the setup. Cohen insists he was unaware of Alestia's commando status, revealing that she was transferred to Peak 15 only a month prior at the behest of investor Saren Arterius. If a firefight breaks out between Shepard's squad and Rift Station's guards before Alestia sheds her cover, she simply disappears from her post instead of engaging directly.
characters:
  - Dr. Alestia Iallis
  - Commander Shepard
  - Matriarch Benezia
  - Dr. Zev Cohen
  - Captain Ventralis
  - Saren Arterius
  - Liara T'Soni
consequences:
  - Alestia Iallis is killed in combat
  - Shepard discovers that Matriarch Benezia is orchestrating a kill operation against the Commander
  - The connection between Saren, Benezia, and the Peak 15 facility is confirmed
  - A murdered guard is found outside the lab
  - Dr. Cohen confirms he was unaware of Alestia's true status
  - Shepard learns about Saren's influence over Peak 15 operations
