event_id: executor-pallin-death-bailey-promotion
title: Executor Pallin's Death and Bailey's Promotion
game: Mass Effect 3
chronological_order: 1620
date: "2186 CE"
summary: |
  Early in 2186, as humanity prepares for what will become the Reaper invasion, Citadel Councilor Donnel Udina summons Captain Armando-Owen Bailey with a grave accusation. Udina claims that Citadel Security Services has been infiltrated and compromised by factions working against the Council, with Executor Pallin himself implicated in the conspiracy. Reluctant to take the assignment, Bailey nonetheless accepts the investigation when Udina assures him that Bailey alone can be trusted. Bailey is directed to investigate an office building in his precinct where Pallin has been observed. At the location, Bailey discovers two dead C-Sec officers, one clutching a datapad displaying Pallin's face—apparent evidence of conspiracy. When Executor Pallin emerges from the shadows, he immediately demands the datapad at gunpoint and insists that Udina cannot be trusted. Bailey, in a tense confrontation, presents Udina's accusations and orders Pallin to submit to arrest. However, Pallin, either shocked by the false evidence or enraged by the setup, opens fire on Bailey, striking him in the shoulder. Bailey returns fire, wounding Pallin in the chest. The injured Executor, refusing to surrender peacefully, attacks Bailey in a desperate physical struggle. Bailey, fighting for his life, manages to shoot and kill Pallin. Bailey retrieves the incriminating datapad but immediately recognizes inconsistencies in Pallin's behavior: the Executor seemed genuinely shocked by the accusations, and his fighting style was uncharacteristically clumsy and desperate—not the tactics of a confident conspirator. When Bailey reports to Udina with his concerns about Pallin's apparent innocence, Udina dismisses the observations as a sign of a guilty man caught red-handed. Udina promotes Bailey to the rank of Commander and commends him for his service, informing him that the Council expects a full report. Bailey accepts the promotion but stands troubled, deeply uncertain whether he has arrested or executed an innocent man framed by Udina's conspiracy. The promotion, while career-advancing, costs Bailey the vacation to Earth he had planned to spend time with his estranged child.
characters:
