consequences:
  - Executor Venari Pallin is killed by Captain Bailey
  - Armando-Owen Bailey is promoted to the rank of Commander
  - Bailey assumes greater responsibility in C-Sec operations
  - Bailey is unable to take his planned vacation to Earth
  - The Citadel Council receives a report of suspected internal conspiracy
  - Bailey's moral uncertainty about Pallin's guilt plants seeds of doubt about Udina's reliability
  - Bailey's hesitation about Pallin's innocence foreshadows later revelations about Udina's treachery
