event_id: murder-of-irikah-krios
title: "The Murder of Irikah Krios"
game: Mass Effect 2
chronological_order: 280
date: "approx. 2170 CE"
summary: |
  Irikah Krios was the wife of the drell assassin Thane Krios and the mother of
  their son Kolyat, remembered for her sunset-colored eyes. She first crossed
  Thane's path when she deliberately stepped into the path of a targeting laser in
  a park to prevent the assassination of an elderly salarian; on learning that
  Thane was behind the trigger she started to call security, then relented after
  hearing his plea for redemption. Despite her early skepticism and contempt she
  came to show him compassion, forgave him, and the two grew close, dated, and
  married in a small open-air ceremony. Irikah, a lab researcher developing a
  vaccine for a rare hanar disease, told Thane he was free to choose his own
  future, and on her advice he asked the hanar to release him from his Compact.
  She gave him a coin that had belonged to her father, saying that rubbing it had
  brought her father peace of mind. After Kolyat was born and money was tight she
  supported Thane's decision to freelance as an assassin.

  One of Thane's contracts, the killing of the leaders of a batarian slaver ring,
  brought vengeful batarians down on the family. Too afraid to move against Thane
  directly, they paid the Shadow Broker to identify him and sent a hitman to his
  home on Kahje while Thane was away. Sensing intruders, Irikah told Kolyat to
  hide and armed herself with a knife, but she was killed. Thane returned for her
  funeral, left Kolyat in the care of relatives, and hunted down everyone
  complicit in her murder, giving them slow, torturous deaths unlike his usual
  clean method; he extracted the name of the last conspirator, Stiv Kay, sniped
  him, and finished him slowly. He later threw her father's coin into the sea and
  vowed to walk the path he had been given. As dramatized in the comic Mass
  Effect: Foundation 12, Thane recounts this history in a simple interview when
  the Cerberus agent Rasa compiles his dossier. Irikah's death fractured Thane's
  relationship with Kolyat, who grew up feeling abandoned, and it became the
  emotional core of the backstory Thane shares with Commander Shepard after his
  recruitment on Illium in 2185; he says Irikah had reminded him of Arashu, the
  goddess of motherhood and protection.
characters:
  - Irikah Krios
  - Thane Krios
  - Kolyat Krios
  - Stiv Kay
consequences:
  - Irikah Krios is killed by a batarian-hired hitman in the Krios family home
  - Thane leaves the infant Kolyat with relatives and abandons him emotionally
  - Thane hunts down and kills everyone involved in Irikah's murder, ending with Stiv Kay
  - The estrangement between Thane and Kolyat drives the 2185 mission Thane: Sins of the Father
  - Irikah's memory becomes central to Thane's backstory shared with Shepard
