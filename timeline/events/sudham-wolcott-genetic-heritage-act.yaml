event_id: sudham-wolcott-genetic-heritage-act
title: The Sudham-Wolcott Genetic Heritage Act
game: Mass Effect
chronological_order: 180
date: 2161 CE
summary: 'In the decades before first contact, human genetic research had advanced far enough to ''uplift''
  animal species lingering on the borders of sapience and to correct genetic disorders by replacing defective
  alleles with functional ones via viral vectors. After humanity made first contact with the turians and
  joined the wider Citadel community, policymakers grew concerned that unrestricted genetic modification
  could erode Earth''s unique biodiversity. In response, the Systems Alliance Parliament passed the Sudham-Wolcott
  Genetic Heritage Act in 2161, imposing strict controls on genetic engineering. Under the Act, modifying
  an organism''s natural abilities remained legal (for example, using gene therapy to increase muscle
  mass), but engineering entirely new abilities did not (for example, granting the ability to digest cellulose).
  The law sat alongside broader Citadel regulations that permit creating life for scientific or medical
  reasons but forbid the creation of new sapient species, though some products slipped through, most notably
  the Sirta Foundation''s medi-gel. By the time of Commander Shepard, the regulated but widely available
  technology had nearly eliminated genetic disease from the human gene pool: most governments offered
  free assessment and correction therapy, flaws were routinely fixed in utero or shortly after birth (Ashley
  Williams received gene therapy for an inherited tendency to nearsightedness), and every Alliance soldier
  received MarsGene gene therapy on enlistment, most treatments taking years to reach full effect. Shepard
  could probe the grey areas of the law in conversation, discussing Binary Helix''s military enhancement
  packages with Rafael Vargas while posing as a buyer and debating gene therapy with an arguing couple
  on the Presidium.'
characters:
- Systems Alliance Parliament
- Ashley Williams
- Rafael Vargas
- Commander Shepard
consequences:
- 'Human genetic modification is legally restricted: enhancing natural abilities is allowed, adding new
  ones is banned'
- Free assessment and correction therapy nearly eliminates genetic disease from the human gene pool
- All Alliance soldiers, including Shepard's squad, receive MarsGene gene therapy on enlistment
- Corporations such as Binary Helix operate in the legal grey area of military enhancement packages
- Human policy aligns with Citadel rules forbidding the engineering of new sapient species
