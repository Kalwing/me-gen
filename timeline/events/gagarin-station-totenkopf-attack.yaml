event_id: gagarin-station-totenkopf-attack
title: "Totenkopf Bioweapon Attack on Gagarin Station"
game: Mass Effect 2
chronological_order: 900
date: "2184 CE"
summary: |
  Gagarin Station, named after Yuri Gagarin and colloquially called Jump Zero, was
  for decades before the discovery of the Charon Relay the furthest human-built
  structure from Earth. It earned the nickname Jump Zero as the launching point
  for humanity's early failed attempts at faster-than-light travel before mass
  effect field technology matured, and it was used for deep-space telemetry,
  exploration, and experiments deemed too dangerous to run near more valuable
  assets. In the early years of biotic research it served as an isolated site to
  evaluate emergent human biotics, and during the Biotic Acclimation and
  Temperance Training programme it was taken off the extranet for security. After
  biotic training ended, the Alliance repurposed Jump Zero for AI research, and
  the Alliance's first experimental AI, Eliza, achieved sapience aboard. As of
  2183 it was the largest Alliance deep-space station, with a permanent population
  of about 9,000, and a proposal to relocate it to the stable barycenter between
  Pluto and the Charon Relay was shelved indefinitely over the cost of moving its
  mass.

  In 2184 a terrorist group known as Totenkopf attacked the station with a
  prion-based biowarfare agent designated EHE, exotic humanoid encephalopathy.
  Public details of the incident were sparse and heavily redacted; speculation
  about the agent's origin pointed either to the asteroid Israfil in the
  Vallhallan Threshold or to synthesis in local laboratories. The attack
  reinforced Gagarin Station's long-standing reputation as a place where the
  Alliance conducted its most hazardous work.
characters:
  - Totenkopf
consequences:
  - The Totenkopf terror group deploys the prion agent EHE aboard Gagarin Station in 2184
  - Casualty figures and the Alliance response are redacted from public record
  - The source of the bioweapon is never publicly confirmed, with suspicion falling on the asteroid Israfil or local labs
  - Gagarin Station's reputation as a site for the Alliance's most dangerous experiments is reinforced
