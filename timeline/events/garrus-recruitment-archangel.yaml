event_id: garrus-recruitment-archangel
title: "Dossier: Archangel - Garrus Vakarian Recruitment"
game: Mass Effect 2
chronological_order: 1040
date: "2185 CE"
summary: |
  Two years after helping Commander Shepard expose Saren and save the Citadel, Garrus Vakarian has left C-Sec behind in frustration. Unable to effect real change against bureaucratic corruption and criminal enterprises on the Citadel, he migrated to Omega, the lawless Terminus Systems' largest space station. As dramatized in the comic Mass Effect: Homeworlds 3, Garrus - shaped by a demanding father who taught him to shoot and to "do things right or not at all" - pursued a drug-trafficking suspect, Kishpaugh, to Omega after quitting C-Sec. There he met Sidonis at Afterlife, and the two built a vigilante squad that grew to twelve, including a salarian explosives expert and a batarian tech expert; Garrus took the name "Archangel." The cell declared war on Omega's mercenary syndicates while sparing civilians, and Garrus repeatedly pushed his people past their limits rather than let them settle down.

  Operating under the name "Archangel," Garrus led the twelve-person cell to disrupt the operations of Omega's three dominant mercenary syndicates: the Eclipse, Blood Pack, and Blue Suns. His campaign of disruption - sabotaging operations, assassinating high-ranking operatives, and eliminating key infrastructure - destabilized the mercenary groups' control and made them increasingly desperate. Sidonis, captured by the Blue Suns, was coerced into luring Garrus away to the Kenzo District; Garrus returned to find the hideout bombed and his entire squad gunned down, leaving him to make a lone last stand.

  When Cerberus brings Commander Shepard to Omega to recruit this legendary vigilante, the three mercenary factions finally unite under a temporary truce. Realizing that Archangel's death is imminent without assistance, Shepard's squad joins the fight under the pretense of freelance mercenaries seeking mercenary credit. Shepard and Shepard's teammates push through mercenary-held territory in Kima District, encountering Eclipse, Blood Pack, and Blue Suns forces. They have the opportunity to sabotage enemy strength by disabling the YMIR Mech that the mercs are deploying or by impairing Sergeant Cathka's repair efforts on the Blue Suns' Mantis gunship.

  Shepard reaches Archangel's sniper nest and removes his helmet to reveal the familiar face of Garrus Vakarian, visibly exhausted and physically wounded from his prolonged hold against the mercenary assault. Garrus explains his journey to Omega and his failed attempt to make a difference through vigilante justice. The three mercenary factions launch coordinated assaults on Archangel's position: first Eclipse (led by Jaroth), then Blood Pack (led by Garm), and finally Blue Suns (led by Tarak in an A-61 Mantis Gunship). Garrus is severely wounded by the gunship's rocket fire; Shepard destroys the gunship and eliminates the final mercenary threat.

  After recruitment, Garrus is evacuated to the Normandy SR-2 for medical treatment. He undergoes cybernetic reconstruction, permanently bearing a distinctive facial scar and damage to his armor from the battle. Despite his injuries, Garrus recovers and becomes a vital asset for the suicide mission, taking up residence in the Normandy's main battery. A widow, Nalah Butler, subsequently emails Shepard asking that Garrus be supported in processing guilt over his fallen teammates' deaths, demonstrating the weight of his leadership failure on Omega.
