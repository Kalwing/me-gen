consequences:
  - Garrus Vakarian joins Commander Shepard's team
  - Garrus undergoes cybernetic reconstruction, gaining permanent facial scars
  - Garrus takes up residence in the Normandy's main battery
  - All three mercenary syndicates suffer heavy casualties
  - Jaroth, Garm, and Tarak are killed
  - Garrus's ten-man Omega squad is wiped out after Sidonis's coerced betrayal, driving his later loyalty mission
  - Garrus overcomes his trauma and becomes fully committed to Shepard's mission
  - Nalah Butler's loyalty to Garrus is secured
  - Shepard can establish or rekindle a romance with Garrus
  - Garrus becomes available as a squadmate for the suicide mission
