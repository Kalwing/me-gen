event_id: keiji-okuda-death-bekenstein
title: "Death of Keiji Okuda on Bekenstein"
game: Mass Effect 2
chronological_order: 870
date: "approx. 2183 CE"
summary: |
  Keiji Okuda was a professional thief and the partner and lover of master thief
  Kasumi Goto. A former operative of the Alliance Intelligence Agency under the alias
  Abraham Rumoi, he had a graybox neural implant surgically fitted so he could store
  and recall the information his work required. Over years of jobs he accumulated
  highly sensitive material whose exposure would badly damage the Systems Alliance's
  reputation. He was prosecuted for stealing and selling classified data, but an
  Alliance self-incrimination statute barred prosecutors from using his graybox
  memories against him, and he was released on the technicality, after which he
  vanished. He and Kasumi had first met when both were hired to steal the same
  painting and chose to keep it.
  As depicted in Mass Effect: Foundation, after his release Keiji returned to the
  couple's Illium apartment and then agreed to a heist against the arms dealer
  Donovan Hock at Hock's fortified estate on Bekenstein, in the Serpent Nebula.
  During the job Hock caught Keiji, stabbed him in the head, and forcibly cut out
  his graybox, leaving him to bleed out. Dying, Keiji told Kasumi, whom he called
  "Little Bird," to survive and recover the graybox so they could "be together
  again." Kasumi cloaked, left his body behind, and vowed to keep her word.
  Hock kept the graybox in his vault and spent the following years unsuccessfully
  trying to decrypt it. Keiji's death drove Kasumi to accept Cerberus's offer to
  join Commander Shepard's mission against the Collectors on condition that Shepard
  help her raid Hock's estate. That heist, her loyalty mission, ends with Hock dead
  and the graybox recovered. The hidden secret is finally revealed during the Reaper
  War: the Alliance had run a black-ops raid on a batarian group studying Reaper
  technology, a fact whose exposure could ignite an Alliance-batarian war.
characters:
  - Keiji Okuda
  - Kasumi Goto
  - Donovan Hock
consequences:
  - Keiji Okuda is killed by Donovan Hock
  - Hock cuts out and steals Keiji's graybox, containing a classified Alliance secret
  - Kasumi Goto vows to recover the graybox and escapes Bekenstein
  - Hock spends years failing to decrypt the graybox
  - Kasumi later joins Shepard's Collector mission in exchange for help raiding Hock's estate (Kasumi: Stealing Memory)
