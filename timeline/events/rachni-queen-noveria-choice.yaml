  - Ashley Williams
  - Citadel Council
consequences:
  - "Per `rachni_queen`: Shepard frees the queen or kills her with the lab's acid tanks"
  - If freed, the rachni species survives; the queen escapes into Noveria's wilderness and later contacts Shepard on Illium in 2185, pledging aid against the Reapers
  - If freed, the Citadel Council rebukes Shepard for the risk and warns the rachni may again threaten the galaxy
  - If killed, the rachni are rendered extinct a second time and the Council condemns Shepard; the Noveria cloning project produces no viable samples
  - Sets up the ME3 Attican Traverse mission at Utukku - a captive queen if she lived, or a Reaper-built "Breeder" if she died
  - Shepard euthanizes the queen's insane, unguided newborns at her request
