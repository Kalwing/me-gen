event_id: rachni-queen-noveria-choice
title: The Rachni Queen's Fate on Noveria
game: Mass Effect
chronological_order: 760
date: "2183 CE"
summary: |
  A rachni vessel had escaped the Rachni Wars and drifted for centuries with eggs in
  cryogenic suspension. The corporation Binary Helix recovered the ship and brought one
  egg to the Peak 15 research facility on Noveria, intending to clone a worker and
  mass-produce a docile army. Instead the egg hatched a rachni queen. When Binary Helix
  removed her newborns to condition them as obedient soldiers, the brood - deprived of
  the queen's guiding "song" - went insane, broke free, and overran the facility.
  Matriarch Benezia, acting on Saren Arterius's orders, used her biotics to strip the
  Mu Relay coordinates from the queen's genetic memory.

  After Commander Shepard defeats Benezia in the secure lab, the captured queen speaks
  through the body of a dead asari commando. She says the rachni had been driven to war
  by a "sour yellow note" from space that "hushed one voice after another," implying
  the rachni were not fully responsible for the Rachni Wars. She asks Shepard to
  euthanize her broken children and then poses the choice: kill her with the lab's acid
  tanks and consign her species to the "great silence," or free her to begin her race
  anew in peace. Shepard's squad is split - Liara T'Soni and Tali'Zorah favor release,
  Kaidan Alenko favors it pragmatically, Garrus Vakarian wants the Council alerted
  first, and Urdnot Wrex and Ashley Williams oppose it - but the decision is Shepard's
  alone (per `rachni_queen`).

  If freed, the queen flees into Noveria's wilds, vowing to teach her offspring the
  kindness Shepard showed her; the turian Councilor warns she could threaten the
  Citadel again within a few generations. If killed, Shepard pushes the dying commando
  aside and personally activates the acid bath, and the Council later condemns Shepard
  for rendering the rachni extinct a second time. In Mass Effect 2, if the queen lived,
  a newscast reports scout ships of rachni design and an unnamed asari courier on
  Illium - saved by the rachni after a crash - relays the queen's thanks and her
  pledge of aid "against the coming darkness" (the Reapers), the rachni having advanced
  enough to repair damaged starships. If the queen died, a report notes the Noveria
  cloning facility yielded no viable rachni samples. The ME3 payoff plays out at
  Utukku (see `attican-traverse-rachni`): a surviving queen is held captive by the
  Reapers, while a dead queen is replaced by an artificial "Breeder."
characters:
  - Commander Shepard
  - Rachni Queen
  - Matriarch Benezia
  - Saren Arterius
  - Liara T'Soni
