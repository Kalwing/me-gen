event_id: mass-effect-redemption
title: Liara and Feron Recover Shepard's Body
game: Mass Effect 2
chronological_order: 850
date: "2183 CE"
summary: |
  Immediately after the SSV Normandy SR-1 is destroyed and Commander Shepard is spaced
  over Alchera, Liara T'Soni sets out to learn Shepard's fate. On Omega she hires the
  drell information trafficker Feron, who reports that Shepard is "neither dead nor
  alive." The pair are ambushed by Blue Suns mercenaries sent by the Shadow Broker to
  delay Liara, and are saved by an unseen sniper before Cerberus agents, including
  Miranda Lawson, bring them to the Illusive Man. He reveals the Shadow Broker is
  working with the Collectors, who want Shepard's body. Feron admits he had been
  ordered to lead Liara away from Shepard but chose to help her instead.

  Feron takes Liara to Afterlife on Omega, where Aria T'Loak holds court, and traces
  where the Blue Suns will deliver the body. He spots the Broker's enforcer Tazzik but
  fails to disable his ship, and Tazzik escapes Omega with Shepard's remains. Feron
  confesses he never stopped working for the Shadow Broker, which lets the two track
  Tazzik to the Broker's base on Alingon. Passing Liara off as his prisoner, Feron
  downloads the Broker's dealings while Liara distracts a hologram of the Broker. He
  further admits Cerberus recruited him and that he and the Illusive Man had planned
  for him to seize the body. When a Collector exposes him as a traitor, Feron holds
  off Tazzik so Liara can flee with Shepard's body, and is captured by the Shadow
  Broker.

  Liara delivers Shepard's remains to Cerberus for the Lazarus Project, the effort
  that will rebuild and revive the Commander two years later, while Feron remains a
  prisoner being tortured on the Broker's ship. The events are told in the four-issue
  comic series Mass Effect: Redemption.
characters:
  - Liara T'Soni
  - Feron
  - Miranda Lawson
  - The Illusive Man
  - Tazzik
  - Aria T'Loak
  - The Shadow Broker
consequences:
  - Shepard's body is recovered from the Shadow Broker's agents and handed to Cerberus for the Lazarus Project
  - Feron is captured by the Shadow Broker and imprisoned and tortured for two years
  - Liara becomes indebted to Cerberus and obsessed with rescuing Feron and destroying the Shadow Broker
  - It is revealed the Shadow Broker was collaborating with the Collectors to obtain Shepard's corpse
  - Liara's data on the Broker's operations later seeds the hunt in Lair of the Shadow Broker
