event_id: fehl-prime-collector-attack
title: Collector Harvest of Fehl Prime
game: Mass Effect 2
chronological_order: 1250
date: "2185 CE"
summary: |
  Two years after defending Fehl Prime from a Blood Pack assault, the Alliance special
  forces unit Delta Squad was still stationed on the colony as its garrison while the
  Alliance installed military-grade kinetic barriers and defense cannons, amid rumors of
  Terminus colonies vanishing. Captain Toni sent the squad to destroy a signal that was
  jamming communications; once it was down, a Collector ship arrived and began harvesting
  colonists. Lieutenant James Vega led a plan to turn the colony's defense cannon on the
  ship, but it fired at half power, was deflected, and was destroyed.

  Kamille was captured and incorporated into a Praetorian, which incinerated her
  boyfriend Mason; Nicky was fatally stabbed by the Praetorian before Essex and Vega
  destroyed it. The squad freed the imprisoned krogan Brood in exchange for his ship.
  The civilian Messner was exposed as a Cerberus informant who identified the attackers
  as Collectors. The survivors flew into the Collector ship, but Messner shot Brood,
  crashing them, and they were taken prisoner. They used the Collector processing
  systems to disperse a cure to harvested civilians. Milque prepared an escape freighter
  while Vega and Essex fought the Collectors; Essex and Messner were killed and the asari
  archaeologist Treeya was vented into space. Vega then faced a final choice between
  recovering Treeya's intelligence on the Collectors or rescuing a group of awakened
  colonists. Only Vega and Milque survived. A psychologically scarred Vega later returned
  to Fehl Prime with Milque to honor the dead. The events are shown in the animated film
  Mass Effect: Paragon Lost.
characters:
  - James Vega
  - Milque
  - Essex
  - Kamille
  - Nicky
  - Mason
  - Toni
  - Brood
  - Messner
  - Treeya
  - Collectors
consequences:
  - Fehl Prime's population is harvested by the Collectors and the colony is effectively destroyed
  - Delta Squad is wiped out except for James Vega and Milque
  - Kamille is converted into a Praetorian; Mason, Nicky, Essex, Treeya and the Cerberus informant Messner are killed
  - A cure dispersed through the Collector ship's systems saves some harvested civilians
  - Per Vega's final choice: either Treeya's Collector intelligence is recovered, or a group of awakened colonists is saved
  - James Vega is left deeply traumatized, shaping his later assignment guarding Shepard and joining the Normandy in Mass Effect 3
  - Further evidence that the Collectors, long thought a myth, are abducting human colonies
