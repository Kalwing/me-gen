event_id: vallum-blast-and-war-on-taetrus
title: The Vallum Blast and the War on Taetrus
game: Mass Effect 3
chronological_order: 1340
date: "2185 CE"
summary: |
  Taetrus, a populous turian colony in the Mactare system dating back centuries, had
  a history of internal strife: a civil war decades earlier had fortified many of its
  cities and strategic sites, such as the Spaedar Spaceport and Kasatum Fortress, to
  military specifications. In 2185 a turian separatist group called Facinus, whose
  political arm operated out of the marsh-like Diluvian Wildlands on the island
  continent of Eluria, sought to separate Taetrus from the Turian Hierarchy, which it
  accused of betraying its people. Facinus operatives reprogrammed the FTL plotter of
  a commercial starship and rammed it at near-FTL speed into the heart of Vallum, the
  colony's capital, obliterating the city center and killing tens of thousands - by
  some accounts more than a hundred thousand - turians. The attack, known as the
  Vallum Blast, became the worst act of terrorism in turian history. Facinus had made
  an earlier attempt in February, hijacking another commercial cruiser (the MSV
  Sevrum) that crashed at suborbital speed in an uninhabited area, and its members,
  such as Kihilix Tanus, publicly threatened further hypervelocity strikes, even
  against Palaven.

  In response, the Turian Hierarchy and Taetrian colonialist forces launched a
  massive invasion of Facinus strongholds in a short, decisive conflict called the
  War on Taetrus. Colonial troops combined a dual strategy of safe internment camps
  for surrendering civilians with hastatim executions of holdout separatists,
  drawing much of their best intelligence from sympathizers horrified by the Blast.
  Captain Guard Vidinos led a special-operatives team that distinguished itself by
  hunting down separatist leaders. Facinus benefited from Wildlands civilian support
  and the old civil-war fortifications, and continued trying to weaponize improvised
  FTL plotters, but after months of fighting the movement was systematically
  eliminated. Civilians returned home from the camps while Hierarchy forces began
  reconstruction and family reunification.
characters:
  - Vidinos
consequences:
  - The center of Vallum, Taetrus's capital, is destroyed and tens of thousands of turians are killed
  - The Turian Hierarchy and Taetrian forces invade and exterminate the Facinus separatist movement in the War on Taetrus
  - Vidinos's special-operatives team gains distinction tracking separatist leaders
  - Taetrus enters a long reconstruction and family-reunification effort
  - The trauma of Vallum leaves Taetrus embedded in the turian psyche, which the Reapers exploit in 2186 by striking the colony first and rebroadcasting images of a ruined Vallum across turian comm buoys during the Fall of Taetrus
