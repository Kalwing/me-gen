event_id: collector-ship-mission
title: 'Collector Ship: Discovery of the Prothean Truth'
game: Mass Effect 2
chronological_order: 1270
date: '2185 CE'
summary: >
  During an early-to-mid-game mission in Mass Effect 2, Commander Shepard's crew
  aboard the Normandy SR-2 was dispatched by the Illusive Man to investigate a
  Collector cruiser found adrift in space, apparently disabled by a turian patrol.
  The Illusive Man claimed this offered a rare opportunity to study Collector
  technology and understand the threat posed by the species to human colonies.

  Upon boarding the massive, derelict vessel, Shepard's team moved through a linear
  interior filled with dead bodies and advanced Collector technology. Inside the
  ship's control terminals, EDI began analyzing the Collectors' genetic samples and
  discovered evidence of comprehensive genetic comparisons between Collector and
  human biology. The analysis revealed a shocking truth: the Collectors were revealed
  to be descendants of the long-extinct Prothean civilization, transformed and enslaved
  by the Reapers.

  As the squad advanced deeper, they encountered a vast chamber containing millions
  of empty stasis pods—evidence that the Collectors intended to harvest the entire
  human population of Earth. Upon accessing a command console to extract critical
  database information, however, the platform suddenly launched into the air and
  multiple waves of Collector forces attacked from flying platforms in one of the
  game's most difficult combat encounters. It was then revealed that the distress
  signal had been a trap orchestrated by the Illusive Man himself—his own encrypted
  protocols were embedded in the false signal, proving he had deliberately sent
  Shepard into danger to gather intelligence by sacrificing the Commander's team if
  necessary.

  After fighting through waves of Collectors, Husks, Abominations, and a possessed
  Collector drone controlled by Harbinger, Shepard's team escaped via shuttle as the
  cruiser powered its weapons for a final counterattack. Back on the Normandy, EDI's
  full analysis revealed that the Collectors possessed an advanced Identify
  Friend/Foe (IFF) device allowing them to navigate the Omega 4 Relay safely. The
  Illusive Man then directed Shepard to locate a derelict Reaper in the Thorne
  system, from which a compatible IFF could be recovered to access the Omega 4
  Relay—warning that the passage would likely be one-way.

  Key revelations from this mission included the Collectors' true Prothean origin,
  evidence of human-targeted genocide, the Illusive Man's willingness to sacrifice
  assets for intelligence, and the necessity of acquiring an IFF to proceed against
  the Collector threat.
characters:
  - Commander Shepard
  - The Illusive Man
  - EDI
  - Harbinger
  - Joker
  - Jacob Taylor
  - Miranda Lawson
  - Mordin Solus
  - Legion
  - Collector forces
consequences:
  - >
    The Collectors are revealed to be descended from the Protheans, transformed by
    the Reapers into a slave species bent on harvesting organic life.
  - >
    Evidence obtained shows that the Collectors intended to harvest the entire
    population of Earth—millions of colonists could be processed from human worlds.
  - >
    The Illusive Man's involvement in sending Shepard into a trap is exposed to the
    crew, sowing distrust between Cerberus and Shepard.
  - >
    EDI acquires critical data revealing that the Collectors use an Identify
    Friend/Foe (IFF) system to safely traverse the Omega 4 Relay.
  - >
    Shepard learns that a Reaper IFF must be recovered from a derelict Reaper in the
    Thorne system to enable passage through the Omega 4 Relay.
  - >
    The Normandy SR-2 receives advanced weapons training from Cerberus, allowing
    Shepard to choose a permanent weapon proficiency upgrade.
  - >
    Several squad members discuss the severity of the Collector threat; crew morale
    is affected by the revelation that Shepard was deliberately endangered.
