  - CAT6 mercenary forces on the Citadel are defeated
  - Maya Brooks is taken into custody (can be killed or arrested per player choice)
  - The clone's Spectre code authorization is exposed as fraudulent
  - The Archives are secured and the identity theft conspiracy unraveled
  - Direct lead into Citadel Docks: Retake the Normandy mission
  - Shepard's clone flees to the Normandy with remaining CAT6 forces
  - The clone's ultimate fate is determined in the final Normandy confrontation (can choose to save or execute)
