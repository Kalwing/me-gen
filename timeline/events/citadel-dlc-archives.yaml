event_id: citadel-dlc-archives
title: 'Citadel Archives: Shepard''s Clone Revealed'
game: Mass Effect 3
chronological_order: 1700
date: "2186 CE"
summary: |
  During shore leave on the Citadel following the Cerberus coup, Commander Shepard discovers that the mysterious figure orchestrating their identity theft is not a criminal mastermind but an exact clone of themselves, created by Cerberus during the Lazarus Project as a source of spare parts. The clone had been grown and left in stasis, but awakened roughly six months prior and learned to behave human through neural implants.

  After being chased through earlier identity theft attempts (including an ambush at Ryuusei's Sushi Bar and infiltration of the Silver Coast Casino), Shepard pursues the clone into the Citadel Archives. There, the clone reveals itself in a climactic confrontation. Brooks, an ex-Cerberus agent who had previously assembled the dossiers for the Suicide Mission, has activated the clone as a loose end after becoming disillusioned with Cerberus and the Illusive Man's descent into madness.

  The clone's plan is ambitious and calculated: use CAT6 mercenaries to secure the Citadel Archives, steal Shepard's Spectre codes and command authorization, access the Normandy SR-2's override systems, and ultimately impersonate the real Commander to take command of the ship. The clone views itself as the true Shepard—a lone wolf unconstrained by the emotional attachments that define the original's leadership.

  Shepard's team fights through waves of CAT6 operatives inside the Archives. The clone uses the captured Normandy codes to contact Samantha Traynor, ordering the ship prepped for emergency launch under false authority. However, before escaping, the clone seals Shepard and the squad inside iridium vaults—a trap that appears to succeed as the clone heads toward the docking bays. Shepard's AI assistant Glyph discovers the vault system and frees them, allowing the pursuit to continue into the Normandy Docks.
