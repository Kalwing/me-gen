  - EDI
consequences:
  - Roughly one-third of Horizon's colonists are abducted by the Collectors
  - The GARDIAN batteries are brought online, forcing the Collector ship to retreat with its harvest unfinished
  - Shepard reunites with the Virmire survivor (Ashley or Kaidan, per `virmire_survivor`); the meeting strains their relationship over Shepard's Cerberus ties and they refuse to rejoin the crew
  - First direct ground confrontation between Shepard and the Collectors, and first encounter with Harbinger possessing Collector troops
  - Husks among the Collector forces confirm the Collectors serve the Reapers
  - The Illusive Man admits he leaked Shepard's Cerberus affiliation and baited the Collectors to Horizon; he redirects the mission toward the Omega 4 Relay and provides three new dossiers
  - Salvage teams recover Collector bodies for study
  - Colonist distrust of the Alliance deepens, exemplified by Delan abandoning the colony; survivor Robyn Reeve later contacts Shepard about abducted relatives
