event_id: horizon-collector-attack
title: "Horizon: Collector Attack and Reunion with the Virmire Survivor"
game: Mass Effect 2
chronological_order: 1260
date: "2185 CE"
summary: |
  Horizon was a human colony in the Terminus Systems (Iera System, Shadow Sea), home
  to some 643,315 people per Collector data gathered in 2183. After the Illusive Man's
  intelligence pointed to it as the Collectors' next target, the Systems Alliance
  quietly installed GARDIAN anti-ship batteries and sent a specialist to fix their
  badly miscalibrated targeting system. The colonist mechanic Delan, who had moved to
  Horizon because he distrusted the Alliance, believed the specialist was a spy and
  thought the batteries only made the colony a target. The turrets could not be
  calibrated in time.

  This mission triggered after Commander Shepard recruited Archangel, Jack, Mordin
  Solus and the krogan tank from Korlus. When communications went down, a Collector
  Cruiser descended and Seeker swarms stung and paralyzed colonists, including Lilith
  and the Virmire survivor, loading them aboard the ship. Mordin had developed a
  countermeasure to the Seeker swarms, letting Shepard's team move through the colony.
  They fought Collector Drones, Guardians and Assassins plus husks, and encountered
  Harbinger for the first time as it possessed Collector troops; the presence of husks
  confirmed the Collectors served the Reapers. Delan directed the team to the GARDIAN
  towers. At the spaceport Shepard hacked the transmitter, had EDI realign the lasers,
  and defended the tower through waves of Collectors, Scions, Harbinger and a
  Praetorian. Once charged, the batteries hammered the Collector cruiser, forcing it to
  retreat with roughly one-third of Horizon's population still aboard.

  Afterward Delan berated Shepard for failing to save his friends and abandoned the
  colony. The Virmire survivor (Ashley Williams or Kaidan Alenko, per `virmire_survivor`),
  spared abduction, reunited with Shepard but reacted with anger on learning Shepard
  worked with Cerberus, refusing to rejoin and revealing the Alliance had acted on a
  tip that Horizon would be hit. The Illusive Man admitted he had leaked Shepard's
  Cerberus ties and lured the Collectors to Horizon rather than wait, pledged to focus
  on the Omega 4 Relay, and handed over three new dossiers. Salvage teams captured
  Collector bodies for study; a colonist, Robyn Reeve, later emailed Shepard begging
  for help finding her abducted son and brother.
characters:
