event_id: council-meeting-me2
title: "Citadel: The Council - Shepard Returns to Face Skepticism"
game: Mass Effect 2
chronological_order: 960
date: "2185 CE"
summary: |
  Two years after the Battle of the Citadel, Commander Shepard—reported killed in action by the Council—returned to the galaxy after being resurrected by Cerberus. Having taken command of the newly-refit Normandy SR-2, Shepard returned to the Citadel to address the Council and present evidence of the imminent Collector threat to human colonies.

  Upon reaching the Presidium, Shepard was met by Admiral David Anderson, who informed the Commander that the Council was skeptical of claims about Reaper involvement and the Collector threat. The message Anderson left for Shepard varied based on the original Council's fate in Mass Effect: if the Council had been saved, Anderson noted Shepard had put humanity "on top" or secured a seat for themselves; if the Council had died, Anderson stated Shepard had placed humanity in a position of leadership.

  At the Council Chambers, the greeting depended on whether the original Council survived. If saved, a Council meeting was already underway; if not, the new Council refused to meet Shepard in person. The Council remained deeply skeptical of Shepard's warnings about the Collectors and the Reaper threat, having dismissed the Reaper threat as Saren's delusion in the first game. They questioned Shepard's survival and resurrection, viewing it with suspicion born of Shepard's Cerberus connections.

  Shepard could petition to be reinstated as a Spectre under certain conditions: if the original Council had been saved or if Anderson had become a Councilor following the first game's events. However, if Udina had become a Councilor, no such offer was available. Ambassador Udina arrived late to the proceedings and was visibly upset that Anderson had arranged matters without consulting him, creating tension between the old Alliance hierarchy and the Council's authority.

  The Council's refusal to acknowledge the Collector threat and their dismissal of the Reaper danger forced Shepard to pursue the Collector problem independently, ultimately proving that the threats were real through devastating action and sacrifice.

characters:
  - Commander Shepard
  - David Anderson
  - Donnel Udina
  - Citadel Council (varies by ME1 choices)
  - Ashley Williams or Kaidan Alenko (referenced)

consequences:
  - Shepard may be reinstated as a Spectre (if original Council or Anderson survived ME1)
  - No Spectre reinstatement if Udina became Councilor in ME1
  - The Council remains skeptical of the Reaper threat despite Shepard's warnings
  - Council maintains diplomatic distance due to Shepard's Cerberus resurrection
  - Shepard forced to pursue the Collector threat without Council authorization or support
  - The distrust sown here affects Shepard's later interactions with the Council in ME3
  - Anderson's position in Council politics becomes more significant
  - Udina's tensions with Anderson foreshadow political conflicts in ME3

