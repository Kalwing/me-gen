event_id: freedom-s-progress-investigation
title: "Freedom's Progress Investigation"
game: Mass Effect 2
chronological_order: 1010
date: "2185 CE"
summary: |
  Freedom's Progress was a human colony in the Terminus Systems with a recorded
  population of 912,810 in 2183. Two years later the Collectors struck the colony
  and carried off every inhabitant, leaving buildings intact and no sign of a
  struggle. Acting on the Illusive Man's briefing after Shepard's resurrection,
  Cerberus sent Commander Shepard with Jacob Taylor and Miranda Lawson to
  investigate as the third and final mission of the Mass Effect 2 prologue.

  Moving through the deserted settlement, the team fought waves of LOKI and FENRIS
  mechs and security drones that had been reprogrammed to attack intruders. In one
  prefab they met Tali'Zorah vas Neema leading a distrustful quarian squad
  searching for Veetor'Nara, a quarian on Pilgrimage whose damaged suit and
  subsequent infection had made him paranoid enough to turn the colony's defenses
  against everyone. The two squads agreed to cooperate, but Prazza and several
  quarians disobeyed Tali's orders and rushed ahead to reach Veetor before
  Cerberus could question him; a reprogrammed YMIR mech at the cargo docks
  slaughtered them, and Shepard's team destroyed the machine.

  The team found Veetor babbling about monsters while watching garbled security
  footage. A Paragon or Renegade interrupt calmed him. Veetor had assembled
  recordings proving the Collectors were behind the abductions; the group
  concluded he had been spared because the Collectors scanned only for human vital
  signs. Miranda wanted him taken into Cerberus custody for interrogation while
  Tali demanded he be returned to the Migrant Fleet for medical care, and the
  decision fell to Shepard. Afterward the Illusive Man debriefed Shepard on the
  Collector-Reaper link, explained that former squadmates and Spectre resources
  were unavailable, and recommended recruiting the salarian scientist Mordin Solus
  on Omega to counter the Collectors' Seeker Swarms. Joker was reintroduced as
  pilot of the Cerberus-built Normandy SR-2 and EDI introduced herself. News of
  the vanished colony spread only in redacted fragments, prompting the Council to
  file formal information requests with the Special Tasks Group, and Veetor's
  footage of the abduction reached the Shadow Broker.
characters:
  - Commander Shepard
  - Jacob Taylor
  - Miranda Lawson
  - Tali'Zorah vas Neema
  - Prazza
  - Veetor'Nara
  - The Illusive Man
  - Joker
  - EDI
  - Mordin Solus
consequences:
  - The Illusive Man obtains Veetor's omni-tool footage proving the Collectors are abducting entire human colonies
  - Prazza and his quarian squad are killed by a reprogrammed YMIR mech
  - Veetor is either taken into Cerberus custody for interrogation or returned to the Migrant Fleet; if returned he can later testify for Tali at her Admiralty Board hearing
  - Shepard learns the Collectors target only human life signs
  - The Normandy SR-2 and EDI are formally introduced and Joker rejoins as pilot
  - The Mass Effect 2 prologue ends and the recruitment missions for Mordin, Garrus, Jack, and Grunt open
  - The Citadel Council requests information from the Special Tasks Group; the abduction footage reaches the Shadow Broker
