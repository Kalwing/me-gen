event_id: kal-thor-camp-scandal
title: The Kal'thor Camp Scandal
game: Mass Effect 2
chronological_order: 260
date: "2168 CE"
summary: |
  Kal'thor Camp was a Blue Suns hostile-environment training facility on Gesis, an ice
  moon of the gas giant Xetic, the fifth planet of the Lusarn System in the Crescent
  Nebula. The camp was run by a cadre of former batarian Special Intervention Unit
  operators who put mercenary recruits through brutal survival and combat training.

  In 2168 a cluster-wide scandal broke when it was revealed that the mortality rate of
  recruits sent to Kal'thor might be as high as 18 percent. Asari authorities based on
  Illium opened an investigation and uncovered mass graves around the facility holding
  the remains of several hundred recruits, with burials dating back roughly two
  decades. The camp was immediately closed and the recovered remains were repatriated
  to the recruits' homeworlds.

  A Blue Suns internal inquest concluded that the batarian commandos had used harsh
  training methods but that these were consistent with the SIU's own training regime.
  The batarians were exonerated and reassigned to other Blue Suns units, while Kal'thor
  stayed permanently shut down. No criminal or civil charges were filed: Council law
  did not extend into the Crescent Nebula, and the asari on Illium judged the Blue
  Suns' self-policing to have satisfied the due-diligence requirement for corporate
  justice in Terminus space. The episode became a stock example of the limits of
  Citadel jurisdiction and of mercenary corporations policing themselves. Decades
  later, during the Reaper War, Commander Shepard could survey Xetic for mineral
  deposits after completing the Leviathan mission strand.
characters: []
consequences:
  - Kal'thor Camp is permanently closed after the recruit death toll is exposed
  - Asari investigators recover the remains of several hundred dead recruits from mass graves and return them to their homeworlds
  - A Blue Suns inquest clears the batarian SIU-trained instructors of wrongdoing and reassigns them to other units
  - No criminal or civil charges are brought, as the Crescent Nebula lies outside Council law and the Blue Suns' self-investigation is accepted as sufficient
  - The case becomes a cited precedent for the weakness of corporate accountability in the Terminus Systems
