event_id: find-liara-t-soni
title: Find Liara T'Soni
game: Mass Effect
chronological_order: 570
date: "2183 CE"
summary: |
  After receiving Spectre status and command of the Normandy, Commander Shepard is
  told that Saren Arterius is hunting Dr. Liara T'Soni, an asari archaeologist famed
  for her Prothean expertise and the daughter of Matriarch Benezia, one of Saren's
  chief lieutenants. Anderson advises checking worlds with Prothean ruins in the
  Artemis Tau cluster, leading Shepard to Therum in the Knossos system, a volcanically
  active mining world where the Mako cannot survive contact with the lava flows.
  The mission was written by Chris L'Etoile.

  Shepard fights through geth deployed by dropships: Armatures, defense turrets around
  a refinery outpost, Destroyers, a Juggernaut, and finally a Geth Colossus blocking
  the road to the ruins. Outside the excavated Prothean structure a dropship lands
  snipers, shock troopers, Hoppers and an Armature; the ruin entrance stays sealed
  until the area is nearly cleared. Descending by elevators and damaged platforms,
  Shepard finds Liara suspended inside a Prothean security barrier she accidentally
  triggered while hiding from the geth. She directs Shepard to fire a nearby mining
  laser to bore a tunnel past the barrier curtains, and a central console raises an
  elevator to free her. Her rescue sets off a seismic tremor and the ruins begin to
  collapse; on the top level Shepard survives a stand-off against geth and a Krogan
  Battlemaster before escaping to the waiting Normandy.

  Aboard ship, Liara shares her research, including her theory of a recurring cycle of
  galactic extinctions with the Protheans only the most recent civilisation to vanish.
  Shepard connects this to the Reapers and the Eden Prime beacon vision. Liara joins
  the crew, treating the Normandy as a refuge from Saren and offering her Prothean
  knowledge to help interpret the vision. If the mission is delayed until after
  Virmire, Liara believes Shepard is a hallucination until physically freed and reacts
  with grief as the squad's discoveries overturn her decades of research.
characters:
  - Commander Shepard
  - Liara T'Soni
  - Saren Arterius
  - Matriarch Benezia
  - Kaidan Alenko
  - Ashley Williams
consequences:
  - Liara T'Soni is freed from the Prothean security barrier and joins the Normandy crew
  - The Prothean ruins on Therum collapse after the mining-laser rescue
  - Liara's theory of cyclical galactic extinctions is linked to the Reapers and the beacon vision
  - Shepard gains an expert to help decode the Eden Prime vision
  - Recruiting Liara early unlocks unique interactions on Noveria and a romance option
