event_id: unc-geth-incursions
title: "UNC: Geth Incursions"
game: Mass Effect
chronological_order: 670
date: "2183 CE"
summary: |
  After taking command of the Normandy, Commander Shepard is alerted by Admiral
  Hackett to a build-up of geth outposts in the Armstrong Nebula of the Skyllian
  Verge. The same intelligence can be gathered from geth terminals decrypted at the
  ExoGeni building on Feros or in the genophage labs on Virmire, which reveal that
  the geth are massing a force in the cluster on Saren Arterius's orders, away from
  "prying eyes," ahead of what could grow into a full-scale invasion of the region.

  Shepard destroys four fortified geth outposts, one each on Maji (Vamshi system),
  Casbin (Hong system), Antibaar (Tereshkova system) and Rayingri (Gagarin system).
  Each is defended by Geth Snipers, Rocket Troopers, Armatures and Colossi, with
  dropships landing Geth Primes, Shock Troopers and Destroyers as reinforcements;
  the Rayingri site is an underground research facility infested with husks that can
  open doors. With the four outposts gone, Shepard's squad traces an outgoing signal
  to the true command base: an underground installation on Solcrum, a moon of
  Notanban in the Grissom system, garrisoned by elite geth including a Juggernaut,
  Destroyers and Hopper units. A terminal there has been broadcasting a recorded
  quarian lament toward the geth homeworlds beyond the Perseus Veil.

  Shepard can hack a data terminal for geth intelligence files and pass them to
  Tali'Zorah in the Normandy's engineering bay, material that informs later
  decisions about the geth and quarians. Hackett sends congratulations and pledges
  an Alliance investigation into the incursions.
characters:
  - Commander Shepard
  - Hackett
  - Saren Arterius
  - Tali'Zorah
consequences:
  - Four geth staging outposts in the Armstrong Nebula destroyed before they can mount a regional invasion
  - The geth command base on Solcrum destroyed
  - Confirms the Armstrong Nebula geth build-up was ordered by Saren
  - Geth data files recovered and handed to Tali'Zorah, informing later geth and quarian decisions
  - Hackett opens an Alliance investigation into the geth incursions
