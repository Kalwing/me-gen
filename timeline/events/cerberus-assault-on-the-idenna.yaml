consequences:
  - The Idenna scout ship Cyniad is ambushed and its pilot Hilo'Jaa captured at Shelba
  - Cerberus boards the liveship Idenna and kills many of its crew
  - The Idenna security detail sent to meet the returning Cyniad, including the young quarian Seeto'Hodda nar Idenna, is wiped out in the opening moments of the boarding
  - Golo is killed by Paul Grayson
  - Paul Grayson defects from Cerberus over his daughter's treatment
  - Gillian Grayson and Hendel Mitra join the Migrant Fleet permanently
  - Cerberus fails to secure the Migrant Fleet's codes or recover Gillian
  - The Admiralty Board approves Captain Ysin'Mal's homeworld-search policy and picks the Idenna as one of the first ships to leave the Flotilla, refitted for a five-year independent mission with a skeleton crew of about fifty
