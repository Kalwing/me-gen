event_id: cerberus-assault-on-the-idenna
title: Cerberus Assault on the Idenna
game: Mass Effect
chronological_order: 830
date: "2183 CE"
summary: |
  The Idenna was a thirty-year-old decommissioned batarian Hensa-class cruiser of the
  quarian Migrant Fleet, crewed by nearly 700 and commanding scout vessels including
  the Bavea and the Cyniad. Her captain, Ysin'Mal vas Idenna, was regarded as a
  maverick and visionary who wanted to use Fleet ships to search for new homeworlds.

  Golo, once Golo'Mekk vas Usela, was a quarian exiled from the Migrant Fleet after
  he made a deal circa 2173 CE to sell two dozen pre-Pilgrimage "pure" quarians to
  the Collectors for technology. He settled on Omega and became a contact for
  Cerberus. In 2183, with the Illusive Man seeking the Migrant Fleet's codes to
  monitor its movements and communications, Golo promised Pel he could obtain them.
  He lured the Idenna scout ship Cyniad to the planet Shelba by claiming to have
  vital technology to sell; Feda'Gazu vas Idenna agreed to the meeting, but Cerberus
  forces ambushed the quarians. Golo helped capture the Cyniad's pilot Hilo'Jaa vas
  Idenna and, enraged when Hilo cursed him by his discarded names, smashed Hilo's
  faceplate, after which Hilo contracted a virulent disease that hampered Pel's
  interrogation.

  After Lemm'Shal nar Tesleya escaped to the Migrant Fleet with Kahlee Sanders,
  Hendel Mitra, and Gillian Grayson, and the Idenna took them in as refuge, the
  Illusive Man hired Golo to get a Cerberus team aboard the Flotilla using his
  knowledge of Fleet protocol. Motivated by credits and revenge on those who had
  exiled him, Golo traveled to the Fleet aboard the stolen Cyniad alongside Paul
  Grayson, boarded the Idenna using Hilo's code phrases, and launched a surprise
  assault that killed many of the liveship's crew with Cerberus weapons. Golo caught
  Kahlee Sanders trying to rescue Gillian and beat her while Grayson watched.
  Grayson, who had turned against Cerberus for his daughter's sake and had always
  despised Golo, warned him to stop; as Golo turned to leave, Grayson shot him in the
  head. Kahlee then convinced Grayson that Cerberus was poisoning Gillian into a
  weapon, and he agreed to let her remain on the Flotilla with Hendel Mitra.

  In the wake of the attack the Admiralty Board finally accepted Captain Mal's policy
  and chose the Idenna as one of the first ships to leave the Flotilla to search for a
  new quarian homeworld. Her crew was cut to around fifty and she was extensively
  refitted to survive five years without outside contact; Gillian Grayson and Hendel
  Mitra were among those chosen to accompany her.
