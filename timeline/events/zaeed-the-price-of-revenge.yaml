event_id: zaeed-the-price-of-revenge
title: "Zaeed: The Price of Revenge - Hunting Vido Santiago on Zorya"
game: Mass Effect 2
chronological_order: 1210
date: "2185 CE"
summary: >
  After joining Commander Shepard's team on Omega, the mercenary Zaeed Massani
  revealed that he still held an active Eldfell-Ashland Energy contract predating
  his deal with Cerberus: to retake a refinery on Zorya, in the Faia system, that
  the Blue Suns had seized and were working with slave labour. Zaeed's true
  motive, however, was personal. Roughly twenty years earlier he and Vido
  Santiago had co-founded the Blue Suns; they fell out over Vido's plan to hire
  cheap batarian labour, and Vido paid six of their men to hold Zaeed down while
  he shot him point-blank in the head, leaving him for dead and taking sole
  control of the company. Vido had since installed the batarian Solem Dal'serah
  as figurehead leader and ran the Suns from the shadows as "Co-Executive
  Officer." Learning Vido was inside the Zorya refinery, Zaeed abandoned the
  liberation plan and went after him.
  Shepard and Zaeed fought through Blue Suns jungle patrols and pyro- and
  shotgun-armed troopers to the refinery, where Vido taunted Zaeed from behind a
  cordon of guards before slipping away. Zaeed shot open a compressed-gas pipe
  and smashed a valve, starting a fire that swept the facility with the workers
  still trapped inside. Shepard was forced to choose: extinguish the fires and
  save the workers, letting Vido escape by gunship, or pursue Vido and leave the
  workers to burn. If the workers were saved, Zaeed was enraged and his loyalty
  could only be secured through a difficult persuasion; a Paragon interrupt let
  Shepard punch Zaeed for endangering civilians. If Vido was pursued, Zaeed shot
  him in the leg and burned him alive by ejecting a heat sink into a pool of
  fuel, and his loyalty was secured outright. The mission also explained Zaeed's
  Blue Suns neck tattoo and the surgically reconstructed right side of his face.
characters:
  - Commander Shepard
  - Zaeed Massani
  - Vido Santiago
  - Solem Dal'serah
consequences:
  - Shepard must choose between saving the trapped Zorya refinery workers and pursuing Vido Santiago
  - If the workers are saved, Vido escapes by gunship and Zaeed's loyalty is only won through difficult persuasion
  - If Vido is pursued, Zaeed kills him by burning him alive and his loyalty is secured
  - Zaeed's backstory - Vido's betrayal and near-fatal point-blank shooting twenty years earlier - is revealed
  - The Zorya Blue Suns operation is broken up during the fighting
  - Zaeed's loyalty (or lack of it) affects his survival in the Suicide Mission
