event_id: arrae-ex-cerberus-scientists-rescue
title: 'Arrae: Ex-Cerberus Scientists Rescue'
game: Mass Effect 3
chronological_order: 1740
date: 2186 CE
summary: 'In 2186, following the Cerberus assault on the Citadel, Specialist Samantha
  Traynor reports to Commander Shepard about a group of ex-Cerberus scientists who
  have gone into hiding on the planet Gellix in the Arrae system. These scientists,
  led by Dr. Brynn Cole, had defected from Cerberus after becoming disillusioned with
  the Illusive Man''s unethical experiments and research practices. Cole had used
  her position within Cerberus to help dozens of scientists and their families flee
  the organization.


  When the Alliance learns of their location, Cerberus launches an assault on the
  facility where the scientists are sheltering. Shepard is sent to rescue them before
  Cerberus can recapture or eliminate them. Upon landing at the facility already under
  siege, Shepard discovers that Jacob Taylor, if he survived the suicide mission in
  Mass Effect 2, is present and wounded in the firefight. Dr. Cole is initially distrustful
  of Shepard due to the Commander''s past connection to Cerberus, but eventually agrees
  to cooperate. The scientists mention they brought their families with them, complicating
  the evacuation.


  Shepard learns that the facility''s anti-aircraft emplacements are offline due to
  the Cerberus assault. The Commander works to restore satellite telemetry and reactivate
  the AA guns across the facility, engaging waves of Cerberus forces including Assault
  Troopers, Combat Engineers, Phantoms, and an Atlas Mech. Dr. Gavin Archer, formerly
  of Project Overlord, is found sheltering at the facility; speaking with him can
  yield additional war assets depending on prior decisions regarding his brother David
  and the fate of the geth.


  During the evacuation, a Cerberus fighter crashes into one of the AA guns, breaching
  the base''s defenses and forcing Cerberus troops to breach through the skylights.
  Shepard fights through the final assault as Jacob or Dr. Cole pilots an extraction
  shuttle. Jacob survives the mission regardless of his prior loyalty status. With
  the scientists evacuated, they join the effort to construct the Crucible, contributing
  their knowledge of Collector technology and other advanced research to the war effort
  against the Reapers.

  '
characters:
- Commander Shepard
- Dr. Brynn Cole
- Jacob Taylor
- the Illusive Man
- Dr. Gavin Archer
- Samantha Traynor
- Admiral Steven Hackett
- Liara T'Soni
- Cerberus forces
- Dr. David Archer (mentioned)
- Cerberus scientists and their families
consequences:
- Dr. Brynn Cole and ex-Cerberus scientists successfully rescued
- Ex-Cerberus Scientists added as War Asset (Military Strength +25)
- Dr. Brynn Cole added as War Asset (Military Strength +25)
- Jacob Taylor remains loyal and gains War Asset status if he survived ME2 (Military
  Strength +25)
- Dr. Gavin Archer conditionally gains War Asset status depending on prior Project
  Overlord decisions
- Scientists contribute to Crucible construction
- Jacob begins relationship with Dr. Cole; they later have a child together
- Alliance gains crucial knowledge of Cerberus research and operations
- Demonstrates that even Cerberus operatives can defect and support the war effort
