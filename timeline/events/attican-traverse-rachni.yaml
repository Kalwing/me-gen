event_id: attican-traverse-rachni
title: "Attican Traverse: The Rachni Breeding Operation"
game: Mass Effect 3
chronological_order: 1770
date: "2186 CE"
summary: |
  Commander Shepard and the Normandy crew investigate a distress call from the Attican Traverse. A krogan scouting team has gone missing while investigating rumors of activity at a rachni relay beyond Udina's position. The Urdnot clan leader—either Urdnot Wrex or Urdnot Wreav—reports the disappearance, and Shepard travels to the planet Utukku in the Mulla Xul system of the Ninmah Cluster to investigate.

  Upon arrival, Shepard encounters Aralakh Company, an elite krogan unit. If Grunt survived the suicide mission in Mass Effect 2 and was freed from his tank, he leads Aralakh Company; otherwise, Urdnot Dagg commands the unit. The team descends into tunnels beneath Utukku's surface and discovers the horrifying truth: the Reapers have established a massive rachni breeding operation on the planet. The bodies of krogan scouts litter the tunnels, and the facility is overrun with Reaper-corrupted rachni—Ravagers, Swarmers, and other bioengineered horrors.

  If the original Rachni Queen from Noveria was spared in Mass Effect 1, the Reapers captured her and now hold her prisoner deep within the facility, forcing her to breed an army of mutated rachni. She has proven resistant to Reaper indoctrination, which is why the Reapers use physical restraints. If the Queen was killed in ME1, the Reapers constructed an artificial "Breeder" queen to serve the same purpose. At the central chamber, Shepard confronts the rachni leader and must make a critical choice: rescue her and provide her support for the war effort, or leave her to die.

  Per `grunt_fate`: If Shepard chooses to save the original Queen or the Breeder, Aralakh Company stages a suicidal holding action against waves of Ravagers. If Grunt leads the company and survived the suicide mission with loyalty gained, he alone survives the onslaught with severe injuries; otherwise, Aralakh Company is completely wiped out. In the Legendary Edition, saving the rachni results in Aralakh Company not being acquired as a war asset at all. If Shepard leaves the rachni to die, Grunt or Dagg gives the order to retreat immediately, and Aralakh Company escapes intact, gaining 25 war asset points.

  Regardless of the choice, Grunt or Dagg breaks through a wall in the cavern and holds off Reaper-modified rachni to cover Shepard's squad's escape to the shuttle.
characters:
  - Commander Shepard
  - Grunt (or Urdnot Dagg)
  - Urdnot Wrex (or Urdnot Wreav)
  - Aralakh Company
  - Original Rachni Queen (or Breeder)
  - Reaper forces
  - Ravagers, Swarmers, and other Reaper-corrupted rachni
consequences:
  - Reaper rachni breeding operation discovered on Utukku
  - Krogan scouting teams confirmed dead
  - Rachni Queen/Breeder fate depends on player choice (per `grunt_fate`)
  - If Queen/Breeder saved:
    - Aralakh Company sacrifices itself to hold off Ravagers
    - Grunt survives if loyal to Shepard (severe injuries); otherwise entire company dies
    - Rachni workers acquired as war asset (or no Aralakh asset in Legendary Edition)
    - Queen/Breeder provides military support
    - Breeder later betrays Alliance if original Queen was killed
  - If Queen/Breeder abandoned:
    - Aralakh Company survives intact (25 war asset points)
    - Grunt or Dagg escapes with only minor injuries
    - Rachni Queen/Breeder accepts her fate or rages at abandonment
    - No rachni workers as war asset
  - Either way, Shepherd's squad escapes Utukku with critical intelligence
  - Grunt or Dagg reports mission success to clan leadership
