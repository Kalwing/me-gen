event_id: derelict-reaper-iff-mission
title: "Reaper IFF: Boarding the Derelict Reaper"
game: Mass Effect 2
chronological_order: 1280
date: "2185 CE"
summary: |
  The Derelict Reaper was a two-kilometre Reaper found orbiting the failed star
  Mnemosyne in the Thorne system of the Hawking Eta cluster. Roughly 37 million years
  earlier an unknown spacefaring race had fired a mass accelerator round of extraordinary
  power that struck and disabled the Reaper; the round continued on and hit the planet
  Klendagon, carving its Great Rift Valley - likely that race's last act before their
  extinction. Despite massive hull damage the Reaper kept a weak mass effect field so it
  would not fall into the star, and its indoctrination field remained active. Cerberus
  discovered it and sent a research team under Dr. Chandana; the team was indoctrinated
  and turned into husks.

  The Illusive Man sent Commander Shepard to investigate the loss of contact and to
  recover the Reaper's Identify Friend/Foe (IFF) unit, which was needed to survive
  transit of the Omega 4 Relay. When Shepard's squad boarded, the ship's kinetic
  barriers engaged and trapped them, so they had to destroy the ship's mass effect core
  to escape. Fighting through husks, the squad retrieved the IFF and reached the core,
  where they found a single disabled geth that had been overwhelmed by husks. Shepard
  could recover the geth or leave it. Shepard destroyed the core and escaped by shuttle
  just before the Reaper fell into Mnemosyne's atmosphere and was destroyed.

  Back on the Normandy, EDI installed the IFF, which carried a Reaper signal that let her
  assume full control of the ship. Shortly afterward Joker sent a distress call; how long
  Shepard delayed before returning to the Normandy (per `iff_delay`) determined whether
  the non-combat crew, including Dr. Chakwas, were carried off by the Collectors or
  rescued.
characters:
  - Commander Shepard
  - The Illusive Man
  - EDI
  - Dr. Chandana
  - Legion
  - Jeff "Joker" Moreau
consequences:
  - Reaper IFF recovered, enabling safe transit of the Omega 4 Relay
  - Dr. Chandana's Cerberus research team confirmed dead, converted into husks
  - A disabled geth is recovered (later activated as the squadmate Legion) if not destroyed
  - Installing the IFF lets EDI take full control of the Normandy SR-2
  - Per `iff_delay`: delaying after Joker's distress call lets the Collectors abduct the Normandy's crew and Dr. Chakwas; a prompt return saves them
  - The Derelict Reaper is destroyed, falling into Mnemosyne
  - Confirms that a pre-Prothean race once fought and crippled a Reaper (the Klendagon Great Rift Valley)
