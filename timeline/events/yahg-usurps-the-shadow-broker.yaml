event_id: yahg-usurps-the-shadow-broker
title: A Yahg Kills and Replaces the Shadow Broker
game: Mass Effect 2
chronological_order: 110
date: "approx. 2125 CE"
summary: |
  After Citadel Council surveyors discovered the yahg homeworld Parnack in 2125 CE, a
  Council delegation attempted to open diplomatic relations. The yahg, an apex-predator
  species that reads other beings as either dominant or subordinate, took the
  ambassadors' treatment of them as equals for contempt and massacred the entire
  delegation. The Council severed contact and declared Parnack permanently off-limits,
  judging the yahg too obsessed with control to join galactic society.

  Sometime after this first contact, the original Shadow Broker sent agents to abduct a
  yahg for study. Several yahg had to be killed before the agents found one willing to
  leave the planet. The captive proved extraordinarily intelligent and adaptable,
  learning at a rate comparable to the much shorter-lived salarians. With the Broker's
  backing the yahg was covertly slipped into the place of one of the organization's
  operatives and put in charge of strike teams that gathered intelligence and
  eliminated threats. His violent nature quickly became a liability, and the Shadow
  Broker ordered him killed. Instead, the yahg killed the Shadow Broker in the middle
  of a transmission, immediately assumed the role himself, and rescinded the execution
  order. None of the organization's agents realized the leadership had changed. The
  yahg ran the Shadow Broker network for roughly the next six decades from an aging
  ship that rode the storms of Hagalaz, building a fearsome reputation as agents who
  entered his office often never came out. Having secretly learned of the Reapers and
  the true nature of the Collectors, he later dealt with the Collectors in a bid for
  his own survival, including accepting their contract to recover Commander Shepard's
  body in 2183. His true identity as a yahg imposter was not exposed until 2185, when
  Liara T'Soni and Commander Shepard raided the Hagalaz base.
characters:
  - The Shadow Broker
  - Liara T'Soni
  - Feron
  - Commander Shepard
consequences:
  - The original Shadow Broker is killed and secretly replaced by an abducted yahg
  - The yahg runs the Shadow Broker organization for roughly six decades without his agents knowing of the change
  - The Broker's ship and network predate the 2125 discovery of the yahg, a clue that later exposes the imposter
  - The yahg Broker's knowledge of the Reapers leads him to bargain with the Collectors, including retrieving Shepard's corpse
  - Sets up the 2185 Lair of the Shadow Broker confrontation on Hagalaz
