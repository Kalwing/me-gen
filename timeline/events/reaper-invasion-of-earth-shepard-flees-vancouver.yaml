event_id: reaper-invasion-of-earth-shepard-flees-vancouver
title: "Reaper Invasion of Earth - Shepard Flees Vancouver"
game: Mass Effect 3
chronological_order: 1460
date: "2186 CE"
summary: |
  Roughly six months after the destruction of the Bahak system's mass relay and
  Commander Shepard's voluntary return to Alliance custody, Shepard was relieved of
  command and detained at a Systems Alliance facility in Vancouver on Earth, guarded
  by Lieutenant James Vega. As Alliance deep-space outposts beyond Sol began going
  dark without warning, Admiral Steven Hackett prepared for an imminent attack and
  Admiral David Anderson travelled to Vancouver to escort Shepard before an Alliance
  defence committee. Shepard confirmed the committee's worst fear: the Reapers had
  returned and were coming for Earth. During the hearing contact was lost with Luna
  Base and reports arrived of an unknown alien force landing in Earth's cities - the
  Reapers had already arrived.

  A Reaper capital ship descended through the clouds over Vancouver and fired on the
  Alliance building, killing the defence committee and most of the staff. Shepard and
  Anderson survived and fought on foot through the ruined city during the mission
  Prologue: Earth, contacting the Virmire survivor (Ashley Williams or Kaidan Alenko)
  by radio and ordering them to reach the Normandy. Anderson armed Shepard with an
  M-3 Predator; the pair crossed rooftops and rubble under fire from Oculi, husks and
  Cannibals while Reapers destroyed Alliance fighters and warships overhead. Anderson
  told Shepard they had to reach the Citadel and secure the Council's help. Reaching a
  comm unit by a crashed gunship, they hailed the Normandy SR-2, which bombed the area
  clear and set down to evacuate.

  Anderson refused to board, choosing to stay on Earth and lead the human resistance;
  he handed Shepard back the Commander's dog tags and charged Shepard with rallying
  the galaxy's forces. As the Normandy lifted away over burning human fleets, Shepard
  watched a child who had earlier been glimpsed hiding board an evacuation shuttle;
  the Kodiak was then shot down by a Reaper Destroyer, killing the boy - an image that
  recurred in Shepard's nightmares for the rest of the war. Aboard ship, James Vega
  protested leaving Earth, but Admiral Hackett contacted Shepard and assigned the next
  objective, Priority: Mars.
characters:
  - Commander Shepard
  - David Anderson
  - James Vega
  - Steven Hackett
  - Ashley Williams
  - Kaidan Alenko
  - Joker
  - The Child
consequences:
  - The Reapers begin their invasion of Earth, destroying the Alliance defence committee and devastating Vancouver
  - Shepard is restored to command of the Normandy SR-2 and leaves Earth to seek allies against the Reapers
  - Anderson stays behind to lead the human resistance on Earth and returns Shepard's dog tags
  - "Per `virmire_survivor`: Ashley Williams or Kaidan Alenko rejoins the Normandy crew"
  - The child Shepard fails to save is killed when his evacuation shuttle is shot down, haunting Shepard's dreams
  - Hackett directs Shepard to the Mars Archives (Priority: Mars) to begin the search for a way to stop the Reapers
