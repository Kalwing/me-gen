event_id: unc-rogue-vi-luna
title: "UNC: Rogue VI on Luna"
game: Mass Effect
chronological_order: 680
date: "2183 CE"
summary: |
  A virtual intelligence running an Alliance combat training ground on Luna, Earth's
  moon, stops responding to shutdown commands and seizes control of the facility,
  turning its automated defenses against Alliance personnel. Admiral Hackett
  contacts Commander Shepard to disable the VI and reclaim the site, an operation
  that opens the Local Cluster and Sol system to the Normandy.
  On the lunar surface Shepard's squad fights through the training ground's turret
  emplacements and waves of Alliance combat drones, which the runaway VI directs
  from three underground bunkers. Tech skills such as Sabotage, Overload and AI
  Hacking are effective against the synthetic drones. In each bunker Shepard
  destroys a data core; with all three down, the VI's central conduit is exposed and
  destroyed, shutting the intelligence down for good. The mission closes with a text
  transcript of the VI's final moments as it degrades.
  Points of interest around the operational zone, in the southern part of Mare
  Crisium, include the wreck of the old Soviet probe CCCP Luna 23 and, at one spot,
  the faint sound of the rachni song. Two unmarked clusters of Alliance heavy
  turrets remain active even after the assignment is complete. Completing the
  mission also unlocks Shepard's specialization class. The rogue Luna VI is later
  referenced in Cerberus video-logs examined at Cronos Station during the third
  war against the Reapers.
characters:
  - Commander Shepard
  - Admiral Hackett
  - EDI
consequences:
  - The runaway training VI is destroyed and the Luna facility reclaimed by the Alliance
  - The Local Cluster and Sol system become accessible to the Normandy
  - Shepard gains access to a specialization class
  - Cerberus later cites the incident in research logs stored at Cronos Station
