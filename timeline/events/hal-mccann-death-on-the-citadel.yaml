event_id: hal-mccann-death-on-the-citadel
title: "Hal McCann's Flight and Death on the Citadel"
game: Mass Effect
chronological_order: 940
date: "approx. 2185 CE"
summary: |
  Events drawn from the first edition of Mass Effect: Deception, the fourth
  trilogy-era novel (written by William C. Dietz), which BioWare acknowledged
  contains lore discrepancies. The novel follows Admiral David Anderson and
  Kahlee Sanders as they search for a way to break the Reaper cycle, uncover
  proof the Reaper threat is real, and in doing so expose Cerberus and the
  Illusive Man; Gillian Grayson, a freed biotic prodigy once experimented on by
  Cerberus, becomes their unlikely ally and swears vengeance on the Illusive Man
  after learning Cerberus caused her father's death.

  Hal McCann was a loyal Cerberus operative who had served aboard the hidden
  space station where the Illusive Man conducted Reaper-technology experiments on
  Paul Grayson. When a turian strike force attacked and destroyed the station,
  McCann survived by playing dead until the turians carried him off with the
  other corpses to their ship. He then killed both pilots, flew the vessel to
  Omega and sold it, intending to use the money to re-establish contact with
  Cerberus. Instead he gambled away his funds and his freedom and was sold to
  batarian slavers.

  When the batarian slave ship Glory of Khar'shan failed in an attack on the
  quarian vessel Idenna and was captured, McCann was freed and fell in with
  Gillian Grayson and her guardian Hendel Mitra. Hiding his Cerberus ties, he
  told Gillian that her father Paul Grayson was dead and persuaded her to seek
  answers on the Citadel, which was also his own destination. On arrival, Hendel
  and Gillian brought McCann to David Anderson and Kahlee Sanders' apartment,
  then under surveillance by the Cerberus assassin Kai Leng. Leng recognized
  McCann and Gillian and reported to the Illusive Man, who ordered both killed
  before they could expose Cerberus. Knowing McCann was a compulsive gambler,
  Leng searched the Citadel's clubs and cornered him. They fought, and McCann,
  aided by Leng's earlier injuries, got the upper hand but stayed to gloat
  instead of finishing him or fleeing. Leng stabbed McCann through the foot and
  then crushed his neck with a baton, leaving the body in a bathroom stall.
characters:
  - Hal McCann
  - Kai Leng
  - The Illusive Man
  - Gillian Grayson
  - Hendel Mitra
  - David Anderson
  - Kahlee Sanders
  - Paul Grayson
consequences:
  - Hal McCann is killed by Kai Leng on the Citadel
  - Kai Leng confirms to the Illusive Man that Gillian Grayson has surfaced and is targeted for death
  - Gillian Grayson learns from McCann, falsely at first, that her father is dead and is drawn to the Citadel
  - Anderson and Sanders' apartment is exposed as a Cerberus surveillance target
  - Anderson and Sanders' investigation exposes Cerberus's knowledge of the Reaper threat
