event_id: destruction-of-the-ssv-iwo-jima
title: Destruction of the SSV Iwo Jima at Camala
game: Mass Effect
chronological_order: 230
date: "2165 CE"
summary: |
  As recounted in the novel Mass Effect: Revelation, the Systems Alliance frigate SSV
  Iwo Jima was dispatched to the batarian colony of Camala in 2165 to secretly evacuate
  Alliance scientist Kahlee Sanders, a survivor of the attack on the Sidon research
  station who was being hunted by parties trying to bury the conspiracy behind it.
  Sanders was moved across Camala in an armoured personnel carrier escorted by Alliance
  marines, with a rendezvous planned to get her off-world.

  The krogan bounty hunter Skarr, working for the batarian financier Edan Had'dah and
  acting on a tip-off deliberately planted by the turian Spectre Saren Arterius,
  intercepted the convoy only minutes before the rendezvous. Skarr and a team of Blue
  Suns mercenaries ambushed the APC with fast attack rovers; the escort vehicle was
  overrun, crashed into one of the rovers, and overturned, forcing Sanders and the
  marines to abandon it and take cover behind the wreck. As a Blue Suns rover moved to
  flank them, the Iwo Jima arrived and used her GARDIAN defense lasers to destroy one
  rover. Because her kinetic barriers had been lowered so she could descend to the
  surface and recover the shore party, she was defenceless when Skarr opened fire at
  point-blank range with a portable mass accelerator cannon, hurling hundreds of
  explosive hypervelocity rounds into her. Shrapnel punctured the hull and shredded the
  crew inside. The Iwo Jima careened out of control, crashed on Camala's surface, and
  was destroyed on impact.

  With the frigate down, Skarr captured Kahlee Sanders and took her to the element zero
  refinery on Camala that Had'dah was using as a hideout, staying close to prevent her
  escape. The capture set up the climactic confrontation of Revelation, in which David
  Anderson and Saren Arterius assaulted the refinery: Had'dah and Dr. Shu Qian were
  killed, Sanders was freed, and Skarr, badly wounded in the attack, was injured by
  Sanders and then killed by Anderson with a point-blank shot to the head.
characters:
  - Kahlee Sanders
  - Skarr
  - David Anderson
  - Saren Arterius
  - Edan Had'dah
consequences:
  - The SSV Iwo Jima is destroyed with heavy loss of her crew
  - The covert evacuation of Kahlee Sanders fails and she is captured by Skarr
  - Sanders is taken to Edan Had'dah's element zero refinery hideout on Camala
  - The capture leads directly to Anderson and Saren's assault on the refinery and the deaths of Had'dah, Shu Qian and Skarr
