event_id: mordin-recruitment-omega
title: "Dossier: The Professor - Mordin Solus Recruitment"
game: Mass Effect 2
chronological_order: 1090
date: "2185 CE"
summary: |
  Dr. Mordin Solus, a brilliant and eccentric salarian scientist with a background in the Special Tasks Group—the Salarian Union's elite covert operations unit—has deserted his post and established a makeshift medical clinic in the slums of Omega. His expertise in biological weapons, combined with his moral awakening, makes him a crucial asset for Commander Shepard's mission against the Collectors. Mordin is currently dealing with a devastating plague outbreak that has swept through the Omega slums, affecting every known species except humans and vorcha—a selective pathogen suggesting artificial origin.

  When Shepard arrives at the quarantined district, EDI warns that the plague has forced a lockdown. Blue Suns and Blood Pack mercenaries vie for control as the epidemic spreads. Shepard must navigate past the turian guard controlling the quarantine checkpoint and enter the plague-struck district. Inside, vorcha and other infected creatures attack indiscriminately. Mordin's clinic stands as a beacon of hope in the chaos, staffed by medical personnel treating the afflicted.

  Upon meeting Shepard, Mordin deduces the Commander's Cerberus connections with brilliant deduction and reveals that he has already synthesized a cure for the plague. However, he cannot distribute it without access to the district's air-control system, which the Blood Pack vorcha have seized. Mordin requests that Shepard secure the Environmental Control facility, restore the ventilation fans, and disperse the cure throughout the district. He also asks that his assistant Daniel, who ventured into vorcha territory, be rescued alive if possible.

  Shepard fights through more Blood Pack forces and vorcha under Collector influence to reach Environmental Control. After restoring both ventilation fans and distributing Mordin's cure, the salarian scientist is satisfied with Shepard's capabilities and agrees to join the crew. He joins the Normandy SR-2 and immediately establishes the ship's technology laboratory—a critical facility for researching and upgrading weapons and armor. If Daniel survived, he sends a grateful email reporting the clinic's recovery. Mordin becomes an essential technical expert and biologist, providing crucial insights into the Collector threat and serving as a powerful asset in the suicide mission.
characters:
  - Dr. Mordin Solus
  - Commander Shepard
  - Daniel (Mordin's assistant)
  - Blood Pack forces
  - Blue Suns mercenaries
  - Aria T'Loak
consequences:
  - Mordin Solus is recruited to Shepard's team
  - Plague cure is synthesized and distributed to the Omega slums
  - Environmental Control facility is secured from Blood Pack
  - Blood Pack vorcha are defeated and driven from the district
  - Daniel either survives and recovers or is presumed dead
  - Mordin establishes the Normandy's technology laboratory
  - The Omega plague outbreak is contained and cured
  - Mordin becomes critical for weapon and armor upgrades
  - Mordin provides expert analysis on Collector biotech
  - Mordin becomes available for the suicide mission
