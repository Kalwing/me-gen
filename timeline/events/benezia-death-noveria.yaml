  - The Mu Relay coordinates are obtained from Benezia
  - Binary Helix's rachni breeding project on Noveria is discovered
  - Shepard gains critical information about the location of the lost Mu Relay
  - The Queen's genetic memory is partially stripped by Benezia's biotic techniques
  - Benezia's sacrifice reveals the horror and mechanism of indoctrination
  - Liara learns of her mother's death and the true nature of her indoctrination
  - The Rachni Queen's fate depends on player choice (per `rachni_queen`)
