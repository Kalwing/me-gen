event_id: benezia-death-noveria
title: "Matriarch Benezia's Death on Noveria Peak 15"
game: Mass Effect
chronological_order: 750
date: "2183 CE"
summary: |
  On Noveria, Commander Shepard pursues Matriarch Benezia, a powerful asari and advisor to Saren Arterius, to the remote Peak 15 facility. Benezia had traveled there on behalf of Saren to investigate Binary Helix's secret project: breeding rachni from a newly discovered egg to form an army. When the rachni escape from captivity due to their psychological need to remain near their queen, Benezia journeys to the lab to extract genetic knowledge of the Mu Relay's location from the Rachni Queen's mind using her formidable biotic abilities.

  Shepard battles through geth forces, escaped rachni, asari commandos, and Benezia's agents (including Alestia Iallis and Captain Ventralis) to reach the secure lab. There, Shepard confronts Benezia beside the Rachni Queen's containment tank. Though Benezia has been enslaved to Saren's will through indoctrination by the Reaper Sovereign, she maintains a hidden sanctuary in her mind through sheer mental strength. In the final moments of the battle, Benezia breaks free of indoctrination's control, describing the horror of being trapped in her own mind while being forced to commit atrocities: "beating upon the glass as your hands torture and murder." She provides the coordinates to the Mu Relay and warns Shepard of Sovereign's incredible power. Before fully succumbing to reindoctrination, Benezia tells her daughter Liara that she has always made her proud. She then turns on Shepard and the squad, forcing them to kill her. As Benezia dies, she claims not to see the light promised in asari religion, suggesting her despair at what indoctrination has made her become.

  The player must then decide the fate of the Rachni Queen, whose mind had been partially stripped of the Mu Relay coordinates by Benezia's biotic extraction.
