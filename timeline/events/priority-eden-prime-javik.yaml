event_id: priority-eden-prime-javik
title: "Priority: Eden Prime and the Resistance Movement"
game: Mass Effect 3
chronological_order: 1680
date: "2186 CE"
summary: >
  In 2186, during the Reaper War, Cerberus occupied the Alliance colony of Eden
  Prime after discovering an intact Prothean stasis pod buried in a bunker complex
  that had sheltered Protheans 50,000 years earlier. Cerberus abducted able-bodied
  colonists under the cover story that they were doing safe manual labour at a
  research camp, using increased food rations to quiet complaints, while it
  researched how to open the pod. A local resistance movement formed to fight the
  occupation. Alerted by Liara T'Soni to the archaeological find, Commander Shepard
  landed with a squad, fought through Cerberus troops, Atlas mechs and Nemesis
  snipers, and raised the buried artifact lift. Shepard recovered the stasis pod and
  revived its occupant: Javik, the last living Prothean, an "Avatar of Vengeance"
  and military commander from the final cycle of the war against the Reapers. Javik
  joined the Normandy as a squad member and living repository of Prothean history.
  In the parallel objective "Eden Prime: Resistance Movement," Shepard could gather
  three pieces of Cerberus intel from colony terminals, revealing that Cerberus had
  thinned its northern troops while faking strength, and that Dr. William Cambiata
  was a Cerberus mole inside the resistance whom Cerberus planned to let "escape" as
  a staged hero. Collecting all three drove Cerberus off Eden Prime and boosted the
  Eden Prime war asset; the objective became permanently unavailable once the lift
  was raised.
characters:
  - Commander Shepard
  - Javik
  - Liara T'Soni
  - William Cambiata
  - EDI
consequences:
  - Javik, the last living Prothean, was revived from stasis and joined Shepard's squad
  - Cerberus lost its Prothean research site on Eden Prime
  - The abduction of Eden Prime colonists by Cerberus was exposed
  - Gathering the resistance intel drove Cerberus off the colony and improved the Eden Prime war asset
  - Javik provided firsthand knowledge of the Protheans, the Reapers and the Crucible-era conflict
