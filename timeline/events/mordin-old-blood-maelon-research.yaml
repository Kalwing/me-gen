event_id: mordin-old-blood-maelon-research
title: 'Mordin: Old Blood - Maelon''s Genophage Cure Research'
game: Mass Effect 2
chronological_order: 1160
date: 2185 CE
summary: 'Aboard the Normandy SR-2, Mordin Solus asks Commander Shepard for help: Blood Pack mercenaries
  of Clan Weyrloc have captured Maelon Heplorn, the salarian geneticist and former STG operative who,
  as Mordin''s protege, helped him deploy the modified genophage on Tuchanka, and Mordin fears both for
  Maelon and for what the krogan might learn from him. Shepard''s squad fights through a Weyrloc-held
  hospital in Urdnot territory, past cages of dead and dying test subjects that include humans and a
  female krogan, and confronts Chief Weyrloc Guld. Among the captives is Urdnot Darg, a Clan Urdnot
  scout (Scout, Second Class) whom the Urdnot Chief Scout had asked Shepard to watch for; the Blood
  Pack had tricked him into becoming one of Maelon''s test subjects and poisoned him. Shepard can
  persuade Darg to return to the Urdnot camp or leave him behind; if convinced to leave, he later
  recovers, stays with the clan rather than joining the Blood Pack, and sends Shepard a grateful
  message. In a laboratory the squad finds Maelon alive and working -
  willingly, he insists - on a genophage cure, which he frames as atonement for what he calls a cultural
  genocide; he argues the genophage never made the galaxy less chaotic and that a larger krogan
  population might have helped stop Saren at Eden Prime, and Mordin dismisses this as speculation. Mordin
  is enraged and moves to execute his student; Shepard can let him kill Maelon or talk him down, in
  which case Maelon flees (advised to open a clinic on Omega) and Mordin is left shaken but resolved.
  Shepard then decides what to do with Maelon''s cure data: preserve it or destroy it (per `mordin_loyalty`).
  Completing the mission earns Mordin''s loyalty and ends Clan Weyrloc''s independent cure effort. The
  choice carries into Mass Effect 3: if the research was saved, Mordin (or Padok Wiks) uses it to stabilise
  the krogan female Eve so she survives the cure at Priority: Tuchanka; if it was destroyed, Eve dies
  of complications during that mission regardless of other choices. In Mass Effect 3 it is further
  revealed that some female krogan survived Maelon''s experiments and were held by STG on Sur''Kesh; if
  Mordin survived the Suicide Mission he leaked this to Clan Urdnot, forcing their release, and Maelon''s
  preserved research proved essential to finalising the cure. If spared, Maelon reopened his Omega
  clinic but went into hiding after Clan Weyrloc placed a bounty on him, and sent Shepard a grateful
  message if the genophage was cured. If Mordin died in the Suicide Mission with his loyalty mission
  incomplete, Maelon completed the cure himself, but gaps in his research left problems Padok Wiks
  could not fully account for.'
characters:
- Mordin Solus
- Maelon Heplorn
- Commander Shepard
- Weyrloc Guld
- Eve
- Padok Wiks
- Chaleen
- Urdnot Darg
consequences:
- Mordin becomes a loyal squad member
- Clan Weyrloc's captive genophage-cure project is destroyed and Maelon is freed or killed
- 'Per `mordin_loyalty`: Maelon''s cure research is either preserved or destroyed by Shepard'
- If the data is preserved, in Mass Effect 3 it is used to stabilise Eve so she survives the genophage
  cure on Tuchanka
- 'If the data is destroyed, Eve dies during Priority: Tuchanka no matter what'
- Mordin's confrontation with Maelon hardens his own guilt over the modified genophage
- Urdnot Darg, a captured Urdnot scout used as a test subject, can be freed to return to Clan Urdnot
- If spared, Maelon opens an Omega clinic, later goes into hiding under a Weyrloc bounty, and thanks
  Shepard by message if the genophage is cured
- Female krogan survivors of Maelon's experiments, held by STG on Sur'Kesh, are later revealed and
  freed if Mordin survives the Suicide Mission
