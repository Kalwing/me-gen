event_id: priority-mars
title: "Priority: Mars - the Prothean Archives and Dr. Eva"
game: Mass Effect 3
chronological_order: 1470
date: "2186 CE"
summary: |
  As the Reaper invasion overruns Earth, Admiral Hackett orders the Normandy to the
  Mars Archives to retrieve Prothean data that Liara T'Soni believes could help defeat
  the Reapers. The dig site is not answering hails. Shepard, Liara and the Virmire
  survivor (Ashley Williams or Kaidan Alenko) land to find Cerberus troops have seized
  the facility and murdered the research team. A security terminal identifies the mole:
  "Dr. Eva Coré," a scientist who joined the science team one week before the invasion,
  who has taken command of the Cerberus force and begun downloading and erasing the
  Prothean archive.

  The squad fights through Cerberus troopers, Centurions, Guardians, an autoturret and
  a tram battle to reach a chamber where Eva stands amid a projection of Crucible
  schematics. She disables the Virmire survivor with a kick, destroys the console and
  flees across the station to a Cerberus shuttle. James Vega rams the Normandy's
  shuttle into hers to stop the escape. From the wreck Eva rises revealed as a gynoid
  infiltration unit remotely controlled by the Illusive Man; she seizes the Virmire
  survivor by the helmet, contacts the Illusive Man, and critically injures them before
  turning on Shepard. Shepard draws a pistol and destroys the drone; if the shot comes
  too late, Eva kills Shepard with an omni-blade.

  On Shepard's order, Vega carries Eva's charred body back to the Normandy, where it is
  stored in the AI Core on Deck Three as the ship leaves Mars just ahead of the
  Reapers. The Virmire survivor is rushed to Huerta Memorial Hospital on the Citadel in
  critical condition. Studying the unit, EDI accidentally triggers its backup power and
  transfers herself into the repaired frame; after the Menae mission she walks out of
  the AI Core in Eva's body, giving EDI a mobile platform. Logs later found on Cronos
  Station show Eva was built as a successor to EDI, designed for absolute Cerberus
  loyalty rather than independent thought.
characters:
  - Commander Shepard
  - Eva Coré
  - Liara T'Soni
  - Ashley Williams
  - Kaidan Alenko
  - James Vega
  - EDI
  - The Illusive Man
  - Admiral Hackett
consequences:
  - Shepard recovers the Prothean data on the Crucible, launching the Crucible project
  - Cerberus is confirmed to be actively working against the war effort under the Illusive Man
  - "Per `virmire_survivor`: Ashley Williams or Kaidan Alenko is critically injured by Eva and hospitalised on the Citadel"
  - Eva's destroyed infiltration unit is taken to the Normandy
  - EDI transfers into Eva's repaired body, gaining a mobile platform and joining ground missions
  - The Normandy escapes Mars orbit moments before the Reapers arrive
