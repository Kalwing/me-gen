event_id: citadel-schells-the-gambler
title: "Citadel: Schells the Gambler"
game: Mass Effect
chronological_order: 490
date: "2183 CE"
summary: |
  Schells was a quirky salarian inventor who occasionally gambled at Flux, a club
  on the Citadel's lower Wards. Doran, Flux's owner, caught him using a concealed
  scanning device that emitted a signal to tamper with the quasar machines and
  slightly improve his odds, and had him thrown out for cheating. Schells
  protested that he was not really cheating: he had spent five years developing a
  sophisticated system to predict quasar outcomes, which he intended to sell for
  a fortune, and merely needed more data on winning hands to finish his
  algorithms. Encountering Shepard at the entrance to Flux after the assignment
  Citadel: Rita's Sister had begun, he asked the Commander to gather the last few
  quasar results for him, and would wait there until Shepard agreed.

  If Shepard accepted, the Commander could play the quasar machines with the
  scanner to collect the needed wins while evading the suspicious Doran, then
  return the device to Schells for a credit and experience reward. Alternatively,
  Shepard could hand the scanner over to Doran, who gave a comparable reward plus
  credits to "play a few rounds on the house"; Schells was left dismayed that
  five years of work were wasted, asking "What am I going to do now?", and was
  unimpressed by the squad's suggestions for better uses of his talents. Neither
  outcome carried a morality reward. In Mass Effect 3, Schells resurfaced on the
  Citadel's Silversun Strip, where he held high scores at the Castle Arcade.
characters:
  - Schells
  - Doran
  - Commander Shepard
consequences:
  - Per the player's choice, Schells either completes the data for his quasar-cheating system or has his scanner confiscated by Doran and his five-year project ruined
  - Shepard receives credits and experience from whichever party is given the device
  - Schells later reappears on the Silversun Strip in Mass Effect 3 as a Castle Arcade high scorer
