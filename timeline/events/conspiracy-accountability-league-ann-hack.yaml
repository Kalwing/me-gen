event_id: conspiracy-accountability-league-ann-hack
title: "Bernard Plim's Conspiracy Accountability League Hacks the Alliance News Network"
game: Mass Effect 3
chronological_order: 1810
date: "2186 CE"
summary: |
  Sometime in 2186, during the Reaper War, Bernard Plim, a self-proclaimed
  anti-conspiracy activist claiming twenty-three years of experience and the
  founder and president of the Conspiracy Accountability League, hijacked the
  Alliance News Network (ANN) to broadcast his claims to the wider galaxy. Plim
  operated through his personal blog, the seized @AllianceNewsNet feed, and his
  own @BernardPlim channel, repeatedly soliciting credits from readers while
  evading Citadel Security.

  Plim's central allegation was that Admiral Steven Hackett, the researcher Dr.
  Garret Bryson, and a secret group he called Task Force Aurora were covertly
  studying the Reapers and the so-called Leviathan of Dis, and that the Systems
  Alliance and the Citadel Council were concealing the program. As supporting
  evidence he cited the 2163 batarian discovery of a crashed starship on
  Jartar/Jatar that reportedly "disappeared" after a batarian dreadnought visited
  the site, alleged salarian surveillance footage, and a coffee-shop receipt that
  read "Bryson, Garneau - Leviathan discussion."

  C-Sec traced and shut down the hijacked broadcast and arrested Plim. He was
  subsequently released and vowed to continue his investigation. Though presented
  as the ranting of a fringe activist, Plim's core claim was essentially accurate:
  Task Force Aurora was a real Alliance black project, and Hackett soon ordered
  Commander Shepard to assist Bryson's investigation, which led Shepard to the
  living Leviathans on 2181 Despoina. The broadcast was a BioWare promotional
  alternate-reality campaign for the Mass Effect 3: Leviathan DLC. Plim later
  appears as a name on the Armax Arsenal Arena and Castle Arcade leaderboards seen
  in the Citadel DLC.
characters:
  - Bernard Plim
  - Steven Hackett
  - Dr. Garret Bryson
  - Dr. Alex Garneau
consequences:
  - The existence of the secret Task Force Aurora and its Reaper/Leviathan research is publicly alleged
  - The Alliance News Network is briefly hijacked before C-Sec restores control
  - Bernard Plim is arrested by C-Sec, then released, and pledges to keep investigating
  - Public rumor of a being powerful enough to kill a Reaper spreads ahead of Shepard's own Leviathan hunt
  - Plim's claims prove largely correct, foreshadowing the Leviathan investigation
