event_id: grunt-recruitment-korlus
title: "Dossier: The Warlord - Okeer and Grunt Recruitment"
game: Mass Effect 2
chronological_order: 1130
date: "2185 CE"
summary: |
  Dr. Okeer, a brilliant but brutal krogan warlord who fought in the devastating Krogan Rebellions, operates from a hidden research facility on the colony world of Korlus. Obsessed with saving the krogan species from the genophage—a salarian-engineered bioweapon that cripples krogan reproduction and dooms their civilization—Okeer has devoted his life to finding a cure or workaround. In his desperation, he has made contact with the Collectors, seeking their advanced technology to augment krogan genetics.

  Okeer's facility is disguised as a Blue Suns military installation under the command of Jedore. Commander Shepard fights through waves of Blue Suns forces (Troopers, Legionnaires, Centurions, and heavy weapons specialists) to breach the research center. Inside the facility, Shepard discovers the horrifying truth: Okeer has been mass-producing tank-bred krogan clones, flash-indoctrinating them to be loyal soldiers, and using experimental Collector technology to accelerate their physical development. The rejects—krogan only seven days old but fully mature—are supplied to Jedore as a private army, effectively enslaving them.

  One "Tank-Grown Krogan" encounters Shepard's team and, recognizing that the Commander is powerful, allows passage deeper into the facility as a sign of grudging respect. Inside the research chamber, Shepard confronts both Okeer and the revelation that Rana Thanoptis (if spared during the Virmire mission in Mass Effect 1) is present and flees upon seeing Shepard, knowing that the Commander would recognize her involvement with Saren's research.

  Okeer attempts to negotiate his survival by offering his knowledge of the Collectors in exchange for escape. However, Jedore announces over the facility's PA system that Okeer has released the tank-bred krogan without authorization and begins pumping krogan-killing toxins into the facility to prevent them from becoming uncontrollable. Okeer chooses to remain behind to protect his greatest creation—a "perfect" krogan specimen being developed in a advanced stasis tank. As the toxins overcome him, Okeer's final recorded message asks Shepard to protect his legacy, admitting that he did not know what the Collectors truly planned for human colonists.

  Shepard defeats Jedore (who wields a rocket launcher and a YMIR Mech), recovers Okeer's perfect krogan specimen in its stasis tank, and escapes the facility. The krogan in the tank is later released aboard the Normandy SR-2 in a separate mission ("Dr. Okeer's Legacy"). When freed, the krogan—named Grunt—slams Shepard against a wall in an aggressive display before being calmed. Grunt impresses Shepard with his raw power and agrees to join the team after recognizing the Commander's strength. Grunt becomes one of the most formidable assets for the suicide mission. If Grunt is never released from his tank, he will not appear in Mass Effect 3; if he is released and survives the suicide mission, he later leads a krogan commando unit investigating a resurgent rachni threat.
characters:
  - Dr. Okeer
  - Grunt (tank-bred krogan)
  - Commander Shepard
  - Jedore (Blue Suns commander)
  - Rana Thanoptis (optional encounter)
  - Tank-bred krogan rejects
  - Collector forces
  - Blue Suns mercenaries
consequences:
  - Dr. Okeer is killed in the toxic gas that he deployed
  - Jedore is defeated and killed
  - The krogan research facility is destroyed
  - All tank-bred krogan rejects are either killed or released
  - Okeer's "perfect" krogan specimen is recovered in stasis tank
  - Grunt is later released and joins Shepard's team
  - Grunt becomes a powerful melee and combat asset
  - Grunt becomes available for the suicide mission
  - If Grunt survives the suicide mission, he leads krogan forces in Mass Effect 3
  - Okeer's genophage research data is potentially preserved on the Normandy
