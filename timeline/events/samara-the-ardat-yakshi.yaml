event_id: samara-the-ardat-yakshi
title: "Samara: The Ardat-Yakshi - The Hunt for Morinth on Omega"
game: Mass Effect 2
chronological_order: 1110
date: "2185 CE"
summary: |
  After several personal conversations aboard the Normandy SR-2, the asari justicar
  Samara asks Commander Shepard for help completing the mission that made her a
  justicar four centuries earlier: killing her fugitive eldest daughter, Morinth, an
  Ardat-Yakshi who murders her partners by melding minds with them and grows stronger
  with each kill. Following the lead of the AML Demeter, the trail ends on Omega, where
  Morinth has seduced and killed a young human sculptor named Nef. Shepard and Samara
  investigate Nef's death with the help of her grieving mother Diana, recover Nef's
  diary and personal effects, and profile Morinth's tastes - a specific style of
  music, art, drugs, and violent thrill-seeking. Shepard poses as bait in the VIP
  lounge of the Afterlife club, displaying those tastes to draw Morinth's attention,
  then accompanies her to her apartment. As Morinth begins to dominate Shepard's mind,
  Samara bursts in and the two asari lock together in a biotic duel, fighting as
  equals while pinned in place.

  The outcome is choice-conditional (per `samara_loyalty`). Shepard must break the
  deadlock. If Shepard resists Morinth's mental hold - which requires a high
  Paragon or Renegade score - Shepard chooses which asari to help kill. Siding with
  Samara ends with Samara snapping Morinth's neck; Samara survives, remains loyal to
  Shepard, and can later return in Mass Effect 3. Siding with Morinth ends with
  Morinth killing Samara; Morinth then joins the squad, impersonating her mother
  under Samara's name and armour. Crew members such as Kelly Chambers and Kasumi Goto
  sense something wrong, and in her quarters Morinth disables EDI's surveillance and
  speaks in her true voice, resenting Samara's loveless, duty-bound upbringing. If
  Shepard fails the willpower check, Morinth kills Shepard outright. Either surviving
  asari can die later in the Suicide Mission.
characters:
  - Samara
  - Morinth
  - Commander Shepard
  - Nef
  - Diana (Nef's mother)
  - Kelly Chambers
  - Kasumi Goto
  - Aria T'Loak
  - EDI
consequences:
  - "Per `samara_loyalty`: Shepard helps Samara kill Morinth, or helps Morinth kill Samara"
  - The Ardat-Yakshi Shepard's squad confronts is killed; her body cannot be recovered for study
  - If Samara lives, she stays loyal to Shepard and may return as a war asset in Mass Effect 3, appearing at the Ardat-Yakshi Monastery on Lesuss
  - If Samara dies, Morinth joins the Normandy crew disguised as her mother
  - If Samara was killed, a surviving Morinth emails Shepard a "belated goodbye" in Mass Effect 3 and can appear as a Reaper-made Banshee during the assault on Earth
  - Morinth's murder of the sculptor Nef on Omega is solved, giving Nef's mother closure
  - Completing the mission secures the loyalty of whichever asari survives
  - Romancing and mating with Morinth after the Suicide Mission kills Shepard, disproving her claims
