event_id: talitha-dock-422-hostage-crisis
title: "Talitha's Standoff at Citadel Dock 422"
game: Mass Effect
chronological_order: 520
date: "2183 CE"
summary: |
  Talitha was a human woman taken by batarian slavers during the 2170s raid on the
  colony Mindoir - the same raid that, in the Colonist background, killed Commander
  Shepard's family. Six years old when her parents were incinerated in front of her,
  she survived by playing dead, was thrown into the slaver holding pens, and had a
  control device implanted in her skull. Over thirteen years of captivity she was
  branded with batarian symbols without anaesthetic, worked as manual labour, abused,
  and conditioned to call herself and other humans "animals" with no names. When
  Alliance marines finally raided the encampment and killed her captors, she was so
  broken that she tried to help her dying masters.
  Resettled and eventually drifting to the Citadel, Talitha suffered a breakdown. In
  2183 she barricaded herself at Dock 422 with a pistol, speaking of herself only in
  the third person and threatening to kill herself. C-Sec Lieutenant Girard, unable to
  reach her and unwilling to risk a rush, called in Commander Shepard, positioning a
  sniper as a fallback. Shepard could coax Talitha through her history and diagnose
  what amounted to Stockholm syndrome: she believed her suffering had happened to some
  other, more unfortunate girl, and that other humans saw her only as a damaged animal.
  Told that Shepard was also a Mindoir survivor, she first called Shepard a liar, then
  asked why Shepard had not been broken as she was.
  The encounter branched on Shepard's approach. Advancing too fast, or pushing too
  hard, drove Talitha to shoot herself. With patient, careful persuasion Shepard could
  get her to confront her past, accept a sedative, and be taken to a psychiatric
  facility. Alternatively Shepard could judge her an unacceptable danger and order
  Girard's sniper to kill her. In 2185, if Shepard had the Colonist origin and Talitha
  had been talked down, she emailed Shepard a message titled "Thanks," reporting that
  her doctors - one with Cerberus ties - had placed her in a special school and were
  helping her recover, and hoping Shepard could rescue others like her.
characters:
  - Talitha
  - Commander Shepard
  - Girard
consequences:
  - Talitha either shoots herself, is shot by Girard's sniper on Shepard's order, or is sedated and committed to a psychiatric facility
  - If sedated and Shepard has the Colonist background, Talitha later emails Shepard in 2185 reporting she is recovering in a Cerberus-linked care programme
  - The encounter reinforces the human cost of the batarian slave raids on the Traverse colonies and of the Mindoir raid in particular
