event_id: jarrod-crush-ambush-hollows
title: "Jarrod's Betrayal at the Hollows"
game: Mass Effect
chronological_order: 70
date: "approx. 800 CE"
summary: |
  In the generations after the Krogan Rebellions and the turian counterattack, the
  krogan warlord Jarrod was one of the few war leaders to survive. He carried a
  permanent grudge against the Citadel races for the devastation of the genophage
  and wanted the tribes he led to keep fighting regardless of cost. His rage
  blinded him to the demographic collapse the genophage had caused: with viable
  births reduced to roughly one in a thousand, continued war meant extinction.

  Other krogan leaders, including Jarrod's own son Wrex of Clan Urdnot, refused the
  call to war. Wrex argued that the species could only survive if it abandoned
  revenge and devoted at least one full generation to breeding and recovering its
  numbers. Insulted by his son's position, Jarrod called a Crush - a parley on
  neutral ground - and set it at the ancestral burial grounds of the Hollows,
  sacred ground where violence was forbidden. There he first tried to talk Wrex and
  the other peace-seeking leaders around to his cause. When it became clear they
  would not be moved, Jarrod gave a signal and his men, who had been hidden among
  the graves, sprang an ambush. Most of Wrex's allies were cut down almost
  immediately. Wrex fought his father hand to hand and killed him, driving a dagger
  into Jarrod's chest before fighting his way clear.

  The betrayal by his own father, and Jarrod's willingness to defile the Hollows to
  pursue a blood feud, showed Wrex how completely the fatalistic "dying race"
  mindset had consumed his people. Disgusted, Wrex left his home system and became
  one of the countless krogan who drifted the galaxy as mercenaries and bounty
  hunters - the path that eventually brought him to the Citadel and to Commander
  Shepard.
characters:
  - Jarrod
  - Urdnot Wrex
consequences:
  - Jarrod is killed by his son Wrex at the Hollows
  - Most of the peace-seeking krogan leaders who attended the Crush are slaughtered
  - The Hollows burial ground is desecrated by Jarrod's ambush
  - Wrex loses faith in krogan society and leaves his home system
  - Wrex becomes a wandering mercenary and bounty hunter for centuries
  - Wrex's disillusionment shapes his later drive to reform the krogan and cure the genophage
