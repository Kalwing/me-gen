event_id: rachni-wars
title: The Rachni Wars
game: Mass Effect
chronological_order: 20
date: "approx. 1 CE - 300 CE"
summary: |
  The Rachni Wars were a series of conflicts that began around 1 CE, when a Citadel
  Council expedition of salarian explorers activated a dormant mass relay and opened a
  route into territory held by the rachni, a hive-minded species of highly intelligent
  space-faring insects. The rachni captured the explorers and, drawing on element zero
  research gathered from Kashshaptu, reverse-engineered the FTL drives of the captured
  starships. They built FTL fleets of their own and expanded explosively into the
  galaxy. Negotiation proved impossible: the rachni were guided by queens who dwelt in
  deep underground nests on worlds too hostile for outsiders to survive, and no one
  could reach them. The Citadel races concluded the rachni were irredeemably hostile
  and could be stopped only by war, but the rachni's overwhelming numbers pushed
  Council defenses back for nearly a century.

  To turn the tide, the salarians "culturally uplifted" the primitive krogan around
  80 CE. The krogan homeworld Tuchanka had been ruined by nuclear winter from an
  atomic civil war; the salarians gave the krogan advanced technology, built the
  Shroud tower to shield the planet from radiation, and relocated krogan populations
  to a habitable world. The true purpose soon emerged: the krogan's rapid breeding
  cycle and physical toughness made them ideal reinforcements able to endure the
  lethal conditions of the rachni worlds. Krogan forces drove the rachni back, struck
  at the queens in their lairs, and reclaimed conquered Council worlds. When krogan
  fleets pushed the rachni back to their homeworld Suen and the rachni refused to
  surrender, the krogan bombarded Suen's cities and detonated powerful bombs in the
  underground nests, obliterating the species and leaving massive sinkholes. In 300 CE
  the rachni were declared extinct, though the Council left a listening post in the
  home system to watch for survivors and afterward prohibited activating dormant
  relays into uncharted space.

  It is postulated that an outside party manipulated the rachni into war. The Rachni
  Queen later encountered on Noveria described hearing "oily shadows" and a "tone from
  space" that forced the singers to resonate with its "sour, yellow note," language
  reminiscent of Reaper indoctrination; Dr. Garret Bryson instead speculated the
  Leviathan was responsible, though ancient rachni bore no Reaper cybernetics.
characters:
  - Citadel Council
  - Salarian Union
  - krogan
  - rachni
  - Rachni Queen
consequences:
  - The rachni are driven to apparent extinction and declared extinct in 300 CE
  - The krogan are uplifted by the salarians and given a new homeworld in gratitude for their service
  - The Shroud tower is built on Tuchanka during the krogan uplift
  - The unchecked post-war krogan population boom leads directly to the Krogan Rebellions
  - The Citadel establishes the Office of Special Tactics and Reconnaissance amid concern over krogan expansion
  - A Citadel listening post is left in the rachni home system to monitor for survivors
  - The Council bans activation of dormant relays leading to uncharted systems
  - Cryo-suspended rachni eggs aboard a vessel that fled the war survive, later recovered by Binary Helix
