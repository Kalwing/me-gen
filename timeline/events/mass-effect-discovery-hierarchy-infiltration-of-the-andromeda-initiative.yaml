event_id: mass-effect-discovery-hierarchy-infiltration-of-the-andromeda-initiative
title: "Mass Effect: Discovery — Turian Hierarchy Infiltration of the Andromeda Initiative"
game: Mass Effect 3
chronological_order: 1320
date: "approx. 2185 CE"
summary: |
  As the privately funded Andromeda Initiative prepared its arks and the Nexus for a
  centuries-long journey out of the Milky Way, the Turian Hierarchy grew suspicious that
  the venture might be a cover for building a large private military force, and that it
  might be using technology derived from forbidden geth research. Admiral Ravis Kandros,
  a senior Hierarchy official of the prominent Kandros family, convened a closed meeting
  of Hierarchy officials with her son, Lieutenant Tiran Kandros of the Sagirus Eight
  counter-terrorism division. Commander Narkkin dismissed the concern as a mother pulling
  favors and pushed for direct intervention; Ravis and Tiran instead persuaded the group
  to let Tiran covertly infiltrate the Initiative as a prospective recruit and gather
  evidence first.

  Working through encrypted channels to Ravis's intelligence resources, Tiran pursued a
  missing quarian Initiative scientist, Shio'Leth vas Novarra, whose method of computing
  colonization paths to Andromeda had been found flawed, obtaining coordinates for the
  ship Novarra. His investigation drew in the dangerous ex-STG salarian Agent Zeta, and
  led him to Omega, where Aria T'Loak briefly biotically throttled him as a suspected
  saboteur until her partner Nyreen Kandros vouched for her cousin. After Zeta escaped
  Omega, the Hierarchy declared Tiran AWOL for gross dereliction of duty; Ravis warned
  he would be arrested if he continued, but he saw the mission through.

  Tiran ultimately turned himself in to the Hierarchy. Ravis and the two other officials
  from the original meeting sat as judges at his trial; having declared himself guilty,
  he was discharged without honor, effective immediately. Freed of his commission, Tiran
  chose to join the Andromeda Initiative for real. Ravis, who had initially wanted him to
  remain a civilian contractor, came to accept his decision and embraced him before his
  departure with the Initiative.
characters:
  - Tiran Kandros
  - Ravis Kandros
  - Narkkin
  - Agent Zeta
  - Shio'Leth vas Novarra
  - Aria T'Loak
  - Nyreen Kandros
consequences:
  - The Turian Hierarchy confirms, through Tiran's evidence, the true nature and scope of the Andromeda Initiative
  - Tiran Kandros is declared AWOL, tried, and discharged from Hierarchy service without honor
  - Tiran Kandros joins the Andromeda Initiative as a genuine recruit and departs the Milky Way with it
  - Agent Zeta escapes pursuit after the confrontation on Omega
  - Establishes the Kandros family link between Nyreen Kandros (later of Omega) and Tiran Kandros (later head of Nexus security)
