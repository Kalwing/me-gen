event_id: cerberus-agent-rasa-shepard-dossiers
title: "Cerberus Agent Rasa: The Shepard Dossiers and the Clone Theft"
game: Mass Effect 2
chronological_order: 890
date: "2184 CE"
summary: |
  Rasa (later known as Maya Brooks) was a Cerberus field agent raised from
  childhood as a pickpocket by an abusive handler named Brocktun, whom she
  eventually stabbed to death; the experience left her determined never to be
  owned by anyone, Cerberus included. As told across the comic series Mass
  Effect: Foundation, her intelligence work became central to the Lazarus
  Project, Cerberus's secret effort to rebuild Commander Shepard's body after
  Shepard was killed over Alchera. Much of the archive Miranda Lawson's team
  used to reconstruct Shepard came from Rasa's dossiers.

  After Rasa and the assassin Kai Leng failed to retrieve Subject Zero (Jack),
  the Illusive Man refused their apologies. Miranda then assigned Rasa to steal
  Shepard's classified Spectre files from the Spectre offices on the Citadel,
  giving her a disc of outdated Cerberus secrets to trade to the Spectre Tela
  Vasir for access. Posing as a Cerberus defector with a blonde wig and
  lightened skin, Rasa met Vasir, who took the disc, grew suspicious, doubled
  back with guards, and caught Rasa downloading the Shepard files. Vasir stripped
  her disguise, took her prints and DNA, and blackmailed her: prison, or deliver
  the files to the Illusive Man carrying a virus meant to force him to meet
  Vasir's demands. Leaving a bar afterward, Rasa was drugged and marked for death
  by mistake; the assassin Thane Krios, having been misinformed about her,
  relented when she said she had never truly lived, apologized, and carried her
  to safety. Rasa reached Minuteman Station and warned Miranda, who extracted the
  data and countered the virus. Pleased, the Illusive Man ended Rasa's field
  career but gave her a new task: compiling the dossiers on Shepard's prospective
  Mass Effect 2 squad.

  In 2184, learning the clone project was to be terminated, Rasa moved to steal
  Shepard's backup clone from the Lazarus Research Station and defect. Aided by a
  planted virus that crippled the station's mainframe and hijacked its camera
  feeds, and by LOKI and YMIR mechs that switched to her side, she seized the
  clone's tank, killed the agents who recognized her, and escaped by Kodiak
  shuttle despite a sniper wound inflicted by Miranda. At the postmortem debrief
  the Illusive Man ordered Miranda to send no retrieval team, deeming Rasa and
  the clone irrelevant beside the coming of the Reapers and the real Shepard. At
  a hidden location Rasa vowed to make the clone superior to the original.
characters:
  - Rasa
  - Miranda Lawson
  - The Illusive Man
  - Kai Leng
  - Tela Vasir
  - Thane Krios
  - Commander Shepard
consequences:
  - Rasa's intelligence dossiers underpin the Lazarus Project's reconstruction of Shepard
  - Rasa steals Shepard's classified Spectre files from the Citadel but is caught and blackmailed by Tela Vasir
  - Vasir's virus is intercepted and neutralized by Miranda; Cerberus's interest in Shepard is exposed to the Spectres
  - Thane Krios spares Rasa's life after being misinformed she was a target
  - The Illusive Man ends Rasa's field career and assigns her to compile the Mass Effect 2 squad dossiers
  - In 2184 Rasa steals Shepard's backup clone from the Lazarus Research Station and defects from Cerberus
  - The Lazarus Station's mechs, security feeds and systems are sabotaged; multiple Cerberus staff are killed
  - The Illusive Man declines to pursue Rasa or the clone, which later resurfaces in the Citadel DLC identity-theft plot
