event_id: drell-rescue-kahje
title: "Drell Rescue and Settlement on Kahje"
game: Mass Effect 1
chronological_order: 100
date: "approx. 1980s CE"
summary: |
  The drell are a reptile-like species native to the arid, rocky desert world of Rakhana. By the 1380s CE, rapid industrial expansion of drell civilization caused severe environmental degradation and resource depletion, accelerating the planet toward lifelessness. The drell population swelled to approximately eleven billion inhabitants with no viable interstellar flight capability, leaving them trapped on their dying world as industrial collapse and resource wars began to ravage their civilization. Billions of drell faced certain death through starvation and conflict as their homeworld became increasingly uninhabitable.

  First contact between the drell and the hanar, an advanced aquatic civilization, occurred around the 1980s CE. The hanar, moved by the drell's desperate plight, negotiated a rescue mission. Over the following decade, hanar vessels transported approximately 375,000 drell survivors from Rakhana to Kahje, the hanar's humid ocean homeworld. The vast majority of the drell population—billions of inhabitants—were left behind on Rakhana, where they perished in the continuing resource wars and environmental collapse.

  On Kahje, the drell faced a new set of challenges. The planet's humid climate, optimal for the aquatic hanar, was foreign and often lethal to the drell, whose evolutionary history on Rakhana's arid deserts had not prepared them for such conditions. Drell required climate-controlled dome cities to survive, and the leading cause of drell death on Kahje became Kepral's Syndrome—an incurable, noncommunicable degradation of the lungs caused by long-term exposure to the planet's high humidity. Despite these hardships, the drell integrated into galactic civilization and developed a complex cultural relationship with their hanar saviors.

  The drell formalized their gratitude to the hanar through the Compact—a cultural and social agreement that obligated drell to fulfill difficult tasks and combat roles in service of hanar interests. Service under the Compact is considered a great honor among drell and is rarely refused. The drell adopted a deeply religious worldview, worshipping a polytheistic pantheon including Amonkira (Lord of Hunters), Arashu (Goddess of Motherhood and Protection), and Kalahira (Goddess of Oceans and Afterlife). Most drell lived contentedly on Kahje as respected citizens, though some ventured into the wider galaxy as solitary adventurers, often adopting the cultures and languages of other species. This historical rescue set the stage for drell participation throughout the trilogy, including the recruitment of individuals like the legendary assassin Thane Krios.
characters:
  - The Hanar (rescuer species)
  - The Drell (rescued species)
  - Drell survivors from Rakhana
  - Remaining Rakhana drell (perished)
consequences:
  - Approximately 375,000 drell rescued from Rakhana
  - Billions of drell left on Rakhana perish in resource wars
  - Drell establish permanent settlement on Kahje
  - The Compact is formalized between drell and hanar
  - Drell develop distinct cultural identity under hanar mentorship
  - Kepral's Syndrome emerges as endemic threat to drell on Kahje
  - Drell become integrated into galactic civilization
  - Drell develop strong religious and spiritual traditions
  - Drell become available as warriors, assassins, and combat specialists
  - Foundation laid for drell military service during Reaper War
